</svg><figcaption>Checked exceptions must be caught or declared with <code>throws</code>; unchecked ones (RuntimeException and Error) don't.</figcaption></figure>
:::

```java
// a checked exception must be declared or caught
String readFirstLine(String path) throws IOException {
    try (BufferedReader r = new BufferedReader(new FileReader(path))) {   // try-with-resources closes r
        return r.readLine();
    }
}
```

## The exceptions you'll actually see

| Exception | Typical cause in DSA code | Fix |
|---|---|---|
| `NullPointerException` | `node.next` when node is null; unboxing a missing map value | null checks first; `getOrDefault` |
| `ArrayIndexOutOfBoundsException` | `a[n]`, `a[-1]`, neighbours off the grid edge | check `0 <= i < n` before indexing |
| `StringIndexOutOfBoundsException` | `s.charAt(s.length())`, bad `substring` bounds | same |
| `IndexOutOfBoundsException` | `list.get(list.size())` | same |
| `ArithmeticException: / by zero` | integer division or `%` by zero | guard the divisor |
| `NoSuchElementException` | `deque.pop()` / `removeFirst()` / `iterator.next()` on empty | check `isEmpty()`, or use `poll()` (returns null) |
| `ConcurrentModificationException` | adding/removing while iterating a collection with for-each | iterate a copy, use an index, `Iterator.remove`, or `removeIf` |
| `ClassCastException` | casting to the wrong type | `instanceof` first |
| `NumberFormatException` | `Integer.parseInt("12a")` | validate input |
| `UnsupportedOperationException` | `add` to a `List.of(...)` or `Arrays.asList(...)` list | copy into `new ArrayList<>(...)` |
| `StackOverflowError` | recursion too deep or with no base case | base case; iterate with an explicit stack |
| `OutOfMemoryError` | huge arrays (e.g. `new int[1_000_000_000]`) | smaller state, rolling DP arrays |

## Reading a stack trace

```output
Exception in thread "main" java.lang.NullPointerException: Cannot read field "next" because "fast" is null
    at Solution.hasCycle(Solution.java:7)
    at Main.main(Main.java:12)
```

Read the **first line** (what went wrong, and often which variable), then the **first frame** (`Solution.java:7`: the exact line). Lines below show who called it.

:::quiz
Q: In this code, does "done" print? `try { return 1; } finally { System.out.println("done"); }`
- [x] Yes: finally runs before the method actually returns
- No: return exits immediately
- Only if an exception is thrown
- It doesn't compile
> `finally` always runs when control leaves the try block, whether by normal completion, return, break or an exception (unless the JVM exits).
:::

:::quiz
Q: `Deque<Integer> st = new ArrayDeque<>(); st.pop();` What happens?
- Returns null
- Returns 0
- [x] Throws NoSuchElementException
- Throws NullPointerException
> `pop()` (like `removeFirst()`) throws on an empty deque. `poll()` and `peek()` return `null` instead.
:::
</script>
<script type="text/x-jc" id="m-lambdas" data-part="Part 3 · Object-oriented Java" data-title="Lambdas, comparators and streams" data-short="Lambdas &amp; comparators" data-lede="Functional interfaces, lambda syntax, method references, `Comparable` vs `Comparator`, writing comparators that don&#x27;t overflow, and the handful of stream operations DSA code uses.">
## Lambdas

A **lambda** is a short anonymous function. It can be used wherever Java expects a **functional interface**: an interface with exactly one abstract method, such as `Comparator`, `Runnable` or `Function`.

```java
(a, b) -> a - b                      // two parameters, an expression body
x -> x * 2                           // one parameter: parentheses optional
() -> System.out.println("hi")       // no parameters
(int[] a, int[] b) -> { int d = a[0] - b[0]; return d; }   // explicit types, block body with return
```

Under the hood, `(a, b) -> Integer.compare(a[0], b[0])` is shorthand for an object implementing `Comparator<int[]>` whose `compare` method has that body. Before Java 8 you'd write an **anonymous class**, which you may still see in older solutions:

```java
Collections.sort(list, new Comparator<int[]>() {
    @Override public int compare(int[] a, int[] b) { return a[0] - b[0]; }
});
```

A lambda can read local variables from the enclosing method only if they're **effectively final** (never reassigned). That's why counters in lambdas use a one-element array or a field.

### Common functional interfaces

| Interface | Method | Shape | Example |
|---|---|---|---|
| `Comparator<T>` | `compare(a, b)` | (T, T) → int | `(a, b) -> a.len - b.len` |
| `Function<T, R>` | `apply(t)` | T → R | `s -> s.length()` |
| `Predicate<T>` | `test(t)` | T → boolean | `x -> x % 2 == 0` |
| `Consumer<T>` | `accept(t)` | T → void | `x -> System.out.println(x)` |
| `Supplier<T>` | `get()` | () → T | `() -> new ArrayList<>()` |

### Method references

`Class::method` is shorthand for a lambda that just calls one method:

```java
list.forEach(System.out::println);         // x -> System.out.println(x)
map.computeIfAbsent(k, key -> new ArrayList<>());
Arrays.stream(words).map(String::length)   // s -> s.length()
```

## Comparable vs Comparator

| | `Comparable<T>` | `Comparator<T>` |
|---|---|---|
| Defines | the **natural** order, inside the class | an **external** order, passed in |
| Method | `a.compareTo(b)` | `cmp.compare(a, b)` |
| Used by | `Arrays.sort(objs)`, `TreeMap`, `PriorityQueue` with no comparator | `Arrays.sort(a, cmp)`, `new PriorityQueue<>(cmp)` |
| Examples | `Integer`, `String`, `LocalDate` | lambdas, `Comparator.comparingInt(...)` |

Both return **negative** if the first argument should come first, **positive** if the second should, and **0** for a tie.

:::viz comparator

## Writing comparators

```java
// sort int[] rows (intervals, edges, points)
Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0]));     // by start
Arrays.sort(points, (a, b) -> a[0] != b[0] ? Integer.compare(a[0], b[0])
                                           : Integer.compare(a[1], b[1]));   // tie-break
// sort objects with builder methods
people.sort(Comparator.comparingInt((Person p) -> p.age)
                      .thenComparing(p -> p.name));
words.sort(Comparator.comparing(String::length).reversed());
// priority queues
PriorityQueue<Integer> minHeap = new PriorityQueue<>();
PriorityQueue<Integer> maxHeap = new PriorityQueue<>(Comparator.reverseOrder());
PriorityQueue<int[]> byDist = new PriorityQueue<>((a, b) -> Integer.compare(a[1], b[1]));
// a class with a natural order
class Task implements Comparable<Task> {
    int priority;
    public int compareTo(Task o) { return Integer.compare(priority, o.priority); }
}
```

> **Trap:** `(a, b) -> a - b` is common and fine for small values, but `a - b` overflows when the values can be near ±2³¹ (for example `Integer.MIN_VALUE`, or coordinates up to 2 × 10⁹). `Integer.compare(a, b)` never overflows. For `long` values use `Long.compare`, and for doubles `Double.compare`.

## Streams (just enough)

Streams process sequences declaratively. DSA solutions use them sparingly, mostly for one-liners:

```java
int sum = Arrays.stream(nums).sum();
int max = Arrays.stream(nums).max().getAsInt();
List<Integer> list = Arrays.stream(nums).boxed().collect(Collectors.toList());   // int[] → List<Integer>
int[] back = list.stream().mapToInt(Integer::intValue).toArray();                // List<Integer> → int[]
Integer[] boxed = Arrays.stream(nums).boxed().toArray(Integer[]::new);           // to sort with a comparator
String joined = list.stream().map(String::valueOf).collect(Collectors.joining(","));
List<String> sorted = words.stream().sorted().toList();                          // Java 16+
long evens = Arrays.stream(nums).filter(x -> x % 2 == 0).count();
```

`boxed()` turns an `IntStream` (primitives) into a `Stream<Integer>` (objects), which you need before collecting into a `List` or sorting with a comparator.

> **Note:** Streams are elegant but slower than plain loops, and harder to debug. In interviews, a loop is always acceptable; use streams for short, obvious transformations.

:::quiz
Q: Which comparator sorts `int[][] pairs` by the second element, in descending order?
- `(a, b) -> a[1] - b[1]`
- [x] `(a, b) -> Integer.compare(b[1], a[1])`
- `(a, b) -> Integer.compare(a[0], b[0])`
- `Comparator.reverseOrder()`
> Swapping the arguments reverses the order. `Comparator.reverseOrder()` only works for types with a natural order, and `int[]` has none.
:::

:::quiz
Q: What does `new PriorityQueue<Integer>(Comparator.reverseOrder())` give you?
- A min-heap
- [x] A max-heap: `poll()` returns the largest element
- A queue sorted on every insertion
- A compile error
> PriorityQueue is a min-heap by its comparator. Reversing the natural order makes the largest value come out first.
:::
</script>
<script type="text/x-jc" id="m-lists" data-part="Part 4 · Collections" data-title="The Collections framework and Lists" data-short="Lists" data-lede="How the collection interfaces fit together, `ArrayList` in depth, `LinkedList`, iterating and removing safely, immutable lists, and the `Collections` helpers.">
## The map of the framework

:::html
<figure class="fig"><svg viewBox="0 0 680 250" role="img" aria-label="Collections framework: Collection splits into List, Set and Queue/Deque with their implementations; Map is a separate hierarchy.">

<rect class="s-acc" x="200" y="80" width="120" height="32" rx="8"/><text class="s-t" x="260" y="101" text-anchor="middle">Set</text>

<rect class="s-spec" x="560" y="10" width="110" height="32" rx="8"/><text class="s-t" x="615" y="31" text-anchor="middle">Map&lt;K,V&gt;</text>

<text class="s-tA" x="80" y="140" text-anchor="middle">ArrayList ★</text><text class="s-ts" x="80" y="158" text-anchor="middle">LinkedList</text>
<text class="s-tA" x="260" y="140" text-anchor="middle">HashSet ★</text><text class="s-ts" x="260" y="158" text-anchor="middle">LinkedHashSet</text><text class="s-ts" x="260" y="176" text-anchor="middle">TreeSet (sorted)</text>
<text class="s-tA" x="440" y="140" text-anchor="middle">ArrayDeque ★</text><text class="s-ts" x="440" y="158" text-anchor="middle">PriorityQueue ★</text><text class="s-ts" x="440" y="176" text-anchor="middle">LinkedList</text>
<text class="s-tS" x="615" y="70" text-anchor="middle">HashMap ★</text><text class="s-ts" x="615" y="88" text-anchor="middle">LinkedHashMap</text><text class="s-ts" x="615" y="106" text-anchor="middle">TreeMap (sorted)</text>
<text class="s-tl" x="340" y="230" text-anchor="middle">★ = what DSA solutions reach for first. Declare with the interface, create with the class.</text>
</svg><figcaption>Interfaces (List, Set, Queue, Deque, Map) describe behaviour; classes (ArrayList, HashSet…) are the implementations.</figcaption></figure>
:::

Every collection shares a few methods from `Collection`: `size()`, `isEmpty()`, `add(e)`, `remove(o)`, `contains(o)`, `clear()`, `addAll(other)`, `stream()`, and they can all be iterated with for-each.

## ArrayList

An `ArrayList` is a **resizable array**: fast index access, fast appends, slow inserts in the middle.

:::viz arraylist

```java
List<Integer> list = new ArrayList<>();
list.add(5);                 // append                      O(1) amortised
list.add(0, 9);              // insert at index 0 (shifts)  O(n)
list.get(1);                 // read by index               O(1)
list.set(1, 7);              // replace                     O(1)
list.remove(list.size() - 1);// remove last                 O(1)
list.remove(0);              // remove FIRST element        O(n): everything shifts
list.remove(Integer.valueOf(7));   // remove the VALUE 7     O(n)
list.contains(7);  list.indexOf(7);   // linear search     O(n)
list.size();  list.isEmpty();
list.subList(1, 3);          // a view of [1, 3)
Collections.sort(list);  list.sort(null);  list.sort(Comparator.reverseOrder());
List<int[]> pairs = new ArrayList<>();           // a list of int[] tuples
List<List<Integer>> result = new ArrayList<>();  // the classic "list of answers"
```

> **Pitfall:** `list.remove(1)` on a `List<Integer>` removes the element **at index 1**, because `remove(int index)` is a better match than `remove(Object)`. To remove the value 1, write `list.remove(Integer.valueOf(1))`.

### Converting

```java
List<Integer> a = new ArrayList<>(Arrays.asList(3, 1, 2));    // mutable copy
List<Integer> fixed = List.of(1, 2, 3);                        // immutable (Java 9+)
int[] arr = list.stream().mapToInt(Integer::intValue).toArray();   // List<Integer> → int[]
int[][] out = listOfPairs.toArray(new int[0][]);               // List<int[]> → int[][]
String[] names = nameList.toArray(new String[0]);
```

`List.of(...)` and `Arrays.asList(...)` return lists you **can't resize**: `add` throws `UnsupportedOperationException`. Wrap them in `new ArrayList<>(...)` when you need to modify.

## Iterating and removing safely

```java
for (int i = 0; i < list.size(); i++) { ... list.get(i) ... }   // index loop
for (int x : list) { ... }                                       // for-each (read-only)
list.removeIf(x -> x % 2 == 0);                                  // remove by condition
Iterator<Integer> it = list.iterator();
while (it.hasNext()) if (it.next() < 0) it.remove();             // explicit iterator
for (int i = list.size() - 1; i >= 0; i--) if (bad(list.get(i))) list.remove(i);  // backwards index loop
```

Modifying a list inside a for-each loop over it throws `ConcurrentModificationException`.

## LinkedList

`java.util.LinkedList` is a doubly linked list. It implements both `List` and `Deque`, so it can act as a queue. In practice `ArrayDeque` is faster for queues and stacks, and `ArrayList` for lists. You'll mostly meet `LinkedList` as `Queue<Integer> q = new LinkedList<>();` in older BFS code (it's the only one of the two that allows `null` elements). Don't confuse it with the hand-built `ListNode` lists in linked-list problems.

## The Collections helpers

```java
Collections.sort(list);                 Collections.reverse(list);
Collections.swap(list, i, j);           Collections.max(list);  Collections.min(list);
Collections.frequency(list, x);         Collections.nCopies(3, 0);   // [0, 0, 0]
Collections.emptyList();                Collections.unmodifiableList(list);
```

:::quiz
Q: `List<Integer> l = new ArrayList<>(List.of(10, 20, 30)); l.remove(1);` What is l?
- [10, 20, 30]
- [20, 30]
- [x] [10, 30]
- [10, 20]
> `remove(1)` with an int argument removes the element at index 1, which is 20.
:::

:::quiz
Q: Why does `result.add(path)` inside a backtracking recursion usually produce a list of empty lists at the end?
- `add` copies the list lazily
- [x] Every entry refers to the same `path` object, which is emptied as the recursion unwinds
- ArrayList can't hold lists
- The recursion never reaches that line
> Adding a list adds a reference. Add a snapshot instead: `result.add(new ArrayList<>(path))`.
:::
</script>
<script type="text/x-jc" id="m-deque" data-part="Part 4 · Collections" data-title="Stacks, queues and deques" data-short="Stack, Queue, Deque" data-lede="`ArrayDeque` as a stack and as a queue, the two method families (throwing vs returning null), why not `java.util.Stack`, and the BFS and monotonic-stack templates.">
## One class, three roles

`ArrayDeque` (array double-ended queue) is a circular array that supports O(1) adds and removes at **both ends**. Declare it with the interface that matches how you use it:

```java
Deque<Integer> stack = new ArrayDeque<>();    // LIFO: last in, first out
Queue<Integer> queue = new ArrayDeque<>();    // FIFO: first in, first out
Deque<Integer> dq = new ArrayDeque<>();       // both ends (sliding windows, 0-1 BFS)
```

:::viz deque

## The method names

| You want to… | Stack style | Queue style | Deque, throws if empty | Deque, returns null if empty |
|---|---|---|---|---|
| add at the front | `push(x)` | | `addFirst(x)` | `offerFirst(x)` |
| add at the back | | `offer(x)` / `add(x)` | `addLast(x)` | `offerLast(x)` |
| remove from the front | `pop()` | `poll()` / `remove()` | `removeFirst()` | `pollFirst()` |
| remove from the back | | | `removeLast()` | `pollLast()` |
| look at the front | `peek()` | `peek()` / `element()` | `getFirst()` | `peekFirst()` |
| look at the back | | | `getLast()` | `peekLast()` |

> **Key idea:** As a stack, ArrayDeque's top is the **first** element: `push` = `addFirst`, `pop` = `removeFirst`, `peek` = `peekFirst`. As a queue, you add at the **last** end and remove from the **first**. So `stack.peek()` and `queue.peek()` are the same call, and both look at the front.

> **Pitfall:** `ArrayDeque` doesn't allow `null` elements (`push(null)` throws), because `poll`/`peek` use null to mean "empty". Always check `isEmpty()` before `pop()`; `peek()` and `poll()` return null on an empty deque, which then throws if you unbox it into an `int`.

## Why not Stack?

`java.util.Stack` is a legacy class (it extends `Vector` and synchronises every call). The Java docs themselves recommend `Deque` instead. You'll still see it in older code: `Stack<Integer> st = new Stack<>(); st.push(1); st.pop(); st.peek(); st.isEmpty();`. Same method names, but iteration order differs (Stack iterates bottom to top).

## Templates

```java Valid brackets (stack)
boolean isValid(String s) {
    Deque<Character> st = new ArrayDeque<>();
    for (char c : s.toCharArray()) {
        if (c == '(') st.push(')');
        else if (c == '[') st.push(']');
        else if (c == '{') st.push('}');
        else if (st.isEmpty() || st.pop() != c) return false;   // char unboxed for !=
    }
    return st.isEmpty();
}
```

```java BFS on a grid (queue of int[] pairs)
int bfs(int[][] grid, int sr, int sc) {
    int R = grid.length, C = grid[0].length, steps = 0;
    boolean[][] seen = new boolean[R][C];
    Queue<int[]> q = new ArrayDeque<>();
    q.offer(new int[]{sr, sc});
    seen[sr][sc] = true;
    int[][] dirs = {{1, 0}, {-1, 0}, {0, 1}, {0, -1}};
    while (!q.isEmpty()) {
        for (int size = q.size(); size > 0; size--) {     // process one level at a time
            int[] cur = q.poll();
            if (grid[cur[0]][cur[1]] == 2) return steps;   // found the target
            for (int[] d : dirs) {
                int r = cur[0] + d[0], c = cur[1] + d[1];
                if (r < 0 || r >= R || c < 0 || c >= C || seen[r][c] || grid[r][c] == 1) continue;
                seen[r][c] = true;
                q.offer(new int[]{r, c});
            }
        }
        steps++;
    }
    return -1;
}
```

```java Monotonic stack: next greater element
int[] nextGreater(int[] a) {
    int n = a.length;
    int[] ans = new int[n];
    Arrays.fill(ans, -1);
    Deque<Integer> st = new ArrayDeque<>();        // holds INDEXES, values decreasing
    for (int i = 0; i < n; i++) {
        while (!st.isEmpty() && a[st.peek()] < a[i]) ans[st.pop()] = a[i];
        st.push(i);
    }
    return ans;
}
```

> **Idiom:** Store **indexes** (not values) on a monotonic stack or deque: from an index you can always read the value, compute distances, and check whether it has left a sliding window (`dq.peekFirst() <= i - k`).

:::quiz
Q: `Deque<Integer> d = new ArrayDeque<>(); d.push(1); d.push(2); d.offer(3);` What does `d.pop()` return?
- 1
- [x] 2
- 3
- null
> push adds at the front, so the order is [2, 1], then offer adds 3 at the back: [2, 1, 3]. pop removes from the front: 2.
:::

:::quiz
Q: In BFS, why record `int size = q.size()` before the inner loop?
- To avoid ConcurrentModificationException
- [x] To process exactly the nodes of the current level, so `steps` counts levels
- Because q.size() is O(n)
- It's required by the Queue interface
> Nodes added during the inner loop belong to the next level. Freezing the count first separates the levels.
:::
</script>
<script type="text/x-jc" id="m-hashmap" data-part="Part 4 · Collections" data-title="HashMap and HashSet" data-short="HashMap &amp; HashSet" data-lede="How hashing works, every HashMap method DSA code uses (`getOrDefault`, `merge`, `computeIfAbsent`…), iterating entries, HashSet, LinkedHashMap, and the frequency, two-sum and grouping patterns.">
## How a HashMap works

A `HashMap<K, V>` stores key → value pairs in an array of **buckets**. The key's `hashCode()` picks the bucket; `equals()` finds the exact key inside it. With a good hash function, buckets stay tiny, so lookups take **O(1) on average**.

:::viz hashmap

## The API

```java
Map<String, Integer> m = new HashMap<>();
m.put("a", 1);                     // insert or replace; returns the old value or null
m.get("a");                        // 1, or null if absent
m.getOrDefault("z", 0);            // 0 when absent: no null to unbox
m.containsKey("a");                // true
m.containsValue(1);                // O(n): scans all values
m.remove("a");                     // returns the removed value or null
m.putIfAbsent("b", 5);             // only puts if the key is missing
m.size();  m.isEmpty();  m.clear();

m.merge("a", 1, Integer::sum);     // counting: put 1, or add 1 to the existing value
m.computeIfAbsent("k", k -> new ArrayList<>()).add(x);   // grouping: create the list on first use
m.compute("a", (k, v) -> v == null ? 1 : v + 1);          // general update
```

| Method | Returns | Use it for |
|---|---|---|
| `getOrDefault(k, d)` | value or d | reading counts |
| `merge(k, 1, Integer::sum)` | the new value | frequency counting in one line |
| `computeIfAbsent(k, f)` | the existing or newly created value | `Map<K, List<V>>` grouping, graph building |
| `putIfAbsent(k, v)` | old value or null | first occurrence only |

### Iterating

```java
for (Map.Entry<String, Integer> e : m.entrySet()) {
    String key = e.getKey();
    int count = e.getValue();
}
for (String key : m.keySet()) { ... }
for (int v : m.values()) { ... }
m.forEach((k, v) -> System.out.println(k + "=" + v));
```

> **Watch out:** A `HashMap`'s iteration order is effectively random and can change as it grows. If you need insertion order use `LinkedHashMap`; for sorted keys use `TreeMap` (module 17).

## The patterns

```java Frequency count
Map<Integer, Integer> freq = new HashMap<>();
for (int x : nums) freq.merge(x, 1, Integer::sum);
// or: freq.put(x, freq.getOrDefault(x, 0) + 1);
```

```java Two sum: value → index
int[] twoSum(int[] nums, int target) {
    Map<Integer, Integer> seen = new HashMap<>();          // value -> index
    for (int i = 0; i < nums.length; i++) {
        Integer j = seen.get(target - nums[i]);             // Integer, because it may be null
        if (j != null) return new int[]{j, i};
        seen.put(nums[i], i);
    }
    return new int[0];
}
```

```java Group anagrams: key → list
List<List<String>> groupAnagrams(String[] words) {
    Map<String, List<String>> groups = new HashMap<>();
    for (String w : words) {
        char[] cs = w.toCharArray();
        Arrays.sort(cs);
        groups.computeIfAbsent(new String(cs), k -> new ArrayList<>()).add(w);
    }
    return new ArrayList<>(groups.values());
}
```

```java Adjacency list for a graph
Map<Integer, List<Integer>> adj = new HashMap<>();
for (int[] e : edges) {
    adj.computeIfAbsent(e[0], k -> new ArrayList<>()).add(e[1]);
    adj.computeIfAbsent(e[1], k -> new ArrayList<>()).add(e[0]);   // undirected
}
for (int nb : adj.getOrDefault(node, List.of())) { ... }
```

## HashSet

A `HashSet<E>` is a HashMap that only stores keys: a collection with **no duplicates** and O(1) average `add`, `remove` and `contains`.

```java
Set<Integer> seen = new HashSet<>();
if (!seen.add(x)) return true;      // add returns false if x was already there: duplicate found!
seen.contains(y);  seen.remove(y);  seen.size();
Set<Integer> fromArray = new HashSet<>(Arrays.asList(1, 2, 2, 3));   // {1, 2, 3}
a.retainAll(b);   // intersection (modifies a)
a.addAll(b);      // union
a.removeAll(b);   // difference
```

## Keys must behave

- Use **immutable** keys (String, Integer, Long, records). If a key object changes after insertion, its hash changes and the map can't find it any more.
- `int[]` is a terrible key: arrays use identity `equals`/`hashCode`, so `new int[]{1, 2}` never matches another `new int[]{1, 2}`. Use `List.of(1, 2)`, a record, a String like `r + "," + c`, or an encoded `long`.

## LinkedHashMap: insertion order and LRU

`LinkedHashMap` keeps a linked list through the entries, so it iterates in insertion order. With `accessOrder = true` and an override of `removeEldestEntry`, it becomes an LRU cache in a few lines:

```java
class LRUCache extends LinkedHashMap<Integer, Integer> {
    private final int cap;
    LRUCache(int cap) { super(cap, 0.75f, true); this.cap = cap; }   // true = access order
    public int get(int key) { return getOrDefault(key, -1); }
    public void put(int key, int value) { super.put(key, value); }
    @Override protected boolean removeEldestEntry(Map.Entry<Integer, Integer> e) { return size() > cap; }
}
```

:::quiz
Q: What does `map.merge(word, 1, Integer::sum)` do when `word` is not yet in the map?
- Throws NullPointerException
- [x] Puts word → 1
- Puts word → 0
- Does nothing
> merge inserts the given value when the key is absent; otherwise it combines the old and given values with the function (here, addition).
:::

:::quiz
Q: `Set<int[]> s = new HashSet<>(); s.add(new int[]{1, 2}); s.contains(new int[]{1, 2})` returns…
- true
- [x] false
- A compile error
- It throws an exception
> Arrays don't override equals/hashCode, so two different arrays with the same contents are different keys. Use `List.of(1, 2)` or a record.
:::
</script>
<script type="text/x-jc" id="m-treemap" data-part="Part 4 · Collections" data-title="TreeMap and TreeSet" data-short="TreeMap &amp; TreeSet" data-lede="Sorted maps and sets backed by a balanced binary search tree: floor, ceiling, first, last, range views, and when to choose them over hashing.">
## Sorted, with O(log n) everything

`TreeMap<K, V>` and `TreeSet<E>` keep their keys **sorted** at all times, using a red-black tree (a self-balancing binary search tree). Every operation costs O(log n), slower than a HashMap's O(1), but you get **order** and **nearest-key queries**, which hashing can't do.

:::viz treemap

## The navigation methods

| Method | Returns | Example on keys {10, 20, 30} |
|---|---|---|
| `firstKey()` / `lastKey()` | smallest / largest key | 10 / 30 |
| `floorKey(x)` | largest key **≤ x** | `floorKey(25)` = 20 |
| `ceilingKey(x)` | smallest key **≥ x** | `ceilingKey(25)` = 30 |
| `lowerKey(x)` | largest key **< x** | `lowerKey(20)` = 10 |
| `higherKey(x)` | smallest key **> x** | `higherKey(20)` = 30 |
| `pollFirstEntry()` / `pollLastEntry()` | remove and return the smallest / largest entry | |
| `headMap(x)` / `tailMap(x)` / `subMap(a, b)` | live views of keys < x / ≥ x / in [a, b) | |
| `descendingMap()` / `descendingKeySet()` | reverse order views | |

The `…Key` methods return `null` when nothing qualifies (e.g. `floorKey(5)` here). The `…Entry` versions (`floorEntry`, `firstEntry`…) return a `Map.Entry` with both key and value. `TreeSet` has the same methods without "Key": `first()`, `floor(x)`, `ceiling(x)`, `pollFirst()`.

```java
TreeMap<Integer, Integer> tm = new TreeMap<>();
tm.put(30, 3); tm.put(10, 1); tm.put(20, 2);
System.out.println(tm);                 // {10=1, 20=2, 30=3}  (always sorted)
Integer f = tm.floorKey(25);            // 20; Integer, because it can be null
if (f != null) { ... }

TreeSet<Integer> ts = new TreeSet<>(List.of(5, 1, 9));
ts.first();  ts.last();  ts.ceiling(6);  // 1, 9, 9
TreeMap<String, Integer> byLen = new TreeMap<>(Comparator.comparing(String::length));  // custom order
```

## When to use which

| Need | Choose |
|---|---|
| fast lookup, order doesn't matter | `HashMap` / `HashSet` |
| keep insertion order | `LinkedHashMap` / `LinkedHashSet` |
| sorted iteration, min/max, "closest key", ranges | `TreeMap` / `TreeSet` |
| repeatedly take the min or max only | `PriorityQueue` (module 18), simpler and faster |
| a sorted multiset (duplicates allowed) | `TreeMap<Integer, Integer>` value → count |

```java Sliding-window median-ish: a multiset with TreeMap
TreeMap<Integer, Integer> window = new TreeMap<>();
void add(int x)    { window.merge(x, 1, Integer::sum); }
void remove(int x) { if (window.merge(x, -1, Integer::sum) == 0) window.remove(x); }
int min()          { return window.firstKey(); }
int max()          { return window.lastKey(); }
```

```java Calendar booking: does [start, end) overlap an existing booking?
TreeMap<Integer, Integer> booked = new TreeMap<>();   // start -> end
boolean book(int start, int end) {
    Integer prev = booked.floorKey(start), next = booked.ceilingKey(start);
    if (prev != null && booked.get(prev) > start) return false;   // previous booking runs into us
    if (next != null && next < end) return false;                 // next booking starts before we end
    booked.put(start, end);
    return true;
}
```

:::quiz
Q: Keys are {2, 4, 8}. What is `ceilingKey(5)`?
- 4
- [x] 8
- 5
- null
> ceiling = the smallest key that is greater than or equal to 5. That's 8.
:::

:::quiz
Q: Keys are {2, 4, 8}. What does `int k = tm.floorKey(1);` do?
- k = 0
- k = 2
- [x] Throws NullPointerException
- k = -1
> No key is ≤ 1, so floorKey returns null, and unboxing null into `int` throws. Store it in an `Integer` and check for null first.
:::
</script>
<script type="text/x-jc" id="m-pq" data-part="Part 4 · Collections" data-title="PriorityQueue (heaps)" data-short="PriorityQueue" data-lede="Java&#x27;s binary heap: min-heap by default, max-heap with a comparator, priorities on `int[]` tuples, and the top-k, merge-k and Dijkstra templates.">
## A heap behind a queue interface

`PriorityQueue<E>` always gives you the **smallest** element first (by natural order or a comparator). Internally it's a **binary heap** stored in an array: adding and removing take O(log n), peeking at the minimum is O(1).

:::viz heap

| Method | Does | Cost |
|---|---|---|
| `offer(x)` / `add(x)` | insert (sift up) | O(log n) |
| `peek()` | look at the min (null if empty) | O(1) |
| `poll()` | remove and return the min (null if empty) | O(log n) |
| `remove()` | like poll, but throws if empty | O(log n) |
| `size()`, `isEmpty()` | | O(1) |
| `remove(x)`, `contains(x)` | search the array | O(n) |
| `new PriorityQueue<>(collection)` | build a heap from many items (heapify) | O(n) |

```java
PriorityQueue<Integer> min = new PriorityQueue<>();                          // min-heap
PriorityQueue<Integer> max = new PriorityQueue<>(Comparator.reverseOrder());  // max-heap
PriorityQueue<Integer> max2 = new PriorityQueue<>((a, b) -> b - a);           // same (fine for small values)
PriorityQueue<int[]> byCost = new PriorityQueue<>((a, b) -> Integer.compare(a[0], b[0]));   // [cost, node]
PriorityQueue<ListNode> nodes = new PriorityQueue<>((a, b) -> Integer.compare(a.val, b.val));
PriorityQueue<String> byLen = new PriorityQueue<>(Comparator.comparingInt(String::length));
```

> **Watch out:** Iterating a PriorityQueue (for-each, `toString`, `Arrays.toString(pq.toArray())`) shows the internal **heap array order**, not sorted order. Only repeated `poll()` produces elements in sorted order.

## Templates

```java Kth largest: keep a min-heap of size k
int findKthLargest(int[] nums, int k) {
    PriorityQueue<Integer> heap = new PriorityQueue<>();
    for (int x : nums) {
        heap.offer(x);
        if (heap.size() > k) heap.poll();     // throw away the smallest
    }
    return heap.peek();                        // the smallest of the k largest
}
```

```java Merge k sorted lists
ListNode mergeKLists(ListNode[] lists) {
    PriorityQueue<ListNode> pq = new PriorityQueue<>((a, b) -> Integer.compare(a.val, b.val));
    for (ListNode l : lists) if (l != null) pq.offer(l);
    ListNode dummy = new ListNode(0), tail = dummy;
    while (!pq.isEmpty()) {
        ListNode n = pq.poll();
        tail.next = n; tail = n;
        if (n.next != null) pq.offer(n.next);
    }
    return dummy.next;
}
```

```java Dijkstra's shortest paths
int[] dijkstra(List<List<int[]>> adj, int src) {      // adj.get(u) holds {v, weight}
    int[] dist = new int[adj.size()];
    Arrays.fill(dist, Integer.MAX_VALUE);
    dist[src] = 0;
    PriorityQueue<int[]> pq = new PriorityQueue<>((a, b) -> Integer.compare(a[1], b[1]));  // {node, dist}
    pq.offer(new int[]{src, 0});
    while (!pq.isEmpty()) {
        int[] cur = pq.poll();
        int u = cur[0];
        if (cur[1] > dist[u]) continue;                // stale entry: we already found better
        for (int[] e : adj.get(u)) {
            int v = e[0], nd = dist[u] + e[1];
            if (nd < dist[v]) { dist[v] = nd; pq.offer(new int[]{v, nd}); }
        }
    }
    return dist;
}
```

> **Idiom:** Java's PriorityQueue has no "decrease key". Instead, push a new entry with the better priority and **skip stale entries** when they're polled (the `cur[1] > dist[u]` check).

## Two heaps: running median

```java
PriorityQueue<Integer> low = new PriorityQueue<>(Comparator.reverseOrder());  // max-heap: smaller half
PriorityQueue<Integer> high = new PriorityQueue<>();                           // min-heap: larger half
void add(int x) {
    low.offer(x);
    high.offer(low.poll());                          // move the largest of low to high
    if (high.size() > low.size()) low.offer(high.poll());   // rebalance: low may have one extra
}
double median() {
    return low.size() > high.size() ? low.peek() : (low.peek() + high.peek()) / 2.0;
}
```

:::quiz
Q: `PriorityQueue<Integer> pq = new PriorityQueue<>(List.of(5, 1, 4)); System.out.println(pq);` What's guaranteed?
- It prints [1, 4, 5]
- [x] The first element printed is 1; the rest are in heap order, not necessarily sorted
- It prints [5, 1, 4]
- It doesn't compile
> toString shows the internal array. Only the root (index 0) is guaranteed to be the minimum.
:::

:::quiz
Q: To find the k smallest elements of a stream using a heap of size k, which heap do you keep?
- A min-heap
- [x] A max-heap, evicting the largest when size exceeds k
- Either works the same
- A TreeMap is required
> Mirror image of "kth largest with a min-heap": the heap's root must be the element you'd throw away, the largest of the current candidates.
:::
</script>
<script type="text/x-jc" id="m-nodes" data-part="Part 5 · Reading DSA code" data-title="Linked-list and tree code" data-short="ListNode &amp; TreeNode code" data-lede="Reading and writing pointer code: traversal, dummy heads, reversing, fast and slow pointers, and recursive tree methods with null base cases. Everything from modules 7 and 9 applied.">
## Walking a linked list

A list is just a `head` reference. Every algorithm walks it with a second reference so the head isn't lost:

```java
int length(ListNode head) {
    int n = 0;
    for (ListNode cur = head; cur != null; cur = cur.next) n++;   // the standard traversal
    return n;
}
ListNode build(int[] vals) {                 // build a list from an array: useful for testing
    ListNode dummy = new ListNode(0), tail = dummy;
    for (int v : vals) { tail.next = new ListNode(v); tail = tail.next; }
    return dummy.next;
}
```

> **Mental model:** `cur = cur.next` moves **your pointer**. `cur.next = something` changes **the list**. Read every line of list code asking: "Am I moving a pointer, or rewiring a node?"

## Pointer surgery, animated

:::viz linkedrev

The patterns behind most list problems:

| Pattern | Key lines |
|---|---|
| **Dummy head**: the head might change or be deleted | `ListNode dummy = new ListNode(0, head); … return dummy.next;` |
| **Reverse** | `next = cur.next; cur.next = prev; prev = cur; cur = next;` |
| **Fast and slow pointers**: middle, cycle detection | `while (fast != null && fast.next != null) { slow = slow.next; fast = fast.next.next; }` |
| **Two lists** (merge) | a `tail` pointer that always appends the smaller head |
| **Gap of k**: kth from the end | move `fast` k steps first, then move both together |

```java Detect a cycle (Floyd)
boolean hasCycle(ListNode head) {
    ListNode slow = head, fast = head;
    while (fast != null && fast.next != null) {     // check BOTH before reading fast.next.next
        slow = slow.next;
        fast = fast.next.next;
        if (slow == fast) return true;              // == : the very same node object
    }
    return false;
}
```

> **Watch out:** In `fast.next.next`, both `fast` and `fast.next` must be non-null, so the loop condition checks them in that order. A null check that comes **after** the dereference is too late.

## Recursion on trees

Tree methods are almost always recursive: handle `null`, recurse into `left` and `right`, combine.

:::viz treetrav

```java
int maxDepth(TreeNode root) {
    if (root == null) return 0;                                   // base case: empty tree
    return 1 + Math.max(maxDepth(root.left), maxDepth(root.right));
}
boolean isSame(TreeNode a, TreeNode b) {
    if (a == null || b == null) return a == b;                    // both null → true
    return a.val == b.val && isSame(a.left, b.left) && isSame(a.right, b.right);
}
TreeNode invert(TreeNode root) {
    if (root == null) return null;
    TreeNode t = root.left;
    root.left = invert(root.right);
    root.right = invert(t);
    return root;
}
boolean isValidBST(TreeNode n, long lo, long hi) {               // long bounds avoid int edge cases
    if (n == null) return true;
    if (n.val <= lo || n.val >= hi) return false;
    return isValidBST(n.left, lo, n.val) && isValidBST(n.right, n.val, hi);
}
// called as isValidBST(root, Long.MIN_VALUE, Long.MAX_VALUE)
```

### Passing state through recursion

| Technique | When | Example |
|---|---|---|
| return value | the answer combines children's answers | height, size, sum |
| parameters | information flows **down** | depth, path sum so far, bounds |
| a field on `Solution` | a global best updated anywhere | diameter, max path sum |
| a list parameter | collect results | all root-to-leaf paths (add a copy!) |
| `int[] box = new int[1]` | a mutable counter inside lambdas/helpers | kth smallest counter |

```java Field for a global answer: diameter of a binary tree
class Solution {
    private int best = 0;
    public int diameterOfBinaryTree(TreeNode root) { height(root); return best; }
    private int height(TreeNode n) {
        if (n == null) return 0;
        int l = height(n.left), r = height(n.right);
        best = Math.max(best, l + r);          // path through n
        return 1 + Math.max(l, r);
    }
}
```

## Iterative traversal with an explicit stack

```java Inorder without recursion
List<Integer> inorder(TreeNode root) {
    List<Integer> out = new ArrayList<>();
    Deque<TreeNode> st = new ArrayDeque<>();
    TreeNode cur = root;
    while (cur != null || !st.isEmpty()) {
        while (cur != null) { st.push(cur); cur = cur.left; }   // go as far left as possible
        cur = st.pop();
        out.add(cur.val);                                       // visit
        cur = cur.right;                                        // then the right subtree
    }
    return out;
}
```

:::quiz
Q: In reverse(), what goes wrong if you swap the order to `cur.next = prev; next = cur.next;`?
- Nothing
- [x] `next` becomes prev, so the rest of the list is lost
- It reverses twice
- It throws NullPointerException immediately
> You must save `cur.next` before overwriting it. Once `cur.next = prev` runs, the only reference to the rest of the list is gone.
:::

:::quiz
Q: `if (a == null || b == null) return a == b;` returns true when…
- exactly one is null
- [x] both are null
- neither is null
- never
> If at least one is null, `a == b` is true only when both are null (both references are the same: null).
:::

## Reading a solution line by line

Here's a complete solution from the Data structures prep page style, annotated with the module that explains each piece:

```java Top K frequent elements
import java.util.*;                                      // module 1: java.util collections

class Solution {                                          // module 1, 9: the judge calls this
    public int[] topKFrequent(int[] nums, int k) {        // module 5: returns an int[]
        Map<Integer, Integer> count = new HashMap<>();    // module 11, 16: Integer → Integer
        for (int x : nums) count.merge(x, 1, Integer::sum);   // module 4, 13, 16

        // min-heap of [value, frequency], ordered by frequency
        PriorityQueue<int[]> heap =
            new PriorityQueue<>((a, b) -> Integer.compare(a[1], b[1]));  // module 13, 18
        for (Map.Entry<Integer, Integer> e : count.entrySet()) {          // module 16
            heap.offer(new int[]{e.getKey(), e.getValue()});              // module 6: int[] tuple; unboxing
            if (heap.size() > k) heap.poll();             // keep only the k most frequent
        }

        int[] ans = new int[k];
        for (int i = k - 1; i >= 0; i--) ans[i] = heap.poll()[0];   // module 6: index into the polled array
        return ans;
    }
}
```

How to read any solution quickly:

1. **Signature first**: what goes in, what comes out (`int[]`, `List<List<Integer>>`, `ListNode`…).
2. **Declarations** tell you the data structures: the left side of `=` says what kind of collection, the right side how it's built.
3. **Loops**: what are they iterating over, and what invariant does each iteration keep?
4. **Return**: what's built up into the answer?

## Idioms you'll see everywhere

| Idiom | Meaning |
|---|---|
| `int n = nums.length;` | cache the size |
| `best = Math.max(best, cur);` | running maximum |
| `int INF = Integer.MAX_VALUE;` / `Integer.MAX_VALUE / 2` | "infinity" (the halved version is safe to add to) |
| `int mid = lo + (hi - lo) / 2;` / `(lo + hi) >>> 1` | overflow-safe midpoint |
| `int[] dp = new int[n + 1];` | DP table with a slot for "empty prefix" |
| `Integer[] memo = new Integer[n];` | memo where `null` means "not computed" |
| `Arrays.fill(dist, Integer.MAX_VALUE);` | initialise before relaxing |
| `long ans = 0; … ans % MOD` | big counts with `MOD = 1_000_000_007` |
| `new int[]{r, c}` | a pair/tuple without a class |
| `int[][] dirs = {{1,0},{-1,0},{0,1},{0,-1}};` | grid neighbours |
| `count[c - 'a']++` | letter frequency |
| `ListNode dummy = new ListNode(0, head);` | avoid head special cases |
| `Deque<Integer> st = new ArrayDeque<>();` | stack |
| `Queue<int[]> q = new ArrayDeque<>();` | BFS queue |
| `map.computeIfAbsent(k, x -> new ArrayList<>()).add(v);` | group / adjacency list |
| `result.add(new ArrayList<>(path));` | snapshot in backtracking |
| `(mask >> i) & 1` | test bit i |
| `return new int[0];` / `return List.of();` | empty answer |
| `private int[] parent;` + `find(x)` | union-find as fields |

## The gotcha checklist

Run through this list when a Java solution gives a wrong answer or crashes:

- ☐ **Integer overflow**: products, sums of big arrays, `a - b` in comparators, `(lo + hi) / 2`. Use `long`, `Integer.compare`, safe midpoints.
- ☐ **Integer division**: `5 / 2 == 2`. Cast to double before dividing when you need a fraction.
- ☐ **`==` on objects**: Strings, Integers (beyond -128..127), arrays. Use `equals` / `Arrays.equals`.
- ☐ **Null unboxing**: `int x = map.get(k);` when k is missing; `int v = pq.peek();` on an empty heap.
- ☐ **Off-by-one**: `i < n` vs `i <= n`, `substring(a, b)` excludes b, `dp` sized `n + 1`.
- ☐ **Shared references**: `b = a` for arrays and lists; `result.add(path)` without copying; `new int[n][]` rows not allocated.
- ☐ **Modifying while iterating**: ConcurrentModificationException.
- ☐ **`list.remove(i)` vs `list.remove(Integer.valueOf(x))`**.
- ☐ **Unmodifiable lists**: `List.of`, `Arrays.asList` can't grow.
- ☐ **Deep recursion**: StackOverflowError beyond roughly 10⁴ frames.
- ☐ **String building in loops**: use StringBuilder.
- ☐ **PriorityQueue printing**: not sorted; poll to get order.
- ☐ **char arithmetic**: `'a' + 1` is an int (98), not 'b'; cast back with `(char)`.
- ☐ **`1 << 31`** is negative; use `1L << k` beyond bit 30.

## One-page API cheat sheet

| Structure | Create | Add | Remove | Peek / get | Check |
|---|---|---|---|---|---|
| array | `new int[n]`, `{1, 2}` | `a[i] = x` | – | `a[i]` | `a.length` |
| ArrayList | `new ArrayList<>()` | `add(x)`, `add(i, x)` | `remove(i)`, `remove(Integer.valueOf(x))` | `get(i)` | `size()`, `contains(x)` |
| stack (ArrayDeque) | `new ArrayDeque<>()` | `push(x)` | `pop()` | `peek()` | `isEmpty()` |
| queue (ArrayDeque) | `new ArrayDeque<>()` | `offer(x)` | `poll()` | `peek()` | `isEmpty()`, `size()` |
| deque | `new ArrayDeque<>()` | `offerFirst`, `offerLast` | `pollFirst`, `pollLast` | `peekFirst`, `peekLast` | |
| HashMap | `new HashMap<>()` | `put(k, v)`, `merge`, `computeIfAbsent` | `remove(k)` | `get(k)`, `getOrDefault(k, d)` | `containsKey(k)` |
| HashSet | `new HashSet<>()` | `add(x)` (false if present) | `remove(x)` | – | `contains(x)` |
| TreeMap | `new TreeMap<>()` | `put(k, v)` | `remove(k)`, `pollFirstEntry()` | `firstKey()`, `floorKey(x)`, `ceilingKey(x)` | `containsKey(k)` |
| PriorityQueue | `new PriorityQueue<>(cmp)` | `offer(x)` | `poll()` | `peek()` | `isEmpty()`, `size()` |
| StringBuilder | `new StringBuilder()` | `append(x)`, `insert(i, x)` | `deleteCharAt(i)`, `setLength(0)` | `charAt(i)` | `length()` |
| String | `"…"`, `String.valueOf(x)` | (immutable) | – | `charAt(i)`, `substring(a, b)` | `length()`, `isEmpty()` |

## Complexity of common operations

| Operation | Cost |
|---|---|
| array / ArrayList `get`, `set`; ArrayList append | O(1) (append amortised) |
| ArrayList insert/remove at the front or middle; `contains` | O(n) |
| ArrayDeque push/pop/offer/poll at either end | O(1) |
| HashMap / HashSet put, get, contains, remove | O(1) average |
| TreeMap / TreeSet any lookup or update | O(log n) |
| PriorityQueue offer/poll; peek | O(log n); O(1) |
| `Arrays.sort`, `Collections.sort` | O(n log n) |
| String `charAt`, `length`; `substring`, `+`, `toCharArray` | O(1); O(n) |

:::quiz
Q: Which line can overflow for `lo` and `hi` near `Integer.MAX_VALUE`?
- `int mid = lo + (hi - lo) / 2;`
- [x] `int mid = (lo + hi) / 2;`
- `int mid = (lo + hi) >>> 1;`
- None of them
> `lo + hi` can exceed 2³¹ − 1. The first form never adds the two directly; the `>>>` form treats the overflowed sum as unsigned, which also gives the right answer for non-negative lo and hi.
:::

:::quiz
Q: `Integer[] memo = new Integer[n];` What's the advantage over `int[] memo` with `Arrays.fill(memo, -1)`?
- It's faster
- [x] `null` can mean "not computed" even when -1 is a valid answer
- It uses less memory
- int arrays can't be used for memoisation
> With an Integer array, every slot starts as null, so no sentinel value is needed. The trade-off is boxing overhead.
:::

<script>
/* Java for DSA: modules live in the text/x-jc script blocks above, written in a small markdown dialect:
   ## Section            -> h2 (listed under "In this module")
   ### / ####            -> sub-headings
   ```java Title         -> highlighted code with an optional title; ```output -> program output
   :::viz name           -> an interactive animation (FEVIZ)
   :::html ... :::       -> raw HTML (figures)
   :::quiz ... :::       -> multiple-choice check: "Q: text", options "- text" / "- [x] text", "> explanation"
   > **Tip:** ...        -> callout (Tip / Pitfall / Note / Key idea)
   | a | b |             -> table;  - / 1.  -> lists;  `code`, **bold**, _em_, [link](url) inline */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem('java-course:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('java-course:' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } }

const slug = s => s.toLowerCase().replace(/<[^>]+>/g, '').replace(/[`*_]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 64);

/* ---------- syntax highlighting ---------- */
const JAVA_KW = new Set(('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var record yield sealed permits true false null').split(' '));

  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(@[A-Za-z]\w*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d[\d_]*(?:\.\d+)?(?:e[+-]?\d+)?[lLfFdD]?\b|\b0[xb][0-9a-fA-F_]+[lL]?\b)|([A-Za-z_$][\w$]*)|([\s\S])/g;
  let out = '', m;
  while ((m = re.exec(code))) {
    if (m[1]) out += '<span class="tc">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tt">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="ts">' + esc(m[3]) + '</span>';
    else if (m[4]) out += '<span class="tn">' + m[4] + '</span>';
    else if (m[5]) {
      const w = m[5];

      else if (/^[A-Z]/.test(w)) out += '<span class="tt">' + w + '</span>';

}

const LANG_NAMES = { java: 'Java', output: 'Output', text: 'Text', bash: 'Terminal', js: 'JavaScript' };

/* ---------- markdown ---------- */
const CODES = [];

    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => '<a href="' + u + '"' + (/^https?:/.test(u) ? ' target="_blank" rel="noopener"' : '') + '>' + t + '</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')

}

      i++; continue;
    }
    if ((m = l.match(/^(#{3,4}) (.+)/))) { emit('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); note(m[2]); i++; continue; }
    if (l.startsWith('>')) {
      const buf = [];
      while (i < L.length && L[i].startsWith('>')) buf.push(L[i++].replace(/^>\s?/, ''));
      const t = buf.join(' ');
      const cls = /^\*\*(Tip|Rule of thumb|Idiom)/i.test(t) ? 'tip' : /^\*\*(Pitfall|Watch out|Gotcha|Common mistake|Trap)/i.test(t) ? 'warn' : /^\*\*(Note|Interview|In DSA code|Why)/i.test(t) ? 'note' : /^\*\*(Key idea|Mental model|Remember|In short)/i.test(t) ? 'key' : '';
      emit('<div class="callout ' + cls + '">' + inline(t) + '</div>'); note(t);
      continue;
    }
    if (l.startsWith('|')) {
      const rows = [];
      while (i < L.length && L[i].startsWith('|')) rows.push(L[i++]);
      const cells = r => r.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));
      const head = cells(rows[0]), body = rows.slice(/^\|?\s*:?-/.test(rows[1] || '') ? 2 : 1).map(cells);
      emit('<div class="tbl"><table><thead><tr>' + head.map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' +
        body.map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
      note(rows.join(' ').replace(/[|:-]+/g, ' '));
      continue;
    }
    if (/^\s*(?:[-*]|\d+\.) /.test(l)) { const r = list(i); emit(r.html); i = r.i; continue; }
    const buf = [];
    while (i < L.length && L[i].trim() && !BLOCK_START.test(L[i])) buf.push(L[i++].trim());
    if (!buf.length) { buf.push(L[i++].trim()); }
    const t = buf.join(' ');
    emit('<p>' + inline(t) + '</p>'); note(t);
  }
  const words = page.src.replace(/:::html[\s\S]*?\n:::/g, ' ').split(/\s+/).length;
  return { html: out.join(''), h2s, sections, viz, quiz, mins: Math.max(5, Math.round(words / 170 + viz * 1.5 + quiz * 0.5)) };
}

/* ---------- modules ---------- */
const MODS = [...document.querySelectorAll('script[type="text/x-jc"]')].map((s, n) => ({
  id: s.id.replace(/^m-/, ''), n, title: s.dataset.title, short: s.dataset.short || s.dataset.title,
  part: s.dataset.part, lede: s.dataset.lede || '', src: s.textContent
}));
MODS.forEach(p => Object.assign(p, parsePage(p)));
const MOD = Object.fromEntries(MODS.map(p => [p.id, p]));
const COURSE = MODS.filter(p => p.id !== 'home');
const TOTAL_VIZ = MODS.reduce((n, p) => n + p.viz, 0), TOTAL_QUIZ = MODS.reduce((n, p) => n + p.quiz, 0);
let studied = store.get('studied', {});
const studiedCount = () => COURSE.filter(p => studied[p.id]).length;

function renderSide(cur) {
  const parts = [];
  for (const p of MODS) { let g = parts.find(x => x.name === p.part); if (!g) parts.push(g = { name: p.part, mods: [] }); g.mods.push(p); }
  $('#toc').innerHTML = parts.map(g => '<div class="navg"><h4>' + esc(g.name) + '</h4>' + g.mods.map(p =>
    '<a class="navl' + (p.id === cur ? ' on' : '') + (studied[p.id] ? ' done' : '') + '" href="#/' + p.id + '"' + (p.id === cur ? ' aria-current="page"' : '') + '><span>' +
    (p.id === 'home' ? '' : '<i class="mnum">' + p.n + '</i>') + esc(p.short) + '</span>' + (studied[p.id] ? '<small aria-label="studied">✓</small>' : '') + '</a>').join('') + '</div>').join('');
  const k = studiedCount(), pct = Math.round(k / COURSE.length * 100);
  $('#overall').innerHTML = '<b>' + k + '</b> of ' + COURSE.length + ' modules studied · ' + pct + '%<div class="bar"><i style="width:' + pct + '%"></i></div>';
}
function pageHead(p) {
  return '<div class="eyebrow">' + esc(p.part) + (p.id === 'home' ? '' : ' · Module ' + p.n) + '</div><h1>' + esc(p.title) + '</h1>' + (p.lede ? '<p class="lede">' + inline(p.lede) + '</p>' : '') +
    (p.id === 'home' ? '' : '<div class="chips"><span class="chip">~<b>' + p.mins + '</b> min</span>' + (p.viz ? '<span class="chip"><b>' + p.viz + '</b> animation' + (p.viz > 1 ? 's' : '') + '</span>' : '') +
      (p.quiz ? '<span class="chip"><b>' + p.quiz + '</b> quick check' + (p.quiz > 1 ? 's' : '') + '</span>' : '') + (studied[p.id] ? '<span class="chip ok">✓ studied</span>' : '') + '</div>') +
    (p.h2s.length > 1 ? '<nav class="onpage" aria-label="In this module"><b>In this module</b>' + p.h2s.map(h => '<a href="#/' + p.id + '/' + h.id + '">' + inline(h.text) + '</a>').join('') + '</nav>' : '');
}
function pageFoot(p) {
  if (p.id === 'home') return '';
  const done = !!studied[p.id];
  return '<div class="guide-foot"><div><b>Finished this module?</b><p>Mark it as studied to track your progress. It\'s saved in this browser only.</p></div><div class="gf-act">' +
    '<button type="button" class="btn studied' + (done ? ' on' : '') + '" data-studied="' + p.id + '" aria-pressed="' + done + '">' + (done ? '✓ Studied' : 'Mark as studied') + '</button></div></div>';
}
function pager(p) {
  const i = MODS.indexOf(p), prev = MODS[i - 1], next = MODS[i + 1];
  return '<nav class="pager" aria-label="Previous and next">' + (prev ? '<a href="#/' + prev.id + '"><small>← Previous</small>' + esc(prev.short) + '</a>' : '') +
    (next ? '<a class="next" href="#/' + next.id + '"><small>Next →</small>' + esc(next.short) + '</a>' : '') + '</nav>';
}
function homeExtras() {
  const k = studiedCount();
  const kpis = '<div class="kpis"><div class="kpi"><b>' + COURSE.length + '</b><span>modules</span></div><div class="kpi"><b>' + TOTAL_VIZ + '</b><span>interactive animations</span></div>' +
    '<div class="kpi"><b>' + TOTAL_QUIZ + '</b><span>quick checks</span></div><div class="kpi"><b>' + k + '</b><span>modules studied</span></div></div>';
  const parts = [];
  for (const p of COURSE) { let g = parts.find(x => x.name === p.part); if (!g) parts.push(g = { name: p.part, mods: [] }); g.mods.push(p); }
  const next = COURSE.find(p => !studied[p.id]);
  return kpis + (next ? '<p><a class="btn primary" href="#/' + next.id + '">' + (k ? 'Continue with' : 'Start with') + ' module ' + next.n + ': ' + esc(next.short) + ' →</a></p>' : '') +
    parts.map(g => '<div class="groupt">' + esc(g.name) + '</div><div class="cards">' + g.mods.map(p =>
      '<a class="card' + (studied[p.id] ? ' done' : '') + '" href="#/' + p.id + '"><b><i class="mnum">' + p.n + '</i>' + esc(p.short) + (studied[p.id] ? ' ✓' : '') + '</b><p>' + inline(p.lede) + '</p><small>~' + p.mins + ' min' + (p.viz ? ' · ' + p.viz + ' animation' + (p.viz > 1 ? 's' : '') : '') + '</small></a>').join('') + '</div>').join('');
}

let curPage = null;
function render() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');
  const p = MOD[parts[0]] || MODS[0], target = parts[1];
  const el = $('#page');
  if (curPage !== p.id) {
    if (window.FEVIZ) FEVIZ.pauseAll();
    el.innerHTML = pageHead(p) + (p.id === 'home' ? homeExtras() : '') + p.html + pageFoot(p) + pager(p);
    if (window.FEVIZ) FEVIZ.mount(el);
    document.title = (p.id === 'home' ? '' : p.short + ' · ') + 'Java for DSA';
    curPage = p.id;
    if (!target) window.scrollTo(0, 0);
  }
  renderSide(p.id);
  closeSide();
  if (target) {
    const t = document.getElementById(p.id + '--' + target);
    if (t) requestAnimationFrame(() => t.scrollIntoView({ block: 'start' }));
  }
}

/* ---------- search ---------- */
const INDEX = MODS.flatMap(p => p.sections.map(s => ({ p, s, title: s.title.toLowerCase(), body: (s.title + ' ' + s.text.join(' ')).toLowerCase() })));
function search(term) {
  const words = term.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = INDEX.map(e => words.every(w => e.body.includes(w)) ? { e, score: words.reduce((s, w) => s + (e.title.includes(w) ? 10 : 1), 0) } : null)
    .filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 60);
  const mark = s => { let h = esc(s); words.forEach(w => { h = h.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); }); return h; };
  const snippet = e => { const t = e.s.text.join(' '), i = t.toLowerCase().indexOf(words[0]); return i < 0 ? t.slice(0, 140) : (i > 40 ? '…' : '') + t.slice(Math.max(0, i - 40), i + 120); };
  $('#page').innerHTML = '<div class="eyebrow">Search</div><h1>' + hits.length + ' results</h1><p class="lede">for “' + esc(term) + '”</p>' +
    (hits.length ? hits.map(({ e }) => '<a class="sr" href="#/' + e.p.id + '/' + e.s.id + '"><small>Module ' + e.p.n + ' · ' + esc(e.p.short) + '</small><b>' + mark(e.s.title.replace(/`/g, '')) + '</b><span>' + mark(snippet(e).replace(/`/g, '')) + '</span></a>').join('') : '<p>Nothing matches. Try fewer or shorter words.</p>');
  curPage = null;
  window.scrollTo(0, 0);
}
$('#search').addEventListener('input', e => { const v = e.target.value.trim(); if (v.length >= 2) search(v); else if (curPage === null) render(); });
$('#search').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; render(); } });

function copyText(text, btn) {
  const done = () => { btn.textContent = 'Copied ✓'; setTimeout(() => { btn.textContent = 'Copy'; }, 1400); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.append(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ } ta.remove(); }
}

/* ---------- events ---------- */
$('#page').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.copy) copyText(CODES[+t.dataset.copy], t);
  else if (t.dataset.studied) {
    const id = t.dataset.studied, on = !studied[id];
    if (on) studied[id] = Date.now(); else delete studied[id];
    store.set('studied', studied);
    t.classList.toggle('on', on); t.setAttribute('aria-pressed', String(on)); t.textContent = on ? '✓ Studied' : 'Mark as studied';
    renderSide(id);
  } else if (t.classList.contains('quiz-o')) {
    const qz = t.closest('.quiz'), ans = +qz.dataset.ans, i = +t.dataset.i;
    qz.querySelectorAll('.quiz-o').forEach(b => { b.classList.remove('right', 'wrong'); if (+b.dataset.i === ans) b.classList.add(i === ans ? 'right' : 'reveal'); });
    if (i !== ans) t.classList.add('wrong');
    const why = qz.querySelector('.quiz-why');
    why.hidden = false;
    why.innerHTML = '<b>' + (i === ans ? 'Correct.' : 'Not quite.') + '</b> ' + why.innerHTML.replace(/^<b>(Correct\.|Not quite\.)<\/b> /, '');
  }
});
const side = $('#side'), scrim = $('#scrim'), menuBtn = $('#menuBtn');
function closeSide() { side.classList.remove('open'); scrim.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); }
menuBtn.addEventListener('click', () => {
  const open = !side.classList.contains('open');
  side.classList.toggle('open', open); scrim.hidden = !open; menuBtn.setAttribute('aria-expanded', String(open));
});
scrim.addEventListener('click', closeSide);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && side.classList.contains('open')) { closeSide(); menuBtn.focus(); }
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); if (innerWidth <= 960 && !side.classList.contains('open')) menuBtn.click(); $('#search').focus(); }
});
window.addEventListener('hashchange', () => { if ($('#search').value.trim().length >= 2) $('#search').value = ''; render(); });
render();

</script>
</body>
</html>
