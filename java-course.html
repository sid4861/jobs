<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Java for DSA</title>
<meta name="description" content="A visual Java course for reading and writing data-structures-and-algorithms code: types, memory, OOP, generics, collections, comparators, linked lists and trees, with animations and quick checks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#f0eee8; --surface-3:#e8e5dc;
  --ink:#1b1b1f; --ink-2:#44444c; --muted:#76767f; --line:#e2dfd6; --line-2:#cfcbc0;
  --accent:#3b5bdb; --accent-2:#2f4ac0; --accent-soft:#e5eaff;
  --c-cur:#c26a00; --c-vis:#3b5bdb; --c-ok:#2b8a3e; --c-bad:#d9363e; --c-spec:#7048e8; --c-teal:#0c8599; --c-pink:#c2255c;
  --f-cur:#ffe6b3; --f-vis:#d9e1ff; --f-ok:#cdeed6; --f-bad:#ffd6d6; --f-spec:#e3d8ff; --f-teal:#cceff4; --f-pink:#ffd6e6;
  --code-bg:#17181c; --code-ink:#e6e6ea; --code-line:#2a2c33;
  --tk:#ff8fab; --ts:#a9e34b; --tn:#ffc078; --tc:#7d8590; --tf:#74c0fc; --tt:#e599f7;
  --shadow:0 1px 2px rgba(20,20,30,.04),0 3px 12px rgba(20,20,30,.05);
  --radius:14px; --nav-h:48px;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Space Grotesk",Inter,ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111215; --surface:#1a1b20; --surface-2:#222329; --surface-3:#2b2d34;
    --ink:#ececf1; --ink-2:#c3c3cc; --muted:#8d8d98; --line:#2d2f37; --line-2:#3a3d46;
    --accent:#7b93ff; --accent-2:#94a7ff; --accent-soft:#232a4a;
    --c-cur:#ffa94d; --c-vis:#7b93ff; --c-ok:#51cf66; --c-bad:#ff6b6b; --c-spec:#b197fc; --c-teal:#3bc9db; --c-pink:#f783ac;
    --f-cur:#3b2a0e; --f-vis:#1f2747; --f-ok:#13301c; --f-bad:#3e1719; --f-spec:#2a2150; --f-teal:#0f3238; --f-pink:#3d1527;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111215; --surface:#1a1b20; --surface-2:#222329; --surface-3:#2b2d34;
  --ink:#ececf1; --ink-2:#c3c3cc; --muted:#8d8d98; --line:#2d2f37; --line-2:#3a3d46;
  --accent:#7b93ff; --accent-2:#94a7ff; --accent-soft:#232a4a;
  --c-cur:#ffa94d; --c-vis:#7b93ff; --c-ok:#51cf66; --c-bad:#ff6b6b; --c-spec:#b197fc; --c-teal:#3bc9db; --c-pink:#f783ac;
  --f-cur:#3b2a0e; --f-vis:#1f2747; --f-ok:#13301c; --f-bad:#3e1719; --f-spec:#2a2150; --f-teal:#0f3238; --f-pink:#3d1527;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.2);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 16px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.68 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input{font:inherit;color:inherit}
code,kbd{font-family:var(--mono);font-size:.88em;font-variant-ligatures:none}
:not(pre)>code{background:var(--surface-2);border:1px solid var(--line);padding:.05em .36em;border-radius:6px;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:292px minmax(0,1fr)}
.side{position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 12px 48px}
.brand{display:block;color:var(--ink);margin:0 8px 14px}
.brand:hover{text-decoration:none}
.brand b{display:block;font:700 19px/1.2 var(--display)}
.brand span{font-size:12.5px;color:var(--muted)}
.search{margin:0 4px}
.search input{width:100%;border:1px solid var(--line-2);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px}
.overall{margin:14px 8px 4px;font-size:12.5px;color:var(--muted)}
.overall b{color:var(--ink);font-weight:600}
.bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c-ok);border-radius:99px;transition:width .3s}
.navg{margin-top:16px}
.navg h4{margin:0 8px 4px;font:600 11px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.navl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 8px;border-radius:8px;color:var(--ink-2);font-size:14px;line-height:1.45}
.navl:hover{background:var(--surface-2);text-decoration:none}
.navl.on{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.navl small{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.navl.done small{color:var(--c-ok)}
.scrim{position:fixed;inset:var(--nav-h) 0 0;background:rgba(10,10,15,.4);z-index:35}
.main{min-width:0}
.page{max-width:920px;margin:0 auto;padding:36px 36px 96px}

/* ---------- page header ---------- */
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.page h1{font:700 clamp(30px,4vw,42px)/1.1 var(--display);margin:10px 0 12px;letter-spacing:-.01em;text-wrap:balance}
.lede{font-size:18px;line-height:1.6;color:var(--ink-2);margin:0 0 18px;max-width:68ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 12px;font-size:13px;color:var(--ink-2)}
.chip b{color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0;border-block:1px solid var(--line);margin:16px 0 22px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:4px 12px;font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent-2)}
.tog{display:inline-flex;gap:7px;align-items:center;font-size:13.5px;color:var(--ink-2);margin-left:auto;cursor:pointer;user-select:none}
.tog input{width:16px;height:16px;accent-color:var(--accent)}
.onpage{margin:0 0 26px}
.onpage b{display:block;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.onpage a{display:inline-block;margin:0 6px 6px 0;padding:2px 10px;border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.onpage a:hover{background:var(--accent-soft);color:var(--accent-2);text-decoration:none}

/* ---------- prose ---------- */
.page h2{font:700 25px/1.25 var(--display);margin:46px 0 14px;letter-spacing:-.005em}
.page h3{font:600 18px/1.35 var(--display);margin:24px 0 8px}
.page h4{font-size:15px;margin:18px 0 6px}
.page p{margin:0 0 14px}
.page ul,.page ol{margin:0 0 14px;padding-left:22px}
.page li{margin:4px 0}
.page li>ul,.page li>ol{margin:4px 0 0}
.callout{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);border-radius:10px;padding:11px 16px;margin:0 0 16px;font-size:15px}
.callout.tip{border-left-color:var(--c-ok)}
.callout.warn{border-left-color:var(--c-bad)}
.callout.note{border-left-color:var(--c-spec)}
.tbl{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.5}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11.5px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}

/* ---------- question cards ---------- */
.q{margin:0 0 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);scroll-margin-top:calc(var(--nav-h) + 16px)}
.q summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:13px 18px;border-radius:var(--radius)}
.q summary::-webkit-details-marker{display:none}
.q summary:hover .qt{color:var(--accent-2)}
.qmark{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 12px var(--mono);background:var(--accent-soft);color:var(--accent-2);margin-top:1px}
.q.is-known .qmark{background:var(--f-ok);color:var(--c-ok)}
.qt{flex:1;min-width:0;font-weight:600;line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.tag{font:600 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:5px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.t-core{background:var(--f-bad);color:var(--c-bad)}
.tag.t-easy{background:var(--f-ok);color:var(--c-ok)}
.tag.t-medium{background:var(--f-cur);color:var(--c-cur)}
.tag.t-hard{background:var(--f-pink);color:var(--c-pink)}
.tag.t-senior{background:var(--f-spec);color:var(--c-spec)}
.tag.t-output{background:var(--f-vis);color:var(--c-vis)}
.tag.t-react{background:var(--f-teal);color:var(--c-teal)}
.q details[open]>summary{border-bottom:1px dashed var(--line-2);border-radius:var(--radius) var(--radius) 0 0}
.qa{padding:16px 20px 4px 56px;min-width:0}
.qfoot{display:flex;justify-content:flex-end;padding:2px 0 14px}
.kn{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.kn input{width:17px;height:17px;accent-color:var(--c-ok);cursor:pointer}
.hide-known .q.is-known{display:none}
.q.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}

/* ---------- code ---------- */
.code{margin:0 0 16px;border-radius:12px;overflow:hidden;background:var(--code-bg);border:1px solid var(--code-line)}
.code-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px 5px 14px;border-bottom:1px solid var(--code-line);font:500 12px var(--mono);color:#9a9aa6}
.ch-r{display:flex;gap:6px}
.code-head button{border:1px solid var(--code-line);background:#23252c;color:#d6d6de;border-radius:6px;padding:2px 10px;font:500 12px var(--mono);cursor:pointer}
.code-head button:hover{border-color:#4a4d57}
.code-head .btn-run{background:#1d3626;border-color:#2c5a3d;color:#a6e9b8}
.code pre{margin:0;padding:13px 16px;overflow-x:auto;color:var(--code-ink);font:13.5px/1.62 var(--mono);tab-size:2}
.code pre code{font-size:inherit}
.tk{color:var(--tk)} .ts{color:var(--ts)} .tn{color:var(--tn)} .tc{color:var(--tc);font-style:italic} .tf{color:var(--tf)} .tt{color:var(--tt)}
.console{border-top:1px solid var(--code-line);background:#0e0f12;padding:8px 14px 10px;font:13px/1.55 var(--mono);color:#cfd3dc;max-height:340px;overflow:auto}
.console .ctitle{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:4px}
.cl{white-space:pre-wrap;word-break:break-word}
.cl::before{content:"› ";color:#5c6370}
.cl.error{color:#ff8787}
.cl.warn{color:#ffd43b}
.cl.muted{color:#7d8590}
.cl.muted::before{content:""}
.runner{position:absolute;width:1px;height:1px;border:0;left:-9999px;top:0}

/* ---------- home ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0 30px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:700 26px/1.2 var(--display)}
.kpi span{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:0 0 12px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink)}
.card:hover{border-color:var(--accent);text-decoration:none}
.card b{font:600 16px/1.3 var(--display)}
.card p{flex:1;font-size:13.5px;line-height:1.5;color:var(--muted);margin:4px 0 10px}
.card small{font:500 11.5px var(--mono);color:var(--muted);margin-top:6px}
.groupt{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}

/* ---------- search & pager ---------- */
.sr{display:block;padding:12px 16px;margin:0 0 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.sr:hover{border-color:var(--accent);text-decoration:none}
.sr small{display:block;font:500 11.5px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.sr b{display:block;font-weight:600;margin:2px 0}
.sr span{display:block;font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr mark{background:var(--f-cur);color:inherit;border-radius:3px;padding:0 1px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:52px;padding-top:20px;border-top:1px solid var(--line)}
.pager a{display:block;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);max-width:48%;color:var(--ink);font-weight:600}
.pager a:hover{border-color:var(--accent);text-decoration:none}
.pager a.next{margin-left:auto;text-align:right}
.pager small{display:block;color:var(--muted);font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.05em}

@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-block}
  .side{position:fixed;left:0;top:var(--nav-h);bottom:0;height:auto;width:min(320px,86vw);z-index:40;transform:translateX(-105%);transition:transform .2s ease}
  .side.open{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .page{padding:26px 16px 72px}
  .qa{padding:14px 14px 2px}
  .q summary{padding:12px 14px;flex-wrap:wrap}
  .tags{max-width:none;width:100%;justify-content:flex-start;padding-left:38px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:960px){.side:not(.open){visibility:hidden;transition:transform .2s ease,visibility 0s .2s}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.side{transition:none!important}.q.flash{animation:none}}

/* ===== study guides & animations ===== */
/* ===== study guides: mode tabs, figures, animations ===== */
.modetabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 22px}
.mt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;color:var(--ink);transition:border-color .15s,background .15s,box-shadow .15s}
.mt:hover{border-color:var(--accent);text-decoration:none}
.mt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow)}
.mt-ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent-2)}
.mt.on .mt-ic{background:var(--accent);color:#fff}
.mt-ic svg{width:18px;height:18px}
.mt b{display:block;font:600 15.5px/1.25 var(--display)}
.mt small{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.callout.key{border-left-color:var(--c-teal);background:color-mix(in srgb,var(--f-teal) 35%,var(--surface))}
.guide-intro{border:1px solid var(--line);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%);border-radius:14px;padding:14px 18px;margin:0 0 22px;font-size:15px}
.guide-foot{margin-top:40px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.guide-foot p{margin:0;color:var(--ink-2);font-size:15px}
.gf-act{display:flex;gap:8px;flex-wrap:wrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);color:#fff}
.btn.studied{background:var(--c-ok);border-color:var(--c-ok);color:#fff}
.navl .gd{font-style:normal;font-size:10px;color:var(--line-2);margin-right:6px}
.navl .gd.ok{color:var(--c-ok)}
.sr.guide small{color:var(--c-teal)}

/* figures */
.fig{margin:4px 0 20px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption,.fig .cap{font-size:13px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}
.s-box{fill:var(--surface);stroke:var(--line-2);stroke-width:1.6}
.s-box2{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.3}
.s-acc{fill:var(--f-vis);stroke:var(--c-vis);stroke-width:1.8}
.s-ok{fill:var(--f-ok);stroke:var(--c-ok);stroke-width:1.8}
.s-cur{fill:var(--f-cur);stroke:var(--c-cur);stroke-width:1.8}
.s-bad{fill:var(--f-bad);stroke:var(--c-bad);stroke-width:1.8}
.s-spec{fill:var(--f-spec);stroke:var(--c-spec);stroke-width:1.8}
.s-teal{fill:var(--f-teal);stroke:var(--c-teal);stroke-width:1.8}
.s-pink{fill:var(--f-pink);stroke:var(--c-pink);stroke-width:1.8}
.s-line{stroke:var(--line-2);stroke-width:1.8;fill:none}
.s-lA{stroke:var(--c-vis);stroke-width:2;fill:none}
.s-lO{stroke:var(--c-cur);stroke-width:2;fill:none}
.s-lG{stroke:var(--c-ok);stroke-width:2;fill:none}
.s-lR{stroke:var(--c-bad);stroke-width:2;fill:none}
.s-lS{stroke:var(--c-spec);stroke-width:2;fill:none}
.s-lT{stroke:var(--c-teal);stroke-width:2;fill:none}
.s-dash{stroke-dasharray:5 5}
.s-t{font:600 13px var(--mono);fill:var(--ink)}
.s-tb{font:700 14px var(--display);fill:var(--ink)}
.s-ts{font:500 11px var(--mono);fill:var(--muted)}
.s-tl{font:500 12.5px var(--sans);fill:var(--ink-2)}
.s-tA{font:700 12px var(--mono);fill:var(--c-vis)}
.s-tO{font:700 12px var(--mono);fill:var(--c-cur)}
.s-tG{font:700 12px var(--mono);fill:var(--c-ok)}
.s-tR{font:700 12px var(--mono);fill:var(--c-bad)}
.s-tS{font:700 12px var(--mono);fill:var(--c-spec)}
.s-tT{font:700 12px var(--mono);fill:var(--c-teal)}
.s-fA{fill:var(--c-vis)}.s-fO{fill:var(--c-cur)}.s-fG{fill:var(--c-ok)}.s-fR{fill:var(--c-bad)}.s-fS{fill:var(--c-spec)}.s-fT{fill:var(--c-teal)}.s-fM{fill:var(--line-2)}
.a-dash{stroke-dasharray:6 6;animation:vz-flow 1.1s linear infinite}
.a-pulse{animation:vz-pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a-float{animation:vz-float 3s ease-in-out infinite}
@keyframes vz-flow{to{stroke-dashoffset:-24}}
@keyframes vz-pulse{50%{opacity:.55;transform:scale(1.06)}}
@keyframes vz-float{50%{transform:translateY(-4px)}}

/* animation shell */
.vz{margin:6px 0 24px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;min-width:0}

## How to use this course

- **Go in order the first time.** Each module builds on the previous one. Modules 1–5 are the core language, 6–8 how data sits in memory, 9–13 object-oriented Java, 14–18 the collections every DSA solution uses, and 19–20 put it all together on real solution code.
- **Play every animation.** They show what the JVM actually does: frames on the stack, objects on the heap, bits in an int, buckets in a HashMap. Use ▶ to play, ❮ ❯ to step, and the speed slider to slow down.
- **Answer the quick checks** before revealing the answer. They target the mistakes people actually make.
- **Type the code yourself.** Paste any snippet into [JShell](https://docs.oracle.com/en/java/javase/21/jshell/introduction-jshell.html) (run `jshell` in a terminal after installing a JDK), an IDE, or an online Java compiler, and change it.
- **Mark modules as studied** at the bottom of each page to track your progress in the sidebar.
- **Search** (press `/`) finds any topic, method name or keyword across all modules.

## What you'll be able to read

Every Java solution in the Data structures prep page uses a small, predictable subset of Java. By the end of this course, a snippet like this will read like plain English:

```java Typical DSA solution
import java.util.*;

class Solution {
    public int[][] merge(int[][] intervals) {
        Arrays.sort(intervals, (a, b) -> Integer.compare(a[0], b[0]));   // sort by start
        List<int[]> out = new ArrayList<>();
        for (int[] cur : intervals) {
            if (out.isEmpty() || out.get(out.size() - 1)[1] < cur[0]) {
                out.add(cur);                                              // no overlap
            } else {
                int[] last = out.get(out.size() - 1);
                last[1] = Math.max(last[1], cur[1]);                       // extend
            }
        }
        return out.toArray(new int[0][]);
    }
}
```

|---|---|
| `import java.util.*;`, `class Solution`, `public` | 1 · How Java runs, 9 · Classes |
| `int[][]`, `int[] cur`, indexing `[0]` | 6 · Arrays |
| `Arrays.sort(…, (a, b) -> …)` | 13 · Lambdas & comparators |
| `List<int[]>`, `new ArrayList<>()` | 11 · Generics, 14 · Lists |
| `for (int[] cur : intervals)` | 4 · Control flow |
| `out.get(...)[1] = …` changing the list's array | 7 · References |
| `Math.max`, `Integer.compare` | 3 · Operators, 13 · Comparators |

<script type="text/x-jc" id="m-run" data-part="Part 1 · Core language" data-title="How Java runs your code" data-short="How Java runs" data-lede="The JDK, the JVM, compiling vs running, the shape of a Java program, and the main method. Why every solution starts with `class Solution`.">
## Compile once, run anywhere

Java is a **compiled, statically typed** language that runs on a **virtual machine**. Unlike JavaScript or Python, your code goes through two stages:

1. **Compile** (`javac`): the compiler reads `.java` source files, checks every type, and produces `.class` files containing **bytecode**.
2. **Run** (`java`): the **JVM** (Java Virtual Machine) loads the bytecode and executes it, compiling hot code into native machine code on the fly (the JIT compiler).

:::viz jvmflow

| Term | What it is |
|---|---|
| **JDK** (Java Development Kit) | Everything a developer needs: `javac`, `java`, `jshell`, `javap`, plus the JRE |
| **JRE** (Java Runtime Environment) | The JVM plus the standard library (`java.util`, `java.lang`, …) |
| **JVM** (Java Virtual Machine) | The program that runs bytecode: class loading, the interpreter, the JIT, the garbage collector |
| **Bytecode** | Platform-independent instructions in `.class` files |

> **Key idea:** Because the compiler checks types **before** the program runs, many bugs that would crash a JavaScript program at runtime are compile errors in Java. The price is that you must declare types everywhere.

## The shape of a Java program

Everything in Java lives inside a **class**. There are no free-floating functions. A runnable program needs a class with a `main` method:

```java Main.java
// A comment until the end of the line
/* A block comment
   over several lines */
import java.util.ArrayList;     // bring a class from another package into scope
import java.util.*;             // or everything in java.util

public class Main {             // the file must be named Main.java
    public static void main(String[] args) {   // the program starts here
        int x = 2 + 3;          // every statement ends with a semicolon
        System.out.println("x is " + x);
    }
}
```

```output
x is 5
```

Reading the `main` signature word by word:

| Part | Meaning |
|---|---|
| `public` | Callable from outside the class (the JVM needs to call it) |
| `static` | Belongs to the class, so no object has to be created first |
| `void` | Returns nothing |
| `main` | The name the JVM looks for |
| `String[] args` | Command-line arguments, as an array of strings |

**Braces `{ }`** group statements into blocks (class body, method body, loop body). **Semicolons** end statements. Java is **case-sensitive**: `String` and `string` are different, and only the first exists.

## Why DSA solutions start with `class Solution`

Online judges (LeetCode and similar) and the Data structures prep page use this shape:

```java
class Solution {
    public int maxProfit(int[] prices) {
        // your code
        return 0;
    }
}
```

There's no `main`: the judge's own code creates `new Solution()` and calls your method with test inputs. The method is an **instance method** (no `static`), which is why you can call your own helpers directly.

> **In DSA code:** When you want to try a solution yourself, add a `main` that calls it:
> `public static void main(String[] args) { System.out.println(new Solution().maxProfit(new int[]{7, 1, 5, 3, 6, 4})); }`

## Packages and imports

Classes are grouped into **packages**, named like reversed domains (`java.util`, `java.lang`). `import` lets you write the short name:

- `java.lang` is imported automatically: `String`, `Math`, `Integer`, `System`, `StringBuilder`, `Character`.
- Almost everything else DSA code uses is in **`java.util`**: `ArrayList`, `List`, `HashMap`, `Map`, `HashSet`, `ArrayDeque`, `Deque`, `Queue`, `PriorityQueue`, `TreeMap`, `Arrays`, `Collections`. That is why solutions start with `import java.util.*;`.

## Printing

```java
System.out.println("hello");          // prints and adds a newline
System.out.print("no newline");
System.out.println(42 + " items");    // + with a String concatenates
System.out.printf("%d items, %.2f avg%n", 3, 2.5);   // formatted: 3 items, 2.50 avg
System.out.println(Arrays.toString(new int[]{1, 2}));      // [1, 2]
System.out.println(Arrays.deepToString(new int[][]{{1}, {2}}));  // [[1], [2]]
```

> **Pitfall:** `System.out.println(arr)` on an array prints something like `[I@1b6d3586` (its type and a hash), not the contents. Use `Arrays.toString(arr)`.

:::quiz
Q: A judge says "error: cannot find symbol: class ArrayList". What is most likely missing?
- A semicolon after the class declaration
- [x] `import java.util.ArrayList;` (or `import java.util.*;`)
- The `static` keyword on the method
- A `main` method
> `ArrayList` lives in the `java.util` package, which is not imported automatically. Only `java.lang` (String, Math, Integer…) is.
:::

:::quiz
Q: Which of these errors is caught by `javac`, before the program runs?
- Dividing an int by zero
- An array index that is out of bounds
- [x] Assigning a `String` to an `int` variable
- Calling a method on a variable that is null
> Type errors are compile-time errors. The other three only happen with particular values, so they are runtime exceptions.
:::
</script>
<script type="text/x-jc" id="m-types" data-part="Part 1 · Core language" data-title="Variables and primitive types" data-short="Variables &amp; types" data-lede="Declaring variables, the 8 primitive types, literals, `final`, `var`, casting, and the overflow bugs that `long` fixes.">
## Declaring variables

Every variable has a **type** that never changes. You declare it once, then assign to it:

```java
int count;              // declaration
count = 0;              // assignment
int total = 10;         // declaration + initialisation
int a = 1, b = 2;       // several of the same type
final int MOD = 1_000_000_007;   // final: can't be reassigned (a constant)
var list = new ArrayList<Integer>();  // var: the compiler infers the type (Java 10+)
```

- Names are **camelCase** for variables and methods (`maxSoFar`), **PascalCase** for classes (`ListNode`), and **UPPER_SNAKE** for constants (`MAX_N`).
- `var` only works for local variables with an initialiser. The type is still fixed: `var x = 5;` makes `x` an `int` forever.
- A **local variable must be assigned before it's read**: `int x; System.out.println(x);` is a compile error. Fields and array elements get default values; locals don't.

## The 8 primitive types

Java has exactly eight **primitive** types. They hold values directly. Everything else (String, arrays, lists, your own classes) is an **object** reached through a reference (module 7).

:::viz primitives

| Type | Size | Range | Default | Use it for |
|---|---|---|---|---|
| `int` | 32 bits | about ±2.1 × 10⁹ | `0` | almost every whole number: indexes, counts, values |
| `long` | 64 bits | about ±9.2 × 10¹⁸ | `0L` | sums, products, timestamps, anything that can exceed 2³¹ |
| `double` | 64 bits | ±1.8 × 10³⁰⁸, ~15 digits | `0.0` | averages, ratios, geometry |
| `boolean` | – | `true` / `false` | `false` | flags, `visited[]` arrays |
| `char` | 16 bits | `'\u0000'`..`'￿'` | `'\u0000'` | single characters (it's an unsigned number) |
| `byte`, `short`, `float` | 8, 16, 32 bits | small | 0 | rarely in DSA |

### Literals

```java
int dec = 42, hex = 0xFF, bin = 0b1010, big = 1_000_000;   // underscores for readability
long l = 10_000_000_000L;      // L suffix: without it, the number is an int literal and won't compile
double d = 3.14, e = 1e9;      // 1e9 is a double (1000000000.0), not an int!
float f = 2.5f;
char c = 'a', nl = '\n', tab = '\t', quote = '\'';   // single quotes for char
String s = "text";             // double quotes for String
boolean ok = true;
```

> **Pitfall:** `int INF = 1e9;` doesn't compile because `1e9` is a double. Write `int INF = 1_000_000_000;` or `(int) 1e9`. Many solutions use `Integer.MAX_VALUE` as "infinity", but then `INF + 1` overflows. A common safe choice is `Integer.MAX_VALUE / 2`.

## Type conversion and casting

**Widening** (to a bigger type) happens automatically. **Narrowing** needs an explicit **cast** and can lose information:

```java
int i = 100;
long big = i;              // widening: automatic
double d = i;              // 100.0
int back = (int) 3.99;     // narrowing cast: 3 (truncates toward zero)
int fromLong = (int) 5_000_000_000L;   // 705032704: keeps only the low 32 bits
char c = (char) 98;        // 'b'
int code = 'b';            // 98: char widens to int automatically
long product = (long) a * b;  // cast BEFORE multiplying to avoid int overflow
```

The order of widening is: `byte → short → int → long → float → double`, and `char → int`.

## Overflow: the silent bug

`int` arithmetic that exceeds the range **wraps around** without any error. This is the most common correctness bug in Java DSA code:

```java
int a = 100_000, b = 100_000;
int bad = a * b;            // 1410065408 (garbage)
long stillBad = a * b;      // also 1410065408: multiplied as ints, THEN widened
long good = (long) a * b;   // 10000000000
int mid = lo + (hi - lo) / 2;   // instead of (lo + hi) / 2, which can overflow
```

> **Rule of thumb:** If a value can exceed about 2 billion (sums of large arrays, products, counts of pairs, factorials, combinations), use `long` from the start. Problems that say "return the answer modulo 10⁹ + 7" are warning you about overflow: take `% MOD` after every addition and multiplication, and do the multiplication in `long`.

## Useful constants and wrapper helpers

```java
Integer.MAX_VALUE   //  2147483647
Integer.MIN_VALUE   // -2147483648
Long.MAX_VALUE      //  9223372036854775807
Double.MAX_VALUE, Double.POSITIVE_INFINITY
Integer.parseInt("123")      // String → int (throws NumberFormatException if invalid)
Integer.toString(123), String.valueOf(123)   // int → String
Integer.toBinaryString(10)   // "1010"
Integer.bitCount(10)         // 2 (number of 1 bits)
Math.abs(Integer.MIN_VALUE)  // still -2147483648! (its positive value doesn't fit)
```

:::quiz
Q: What does `long x = 50_000 * 50_000;` store?
- 2500000000
- [x] -1794967296
- A compile error
- An ArithmeticException is thrown
> Both literals are `int`, so the multiplication happens in 32-bit arithmetic and overflows before the result is widened to `long`. Write `50_000L * 50_000`.
:::

:::quiz
Q: Which declaration compiles?
- `int big = 3_000_000_000;`
- `long x = 3_000_000_000;`
- [x] `long x = 3_000_000_000L;`
- `int inf = 1e9;`
> An integer literal without `L` must fit in an int. `3_000_000_000` doesn't, so it needs the `L` suffix. `1e9` is a double literal.
:::
</script>
<script type="text/x-jc" id="m-operators" data-part="Part 1 · Core language" data-title="Operators and expressions" data-short="Operators" data-lede="Arithmetic, integer division and remainder, increments, comparison and logical operators, the ternary operator, bitwise operators and shifts, and the `Math` helpers DSA code leans on.">
## Arithmetic

| Operator | Meaning | Example | Result |
|---|---|---|---|
| `+ - *` | add, subtract, multiply | `7 * 3` | `21` |
| `/` | divide (**integer division** if both sides are integers) | `7 / 2` | `3` |
| `%` | remainder (sign follows the left operand) | `-7 % 3` | `-1` |
| `++` / `--` | add / subtract 1 | `i++` | |
| `+= -= *= /= %=` | compound assignment | `sum += x` | |

If either operand is a `double`, the other is **promoted** and you get floating-point arithmetic: `7 / 2.0` is `3.5`. If both are `int`, the result is an `int`, truncated toward zero. `long` wins over `int` the same way.

:::viz operators

> **Idiom:** `avg = (double) sum / n;` casts first so the division is floating-point. `(double) (sum / n)` is wrong: the integer division already happened.

### `i++` vs `++i`

Both add 1 to `i`. The difference is the value of the **expression**: `i++` evaluates to the old value, `++i` to the new one. On its own line (`i++;`, or in a for loop header) there is no difference. It matters inside bigger expressions, such as `arr[size++] = x;` (write at the current size, then grow), which is common in stack implementations.

## Comparison and logical operators

```java
a == b   a != b   a < b   a <= b   a > b   a >= b    // produce a boolean
!done                      // NOT
x > 0 && x < 10            // AND: short-circuits (stops at the first false)
i < 0 || i >= n            // OR: short-circuits (stops at the first true)
```

Short-circuiting is relied on everywhere for safety: in `node != null && node.val == target`, the right side only runs when the node exists, and in `i >= 0 && a[i] > x` the index is checked before it's used.

> **Pitfall:** `==` on objects (Strings, Integers, arrays, lists) compares **references**, not contents. It's only correct for primitives. Module 8 covers `equals`.

## The ternary operator

`condition ? valueIfTrue : valueIfFalse` is an expression, so it can be assigned or returned:

```java
int abs = x < 0 ? -x : x;
String label = count == 1 ? "item" : "items";
return left > right ? left : right;
```

## Operator precedence (the short version)

From tightest to loosest: postfix `x++` → unary `++x -x !` → casts → `* / %` → `+ -` → shifts `<< >> >>>` → comparisons `< > <= >=` → equality `== !=` → bitwise `&` → `^` → `|` → `&&` → `||` → ternary `?:` → assignment `= += …`. When in doubt, add parentheses. Two classic traps:

- `a & 1 == 0` parses as `a & (1 == 0)`, which doesn't compile. Write `(a & 1) == 0`.
- `1 << n - 1` is `1 << (n - 1)` because `-` binds tighter than `<<`.

## Bitwise operators and shifts

Bit manipulation shows up in subset enumeration, XOR tricks, bitmask DP and fast power-of-two maths:

:::viz bits

| Expression | Meaning |
|---|---|
| `x & 1` | 1 if x is odd |
| `x >> 1`, `x << 1` | x / 2 (rounding down), x × 2 |
| `1 << k` | 2ᵏ, or a mask with only bit k set |
| `(mask >> i) & 1` or `(mask & (1 << i)) != 0` | is bit i set? |
| `mask \| (1 << i)` | set bit i |
| `mask & ~(1 << i)` | clear bit i |
| `x & (x - 1)` | drop the lowest set bit (0 means x was a power of two) |
| `a ^ b ^ b` | `a`: XOR cancels pairs |
| `1L << 40` | use a long when shifting past bit 30 |

## The `Math` class

```java
Math.max(a, b)   Math.min(a, b)        // used constantly: best = Math.max(best, cur);
Math.abs(x)      Math.pow(2, 10)       // pow returns a double (1024.0)
Math.sqrt(x)     Math.floor(d)  Math.ceil(d)  Math.round(d)
Math.floorMod(a, n)                    // modulo that's never negative for positive n
Math.floorDiv(a, b)                    // division rounding down, even for negatives
Math.max(Math.max(a, b), c)            // max of three
(a + b - 1) / b                        // ceil(a / b) for positive ints, without doubles
```

:::quiz
Q: `int i = 3; int x = i++ + ++i;` What is x?
- 7
- [x] 8
- 9
- 6
> `i++` evaluates to 3 (i becomes 4), then `++i` makes i 5 and evaluates to 5. 3 + 5 = 8. Code like this is legal but confusing; don't write it, just learn to read it.
:::

:::quiz
Q: Which expression safely checks that index `i` is valid before reading `a[i]`?
- `a[i] > 0 && i < a.length`
- [x] `i < a.length && a[i] > 0`
- `a[i] > 0 & i < a.length`
- All three are equivalent
> `&&` evaluates left to right and stops early, so the bounds check must come first. The single `&` evaluates both sides, so it would still read out of bounds.
:::
</script>
<script type="text/x-jc" id="m-control" data-part="Part 1 · Core language" data-title="Control flow" data-short="Control flow" data-lede="if/else, switch (classic and modern), for, while and do-while loops, the for-each loop, break, continue, labelled breaks, and variable scope.">
## if / else

```java
if (x > 0) {
    System.out.println("positive");
} else if (x < 0) {
    System.out.println("negative");
} else {
    System.out.println("zero");
}
if (n == 0) return 0;     // braces are optional for a single statement (common in DSA code)
```

The condition **must be a boolean**. `if (n)` doesn't compile in Java, unlike C or JavaScript, and `if (x = 5)` is caught too. That rules out a whole class of bugs.

## switch

```java
// classic switch: falls through to the next case without break
switch (op) {
    case '+': result = a + b; break;
    case '-': result = a - b; break;
    case '*':
    case 'x': result = a * b; break;      // two labels share a branch
    default: throw new IllegalArgumentException("bad op " + op);
}

// modern switch expression (Java 14+): no fall-through, returns a value
int result2 = switch (op) {
    case '+' -> a + b;
    case '-' -> a - b;
    case '*', 'x' -> a * b;
    default -> throw new IllegalArgumentException("bad op " + op);
};
```

`switch` works on `int`, `char`, `String` and enums (and patterns in newer Java). In a classic switch, a missing `break` silently runs the next case.

## Loops

:::viz loops

```java
for (int i = 0; i < n; i++) { ... }          // count up: init; condition; update
for (int i = n - 1; i >= 0; i--) { ... }     // count down
for (int i = 0, j = n - 1; i < j; i++, j--)  // two variables (two pointers)
while (lo <= hi) { ... }                     // repeat while a condition holds
do { ... } while (cond);                     // body runs at least once
for (int x : nums) { ... }                   // for-each over an array or a collection
for (int[] edge : edges) { ... }             // each element is itself an int[]
for (Map.Entry<String, Integer> e : map.entrySet()) { ... }
```

| Loop | Use it when |
|---|---|
| `for (int i…)` | you need the index, or to step in a particular way (by 2, backwards, from 1) |
| for-each | you only need each value, in order |
| `while` | you don't know the number of iterations: two pointers, binary search, BFS until the queue is empty |
| `do … while` | the body must run once before the check (rare) |

> **Pitfall:** In a for-each loop, the loop variable is a **copy** for primitives: `for (int x : a) x = 0;` does not change the array. Also, never add to or remove from a collection while iterating it with for-each: Java throws `ConcurrentModificationException`. Use an index loop, an `Iterator` with `it.remove()`, or `removeIf`.

## break, continue and labels

- `break` leaves the innermost loop (or switch).
- `continue` skips to the next iteration of the innermost loop.
- A **label** lets you break out of an outer loop directly, which is handy in grid searches:

```java
outer:
for (int r = 0; r < rows; r++) {
    for (int c = 0; c < cols; c++) {
        if (grid[r][c] == target) {
            foundR = r; foundC = c;
            break outer;          // leaves BOTH loops
        }
    }
}
```

## Scope

A variable exists from its declaration to the end of the **block** `{ }` it's declared in. A loop variable declared in a `for` header exists only inside the loop. You can't redeclare a name that's still in scope in the same method:

```java
int i = 5;
for (int i = 0; i < 3; i++) { }   // compile error: i is already defined
for (int j = 0; j < 3; j++) { }
System.out.println(j);            // compile error: j is out of scope
```

> **Idiom:** When you need the loop index after the loop (where did it stop?), declare it before the loop: `int i = 0; while (i < n && a[i] != target) i++;`

:::quiz
Q: How many times does the body run? `for (int i = 10; i > 0; i -= 3) { ... }`
- 3
- [x] 4
- 10
- It never stops
> i takes the values 10, 7, 4, 1 (the body runs 4 times), then becomes -2 and the condition fails.
:::

:::quiz
Q: After `int[] a = {1, 2, 3}; for (int x : a) x *= 2;` what is `a`?
- {2, 4, 6}
- [x] {1, 2, 3}
- A compile error
- {1, 2, 3, 2, 4, 6}
> The loop variable `x` is a copy of each element. Changing it doesn't touch the array. Use `for (int i = 0; i < a.length; i++) a[i] *= 2;` instead.
:::
</script>
<script type="text/x-jc" id="m-methods" data-part="Part 1 · Core language" data-title="Methods and recursion" data-short="Methods &amp; recursion" data-lede="Defining methods, parameters and return types, overloading, static vs instance methods, helper methods, recursion and the call stack.">
## Anatomy of a method

```java
//  modifiers   return type  name      parameters (type name, ...)
    public      int          maxOf(    int[] a, int from) {
        int best = a[from];
        for (int i = from + 1; i < a.length; i++) best = Math.max(best, a[i]);
        return best;            // must return an int on every path
    }
```

- The **return type** comes before the name. `void` means nothing is returned (a bare `return;` exits early).
- Every **parameter** has a type. Java has no default parameter values; overloading is used instead.
- The compiler checks that every path returns a value of the right type: "missing return statement" is a compile error.
- **Access modifiers**: `public` (anyone), `private` (only this class), none (same package), `protected` (package + subclasses). DSA helpers are usually `private`.

## Overloading

Several methods can share a name if their **parameter lists differ**. The compiler picks one from the argument types:

```java
int add(int a, int b)            { return a + b; }
long add(long a, long b)         { return a + b; }
int add(int a, int b, int c)     { return a + b + c; }
```

You'll see this in solutions as a public method plus a private helper with extra parameters:

```java
public int maxDepth(TreeNode root) { return depth(root, 0); }
private int depth(TreeNode node, int d) { ... }
```

## static vs instance methods

| | `static` method | instance method |
|---|---|---|
| Belongs to | the class | an object |
| Called as | `Math.max(a, b)`, `Solution.helper()` | `list.add(x)`, `sb.append(c)` |
| Can use `this` and instance fields? | no | yes |
| Typical use | utilities, `main`, pure helpers | behaviour that depends on an object's state |

Inside `class Solution`, instance methods can call each other and read **fields** shared across the recursion, like a counter or a memo table:

```java
class Solution {
    private int count = 0;                 // a field: shared by every method call on this object
    public int countNodes(TreeNode root) { visit(root); return count; }
    private void visit(TreeNode n) {
        if (n == null) return;
        count++;
        visit(n.left);
        visit(n.right);
    }
}
```

## Recursion and the call stack

A method that calls itself is **recursive**. Every call gets its own **stack frame** holding its own parameters and local variables. When a call returns, its frame is popped and the caller continues where it left off.

:::viz jrecursion

Every recursive method needs:

1. **A base case** that returns without recursing (`if (n <= 1) return 1;`, `if (node == null) return 0;`).
2. **Progress**: each recursive call works on a smaller problem, so it eventually reaches the base case.

```java
// Recursion on arrays usually passes an index instead of copying the array
boolean contains(int[] a, int i, int target) {
    if (i == a.length) return false;          // base case: ran off the end
    if (a[i] == target) return true;
    return contains(a, i + 1, target);        // smaller problem: the rest of the array
}
```

> **Watch out:** Each frame uses stack memory. Java's default stack allows roughly 10,000–20,000 frames for simple methods, so recursing once per element of a 100,000-element list throws **StackOverflowError**. For deep inputs use iteration with an explicit `Deque` as the stack.

### Memoisation preview

The `fib` tree above recomputes the same calls many times. Caching results turns exponential time into linear time, which is the heart of dynamic programming:

```java
long[] memo = new long[n + 1];
Arrays.fill(memo, -1);                       // -1 means "not computed yet"
long fib(int n) {
    if (n < 2) return n;
    if (memo[n] != -1) return memo[n];
    return memo[n] = fib(n - 1) + fib(n - 2);   // assignment is an expression: store and return
}
```

## Parameters are copies

Java passes every argument **by value**: the method gets a copy. For primitives that's a copy of the number; for objects it's a copy of the **reference**. Module 7 animates exactly what that means.

:::quiz
Q: What happens when this runs? `int f(int n) { return n * f(n - 1); }` called as `f(5)`
- It returns 120
- It returns 0
- [x] It throws StackOverflowError
- It doesn't compile
> There's no base case, so the recursion never stops until the stack runs out of space.
:::

:::quiz
Q: Inside `class Solution`, a `static` helper method tries to read a non-static field `count`. What happens?
- It reads the field normally
- [x] Compile error: non-static variable cannot be referenced from a static context
- It reads 0
- It throws NullPointerException
> A static method has no `this` object, so it can't see instance fields. Make the helper non-static, make the field static, or pass the value as a parameter.
:::
</script>
<script type="text/x-jc" id="m-arrays" data-part="Part 2 · Data in memory" data-title="Arrays" data-short="Arrays" data-lede="Creating and indexing arrays, default values, `length`, 2D and jagged arrays, copying, and the `Arrays` utility class. The single most used data structure in DSA solutions.">
## Creating arrays

An array is a **fixed-size** sequence of elements of one type, indexed from 0. Its size is set when it's created and never changes.

```java
int[] a = new int[5];              // [0, 0, 0, 0, 0]: elements start at their default
int[] b = {3, 1, 4, 1, 5};         // array literal (only in a declaration)
int[] c = new int[]{3, 1, 4};      // literal anywhere, e.g. return new int[]{i, j};
String[] names = new String[3];    // [null, null, null]
boolean[] seen = new boolean[n];   // all false
char[] cs = "hello".toCharArray();

a[0] = 7;                          // write
int first = a[0];                  // read
int n = a.length;                  // a field, not a method: no parentheses
int last = a[a.length - 1];
```

| Element type | Default value |
|---|---|
| `int`, `long`, `short`, `byte` | `0` |
| `double`, `float` | `0.0` |
| `boolean` | `false` |
| `char` | `'\u0000'` |
| any object type (String, Integer, int[], ListNode…) | `null` |

> **Pitfall:** Reading or writing `a[a.length]` (or a negative index) throws **ArrayIndexOutOfBoundsException**. Valid indexes are `0` to `length - 1`. Loops therefore use `i < a.length`, not `<=`.

## Arrays are objects

An array variable holds a **reference** to the array on the heap. Assigning it doesn't copy the elements, and passing it to a method lets the method change the caller's array. Module 7 shows this in detail; for now remember:

```java
int[] x = {1, 2, 3};
int[] y = x;          // same array, two names
y[0] = 99;            // x[0] is now 99 too
int[] z = x.clone();  // a real (shallow) copy
x == z                // false: different objects
Arrays.equals(x, z)   // true: same contents
```

## 2D arrays

A 2D array in Java is an **array of arrays**: the outer array holds references to row arrays.

:::viz array2d

```java
int[][] grid = new int[rows][cols];          // rectangular, all zeros
int[][] dirs = {{0, 1}, {1, 0}, {0, -1}, {-1, 0}};   // the classic 4-direction array
int R = grid.length, C = grid[0].length;     // rows, columns

for (int[] d : dirs) {                       // visit the 4 neighbours of (r, c)
    int nr = r + d[0], nc = c + d[1];
    if (nr < 0 || nr >= R || nc < 0 || nc >= C) continue;   // stay inside the grid
    // ... use grid[nr][nc]
}

int[][] jagged = new int[3][];               // rows not allocated yet (null)
jagged[0] = new int[]{1};
jagged[1] = new int[]{1, 1};
List<int[]>[] graph = new List[n];           // array of lists: an adjacency list (see module 11)
```

> **In DSA code:** `int[][] dp = new int[n + 1][m + 1];` is the standard DP table, and `int[]` pairs like `new int[]{row, col}` or `{value, index}` are used as lightweight tuples inside queues and priority queues.

## The `Arrays` utility class

`java.util.Arrays` has static helpers for everything you'd otherwise loop over by hand:

| Method | What it does | Cost |
|---|---|---|
| `Arrays.sort(a)` | sort ascending (primitives: dual-pivot quicksort) | O(n log n) |
| `Arrays.sort(a, from, to)` | sort the range [from, to) | |
| `Arrays.sort(objs, comparator)` | sort objects/int[] rows with a custom order (module 13) | O(n log n), stable |
| `Arrays.fill(a, -1)` | set every element | O(n) |
| `Arrays.copyOf(a, newLen)` | copy, truncating or padding with defaults | O(n) |
| `Arrays.copyOfRange(a, from, to)` | copy [from, to) | O(n) |
| `Arrays.toString(a)` | `"[1, 2, 3]"` for printing | O(n) |
| `Arrays.deepToString(grid)` | prints 2D arrays | |
| `Arrays.equals(a, b)` | element-by-element comparison | O(n) |
| `Arrays.asList(1, 2, 3)` | a fixed-size List view (module 14) | |
| `Arrays.stream(a).sum()` | sum (also `.max().getAsInt()`, `.boxed()`) | O(n) |
| `Arrays.binarySearch(a, key)` | index of key in a **sorted** array (negative if absent) | O(log n) |
| `System.arraycopy(src, i, dst, j, len)` | fast block copy | O(len) |

```java
int[] dp = new int[n + 1];
Arrays.fill(dp, Integer.MAX_VALUE);   // "infinity" before relaxing
dp[0] = 0;

int[][] memo = new int[n][m];
for (int[] row : memo) Arrays.fill(row, -1);   // fill works on one dimension at a time
```

> **Pitfall:** `Arrays.sort` on an `int[]` can't take a comparator: comparators only work on object arrays. To sort an `int[]` descending, sort ascending and read it backwards, or use `Integer[]`. Sorting `int[][]` rows with a comparator is fine, because each row (`int[]`) is an object.

:::quiz
Q: What does `int[][] g = new int[3][]; g[1][0] = 5;` do?
- Sets row 1, column 0 to 5
- [x] Throws NullPointerException
- Throws ArrayIndexOutOfBoundsException
- Doesn't compile
> Only the outer array was created; its three slots are `null`. `g[1]` is null, so indexing into it throws NullPointerException.
:::

:::quiz
Q: After `int[] a = {5, 3, 8}; int[] b = a; Arrays.sort(b);`, what is `a`?
- {5, 3, 8}
- [x] {3, 5, 8}
- {8, 5, 3}
- null
> `b` and `a` refer to the same array, so sorting through `b` sorts the one array they share. Use `a.clone()` first if you need the original order.
:::
</script>
<script type="text/x-jc" id="m-memory" data-part="Part 2 · Data in memory" data-title="References, the stack and the heap" data-short="References &amp; memory" data-lede="Where variables and objects live, what a reference really is, `null` and NullPointerException, `==` vs `equals`, pass-by-value, and garbage collection. The mental model behind every linked list and tree.">
## Two kinds of memory

When a method runs, the JVM gives it a **stack frame** for its parameters and local variables. Objects (anything created with `new`, including arrays and Strings) live on the **heap**, a big shared area.

- A **primitive** variable (`int`, `double`, `boolean`, `char`…) holds its value directly in the frame.
- An **object** variable holds a **reference**: think of it as an arrow (an address) pointing to the object on the heap. The variable is not the object.

:::viz memory

> **Mental model:** Draw every object variable as a box with an arrow. Assignment (`b = a`) copies the arrow, never the object. `new` is the only thing that creates an object. Almost every linked-list and tree bug is an arrow pointing somewhere you didn't expect.

## null

`null` is a reference that points to nothing. Object fields and array elements start as `null`. Using a null reference (calling a method, reading a field, indexing) throws **NullPointerException**:

```java
ListNode node = null;
node.val = 5;                 // NullPointerException
String s = null;
s.length();                   // NullPointerException
if (node != null && node.val == 5) { ... }   // check first, relying on && short-circuiting
```

Modern JVMs print helpful messages such as `Cannot read field "val" because "node" is null`.

## `==` vs `equals`

| | `==` | `.equals(...)` |
|---|---|---|
| On primitives | compares values ✓ | n/a |
| On objects | **same object?** (reference identity) | **same contents?** (as the class defines it) |

```java
String a = new String("hi"), b = new String("hi");
a == b          // false: two objects
a.equals(b)     // true
int[] x = {1}, y = {1};
x == y          // false
x.equals(y)     // also false! arrays don't override equals
Arrays.equals(x, y)   // true
```

Use `equals` for Strings, wrapper types (Integer, Long…), lists, sets and maps. Use `==` for primitives, and for `null` checks (`node == null`) or when you really mean "the same node" (`slow == fast` in cycle detection).

## Pass-by-value, precisely

Java copies every argument. For an object, the copy is a copy of the reference, so the method and the caller point at the same object:

:::viz passbyvalue

| Inside the method you… | Does the caller see it? |
|---|---|
| change a primitive parameter (`n = 5`) | no |
| change an object's contents through the parameter (`arr[0] = 5`, `list.add(x)`, `node.val = 3`) | **yes** |
| re-point the parameter to a new object (`arr = new int[3]`, `head = head.next`) | no |

That's why recursive helpers can collect answers into a `List<List<Integer>> result` passed as a parameter, while a method that changes which node is the head has to **return** the new head (`head = reverse(head);`).

## Garbage collection

You never free memory in Java. The **garbage collector** finds objects that no variable or other reachable object refers to, and reclaims them. In DSA terms: when you unlink a node (`prev.next = prev.next.next`), the skipped node becomes garbage automatically, as long as nothing else points to it.

## Shallow vs deep copies

```java
int[][] g2 = g.clone();             // SHALLOW: a new outer array, but the rows are shared
int[][] deep = new int[g.length][];
for (int i = 0; i < g.length; i++) deep[i] = g[i].clone();   // deep copy of a 2D array

List<Integer> copy = new ArrayList<>(path);   // new list (Integers are immutable, so this is safe)
result.add(new ArrayList<>(path));            // backtracking: snapshot the current path!
```

> **Pitfall:** In backtracking, `result.add(path);` adds a reference to the one list you keep modifying, so at the end every entry in `result` shows the same (usually empty) list. Always add a copy: `result.add(new ArrayList<>(path));`.

:::quiz
Q: `void f(ListNode head) { head = head.next; }` is called as `f(list)`. What happens to `list` in the caller?
- It now points to the second node
- [x] It still points to the first node
- The first node is deleted
- It becomes null
> The method re-points its own copy of the reference. The caller's variable is untouched. To change the caller's head, return the new head: `list = f(list);`.
:::

:::quiz
Q: Which comparison is correct for two `String` variables `s` and `t`?
- `s == t`
- [x] `s.equals(t)`
- `s = t`
- `s.compareTo(t) == true`
> `==` checks whether they're the same object, which may be false for equal text built at runtime. `equals` compares characters. (`compareTo` returns an int, and is for ordering.)
:::
</script>
<script type="text/x-jc" id="m-strings" data-part="Part 2 · Data in memory" data-title="Strings and characters" data-short="Strings &amp; chars" data-lede="String immutability, the methods DSA code uses, `StringBuilder`, `char` arithmetic, the `int[26]` counting idiom and the `Character` helpers.">
## Strings are immutable objects

A `String` is an object holding a sequence of characters that **can never change**. Every method that seems to modify a string returns a **new** one.

:::viz strings

## The String methods you'll actually use

| Method | Result for `s = "racecar"` | Cost |
|---|---|---|
| `s.length()` | `7` (a method, unlike `array.length`) | O(1) |
| `s.charAt(2)` | `'c'` | O(1) |
| `s.substring(1, 4)` | `"ace"`: from index 1 up to (not including) 4 | O(k) copy |
| `s.substring(3)` | `"ecar"`: from 3 to the end | O(k) |
| `s.indexOf('c')`, `s.indexOf("car")` | `2`, `4` (`-1` if absent) | O(n·m) |
| `s.contains("ace")` | `true` | |
| `s.startsWith("race")`, `s.endsWith("car")` | `true`, `true` | |
| `s.toCharArray()` | `char[]` copy: you can modify and sort it | O(n) |
| `s.equals(t)`, `s.equalsIgnoreCase(t)` | content comparison | O(n) |
| `s.compareTo(t)` | negative / 0 / positive: dictionary order | O(n) |
| `s.split(" ")`, `s.split("\\s+")` | `String[]` of parts (the argument is a regex) | O(n) |
| `s.trim()`, `s.strip()` | without leading/trailing whitespace | |
| `s.toLowerCase()`, `s.toUpperCase()` | new String | O(n) |
| `s.isEmpty()`, `s.isBlank()` | length 0 / only whitespace | |
| `String.valueOf(x)`, `"" + x` | any value as a String | |
| `String.join(",", list)` | `"a,b,c"` | |
| `new String(charArray)` | char[] back to a String | O(n) |
| `s.chars()` | an IntStream of character codes | |

```java
char[] cs = s.toCharArray();
Arrays.sort(cs);
String key = new String(cs);        // "aabbc...": the sorted-letters key for grouping anagrams

String rev = new StringBuilder(s).reverse().toString();
boolean isPal = s.equals(rev);
```

> **Pitfall:** `s.length()` (method) vs `a.length` (array field) vs `list.size()` (collection method). Java uses three different spellings. The compiler will tell you, but it's worth memorising.

## StringBuilder: the mutable string

Building a string with `+=` in a loop copies the whole string every time: O(n²). `StringBuilder` keeps one growing buffer: O(n) overall.

```java
StringBuilder sb = new StringBuilder();
sb.append("abc").append(42).append('x');   // append returns the builder, so calls chain
sb.insert(0, '#');                          // "#abc42x"
sb.setCharAt(1, 'A');                       // "#Abc42x"
sb.deleteCharAt(sb.length() - 1);           // remove last: the "undo" step in backtracking
sb.reverse();
sb.length();  sb.charAt(i);
String result = sb.toString();
```

> **Idiom:** Backtracking over strings: `sb.append(c); dfs(...); sb.deleteCharAt(sb.length() - 1);` (choose, explore, un-choose).

## char is a number

A `char` holds a 16-bit Unicode code unit, and arithmetic on chars produces `int`s. That's what makes letter and digit maths possible:

```java
char c = 'd';
int idx = c - 'a';              // 3: position in the alphabet
char next = (char) (c + 1);     // 'e'
int digit = '7' - '0';          // 7: char digit to its numeric value
char d = (char) ('0' + 5);      // '5'
boolean lower = c >= 'a' && c <= 'z';
```

### Counting with `int[26]`

:::viz charcount

```java
boolean isAnagram(String s, String t) {
    if (s.length() != t.length()) return false;
    int[] count = new int[26];
    for (int i = 0; i < s.length(); i++) {
        count[s.charAt(i) - 'a']++;
        count[t.charAt(i) - 'a']--;
    }
    for (int x : count) if (x != 0) return false;
    return true;
}
```

### The `Character` helpers

```java
Character.isDigit(c)         Character.isLetter(c)      Character.isLetterOrDigit(c)
Character.isUpperCase(c)     Character.toLowerCase(c)   Character.isWhitespace(c)
Character.getNumericValue('7')   // 7
```

## Comparing and ordering strings

`s.compareTo(t)` compares character by character using their codes (so uppercase letters sort before lowercase), and a prefix comes before a longer string: `"app".compareTo("apple") < 0`. Sorting a `String[]` with `Arrays.sort` uses this order.

:::quiz
Q: What does this print? `String s = "abc"; s.toUpperCase(); System.out.println(s);`
- ABC
- [x] abc
- Abc
- A compile error
> Strings are immutable. `toUpperCase()` returns a new String, which is ignored here. Write `s = s.toUpperCase();`.
:::

:::quiz
Q: What is `'z' - 'a' + 1`?
- [x] 26 (an int)
- '{'
- "za1"
- A compile error
> Arithmetic on chars promotes them to int: 122 - 97 + 1 = 26.
:::
</script>
<script type="text/x-jc" id="m-classes" data-part="Part 3 · Object-oriented Java" data-title="Classes and objects" data-short="Classes &amp; objects" data-lede="Fields, constructors, `this`, access modifiers, static members, nested classes, `toString`, and records. Plus the `ListNode`, `TreeNode` and `Node` classes that DSA solutions are built on.">
## A class is a blueprint

A **class** defines a type: what data each object holds (**fields**) and what it can do (**methods**). An **object** (instance) is created from the class with `new`.

:::viz classobj

```java
public class Point {
    // fields: every Point object has its own x and y
    private final int x;
    private final int y;

    // constructor: same name as the class, no return type; runs on `new`
    public Point(int x, int y) {
        this.x = x;            // this.x is the field, x is the parameter
        this.y = y;
    }

    public int distanceTo(Point other) {          // an instance method
        return Math.abs(x - other.x) + Math.abs(y - other.y);
    }

    @Override
    public String toString() { return "(" + x + ", " + y + ")"; }   // used by println
}

Point p = new Point(1, 2);
Point q = new Point(4, 6);
System.out.println(p.distanceTo(q));   // 7
System.out.println(p);                 // (1, 2)
```

- If you write no constructor, Java provides a no-argument one. If you write any constructor, that default disappears.
- **`this`** refers to the current object. It's needed when a parameter has the same name as a field, and to call another constructor: `this(0, 0);`.
- Fields get default values (0, false, null); local variables don't.

## Access modifiers and encapsulation

| Modifier | Visible to |
|---|---|
| `private` | this class only |
| (none) | classes in the same package |
| `protected` | same package + subclasses |
| `public` | everyone |

Good style keeps fields `private` and exposes methods. DSA node classes skip this and use plain fields (`node.next`, `node.val`) for brevity, which is fine for small data holders.

## static members

A `static` field has one copy for the whole class, shared by all objects. A `static` method can be called without an object (`Math.max`). Constants are `static final`: `static final int MOD = 1_000_000_007;`.

## The node classes in DSA code

These definitions are given by the problem and appear above most linked-list and tree solutions:

```java ListNode
public class ListNode {
    int val;
    ListNode next;                       // a reference to another ListNode (or null)
    ListNode() {}
    ListNode(int val) { this.val = val; }
    ListNode(int val, ListNode next) { this.val = val; this.next = next; }
}
```

```java TreeNode
public class TreeNode {
    int val;
    TreeNode left, right;                // two child references
    TreeNode(int val) { this.val = val; }
}
```

A class whose fields refer to its **own type** is what makes linked structures possible: each `ListNode` points to the next one. `new ListNode(1, new ListNode(2, new ListNode(3)))` builds the list 1 → 2 → 3.

```java Graph node with a list of neighbours
class Node {
    public int val;
    public List<Node> neighbors = new ArrayList<>();
    public Node(int val) { this.val = val; }
}
```

## Nested classes

A class defined inside another class is **nested**. Solutions use this to bundle a small helper type with the solution:

```java
class LRUCache {
    private static class Node {          // static nested: doesn't need an LRUCache object
        int key, val;
        Node prev, next;
        Node(int k, int v) { key = k; val = v; }
    }
    private final Map<Integer, Node> map = new HashMap<>();
    private final Node head = new Node(0, 0), tail = new Node(0, 0);   // sentinels
    // ...
}
```

Prefer `static` nested classes unless the nested object needs to access the outer object's fields (a non-static **inner** class carries a hidden reference to its outer object).

## Records: compact data classes

Java 16+ **records** generate the constructor, accessors, `equals`, `hashCode` and `toString` for you, which makes them perfect keys for maps and sets:

```java
record Cell(int r, int c) {}
Set<Cell> visited = new HashSet<>();
visited.add(new Cell(0, 1));
visited.contains(new Cell(0, 1));   // true: records compare by value
Cell cell = new Cell(2, 3);
cell.r();                            // accessor method, not cell.r
```

On older judges, the equivalent trick is encoding a pair into one value: `long key = (long) r * cols + c;` or the string `r + "," + c`.

:::quiz
Q: A class `Box` has a constructor `Box(int w)`. What does `new Box()` do?
- Creates a Box with w = 0
- [x] Compile error: no constructor Box() exists
- Creates a Box with w = null
- Throws an exception at runtime
> Once you define any constructor, Java no longer adds the default no-argument one. You'd have to declare `Box() {}` yourself.
:::

:::quiz
Q: In `ListNode(int val) { val = val; }`, what is wrong?
- Nothing
- [x] It assigns the parameter to itself; the field stays 0. It should be `this.val = val;`
- Constructors can't take parameters
- `val` is a reserved word
> Inside the constructor, the plain name `val` refers to the parameter, which shadows the field. `this.val` refers to the field.
:::
</script>
<script type="text/x-jc" id="m-inheritance" data-part="Part 3 · Object-oriented Java" data-title="Inheritance, interfaces and polymorphism" data-short="Interfaces &amp; inheritance" data-lede="`extends`, `super`, overriding and `@Override`, abstract classes, interfaces, dynamic dispatch, and the `Object` methods (`equals`, `hashCode`, `toString`) that collections rely on. Why you write `List&lt;Integer&gt; list = new ArrayList&lt;&gt;()`.">
## Inheritance with extends

A class can **extend** one other class, inheriting its fields and methods and adding or replacing behaviour:

```java
class Shape {
    double area() { return 0; }
    String name() { return "shape"; }
}
class Circle extends Shape {
    private final double r;
    Circle(double r) { super(); this.r = r; }          // super(...) calls the parent constructor
    @Override double area() { return Math.PI * r * r; } // overrides Shape.area
    @Override String name() { return "circle (" + super.name() + ")"; }  // super.method() calls the parent's version
}
```

- **Overriding** = same method signature in a subclass replaces the parent's behaviour. Add `@Override` so the compiler checks you really did override something (a typo would otherwise create a new method silently).
- **Overloading** = same name, different parameters (module 5). Chosen at compile time.
- Every class implicitly extends **`Object`**, which provides `equals`, `hashCode` and `toString`.
- A class can extend only **one** class, but can implement many interfaces.

## Static type vs runtime type

A variable's declared type can be a supertype of the object it holds. The compiler only lets you call what the **declared** type has; the JVM runs the version from the **actual object's** class. That's **dynamic dispatch**, the core of polymorphism:

:::viz dispatch

## Interfaces

An **interface** is a contract: a list of methods a class promises to provide. It has no fields (except constants), and since Java 8 can include `default` method bodies.

```java
interface Stack2<T> {
    void push(T x);
    T pop();
    boolean isEmpty();
    default T popOrNull() { return isEmpty() ? null : pop(); }   // default method
}

class ArrayStack<T> implements Stack2<T> {
    private final ArrayList<T> items = new ArrayList<>();
    public void push(T x) { items.add(x); }
    public T pop() { return items.remove(items.size() - 1); }
    public boolean isEmpty() { return items.isEmpty(); }
}
```

The interfaces you'll meet constantly in DSA code are the collection types and the ordering contracts:

| Interface | Main implementations | Promise |
|---|---|---|
| `List<E>` | `ArrayList`, `LinkedList` | ordered, indexed |
| `Set<E>` | `HashSet`, `LinkedHashSet`, `TreeSet` | no duplicates |
| `Map<K, V>` | `HashMap`, `LinkedHashMap`, `TreeMap` | key → value |
| `Queue<E>` / `Deque<E>` | `ArrayDeque`, `LinkedList`, `PriorityQueue` (Queue) | FIFO / both ends |
| `Comparable<T>` | `Integer`, `String`, your classes | a natural order: `compareTo` |
| `Comparator<T>` | lambdas | an external order: `compare` |

## Program to the interface

```java
List<Integer> list = new ArrayList<>();        // declared as the interface
Map<String, Integer> freq = new HashMap<>();
Deque<Integer> stack = new ArrayDeque<>();
Queue<int[]> q = new ArrayDeque<>();
```

Declaring the variable with the **interface** type and choosing the implementation with `new` means you can swap `HashMap` for `TreeMap` by changing one word, and methods accept any implementation. It's the standard style, so read the left side to know *what it does* and the right side to know *how it's stored*.

## Abstract classes

An **abstract** class can't be instantiated and may have abstract methods (no body) that subclasses must implement. It's between a class and an interface: it can hold fields and constructor logic.

```java
abstract class Animal {
    protected final String name;
    Animal(String name) { this.name = name; }
    abstract String sound();                       // no body: subclasses must provide it
    String describe() { return name + " says " + sound(); }
}
```

## equals and hashCode

`HashMap` and `HashSet` find keys by first calling `hashCode()` (to pick a bucket), then `equals()` (to confirm a match). If you put your own class in a hash collection, override **both**, consistently:

```java
class Pair {
    final int a, b;
    Pair(int a, int b) { this.a = a; this.b = b; }
    @Override public boolean equals(Object o) {
        if (this == o) return true;
        if (!(o instanceof Pair)) return false;
        Pair p = (Pair) o;
        return a == p.a && b == p.b;
    }
    @Override public int hashCode() { return Objects.hash(a, b); }
}
```

> **Pitfall:** If you override `equals` but not `hashCode`, two equal Pairs land in different buckets and `set.contains(new Pair(1, 2))` returns false. Records (module 9) generate both correctly.

## instanceof and casting

```java
if (obj instanceof String) { String s = (String) obj; ... }
if (obj instanceof String s) { ... s.length() ... }    // Java 16+: pattern matching binds s
```

A wrong cast throws `ClassCastException` at runtime.

:::quiz
Q: `List<Integer> list = new ArrayList<>(); list.ensureCapacity(100);` What happens?
- It works, because the object is an ArrayList
- [x] Compile error: `ensureCapacity` isn't a method of List
- It throws ClassCastException
- It silently does nothing
> The compiler only knows the declared type, `List`, and `ensureCapacity` exists only on `ArrayList`. Declare `ArrayList<Integer>` if you need it.
:::

:::quiz
Q: A class overrides `equals` but not `hashCode`. Which operation is most likely to misbehave?
- `list.contains(x)` on an ArrayList
- [x] `set.contains(x)` on a HashSet
- `Arrays.sort` on an array of them
- `System.out.println(x)`
> `ArrayList.contains` just calls `equals` on each element. `HashSet` uses `hashCode` first to choose a bucket, so equal objects with different hash codes are never compared.
:::
</script>
<script type="text/x-jc" id="m-generics" data-part="Part 3 · Object-oriented Java" data-title="Generics and wrapper types" data-short="Generics &amp; boxing" data-lede="What the angle brackets mean, wrapper classes and autoboxing, the Integer caching trap, generic classes and methods, bounded types, and why `new List[n]` needs `@SuppressWarnings(&quot;unchecked&quot;)`.">
## Reading angle brackets

**Generics** let a class or method work with any type while keeping type checks. The type in angle brackets is the **type argument**:

```java
List<String> names = new ArrayList<>();          // a list that only holds Strings
Map<String, List<Integer>> index = new HashMap<>();  // key: String, value: a list of Integers
Deque<int[]> stack = new ArrayDeque<>();          // a deque of int arrays (pairs/tuples)
PriorityQueue<long[]> pq = new PriorityQueue<>((a, b) -> Long.compare(a[0], b[0]));
```

- The `<>` on the right is the **diamond**: the compiler infers the type arguments from the left.
- Read nested types from the outside in: `Map<Integer, List<int[]>>` is "a map from Integer to a list of int arrays", which is a typical weighted adjacency list.
- The compiler now rejects `names.add(42)`, and `names.get(0)` returns a `String` with no cast needed.

## Primitives can't be type arguments

Generics only work with **objects**, so `List<int>` doesn't compile. Each primitive has a **wrapper class**:

| Primitive | Wrapper | Useful statics |
|---|---|---|
| `int` | `Integer` | `Integer.MAX_VALUE`, `parseInt`, `compare`, `valueOf`, `bitCount` |
| `long` | `Long` | `Long.MAX_VALUE`, `parseLong`, `compare` |
| `double` | `Double` | `Double.compare`, `parseDouble` |
| `char` | `Character` | `isDigit`, `isLetter`, `toLowerCase` |
| `boolean` | `Boolean` | `parseBoolean` |

Java converts between them automatically: **autoboxing** (`int` → `Integer`) when you add to a collection, and **unboxing** (`Integer` → `int`) when you use the value in arithmetic or assign it to an `int`.

:::viz boxing

> **Rule of thumb:** Compare wrapper objects with `.equals()` or unbox first: `map.get(a).equals(map.get(b))` or `(int) map.get(a) == map.get(b)`. Never trust `==` between two `Integer`s.

## Generic classes and methods

You'll write these when implementing your own data structures:

```java
class Box<T> {                              // T is a type parameter
    private T value;
    void set(T v) { value = v; }
    T get() { return value; }
}
Box<String> b = new Box<>();

static <T> void swap(T[] a, int i, int j) {  // a generic method: <T> before the return type
    T t = a[i]; a[i] = a[j]; a[j] = t;
}

static <T extends Comparable<T>> T maxOf(List<T> list) {   // bounded: T must be comparable
    T best = list.get(0);
    for (T x : list) if (x.compareTo(best) > 0) best = x;
    return best;
}
```

Common type-parameter names: `T` (type), `E` (element), `K`/`V` (key/value). The wildcard `?` means "some unknown type": `List<? extends Number>` accepts a `List<Integer>` or a `List<Double>`.

## Type erasure and generic arrays

Generics exist only at compile time; at runtime a `List<String>` is just a `List` (this is **type erasure**). One consequence shows up in graph code: you can't create an array of a generic type directly.

```java
List<Integer>[] graph = new List[n];                 // raw array: compiles with an "unchecked" warning
@SuppressWarnings("unchecked")
List<Integer>[] g2 = (List<Integer>[]) new List[n];  // same thing, warning silenced
for (int i = 0; i < n; i++) graph[i] = new ArrayList<>();

// The warning-free alternative most people prefer:
List<List<Integer>> adj = new ArrayList<>();
for (int i = 0; i < n; i++) adj.add(new ArrayList<>());
adj.get(u).add(v);
```

`@SuppressWarnings("unchecked")` is an **annotation**: it tells the compiler "I know this cast is unchecked, don't warn me". It changes nothing at runtime. Other annotations you'll see: `@Override` and `@FunctionalInterface`.

:::quiz
Q: Why doesn't `List<int> list = new ArrayList<>();` compile?
- `List` must be imported
- [x] Type arguments must be object types; use `List<Integer>`
- The diamond `<>` is not allowed here
- `int` lists need `IntList`
> Generics only accept reference types. Primitive values are boxed into `Integer` automatically when you add them.
:::

:::quiz
Q: `Map<Character, Integer> m = new HashMap<>(); int c = m.get('z');` with 'z' absent. What happens?
- c is 0
- [x] NullPointerException
- c is -1
- Compile error
> `get` returns `null` for a missing key, and unboxing null into an `int` throws. Use `m.getOrDefault('z', 0)`.
:::
</script>
<script type="text/x-jc" id="m-exceptions" data-part="Part 3 · Object-oriented Java" data-title="Exceptions" data-short="Exceptions" data-lede="try/catch/finally, throwing exceptions, checked vs unchecked, the runtime exceptions you&#x27;ll hit in DSA code, and how to read a stack trace.">
## What an exception is

An **exception** is an object that signals something went wrong. When one is **thrown**, normal execution stops and Java unwinds the call stack looking for a matching `catch`. If none is found, the program (or the judge's test) crashes with a **stack trace**.

:::viz exceptions

```java
try {
    riskyWork();
} catch (IllegalArgumentException | IllegalStateException e) {   // multi-catch
    System.out.println("bad: " + e.getMessage());
} catch (Exception e) {              // more general catches go last
    e.printStackTrace();
} finally {
    cleanup();                       // always runs
}
```

## Throwing your own

```java
public int pop() {
    if (size == 0) throw new IllegalStateException("stack is empty");
    return data[--size];
}
public MyQueue(int capacity) {
    if (capacity <= 0) throw new IllegalArgumentException("capacity must be positive: " + capacity);
    ...
}
```

Throwing on invalid input or state is how the data-structure implementations in the Data structures prep page report misuse (for example `RuntimeException("Underflow")` when popping an empty stack).

## The exception hierarchy

:::html
<figure class="fig"><svg viewBox="0 0 680 220" role="img" aria-label="Exception hierarchy: Throwable splits into Error and Exception; Exception includes checked exceptions like IOException and the unchecked RuntimeException family.">
<defs><marker id="mk-ex" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" class="s-fM"/></marker></defs>
<rect class="s-box2" x="270" y="10" width="140" height="34" rx="8"/><text class="s-t" x="340" y="32" text-anchor="middle">Throwable</text>
<rect class="s-bad" x="80" y="80" width="200" height="34" rx="8"/><text class="s-t" x="180" y="102" text-anchor="middle">Error (don't catch)</text>
<rect class="s-acc" x="400" y="80" width="200" height="34" rx="8"/><text class="s-t" x="500" y="102" text-anchor="middle">Exception</text>
<rect class="s-spec" x="300" y="150" width="150" height="34" rx="8"/><text class="s-t" x="375" y="172" text-anchor="middle">IOException…</text>
<rect class="s-cur" x="470" y="150" width="200" height="34" rx="8"/><text class="s-t" x="570" y="172" text-anchor="middle">RuntimeException</text>
<path class="s-line" marker-end="url(#mk-ex)" d="M300,44 L200,78"/><path class="s-line" marker-end="url(#mk-ex)" d="M380,44 L480,78"/>
