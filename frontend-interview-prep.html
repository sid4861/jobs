## How to answer “implement X” questions

1. **Restate the contract**: inputs, outputs, edge cases. (“Should `debounce` support a leading call? Should it keep `this`?”)
2. **Write the simplest correct version first**, then add options (cancel, leading/trailing, a custom resolver).
3. **Test out loud**: call it with 2–3 inputs, including an edge case (empty array, rejection, a `this`-dependent function).
4. **Mention complexity and trade-offs**: memory growth in caches, timer cleanup, error propagation.

## Timing utilities

### Q: Implement `debounce` (with leading option and cancel) [Core] [Easy]

**Problem.** Return a function that delays calling `fn` until `wait` ms have passed **since the last call**. Rapid calls collapse into one. Typical uses: search-as-you-type, resize handlers, autosave.

**Input:** a function `fn`, a delay `wait`, and options `{ leading }`. **Output:** a debounced function that keeps `this` and the latest arguments, plus a `.cancel()` method.

```js run
function debounce(fn, wait, { leading = false } = {}) {
  let timer = null, lastArgs, lastThis;
  function debounced(...args) {
    lastArgs = args; lastThis = this;
    const callNow = leading && timer === null;     // first call of a burst
    clearTimeout(timer);
    timer = setTimeout(() => {
      timer = null;
      if (!leading) fn.apply(lastThis, lastArgs);   // trailing call with the latest args
    }, wait);
    if (callNow) fn.apply(this, args);
  }
  debounced.cancel = () => { clearTimeout(timer); timer = null; };
  return debounced;
}

// --- tests ---
const search = debounce(q => console.log('search:', q), 100);
search('r'); search('re'); search('rea');                  // only "rea" fires, after 100ms
setTimeout(() => search('react'), 150);                     // a new burst: fires again

const save = debounce(x => console.log('leading call:', x), 100, { leading: true });
save(1); save(2); save(3);                                  // fires once, immediately, with 1
```

> **Follow-up:** with `leading` and `trailing` both on, a burst fires at the start and the end. Lodash also has `maxWait`, which guarantees a call at least every N ms during a long burst; that's how lodash builds `throttle` on top of `debounce`.

### Q: Implement `throttle` [Core] [Easy]

**Problem.** Call `fn` **at most once every `wait` ms**. Unlike debounce, a continuous stream of events still produces regular calls. Typical uses: scroll position tracking, drag, resize, rate-limiting button spam.

**Input:** `fn` and `wait`. **Output:** a throttled function. The first call runs immediately; calls during the cool-down are collapsed into one trailing call with the latest arguments.

```js run
function throttle(fn, wait) {
  let last = 0, timer = null, pendingArgs, pendingThis;
  return function throttled(...args) {
    const remaining = wait - (Date.now() - last);
    if (remaining <= 0) {                 // cool-down over: run now
      clearTimeout(timer); timer = null;
      last = Date.now();
      fn.apply(this, args);
    } else {                              // inside cool-down: remember the latest call
      pendingArgs = args; pendingThis = this;
      if (!timer) timer = setTimeout(() => {
        last = Date.now(); timer = null;
        fn.apply(pendingThis, pendingArgs);
      }, remaining);
    }
  };
}

// --- test: 10 events, 20ms apart, throttled to one per 100ms ---
const calls = [];
const onScroll = throttle(i => calls.push(i), 100);
let i = 0;
const id = setInterval(() => {
  onScroll(i++);
  if (i === 10) { clearInterval(id); setTimeout(() => console.log('handled', calls.length, 'of 10 events:', calls), 150); }
}, 20);
```

> **Interview tip:** be ready to explain debounce vs throttle with a picture. Debounce waits for silence; throttle samples at a fixed rate. Use debounce for “the user finished typing” and throttle for “update while the user scrolls”.

### Q: Implement `setInterval` using `setTimeout` [Easy]

**Problem.** Run `fn` every `ms` milliseconds using only `setTimeout`, and return a function that stops it. Chained timeouts never overlap (the next run is scheduled only after the previous one finishes), which is why people prefer them for polling.

```js run
function interval(fn, ms) {
  let timer, stopped = false;
  const tick = () => {
    timer = setTimeout(() => {
      if (stopped) return;
      fn();
      tick();                          // schedule the next run after this one finished
    }, ms);
  };
  tick();
  return () => { stopped = true; clearTimeout(timer); };
}

let n = 0;
const stop = interval(() => { console.log('tick', ++n); if (n === 3) stop(); }, 50);
```

### Q: Implement `sleep` and a promise timeout wrapper [Easy]

**Problem.** `sleep(ms)` resolves after `ms`. `withTimeout(promise, ms)` resolves or rejects like `promise`, but rejects with a timeout error if `promise` takes longer than `ms`. The timer must be cleared either way.

```js run
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

function withTimeout(promise, ms, message = 'Timed out') {
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(`${message} after ${ms}ms`)), ms);
  });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
}

withTimeout(sleep(50).then(() => 'fast'), 100).then(console.log);
withTimeout(sleep(200).then(() => 'slow'), 100).catch(e => console.log(e.message));
```

> **Note:** the timeout doesn't cancel the underlying work. For `fetch`, pass `AbortSignal.timeout(ms)` so the request is actually aborted.

## Promise combinators

### Q: Implement `Promise.all` [Core] [Medium]

**Problem.** Given an iterable of promises or plain values, return a promise that fulfils with an array of results **in input order** once all have fulfilled, or rejects as soon as **any** rejects.

```js run
function promiseAll(iterable) {
  return new Promise((resolve, reject) => {
    const items = Array.from(iterable);
    const results = new Array(items.length);
    let remaining = items.length;
    if (remaining === 0) return resolve(results);          // edge case: empty input
    items.forEach((item, i) => {
      Promise.resolve(item).then(value => {                  // wrap plain values too
        results[i] = value;                                  // keep input order
        if (--remaining === 0) resolve(results);
      }, reject);                                            // first rejection wins
    });
  });
}

const delay = (ms, v, fail) => new Promise((res, rej) => setTimeout(() => (fail ? rej(new Error(v)) : res(v)), ms));
promiseAll([delay(60, 'a'), 42, delay(10, 'c')]).then(r => console.log('resolved:', r));
promiseAll([delay(60, 'a'), delay(10, 'boom', true)]).catch(e => console.log('rejected:', e.message));
promiseAll([]).then(r => console.log('empty:', r));
```

> **Pitfall:** pushing results with `results.push(value)` breaks the order; always assign by index. And don't forget the empty-array case, or the promise never settles.

### Q: Implement `Promise.allSettled` [Medium]

**Problem.** Wait for all inputs to settle and return `{ status: 'fulfilled', value }` or `{ status: 'rejected', reason }` for each, in input order. It never rejects.

```js run
function promiseAllSettled(iterable) {
  return Promise.all(Array.from(iterable, item =>
    Promise.resolve(item).then(
      value => ({ status: 'fulfilled', value }),
      reason => ({ status: 'rejected', reason }),
    )));
}

promiseAllSettled([Promise.resolve(1), Promise.reject(new Error('nope')), 3])
  .then(results => results.forEach(r => console.log(r.status, r.value ?? r.reason.message)));
```

### Q: Implement `Promise.race` and `Promise.any` [Medium]

**Problem.** `race` settles like the **first input to settle**. `any` fulfils with the **first fulfilment** and rejects with an `AggregateError` (holding every reason, in order) only if **all** inputs reject.

```js run
function promiseRace(iterable) {
  return new Promise((resolve, reject) => {
    for (const item of iterable) Promise.resolve(item).then(resolve, reject);   // a promise settles only once
  });
}

function promiseAny(iterable) {
  return new Promise((resolve, reject) => {
    const items = Array.from(iterable);
    const errors = new Array(items.length);
    let remaining = items.length;
    if (!remaining) return reject(new AggregateError([], 'All promises were rejected'));
    items.forEach((item, i) => {
      Promise.resolve(item).then(resolve, err => {
        errors[i] = err;
        if (--remaining === 0) reject(new AggregateError(errors, 'All promises were rejected'));
      });
    });
  });
}

const after = (ms, v, fail) => new Promise((res, rej) => setTimeout(() => (fail ? rej(new Error(v)) : res(v)), ms));
promiseRace([after(50, 'slow'), after(10, 'fast')]).then(v => console.log('race:', v));
promiseAny([after(10, 'e1', true), after(30, 'winner'), after(5, 'e2', true)]).then(v => console.log('any:', v));
promiseAny([after(10, 'e1', true), after(5, 'e2', true)]).catch(e => console.log(e.name, e.errors.map(x => x.message)));
```

### Q: Implement a Promise from scratch (`then`, `catch`, `finally`) [Senior] [Hard]

**Problem.** Build a `MyPromise` class that follows the core Promises/A+ rules: it settles only once, handlers run **asynchronously** (as microtasks), `then` returns a new promise resolved with the handler's return value, thrown errors become rejections, and returned promises or **thenables are adopted**.

```js run
class MyPromise {
  #state = 'pending';
  #value;
  #callbacks = [];
  #done = false;                                   // resolve/reject may only take effect once

  constructor(executor) {
    const once = fn => v => { if (!this.#done) { this.#done = true; fn(v); } };
    const reject = once(e => this.#settle('rejected', e));
    try { executor(once(v => this.#resolveWith(v)), reject); } catch (e) { reject(e); }
  }

  #resolveWith(v) {
    if (v === this) return this.#settle('rejected', new TypeError('Chaining cycle detected'));
    if (v !== null && (typeof v === 'object' || typeof v === 'function')) {
      let then;
      try { then = v.then; } catch (e) { return this.#settle('rejected', e); }
      if (typeof then === 'function') {            // adopt the state of a thenable
        let called = false;
        try {
          then.call(v,
            x => { if (!called) { called = true; this.#resolveWith(x); } },
            e => { if (!called) { called = true; this.#settle('rejected', e); } });
        } catch (e) { if (!called) { called = true; this.#settle('rejected', e); } }
        return;
      }
    }
    this.#settle('fulfilled', v);
  }

  #settle(state, value) {
    if (this.#state !== 'pending') return;
    this.#state = state; this.#value = value;
    this.#callbacks.forEach(cb => queueMicrotask(cb));
    this.#callbacks = [];
  }

  then(onFulfilled, onRejected) {
    return new MyPromise((resolve, reject) => {
      const run = () => {
        const ok = this.#state === 'fulfilled';
        const handler = ok ? onFulfilled : onRejected;
        if (typeof handler !== 'function') return (ok ? resolve : reject)(this.#value);   // pass through
        try { resolve(handler(this.#value)); } catch (e) { reject(e); }
      };
      if (this.#state === 'pending') this.#callbacks.push(run); else queueMicrotask(run);
    });
  }
  catch(onRejected) { return this.then(undefined, onRejected); }
  finally(fn) {
    return this.then(
      v => MyPromise.resolve(fn()).then(() => v),
      e => MyPromise.resolve(fn()).then(() => { throw e; }));
  }
  static resolve(v) { return v instanceof MyPromise ? v : new MyPromise(r => r(v)); }
  static reject(e) { return new MyPromise((_, r) => r(e)); }
}

// --- tests ---
new MyPromise(r => setTimeout(() => r(1), 10))
  .then(v => v + 1)
  .then(v => new MyPromise(r => r(v * 10)))        // returned promise is adopted
  .then(v => console.log('chained value:', v));
MyPromise.reject(new Error('bad'))
  .then(() => console.log('never'))
  .catch(e => console.log('caught:', e.message))
  .finally(() => console.log('finally ran'));
new MyPromise(r => r(Promise.resolve('native'))).then(v => console.log('adopted thenable:', v));
MyPromise.resolve('async').then(console.log);
console.log('sync code runs first');
```

## Array & function polyfills

### Q: Polyfill `Array.prototype.map`, `filter` and `reduce` [Core] [Easy]

**Problem.** Re-implement the three array methods with the same behaviour: callbacks receive `(element, index, array)`, `thisArg` is respected, **holes are skipped**, and `reduce` without an initial value starts from the first element (throwing on an empty array).

```js run
Array.prototype.myMap = function (cb, thisArg) {
  if (typeof cb !== 'function') throw new TypeError(cb + ' is not a function');
  const out = new Array(this.length);
  for (let i = 0; i < this.length; i++) if (i in this) out[i] = cb.call(thisArg, this[i], i, this);
  return out;
};

Array.prototype.myFilter = function (cb, thisArg) {
  const out = [];
  for (let i = 0; i < this.length; i++) if (i in this && cb.call(thisArg, this[i], i, this)) out.push(this[i]);
  return out;
};

Array.prototype.myReduce = function (cb, ...init) {
  const len = this.length;
  let i = 0, acc;
  if (init.length) acc = init[0];
  else {
    while (i < len && !(i in this)) i++;                    // skip leading holes
    if (i >= len) throw new TypeError('Reduce of empty array with no initial value');
    acc = this[i++];
  }
  for (; i < len; i++) if (i in this) acc = cb(acc, this[i], i, this);
  return acc;
};

console.log([1, 2, 3].myMap(x => x * 2));
console.log([1, 2, 3, 4].myFilter(x => x % 2 === 0));
console.log([1, 2, 3, 4].myReduce((a, b) => a + b), [1, 2, 3].myReduce((a, b) => a + b, 10));
console.log([[1, 2], [3]].myReduce((acc, x) => acc.concat(x), []));
try { [].myReduce((a, b) => a + b); } catch (e) { console.log(e.message); }
```

> **Note:** in real code, never extend built-in prototypes in a shared codebase. Polyfills do it only after checking that the method is missing.

### Q: Implement `Function.prototype.bind`, `call` and `apply` [Core] [Medium]

**Problem.** `call` and `apply` invoke the function with a given `this`; `bind` returns a new function with `this` and leading arguments fixed. A bound function called with `new` must ignore the bound `this` and construct normally.

```js run
Function.prototype.myCall = function (ctx, ...args) {
  ctx = ctx == null ? globalThis : Object(ctx);   // primitives get boxed
  const key = Symbol('fn');                       // unique key: no clash with existing props
  ctx[key] = this;                                // this = the function being called
  try { return ctx[key](...args); } finally { delete ctx[key]; }
};

Function.prototype.myApply = function (ctx, args = []) {
  return this.myCall(ctx, ...args);
};

Function.prototype.myBind = function (ctx, ...preset) {
  const fn = this;
  return function bound(...later) {
    if (new.target) return new fn(...preset, ...later);   // `new` beats bind
    return fn.apply(ctx, [...preset, ...later]);
  };
};

function intro(greeting, punct) { return `${greeting}, I'm ${this.name}${punct}`; }
const dev = { name: 'Arjun' };
console.log(intro.myCall(dev, 'Hi', '!'));
console.log(intro.myApply(dev, ['Hello', '.']));
const bound = intro.myBind(dev, 'Hey');
console.log(bound('?'));

function Point(x, y) { this.x = x; this.y = y; }
const P = Point.myBind(null, 1);
const pt = new P(2);
console.log(pt.x, pt.y, pt instanceof Point);
```

### Q: Implement `once` [Easy]

**Problem.** Return a function that runs `fn` only on the **first** call and returns that same result on every later call (e.g. initialising an SDK, a "submit once" handler).

```js run
function once(fn) {
  let called = false, result;
  return function (...args) {
    if (!called) { called = true; result = fn.apply(this, args); }
    return result;
  };
}
const init = once(() => { console.log('initialising…'); return 'sdk-ready'; });
console.log(init(), init(), init());
```

### Q: Implement `memoize` (and a safe async version) [Core] [Medium]

**Problem.** Cache a function's results by its arguments, so repeated calls with the same input return instantly. Allow a custom key function.

```js run
function memoize(fn, keyOf = (...args) => JSON.stringify(args)) {
  const cache = new Map();
  function memoized(...args) {
    const key = keyOf(...args);
    if (cache.has(key)) return cache.get(key);
    const result = fn.apply(this, args);
    cache.set(key, result);
    return result;
  }
  memoized.cache = cache;
  return memoized;
}

let calls = 0;
const slowSquare = memoize(n => { calls++; return n * n; });
slowSquare(9); slowSquare(9); slowSquare(4);
console.log('computed', calls, 'times; cache size', slowSquare.cache.size);

// recursion benefits hugely: fib(40) becomes instant
const fib = memoize(n => (n < 2 ? n : fib(n - 1) + fib(n - 2)));
console.log('fib(80) =', fib(80));

// async: cache the promise (dedupes concurrent calls), but evict on failure
function memoizeAsync(fn, keyOf = (...a) => JSON.stringify(a)) {
  const cache = new Map();
  return (...args) => {
    const key = keyOf(...args);
    if (!cache.has(key)) cache.set(key, fn(...args).catch(err => { cache.delete(key); throw err; }));
    return cache.get(key);
  };
}
let fetches = 0;
const getUser = memoizeAsync(id => new Promise(r => setTimeout(() => { fetches++; r({ id }); }, 20)));
Promise.all([getUser(1), getUser(1), getUser(2)]).then(() => console.log('network calls:', fetches));
```

> **Follow-up:** unbounded caches leak memory. Mention an LRU limit, a TTL, or a `WeakMap` when keys are objects.

### Q: Implement `curry`, and an infinite `sum(1)(2)(3)()` [Core] [Medium]

**Problem 1.** `curry(fn)` returns a function you can call with arguments in any grouping, e.g. `f(1)(2)(3)`, `f(1, 2)(3)`, until `fn.length` arguments are collected. **Problem 2.** `sum(1)(2)(3)()` returns 6: an empty call ends the chain.

```js run
function curry(fn) {
  return function curried(...args) {
    if (args.length >= fn.length) return fn.apply(this, args);
    return (...more) => curried.apply(this, [...args, ...more]);
  };
}
const add3 = curry((a, b, c) => a + b + c);
console.log(add3(1)(2)(3), add3(1, 2)(3), add3(1)(2, 3), add3(1, 2, 3));

function sum(a) {
  return function next(b) {
    return b === undefined ? a : sum(a + b);
  };
}
console.log(sum(1)(2)(3)(), sum(10)());

// variant: no terminating call, convert with valueOf / toString
function add(...a) {
  const f = (...b) => add(...a, ...b);
  f.valueOf = () => a.reduce((x, y) => x + y, 0);
  return f;
}
console.log(+add(1)(2, 3)(4));
```

### Q: Implement `compose` and `pipe` (sync and async) [Easy]

**Problem.** `pipe(f, g, h)(x)` is `h(g(f(x)))`, applied left to right. `compose(f, g, h)(x)` is `f(g(h(x)))`, right to left (as in Redux's `compose` for middleware).

```js run
const pipe = (...fns) => input => fns.reduce((acc, fn) => fn(acc), input);
const compose = (...fns) => input => fns.reduceRight((acc, fn) => fn(acc), input);
const pipeAsync = (...fns) => input => fns.reduce((p, fn) => p.then(fn), Promise.resolve(input));

const trim = s => s.trim(), lower = s => s.toLowerCase(), slugify = s => s.replace(/\s+/g, '-');
console.log(pipe(trim, lower, slugify)('  Hello Frontend World '));
console.log(compose(slugify, lower, trim)('  Same Result Here '));
pipeAsync(x => x + 1, async x => x * 2, x => x - 3)(5).then(v => console.log('async pipe:', v));
```

### Q: Implement `promisify` [Easy]

**Problem.** Convert a Node-style function whose last argument is a callback `(err, result)` into a function that returns a promise.

```js run
function promisify(fn) {
  return function (...args) {
    return new Promise((resolve, reject) => {
      fn.call(this, ...args, (err, ...results) => {
        if (err) reject(err);
        else resolve(results.length > 1 ? results : results[0]);
      });
    });
  };
}
function readConfig(name, cb) { setTimeout(() => (name ? cb(null, { name, debug: true }) : cb(new Error('name required'))), 10); }
const readConfigAsync = promisify(readConfig);
readConfigAsync('app').then(c => console.log('config:', c));
readConfigAsync('').catch(e => console.log('error:', e.message));
```

## Objects & data

### Q: Implement a deep clone (handles Date, Map, Set and cycles) [Core] [Medium]

**Problem.** Copy a value so that no nested object is shared with the original. Handle arrays, plain objects, Dates, RegExps, Maps, Sets and **circular references**, and keep the prototype.

```js run
function deepClone(value, seen = new WeakMap()) {
  if (value === null || typeof value !== 'object') return value;   // primitives & functions
  if (seen.has(value)) return seen.get(value);                     // cycle: reuse the copy
  if (value instanceof Date) return new Date(value);
  if (value instanceof RegExp) return new RegExp(value.source, value.flags);
  if (value instanceof Map) {
    const m = new Map(); seen.set(value, m);
    value.forEach((v, k) => m.set(deepClone(k, seen), deepClone(v, seen)));
    return m;
  }
  if (value instanceof Set) {
    const s = new Set(); seen.set(value, s);
    value.forEach(v => s.add(deepClone(v, seen)));
    return s;
  }
  const copy = Array.isArray(value) ? [] : Object.create(Object.getPrototypeOf(value));
  seen.set(value, copy);                                            // register BEFORE recursing
  for (const key of [...Object.keys(value), ...Object.getOwnPropertySymbols(value)]) {
    copy[key] = deepClone(value[key], seen);
  }
  return copy;
}

const original = { n: 1, list: [1, { deep: true }], when: new Date(0), tags: new Set(['a']), meta: new Map([['k', { v: 1 }]]) };
original.self = original;                                           // circular
const clone = deepClone(original);
clone.list[1].deep = false;
console.log(original.list[1].deep, clone.self === clone, clone.when instanceof Date, clone.meta.get('k'));
```

> **Interview tip:** mention `structuredClone` first: it's built in and handles cycles. Then implement your own to show recursion, the cycle map and special types.

### Q: Implement a deep equality check [Medium]

**Problem.** Return true if two values are structurally equal: same primitives (treating `NaN` as equal to `NaN`), same keys with deep-equal values, arrays element by element, Dates by time, and Maps and Sets by contents.

```js run
function deepEqual(a, b) {
  if (Object.is(a, b)) return true;
  if (typeof a !== 'object' || typeof b !== 'object' || a === null || b === null) return false;
  if (Object.getPrototypeOf(a) !== Object.getPrototypeOf(b)) return false;
  if (a instanceof Date) return a.getTime() === b.getTime();
  if (a instanceof Map) return a.size === b.size && [...a].every(([k, v]) => b.has(k) && deepEqual(v, b.get(k)));
  if (a instanceof Set) return a.size === b.size && [...a].every(v => b.has(v));
  const ka = Object.keys(a), kb = Object.keys(b);
  if (ka.length !== kb.length) return false;
  return ka.every(k => Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]));
}

console.log(deepEqual({ a: [1, { b: 2 }], c: NaN }, { a: [1, { b: 2 }], c: NaN }));
console.log(deepEqual({ a: 1 }, { a: 1, b: undefined }));
console.log(deepEqual([1, 2], { 0: 1, 1: 2 }));
console.log(deepEqual(new Date(5), new Date(5)), deepEqual(new Map([[1, { x: 1 }]]), new Map([[1, { x: 1 }]])));
```

### Q: Flatten a nested array (with depth), recursively and iteratively [Core] [Easy]

**Problem.** Implement `flat(arr, depth = Infinity)`. Example: `[1, [2, [3, [4]]]]` with depth 1 becomes `[1, 2, [3, [4]]]`, and with Infinity becomes `[1, 2, 3, 4]`.

```js run
function flatten(arr, depth = Infinity) {
  if (depth < 1) return arr.slice();
  return arr.reduce((acc, item) =>
    acc.concat(Array.isArray(item) ? flatten(item, depth - 1) : [item]), []);
}

// iterative: no recursion depth limit (fully flattens)
function flattenIterative(arr) {
  const stack = [...arr], out = [];
  while (stack.length) {
    const item = stack.pop();
    if (Array.isArray(item)) stack.push(...item); else out.push(item);
  }
  return out.reverse();
}

const nested = [1, [2, [3, [4]], 5]];
console.log(flatten(nested, 1));
console.log(flatten(nested));
console.log(flattenIterative(nested));
```

### Q: Flatten a nested object into dot-notation keys [Medium]

**Problem.** `{ a: 1, b: { c: 2, d: { e: 3 } }, f: [4, 5] }` becomes `{ a: 1, 'b.c': 2, 'b.d.e': 3, 'f.0': 4, 'f.1': 5 }`. (Asked for form libraries, analytics payloads and i18n keys.)

```js run
function flattenObject(obj, prefix = '', out = {}) {
  for (const [key, value] of Object.entries(obj)) {
    const path = prefix ? `${prefix}.${key}` : key;
    const isNested = value !== null && typeof value === 'object' && !(value instanceof Date) && Object.keys(value).length > 0;
    if (isNested) flattenObject(value, path, out);
    else out[path] = value;
  }
  return out;
}

function unflattenObject(flat) {
  const result = {};
  for (const [path, value] of Object.entries(flat)) {
    const keys = path.split('.');
    let cur = result;
    keys.forEach((k, i) => {
      if (i === keys.length - 1) cur[k] = value;
      else cur = cur[k] ??= /^\d+$/.test(keys[i + 1]) ? [] : {};
    });
  }
  return result;
}

const flat = flattenObject({ a: 1, b: { c: 2, d: { e: 3 } }, f: [4, 5], g: {} });
console.log(flat);
console.log(JSON.stringify(unflattenObject(flat)));
```

### Q: Implement lodash `get` and `set` [Core] [Easy]

**Problem.** `get(obj, 'a.b[0].c', fallback)` safely reads a nested path and returns `fallback` if any step is missing. `set(obj, 'a.b[0].c', value)` writes the value, creating objects or arrays along the way.

```js run
const toPath = path => Array.isArray(path) ? path : String(path).replace(/\[(\w+)\]/g, '.$1').split('.').filter(Boolean);

function get(obj, path, fallback) {
  let cur = obj;
  for (const key of toPath(path)) {
    if (cur == null) return fallback;
    cur = cur[key];
  }
  return cur === undefined ? fallback : cur;
}

function set(obj, path, value) {
  const keys = toPath(path);
  let cur = obj;
  keys.forEach((key, i) => {
    if (i === keys.length - 1) { cur[key] = value; return; }
    if (cur[key] == null || typeof cur[key] !== 'object') cur[key] = /^\d+$/.test(keys[i + 1]) ? [] : {};
    cur = cur[key];
  });
  return obj;
}

const data = { user: { addresses: [{ city: 'Pune' }] } };
console.log(get(data, 'user.addresses[0].city'), get(data, 'user.phone.number', 'n/a'), get(data, ['user', 'addresses', 0, 'city']));
console.log(JSON.stringify(set({}, 'a.b[1].c', 42)));
```

### Q: Implement `groupBy`, `chunk` and `uniqueBy` [Easy]

**Problem.** `groupBy(items, fn)` returns `{ key: [items…] }`. `chunk(arr, size)` splits an array into pieces of `size`. `uniqueBy(items, fn)` keeps the first item for each key. (Modern runtimes ship `Object.groupBy` and `Map.groupBy`; interviewers still ask you to write it.)

```js run
const groupBy = (items, keyFn) => items.reduce((acc, item) => {
  const key = typeof keyFn === 'function' ? keyFn(item) : item[keyFn];
  (acc[key] ||= []).push(item);
  return acc;
}, {});

const chunk = (arr, size) => {
  if (size < 1) throw new RangeError('size must be ≥ 1');
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
};

const uniqueBy = (items, keyFn) => {
  const seen = new Set();
  return items.filter(item => { const k = keyFn(item); if (seen.has(k)) return false; seen.add(k); return true; });
};

const people = [{ name: 'A', team: 'web' }, { name: 'B', team: 'ios' }, { name: 'C', team: 'web' }];
console.log(JSON.stringify(groupBy(people, 'team')));
console.log(chunk([1, 2, 3, 4, 5], 2));
console.log(uniqueBy([{ id: 1, v: 'a' }, { id: 2, v: 'b' }, { id: 1, v: 'c' }], x => x.id).map(x => x.v));
```

### Q: Implement `JSON.stringify` (core rules) [Medium]

**Problem.** Serialise primitives, arrays and plain objects like `JSON.stringify`: strings are quoted and escaped; `NaN` and `Infinity` become `null`; `undefined`, functions and symbols are **dropped from objects** but become `null` **inside arrays**; `toJSON` (e.g. on Date) is respected.

```js run
function stringify(value) {
  if (value === null) return 'null';
  if (value !== undefined && typeof value.toJSON === 'function') return stringify(value.toJSON());
  switch (typeof value) {
    case 'string': return '"' + value.replace(/["\\\n\r\t]/g, c => ({ '"': '\\"', '\\': '\\\\', '\n': '\\n', '\r': '\\r', '\t': '\\t' }[c])) + '"';
    case 'number': return Number.isFinite(value) ? String(value) : 'null';
    case 'boolean': return String(value);
    case 'undefined': case 'function': case 'symbol': return undefined;
  }
  if (Array.isArray(value)) return '[' + value.map(v => stringify(v) ?? 'null').join(',') + ']';
  const parts = [];
  for (const [k, v] of Object.entries(value)) {
    const s = stringify(v);
    if (s !== undefined) parts.push(stringify(k) + ':' + s);
  }
  return '{' + parts.join(',') + '}';
}

const sample = { a: 1, b: 'say "hi"\n', c: [1, undefined, () => 1, null], d: { e: true, f: undefined }, g: new Date(0), h: NaN };
console.log(stringify(sample));
console.log('matches native:', stringify(sample) === JSON.stringify(sample));
```

### Q: Implement a simple template engine: `render('Hi {{ user.name }}', data)` [Easy]

**Problem.** Replace each `{{ path }}` placeholder with the value at that path in `data`, leaving an empty string for missing values.

```js run
function render(template, data) {
  return template.replace(/\{\{\s*([\w.[\]]+)\s*\}\}/g, (_, path) => {
    const value = path.replace(/\[(\w+)\]/g, '.$1').split('.').reduce((cur, k) => cur?.[k], data);
    return value ?? '';
  });
}
console.log(render('Hi {{ user.name }}, you have {{count}} new {{ items[0] }}s. {{missing}}!', { user: { name: 'Divya' }, count: 3, items: ['message'] }));
```

## Patterns & classes

### Q: Implement an EventEmitter (`on`, `off`, `once`, `emit`) [Core] [Medium]

**Problem.** Build a pub/sub class. `on` registers a listener and returns an unsubscribe function; `once` listeners fire a single time; `off` removes a listener (including one added with `once`); `emit` calls listeners with arguments, in registration order, and returns whether any listener ran.

```js run
class EventEmitter {
  #listeners = {};

  on(event, fn) {
    (this.#listeners[event] ||= []).push(fn);
    return () => this.off(event, fn);
  }
  once(event, fn) {
    const wrapper = (...args) => { this.off(event, wrapper); fn.apply(this, args); };
    wrapper.original = fn;                    // lets off(event, fn) remove it too
    return this.on(event, wrapper);
  }
  off(event, fn) {
    const list = this.#listeners[event];
    if (!list) return this;
    const i = list.findIndex(l => l === fn || l.original === fn);
    if (i !== -1) list.splice(i, 1);
    return this;
  }
  emit(event, ...args) {
    const list = this.#listeners[event];
    if (!list || !list.length) return false;
    [...list].forEach(l => l.apply(this, args));    // copy: listeners may unsubscribe while emitting
    return true;
  }
}

const bus = new EventEmitter();
const unsubscribe = bus.on('login', user => console.log('analytics:', user));
bus.once('login', user => console.log('welcome toast (once):', user));
bus.emit('login', 'priya');
unsubscribe();
console.log('emit after unsubscribe returned', bus.emit('login', 'rahul'));
```

### Q: Implement an LRU cache with O(1) `get` and `put` [Core] [Medium]

**Problem.** A cache with a fixed capacity. `get(key)` returns the value (or -1) and marks the key as most recently used; `put(key, value)` inserts or updates it and, if over capacity, evicts the **least recently used** key. A JavaScript `Map` remembers insertion order, so deleting and re-inserting a key moves it to the "newest" end.

```js run
class LRUCache {
  constructor(capacity) { this.capacity = capacity; this.map = new Map(); }
  get(key) {
    if (!this.map.has(key)) return -1;
    const value = this.map.get(key);
    this.map.delete(key); this.map.set(key, value);       // move to most-recent
    return value;
  }
  put(key, value) {
    this.map.delete(key);
    this.map.set(key, value);
    if (this.map.size > this.capacity) this.map.delete(this.map.keys().next().value);   // oldest
  }
}
const cache = new LRUCache(2);
cache.put('a', 1); cache.put('b', 2);
cache.get('a');                    // a is now most recent
cache.put('c', 3);                 // evicts b
console.log(cache.get('b'), cache.get('a'), cache.get('c'), [...cache.map.keys()]);
```

> **Follow-up:** in a language without ordered maps, use a hash map plus a doubly linked list. That's the classic answer, and you should be able to sketch it.

### Q: Implement a mini Redux `createStore` [Medium]

**Problem.** `createStore(reducer, initialState)` returns `{ getState, dispatch, subscribe }`. `dispatch` runs the reducer and notifies subscribers; `subscribe` returns an unsubscribe function; reducers must not dispatch.

```js run
function createStore(reducer, preloadedState) {
  let state = preloadedState;
  const listeners = new Set();
  let dispatching = false;
  const getState = () => state;
  const subscribe = fn => { listeners.add(fn); return () => listeners.delete(fn); };
  const dispatch = action => {
    if (dispatching) throw new Error('Reducers may not dispatch actions');
    try { dispatching = true; state = reducer(state, action); } finally { dispatching = false; }
    listeners.forEach(fn => fn());
    return action;
  };
  dispatch({ type: '@@INIT' });                 // let reducers fill in default state
  return { getState, dispatch, subscribe };
}

function cartReducer(state = { items: [], total: 0 }, action) {
  switch (action.type) {
    case 'add': return { items: [...state.items, action.item], total: state.total + action.item.price };
    case 'clear': return { items: [], total: 0 };
    default: return state;
  }
}
const store = createStore(cartReducer);
const stop = store.subscribe(() => console.log('total is now', store.getState().total));
store.dispatch({ type: 'add', item: { name: 'Book', price: 499 } });
store.dispatch({ type: 'add', item: { name: 'Pen', price: 49 } });
stop();
store.dispatch({ type: 'clear' });
console.log('items after clear:', store.getState().items.length);
```

### Q: Implement reactive signals (`createSignal` + `effect`) [Senior] [Medium]

**Problem.** Signals (Solid, Preact, Angular, Vue refs) track which effects read them and re-run only those effects when they change. Implement `createSignal(initial)` returning `[read, write]`, and `effect(fn)`, which runs `fn` and re-runs it whenever a signal it read changes.

```js run
let currentEffect = null;

function createSignal(value) {
  const subscribers = new Set();
  const read = () => {
    if (currentEffect) subscribers.add(currentEffect);     // dependency tracking
    return value;
  };
  const write = next => {
    value = typeof next === 'function' ? next(value) : next;
    [...subscribers].forEach(run => run());
  };
  return [read, write];
}

function effect(fn) {
  const run = () => {
    const prev = currentEffect;
    currentEffect = run;
    try { fn(); } finally { currentEffect = prev; }
  };
  run();
}

const [count, setCount] = createSignal(1);
const [name] = createSignal('cart');
effect(() => console.log(`${name()} has ${count()} item(s)`));
setCount(2);
setCount(c => c + 1);
```

### Q: Classnames utility: `cx('btn', { active: isOn }, ['lg', null])` [Easy]

**Problem.** Join class names from strings, numbers, arrays (nested) and objects (keys whose values are truthy), skipping falsy values.

```js run
function cx(...args) {
  const out = [];
  for (const arg of args) {
    if (!arg) continue;
    if (typeof arg === 'string' || typeof arg === 'number') out.push(arg);
    else if (Array.isArray(arg)) { const inner = cx(...arg); if (inner) out.push(inner); }
    else if (typeof arg === 'object') for (const [k, v] of Object.entries(arg)) if (v) out.push(k);
  }
  return out.join(' ');
}
console.log(cx('btn', { 'btn--active': true, 'btn--disabled': false }, ['lg', null, ['rounded']], 0, undefined));
```

## Async control flow

### Q: Retry with exponential backoff [Core] [Medium]

**Problem.** Call an async function and, if it fails, retry up to `retries` times, waiting `base × 2^attempt` ms (plus a little random jitter) between attempts. Let the caller decide which errors are retryable (e.g. retry on 503, not on 400).

```js run
async function retry(fn, { retries = 3, baseDelay = 50, factor = 2, shouldRetry = () => true, onRetry } = {}) {
  for (let attempt = 0; ; attempt++) {
    try {
      return await fn(attempt);
    } catch (err) {
      if (attempt >= retries || !shouldRetry(err)) throw err;
      const delay = baseDelay * factor ** attempt;
      const jitter = Math.random() * delay * 0.2;        // avoid many clients retrying in lockstep
      onRetry?.(err, attempt + 1, Math.round(delay));
      await new Promise(r => setTimeout(r, delay + jitter));
    }
  }
}

let calls = 0;
const flaky = () => new Promise((res, rej) => (++calls < 3 ? rej(new Error('503 Service Unavailable')) : res('ok on call ' + calls)));
retry(flaky, { onRetry: (e, n, ms) => console.log(`retry #${n} in ~${ms}ms after: ${e.message}`) }).then(console.log);

const badRequest = () => Promise.reject(Object.assign(new Error('400 Bad Request'), { status: 400 }));
retry(badRequest, { shouldRetry: e => e.status >= 500 }).catch(e => console.log('not retried:', e.message));
```

### Q: Run async tasks with a concurrency limit (promise pool) [Core] [Hard]

**Problem.** Given `n` items and an async function, process them with **at most `limit` running at once**, returning the results in input order. (Uploading 100 files 3 at a time, crawling URLs, rate-limited APIs.)

```js run
async function mapLimit(items, limit, iteratee) {
  const results = new Array(items.length);
  let next = 0;
  async function worker() {
    while (next < items.length) {
      const i = next++;                      // claim an index synchronously: no two workers share one
      results[i] = await iteratee(items[i], i);
    }
  }
  const workers = Array.from({ length: Math.min(limit, items.length) }, worker);
  await Promise.all(workers);
  return results;
}

let active = 0, peak = 0;
const upload = (file) => new Promise(resolve => {
  active++; peak = Math.max(peak, active);
  setTimeout(() => { active--; resolve(file.toUpperCase()); }, 20 + Math.random() * 40);
});
mapLimit(['a', 'b', 'c', 'd', 'e', 'f', 'g'], 3, upload)
  .then(r => console.log('results:', r, '| peak concurrency:', peak));
```

> **Follow-up:** to fail fast, let one rejection reject the whole thing (as here, via `Promise.all`). To collect every outcome, wrap each call in try/catch and store `{status, value|reason}`.

### Q: Run promise-returning tasks in sequence [Easy]

**Problem.** Given an array of functions that return promises, run them **one after another** (each starts only when the previous one finished) and collect the results.

```js run
async function runInSequence(tasks) {
  const results = [];
  for (const task of tasks) results.push(await task());
  return results;
}
// the same with reduce (often asked as a follow-up)
const runInSequenceReduce = tasks =>
  tasks.reduce((chain, task) => chain.then(acc => task().then(r => [...acc, r])), Promise.resolve([]));

const step = (name, ms) => () => new Promise(r => setTimeout(() => { console.log('finished', name); r(name); }, ms));
runInSequence([step('fetch user', 30), step('fetch orders', 10), step('render', 5)])
  .then(r => console.log('order:', r))
  .then(() => runInSequenceReduce([step('x', 10), step('y', 5)]))
  .then(r => console.log('reduce version:', r));
```

## HTML

### Q: What is semantic HTML and why does it matter? [Core] [Easy]

Semantic HTML uses elements for their **meaning**, not their look: `<header>`, `<nav>`, `<main>`, `<article>`, `<section>`, `<aside>`, `<footer>`, `<button>`, `<a>`, `<ul>`, `<table>`, `<label>`, `<h1>`–`<h6>` in order.

Why it matters:
- **Accessibility:** screen readers expose landmarks and headings for navigation, and native elements come with keyboard support and roles for free (a `<button>` is focusable and fires on Enter and Space; a `<div onClick>` isn't).
- **SEO:** search engines understand structure and headings.
- **Maintainability:** the markup documents itself, and there's less ARIA and JavaScript to maintain.

> **Pitfall:** `<div onClick>` instead of `<button>`, and `<a onClick>` without an `href` for actions. Links navigate; buttons do things.

### Q: What's the difference between `<script>`, `<script async>`, `<script defer>` and `type="module"`? [Core] [Easy]

| | Downloads | Executes | Order kept? | Blocks HTML parsing? |
|---|---|---|---|---|
| `<script>` | Immediately, parser stops | Right away | Yes | Yes (download + run) |
| `async` | In parallel | As soon as downloaded | No | Only while running |
| `defer` | In parallel | After parsing finishes, before `DOMContentLoaded` | Yes | No |
| `type="module"` | In parallel | Deferred by default (can be `async`) | Yes | No |

Use `defer` (or modules) for app code that needs the DOM, and `async` for independent scripts like analytics. Put plain blocking scripts at the end of `<body>` if you must use them.

### Q: What does `<!DOCTYPE html>` do? [Easy]

It tells the browser to render in **standards mode**. Without it, browsers fall back to “quirks mode”, which emulates old, inconsistent behaviour (for example, a different box model for some elements and odd table sizing), and layouts break in surprising ways.

### Q: What should go in the document `<head>` for a production page? [Easy]

- `<meta charset="utf-8">` (first) and `<meta name="viewport" content="width=device-width, initial-scale=1">` for responsive layouts.
- `<title>` and `<meta name="description">`, plus Open Graph and Twitter tags for link previews; a canonical URL.
- Resource hints: `preconnect` to critical origins, `preload` for the LCP image and key fonts.
- Critical CSS (inlined or a small blocking stylesheet), then deferred scripts.
- Icons and manifest (`<link rel="icon">`, `manifest.json`) and `theme-color`.
- A Content-Security-Policy, ideally as an HTTP header rather than a meta tag.

### Q: How do you build accessible forms in HTML? [Core] [Easy]

- Every input needs a `<label for="id">` (or wrap the input in the label). Placeholders are **not** labels.
- Use the right `type` (`email`, `tel`, `number`, `date`, `password`) and `autocomplete` values (`email`, `current-password`, `one-time-code`) so mobile keyboards and password managers work.
- Group related controls with `<fieldset>` + `<legend>` (radio groups).
- Use built-in validation (`required`, `minlength`, `pattern`) and the Constraint Validation API (`input.validity`, `setCustomValidity`).
- Tie error text to the field with `aria-describedby`, set `aria-invalid="true"`, and move focus to the first error on submit.

```html
<form novalidate>
  <label for="email">Work email</label>
  <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-err">
  <p id="email-err" class="error" hidden>Enter a valid email like name@company.com</p>
  <button type="submit">Continue</button>
</form>
```

## The box model & the cascade

### Q: Explain the CSS box model and `box-sizing`. [Core] [Easy]

Every element is a box made of **content → padding → border → margin**. With the default `box-sizing: content-box`, `width` sets only the content, so padding and border are **added** on top (a `width: 200px` box with 20px padding and a 1px border is 242px wide). With `box-sizing: border-box`, `width` includes padding and border, which is far more predictable. That's why most resets set `*, *::before, *::after { box-sizing: border-box; }`.

Margins of adjacent block elements **collapse** vertically (the larger one wins). That doesn't happen in flex or grid containers, or when the parent creates a new block formatting context.

### Q: How does CSS specificity work? [Core] [Easy]

When several rules target the same element, the cascade picks a winner by, in order: **origin and importance** (`!important`, user-agent vs author styles), **cascade layers** (`@layer`; later layers win), **specificity**, then **source order** (later wins).

Specificity is compared as a triple **(IDs, classes/attributes/pseudo-classes, elements/pseudo-elements)**:

| Selector | Specificity |
|---|---|
| `p` | (0,0,1) |
| `.card p` | (0,1,1) |
| `#nav .item:hover` | (1,2,0) |
| `:where(.a, #b) p` | (0,0,1): `:where()` adds zero |
| `:is(.a, #b) p` | (1,0,1): `:is()` takes its most specific argument |
| inline `style=""` | beats any selector |

> **Rule of thumb:** keep specificity low and flat (single classes), avoid IDs in CSS, and treat `!important` as a last resort (or use it only inside utility layers).

### Q: `display: none` vs `visibility: hidden` vs `opacity: 0`? [Easy]

| | Takes space | Visible | Clickable / focusable | Read by screen readers | Animatable |
|---|---|---|---|---|---|
| `display: none` | No | No | No | No | No (except with newer `transition-behavior: allow-discrete`) |
| `visibility: hidden` | Yes | No | No | No | Yes (discrete) |
| `opacity: 0` | Yes | No | **Yes** | **Yes** | Yes |

For “visually hidden but available to screen readers” (e.g. a skip link or icon button text), use a `.sr-only` clip pattern instead of any of these.

### Q: Explain `position`: static, relative, absolute, fixed and sticky. [Core] [Easy]

- `static` (default): normal flow; `top`/`left` and `z-index` don't apply.
- `relative`: stays in flow; offsets move it visually without affecting others. It also becomes the **containing block** for absolutely positioned children.
- `absolute`: removed from flow; positioned relative to the nearest **positioned ancestor** (anything not `static`), or the initial containing block if there is none.
- `fixed`: removed from flow; positioned relative to the **viewport**. Gotcha: an ancestor with `transform`, `filter` or `perspective` becomes its containing block, which breaks “fixed” modals inside animated containers.
- `sticky`: acts like relative until the element crosses a threshold (`top: 0`), then sticks within its **scrolling container**. It fails if an ancestor has `overflow: hidden` or `auto`, or if no threshold is set.

### Q: What is a stacking context, and why doesn't my `z-index: 9999` work? [Core] [Medium]

`z-index` only compares elements **within the same stacking context**. A stacking context is created by the root element, positioned elements with a `z-index` other than `auto`, flex or grid children with a `z-index`, and elements with `opacity < 1`, `transform`, `filter`, `will-change`, `isolation: isolate`, `position: fixed` or `sticky`, among others. A child can never escape its parent's context: if the parent sits at `z-index: 1` under a sibling at `z-index: 2`, the child loses even with `z-index: 9999`.

Fixes: render overlays (modals, tooltips, dropdowns) in a **portal** at the end of `<body>`, manage a small z-index scale with tokens, and use `isolation: isolate` to deliberately contain components. The newer `<dialog>` element and the Popover API render in the browser's **top layer**, above everything.

### Q: What is a block formatting context (BFC)? [Medium]

A BFC is an independent layout region: floats inside it are contained, and margins of its children don't collapse with margins outside it. You create one with `display: flow-root` (the clean way), `overflow` other than `visible`, floats, absolute positioning, `display: inline-block`, or flex and grid items. Classic uses: containing floats (the old clearfix) and stopping margin collapse between a parent and its first child.

## Layout

### Q: Flexbox fundamentals: axes, `flex: 1`, and alignment. [Core] [Easy]

Flexbox lays items out along **one axis**. `flex-direction` sets the **main axis** (row or column); the cross axis is perpendicular to it.
- `justify-content` aligns items on the main axis; `align-items` aligns them on the cross axis; `align-self` overrides alignment for one item; `gap` spaces items.
- `flex: <grow> <shrink> <basis>`. `flex: 1` means `1 1 0%`: share the free space equally. `flex: auto` means `1 1 auto`: grow from the item's content size. `flex: none` means `0 0 auto`: rigid.
- `flex-wrap: wrap` lets items flow onto new lines.
- Gotcha: flex items have `min-width: auto`, so long text or code can overflow instead of shrinking. Add `min-width: 0` to the item.

```css
.toolbar { display: flex; align-items: center; gap: 8px; }
.toolbar .search { flex: 1; min-width: 0; }   /* take the remaining space, allow shrinking */
.toolbar .actions { margin-left: auto; }      /* push to the far end */
```

### Q: When do you use Grid vs Flexbox? [Core] [Easy]

**Flexbox is one-dimensional** and content-driven: rows of buttons, nav bars, centering, a card's internal layout. **Grid is two-dimensional** and layout-driven: page layouts, galleries, dashboards, anything where rows **and** columns must line up. They combine well: a grid for the page, flex inside the components.

```css
/* responsive card gallery with no media queries */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }

/* page shell with named areas */
.shell {
  display: grid; min-height: 100dvh;
  grid-template: "header header" auto "nav main" 1fr "footer footer" auto / 240px 1fr;
}
@media (max-width: 720px) {
  .shell { grid-template: "header" auto "main" 1fr "footer" auto / 1fr; }
  .shell nav { display: none; }
}
```

`auto-fill` keeps empty tracks (items keep their max size); `auto-fit` collapses empty tracks, so the items stretch to fill the row.

### Q: How many ways can you center an element? [Easy]

```css
/* 1. Grid: the shortest */
.parent { display: grid; place-items: center; }
/* 2. Flexbox */
.parent { display: flex; justify-content: center; align-items: center; }
/* 3. Absolute + transform (unknown size) */
.child { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
/* 4. Horizontal only, for a block with a set width */
.child { width: 60ch; margin-inline: auto; }
/* 5. Absolute + inset + auto margins (known size) */
.child { position: absolute; inset: 0; margin: auto; width: 200px; height: 100px; }
```

### Q: How do you approach responsive design? [Core] [Easy]

- **Mobile-first:** base styles for small screens, then `@media (min-width: …)` to add complexity.
- **Fluid layouts:** percentages, `fr` units, `minmax()`, `auto-fill`, and `clamp()` for fluid type and spacing (`font-size: clamp(1rem, 0.9rem + 0.5vw, 1.25rem)`).
- **Container queries** (`@container`) let a component respond to **its own container's** width instead of the viewport, which is ideal for reusable cards in a design system.
- **Responsive images:** `srcset` and `sizes`, `<picture>` for art direction, `aspect-ratio` to reserve space.
- Respect user settings: `prefers-reduced-motion`, `prefers-color-scheme`, zoom (use `rem`).
- Test on real devices and with the DevTools device toolbar, including landscape and 200% zoom.

### Q: Compare CSS units: px, em, rem, %, vw/vh, dvh and ch. [Easy]

| Unit | Relative to | Good for |
|---|---|---|
| `px` | A CSS pixel | Borders, shadows, fine details |
| `rem` | Root font size | Type and spacing (respects the user's browser font setting) |
| `em` | The element's own font size | Padding that should scale with a component's text, media queries |
| `%` | Parent's dimension (varies by property) | Fluid widths |
| `vw` / `vh` | Viewport width / height | Full-bleed sections, fluid type (combine with clamp) |
| `dvh` / `svh` / `lvh` | Dynamic, small and large viewport height | Mobile full-height layouts (100vh ignores the browser toolbar) |
| `ch` | Width of the "0" glyph | Readable line lengths (`max-width: 65ch`) |

### Q: Pseudo-classes vs pseudo-elements, and what do `:has()`, `:is()` and `:where()` do? [Medium]

**Pseudo-classes** (`:hover`, `:focus-visible`, `:nth-child()`, `:disabled`) select elements in a **state**. **Pseudo-elements** (`::before`, `::after`, `::placeholder`, `::marker`, `::selection`) style a **part** of an element, or generated content.

- `:has()` is the long-awaited "parent selector": `.card:has(img)`, `form:has(:invalid) .submit { opacity: .5 }`, `label:has(+ input:focus)`.
- `:is(a, b)` groups selectors (it takes the highest specificity in the list); `:where(a, b)` does the same with **zero specificity**, which is great for resets and library defaults.
- `:focus-visible` shows focus rings for keyboard users only, never remove outlines without it.

## Visual effects & performance

### Q: Transitions vs animations, and which properties are cheap to animate? [Core] [Medium]

`transition` animates between two states when a property changes (hover, class toggle). `@keyframes` + `animation` define multi-step, looping or autoplaying sequences.

Cost depends on which rendering stage a property touches:
- **Layout properties** (width, height, top, left, margin): trigger layout, then paint, then composite. Most expensive.
- **Paint properties** (color, background, box-shadow): repaint, then composite.
- **Compositor-only** (`transform`, `opacity`, and usually `filter`): can run on the GPU compositor thread. Smooth even when the main thread is busy.

So animate `transform: translate/scale` instead of `top`/`left`/`width`. `will-change: transform` promotes an element to its own layer ahead of time, but use it sparingly because each layer costs memory. Always respect `@media (prefers-reduced-motion: reduce)`.

### Q: How would you implement dark mode? [Medium]

Define colours as **CSS custom properties** (design tokens) on `:root`, override them under `@media (prefers-color-scheme: dark)`, and allow a manual override with an attribute such as `[data-theme="dark"]` saved in localStorage. Set `color-scheme: light dark` so native controls and scrollbars match. Avoid a flash of the wrong theme by setting the attribute in a tiny inline script in the `<head>` before the first paint. Check contrast in both themes.

```css
:root { --bg: #fff; --text: #111; --accent: #3b5bdb; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111; --text: #eee; --accent: #7b93ff; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #111; --text: #eee; --accent: #7b93ff; color-scheme: dark; }
body { background: var(--bg); color: var(--text); }
```

### Q: CSS custom properties vs Sass variables? [Easy]

Sass variables are resolved **at build time** into static values. CSS custom properties exist **at runtime**: they cascade and inherit, can be changed per element, in media queries or by JavaScript (`el.style.setProperty('--x', '10px')`), and they power theming. Use Sass (if at all) for build-time logic like loops and mixins, and custom properties for anything themeable.

### Q: Compare CSS architectures: BEM, CSS Modules, CSS-in-JS and Tailwind. [Senior] [Medium]

| Approach | How it scopes styles | Pros | Cons |
|---|---|---|---|
| BEM naming (`.card__title--active`) | By convention | Zero tooling, readable | Relies on discipline; long class names |
| CSS Modules | Build step makes class names unique | Real CSS, scoped, zero runtime | Dynamic styles need CSS variables or class toggles |
| Runtime CSS-in-JS (styled-components, Emotion) | Generated at runtime | Co-located, props-driven styles | Runtime cost, SSR complexity, awkward with React Server Components |
| Zero-runtime CSS-in-JS (vanilla-extract, Linaria, Panda) | Extracted at build time | Type-safe, no runtime cost | More build tooling |
| Utility-first (Tailwind) | Atomic classes | Fast to build, consistent design scale, tiny CSS that doesn't grow | Busy markup; needs discipline for reusable components |

A good senior answer: it depends on team size, SSR needs and the design system. Many teams in 2024–2025 moved away from runtime CSS-in-JS towards CSS Modules or Tailwind for performance and React Server Components compatibility.

### Q: How do you optimise images in HTML and CSS? [Core] [Medium]

- Modern formats: **AVIF/WebP** with fallbacks through `<picture>`.
- Responsive sizes: `srcset` with `w` descriptors plus `sizes`, so phones don't download desktop images.
- Reserve space with `width`/`height` attributes or `aspect-ratio` to prevent layout shift (CLS).
- `loading="lazy"` for below-the-fold images, but **never** for the LCP image; give that one `fetchpriority="high"` (and preload it if it's a CSS background).
- `decoding="async"`, compression, an image CDN that resizes on the fly, and SVG for icons.

```html
<img src="hero-800.webp"
     srcset="hero-400.webp 400w, hero-800.webp 800w, hero-1600.webp 1600w"
     sizes="(max-width: 600px) 100vw, 50vw"
     width="1600" height="900" alt="Team planning a sprint at a whiteboard"
     fetchpriority="high">
```

### Q: What is critical CSS and render-blocking CSS? [Medium]

CSS is **render-blocking**: the browser won't paint until the stylesheets in the `<head>` have downloaded and been parsed, because painting without them would flash unstyled content. **Critical CSS** is the minimal CSS needed for above-the-fold content, inlined in the `<head>` so the first paint doesn't wait for the network. The rest loads asynchronously (`media="print" onload="this.media='all'"`, or via `preload`). Also: split CSS per route, remove unused CSS, and avoid `@import` chains, which serialise downloads.

## From URL to pixels

### Q: What happens when you type a URL and press Enter? [Core] [Medium]

1. **URL parsing and checks**: the browser checks the HSTS list (forcing HTTPS), its caches, and whether the input is a search term or a URL.
2. **DNS lookup**: browser cache, OS cache, router, then a recursive resolver resolves the domain to an IP (CDNs return a nearby edge server).
3. **Connection**: a TCP handshake plus a TLS handshake (certificate check, key exchange). HTTP/3 uses QUIC over UDP, which combines both steps and is faster on mobile networks.
4. **HTTP request and response**: the request carries headers and cookies. Redirects (301/302) repeat the process. Responses may be served from the HTTP cache or a service worker.
5. **Parsing**: the HTML parser builds the **DOM** incrementally. A preload scanner discovers CSS, JS and images early. CSS is parsed into the **CSSOM**. Synchronous scripts block parsing.
6. **Render tree**: DOM + CSSOM produce the visible nodes with their computed styles.
7. **Layout (reflow)**: compute the geometry of every box.
8. **Paint**: fill in pixels into layers.
9. **Composite**: the GPU combines the layers into the final frame.
10. **Then:** `DOMContentLoaded` fires once the DOM is built and deferred scripts have run, `load` fires once all subresources are in, and JavaScript hydrates and attaches event handlers.

> **Interview tip:** ask how deep they want to go. Then tie each step to an optimisation: DNS → `preconnect`, TLS/TCP → HTTP/2 or 3 and a CDN, parsing → `defer`, CSS → critical CSS, layout → avoiding layout thrashing.

### Q: What is the critical rendering path, and what blocks rendering? [Core] [Medium]

The critical rendering path is the sequence DOM → CSSOM → render tree → layout → paint. **CSS blocks rendering** (no paint until the CSSOM is ready). **Synchronous JavaScript blocks parsing**, and since scripts may read styles, a script also waits for preceding CSS. To optimise: inline critical CSS, `defer` scripts, reduce the number and size of critical resources, preload the LCP resource and fonts, and send HTML early (streaming SSR).

### Q: What is the difference between reflow and repaint? What is layout thrashing? [Core] [Medium]

- **Reflow (layout)** recalculates positions and sizes. It's triggered by changes to geometry (width, font size, adding or removing DOM nodes) and can cascade through the whole document, so it's expensive.
- **Repaint** redraws pixels without changing geometry (color, background, visibility). It's cheaper.
- **Composite-only** changes (`transform`, `opacity`) skip both.

**Layout thrashing** is interleaving DOM **reads** that need up-to-date layout (`offsetHeight`, `getBoundingClientRect()`, `scrollTop`, `getComputedStyle`) with **writes**, forcing a synchronous layout on every iteration. The fix is to batch all reads, then all writes (or do the writes inside `requestAnimationFrame`).

```js
// ❌ forces a layout on every iteration (read after write)
items.forEach(el => { el.style.width = el.parentElement.offsetWidth / 2 + 'px'; });

// ✅ read everything first, then write
const widths = items.map(el => el.parentElement.offsetWidth);
items.forEach((el, i) => { el.style.width = widths[i] / 2 + 'px'; });
```

## DOM & events

### Q: Explain event propagation: capturing, target and bubbling. [Core] [Easy]

A DOM event travels in three phases:
1. **Capture**: from `window` down through ancestors to the target's parent (listeners registered with `{ capture: true }`).
2. **Target**: the listeners on the target element itself.
3. **Bubble**: back up from the target to `window` (the default for `addEventListener`).

`event.stopPropagation()` stops the event from moving to further elements; `stopImmediatePropagation()` also skips remaining listeners on the current element. `event.preventDefault()` cancels the **browser's default action** (following a link, submitting a form, scrolling) and has nothing to do with propagation. `event.target` is the element that was actually clicked; `event.currentTarget` is the element whose listener is running. Some events don't bubble (`focus`, `blur`, `mouseenter`); use `focusin`/`focusout` instead.

```js run
const log = [];
const outer = document.createElement('div'), inner = document.createElement('button');
outer.append(inner); document.body.append(outer);
outer.addEventListener('click', () => log.push('outer capture'), { capture: true });
outer.addEventListener('click', () => log.push('outer bubble'));
inner.addEventListener('click', e => log.push('target (currentTarget is ' + e.currentTarget.tagName + ')'));
inner.click();
console.log(log.join(' → '));
```

### Q: What is event delegation, and why use it? [Core] [Easy]

Attach **one** listener to a common ancestor and use `event.target.closest(selector)` to work out which child was interacted with, instead of adding a listener to every child. Benefits: fewer listeners (less memory), and it automatically works for children added later (infinite lists, rendered rows). React historically did exactly this, delegating all events to the root.

```js run
const list = document.createElement('ul');
list.innerHTML = '<li data-id="1"><button class="del">Delete</button> Apples</li><li data-id="2"><button class="del">Delete</button> Pears</li>';
document.body.append(list);

list.addEventListener('click', e => {
  const btn = e.target.closest('button.del');
  if (!btn || !list.contains(btn)) return;          // click wasn't on a delete button
  const item = btn.closest('li');
  console.log('delete item', item.dataset.id);
  item.remove();
});

list.querySelector('[data-id="2"] .del').click();
console.log('items left:', list.children.length);
```

### Q: Implement `getElementsByClassName` (or find all elements matching a test) by walking the DOM. [Medium]

**Problem.** Without `querySelectorAll`, return all descendants of `root` that have the given class. It shows you can traverse a tree with DFS.

```js run
function getByClassName(root, className) {
  const out = [];
  const stack = [...root.children].reverse();      // iterative DFS, keeps document order
  while (stack.length) {
    const el = stack.pop();
    if (el.classList.contains(className)) out.push(el);
    for (let i = el.children.length - 1; i >= 0; i--) stack.push(el.children[i]);
  }
  return out;
}

const root = document.createElement('div');
root.innerHTML = '<p class="x">1</p><section><span class="x y">2</span><div><b class="x">3</b></div></section>';
console.log(getByClassName(root, 'x').map(el => el.textContent));
```

### Q: Given two identical DOM trees A and B and a node in A, find the matching node in B. [Medium]

**Problem.** A classic DOM traversal question. Record the path of child indexes from the node up to root A, then replay that path from root B.

```js run
function findMatching(rootA, rootB, nodeA) {
  const path = [];
  for (let n = nodeA; n !== rootA; n = n.parentElement) {
    path.push([...n.parentElement.children].indexOf(n));
  }
  return path.reduceRight((node, idx) => node.children[idx], rootB);
}

const html = '<div><p>a</p><ul><li>x</li><li><em>target</em></li></ul></div>';
const A = document.createElement('div'); A.innerHTML = html;
const B = document.createElement('div'); B.innerHTML = html.replace('target', 'match in B');
const nodeA = A.querySelector('em');
console.log(findMatching(A, B, nodeA).textContent);
```

### Q: `innerHTML` vs `textContent` vs `innerText`, and why is `innerHTML` risky? [Core] [Easy]

`innerHTML` parses a string as HTML, which is an **XSS risk** with untrusted data, and it destroys and re-creates child nodes (losing listeners and state). `textContent` sets or gets raw text without parsing (safe and fast). `innerText` is layout-aware: it respects CSS (hidden text is skipped) and **triggers a reflow** to compute that. Prefer `textContent` and DOM APIs (`createElement`, `append`); if you must insert HTML, sanitise it (DOMPurify) or use the Sanitizer API where available.

### Q: What's the difference between `querySelectorAll` and `getElementsByClassName` results? [Easy]

`querySelectorAll` returns a **static** `NodeList`: a snapshot that doesn't change when the DOM does. `getElementsByClassName` and `getElementsByTagName` return a **live** `HTMLCollection` that updates automatically. That can cause infinite loops or skipped items if you modify the DOM while iterating. Neither is a real array; convert with `Array.from` or spread to use `map` and `filter`.

### Q: What are `DocumentFragment` and batching DOM writes? [Easy]

A `DocumentFragment` is a lightweight container that isn't part of the document. Append many nodes to it, then insert the fragment once: one reflow instead of N. (Modern `el.append(...nodes)` and `replaceChildren` also batch.)

## Storage, cookies & state in the browser

### Q: Compare cookies, localStorage, sessionStorage and IndexedDB. [Core] [Easy]

| | Capacity | Lifetime | Sent to server | API | Accessible from |
|---|---|---|---|---|---|
| Cookies | ~4 KB each | Until `Expires`/`Max-Age`, or the session | **Yes, every request** to that domain | String-based (`document.cookie`) | JS (unless `HttpOnly`) and the server |
| localStorage | ~5–10 MB per origin | Until cleared | No | Sync key/value strings | Same origin, all tabs |
| sessionStorage | ~5 MB | Until the tab closes | No | Sync key/value strings | Same tab and origin only |
| IndexedDB | Large (a share of disk) | Until cleared or evicted | No | Async, transactional, stores objects and blobs | Same origin, workers too |
| Cache API | Large | Until cleared | No | Request/Response pairs | Service workers and pages |

Web Storage is **synchronous** (it blocks the main thread) and can be read by any script on the page, so **never store auth tokens there**. An XSS bug would steal them.

### Q: Which cookie attributes matter, and what do they do? [Core] [Medium]

- `HttpOnly`: JavaScript can't read it, which protects session cookies from XSS theft.
- `Secure`: sent over HTTPS only.
- `SameSite=Lax | Strict | None`: whether the cookie is sent on cross-site requests. `Lax` (the default in modern browsers) sends it on top-level navigations but not on cross-site POSTs or iframes, which is the main CSRF defence. `None` requires `Secure`.
- `Domain` / `Path`: the scope. Omitting `Domain` makes it host-only (safer).
- `Max-Age` / `Expires`: persistence; without them it's a session cookie.
- `__Host-` prefix: forces `Secure`, `Path=/` and no `Domain`, the strictest setup.
- Third-party cookies are increasingly blocked (Safari, Firefox, and restrictions in Chrome); CHIPS (`Partitioned`) cookies exist for legitimate embedded use cases.

## Security boundaries & CORS

### Q: What is the same-origin policy? [Core] [Easy]

An **origin** is scheme + host + port (`https://app.example.com:443`). The same-origin policy stops scripts on one origin from **reading** responses or DOM from another origin. Cross-origin requests can still be **sent** (forms, images, scripts load fine), but JavaScript can't read the response unless the server opts in with CORS. Iframes from other origins can only talk through `postMessage`.

### Q: How does CORS work? What is a preflight request? [Core] [Medium]

CORS (Cross-Origin Resource Sharing) lets a **server** tell the browser which other origins may read its responses.

- **Simple requests** (GET, HEAD or POST with only safe headers and a content type of form-urlencoded, multipart or text/plain) are sent directly. The browser lets JavaScript read the response only if it contains `Access-Control-Allow-Origin` matching the page's origin (or `*`).
- **Preflighted requests** (PUT, DELETE, a JSON `Content-Type`, custom headers like `Authorization`) first send an `OPTIONS` request with `Access-Control-Request-Method` and `Access-Control-Request-Headers`. The server answers with `Access-Control-Allow-Methods`, `-Headers` and `-Max-Age` (to cache the preflight). Only then is the real request sent.
- **Credentials** (cookies) need `fetch(url, { credentials: 'include' })` **and** `Access-Control-Allow-Credentials: true` plus an explicit origin (not `*`).

> **Pitfall:** CORS is enforced by the **browser**, protecting users. It's not server security: curl or Postman ignore it. "Fixing" CORS errors with a browser extension only hides the problem. Fix the server headers, or proxy the request through your own backend or dev server.

## Caching & offline

### Q: Explain HTTP caching headers. [Core] [Medium]

- `Cache-Control: max-age=31536000, immutable`: cache for a year and never revalidate. Use it for **fingerprinted assets** (`app.3f9a1c.js`); a new deploy gets a new filename, so there's no staleness.
- `Cache-Control: no-cache`: may store, but must **revalidate** with the server before each use. Use it for HTML so users get new deploys.
- `Cache-Control: no-store`: never store (sensitive data).
- `private` vs `public`: whether shared caches (CDNs, proxies) may store it.
- `stale-while-revalidate=60`: serve the stale copy instantly while refreshing it in the background.
- **Validators:** `ETag` / `If-None-Match` and `Last-Modified` / `If-Modified-Since`. If nothing changed, the server replies `304 Not Modified` without a body.

A typical SPA strategy: `index.html` gets `no-cache`, hashed JS/CSS/images get `max-age=1y, immutable`, API responses get short `max-age` or `no-store` depending on the data, with a CDN in front.

### Q: What is a service worker, and what caching strategies exist? [Senior] [Medium]

A service worker is a script that runs separately from the page, in the background, and acts as a **programmable network proxy** for its scope. It powers offline support, push notifications, background sync and installable PWAs. Lifecycle: register → install (pre-cache the app shell) → activate (clean up old caches) → intercept `fetch` events. It requires HTTPS (or localhost).

| Strategy | How it works | Use for |
|---|---|---|
| Cache first | Serve from cache, fall back to network | Hashed static assets, fonts |
| Network first | Try network, fall back to cache | HTML, API data that should be fresh |
| Stale-while-revalidate | Serve cache immediately, update the cache from the network | Avatars, non-critical API data |
| Network only / cache only | One source only | Analytics / pre-cached shell |

Workbox is the usual library. Gotcha: a buggy service worker can serve stale apps forever, so always ship an update and "skip waiting" strategy and a kill switch.

### Q: Web Workers vs service workers vs worklets? [Medium]

- **Web Worker:** a background thread for CPU-heavy work, owned by a page.
- **Service worker:** an event-driven network proxy that lives beyond the page (offline, push, caching), one per scope, with no DOM access.
- **Worklets:** tiny hooks into the rendering pipeline: `AudioWorklet` for audio processing, `PaintWorklet` (CSS Houdini) for custom painting.

## Networking & APIs

### Q: What changed with HTTP/2 and HTTP/3? [Medium]

- **HTTP/1.1:** one request at a time per TCP connection (head-of-line blocking), so browsers open about 6 connections per host. This led to hacks like bundling, sprites and domain sharding.
- **HTTP/2:** **multiplexing** (many streams on one connection), binary framing, header compression (HPACK) and prioritisation. Sharding becomes harmful and over-bundling is less necessary. TCP-level head-of-line blocking remains: one lost packet stalls all streams.
- **HTTP/3:** runs over **QUIC** (UDP), so a lost packet only stalls its own stream. It has a faster connection setup (0-RTT/1-RTT with TLS 1.3 built in) and connection migration (switching from Wi-Fi to mobile data without reconnecting). It helps most on flaky mobile networks.

### Q: REST vs GraphQL: when would you choose each? [Core] [Medium]

| | REST | GraphQL |
|---|---|---|
| Endpoints | Many resource URLs | One endpoint, typed schema |
| Data shape | Server decides (over- or under-fetching is common) | Client asks for exactly the fields it needs |
| Caching | HTTP caching and CDNs work naturally | Needs client caches (Apollo, urql, Relay) keyed by type and id; POST isn't HTTP-cacheable by default |
| Versioning | `/v2/` URLs | Evolve the schema, deprecate fields |
| Tooling | Simple, universal | Codegen, typed queries, introspection |
| Risks | Chatty clients on slow networks | Expensive nested queries (needs depth/cost limits), N+1 problems on the server |

Choose GraphQL for many clients with different data needs (web, mobile) or complex, relational UIs. Choose REST for simple CRUD, public APIs and heavily cached content. A BFF (backend-for-frontend) is a common middle ground.

### Q: Polling vs long polling vs Server-Sent Events vs WebSockets? [Core] [Medium]

| | Direction | How it works | Good for |
|---|---|---|---|
| Short polling | Client → server | Request every N seconds | Simple, rare updates |
| Long polling | Client → server | Server holds the request until there's data, then the client reconnects | Fallback for real-time |
| SSE (`EventSource`) | Server → client | One long HTTP response streaming events; auto-reconnects; text only | Notifications, live scores, logs, LLM token streaming |
| WebSocket | **Both ways** | A persistent full-duplex TCP connection after an HTTP upgrade | Chat, multiplayer, collaborative editing, trading |
| WebTransport | Both ways | Built on HTTP/3/QUIC, with streams and datagrams | Low-latency media and gaming (newer) |

For WebSockets in production: heartbeats (ping/pong), reconnect with exponential backoff, re-subscribing after reconnect, message ordering and ids, and auth on connect.

### Q: Does `fetch` reject on a 404 or 500? [Core] [Easy]

No. `fetch` only rejects on **network failure** (DNS, offline, CORS blocked, aborted). For HTTP errors it **resolves** with `response.ok === false`, so you must check `ok` or `status` yourself. Also: `fetch` sends no cookies cross-origin unless `credentials: 'include'`; it has no built-in timeout (use `AbortSignal.timeout`); and the body can only be read once (`response.clone()` if you need it twice).

```js
async function http(url, options = {}) {
  const res = await fetch(url, { headers: { Accept: 'application/json', ...options.headers }, ...options, signal: options.signal ?? AbortSignal.timeout(10000) });
  if (!res.ok) {
    const body = await res.text().catch(() => '');
    throw Object.assign(new Error(`HTTP ${res.status} ${res.statusText}`), { status: res.status, body });
  }
  return res.status === 204 ? null : res.json();
}
```

### Q: Which HTTP status codes should a frontend engineer know? [Easy]

| Code | Meaning | Frontend handling |
|---|---|---|
| 200 / 201 / 204 | OK / Created / No Content | Success; 204 has no body to parse |
| 301 / 302 / 307 / 308 | Redirects (308 and 307 keep the method) | Usually followed automatically |
| 304 | Not Modified | Served from cache after revalidation |
| 400 | Bad Request | Show validation errors |
| 401 | Unauthenticated (not logged in or token expired) | Refresh the token or redirect to login |
| 403 | Forbidden (logged in, but not allowed) | Show a no-access state; don't retry |
| 404 | Not Found | Not-found UI |
| 409 | Conflict | Concurrent edit: ask the user to refresh or merge |
| 422 | Unprocessable Entity | Field-level validation errors |
| 429 | Too Many Requests | Back off; respect `Retry-After` |
| 500 / 502 / 503 / 504 | Server, gateway, unavailable, timeout | Retry with backoff where safe (idempotent methods) |

### Q: What do `preload`, `prefetch`, `preconnect` and `dns-prefetch` do? [Core] [Medium]

- `<link rel="preconnect" href="https://cdn.example.com">`: does DNS + TCP + TLS early for an origin you'll **definitely** use soon (fonts, API, image CDN).
- `<link rel="dns-prefetch">`: DNS only; cheap; a fallback for less critical origins.
- `<link rel="preload" as="image|font|script|style" href="…">`: fetch a resource needed **for the current page** with high priority, before the parser would find it (the LCP image, web fonts, a critical CSS background image). Fonts need `crossorigin`.
- `<link rel="prefetch" href="…">`: low-priority fetch of a resource likely needed for the **next navigation** (the next route's chunk).
- `<link rel="modulepreload">`: preload and parse ES modules.
- Speculation Rules API (Chromium): prefetch or **prerender** whole next pages based on rules.

### Q: How does client-side routing work (History API)? [Medium]

SPAs intercept link clicks, call `history.pushState(state, '', '/new-url')` to change the URL **without a page load**, and render the matching view. When the user presses back or forward, the browser fires `popstate` and the router renders the URL again. Hash routing (`#/path`) is the older approach that works without server configuration. With History API routing, the server must return `index.html` for unknown paths (a "fallback"), or deep links will 404. The newer **Navigation API** (`navigation.navigate`, the `navigate` event) simplifies this in Chromium.

```js
const routes = { '/': () => 'Home', '/about': () => 'About us' };
const render = () => console.log('render:', (routes[location.pathname] || (() => 'Not found'))());
function navigate(path) { history.pushState({}, '', path); render(); }
window.addEventListener('popstate', render);
navigate('/about');
navigate('/missing');
```

### Q: What are Web Components and the Shadow DOM? [Medium]

Web Components are native, framework-agnostic components built from **Custom Elements** (`customElements.define('my-tag', class extends HTMLElement {…})` with lifecycle callbacks), **Shadow DOM** (an encapsulated DOM subtree whose styles don't leak in or out) and **templates and slots** for content projection. They're used for design systems shared across frameworks and for micro-frontends. Downsides: SSR is harder (declarative shadow DOM helps), forms and accessibility across shadow boundaries need care, and they're less ergonomic than framework components.

### Q: Name the most useful browser observer APIs. [Core] [Easy]

- **`IntersectionObserver`**: tells you when an element enters or leaves the viewport (or another element), off the main thread. Used for lazy loading, infinite scroll, analytics impressions and scroll animations.
- **`ResizeObserver`**: fires when an element's size changes (responsive components, charts).
