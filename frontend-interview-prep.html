That's why the **render phase must be pure**: React may call your component, throw the result away, and call it again later. Side effects in render (mutating outside variables, starting fetches, logging analytics) misbehave under concurrent features and in StrictMode.

## Concurrent rendering

Concurrency means React can work on **more than one version of the UI** and give urgent updates priority. You opt in by marking updates as non-urgent:

- **`startTransition(() => setX(…))`** / **`const [isPending, startTransition] = useTransition()`**: this update can be interrupted. Urgent updates (typing, clicks) go first, and a stale transition render is abandoned when a newer one arrives.
- **`useDeferredValue(value)`**: shows the old value for a moment while a background render with the new value runs. Use it when you don't own the `setState` call (for example, a value that arrives through props).

:::viz concurrent

> **Note:** Transitions don't make slow renders fast. They keep the UI **responsive while** the slow render happens. If the list itself is slow, memoise the rows and virtualise the list as well.

### Suspense

`<Suspense fallback={…}>` lets a part of the tree say "I'm not ready yet". React shows the nearest fallback until the content is ready. Things that can suspend: `React.lazy()` components, the `use(promise)` hook (React 19), and data libraries with Suspense support (React Query's `useSuspenseQuery`, Relay, framework loaders). Where you put the boundaries is a design decision:

:::viz suspense

During a **transition**, React keeps showing the existing UI instead of flipping back to a fallback, which avoids jarring flashes of spinners on navigation.

## Server rendering

:::viz rendering

| | When the HTML is built | Data freshness | Best for |
|---|---|---|---|
| **CSR** | in the browser | live | dashboards behind a login |
| **SSR** | per request | live | personalised or SEO pages with fresh data |
| **SSG** | at build time | stale until the next build | marketing pages, docs, blogs |
| **ISR** | at build time + background revalidation | minutes old | large catalogues |
| **Streaming SSR** | per request, flushed in chunks | live | pages with slow parts |

### Hydration

Server-rendered HTML is just markup: buttons don't work yet. **Hydration** runs your components again in the browser, rebuilds the React tree, and **attaches event handlers to the existing DOM** instead of recreating it. For that to work, the first client render must produce **exactly** the same markup as the server did. **Hydration mismatches** come from rendering anything that differs between the two: `Date.now()`, `Math.random()`, `typeof window` checks, `localStorage`, the user's locale or timezone, or invalid HTML nesting. Fix them by moving client-only values into an effect, or use `suppressHydrationWarning` for unavoidable text such as timestamps.

### React Server Components

**Server Components** run **only on the server** (at build or request time). They can be `async`, read databases and files directly, and **ship no JavaScript** to the browser: only their rendered output, in a serialised format. Interactive parts are **Client Components** (`'use client'`), which are hydrated as before. Server Components can render Client Components and pass them serialisable props, but not the other way round (except by passing them as `children`). **Server Actions** (`'use server'`) let forms and buttons call server functions directly.

The pay-off: big dependencies (markdown parsers, date libraries, SDKs) stay on the server, data fetching moves next to the component that needs it without client waterfalls, and the bundle shrinks.

## State management

Start by classifying the state. Most "we need Redux" problems turn out to be server-cache problems:

| Kind | Examples | Tool |
|---|---|---|
| **Server cache** | lists, user profile, search results | **TanStack Query** / SWR / RTK Query / framework loaders |
| **URL state** | filters, tabs, pagination, selected id | the router's search params (shareable, survives reload) |
| **Local UI state** | open/closed, input values | `useState` / `useReducer` |
| **Shared client state** | cart, editor state, wizard steps | context (rare updates) or Zustand / Redux Toolkit / Jotai (frequent updates, many readers) |
| **Form state** | validation, dirty fields | React Hook Form + a schema (zod) |

**Server-cache libraries** handle what hand-written `useEffect` fetching gets wrong: caching by key, de-duplicating requests, stale-while-revalidate, refetching on focus and reconnect, retries, pagination, optimistic updates, and invalidation after mutations.

**Redux** is one store, changed only by dispatching **actions** to pure **reducers**, read through **selectors**. Redux Toolkit removes the boilerplate (`createSlice`, built-in Immer for "mutating" syntax, RTK Query). Its strengths are predictable, traceable updates and good dev tools. Any external store connects to React's concurrent rendering safely through **`useSyncExternalStore`**.

## Performance and architecture

### Finding unnecessary re-renders

1. Measure with the **React DevTools Profiler**: which commits are slow, which components rendered, and *why*. Turn on "Highlight updates".
2. Common causes: state that's too high up, a context value that's recreated on every render, new object or function props going into memoised children, components defined inside components, and huge lists.
3. Fixes, in this order: **move state down** or **lift content up** as `children` → split the context → `memo` + `useCallback`/`useMemo` for the hot spots → virtualise long lists → `useTransition` for expensive updates that aren't urgent.

### Patterns that scale

- **Compound components**: `<Tabs><Tabs.List><Tabs.Tab/></Tabs.List><Tabs.Panel/></Tabs>` share implicit state through context. The API is flexible, and consumers control the markup.
- **Headless components and hooks** (Radix, React Aria, Headless UI, TanStack Table): behaviour and accessibility with no styling, so the design system owns the look.
- **Feature-based folders** (`features/checkout/{components,hooks,api,types}`) with a public `index.ts` for each feature, shared `ui/` primitives, and lint rules that enforce the boundaries between them.
- **Error boundaries** per route and per widget, so one broken panel doesn't blank the whole app.

> **In short:** Fiber makes rendering interruptible; transitions and Suspense use that to prioritise; SSR, streaming and RSC move work to the server; hydration must match; classify state before you choose a library; and profile before you optimise.

## The rendering model

React's core idea fits in one line: **UI = f(state)**. You describe what the screen should look like for the current state, and React works out how to change the DOM to match. You never write "add this class, then remove that node". That's what **declarative** means.

A React update always goes through the same three steps:

:::html
<figure class="fig"><svg viewBox="0 0 680 170" role="img" aria-label="Trigger, render, commit: a state change triggers a render that calls components to produce a new tree, React diffs it with the previous tree, and commits only the differences to the DOM.">
<defs><marker id="mk-rr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" class="s-fM"/></marker></defs>
<rect class="s-cur" x="10" y="40" width="170" height="70" rx="12"/><text class="s-tb" x="95" y="68" text-anchor="middle">1. Trigger</text><text class="s-ts" x="95" y="88" text-anchor="middle">setState · new props</text><text class="s-ts" x="95" y="102" text-anchor="middle">context change · first mount</text>
<rect class="s-acc" x="250" y="40" width="180" height="70" rx="12"/><text class="s-tb" x="340" y="68" text-anchor="middle">2. Render</text><text class="s-ts" x="340" y="88" text-anchor="middle">call components → JSX tree</text><text class="s-ts" x="340" y="102" text-anchor="middle">diff with previous tree</text>
<rect class="s-ok" x="500" y="40" width="170" height="70" rx="12"/><text class="s-tb" x="585" y="68" text-anchor="middle">3. Commit</text><text class="s-ts" x="585" y="88" text-anchor="middle">apply DOM changes</text><text class="s-ts" x="585" y="102" text-anchor="middle">then run effects</text>
<path class="s-line a-dash" marker-end="url(#mk-rr)" d="M180,75 H246"/><path class="s-line a-dash" marker-end="url(#mk-rr)" d="M430,75 H496"/>
<text class="s-tA" x="340" y="140" text-anchor="middle">pure: no side effects, may run more than once</text><text class="s-tG" x="585" y="140" text-anchor="middle">side effects happen here</text>
</svg><figcaption>"Rendering" means calling your component functions. It doesn't mean touching the DOM. Many renders change no DOM at all.</figcaption></figure>
:::

**JSX** is syntax for function calls: `<Button kind="primary">Save</Button>` compiles to `jsx(Button, { kind: 'primary', children: 'Save' })`, which returns a plain object describing the element. The tree of those objects is often called the "virtual DOM".

### Reconciliation and keys

After a render, React compares the new element tree with the previous one. A general tree diff would cost O(n³), so React uses two heuristics that make it O(n):

1. **Different element type → replace the whole subtree.** Changing `<div>` to `<section>`, or `<ProfileA>` to `<ProfileB>`, unmounts the old subtree (its state is lost) and mounts a new one.
2. **Same type → keep the DOM node or component instance**, update the changed attributes or props, and recurse into the children. For lists of children, React matches them **by `key`**.

:::viz reconcile

> **Pitfall:** **Never define a component inside another component.** `function Parent() { function Child() {…}; return <Child/> }` creates a *new* `Child` type on every render. Rule 1 then applies, so Child unmounts and remounts each time: its state is lost, inputs lose focus, and effects re-run.

### When does a component re-render?

A component re-renders when **its state changes**, when **its parent re-renders**, or when **a context it reads changes**. Props changing isn't a separate cause: props only change because the parent re-rendered. By default, a parent's re-render re-renders **all** of its children, whether or not their props changed.

:::viz rerender

That's normally fine. Rendering is fast, and React only touches the DOM where something differs. Optimise only when profiling shows a slow subtree. The tools are below, under "Refs and memoisation".

## State

State is a component's memory between renders. Three properties explain most state questions:

- **State is a snapshot.** Within one render, `count` is a constant. Calling `setCount` doesn't change the variable you already have. It **asks for a new render**, in which `useState` will return the new value.
- **Updates are queued and batched.** All the `setX` calls in an event handler (and, since React 18, in timeouts and promises too) are processed together in **one** re-render.
- **Updating with the same value** (checked with `Object.is`) skips the re-render.

:::viz batching

### Immutable updates

React decides whether something changed by comparing **references**. Mutating an object in place (`user.name = 'Bo'; setUser(user)`) keeps the same reference, so React may skip the update, and memoised children definitely will. Always create new objects and arrays along the path you changed:

```js run
const state = { user: { name: 'Ada', tags: ['admin'] }, theme: 'dark' };
const next = { ...state, user: { ...state.user, tags: [...state.user.tags, 'editor'] } };
console.log(next.user.tags, state.user.tags);              // the original is untouched
console.log(next.theme === state.theme, next.user === state.user); // unchanged branches are shared
// arrays: add [...a, x] · remove a.filter(...) · replace a.map(...) · sort a.toSorted() — never push/splice/sort on state
```

### Choosing where state lives

- **Keep the minimal state, and derive the rest during render.** If `fullName` can be computed from `first` and `last`, don't store it. Copying props into state goes out of sync as soon as the prop changes.
- **Lift state up** to the closest common parent when two siblings need it. Push it **down** when only one subtree uses it, which also keeps re-renders local.
- **Controlled** inputs (`value` + `onChange`) keep React as the single source of truth: good for validation and dependent fields. **Uncontrolled** inputs (`defaultValue` + a ref, or `FormData`) are simpler and render less: good for large, simple forms.
- **`useReducer`** when there are several related values, when the next state depends on the action type, or when you want the logic testable as a pure function.

## Effects

`useEffect` is for **synchronising your component with something outside React**: a subscription, a socket, a timer, a non-React widget, the document title, analytics. It runs **after** the browser paints. When its dependencies change, React runs the previous effect's cleanup, then the effect again. On unmount, the cleanup runs one last time.

:::viz effects

The effect bugs interviewers love:

| Bug | Symptom | Fix |
|---|---|---|
| Missing dependency | stale values; the effect doesn't re-run | include everything it reads (the lint rule tells you) |
| Object or function created during render, used as a dependency | the effect runs after every render; infinite loops | move it inside the effect, memoise it, or depend on primitive values |
| No cleanup | leaks, duplicate subscriptions, setState after unmount | return a cleanup function; abort fetches |
| Race condition while fetching | old responses overwrite new ones | `AbortController`, or an `ignore` flag set in the cleanup |
| Effect used for derived data or events | extra renders and flicker | compute during render; handle events in the event handler |

> **Rule of thumb:** "You might not need an effect." If something can be calculated from props and state, **calculate it during render** (with `useMemo` if it's expensive). If it happens because the user did something, put it in the **event handler**. Effects are for synchronising with external systems, and for little else.

`useLayoutEffect` has the same API but runs **before paint**, synchronously. Use it to measure the DOM and adjust layout without a visible flicker (tooltips, scroll restoration). In development, `StrictMode` deliberately mounts, unmounts and remounts each component once, to expose missing cleanups.

## Refs and memoisation

**`useRef`** gives you a mutable box (`{ current }`) that **persists across renders without causing them**. Use it for DOM nodes (focus, measuring, scrolling), timer and request ids, the "latest value" in a callback, and previous values. Don't read or write `ref.current` during render (except for lazy initialisation): it isn't part of React's data flow.

### The memoisation toolkit

| Tool | Caches | Helps when |
|---|---|---|
| `useMemo(fn, deps)` | a **value** | an expensive calculation, or keeping an object stable for a memoised child or an effect's deps |
| `useCallback(fn, deps)` | a **function** reference | passing a callback to a `memo` child, or using it in an effect's deps |
| `React.memo(Component)` | a component's **render output**, when props are shallow-equal | a child that's expensive to render and whose parent re-renders often |

They work as a **team**: `React.memo` on the child does nothing if the parent passes a new object or arrow function on every render, and `useCallback` on its own does nothing if no child is memoised. The **React Compiler** (React 19 era) adds this memoisation automatically at build time, but you still need to understand it for interviews and for existing codebases.

> **Tip:** Before memoising, try **moving state down** (into a smaller component) or **lifting content up** (passing the expensive tree as `children`). A component's `children` are created by its parent, so they don't re-render when the component's own state changes.

### Stale closures

Each render's functions close over that render's props and state. A callback created in render #1 keeps seeing render #1's values forever, unless it's recreated.

```js run
// A simulation of a stale interval closure
function makeComponent() {
  let renderCount = 0;
  function render(count) {
    renderCount++;
    // the closure captures this render's count
    return () => console.log('interval sees count =', count, '(created in render', renderCount + ')');
  }
  const tickFromFirstRender = render(0);   // useEffect(..., []) keeps the first render's callback
  render(1); render(2);                     // later renders create new callbacks the effect never sees
  tickFromFirstRender();                    // stale: still 0
}
makeComponent();
// Fixes: setCount(c => c + 1) · put count in the deps · store the latest value in a ref
```

## Context and composition

**Context** passes a value deep into the tree without threading it through every level ("prop drilling"). It's **dependency injection, not a state manager**: when the provider's `value` changes (by reference), **every** component that reads that context re-renders, even if it only uses part of the value. `memo` doesn't stop it.

- Keep context values stable (`useMemo` the value object), and **split contexts** by how often they change (for example, `ThemeContext` separately from `CartContext`, and a separate context for state and for dispatch).
- For frequently changing global state with many readers, use a store with **selectors** (Zustand, Redux, Jotai) so components re-render only when their slice changes.
- Before using context, try **composition**: pass components as `children` or props (slots), which often removes the need for drilling at all.

### The Rules of Hooks

React stores each component's hook state in a list, **in call order**. That's why hooks must be called unconditionally, at the top level, in the same order on every render.

:::viz hookslots

### Reusing logic

| Pattern | What it is | Today |
|---|---|---|
| **Custom hooks** | `useSomething()` functions that call other hooks | **the default**: composable and explicit |
| Higher-order components | `withX(Component)` wraps a component and injects props | legacy; wrapper hell, prop name collisions |
| Render props | `<X render={data => …} />` | still handy for headless components; mostly replaced by hooks |

Also on the list: **fragments** (group children without a wrapper div), **portals** (render a modal or tooltip into `document.body` while keeping React context and event bubbling), **error boundaries** (class components with `getDerivedStateFromError`, which catch errors during render, not in event handlers or async code), and the `{count && <List/>}` bug (which renders a literal `0`; use `count > 0 &&`).

> **In short:** UI = f(state); render is pure and cheap; keys keep identity; state is a snapshot, updated immutably and in batches; effects synchronise with the outside world; memoise only where profiling says so; and hooks are an ordered list.

## What a custom hook really is

A custom hook is **just a function whose name starts with `use` and that calls other hooks**. It doesn't share state between the components that use it: every call gets its **own** state, as if you had pasted the hook's body into the component. What it shares is **logic**.

That gives you the design checklist for every "write `useX`" question:

1. **The API**: what goes in (values, options, callbacks) and what comes out (a value, a tuple like `useState`, or an object for many fields)? Return stable references where you can.
2. **State and refs**: what must cause a re-render (state), and what only needs remembering (refs)?
3. **Effects and cleanup**: what does it subscribe to, and how does it unsubscribe? What happens when the inputs change partway through?
4. **Edge cases**: SSR (`window` doesn't exist on the server), unmounting during async work, StrictMode's double mount, and rapidly changing inputs.

> **Key idea:** Most hook bugs are **stale closures** or **missing cleanups**. The two tools that fix them are the **functional updater** (`setX(prev => …)`) and the **"latest ref" pattern**: keep the newest callback in a ref so that a long-lived subscription always calls the current one.

## Timing hooks

`useDebounce(value, delay)` returns a value that only catches up after `delay` ms with no changes. It's an effect that sets a timer, and **clears it in the cleanup**, so every change cancels the previous timer.

:::viz debounce

```jsx
function useDebounce(value, delay = 300) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const id = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(id);          // a new value (or unmount) cancels the pending update
  }, [value, delay]);
  return debounced;
}
```

### `useInterval` and the latest-ref pattern

`setInterval` inside `useEffect(…, [])` captures the first render's callback forever (a stale closure). If you put the callback in the dependency array instead, the interval restarts on every render. The fix is to keep the **latest callback in a ref**, and keep the interval itself stable:

```jsx
function useInterval(callback, delay) {
  const saved = useRef(callback);
  useLayoutEffect(() => { saved.current = callback; });   // always the newest closure
  useEffect(() => {
    if (delay == null) return;                             // null pauses it
    const id = setInterval(() => saved.current(), delay);
    return () => clearInterval(id);
  }, [delay]);
}
```

The same pattern powers `useEventListener`, `useOnClickOutside` and any hook that takes a handler. (React's `useEffectEvent` is an official version of this idea.)

## State helpers

- **`usePrevious(value)`**: a ref updated in an effect, so during render it still holds the previous render's value.
- **`useToggle(initial)`**: `useReducer(v => !v, initial)` gives you a stable toggle function for free.
- **`useLocalStorage(key, initial)`**: lazy initial state (read storage once, inside a try/catch, guarded for SSR), write on change, and listen to the `storage` event to **sync across tabs**. Values must be JSON-serialisable.

## Data and DOM hooks

### `useFetch` without race conditions

The hard part of a fetching hook isn't the fetch. It's what happens when the URL changes **before the previous request finishes**. Without cancellation, a slow old response can arrive last and overwrite the new data.

:::viz typeahead

```jsx
function useFetch(url) {
  const [state, setState] = useState({ data: null, error: null, loading: true });
  useEffect(() => {
    const ctrl = new AbortController();
    setState(s => ({ ...s, loading: true, error: null }));
    fetch(url, { signal: ctrl.signal })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => setState({ data, error: null, loading: false }))
      .catch(error => { if (error.name !== 'AbortError') setState({ data: null, error, loading: false }); });
    return () => ctrl.abort();             // URL changed or unmounted: cancel the old request
  }, [url]);
  return state;
}
```

> **Interview:** Mention what this hook *doesn't* do: caching, de-duplication, retries, refetching on focus, pagination. Then say "in production I'd use TanStack Query for server state". It shows you know where hand-written hooks stop being worth it.

### DOM and browser hooks

| Hook | Built on | Remember to |
|---|---|---|
| `useOnClickOutside(ref, handler)` | a `pointerdown` listener on the document | check `ref.current.contains(e.target)`; use the latest-ref pattern for the handler; remove the listener |
| `useInView(ref, options)` | `IntersectionObserver` | disconnect in the cleanup; recreate when the options change; option to stop after the first time it's seen |
| `useMediaQuery(query)` | `matchMedia` + its `change` event | SSR default; or use `useSyncExternalStore` for tear-free reads |
| `useWindowSize()` | the `resize` event | throttle, or use rAF; or prefer CSS / container queries |
| `useEventListener(target, type, handler)` | `addEventListener` | latest-ref for the handler; passive option; remove on cleanup |

### Subscribing to external stores

For anything outside React that can change (a browser API, a store, a WebSocket), `useSyncExternalStore(subscribe, getSnapshot, getServerSnapshot)` is the correct primitive. It guarantees that every component sees the same value during a concurrent render (no "tearing").

```jsx
const subscribe = cb => { addEventListener('online', cb); addEventListener('offline', cb); return () => { removeEventListener('online', cb); removeEventListener('offline', cb); }; };
const useOnline = () => useSyncExternalStore(subscribe, () => navigator.onLine, () => true);
```

## Testing hooks

Test a hook through a tiny component, or with `renderHook` from React Testing Library. Wrap updates in `act`, use fake timers for debounce and interval hooks, and mock `fetch` (or use MSW) for data hooks. Assert on behaviour (the value it returns, the calls made) rather than on implementation details.

> **In short:** a custom hook shares logic, not state. Name it `useX`, keep its return values stable, clean up every subscription, use updaters and latest-refs to beat stale closures, and abort old requests.

<script type="text/x-learn" data-for="security" data-mins="9">
## The frontend threat model

The browser runs code from many sources (your bundle, npm packages, third-party scripts, user content) on one page, with access to the user's session. Most frontend security comes down to three questions:

1. **Can an attacker get their code running on my origin?** That's **XSS**. It's the worst outcome, because that code can do anything the user can.
2. **Can another site make the user's browser act on my site?** That's **CSRF** and **clickjacking**.
3. **Can secrets leak?** Tokens in storage, data in URLs, over-permissive CORS, source maps, and supply-chain attacks.

:::html
<figure class="fig"><svg viewBox="0 0 680 190" role="img" aria-label="Three attack paths into a page: injected script (XSS), a cross-site request riding cookies (CSRF), and framing the page (clickjacking).">
<rect class="s-ok" x="250" y="40" width="180" height="110" rx="14"/><text class="s-tb" x="340" y="70" text-anchor="middle">bank.com tab</text><text class="s-ts" x="340" y="92" text-anchor="middle">DOM · cookies · tokens</text><text class="s-ts" x="340" y="110" text-anchor="middle">user is logged in</text>
<rect class="s-bad" x="10" y="20" width="170" height="44" rx="10"/><text class="s-t" x="95" y="47" text-anchor="middle">XSS: injected &lt;script&gt;</text>
<rect class="s-bad" x="10" y="124" width="170" height="44" rx="10"/><text class="s-t" x="95" y="151" text-anchor="middle">CSRF: forged POST</text>
<rect class="s-bad" x="500" y="70" width="170" height="44" rx="10"/><text class="s-t" x="585" y="97" text-anchor="middle">clickjacking: iframe</text>
<path class="s-lR a-dash" d="M180,42 C220,42 230,60 248,70"/><path class="s-lR a-dash" d="M180,146 C220,146 230,130 248,124"/><path class="s-lR a-dash" d="M500,92 H432"/>
<text class="s-tG" x="340" y="178" text-anchor="middle">defences: escape + CSP · SameSite + tokens · frame-ancestors</text>
</svg><figcaption>Each attack has a matching layer of defence. Use all of them: defence in depth.</figcaption></figure>
:::

## XSS: cross-site scripting

XSS happens when **untrusted data is interpreted as code** in your page. Types: **stored** (saved in the database, shown to other users), **reflected** (from the URL, echoed back), and **DOM-based** (client-side code moves data from a *source* such as `location.hash` or `postMessage` into a *sink* such as `innerHTML` or `eval`).

:::viz xss

Defences, from most to least important:

1. **Escape output by default.** React, Vue and Angular escape text interpolation. The dangerous sinks are `dangerouslySetInnerHTML`, `v-html`, `innerHTML`, `outerHTML`, `insertAdjacentHTML`, `document.write`, `eval`, `new Function`, and `setTimeout` with a string.
2. **Sanitise when you must render HTML** (rich text, markdown output): use **DOMPurify** with a strict allow-list. Never write your own regex filter.
3. **Validate URLs**: `href={userUrl}` lets through `javascript:` URLs. Allow only `http:`, `https:` and `mailto:`.
4. **Content Security Policy** limits what can run even if an injection gets through (below).
5. **Trusted Types** make dangerous sinks only accept values from vetted policies.
6. **HttpOnly cookies**, so a successful XSS can't steal the session token (though it can still act as the user while the page is open).

### Content Security Policy

CSP is a response header that tells the browser which sources of script, style, images and connections are allowed:

```http
Content-Security-Policy:
  default-src 'self';
  script-src 'self' 'nonce-r4nd0m' 'strict-dynamic';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: https://cdn.example.com;
  connect-src 'self' https://api.example.com;
  frame-ancestors 'none';
  base-uri 'none';
  object-src 'none';
  report-to csp-endpoint
```

The key idea: with a **nonce** (a random value per response) or hash-based `script-src` and no `'unsafe-inline'`, injected `<script>` tags and inline event handlers simply **don't run**. Roll it out with `Content-Security-Policy-Report-Only` first, collect the violations, then enforce.

## CSRF: cross-site request forgery

Browsers attach cookies to every request to a site, **whichever page started the request**. So if you're logged in to bank.com and visit evil.com, a hidden auto-submitting form can make your browser POST to bank.com with your session cookie attached.

:::viz csrf

Defences:

- **`SameSite` cookies**: `Lax` (now the browser default) stops cookies being sent on cross-site POSTs, iframes and fetches. `Strict` stops them on all cross-site requests.
- **CSRF tokens**: a random token per session that the attacker can't read, sent back in a header or form field and checked on the server.
- **Check `Origin` / `Sec-Fetch-Site`** on requests that change state.
- **Never change state on GET.**
- APIs that use `Authorization: Bearer` headers (not cookies) aren't vulnerable to CSRF, because browsers don't attach those automatically. But then the token has to live somewhere JavaScript can read, which brings back the XSS risk.

## Clickjacking

The attacker loads your page in an invisible iframe and tricks the user into clicking your real buttons. Defence: `Content-Security-Policy: frame-ancestors 'none'` (or a list of allowed origins), plus the legacy `X-Frame-Options: DENY`.

## Authentication in single-page apps

### Where should tokens live?

| Option | XSS can steal it? | CSRF risk? | Notes |
|---|---|---|---|
| localStorage / sessionStorage | **yes** | no | easy, but any injected script can read it |
| In-memory variable | harder (gone on reload) | no | pair it with a silent refresh |
| **HttpOnly, Secure, SameSite cookie** | **no** | needs SameSite/tokens | the recommended default |
| BFF (backend-for-frontend) holds the tokens | no | handled by the BFF | the most secure for OAuth; the browser only has a session cookie |

### OAuth 2.0 + PKCE

SPAs can't keep a client secret (everything in the bundle is public). The **Authorization Code flow with PKCE** replaces the secret with a one-time random *verifier* that only the app that started the flow knows.

:::viz oauth

### JWT pitfalls

A JWT is a **signed**, not encrypted, JSON payload: anyone can base64-decode it and read it. Don't put secrets in it. Verify the signature and `alg` on the server (reject `none`), keep access tokens short-lived, rotate refresh tokens, and remember you can't revoke a JWT before it expires without a server-side denylist.

## Other things to know

- **Supply chain**: lockfiles, `npm audit`/Dependabot, Subresource Integrity (`integrity="sha384-…"`) for CDN scripts, and as few third-party scripts as possible. Each one runs with your page's full privileges.
- **`target="_blank"`**: modern browsers apply `rel="noopener"` by default. Add it explicitly for older ones, or the opened page gets `window.opener`.
- **`postMessage`**: always check `event.origin`, and send with an exact `targetOrigin`, never `'*'` for sensitive data.
- **Secrets in the frontend**: any API key in the bundle is public. Use a backend proxy, and restrict keys by domain and scope.
- **Open redirects**: validate `?redirect=` parameters against an allow-list.
- **Prototype pollution**: deep-merging untrusted JSON can set `__proto__`. Block those keys, or use `Object.create(null)` and Maps.
- **Security headers**: `Strict-Transport-Security`, `X-Content-Type-Options: nosniff`, `Referrer-Policy: strict-origin-when-cross-origin`, `Permissions-Policy`.

> **In short:** treat every piece of input as data, never code; let the framework escape; sanitise the rare HTML; add a CSP; keep sessions in HttpOnly SameSite cookies; use PKCE (ideally behind a BFF) for OAuth; and keep third-party code to a minimum.
</script>
<script type="text/x-learn" data-for="testing" data-mins="5">
## Why we test, and what to test

Tests exist to give you **confidence to change code**. A good test fails when behaviour breaks, and **only** then. A test that breaks every time you refactor, even though the user sees no difference, costs more than it's worth.

The guiding principle, from Testing Library: *"The more your tests resemble the way your software is used, the more confidence they can give you."* So test **behaviour through the public interface**, the way a user or a calling module would, not implementation details like internal state, private methods or component instance names.

## The testing trophy

:::html
<figure class="fig"><svg viewBox="0 0 680 260" role="img" aria-label="The testing trophy: static analysis at the base, then unit tests, a wide band of integration tests, and end-to-end tests at the top.">
<polygon class="s-cur" points="290,20 390,20 410,62 270,62"/><text class="s-t" x="340" y="46" text-anchor="middle">End-to-end</text>
<polygon class="s-ok" points="230,66 450,66 480,150 200,150"/><text class="s-tb" x="340" y="104" text-anchor="middle">Integration</text><text class="s-ts" x="340" y="124" text-anchor="middle">components + hooks + mocked network</text>
<polygon class="s-acc" points="250,154 430,154 420,196 260,196"/><text class="s-t" x="340" y="180" text-anchor="middle">Unit</text>
<rect class="s-spec" x="200" y="200" width="280" height="40" rx="8"/><text class="s-t" x="340" y="225" text-anchor="middle">Static: TypeScript + ESLint</text>
<text class="s-ts" x="500" y="40">slow, costly, most realistic</text><text class="s-ts" x="500" y="104">best confidence per minute</text><text class="s-ts" x="500" y="180">fast, focused (pure logic)</text><text class="s-ts" x="500" y="225">catches typos and types for free</text>
<text class="s-ts" x="20" y="60">Playwright / Cypress</text><text class="s-ts" x="20" y="108">RTL + Vitest/Jest + MSW</text><text class="s-ts" x="20" y="180">Vitest / Jest</text><text class="s-ts" x="20" y="225">tsc, eslint</text>
</svg><figcaption>The width shows roughly how much of your effort goes into each layer. For frontend apps, integration tests give the best return.</figcaption></figure>
:::

| Layer | Tests | Speed | Use it for |
|---|---|---|---|
| Static | types, lint rules | instant | whole classes of bugs (null access, typos, hooks rules) |
| Unit | pure functions, reducers, utilities | ms | tricky logic with many edge cases (formatters, parsers, state machines) |
| Integration | a component tree with real children and a mocked network | ~100 ms | user flows inside a feature: type, click, see the result |
| End-to-end | the real app in a real browser | seconds | critical journeys: sign-up, checkout, auth. Keep these few. |

> **Rule of thumb:** Don't chase 100% coverage. Cover the **critical paths and the tricky logic**. Coverage tells you what's untested, not what's well tested.

## React Testing Library

RTL renders components into a DOM (jsdom) and makes you query it **the way users and assistive technology do**. Query priority:

1. **`getByRole('button', { name: /save/i })`**: the best choice. It also checks that your accessibility is right.
2. `getByLabelText`, `getByPlaceholderText`, `getByText`, `getByDisplayValue`.
3. `getByAltText`, `getByTitle`.
4. `getByTestId`: a last resort, for things with no accessible handle.

Query variants: `getBy*` (throws if missing, for things that should be there now), `queryBy*` (returns `null`, for asserting that something is **absent**), and `findBy*` (async, waits for something to **appear**). Use **`user-event`** rather than `fireEvent`: it simulates the full sequence of real events (pointer down/up, focus, keydown/press/up, input).

```jsx
test('adds a todo', async () => {
  const user = userEvent.setup();
  render(<TodoApp />);
  await user.type(screen.getByRole('textbox', { name: /new todo/i }), 'Write tests');
  await user.click(screen.getByRole('button', { name: /add/i }));
  expect(screen.getByRole('listitem')).toHaveTextContent('Write tests');
  expect(screen.getByRole('textbox', { name: /new todo/i })).toHaveValue('');
});
```

## Async code, network and timers

- **Network**: mock at the **network boundary** with **MSW** (Mock Service Worker), not by mocking `fetch` or your API module. The component, hooks and data library all run for real. Test the loading, success, empty and **error** states.
- **Waiting**: `await screen.findByText(...)` or `await waitFor(() => expect(...))`. Never use fixed `sleep`s.
- **Timers** (debounce, polling, toasts): `vi.useFakeTimers()` / `jest.useFakeTimers()`, then `advanceTimersByTime(300)`. With user-event, pass `advanceTimers: vi.advanceTimersByTime`.
- **Hooks**: `renderHook(() => useCounter())`, wrapping updates in `act`.

### Test doubles

| Double | What it does | Example |
|---|---|---|
| **Stub** | returns canned answers | a fake API that always returns two users |
| **Spy** | records calls (and may keep the real behaviour) | `vi.spyOn(analytics, 'track')`, then assert it was called |
| **Mock** | a replacement with expectations built in | `vi.fn()` passed as an `onSubmit` prop |
| **Fake** | a lightweight working implementation | an in-memory storage, or MSW handlers |

Mock **only what you don't own or can't control** (the network, time, randomness, browser APIs that jsdom lacks). Over-mocking produces tests that pass while the app is broken.

## End-to-end tests without flakiness

Flaky tests teach the team to ignore failures. Ways to keep them out:

- Use **role- and text-based locators** (`page.getByRole('button', { name: 'Pay' })`), not CSS chains.
- Rely on **auto-waiting** assertions (`await expect(locator).toBeVisible()`), never fixed timeouts.
- **Isolate the data**: each test creates its own user and records through the API, and cleans up after.
- **Mock third parties** (payments, analytics), and use stable seeds and a frozen clock.
- Run in CI with retries **plus** trace or video on failure, and track flaky tests so they get fixed instead of retried forever.

## Other kinds of tests

- **Snapshot tests**: useful for small, stable output (a serialiser's result, an error message). Large component snapshots get approved without being read, so prefer explicit assertions.
- **Visual regression** (Chromatic, Playwright screenshots): catches CSS breakage in a design system.
- **Accessibility**: `jest-axe` / `@axe-core/playwright` in CI catch the mechanical issues. Keyboard and screen reader checks are still manual.
- **Contract tests**: check that your API mocks still match the real schema (for example, with types generated from OpenAPI).

> **In short:** static checks at the base, a thick layer of integration tests with RTL + MSW, unit tests for tricky logic, and a few reliable E2E tests for critical journeys. Query by role, mock at the network edge, and never sleep.

## What happens between your code and the browser

Modern frontend source code isn't what the browser runs. TypeScript, JSX, CSS modules, imports from `node_modules`, environment variables and hundreds of small modules all have to become a few optimised, cacheable files. That pipeline:

:::viz bundler

## webpack vs Vite

| | webpack | Vite |
|---|---|---|
| Dev server | bundles the whole app first, then serves it; HMR rebuilds the affected chunks | serves **native ES modules** on demand; only pre-bundles dependencies (esbuild) |
| Cold start | grows with the size of the app | nearly instant |
| Production build | webpack itself | Rollup (moving to Rolldown) |
| Configuration | very flexible, loaders + plugins, verbose | sensible defaults, Rollup-compatible plugins |
| Strengths | mature ecosystem, Module Federation, edge cases | developer experience, speed, simplicity |

**Transpilers**: Babel (JavaScript, plugin-rich, slow), **SWC** and **esbuild** (written in Rust/Go, 20–100× faster, strip types without checking them). `tsc` is the only one that **type-checks**, so a common setup is esbuild/SWC for builds and `tsc --noEmit` in CI.

### Tree shaking and what breaks it

Tree shaking removes exports that are never imported. It needs **static ES module syntax**. It's defeated by: CommonJS (`require`, `module.exports`), **side effects at module top level** (packages should declare `"sideEffects": false`), barrel files that re-export everything from modules with side effects, dynamic property access on namespaces (`utils[name]`), and Babel configs that turn ESM into CommonJS.

### Source maps

Source maps link the minified output back to your source, for readable stack traces. Ship them to your **error tracker** (Sentry), either privately or publicly; `hidden-source-map` emits the maps without referencing them from the bundle. Decide consciously whether to make your source code public.

## Packages and repositories

- **Semver**: `MAJOR.MINOR.PATCH`. `^1.2.3` allows any `1.x.x` at or above 1.2.3; `~1.2.3` allows only `1.2.x`. The **lockfile** pins exact versions, so it must be committed, and CI must install with `npm ci` / `pnpm install --frozen-lockfile`.
- **npm vs yarn vs pnpm**: pnpm uses a content-addressed store and symlinks, so it's fast, saves disk space, and is **strict** (you can't import packages you didn't declare). It's the usual choice for monorepos.
- **Monorepo vs polyrepo**: a monorepo (pnpm workspaces + Turborepo or Nx) gives atomic changes across packages, one toolchain and easy sharing, but needs build caching and ownership rules. Polyrepos give strong isolation and independent versions, at the cost of coordination.

## Micro-frontends and Module Federation

Micro-frontends let **independent teams deploy parts of one product independently**. Options, from simplest to most complex: build-time packages (no independent deploys), iframes (strong isolation, clumsy UX), **runtime composition** with Module Federation, single-spa or Web Components.

**Module Federation**: each app (a "remote") exposes modules through a `remoteEntry.js` manifest. The host loads them at runtime and **shares singletons** like React, so there's only one copy, with version negotiation. The costs are real: version drift, duplicated dependencies, a fragmented UX, and harder testing and performance. Choose it for **organisational** reasons (many teams, independent release cycles), not technical ones.

## Delivery and operations

### A good CI/CD pipeline

Install (with caching) → lint + type-check → unit and integration tests → build → bundle-size and Lighthouse budgets → a **preview deployment per pull request** → E2E against the preview → deploy (with the CDN cache headers set correctly) → smoke tests → gradual rollout behind feature flags, with fast rollback.

### Configuration and secrets

Frontend environment variables (`VITE_*`, `NEXT_PUBLIC_*`) are **inlined into the bundle at build time**, so they're **public**. Never put secrets there. Keep secrets on a server or BFF. For "build once, deploy anywhere", fetch runtime config from `/config.json` or inject it into the HTML.

### Feature flags and experiments

Flags decouple **deploy** from **release**: ship dark, turn on for internal users, then roll out by percentage, then clean up the flag. For A/B tests, assign users to variants consistently (hashing the user id), avoid content flicker (evaluate on the server or at the edge), and track exposure events.

### Monitoring in production

- **Errors**: Sentry or similar, with source maps, release tags, user context, and breadcrumbs (route changes, clicks, network calls).
- **Performance**: RUM through `web-vitals` (LCP, INP, CLS) broken down by route, device and connection, plus long-task and resource timing.
- **Business signals**: conversion funnels, so you can spot "the checkout button stopped working" even when nothing throws.
- **Alerts** on error-rate spikes after each release, tied to quick rollbacks.

### Internationalisation

ICU message formats with plurals and gender (FormatJS / i18next), `Intl.DateTimeFormat`, `NumberFormat` and `RelativeTimeFormat` for locale formatting, translation keys extracted at build time, translations lazy-loaded per locale, **RTL support** with CSS logical properties (`margin-inline-start`), and layouts with room for text that grows (German can be ~30% longer than English).

> **In short:** know what a bundler does (graph → transform → shake → split → hash), why Vite is fast in development, what breaks tree shaking, that frontend env vars are public, and what a production-grade pipeline and monitoring setup look like.

## How TypeScript thinks

TypeScript is JavaScript plus a **static type checker** that runs at build time. The types are **erased** when it compiles: nothing about them exists at runtime. Two consequences come up in interviews constantly:

1. **Types can't validate runtime data.** A response typed as `User` is only a promise you made to the compiler. Validate untrusted input (API responses, `localStorage`, forms) with a schema library like **zod** or valibot, and derive the type from the schema.
2. **The type system is structural.** Two types are compatible if their **shapes** match, whatever their names. A `{ name: string, age: number }` is assignable to `{ name: string }`.

:::html
<figure class="fig"><svg viewBox="0 0 680 190" role="img" aria-label="Types as sets: never is the empty set, literal types are single values, string contains all literals, unknown contains everything.">
<rect class="s-box2" x="10" y="10" width="660" height="170" rx="16"/><text class="s-tb" x="26" y="36">unknown</text><text class="s-ts" x="100" y="36">every value (the top type: safe, you must narrow it before use)</text>
<rect class="s-acc" x="30" y="50" width="300" height="116" rx="14"/><text class="s-tb" x="46" y="74">string</text>
<rect class="s-box" x="50" y="88" width="80" height="30" rx="15"/><text class="s-t" x="90" y="108" text-anchor="middle">"ok"</text>
<rect class="s-box" x="140" y="88" width="90" height="30" rx="15"/><text class="s-t" x="185" y="108" text-anchor="middle">"error"</text>
<text class="s-ts" x="50" y="146">"ok" | "error" is a smaller set inside string</text>
<rect class="s-spec" x="350" y="50" width="200" height="116" rx="14"/><text class="s-tb" x="366" y="74">number</text><text class="s-ts" x="366" y="96">1 | 2 | 3 …</text>
<rect class="s-bad" x="570" y="96" width="80" height="34" rx="17"/><text class="s-t" x="610" y="118" text-anchor="middle">never</text><text class="s-ts" x="610" y="150" text-anchor="middle">empty set</text>
</svg><figcaption>Think of types as sets of values. A union (|) combines sets, an intersection (&amp;) keeps only what's in both, and assigning A to B asks "is A a subset of B?"</figcaption></figure>
:::

### `any`, `unknown` and `never`

| | Meaning | Use it for |
|---|---|---|
| `any` | turns type checking **off** in both directions | escape hatches while migrating; avoid it (`noImplicitAny`) |
| `unknown` | could be anything, and you **must narrow** before using it | `catch (e)`, `JSON.parse` results, external input |
| `never` | no value can have this type | exhaustiveness checks; functions that always throw; impossible branches |

### `type` vs `interface`

Both describe object shapes. `interface` can be **extended and merged** across declarations (good for public library APIs and augmenting globals). `type` can express **anything**: unions, tuples, mapped and conditional types. A common team rule: `type` by default, `interface` for objects you expect others to extend. Either answer is fine if you explain it.

## Narrowing

Most day-to-day TypeScript is **control-flow narrowing**: the checker follows your `if`s, `switch`es and early returns, and makes the type of a variable more specific at each point.

:::viz narrowing

**Discriminated unions** are the most useful pattern in frontend TypeScript. Model state as a union of explicit cases instead of a bag of optional fields, so impossible states can't be written:

```ts
// ❌ allows nonsense like { loading: true, error: 'x', data: user }
type Bad = { loading: boolean; error?: string; data?: User };

```

## Generics

Generics are **type parameters**: they let a function or type work over many types while keeping the relationship between its input and output.

```ts
function first<T>(arr: T[]): T | undefined { return arr[0]; }        // first([1, 2]) is number | undefined
function pluck<T, K extends keyof T>(items: T[], key: K): T[K][] {   // constraint: K must be a key of T
  return items.map(i => i[key]);
}
pluck([{ id: 1, name: 'a' }], 'name');                                // string[]; 'nope' is a compile error
```

- **Constraints** (`T extends { id: string }`) say what's required of `T`.
- **Inference** fills in `T` from the arguments, so callers rarely write `<T>` themselves.
- **Defaults** (`<T = unknown>`) for optional type parameters.

## The type-level toolkit

| Tool | Example | Gives you |
|---|---|---|
| `keyof T` | `keyof User` | `'id' \| 'name' \| 'email'` |
| `typeof value` | `typeof config` | the type of a runtime value |
| Indexed access | `User['address']` | the type of one property |
| Mapped types | `{ [K in keyof T]?: T[K] }` | transform every property (this is how `Partial` works) |
| Conditional types | `T extends string ? 'str' : 'other'` | type-level if/else; `infer` extracts parts |
| Template literal types | `` `on${Capitalize<E>}` `` | string patterns, like event handler names |
| `as const` | `['a', 'b'] as const` | readonly literal types instead of `string[]` |
| `satisfies` | `const routes = {…} satisfies Record<string, Route>` | checks the value against a type **without** widening its inferred type |

Built-in utility types to know by heart: `Partial`, `Required`, `Readonly`, `Pick`, `Omit`, `Record`, `Exclude`, `Extract`, `NonNullable`, `ReturnType`, `Parameters`, `Awaited`. Being able to **write** `Pick`, `Omit` and `ReturnType` yourself is a common interview task:

```ts
type MyPick<T, K extends keyof T> = { [P in K]: T[P] };
type MyOmit<T, K extends keyof any> = MyPick<T, Exclude<keyof T, K>>;
type MyReturnType<F> = F extends (...args: any[]) => infer R ? R : never;
type DeepPartial<T> = { [K in keyof T]?: T[K] extends object ? DeepPartial<T[K]> : T[K] };
```

## TypeScript in React

- **Props**: `type ButtonProps = { variant?: 'primary' | 'ghost' } & React.ComponentPropsWithoutRef<'button'>` extends the native button's props.
- **Children**: `children: React.ReactNode`. **Events**: `React.ChangeEvent<HTMLInputElement>`, `React.MouseEvent<HTMLButtonElement>`.
- **State**: `useState<User | null>(null)`; reducers with discriminated-union actions.
- **Refs**: `useRef<HTMLInputElement>(null)`.
- **Generic components**: `function List<T>({ items, render }: { items: T[]; render: (t: T) => React.ReactNode })`.
- **Polymorphic `as` props** and `forwardRef` typing are senior-level follow-ups.

### Compiler settings that matter

Turn on `strict` (which includes `strictNullChecks` and `noImplicitAny`), and add `noUncheckedIndexedAccess` (indexing an array or record gives `T | undefined`), `exactOptionalPropertyTypes`, `noImplicitOverride`, and `verbatimModuleSyntax` / `isolatedModules` for bundler compatibility.

> **In short:** types are compile-time sets of values; narrow with control flow; model state as discriminated unions; use generics to keep input and output linked; validate at runtime boundaries; and keep `strict` on.

<script>
/* Frontend Prep: content lives in the text/x-prep script blocks above, written in a small markdown dialect:

  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(`(?:\\[\s\S]|[^`\\])*`|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d[\d_]*(?:\.\d+)?(?:e[+-]?\d+)?n?\b|\b0x[0-9a-fA-F]+\b)|([A-Za-z_$][\w$]*)|([\s\S])/g;

  const qs = p.qs.map(q => ({ p, q, title: q.title.toLowerCase(), body: (q.title + ' ' + q.text).toLowerCase() }));
  if (!p.learn) return qs;
  const chunks = ('\n' + p.learnSrc).split(/\n## /).slice(1);
  const gs = p.learn.h2s.map((h, i) => { const text = plain((chunks[i] || '').replace(/^.*\n/, '')); return { p, guide: true, q: { id: 'learn/' + h.id, title: h.text, text }, title: h.text.toLowerCase(), body: (h.text + ' ' + text).toLowerCase() }; });

function search(term) {

    if (!words.every(w => e.body.includes(w))) return null;
    return { e, score: words.reduce((s, w) => s + (e.title.includes(w) ? 10 : 1), 0) };

    '<span class="ide-hint">Ctrl/⌘ + Enter runs · Esc closes</span>' +
    '<label class="ide-auto"><input type="checkbox" checked> Auto-run</label>' +
    '<button type="button" class="ide-run" data-ide="run">▶ Run</button><button type="button" data-ide="reset">Reset code</button>' +
    '<button type="button" data-ide="copy">Copy</button><button type="button" class="ide-x" data-ide="close" aria-label="Close editor">✕</button></header>' +
    '<div class="ide-main"><section class="ide-code" aria-label="Code"><div class="ide-ed"><pre aria-hidden="true"><code></code></pre>' +
    '<textarea spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code editor"></textarea></div></section>' +
    '<div class="ide-split" role="separator" aria-orientation="vertical" aria-label="Resize panels" tabindex="0"></div>' +
    '<section class="ide-out" aria-label="Preview"><div class="ide-out-bar"><span>Preview</span><span class="ide-status"></span></div><div class="ide-frame"></div></section></div>';
  document.body.append(el);
  document.documentElement.classList.add('ide-open');
  const ta = el.querySelector('textarea'), code = el.querySelector('pre code'), pre = el.querySelector('pre');
  const status = el.querySelector('.ide-status'), frame = el.querySelector('.ide-frame'), auto = el.querySelector('.ide-auto input');
  let timer = 0, seq = 0;
  const paint = () => { code.innerHTML = highlight(ta.value, 'jsx') + '\n'; pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; };
  const run = () => {
    IDE_EDITS[idx] = ta.value;
    const id = ++seq, f = document.createElement('iframe');
    f.title = 'Live preview'; f.setAttribute('sandbox', 'allow-scripts');
    status.textContent = 'Running…'; status.className = 'ide-status';
    ide.onMsg = e => {
      if (e.source !== f.contentWindow || !e.data || id !== seq) return;
      if (e.data.__pvReady) f.contentWindow.postMessage({ __pvRun: id, code: ta.value }, '*');
      else if (e.data.__pvStatus) { status.textContent = e.data.__pvStatus === 'ok' ? 'Up to date' : 'Error'; status.className = 'ide-status ' + e.data.__pvStatus; }
    };
    f.srcdoc = PV_DOC;
    frame.replaceChildren(f);
  };
  ide = { el, idx, opener: btn, onMsg: null, keydown: null, run };
  ide.listener = e => ide && ide.onMsg && ide.onMsg(e);
  window.addEventListener('message', ide.listener);

  ta.value = IDE_EDITS[idx] ?? CODES[idx];
  paint();
  ta.addEventListener('input', () => { paint(); if (auto.checked) { clearTimeout(timer); timer = setTimeout(run, 800); status.textContent = 'Edited…'; status.className = 'ide-status'; } });
  ta.addEventListener('scroll', () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); ta.setRangeText('  ', ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
  });
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-ide]'); if (!b) return;
    const a = b.dataset.ide;
    if (a === 'run') { clearTimeout(timer); run(); }
    else if (a === 'reset') { ta.value = CODES[idx]; delete IDE_EDITS[idx]; paint(); run(); }
    else if (a === 'copy') copyText(ta.value, b);
    else if (a === 'close') closeIde();
  });
  ide.keydown = e => {
    if (e.key === 'Escape' && !e.defaultPrevented) { e.preventDefault(); closeIde(); }
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); clearTimeout(timer); run(); }
  };
  document.addEventListener('keydown', ide.keydown);

  // draggable divider (pointer + arrow keys)
  const split = el.querySelector('.ide-split'), main = el.querySelector('.ide-main');
  const setPct = p => main.style.setProperty('--left', Math.min(80, Math.max(20, p)) + '%');
  split.addEventListener('pointerdown', e => {
    e.preventDefault(); split.setPointerCapture(e.pointerId); el.classList.add('dragging');
    const move = ev => { const r = main.getBoundingClientRect(); setPct((ev.clientX - r.left) / r.width * 100); };
    const up = () => { el.classList.remove('dragging'); split.removeEventListener('pointermove', move); split.removeEventListener('pointerup', up); };
    split.addEventListener('pointermove', move); split.addEventListener('pointerup', up);
  });
  split.addEventListener('keydown', e => {
    const cur = parseFloat(main.style.getPropertyValue('--left')) || 50;
    if (e.key === 'ArrowLeft') { e.preventDefault(); setPct(cur - 5); }
    if (e.key === 'ArrowRight') { e.preventDefault(); setPct(cur + 5); }
  });

  run();
  ta.focus(); ta.setSelectionRange(0, 0); ta.scrollTop = 0;
}
function closeIde() {
  if (!ide) return;
  window.removeEventListener('message', ide.listener);
  document.removeEventListener('keydown', ide.keydown);
  const { el, opener } = ide;
  ide = null;
  el.remove();
  document.documentElement.classList.remove('ide-open');
  if (opener && opener.isConnected) opener.focus();
}
function copyText(text, btn) {
  const done = () => { btn.textContent = 'Copied ✓'; setTimeout(() => { btn.textContent = 'Copy'; }, 1400); };
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, () => fallback()); } else fallback();
  function fallback() {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {} ta.remove();
  }
}

/* ---------- events ---------- */
$('#page').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.run) runCode(+t.dataset.run, t);
  else if (t.dataset.copy) copyText(CODES[+t.dataset.copy], t);
  else if (t.dataset.preview) openIde(+t.dataset.preview, t);
  else if (t.dataset.studied) {
    const id = t.dataset.studied, on = !studied[id];
    if (on) studied[id] = Date.now(); else delete studied[id];
    store.set('studied', studied);
    t.classList.toggle('on', on); t.setAttribute('aria-pressed', String(on)); t.textContent = on ? '✓ Studied' : 'Mark guide as studied';
    renderSide(id);
  }
  else if (t.dataset.act) $('#page').querySelectorAll('.q details').forEach(d => { d.open = t.dataset.act === 'expand'; });
});
$('#page').addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.known) {
    if (t.checked) known[t.dataset.known] = Date.now(); else delete known[t.dataset.known];
    store.set('known', known);
    t.closest('.q').classList.toggle('is-known', t.checked);
    const p = PAGE[t.dataset.known.split('/')[0]], chip = $('#knownChip');
    if (chip && p) chip.innerHTML = '<b>' + knownIn(p) + '</b> known';
    renderSide(curId());
  } else if (t.id === 'hideKnown') {
    store.set('hideKnown', t.checked);
    $('#page').classList.toggle('hide-known', t.checked);
  }
});
const side = $('#side'), scrim = $('#scrim'), menuBtn = $('#menuBtn');
function closeSide() { side.classList.remove('open'); scrim.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); }
menuBtn.addEventListener('click', () => {
  const open = !side.classList.contains('open');
  side.classList.toggle('open', open); scrim.hidden = !open; menuBtn.setAttribute('aria-expanded', String(open));
  if (open) $('#search').focus();
});
scrim.addEventListener('click', closeSide);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && side.classList.contains('open')) { closeSide(); menuBtn.focus(); }
  if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); if (innerWidth <= 960 && !side.classList.contains('open')) menuBtn.click(); $('#search').focus(); }
});
window.addEventListener('hashchange', () => { if ($('#search').value.trim().length >= 2) $('#search').value = ''; render(); });
render();
</script>
</body>
