:::viz proto

Three things to keep straight:

- **`obj.__proto__` / `Object.getPrototypeOf(obj)`** is the link an object actually inherits through.
- **`Fn.prototype`** is an ordinary property on functions. It's the object that will **become** the `[[Prototype]]` of instances made with `new Fn()`.
- **`class` is mostly syntax** over this same model: methods go on `Class.prototype`, `extends` links the two prototype objects (and the constructors too, for statics), and `super.method()` looks up the chain starting one level above the current method's home object. On top of that, classes add strict mode, a TDZ, real `#private` fields, and a constructor you can't call without `new`.

### What `new` does

```js run
function myNew(Ctor, ...args) {
  const obj = Object.create(Ctor.prototype);       // 1. new object linked to the prototype
  const ret = Ctor.apply(obj, args);               // 2. run the constructor with this = obj
  return ret !== null && (typeof ret === 'object' || typeof ret === 'function') ? ret : obj; // 3. an object return wins
}
function Person(name) { this.name = name; }
Person.prototype.hi = function () { return 'Hi, ' + this.name; };
const p = myNew(Person, 'Ada');
console.log(p.hi(), p instanceof Person, Object.getPrototypeOf(p) === Person.prototype);
```

`instanceof` walks the same chain: `a instanceof B` asks "is `B.prototype` anywhere in `a`'s prototype chain?"

> **Interview:** Prefer composition over deep inheritance chains, but know the mechanics. A common follow-up: "Why put methods on the prototype instead of in the constructor?" Because there's one shared copy of each method instead of a new one per instance.

## Types, equality and coercion

JavaScript has **7 primitive types** (`string`, `number`, `bigint`, `boolean`, `undefined`, `null`, `symbol`) and **objects** (including arrays, functions, dates and maps). Primitives are immutable and compared by value. Objects are compared **by reference**: two separate `{}` are never equal, however similar they look.

`typeof` mostly tells them apart, with two famous quirks: `typeof null === 'object'` (a bug from the first implementation, kept for compatibility) and `typeof function(){} === 'function'`. Use `Array.isArray` for arrays and `x === null` for null.

### Truthy and falsy

Exactly these values are **falsy**: `false`, `0`, `-0`, `0n`, `''`, `null`, `undefined` and `NaN`. **Everything else is truthy**, including `'0'`, `'false'`, `[]`, `{}` and `new Boolean(false)`.

### `==` vs `===`

`===` (strict equality) compares type and value with no conversion. `==` (loose equality) runs the *Abstract Equality* algorithm, which converts the operands first:

1. Same type → compare like `===`.
2. `null == undefined` is true, and neither is loosely equal to anything else.
3. Number vs string → convert the string to a number.
4. Boolean vs anything → convert the boolean to a number **first**. This is why `'1' == true` is true but `'true' == true` is false.
5. Object vs primitive → convert the object with **ToPrimitive** (`valueOf`, then `toString`), then compare again.

:::viz coercion

```js run
console.log([] + [], '|', [] + {}, '|', 1 + '2', '|', '3' * '4', '|', true + 1);
console.log(0.1 + 0.2 === 0.3, Math.abs(0.1 + 0.2 - 0.3) < Number.EPSILON);
console.log(NaN === NaN, Object.is(NaN, NaN), Object.is(0, -0), 0 === -0);
console.log([10, 9, 1].sort(), [10, 9, 1].sort((a, b) => a - b));
```

> **Rule of thumb:** Always use `===`. The one widely accepted exception is `x == null`, a short way to check for "null or undefined". Use `Number.isNaN` (not the global `isNaN`, which coerces first), `Object.is` for `-0` and `NaN` edge cases, and compare floats with a tolerance.

## Copying, collections and iteration

Assigning an object copies the **reference**, not the object. That's why mutating a "copy" changes the original, and why React needs a new object to notice a change.

:::viz copy

| Technique | Depth | Notes |
|---|---|---|
| `{ ...obj }`, `Object.assign({}, obj)`, `[...arr]`, `arr.slice()` | shallow | Nested objects are still shared. |
| `structuredClone(obj)` | deep | Handles cycles, Date, Map, Set, typed arrays. Throws on functions and DOM nodes, and drops prototypes (class instances become plain objects). |
| `JSON.parse(JSON.stringify(obj))` | deep, lossy | Drops `undefined`, functions and symbols, turns Dates into strings, throws on cycles. |
| Hand-written recursive clone | deep | The interview version: track visited objects in a `WeakMap` to handle cycles. |

### Map, Set, WeakMap and WeakSet

- **`Map`** keeps insertion order, accepts **any** value as a key (objects too), and has `.size`. Prefer it over plain objects for dynamic dictionaries.
- **`Set`** holds unique values: `[...new Set(arr)]` de-duplicates.
- **`WeakMap` / `WeakSet`** hold their keys **weakly**. If nothing else references the key object, it can be garbage collected along with its entry. They aren't iterable. Use them for metadata attached to objects you don't own, like DOM nodes or memo caches keyed by object.

### Iteration protocols

`for…of`, spread, destructuring, `Array.from` and `Promise.all` all use the **iterator protocol**: an object is iterable if it has a `[Symbol.iterator]()` method that returns an iterator with `next()`, which returns `{ value, done }`. Generators (`function*`) are the easiest way to write one.

```js run
const range = { from: 1, to: 4, *[Symbol.iterator]() { for (let i = this.from; i <= this.to; i++) yield i; } };
console.log([...range], Math.max(...range));
for (const [k, v] of new Map([['a', 1], ['b', 2]])) console.log(k, v);
console.log('for…in gives keys (including inherited enumerable ones):', Object.keys({ x: 1, y: 2 }));
```

## Functions as values

Functions are **first-class values**: you can store them, pass them in, and return them. This is the basis of the functional patterns interviewers ask you to implement.

- **Higher-order functions** take or return functions: `map`, `filter`, `reduce`, `debounce`, `memoize`.
- **Pure functions** return the same output for the same input and have no side effects. They're easy to test, cache and run in parallel. React expects your render functions to be pure.
- **Currying** turns `f(a, b, c)` into `f(a)(b)(c)`. A generic `curry` collects arguments until it has `fn.length` of them.
- **Composition**: `compose(f, g)(x) === f(g(x))`, and `pipe` applies the same functions left to right.
- **Immutability**: return new arrays and objects (`map`, `filter`, spread, `toSorted`, `with`) instead of changing the old ones. Mutating methods like `push`, `splice`, `sort` and `reverse` change the original array in place.

```js run
const curry = fn => function curried(...a) { return a.length >= fn.length ? fn.apply(this, a) : (...b) => curried.apply(this, [...a, ...b]); };
const add3 = curry((a, b, c) => a + b + c);
console.log(add3(1)(2)(3), add3(1, 2)(3), add3(1)(2, 3));
const pipe = (...fns) => x => fns.reduce((v, f) => f(v), x);
console.log(pipe(x => x + 1, x => x * 10, String)(4));
```

## Modules, memory and errors

### ES modules vs CommonJS

| | ES modules (`import`/`export`) | CommonJS (`require`) |
|---|---|---|
| Loading | Static, so it's analysed before running. Enables tree shaking. | Dynamic, at runtime |
| Bindings | **Live** read-only views of the exporter's variables | A copy of `module.exports` at require time |
| Top-level `await` | Yes | No |
| `this` at top level | `undefined` (always strict) | `module.exports` |
| In the browser | `<script type="module">`: deferred by default, and runs once per URL | Needs a bundler |

`import()` is the dynamic form. It returns a promise, and it's how bundlers split code.

### Garbage collection and leaks

Engines use **mark-and-sweep**: starting from the roots (globals, the current stack, active closures), they mark everything reachable, and anything left unmarked gets freed. So a leak is just **something staying reachable when you no longer need it**. Usual suspects:

- Event listeners and intervals that are never removed (in React, an effect with no cleanup).
- Detached DOM nodes that are still referenced from JavaScript.
- Caches and maps that grow forever. Use `WeakMap`, or an LRU with a size limit.
- Closures that capture large objects.

Find leaks with heap snapshots in Chrome DevTools: take one, repeat the action, take another, and compare what's growing.

### Errors

`throw` any value, but throw `Error` objects (or subclasses) so you get a stack trace. `try/catch/finally` only catches **synchronous** errors, plus rejected promises you `await` inside the `try`. `finally` always runs, even after a `return`. Unhandled promise rejections fire the `unhandledrejection` event. Use custom error classes (`class HttpError extends Error`) and `cause` (`new Error('Save failed', { cause: err })`) to carry context upward.

> **In short:** context and stack → scope chain → closures → `this` → prototypes → types and coercion. If you can draw the diagrams on this page from memory and explain each animation out loud, you're ready for the JavaScript fundamentals round.

## A method for "what does this print?"

Output questions aren't trivia. Each one checks whether you can **simulate the engine in your head**. Guessing from memory doesn't scale. A repeatable method does, and saying the method out loud is what earns the marks.

1. **Spot the category.** Is this about async ordering, scope and hoisting, `this`, coercion, or a built-in's quirk? Each category has a small set of rules (summarised below).
2. **Do the creation phase first.** List every declaration in each scope and what it's hoisted as (`undefined`, TDZ, or a whole function).
3. **Execute line by line**, keeping track of variables, the call stack and two queues (microtasks and tasks) on paper.
4. **Write each output line as you go**, and give the rule that produced it: "this logs `undefined` because `var` is hoisted and initialised to `undefined`."
5. **Check the edge cases**: strict mode or not? Module or script? Arrow function or regular function? Is any `await` or `.then` hidden in there?

:::viz predict

> **Interview:** If you're unsure, say what you'd expect and why, then name the rule that would change the answer. "If this file is a module, it's strict mode, so `this` would be `undefined` instead of `window`" shows more understanding than a lucky guess.

## Async ordering rules

The most common category by far. Five rules cover almost every puzzle:

| Rule | Example |
|---|---|
| Synchronous code runs first, top to bottom | `console.log` lines not inside a callback |
| A `new Promise` executor runs **synchronously** | the code inside `new Promise(res => { … })` |
| `.then`, `.catch`, `.finally` and code after `await` are **microtasks** | queued when the promise settles |
| All microtasks run before the next task | promise logs come before `setTimeout(…, 0)` logs |
| Timers, events and `MessageChannel` are **tasks**, run one per loop | `setTimeout(fn, 0)` comes after all queued microtasks |

Two subtler ones:

- **Chained `.then`s interleave.** Each `.then` callback is queued only when the previous step settles, so two independent chains take turns, one step at a time.
- **`await` on a non-promise still yields.** `await 5` pauses the function and resumes it as a microtask. And `return somePromise` inside an `async` function may take a couple of extra microtask ticks before the outer promise settles. Interviewers rarely go that deep, but don't claim exact tick counts unless you're sure.

:::viz eventloop

## Scope, hoisting and closures

Run the creation phase before you read the code:

- `var` is hoisted to the **function** and set to `undefined`. A `var` inside an `if` or a `for` block still belongs to the whole function.
- `let`/`const`/`class` are hoisted to the **block**, but they're in the TDZ until their line runs. Reading them earlier throws `ReferenceError`.
- **Function declarations** are hoisted whole, so you can call them before their line. A function **expression** (`var f = function () {}`) behaves like any other `var`: it's `undefined` until assigned.
- If a function declaration and a `var` have the same name, the function wins at creation time, and then the `var` assignment overwrites it when its line runs.
- A local variable **shadows** an outer one with the same name throughout the whole scope, even on lines above its declaration. That's why "TDZ shadowing" puzzles throw instead of reading the outer value.

```js run
console.log(typeof foo);      // function declarations are hoisted whole
var foo = 'now a string';
function foo() {}
console.log(typeof foo);

var x = 1;
function shadow() { console.log(x); var x = 2; }  // the local x is hoisted, so this logs undefined, not 1
shadow();
```

## `this` and objects

Find the **call site** and apply the rules in order: `new` → `call`/`apply`/`bind` → `obj.method()` → plain call. Arrow functions use the `this` of the scope they were written in.

The traps interviewers use:

- **Extracting a method**: `const f = obj.m; f()` loses `obj`.
- **Passing a method as a callback**: `setTimeout(obj.m)` or `arr.map(obj.m)` also loses `obj`.
- **An arrow function as an object property**: `{ m: () => this }` doesn't get the object, because object literals don't create a scope.
- **Object keys are strings**: `obj[{}]` uses the key `"[object Object]"`, so two different objects used as keys overwrite each other. Use a `Map` for object keys.
- **Shared references**: mutating an object through one variable is visible through every other reference to it.

## Types and coercion

| Expression | Result | Why |
|---|---|---|
| `1 + '2'` | `'12'` | `+` concatenates if **either** side is a string |
| `'3' - 1` | `2` | `-`, `*`, `/` always convert to numbers |
| `[] + {}` | `'[object Object]'` | both become strings: `''` + `'[object Object]'` |
| `[] == false` | `true` | false → 0, [] → '' → 0 |
| `null == 0` | `false` | null only loosely equals undefined |
| `null >= 0` | `true` | relational operators **do** convert null to 0 |
| `NaN === NaN` | `false` | NaN never equals anything; use `Number.isNaN` |
| `typeof null` | `'object'` | a historical bug |
| `typeof NaN` | `'number'` | NaN is a number value |
| `0.1 + 0.2` | `0.30000000000000004` | binary floating point |

:::viz coercion

## Arrays and built-ins

- **`sort()` without a comparator sorts as strings**: `[10, 9, 1].sort()` gives `[1, 10, 9]`. Always pass `(a, b) => a - b` for numbers. `sort` also **mutates** the array; `toSorted` doesn't.
- **`['1', '2', '3'].map(parseInt)`** gives `[1, NaN, NaN]`, because `map` passes `(value, index)` and `parseInt` reads the index as the radix.
- **`length` is writable**: setting `arr.length = 0` empties the array, and assigning `arr[10]` creates **holes** (empty slots). `forEach` and `map` skip holes, but `for…of` and spread visit them as `undefined`.
- **`fn.length`** counts parameters **before** the first one with a default value or a rest parameter.
- **`[...'héllo']`** splits by code point, while `'héllo'.split('')` splits by UTF-16 code unit. They give different results for emoji.

```js run
console.log(['1', '2', '3'].map(parseInt), [10, 9, 1].sort(), [1, , 3].map(x => x * 2));
console.log(((a, b = 2, c) => 0).length, ((...r) => 0).length, Array(3).join('-'));
```

> **Rule of thumb:** When a puzzle feels like a trick, it usually tests one of: hoisting, the microtask/task split, the call site for `this`, `+` with strings, or a built-in that mutates. Go through that list before you answer.

## What the round really tests

Machine coding gives you 60–120 minutes to build a working UI (an autocomplete, a file explorer, a data table) in React or plain JavaScript, usually while sharing your screen. Interviewers score far more than "does it work":

| Signal | What they look for |
|---|---|
| **Requirements** | Did you clarify the scope, and get the core flow working first? |
| **Component design** | Sensible component boundaries, minimal state in the right place, clear props |
| **Correctness** | Edge cases: empty states, errors, fast typing, double clicks, keyboard use |
| **Code quality** | Readable names, small functions, no copy-paste, derived data not duplicated in state |
| **UX and accessibility** | Semantic elements, labels, focus, loading and empty states |
| **Communication** | Thinking out loud, explaining trade-offs, taking hints well |

## Running the clock

1. **Clarify (5–8 min).** Restate the problem. Ask about must-haves vs nice-to-haves, the data shape, where the data comes from (mock or API), the scale (10 items or 10,000?), styling expectations, and whether libraries are allowed. Write the agreed scope as a checklist in a comment.
2. **Plan (5–10 min).** Sketch the component tree and **where each piece of state lives**. Name the data model. Decide what's derived and what's stored.
3. **Build the core (40–50 min).** Get the happy path working end to end with simple styling, then iterate. Commit to small working steps rather than one big bang.
4. **Harden (15–20 min).** Loading, error and empty states, keyboard support, debouncing, cancellation, performance for big inputs.
5. **Wrap up (5 min).** Walk through what you built, what's missing, and what you'd do next (tests, virtualisation, caching).

## Designing components and state

The most common reason candidates struggle isn't React syntax. It's **state in the wrong place**. Use the same questions every time:

- **What's the minimal state?** Store the source of truth (`items`, `query`, `selectedId`). Derive everything else during render (`filtered = items.filter(…)`, `selected = items.find(…)`). Store the *id* of the selected item, not a copy of the item.
- **Who needs it?** Put it in the lowest common ancestor of the components that read it.
- **What shape?** Normalise nested or relational data: `{ byId: {…}, allIds: […] }`, or a parent→children map for trees. Updating a deeply nested tree immutably is painful.
- **Which events change it?** List them (add, toggle, delete, edit, reorder). If there are many, a `useReducer` with named actions makes the logic easy to test and explain.

> **Tip:** Write the reducer or helper functions as **pure functions first** (`addNode(tree, parentId, node)`). They're easy to test in your head and in the console, and the components stay thin.

## Recurring building blocks

Most problems are combinations of a handful of patterns. Know each one cold:

| Building block | Shows up in | Key details |
|---|---|---|
| Debounced input + cancellable fetch | autocomplete, search, filters | debounce ~250 ms, abort stale requests, cache by query, keyboard navigation |
| Recursive component | file explorer, nested comments, menus | render `<Node>` inside `<Node>`; normalised data; expand state keyed by id |
| Pagination / infinite scroll | feeds, tables | IntersectionObserver sentinel, cursor-based API, loading/error per page, `hasMore` |
| Timers and state machines | traffic light, stopwatch, carousel, toasts | clear timers on cleanup; compute elapsed time from `Date.now()`, never by counting ticks |
| Concurrency limit | progress bars, uploads | a queue + an active counter; start the next item when one finishes |
| Overlays | modal, dropdown, tooltip | portal, focus trap, Esc, click outside, scroll lock, return focus |
| Keyboard grids | tabs, OTP, tic-tac-toe | roving tabindex, arrow keys, refs array, paste handling |
| Drag and drop | kanban | pointer events or native DnD; an id-based move function; optimistic update |

## 1. Debounced input + cancellable fetch

**Shows up in:** autocomplete and typeahead, search pages, filter panels, address lookup.

The naive version calls the API on every keystroke. That has two problems. First, it **wastes requests**: typing "react" sends five. Second, it has a **race condition**: responses can arrive in any order, so a slow response for "re" can land after the response for "react" and overwrite it. The robust recipe has four parts, and each one solves a separate problem:

1. **Debounce the input value** (around 250 ms), so you only search once the user pauses. This cuts the load.
2. **Abort the previous request** whenever the query changes, with an `AbortController` in the effect's cleanup. This fixes correctness: only the latest query can update the UI.
3. **Cache results by query** in a `Map` held in a ref, so backspacing to an earlier query is instant and free.
4. **Combobox keyboard support**: ArrowUp/ArrowDown move the active option, Enter picks it, Esc closes the list, and `aria-activedescendant` tells screen readers which option is active while focus stays in the input.

:::viz typeahead

Design points to mention:

- Keep the **input value** (updates on every key) separate from the **debounced query** (drives the fetch). The input must never feel laggy.
- The fetcher is passed in, which makes the hook reusable and easy to test. It must be a **stable reference**: define it outside the component, or wrap it in `useCallback`.
- Use `onMouseDown={e => e.preventDefault()}` on options, so clicking one doesn't blur the input and close the list before the click registers.
- Handle the **empty, loading, error and no-results** states. Interviewers check for these.

```jsx preview
import { useState, useEffect, useRef, useId } from 'react';

// ---------- reusable hooks ----------
export function useDebounce(value, delay = 250) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const id = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(id);          // a new keystroke cancels the pending update
  }, [value, delay]);
  return debounced;
}

// fetcher(query, signal) must return a promise and be a stable reference
export function useSearch(query, fetcher) {
  const cache = useRef(new Map());
  const [state, setState] = useState({ status: 'idle', results: [] });
  useEffect(() => {
    const q = query.trim().toLowerCase();
    if (!q) { setState({ status: 'idle', results: [] }); return; }
    if (cache.current.has(q)) { setState({ status: 'success', results: cache.current.get(q) }); return; }
    const ctrl = new AbortController();
    setState(s => ({ ...s, status: 'loading' }));
    fetcher(q, ctrl.signal)
      .then(results => { cache.current.set(q, results); setState({ status: 'success', results }); })
      .catch(err => { if (err.name !== 'AbortError') setState({ status: 'error', results: [] }); });
    return () => ctrl.abort();              // query changed or unmounted: cancel the stale request
  }, [query, fetcher]);
  return state;
}

// ---------- reusable component ----------
export function Autocomplete({ fetcher, onSelect, label, placeholder }) {
  const [input, setInput] = useState('');
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState(-1);
  const query = useDebounce(input, 250);
  const { status, results } = useSearch(query, fetcher);
  const id = useId();

  useEffect(() => setActive(-1), [results]);

  const choose = item => { setInput(item); setOpen(false); onSelect?.(item); };
  const onKeyDown = e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setOpen(true); setActive(i => Math.min(i + 1, results.length - 1)); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(i => Math.max(i - 1, 0)); }
    else if (e.key === 'Enter' && open && active >= 0) { e.preventDefault(); choose(results[active]); }
    else if (e.key === 'Escape') setOpen(false);
  };
  const showList = open && input.trim() !== '';

  return (
    <div className="ac">
      <label htmlFor={id + 'in'}>{label}</label>
      <input
        id={id + 'in'} role="combobox" autoComplete="off" placeholder={placeholder}
        aria-expanded={showList} aria-controls={id + 'list'} aria-autocomplete="list"
        aria-activedescendant={active >= 0 ? `${id}opt${active}` : undefined}
        value={input}
        onChange={e => { setInput(e.target.value); setOpen(true); }}
        onKeyDown={onKeyDown} onFocus={() => setOpen(true)} onBlur={() => setOpen(false)}
      />
      {showList && (
        <ul className="ac-list" role="listbox" id={id + 'list'}>
          {status === 'loading' && <li className="ac-note">Searching…</li>}
          {status === 'error' && <li className="ac-note">Something went wrong. Keep typing to retry.</li>}
          {status === 'success' && results.length === 0 && <li className="ac-note">No results for “{query}”</li>}
          {results.map((r, i) => (
            <li key={r} id={`${id}opt${i}`} role="option" aria-selected={i === active}
                className={i === active ? 'active' : ''}
                onMouseDown={e => e.preventDefault()} onMouseEnter={() => setActive(i)} onClick={() => choose(r)}>
              <Highlight text={r} query={query} />
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

function Highlight({ text, query }) {
  const i = text.toLowerCase().indexOf(query.trim().toLowerCase());
  if (!query.trim() || i < 0) return text;
  const n = query.trim().length;
  return <>{text.slice(0, i)}<mark>{text.slice(i, i + n)}</mark>{text.slice(i + n)}</>;
}

// ---------- demo: a fake API with random latency, so responses arrive out of order ----------
const FRUITS = ['Apple', 'Apricot', 'Avocado', 'Banana', 'Blackberry', 'Blueberry', 'Cherry', 'Coconut', 'Cranberry', 'Date', 'Dragon fruit', 'Fig', 'Grape', 'Grapefruit', 'Guava', 'Jackfruit', 'Kiwi', 'Lemon', 'Lime', 'Lychee', 'Mango', 'Mulberry', 'Orange', 'Papaya', 'Peach', 'Pear', 'Pineapple', 'Plum', 'Pomegranate', 'Raspberry', 'Strawberry', 'Tangerine', 'Watermelon'];
const requestLog = [];
function fakeSearch(q, signal) {
  const entry = { q, status: 'pending' };
  requestLog.unshift(entry);
  return new Promise((resolve, reject) => {
    const ms = 200 + Math.random() * 900;
    const t = setTimeout(() => { entry.status = `done in ${Math.round(ms)} ms`; resolve(FRUITS.filter(f => f.toLowerCase().includes(q))); }, ms);
    signal.addEventListener('abort', () => { clearTimeout(t); entry.status = 'aborted'; reject(new DOMException('Aborted', 'AbortError')); });
  });
}

function RequestLog() {                       // demo only: polls the log so you can watch requests
  const [, force] = useState(0);
  useEffect(() => { const id = setInterval(() => force(n => n + 1), 200); return () => clearInterval(id); }, []);
  return (
    <ol className="log">
      {requestLog.slice(0, 6).map((r, i) => <li key={requestLog.length - i} className={r.status}>“{r.q}” → {r.status}</li>)}
    </ol>
  );
}

export default function App() {
  const [picked, setPicked] = useState(null);
  return (
    <div style={{ maxWidth: 420 }}>
      <style>{`
        .ac{position:relative;display:grid;gap:6px}
        .ac input{width:100%}
        .ac-list{position:absolute;top:100%;left:0;right:0;margin:4px 0 0;padding:4px;list-style:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0/.12);max-height:220px;overflow:auto;z-index:1}
        .ac-list li{padding:6px 10px;border-radius:6px;cursor:pointer}
        .ac-list li.active{background:var(--acc-soft)}
        .ac-note{color:var(--muted);cursor:default!important}
        mark{background:none;color:var(--acc);font-weight:700}
        .log{margin:16px 0 0;padding-left:20px;font:12px ui-monospace,monospace;color:var(--muted)}
        .log .aborted{text-decoration:line-through}
      `}</style>
      <Autocomplete label="Search fruit" placeholder="Try “an”, then “ber”" fetcher={fakeSearch} onSelect={setPicked} />
      <p>Selected: <b>{picked ?? '—'}</b></p>
      <div style={{ fontSize: 12, color: 'var(--muted)' }}>Requests (newest first): type fast and watch older ones get aborted</div>
      <RequestLog />
    </div>
  );
}
```

> **Follow-up:** "What if the API is slow?" Show the previous results dimmed while loading, rather than an empty list. "What about a huge result list?" Limit it to the top N results and virtualise. "Offline?" Fall back to the cache, then show an error with a retry.

## 2. Recursive component

**Shows up in:** file explorers, nested comments with replies, multi-level menus, org charts, category trees, JSON viewers.

A tree is rendered by a component that **renders itself for each child**. The interesting decisions are about **data shape and state**, not about the recursion:

- **Normalise the tree**: store nodes in a flat `byId` map, where each node keeps an array of `children` ids and its `parentId`. Then adding, deleting, renaming and moving are each a lookup plus an immutable update, instead of a recursive search and copy through nested objects.
- **Keep expanded state in one `Set` of ids** at the top, not in each node. "Expand all", "collapse all" and "reveal this file" become trivial, and the state survives re-renders.
- **Put all changes in a pure reducer.** Deleting a folder must also remove all its descendants (an explicit stack works, and avoids deep recursion) and remove the id from its parent's `children`.
- Use ARIA tree roles (`tree`, `treeitem`, `group`, `aria-expanded`) and real buttons for actions.

```jsx preview
import { useReducer, useState } from 'react';

// ---------- normalised data + pure reducer (reusable) ----------
const initialTree = {
  rootId: 'root',
  byId: {
    root: { id: 'root', name: 'my-app', type: 'folder', parentId: null, children: ['src', 'public', 'pkg'] },
    src: { id: 'src', name: 'src', type: 'folder', parentId: 'root', children: ['components', 'app'] },
    components: { id: 'components', name: 'components', type: 'folder', parentId: 'src', children: ['btn'] },
    btn: { id: 'btn', name: 'Button.jsx', type: 'file', parentId: 'components' },
    app: { id: 'app', name: 'App.jsx', type: 'file', parentId: 'src' },
    public: { id: 'public', name: 'public', type: 'folder', parentId: 'root', children: ['html'] },
    html: { id: 'html', name: 'index.html', type: 'file', parentId: 'public' },
    pkg: { id: 'pkg', name: 'package.json', type: 'file', parentId: 'root' },
  },
};

export function treeReducer(tree, action) {
  const { byId } = tree;
  switch (action.type) {
    case 'add': {
      const { parentId, node } = action;
      const parent = byId[parentId];
      return { ...tree, byId: { ...byId, [node.id]: { ...node, parentId, ...(node.type === 'folder' && { children: [] }) },
        [parentId]: { ...parent, children: [...parent.children, node.id] } } };
    }
    case 'delete': {
      const next = { ...byId };
      const stack = [action.id];
      while (stack.length) {                       // remove the node and every descendant
        const id = stack.pop();
        stack.push(...(next[id].children || []));
        delete next[id];
      }
      const parent = byId[byId[action.id].parentId];
      next[parent.id] = { ...parent, children: parent.children.filter(c => c !== action.id) };
      return { ...tree, byId: next };
    }
    case 'rename':
      return { ...tree, byId: { ...byId, [action.id]: { ...byId[action.id], name: action.name } } };
    default:
      return tree;
  }
}

const byFolderThenName = byId => (a, b) =>
  (byId[a].type === byId[b].type ? 0 : byId[a].type === 'folder' ? -1 : 1) || byId[a].name.localeCompare(byId[b].name);

// ---------- the recursive component ----------
function TreeNode({ id, depth, ctx }) {
  const { tree, expanded, toggle, dispatch, draft, setDraft } = ctx;
  const node = tree.byId[id];
  const isFolder = node.type === 'folder';
  const isOpen = expanded.has(id);
  const kids = isFolder ? [...node.children].sort(byFolderThenName(tree.byId)) : [];

  return (
    <li role="treeitem" aria-expanded={isFolder ? isOpen : undefined}>
      <div className="row" style={{ paddingLeft: depth * 18 }}>
        {isFolder
          ? <button className="name" onClick={() => toggle(id)}>{isOpen ? '▾' : '▸'} 📁 {node.name}</button>
          : <span className="name">　 📄 {node.name}</span>}
        <span className="actions">
          {isFolder && <button title="New file" aria-label={`New file in ${node.name}`} onClick={() => setDraft({ parentId: id, type: 'file' })}>+📄</button>}
          {isFolder && <button title="New folder" aria-label={`New folder in ${node.name}`} onClick={() => setDraft({ parentId: id, type: 'folder' })}>+📁</button>}
          {node.parentId && <button title="Delete" aria-label={`Delete ${node.name}`} onClick={() => dispatch({ type: 'delete', id })}>🗑</button>}
        </span>
      </div>
      {isFolder && (isOpen || draft?.parentId === id) && (
        <ul role="group">
          {draft?.parentId === id && <NewItem depth={depth + 1} ctx={ctx} />}
          {isOpen && kids.map(k => <TreeNode key={k} id={k} depth={depth + 1} ctx={ctx} />)}
        </ul>
      )}
    </li>
  );
}

function NewItem({ depth, ctx }) {
  const { draft, setDraft, dispatch, toggle, expanded } = ctx;
  const [name, setName] = useState('');
  const save = () => {
    if (name.trim()) {
      dispatch({ type: 'add', parentId: draft.parentId, node: { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: name.trim(), type: draft.type } });
      if (!expanded.has(draft.parentId)) toggle(draft.parentId);
    }
    setDraft(null);
  };
  return (
    <li className="row" style={{ paddingLeft: depth * 18 }}>
      {draft.type === 'folder' ? '📁' : '📄'}{' '}
      <input autoFocus value={name} placeholder={`new ${draft.type} name`} onChange={e => setName(e.target.value)}
        onKeyDown={e => { if (e.key === 'Enter') save(); if (e.key === 'Escape') setDraft(null); }} onBlur={save} />
    </li>
  );
}

export function FileExplorer({ initial }) {
  const [tree, dispatch] = useReducer(treeReducer, initial);
  const [expanded, setExpanded] = useState(() => new Set([initial.rootId, 'src']));
  const [draft, setDraft] = useState(null);               // { parentId, type } while adding
  const toggle = id => setExpanded(prev => { const s = new Set(prev); s.has(id) ? s.delete(id) : s.add(id); return s; });
  const folderIds = Object.values(tree.byId).filter(n => n.type === 'folder').map(n => n.id);
  const ctx = { tree, expanded, toggle, dispatch, draft, setDraft };
  return (
    <div className="explorer">
      <div className="toolbar">
        <button onClick={() => setExpanded(new Set(folderIds))}>Expand all</button>
        <button onClick={() => setExpanded(new Set([tree.rootId]))}>Collapse all</button>
        <span className="count">{Object.keys(tree.byId).length} items</span>
      </div>
      <ul role="tree" aria-label="Files"><TreeNode id={tree.rootId} depth={0} ctx={ctx} /></ul>
    </div>
  );
}

export default function App() {
  return (
    <>
      <style>{`
        .explorer ul{list-style:none;margin:0;padding:0}
        .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
        .count{margin-left:auto;color:var(--muted);font-size:12px}
        .row{display:flex;align-items:center;gap:6px;min-height:32px;border-radius:6px}
        .row:hover{background:var(--soft)}
        .name{border:0;background:none;padding:4px 6px;text-align:left;flex:1}
        .actions{display:flex;gap:4px;opacity:.25}
        .row:hover .actions,.row:focus-within .actions{opacity:1}

## 3. Pagination and infinite scroll

**Shows up in:** social feeds, product listings, search results, data tables, chat history.

Two mechanisms work together. **Loading pages** is a little state machine (`idle → loading → idle | error | done`) that remembers the server's **cursor**. **Triggering the next load** is done by an **IntersectionObserver** watching a sentinel element at the bottom of the list. Never use scroll event handlers with `scrollTop` maths for this: an observer is cheaper and simpler.

- **Cursor pagination** (`?after=<cursor>`) stays correct when new items are inserted at the top. Offset pagination duplicates or skips items (see the frontend system design guide).
- **Guard against double loads**: a ref flag, because the observer can fire again before React re-renders with `status: 'loading'`.
- **Re-arm the observer after each page.** An IntersectionObserver only fires when visibility *changes*. If the sentinel is still visible after a short page loads, nothing happens. Re-creating the observer when the status goes back to `idle` fires it again straight away.
- Show the **loading, error-with-retry and end-of-list** states at the bottom. Use `rootMargin` to start loading before the user reaches the end.

```jsx preview
import { useState, useEffect, useRef, useCallback } from 'react';

// ---------- reusable hooks ----------
export function useInfiniteList(fetchPage) {
  const [items, setItems] = useState([]);
  const [cursor, setCursor] = useState(null);
  const [status, setStatus] = useState('idle');          // idle | loading | error | done
  const busy = useRef(false);

  const loadMore = useCallback(async () => {
    if (busy.current || status === 'done') return;
    busy.current = true;
    setStatus('loading');
    try {
      const page = await fetchPage(cursor);
      setItems(prev => [...prev, ...page.items]);
      setCursor(page.nextCursor);
      setStatus(page.nextCursor ? 'idle' : 'done');
    } catch {
      setStatus('error');
    } finally {
      busy.current = false;
    }
  }, [cursor, status, fetchPage]);

  return { items, status, loadMore };
}

export function useOnVisible(targetRef, onVisible, { rootRef, rootMargin = '150px', enabled = true } = {}) {
  const cb = useRef(onVisible);
  useEffect(() => { cb.current = onVisible; });            // always call the latest callback
  useEffect(() => {
    if (!enabled || !targetRef.current) return;
    const io = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) cb.current(); },
      { root: rootRef?.current ?? null, rootMargin });
    io.observe(targetRef.current);
    return () => io.disconnect();
  }, [targetRef, rootRef, rootMargin, enabled]);
}

// ---------- demo: fake cursor-based API (10 posts per page, about 1 in 5 requests fails) ----------
const TOTAL = 57;
function fetchPosts(cursor) {
  const start = cursor ?? 0;
  return new Promise((resolve, reject) => setTimeout(() => {
    if (start > 0 && Math.random() < 0.2) return reject(new Error('Network error'));
    const end = Math.min(start + 10, TOTAL);
    const items = Array.from({ length: end - start }, (_, i) => ({ id: start + i + 1, title: `Post #${start + i + 1}`, body: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit.' }));
    resolve({ items, nextCursor: end < TOTAL ? end : null });
  }, 600));
}

export default function App() {
  const { items, status, loadMore } = useInfiniteList(fetchPosts);
  const scroller = useRef(null), sentinel = useRef(null);
  useOnVisible(sentinel, loadMore, { rootRef: scroller, enabled: status === 'idle' });

  return (
    <>
      <style>{`
        .feed{height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px}
        .post{padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
        .post h4{margin:0 0 2px}.post p{margin:0;color:var(--muted);font-size:13px}
        .foot{padding:12px;text-align:center;color:var(--muted);font-size:13px}
        .skeleton{height:58px;border-radius:8px;margin-bottom:8px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.2s infinite}
        @keyframes sh{to{background-position:-200% 0}}
      `}</style>
      <div className="feed" ref={scroller} aria-busy={status === 'loading'}>
        {items.map(p => <article className="post" key={p.id}><h4>{p.title}</h4><p>{p.body}</p></article>)}
        {status === 'loading' && <><div className="skeleton" /><div className="skeleton" /></>}
        {status === 'error' && <div className="foot">Couldn't load more. <button onClick={loadMore}>Retry</button></div>}
        {status === 'done' && <div className="foot">You're all caught up · {items.length} posts</div>}
        <div ref={sentinel} style={{ height: 1 }} />
      </div>
      <p style={{ fontSize: 12, color: 'var(--muted)' }}>{items.length} loaded · status: {status}</p>
    </>
  );
}
```

> **Follow-up:** With thousands of items, combine this with **virtualisation**, so only visible rows stay in the DOM. Keep the scroll position when the user returns to the page (cache the pages, and restore `scrollTop`). For a "load newer" banner, fetch newer items with a separate cursor and prepend them only when the user clicks.

## 4. Timers and state machines

**Shows up in:** stopwatch and countdown, traffic light, image carousel autoplay, toast auto-dismiss, OTP resend countdown, typing indicators.

Two rules prevent almost every timer bug:

1. **Compute time from timestamps; never count ticks.** `setInterval(fn, 1000)` drifts, gets clamped, and is throttled to once a minute in background tabs, so `count++` every second shows the wrong time. Store the start time, and on every render compute `elapsed = now - start`. The interval or `requestAnimationFrame` only decides **how often you redraw**, not what the time is.
2. **Every timer is created in an effect and cleared in its cleanup.** Then pausing, unmounting and changing state can't leave a timer running.

For behaviour with fixed steps (a traffic light, a carousel, a checkout wizard), write a **state machine**: an object mapping each state to its next state and its duration. One effect schedules a single timeout for the current state. The logic is data, so changing the timings or adding a state means editing the config, not the code.

```jsx preview
import { useState, useEffect, useRef } from 'react';

// ---------- reusable: stopwatch from timestamps ----------
export function useStopwatch() {
  const [running, setRunning] = useState(false);
  const [banked, setBanked] = useState(0);            // ms from earlier runs
  const [now, setNow] = useState(0);
  const startedAt = useRef(0);

  useEffect(() => {
    if (!running) return;
    let raf;
    const loop = () => { setNow(performance.now()); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop);
    return () => cancelAnimationFrame(raf);            // stop redrawing on pause/unmount
  }, [running]);

  const elapsed = running ? banked + (now - startedAt.current) : banked;
  return {
    elapsed, running,
    start: () => { startedAt.current = performance.now(); setNow(startedAt.current); setRunning(true); },
    stop: () => { setBanked(b => b + performance.now() - startedAt.current); setRunning(false); },
    reset: () => { setBanked(0); setRunning(false); },
  };
}

const fmt = ms => {
  const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60, cs = Math.floor(ms / 10) % 100;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
};

function Stopwatch() {
  const sw = useStopwatch();
  const [laps, setLaps] = useState([]);
  return (
    <section className="card">
      <h3>Stopwatch</h3>
      <div className="time" aria-live="off">{fmt(sw.elapsed)}</div>
      <div className="btns">
        {sw.running ? <button onClick={sw.stop}>Stop</button> : <button onClick={sw.start}>{sw.elapsed ? 'Resume' : 'Start'}</button>}
        <button onClick={() => setLaps(l => [sw.elapsed, ...l])} disabled={!sw.running}>Lap</button>
        <button onClick={() => { sw.reset(); setLaps([]); }}>Reset</button>
      </div>
      <ol className="laps">{laps.map((t, i) => <li key={laps.length - i}>Lap {laps.length - i}: {fmt(t - (laps[i + 1] ?? 0))} <small>({fmt(t)})</small></li>)}</ol>
    </section>
  );
}

// ---------- reusable: timed state machine ----------
export function useTimedMachine(machine, initial, { paused = false } = {}) {
  const [state, setState] = useState(initial);
  useEffect(() => {
    if (paused) return;
    const id = setTimeout(() => setState(machine[state].next), machine[state].ms);
    return () => clearTimeout(id);                       // state changed or paused: drop the old timer
  }, [state, machine, paused]);
  return [state, setState];
}

const TRAFFIC = {
  red: { next: 'green', ms: 3000 },
  green: { next: 'yellow', ms: 2500 },
  yellow: { next: 'red', ms: 1000 },
};

function TrafficLight() {
  const [paused, setPaused] = useState(false);
  const [light] = useTimedMachine(TRAFFIC, 'red', { paused });
  return (
    <section className="card">
      <h3>Traffic light</h3>
      <div className="light" role="img" aria-label={`Light is ${light}`}>
        {Object.keys(TRAFFIC).map(c => <span key={c} className={`lamp ${c} ${c === light ? 'on' : ''}`} />)}
      </div>
      <button onClick={() => setPaused(p => !p)}>{paused ? 'Resume' : 'Pause'}</button>
      <pre className="cfg">{JSON.stringify(TRAFFIC, null, 1).replace(/\n\s*/g, ' ')}</pre>
    </section>
  );
}

export default function App() {
  return (
    <div className="grid">
      <style>{`
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
        .card{border:1px solid var(--line);border-radius:12px;padding:14px}.card h3{margin:0 0 8px;font-size:15px}
        .time{font:600 36px ui-monospace,monospace;font-variant-numeric:tabular-nums;margin-bottom:8px}
        .btns{display:flex;gap:6px}.laps{font:13px ui-monospace,monospace;padding-left:20px;max-height:120px;overflow:auto}
        .light{display:inline-flex;flex-direction:column;gap:8px;padding:10px;background:#222;border-radius:14px;margin:0 12px 8px 0;vertical-align:middle}
        .lamp{width:34px;height:34px;border-radius:50%;opacity:.18;transition:opacity .2s}
        .lamp.on{opacity:1;box-shadow:0 0 14px currentColor}
        .red{background:#ef4444;color:#ef4444}.yellow{background:#facc15;color:#facc15}.green{background:#22c55e;color:#22c55e}

```

> **Tip:** For a carousel, the same machine is `index → (index + 1) % n` with a **pause on hover and focus**, and a reset of the timer whenever the user navigates manually. That reset happens for free if the timeout effect depends on `index`.

## 5. Concurrency limit

**Shows up in:** "progress bars that run at most 3 at a time", file uploads, image processing, bulk API calls, download managers.

This is the promise-pool pattern turned into UI state. Keep **one list of jobs**, each with a status (`queued → running → done`). After every change, a single effect checks: *is the number running below the limit, and is something queued?* If so, it starts the next job. When a job finishes, its status changes, the effect runs again, and the next job starts. There's no recursion and no timer juggling, and changing the limit while jobs are running just works.

:::viz pool

Points to make in the interview:

- The **job decides when it's finished**. Here, each bar's CSS animation calls `onDone` from `onAnimationEnd`. For uploads, it would be the request promise resolving. The queue doesn't care what a job is.
- **Derive** the running and queued counts from the list instead of keeping separate counters that can drift out of sync.
- The effect starts **one job per run** and depends on `jobs`, so when several slots free up, it fills them one after another.
- Add retries and cancellation by adding statuses (`failed`, `cancelled`) and buttons that change them.

```jsx preview
import { useState, useEffect, useCallback } from 'react';

// ---------- reusable hook ----------
export function useJobQueue(limit) {
  const [jobs, setJobs] = useState([]);                       // { id, status: 'queued'|'running'|'done', ...data }

  useEffect(() => {
    const running = jobs.filter(j => j.status === 'running').length;
    const next = jobs.find(j => j.status === 'queued');
    if (running < limit && next) {
      setJobs(list => list.map(j => (j.id === next.id ? { ...j, status: 'running', startedAt: Date.now() } : j)));
    }
  }, [jobs, limit]);

  const add = useCallback(data => setJobs(list => [...list, { id: crypto.randomUUID?.() ?? String(Math.random()), status: 'queued', ...data }]), []);
  const finish = useCallback(id => setJobs(list => list.map(j => (j.id === id ? { ...j, status: 'done' } : j))), []);
  const clear = useCallback(() => setJobs([]), []);
  const count = s => jobs.filter(j => j.status === s).length;
  return { jobs, add, finish, clear, running: count('running'), queued: count('queued'), done: count('done') };
}

// ---------- a job's UI: the bar fills, then reports that it's done ----------
function ProgressBar({ job, onDone, duration }) {
  return (
    <div className={`track ${job.status}`} role="progressbar" aria-label={`Job ${job.n}`} aria-valuetext={job.status}>
      <div className="fill" style={{ animationDuration: `${duration}ms` }}
           onAnimationEnd={() => onDone(job.id)} />
      <span className="tag">#{job.n} · {job.status}</span>
    </div>
  );
}

export default function App() {
  const [limit, setLimit] = useState(3);
  const q = useJobQueue(limit);
  const [n, setN] = useState(1);
  const addJob = () => { q.add({ n }); setN(x => x + 1); };

  return (
    <>
      <style>{`
        .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
        .stat{font:12px ui-monospace,monospace;color:var(--muted);margin-left:auto}
        .track{position:relative;height:26px;background:var(--soft);border-radius:6px;margin-bottom:6px;overflow:hidden;border:1px solid var(--line)}
        .fill{height:100%;width:0;background:var(--acc)}
        .track.running .fill{animation-name:grow;animation-timing-function:linear;animation-fill-mode:forwards}
        .track.done .fill{width:100%;background:var(--ok)}
        .tag{position:absolute;left:10px;top:3px;font:12px ui-monospace,monospace}
        .track.queued .tag{color:var(--muted)}
        @keyframes grow{to{width:100%}}
      `}</style>
      <div className="bar">
        <button onClick={addJob}>Add job</button>
        <button onClick={() => { for (let i = 0; i < 5; i++) q.add({ n: n + i }); setN(x => x + 5); }}>Add 5</button>
        <label>limit <select value={limit} onChange={e => setLimit(+e.target.value)}>{[1, 2, 3, 5].map(v => <option key={v}>{v}</option>)}</select></label>
        <button onClick={q.clear}>Clear</button>
        <span className="stat">running {q.running}/{limit} · queued {q.queued} · done {q.done}</span>
      </div>
      {q.jobs.map(j => <ProgressBar key={j.id} job={j} onDone={q.finish} duration={2000} />)}
      {!q.jobs.length && <p style={{ color: 'var(--muted)' }}>Click "Add 5" and watch at most {limit} run at once.</p>}
    </>
  );
}
```

> **Tip:** The non-React version of this is a promise pool: start `limit` workers that each `await` the next task from a shared index. That's in the polyfills guide, and it's worth writing both, because interviewers sometimes ask for the plain JavaScript version as a follow-up.

## 6. Overlays: modal, dropdown, tooltip

**Shows up in:** modal dialogs, confirm boxes, dropdown menus, popovers, tooltips, drawers, command palettes.

Every overlay needs the same set of behaviours. Building them as **small hooks** means each new overlay is a few lines of code:

| Behaviour | Why | How |
|---|---|---|
| **Portal** | escapes `overflow: hidden` and stacking contexts of ancestors | `createPortal(ui, document.body)` |
| **Focus in, focus trap, focus back** | keyboard and screen reader users must land in the dialog, stay in it, and return to where they were | focus the first focusable element on open, wrap Tab/Shift+Tab, refocus the opener on close |
| **Esc closes** | expected everywhere | a keydown listener while open |
| **Click outside closes** | expected for menus and non-critical dialogs | `pointerdown` on the document, checked with `ref.contains(target)` |
| **Scroll lock** | the page behind shouldn't scroll | `body { overflow: hidden }` while open, restored afterwards |
| **Semantics** | announce it properly | `role="dialog"`, `aria-modal="true"`, `aria-labelledby` pointing at the title |

> **Note:** In production, the native `<dialog>` element with `showModal()` gives you the focus trap, Esc, the backdrop and inert background for free. Interviewers usually want to see that you know *what* it does, so build it once by hand.

```jsx preview
import { useState, useEffect, useRef, useId } from 'react';
import { createPortal } from 'react-dom';

// ---------- reusable hooks ----------
export function useClickOutside(ref, handler, enabled = true) {
  const cb = useRef(handler);
  useEffect(() => { cb.current = handler; });
  useEffect(() => {
    if (!enabled) return;
    const onDown = e => { if (ref.current && !ref.current.contains(e.target)) cb.current(e); };
    document.addEventListener('pointerdown', onDown);
    return () => document.removeEventListener('pointerdown', onDown);
  }, [ref, enabled]);
}

export function useEscape(handler, enabled = true) {
  const cb = useRef(handler);
  useEffect(() => { cb.current = handler; });
  useEffect(() => {
    if (!enabled) return;
    const onKey = e => { if (e.key === 'Escape') cb.current(e); };
    document.addEventListener('keydown', onKey);
    return () => document.removeEventListener('keydown', onKey);
  }, [enabled]);
}

export function useScrollLock(locked) {
  useEffect(() => {
    if (!locked) return;
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = prev; };
  }, [locked]);
}

const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
export function useFocusTrap(ref, active) {
  useEffect(() => {
    if (!active || !ref.current) return;
    const node = ref.current, opener = document.activeElement;
    const items = () => [...node.querySelectorAll(FOCUSABLE)];
    (items()[0] ?? node).focus();
    const onKey = e => {
      if (e.key !== 'Tab') return;
      const list = items();
      if (!list.length) { e.preventDefault(); return; }
      const first = list[0], last = list[list.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    node.addEventListener('keydown', onKey);
    return () => { node.removeEventListener('keydown', onKey); opener?.focus?.(); };   // return focus
  }, [ref, active]);
}

// ---------- reusable components ----------
export function Modal({ open, onClose, title, children }) {
  const ref = useRef(null), titleId = useId();
  useFocusTrap(ref, open);
  useScrollLock(open);
  useEscape(onClose, open);
  if (!open) return null;
  return createPortal(
    <div className="backdrop" onPointerDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="dialog" role="dialog" aria-modal="true" aria-labelledby={titleId} ref={ref} tabIndex={-1}>
        <h2 id={titleId}>{title}</h2>
        {children}
      </div>
    </div>,
    document.body
  );
}

export function Dropdown({ label, items, onSelect }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null), menuId = useId();
  useClickOutside(ref, () => setOpen(false), open);
  useEscape(() => setOpen(false), open);
  return (
    <div className="dd" ref={ref}>

## 7. Keyboard grids: tabs, OTP, tic-tac-toe

**Shows up in:** tabs, OTP and PIN inputs, tic-tac-toe and other game boards, calendars, toolbars, radio groups, menus.

All of these are a **group of related controls you move between with arrow keys**. Two techniques do almost all the work:

- **Roving tabindex**: only the active item has `tabIndex={0}`, and the rest have `-1`. Tab enters and leaves the group in one stop, and arrow keys move focus inside it. This is how native radio groups behave, and it's what the ARIA authoring practices prescribe for tabs, toolbars and grids.
- **A refs array**: `refs.current[i]` holds each element, so `focus(i ± 1)` is one line. Assign it with a callback ref: `ref={el => (refs.current[i] = el)}`.

For **OTP** inputs, also handle: typing advances to the next box, Backspace on an empty box goes back and clears the previous digit, ArrowLeft/ArrowRight move between boxes, and **paste** spreads a whole code across the boxes (with `autoComplete="one-time-code"` for SMS autofill).

```jsx preview
import { useState, useRef, useId } from 'react';

// ---------- reusable: tabs with roving tabindex ----------
export function Tabs({ tabs }) {
  const [active, setActive] = useState(0);
  const refs = useRef([]);
  const id = useId();
  const onKeyDown = e => {
    const last = tabs.length - 1;
    const next = { ArrowRight: active === last ? 0 : active + 1, ArrowLeft: active === 0 ? last : active - 1, Home: 0, End: last }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    setActive(next);
    refs.current[next].focus();
  };
  return (
    <div>
      <div role="tablist" className="tablist" onKeyDown={onKeyDown}>
        {tabs.map((t, i) => (
          <button key={t.label} ref={el => (refs.current[i] = el)} role="tab" id={`${id}t${i}`}
            aria-selected={i === active} aria-controls={`${id}p${i}`} tabIndex={i === active ? 0 : -1}
            onClick={() => setActive(i)}>{t.label}</button>
        ))}
      </div>
      {tabs.map((t, i) => (
        <div key={t.label} role="tabpanel" id={`${id}p${i}`} aria-labelledby={`${id}t${i}`} hidden={i !== active} tabIndex={0} className="panel">{t.content}</div>
      ))}
    </div>
  );
}

// ---------- reusable: OTP input ----------
export function OtpInput({ length = 6, onComplete }) {
  const [digits, setDigits] = useState(() => Array(length).fill(''));
  const refs = useRef([]);
  const focus = i => refs.current[Math.max(0, Math.min(length - 1, i))]?.focus();
  const commit = next => { setDigits(next); if (next.every(Boolean)) onComplete?.(next.join('')); };

  const onChange = (i, e) => {
    const typed = e.target.value.replace(/\D/g, '');
    if (!typed) return;
    const next = [...digits];
    typed.slice(0, length - i).split('').forEach((d, k) => { next[i + k] = d; });   // also handles autofill of the whole code
    commit(next);
    focus(i + typed.length);
  };
  const onKeyDown = (i, e) => {
    if (e.key === 'Backspace') {
      e.preventDefault();
      const next = [...digits];
      if (next[i]) next[i] = '';
      else if (i > 0) { next[i - 1] = ''; focus(i - 1); }
      setDigits(next);
    } else if (e.key === 'ArrowLeft') { e.preventDefault(); focus(i - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); focus(i + 1); }
  };
  const onPaste = e => {
    const code = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, length);
    if (!code) return;
    e.preventDefault();
    commit(Array.from({ length }, (_, k) => code[k] ?? ''));
    focus(code.length);
  };

  return (
    <div className="otp" onPaste={onPaste}>
      {digits.map((d, i) => (
        <input key={i} ref={el => (refs.current[i] = el)} value={d} inputMode="numeric" maxLength={length}
          autoComplete={i === 0 ? 'one-time-code' : 'off'} aria-label={`Digit ${i + 1} of ${length}`}
          onChange={e => onChange(i, e)} onKeyDown={e => onKeyDown(i, e)} onFocus={e => e.target.select()} />
      ))}
    </div>
  );
}

// ---------- reusable: tic-tac-toe board as an arrow-key grid ----------
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const winnerOf = b => { for (const [a, c, d] of LINES) if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a]; return b.every(Boolean) ? 'draw' : null; };

export function TicTacToe() {
  const [board, setBoard] = useState(Array(9).fill(null));
  const [focusIdx, setFocusIdx] = useState(4);
  const refs = useRef([]);
  const xNext = board.filter(Boolean).length % 2 === 0;
  const result = winnerOf(board);
  const play = i => { if (board[i] || result) return; const b = [...board]; b[i] = xNext ? 'X' : 'O'; setBoard(b); };
  const onKeyDown = (i, e) => {
    const r = Math.floor(i / 3), c = i % 3;
    const to = { ArrowUp: [r - 1, c], ArrowDown: [r + 1, c], ArrowLeft: [r, c - 1], ArrowRight: [r, c + 1] }[e.key];
    if (!to) return;
    e.preventDefault();
    const [nr, nc] = to.map(v => (v + 3) % 3);                   // wrap around the edges
    setFocusIdx(nr * 3 + nc); refs.current[nr * 3 + nc].focus();
  };
  return (
    <div>
      <p className="status" aria-live="polite">{result === 'draw' ? 'Draw!' : result ? `${result} wins!` : `${xNext ? 'X' : 'O'} to play`}</p>
      <div className="board" role="grid" aria-label="Tic-tac-toe">
        {board.map((v, i) => (
          <button key={i} ref={el => (refs.current[i] = el)} role="gridcell" tabIndex={i === focusIdx ? 0 : -1}
            aria-label={`Row ${Math.floor(i / 3) + 1}, column ${(i % 3) + 1}, ${v ?? 'empty'}`}
            onClick={() => { setFocusIdx(i); play(i); }} onKeyDown={e => onKeyDown(i, e)}>{v}</button>
        ))}
      </div>
      <button onClick={() => setBoard(Array(9).fill(null))}>New game</button>
    </div>
  );
}

export default function App() {
  const [code, setCode] = useState('');
  return (
    <>
      <style>{`
        .tablist{display:flex;gap:4px;border-bottom:1px solid var(--line)}
        .tablist [role=tab]{border:0;border-bottom:2px solid transparent;border-radius:0;background:none}
        .tablist [aria-selected=true]{border-bottom-color:var(--acc);color:var(--acc);font-weight:600}
        .panel{padding:14px 2px}
        .otp{display:flex;gap:8px}.otp input{width:42px;height:48px;text-align:center;font-size:20px;padding:0}
        .board{display:grid;grid-template-columns:repeat(3,56px);gap:6px;margin:6px 0 10px}
        .board button{height:56px;font-size:24px;font-weight:700;padding:0}
        .status{margin:0}
      `}</style>
      <Tabs tabs={[
        { label: 'OTP input', content: <><p style={{ marginTop: 0 }}>Type, use Backspace and the arrow keys, or paste “482913”.</p><OtpInput length={6} onComplete={setCode} /><p>Completed code: <b>{code || '—'}</b></p></> },
        { label: 'Tic-tac-toe', content: <><p style={{ marginTop: 0 }}>Tab into the board once, then move with the arrow keys and press Enter.</p><TicTacToe /></> },
        { label: 'About', content: <p style={{ margin: 0 }}>These tabs use a roving tabindex: focus a tab, then press ←/→, Home or End.</p> },
      ]} />
    </>
  );
}
```

> **Follow-up:** "Generalise tic-tac-toe to n × n with k in a row." Check only the lines through the **last move**: walk outwards in 4 directions and count matching cells. That's O(k) per move instead of scanning the whole board.

## 8. Drag and drop

**Shows up in:** Kanban boards (Trello, Jira), sortable lists, file upload drop zones, dashboard widget layout.

Separate the problem into three parts:

1. **A pure move function**: `moveCard(board, cardId, toColumn, toIndex)` returns a new board. It knows nothing about the mouse, so you can test it on its own, reuse it for keyboard moves, and use it to undo.
2. **The drag mechanics**: with the native HTML5 API, `draggable` + `onDragStart` (store the card id in `dataTransfer`), `onDragOver` (call `preventDefault()` to allow dropping, and work out the drop index from the pointer's Y position against each card's midpoint), and `onDrop`. Native DnD doesn't work on touch screens, so production apps use pointer events or a library like **dnd-kit**.
3. **An optimistic update**: apply the move to the UI immediately, save in the background, and **roll back** to the previous board (with a message) if the save fails. Keep the snapshot in the closure of that drop, so a later move can't be overwritten by an older rollback.

Also offer a **keyboard alternative** (move buttons), because drag and drop alone isn't accessible.

```jsx preview
import { useState, useRef } from 'react';

// ---------- the pure, reusable part ----------
export function moveCard(columns, cardId, toCol, toIndex) {
  const fromCol = Object.keys(columns).find(c => columns[c].includes(cardId));
  const without = { ...columns, [fromCol]: columns[fromCol].filter(id => id !== cardId) };
  const target = [...without[toCol]];
  target.splice(toIndex ?? target.length, 0, cardId);
  return { ...without, [toCol]: target };
}

// fake API: fails when asked to, so you can watch the rollback
const saveMove = shouldFail => new Promise((res, rej) => setTimeout(() => (shouldFail ? rej(new Error('Server rejected the move')) : res()), 700));

const CARDS = {
  a: 'Design login page', b: 'Set up CI', c: 'Write API docs', d: 'Fix dark-mode bug', e: 'Add analytics', f: 'Release v1.2',
};
const COLS = { todo: 'To do', doing: 'In progress', done: 'Done' };

export default function App() {
  const [columns, setColumns] = useState({ todo: ['a', 'b', 'c'], doing: ['d'], done: ['e', 'f'] });
  const [over, setOver] = useState(null);                      // { col, index } drop indicator
  const [failNext, setFailNext] = useState(false);
  const [toast, setToast] = useState('');
  const [saving, setSaving] = useState(0);
  const dragId = useRef(null);

  const commitMove = (cardId, toCol, toIndex) => {
    const before = columns;                                     // snapshot for rollback
    const after = moveCard(columns, cardId, toCol, toIndex);
    if (JSON.stringify(after) === JSON.stringify(before)) return;
    setColumns(after);                                          // optimistic
    setSaving(n => n + 1);
    saveMove(failNext)
      .then(() => setToast(`Saved: “${CARDS[cardId]}” → ${COLS[toCol]}`))
      .catch(err => { setColumns(cur => (cur === after ? before : cur)); setToast(`${err.message}. Move undone.`); })
      .finally(() => setSaving(n => n - 1));
  };

  const indexFromPointer = (colEl, y) => {
    const cards = [...colEl.querySelectorAll('[data-card]')].filter(el => el.dataset.card !== dragId.current);
    const i = cards.findIndex(el => { const r = el.getBoundingClientRect(); return y < r.top + r.height / 2; });
    return i === -1 ? cards.length : i;
  };

  return (
    <>
      <style>{`
        .top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
        .kanban{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:10px;overflow-x:auto}
        .col{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:220px}
        .col.over{border-color:var(--acc);background:var(--acc-soft)}
        .col h4{margin:2px 4px 8px;font-size:13px;display:flex;justify-content:space-between}
        .card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;cursor:grab;font-size:13px}
        .card:active{cursor:grabbing}.card .mv{display:flex;gap:4px;margin-top:6px}.card .mv button{padding:0 6px;font-size:11px}
        .drop-line{height:3px;background:var(--acc);border-radius:2px;margin:-3px 0 3px}
        .toast{font-size:13px;color:var(--muted)}
      `}</style>
      <div className="top">
        <label><input type="checkbox" checked={failNext} onChange={e => setFailNext(e.target.checked)} /> make saves fail (see rollback)</label>
        <span className="toast" aria-live="polite">{saving ? 'Saving…' : toast}</span>
      </div>
      <div className="kanban">
        {Object.entries(COLS).map(([col, title]) => (
          <section key={col} className={`col ${over?.col === col ? 'over' : ''}`} aria-label={title}
            onDragOver={e => { e.preventDefault(); setOver({ col, index: indexFromPointer(e.currentTarget, e.clientY) }); }}
            onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setOver(null); }}
            onDrop={e => { e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); commitMove(id, col, indexFromPointer(e.currentTarget, e.clientY)); setOver(null); }}>
            <h4>{title}<span>{columns[col].length}</span></h4>
            {columns[col].map(id => (
              <div key={id}>
                {over?.col === col && id !== dragId.current && over.index === columns[col].filter(x => x !== dragId.current).indexOf(id) && <div className="drop-line" />}
                <div className="card" data-card={id} draggable style={{ opacity: id === dragId.current && over ? 0.4 : 1 }}
                  onDragStart={e => { dragId.current = id; e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; }}
                  onDragEnd={() => { dragId.current = null; setOver(null); }}>
                  {CARDS[id]}
                  <div className="mv">
                    {Object.keys(COLS).filter(c => c !== col).map(c => (
                      <button key={c} aria-label={`Move “${CARDS[id]}” to ${COLS[c]}`} onClick={() => commitMove(id, c)}>→ {COLS[c]}</button>
                    ))}
                  </div>
                </div>
              </div>
            ))}
            {over?.col === col && over.index >= columns[col].filter(id => id !== dragId.current).length && <div className="drop-line" />}
          </section>
        ))}
      </div>
    </>
  );
}
```

> **Interview:** Say what you'd do for production: **dnd-kit** (pointer and touch sensors, keyboard dragging, screen reader announcements), **fractional indexing** for card order (a new position between two neighbours, so a move updates one row in the database instead of renumbering the column), and server events to sync other users' moves.

## Polish that interviewers notice

- **Semantics and keyboard**: real `<button>`s, `<label>`s, `<ul>/<li>` for lists, and Enter, Esc and arrow keys where people expect them. Say so as you add them.
- **States**: a loading skeleton or spinner, an empty state ("No results for 'xyz'"), an error with a retry, and disabled buttons while submitting.
- **Accurate timers**: compute elapsed time from timestamps, because `setInterval` drifts and gets throttled in background tabs.
- **Performance awareness**: mention virtualisation for long lists, memoising expensive rows, and debouncing. Implement them only if there's time.
- **Clean-up**: every interval, listener, observer and request is cleaned up on unmount.

> **Interview:** If you get stuck, **narrate**: "I'm deciding whether the expanded state lives in each node or in a map at the top. A map makes 'collapse all' trivial, so I'll go with that." Interviewers can give hints only when they know where you are.

## What "fast" means: the Core Web Vitals

Performance questions are really about **user experience**, measured. Google's Core Web Vitals turn "it feels slow" into three numbers, each judged at the **75th percentile of real users**:

| Metric | Measures | Good | Poor | Mostly caused by |
|---|---|---|---|---|
| **LCP**, Largest Contentful Paint | loading: when the main content appears | ≤ 2.5 s | > 4 s | slow server, render-blocking resources, a late-discovered hero image |
| **INP**, Interaction to Next Paint | responsiveness: the delay from an input to the next frame | ≤ 200 ms | > 500 ms | long tasks, heavy event handlers, big re-renders |
| **CLS**, Cumulative Layout Shift | visual stability: unexpected movement | ≤ 0.1 | > 0.25 | images and ads without reserved space, web fonts, late-injected content |

Supporting metrics: **TTFB** (server and network), **FCP** (first content), and **TBT** (total blocking time, a lab stand-in for INP).

:::viz vitals

### Lab vs field

- **Lab data** (Lighthouse, WebPageTest, the DevTools Performance panel): repeatable, on a fixed device and network. Great for debugging and for catching regressions in CI. But it's one synthetic run, and it can't measure INP (no real users interacting).
- **Field data**, or RUM (the `web-vitals` library, CrUX, your analytics): what real users on real devices experience. This is the truth, and what Google ranks on. Slice it by page type, device and country.

> **Interview:** A senior answer to "how would you improve performance?" starts with **measuring**: "First, I'd check the field data to see which metric is poor, on which pages and devices. Then I'd reproduce it in the lab with throttling, profile it, fix the largest contributor, and add a performance budget in CI so it doesn't come back."

## Improving LCP

Break LCP into its four parts and attack whichever is largest:

:::html
<figure class="fig"><svg viewBox="0 0 680 120" role="img" aria-label="LCP broken into TTFB, resource load delay, resource load time and element render delay.">
<rect class="s-acc" x="10" y="30" width="150" height="40" rx="6"/><text class="s-t" x="85" y="55" text-anchor="middle">TTFB</text>
<rect class="s-bad" x="160" y="30" width="190" height="40" rx="6"/><text class="s-t" x="255" y="55" text-anchor="middle">load delay</text>
<rect class="s-cur" x="350" y="30" width="190" height="40" rx="6"/><text class="s-t" x="445" y="55" text-anchor="middle">load time</text>
<rect class="s-spec" x="540" y="30" width="130" height="40" rx="6"/><text class="s-t" x="605" y="55" text-anchor="middle">render delay</text>
<text class="s-ts" x="85" y="92" text-anchor="middle">CDN, caching, SSR speed</text><text class="s-ts" x="255" y="92" text-anchor="middle">discover it early: preload,</text><text class="s-ts" x="255" y="106" text-anchor="middle">fetchpriority, no lazy-load</text><text class="s-ts" x="445" y="92" text-anchor="middle">smaller: AVIF/WebP, srcset</text><text class="s-ts" x="605" y="92" text-anchor="middle">less blocking CSS/JS</text>
<text class="s-tb" x="10" y="20">navigation → → → → LCP element painted</text>
</svg><figcaption>Often the biggest win is "load delay": the browser didn't know about the hero image until JavaScript ran.</figcaption></figure>
:::

- Make the LCP image **discoverable in the HTML** (not set by JavaScript or as a CSS background), add `fetchpriority="high"`, and **never lazy-load it**.
- Serve modern formats (AVIF/WebP), responsive sizes (`srcset` + `sizes`), from a CDN.
- Cut render-blocking resources: inline the critical CSS, load the rest asynchronously, and `defer` scripts.
- Render on the server (SSR/SSG/streaming) so content isn't waiting for a JavaScript bundle. Cache HTML at the edge.

## Improving INP

INP = **input delay** (the main thread is busy with something else) + **processing time** (your handlers) + **presentation delay** (rendering the next frame). All three come down to the main thread being busy.

:::viz longtask

- **Break up long tasks**: yield with `scheduler.yield()` or `setTimeout`, and process big arrays in chunks.
- **Do less per interaction**: update the urgent UI first (the input's value, a pressed state) and defer the rest (`startTransition`, `useDeferredValue`, `requestIdleCallback`).
- **Shrink rendering work**: memoise, virtualise long lists, avoid re-rendering the whole tree from a top-level context, and keep the DOM small.
- **Move heavy computation off the main thread** to a Web Worker.
- **Audit third-party scripts**: tag managers, chat widgets and A/B testing tools are frequent offenders. Load them late, or move them to a worker (Partytown).

## Preventing layout shifts (CLS)

- Always set `width` and `height` (or `aspect-ratio`) on images, videos and iframes.
- **Reserve space** for ads, embeds, banners and lazy content (`min-height`, skeletons).
- Never insert content **above** existing content unless the user asked for it.
- Fonts: `font-display: optional` or `swap` with a **size-adjusted fallback** (`size-adjust`, `ascent-override`) so the text doesn't reflow when the web font arrives. Preload the one or two critical font files.
- Animate with `transform`, not `top`/`height`. Transforms don't count as layout shifts.

## Loading strategy: ship less JavaScript

JavaScript is the most expensive kind of byte: it has to be downloaded, **parsed, compiled and executed** on the main thread. On a mid-range phone, 1 MB of JavaScript can cost seconds.

- **Code splitting**: split by route (`React.lazy(() => import('./Settings'))` + `Suspense`), then by heavy, rarely used components (editors, charts, modals). Prefetch likely next routes on hover or when idle.
- **Tree shaking**: use ES modules and side-effect-free packages, import exactly what you need (`import debounce from 'lodash-es/debounce'`), and check your bundle with a visualiser (`rollup-plugin-visualizer`, `source-map-explorer`).
- **Replace heavy dependencies**: moment → date-fns or `Intl`, lodash → native methods, a big UI kit → only the components you use.
- **Modern output**: target modern browsers to avoid unnecessary polyfills, compress with Brotli, and use HTTP/2.
- **Resource hints**: `preconnect` to critical third-party origins, `preload` for late-discovered critical files, `prefetch` for likely next navigations.

### Long lists

Rendering 10,000 rows creates 10,000+ DOM nodes: slow to mount, slow to update, and heavy on memory. **Virtualisation** (windowing) renders only the rows in view, plus a small overscan, inside a spacer element that's as tall as the full list.

:::viz virtual

## Rendering strategies

| Strategy | HTML produced | Strengths | Costs |
|---|---|---|---|
| CSR (SPA) | in the browser, after JS loads | cheap hosting, rich interactivity | slow first load, poor LCP, SEO risk |
| SSR | per request, on the server | fresh, SEO-friendly, fast FCP | server cost, TTFB, then hydration |
| SSG | at build time | fastest, served from a CDN | stale until the next build |
| ISR / revalidation | SSG, refreshed in the background | SSG speed with fresh-enough content | complexity, cache invalidation |
| Streaming SSR + Server Components | flushed in chunks as data resolves | fast TTFB and FCP, less client JS | needs framework support |

## Measuring in code

```js run
// Measure your own code with the User Timing API (it shows up in DevTools Performance)
performance.mark('work-start');
let x = 0; for (let i = 0; i < 2e6; i++) x += Math.sqrt(i);
performance.mark('work-end');
const m = performance.measure('work', 'work-start', 'work-end');
console.log('work took', m.duration.toFixed(1), 'ms');
// In production: new PerformanceObserver(list => send(list.getEntries())).observe({ type: 'largest-contentful-paint', buffered: true })
// …or simply: import { onLCP, onINP, onCLS } from 'web-vitals'
```

> **In short:** measure field data first; fix LCP with early discovery and less blocking; fix INP by keeping tasks under 50 ms; fix CLS by reserving space; ship less JavaScript; and lock the gains in with budgets in CI.

## Under the hood: Fiber

Before React 16, reconciliation was a recursive function that walked the whole tree in one go. Once a large update started, nothing could interrupt it, so typing and animations stuttered. **Fiber** rewrote the reconciler so that rendering work can be **split up, paused, prioritised and thrown away**.

A **fiber** is a JavaScript object for one component instance. It holds the component's type, props, state (the hooks list), effects, and pointers to its `child`, `sibling` and `return` (parent) fibers. Because the tree is a linked structure rather than a call stack, React can walk it **with a loop it controls**, stop after any fiber, and continue later.

:::html
