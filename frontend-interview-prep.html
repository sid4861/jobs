## Scope, hoisting & closures

### Q: What is the difference between `var`, `let` and `const`? [Core] [Easy]

| | `var` | `let` | `const` |
|---|---|---|---|
| Scope | Function | Block `{}` | Block `{}` |
| Hoisted? | Yes, initialised to `undefined` | Yes, but uninitialised (TDZ) | Yes, but uninitialised (TDZ) |
| Re-declare in same scope | Allowed | SyntaxError | SyntaxError |
| Re-assign | Allowed | Allowed | TypeError |
| Creates `window` property at top level | Yes | No | No |

`const` makes the **binding** constant, not the value. A `const` object or array can still be mutated (`arr.push(4)` is fine); use `Object.freeze` for shallow immutability.

```js run
function demo() {
  if (true) {
    var a = 1;   // function-scoped: visible after the block
    let b = 2;   // block-scoped
  }
  console.log(a);              // 1
  console.log(typeof b);       // "undefined" (b is not in scope here)
}
demo();

const list = [1, 2];
list.push(3);                  // allowed: we mutate, we don't re-assign
console.log(list);
try { list = []; } catch (e) { console.log(e.name + ': ' + e.message); }
```

> **Rule of thumb:** use `const` by default, `let` when you need to re-assign, and never `var` in new code.

### Q: What is hoisting, and what is the temporal dead zone (TDZ)? [Core] [Easy]

Before running a scope, the engine creates bindings for all its declarations. That is **hoisting**: declarations behave as if moved to the top of their scope.

- `function` declarations are hoisted **with their body**, so you can call them before the line they appear on.
- `var` is hoisted and initialised to `undefined`.
- `let`, `const` and `class` are hoisted but **not initialised**. From the start of the scope until the declaration line runs, the binding is in the **temporal dead zone**; touching it throws `ReferenceError`.
- Function **expressions** and arrow functions follow the rules of the variable they are assigned to.

```js run
console.log(hoistedFn());       // works: declaration hoisted with its body
console.log(v);                 // undefined
try { console.log(l); } catch (e) { console.log(e.name + ': ' + e.message); }
try { expr(); } catch (e) { console.log(e.name + ': ' + e.message); }

function hoistedFn() { return 'hoisted!'; }
var v = 1;
let l = 2;
var expr = function () {};
```

> **Watch out:** the TDZ is about _time_, not position. A function that references a `let` declared later is fine as long as it is _called_ after the declaration has run.

### Q: What is a closure? Give a practical example. [Core] [Easy]

A **closure** is a function together with the variables from the scope where it was **created**. The function keeps access to those variables even after the outer function has returned, because JavaScript scopes are **lexical** (decided by where code is written, not where it is called).

Practical uses: private state (module pattern), function factories, memoisation caches, event handlers and callbacks that remember context, `debounce`/`throttle` timers, and React hooks (every render's handlers close over that render's props and state).

```js run
function createCounter() {
  let count = 0;                      // private: only reachable through the closure
  return {
    increment: () => ++count,
    decrement: () => --count,
    value: () => count,
  };
}
const c = createCounter();
c.increment(); c.increment(); c.decrement();
console.log(c.value());               // 1
console.log(c.count);                 // undefined: no direct access
```

> **Interview tip:** mention the cost. Closures keep their captured variables alive, so a long-lived closure (an event listener you never remove, a cache that grows forever) can cause memory leaks.

### Q: Why does a `for` loop with `var` and `setTimeout` print the same number? How do you fix it? [Core] [Easy]

With `var` there is **one** `i` for the whole loop (function scope). The callbacks run after the loop has finished, so they all read the final value. `let` creates a **fresh binding per iteration**, so each callback closes over its own `i`.

```js run
for (var i = 0; i < 3; i++) setTimeout(() => console.log('var:', i), 0);   // 3 3 3
for (let j = 0; j < 3; j++) setTimeout(() => console.log('let:', j), 0);   // 0 1 2

// Pre-ES6 fix: an IIFE creates a new scope per iteration
for (var k = 0; k < 3; k++) {
  (function (k) { setTimeout(() => console.log('iife:', k), 0); })(k);
}
```

### Q: What is lexical scope and the scope chain? [Easy]

Each function creates a scope; scopes nest according to where functions are **written**. To resolve a variable, the engine looks in the current scope, then the enclosing one, and so on up to the global scope. That ordered list is the **scope chain**. If the name isn't found anywhere you get a `ReferenceError` (or, in sloppy mode, assignment creates an accidental global).

Because scope is lexical, a function always sees the variables of the place it was defined, regardless of who calls it. Dynamic things such as `this` are different, which is why `this` confuses people and closures don't.

### Q: What is an IIFE and why was the module pattern used? [Easy]

An **Immediately Invoked Function Expression** runs as soon as it is defined: `(function () { … })()`. Before ES modules and block scope, it was the only way to create a private scope and avoid leaking variables onto `window`. The **module pattern** returns a public API from an IIFE and keeps everything else private through closures. Today ES modules give each file its own scope, so IIFEs mostly appear in legacy code, bundler output and async top-level code (`(async () => { … })()`).

## `this`, `call`, `apply` & `bind`

### Q: How is `this` determined in JavaScript? [Core] [Medium]

For normal functions, `this` is decided by **how the function is called**, checked in this order:

1. **`new` binding:** `new Foo()` sets `this` to the newly created object.
2. **Explicit binding:** `fn.call(obj)`, `fn.apply(obj)`, or a function produced by `fn.bind(obj)`.
3. **Implicit binding:** `obj.method()`, so `this` is the object before the dot.
4. **Default binding:** a plain call `fn()` gets `undefined` in strict mode (and in modules and classes), or the global object in sloppy mode.

**Arrow functions** ignore all of these: they have no own `this` and use the `this` of the enclosing scope at the time they were created. That makes them ideal for callbacks inside methods, and wrong as object methods.

```js run
'use strict';
const user = {
  name: 'Asha',
  regular() { return this && this.name; },
  arrow: () => typeof this,          // `this` of the surrounding (top-level) scope
  delayed() { setTimeout(() => console.log('arrow in method:', this.name), 0); },
};
console.log(user.regular());          // "Asha" (implicit binding)
const detached = user.regular;
console.log(detached());              // undefined (lost binding: plain call, strict mode)
console.log(detached.call({ name: 'Ravi' }));   // "Ravi" (explicit binding)
user.delayed();                        // arrow keeps the method's this → "Asha"
```

> **Pitfall:** passing `obj.method` as a callback (`button.addEventListener('click', obj.method)`, `setTimeout(obj.method)`) loses the binding. Use `obj.method.bind(obj)` or an arrow wrapper.

### Q: What is the difference between `call`, `apply` and `bind`? [Core] [Easy]

All three set `this` explicitly.

- `fn.call(thisArg, a, b)` calls `fn` immediately with arguments listed one by one.
- `fn.apply(thisArg, [a, b])` calls `fn` immediately with arguments as an array.
- `fn.bind(thisArg, a)` **returns a new function** with `this` (and optionally leading arguments) fixed permanently. Calling `call`/`bind` again on the result can't change its `this`; only `new` can override it.

```js run
function greet(greeting, punct) { return greeting + ', ' + this.name + punct; }
const p = { name: 'Meera' };
console.log(greet.call(p, 'Hi', '!'));
console.log(greet.apply(p, ['Hello', '?']));
const hey = greet.bind(p, 'Hey');      // partial application of the first argument
console.log(hey('.'));
console.log(hey.call({ name: 'other' }, '!'));   // still Meera: bound this wins
```

See the [bind/call/apply polyfills](#/js-coding) for how to implement them.

### Q: When should you NOT use an arrow function? [Medium]

- **Object methods** that use `this`: an arrow method can't see the object.
- **Prototype methods and constructors**: arrows can't be used with `new` and have no `prototype`.
- **Event handlers that need `this` to be the element**: `el.addEventListener('click', function () { this.classList.toggle('on'); })`.
- **Functions that need `arguments`**: arrows don't have their own `arguments` (use rest parameters instead).
- **Generators**: there is no arrow-function syntax for `function*`.

## Prototypes, classes & objects

### Q: Explain prototypal inheritance and the prototype chain. [Core] [Medium]

Every object has an internal link `[[Prototype]]` to another object (or `null`). When you read a property that the object doesn't have, the engine follows that link, then the next one, until it finds the property or reaches `null`. That chain of links is the **prototype chain**. Writing a property always creates it on the object itself (it never writes to the prototype), which is called **shadowing**.

- `obj.__proto__` (or `Object.getPrototypeOf(obj)`) is the object's prototype link.
- `Fn.prototype` is the object that becomes the prototype of instances created with `new Fn()`. Only functions have a `.prototype` property.
- Methods live once on the prototype and are shared by all instances, which saves memory compared with defining them in the constructor.

```js run
function Animal(name) { this.name = name; }
Animal.prototype.speak = function () { return this.name + ' makes a sound'; };

function Dog(name) { Animal.call(this, name); }          // inherit instance fields
Dog.prototype = Object.create(Animal.prototype);         // inherit methods
Dog.prototype.constructor = Dog;
Dog.prototype.speak = function () { return this.name + ' barks'; };   // override

const d = new Dog('Rex');
console.log(d.speak());                                  // own prototype's method
console.log(Animal.prototype.speak.call(d));             // parent's method
console.log(Object.getPrototypeOf(d) === Dog.prototype); // true
console.log(d instanceof Animal);                        // true: Animal.prototype is in the chain
console.log(d.hasOwnProperty('name'), d.hasOwnProperty('speak'));  // true false
```

### Q: Are ES6 classes different from constructor functions? [Medium]

Classes are mostly **syntax over the same prototype mechanism**: methods still go on `Class.prototype` and `extends` still sets up the prototype chain. The differences that matter:

- Class bodies always run in **strict mode**.
- Classes must be called with `new` (calling one directly throws a TypeError).
- Class declarations are in the **TDZ** until defined; they aren't usable before the line.
- Methods are **non-enumerable**.
- `extends` + `super()` handle inheriting built-ins like `Array` and `Error` correctly.
- Extra features: `static` members, **private fields** `#x` (truly private, enforced by the engine), static blocks, getters and setters.

```js run
class Account {
  #balance = 0;                         // private field
  static count = 0;
  constructor(owner) { this.owner = owner; Account.count++; }
  deposit(amt) { if (amt <= 0) throw new RangeError('amount must be positive'); this.#balance += amt; return this; }
  get balance() { return this.#balance; }
}
class Savings extends Account {
  deposit(amt) { return super.deposit(amt * 1.01); }   // add 1% bonus
}
const s = new Savings('Neha').deposit(100);
console.log(s.balance, Account.count, s.owner);
console.log(Object.keys(s));           // ["owner"]: private field and methods aren't listed
```

### Q: What exactly does the `new` keyword do? [Medium]

`new Fn(...args)`:

1. Creates a new empty object.
2. Sets its `[[Prototype]]` to `Fn.prototype`.
3. Calls `Fn` with `this` bound to the new object.
4. If `Fn` returns an **object**, that object is the result; otherwise the new object is returned.

```js run
function myNew(Fn, ...args) {
  const obj = Object.create(Fn.prototype);
  const result = Fn.apply(obj, args);
  return result !== null && (typeof result === 'object' || typeof result === 'function') ? result : obj;
}
function Person(name) { this.name = name; }
Person.prototype.hi = function () { return 'hi, ' + this.name; };
const p = myNew(Person, 'Kiran');
console.log(p.hi(), p instanceof Person);
```

### Q: How does `instanceof` work, and how is it different from `typeof`? [Easy]

`typeof x` returns a string describing the **primitive type** (`"string"`, `"number"`, `"boolean"`, `"undefined"`, `"symbol"`, `"bigint"`, `"function"`, or `"object"` for everything else, including `null` and arrays).

`x instanceof C` checks whether `C.prototype` appears **anywhere in x's prototype chain**. It only works for objects, and it can fail across realms (an array from an iframe isn't `instanceof Array` in the parent). That's why `Array.isArray` exists.

```js run
console.log(typeof null, typeof [], typeof function () {}, typeof NaN);
console.log([] instanceof Array, [] instanceof Object, Array.isArray([]));
function myInstanceof(obj, C) {
  if (obj === null || (typeof obj !== 'object' && typeof obj !== 'function')) return false;
  let proto = Object.getPrototypeOf(obj);
  while (proto) { if (proto === C.prototype) return true; proto = Object.getPrototypeOf(proto); }
  return false;
}
console.log(myInstanceof(new Date(), Date), myInstanceof(new Date(), Array), myInstanceof(1, Number));
```

### Q: What is the difference between `Object.freeze`, `Object.seal` and `Object.preventExtensions`? [Easy]

| | Add properties | Delete properties | Change values |
|---|---|---|---|
| `preventExtensions` | No | Yes | Yes |
| `seal` | No | No | Yes |
| `freeze` | No | No | No |

All three are **shallow**: nested objects stay mutable unless you freeze them recursively. In strict mode, violating them throws; in sloppy mode the write is silently ignored.

### Q: What are property descriptors, getters and setters? [Medium]

Every property has a **descriptor**: either a data descriptor (`value`, `writable`) or an accessor descriptor (`get`, `set`), plus `enumerable` and `configurable`. `Object.defineProperty` lets you create read-only, hidden or computed properties; this is how frameworks such as Vue 2 implemented reactivity.

```js run
const temp = { _c: 25 };
Object.defineProperty(temp, 'f', {
  get() { return this._c * 9 / 5 + 32; },
  set(v) { this._c = (v - 32) * 5 / 9; },
  enumerable: false,
});
temp.f = 212;
console.log(temp._c, temp.f, Object.keys(temp));
console.log(Object.getOwnPropertyDescriptor(temp, '_c'));
```

### Q: What are `Proxy` and `Reflect` used for? [Senior] [Medium]

A `Proxy` wraps an object and intercepts fundamental operations (`get`, `set`, `has`, `deleteProperty`, `apply`…) through **traps**. `Reflect` provides the default behaviour of each trap as a function, so a trap can add logic and then forward the operation correctly. Uses: validation, change tracking and reactivity (Vue 3 and MobX), default values, negative array indexes, logging and mocks in tests.

```js run
function reactive(target, onChange) {
  return new Proxy(target, {
    set(obj, key, value, receiver) {
      const old = obj[key];
      const ok = Reflect.set(obj, key, value, receiver);
      if (old !== value) onChange(key, old, value);
      return ok;
    },
  });
}
const state = reactive({ count: 0 }, (k, a, b) => console.log(`${k}: ${a} → ${b}`));
state.count++;
state.count = 5;
```

## Types, equality & coercion

### Q: What are the primitive types, and how are primitives different from objects? [Core] [Easy]

The seven primitives are `string`, `number`, `bigint`, `boolean`, `undefined`, `null` and `symbol`. Everything else (objects, arrays, functions, dates, maps…) is an object.

- Primitives are **immutable** and compared **by value**.
- Objects are compared **by reference**: two different objects are never `===`, even if their contents match.
- JavaScript always passes arguments **by value**, but for objects the value is a reference. A function can mutate the object you pass in, but re-assigning the parameter doesn't affect the caller.

```js run
function mutate(o) { o.x = 1; }
function reassign(o) { o = { x: 2 }; }
const a = {};
mutate(a); reassign(a);
console.log(a);                         // { x: 1 }
console.log({} === {}, 'a' === 'a');    // false true
```

### Q: What's the difference between `==` and `===`? Explain type coercion. [Core] [Easy]

`===` (strict equality) compares without converting types. `==` (loose equality) first **coerces** both sides to a common type using a set of rules:

- `null == undefined` is true, and neither equals anything else.
- A number compared with a string converts the string to a number.
- A boolean converts to a number first (`true` → 1), which causes surprises like `'1' == true` being true.
- An object compared with a primitive converts the object to a primitive (`valueOf`, then `toString`).
- `NaN` is not equal to anything, including itself.

Falsy values: `false`, `0`, `-0`, `0n`, `""`, `null`, `undefined`, `NaN`. Everything else is truthy, including `"0"`, `"false"`, `[]` and `{}`.

```js run
console.log(0 == '', 0 == '0', '' == '0');       // true true false: == isn't transitive
console.log(null == undefined, null == 0);       // true false
console.log([] == ![]);                           // true: ![] → false → 0, [] → "" → 0
console.log('5' - 2, '5' + 2, true + 1, [] + {});
console.log(NaN === NaN, Object.is(NaN, NaN), Object.is(0, -0));
```

> **Rule of thumb:** always use `===`. The one accepted exception is `x == null`, which checks for both `null` and `undefined`.

### Q: How do you reliably check types (array, NaN, plain object, null)? [Easy]

- Array: `Array.isArray(x)`.
- NaN: `Number.isNaN(x)` (the global `isNaN` coerces first, so `isNaN('abc')` is true).
- null: `x === null`; null or undefined: `x == null`.
- Integer: `Number.isInteger(x)`.
- Precise tag: `Object.prototype.toString.call(x)` gives `"[object Date]"`, `"[object RegExp]"` and so on.
- Plain object: `Object.prototype.toString.call(x) === '[object Object]'`, optionally also checking that its prototype is `Object.prototype` or `null`.

### Q: Why is `0.1 + 0.2 !== 0.3`, and how do you handle money? [Easy]

Numbers are 64-bit IEEE-754 floating point. 0.1 and 0.2 have no exact binary representation, so their sum is `0.30000000000000004`. Compare floats with a tolerance (`Math.abs(a - b) < Number.EPSILON`), and for money store integers in the smallest unit (paise or cents), use `BigInt` for very large integers, and format with `Intl.NumberFormat`. Integers are only exact up to `Number.MAX_SAFE_INTEGER` (2⁵³ − 1).

```js run
console.log(0.1 + 0.2, Math.abs(0.1 + 0.2 - 0.3) < Number.EPSILON);
console.log(Number.MAX_SAFE_INTEGER + 2, 9007199254740991n + 2n);
console.log(new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(1234567.5));
```

### Q: What's the difference between `||`, `??` and optional chaining `?.`? [Core] [Easy]

- `a || b` returns `b` when `a` is **falsy**, so it wrongly replaces valid values like `0`, `""` and `false`.
- `a ?? b` (nullish coalescing) returns `b` only when `a` is `null` or `undefined`.
- `a?.b` returns `undefined` instead of throwing when `a` is `null` or `undefined`. It also works for calls (`fn?.()`) and indexes (`arr?.[0]`), and it short-circuits the rest of the chain.

```js run
const settings = { volume: 0, theme: '', user: null };
console.log(settings.volume || 50, settings.volume ?? 50);   // 50 vs 0
console.log(settings.theme || 'dark', settings.theme ?? 'dark');
console.log(settings.user?.profile?.name, settings.onSave?.());
```

## Copying, collections & iteration

### Q: Shallow copy vs deep copy: which methods do which? [Core] [Easy]

A **shallow copy** duplicates the top level only; nested objects are still shared. Spread (`{...obj}`, `[...arr]`), `Object.assign`, `Array.from` and `slice` are all shallow.

For a **deep copy**:
- `structuredClone(obj)` (built in, in modern browsers and Node 17+) handles nested objects, arrays, Dates, Maps, Sets, typed arrays and circular references. It throws on functions, DOM nodes and class instances with methods (they become plain objects).
- `JSON.parse(JSON.stringify(obj))` is lossy: it drops `undefined` and functions, turns Dates into strings, Maps and Sets into `{}`, `NaN`/`Infinity` into `null`, and throws on cycles.
- A hand-written recursive clone is a classic interview task; see [deep clone](#/js-coding).

```js run
const orig = { a: 1, nested: { b: 2 }, when: new Date(0) };
const shallow = { ...orig };
shallow.nested.b = 99;
console.log(orig.nested.b);                         // 99: shared
const deep = structuredClone(orig);
deep.nested.b = 1;
console.log(orig.nested.b, deep.when instanceof Date);
console.log(JSON.parse(JSON.stringify(orig)).when);  // a string now
```

### Q: `Map` vs plain object, `Set` vs array, and when to use `WeakMap`? [Medium]

Use a **`Map`** when keys are not strings (objects or numbers as real keys), when you add and remove keys often, when you need guaranteed insertion order and `.size`, or when keys come from users (no prototype keys like `__proto__` or `constructor` to collide with). Use a **plain object** for fixed-shape records and JSON.

Use a **`Set`** for unique values with O(1) `has` (de-duplicating: `[...new Set(arr)]`).

**`WeakMap` / `WeakSet`** hold their keys **weakly**: if nothing else references a key object, it can be garbage-collected along with its entry. They aren't iterable and have no size. Typical uses: attaching metadata or caches to DOM nodes or objects you don't own without causing leaks, and private data per instance.

```js run
const visits = new Map();
const objKey = { id: 1 };
visits.set(objKey, 3).set('home', 10);
console.log(visits.get(objKey), visits.size, [...visits.keys()]);
console.log([...new Set([3, 1, 3, 2, 1])]);
const meta = new WeakMap();
(function () { const el = { tag: 'div' }; meta.set(el, { clicks: 0 }); })();
// once `el` is unreachable, its WeakMap entry can be collected automatically
```

### Q: `for...in` vs `for...of` vs `forEach`? What makes something iterable? [Easy]

- `for...in` iterates **enumerable string keys**, including inherited ones. Use it for objects (with `hasOwnProperty` or `Object.keys`), never for arrays.
- `for...of` iterates the **values** of any **iterable**: arrays, strings, Maps, Sets, NodeLists, generators. It supports `break`, `continue` and `await` (`for await...of`).
- `forEach` is an array method. You can't `break` out of it, and it ignores the promises returned by async callbacks.

An object is **iterable** if it has a `[Symbol.iterator]` method that returns an iterator: an object with `next()` returning `{ value, done }`.

```js run
const range = {
  from: 1, to: 4,
  [Symbol.iterator]() {
    let cur = this.from, last = this.to;
    return { next: () => (cur <= last ? { value: cur++, done: false } : { value: undefined, done: true }) };
  },
};
console.log([...range]);
for (const n of range) { if (n === 3) break; console.log(n); }
```

### Q: What are generators and where are they useful? [Medium]

A generator function (`function*`) returns an iterator. Each `yield` pauses the function and hands out a value; calling `next(x)` resumes it, and `x` becomes the result of the `yield`. They're useful for lazy or infinite sequences, custom iterables, and step-by-step processes. Redux-Saga is built on them, and async/await was originally modelled as generators plus promises.

```js run
function* ids(prefix) { let n = 1; while (true) yield `${prefix}-${n++}`; }
const gen = ids('user');
console.log(gen.next().value, gen.next().value);

function* take(iter, k) { for (const x of iter) { if (k-- <= 0) return; yield x; } }
console.log([...take(ids('order'), 3)]);
```

### Q: Which array methods mutate the array, and which return new arrays? [Core] [Easy]

**Mutating:** `push`, `pop`, `shift`, `unshift`, `splice`, `sort`, `reverse`, `fill`, `copyWithin`.
**Non-mutating:** `map`, `filter`, `reduce`, `slice`, `concat`, `flat`, `flatMap`, `find`, `some`, `every`, `includes`, plus the ES2023 copies `toSorted`, `toReversed`, `toSpliced` and `with`.

This matters in React: calling `state.sort()` mutates state in place, so React may not see a change. Use `[...state].sort()` or `state.toSorted()`.

```js run
const nums = [10, 1, 5, 100];
console.log(nums.toSorted(), nums);              // default sort compares as STRINGS
console.log([...nums].sort((a, b) => a - b));    // numeric sort needs a comparator
console.log(nums.with(0, 0), nums);
```

## Functions & functional programming

### Q: What are higher-order functions, currying and partial application? [Core] [Medium]

A **higher-order function** takes a function as an argument or returns one (`map`, `filter`, `setTimeout`, `debounce`, React HOCs).

**Currying** turns `f(a, b, c)` into `f(a)(b)(c)`: each call takes one argument and returns a function waiting for the next. **Partial application** fixes _some_ arguments and returns a function for the rest (`bind` does this). Both help build specialised functions from general ones, e.g. `const logError = log('error')`.

```js run
const curry = fn => function curried(...args) {
  return args.length >= fn.length ? fn.apply(this, args) : (...more) => curried.apply(this, [...args, ...more]);
};
const volume = curry((l, w, h) => l * w * h);
console.log(volume(2)(3)(4), volume(2, 3)(4), volume(2)(3, 4));

const withTax = (rate, amount) => amount * (1 + rate);
const withGst = withTax.bind(null, 0.18);        // partial application
console.log(withGst(100));
```

### Q: What is a pure function, and why does immutability matter in frontend code? [Core] [Easy]

A **pure function** returns the same output for the same input and has no side effects (no mutation of its inputs, network calls, DOM changes or randomness). Pure functions are easy to test, cache (memoise) and reason about.

**Immutability** (creating new objects instead of changing old ones) lets frameworks detect changes with a cheap reference check (`prev !== next`). React state, Redux reducers, `React.memo`, `useMemo` and selector memoisation all rely on it. Mutating state in place causes missed re-renders and confusing bugs.

```js run
const state = { user: { name: 'A', tags: ['x'] }, count: 1 };
const next = { ...state, user: { ...state.user, tags: [...state.user.tags, 'y'] } };
console.log(state.user.tags, next.user.tags, state.user === next.user, state.count === next.count);
```

### Q: Explain destructuring, default parameters, rest and spread. [Easy]

- **Destructuring** unpacks values: `const { a, b: renamed = 5, ...others } = obj; const [first, , third] = arr;`
- **Default parameters** apply only when the argument is `undefined` (not `null`), and are evaluated at call time.
- **Rest** (`...args`) collects the remaining items into an array or object.
- **Spread** (`...arr`) expands an iterable or object into another array, object or argument list.

```js run
function createUser({ name, role = 'viewer', ...rest } = {}) { return { name, role, rest }; }
console.log(createUser({ name: 'Isha', team: 'web' }));
console.log(createUser({ name: 'Om', role: null }));     // null is NOT replaced by the default
const [head, ...tail] = 'hello';
console.log(head, tail, Math.max(...[3, 9, 2]));
```

## Modules, memory & errors

### Q: ES modules vs CommonJS: what's the difference? [Core] [Medium]

| | ES modules (`import`/`export`) | CommonJS (`require`/`module.exports`) |
|---|---|---|
| Loading | Static structure, resolved before the code runs; can be async | Synchronous, at runtime |
| Bindings | Live, read-only bindings to exports | A copy of `module.exports` at require time |
| Tree shaking | Possible (structure is static) | Generally not |
| Top-level `await` | Supported | Not supported |
| `this` at top level | `undefined` | `module.exports` |
| Where | Browsers natively, modern Node, bundlers | Node (legacy default) |

Dynamic `import()` returns a promise and is how bundlers do **code splitting** (`React.lazy(() => import('./Page'))`).

### Q: What causes memory leaks in single-page apps, and how do you find them? [Senior] [Medium]

JavaScript is garbage-collected (mark-and-sweep): an object is freed once it is no longer **reachable** from the roots (globals, the current stack). Leaks happen when something keeps an unwanted reference alive:

- Event listeners, intervals, observers and subscriptions not removed on unmount (a missing `useEffect` cleanup).
- Detached DOM nodes still referenced from JavaScript (caches, closures, arrays of elements).
- Unbounded caches or maps keyed by objects (use `WeakMap`, or LRU eviction).
- Closures capturing large objects, e.g. a long-lived handler that captures a huge response.
- Accidental globals (sloppy mode).

**Finding them:** Chrome DevTools → Memory → take a heap snapshot, repeat the suspect action (open and close a modal 10 times), take another, and compare with the “Comparison” view; search for “Detached” nodes. The Performance monitor shows the JS heap and DOM node counts growing over time.

### Q: How does error handling work with `try/catch/finally`? [Easy]

`try/catch` catches **synchronous** errors thrown inside the `try` block, including those from an `await`ed promise inside an async function. It does **not** catch errors thrown later from callbacks (`setTimeout`, event handlers): handle those inside the callback, or globally with `window.onerror` and `unhandledrejection`.

`finally` always runs, and a `return` inside `finally` **overrides** any earlier return or throw. Create custom error classes by extending `Error`, and use `cause` to wrap lower-level errors.

```js run
class ApiError extends Error {
  constructor(status, message, options) { super(message, options); this.name = 'ApiError'; this.status = status; }
}
function f() { try { return 'try'; } finally { console.log('finally runs first'); } }
console.log(f());
try { throw new ApiError(404, 'User not found', { cause: new Error('db miss') }); }
catch (e) { console.log(e.name, e.status, e.message, '| cause:', e.cause.message, '| instanceof Error:', e instanceof Error); }
try { setTimeout(() => { /* an error thrown here is NOT caught by the outer try */ }, 0); } catch (e) {}
```

### Q: What is strict mode, and what does it change? [Easy]

`'use strict'` (automatic in ES modules and class bodies) turns silent mistakes into errors:

- Assigning to an undeclared variable throws instead of creating a global.
- `this` is `undefined` in plain function calls instead of the global object.
- Writing to read-only or non-extensible properties throws.
- Duplicate parameter names, `with` and octal literals are banned.
- `eval` gets its own scope.

### Q: What is the difference between a polyfill and a transpiler? [Easy]

A **transpiler** (Babel, TypeScript, SWC) rewrites **syntax** that old browsers can't parse (optional chaining, classes, JSX) into equivalent older syntax at build time. A **polyfill** adds missing **APIs** at runtime by implementing them in JavaScript (`Promise`, `Array.prototype.includes`, `structuredClone`). You usually need both: Babel's `preset-env` handles syntax, and `core-js` polyfills APIs, both targeted by a `browserslist` config.
</script>

<script type="text/x-prep" id="p-js-async" data-group="JavaScript" data-title="Async JavaScript & the event loop" data-short="Async & event loop" data-lede="The event loop, microtasks vs macrotasks, promises, async/await, cancellation and race conditions: the second half of every JavaScript round.">
## The event loop

### Q: Explain the JavaScript event loop. [Core] [Medium]

JavaScript runs your code on **one thread with one call stack**. Long-running work (timers, network, I/O, user events) is handled by the browser (Web APIs). When that work finishes, its callback is put in a queue, and the **event loop** decides when it runs:

1. Run the current **task** (a script, an event handler, a timer callback) until the call stack is empty.
2. Run **all microtasks**: promise reactions (`.then`/`catch`/`finally`, the continuation after `await`), `queueMicrotask` and `MutationObserver` callbacks. Microtasks queued by microtasks also run now, before anything else.
3. If it's time to paint (about every 16.7 ms at 60 Hz): run `requestAnimationFrame` callbacks, then style, layout and paint.
4. Take the next **task** (macrotask): `setTimeout`/`setInterval` callbacks, I/O, `postMessage`, user input events. Repeat.

```js run
console.log('1: sync');
setTimeout(() => console.log('5: timeout (task)'), 0);
Promise.resolve().then(() => console.log('3: microtask'));
queueMicrotask(() => console.log('4: microtask 2'));
console.log('2: sync');
```

> **Interview tip:** draw it: call stack, Web APIs, the microtask queue and the task queue. Then walk through a snippet line by line, saying which queue each callback goes into.

### Q: What is the difference between microtasks and macrotasks? [Core] [Medium]

| | Microtasks | Macrotasks (tasks) |
|---|---|---|
| Sources | Promise callbacks, `await` continuations, `queueMicrotask`, `MutationObserver` | `setTimeout`, `setInterval`, I/O, UI events, `MessageChannel`, `postMessage` |
| When they run | Right after the current task, **all of them**, before rendering | One per loop iteration, after microtasks and a possible render |
| Danger | An endless microtask chain blocks rendering forever (the page freezes) | Long tasks (over 50 ms) delay input handling and hurt INP |

```js run
setTimeout(() => console.log('timeout'), 0);
let n = 0;
function spin() { if (n++ < 3) { console.log('microtask', n); queueMicrotask(spin); } }
queueMicrotask(spin);   // all chained microtasks run before the timeout
```

### Q: Does `setTimeout(fn, 0)` run immediately? [Easy]

No. It schedules a **task** to run after **at least** 0 ms, once the current script and all microtasks have finished. Browsers also clamp nested timers (nesting depth of 5 or more) to at least 4 ms, and throttle timers in background tabs heavily (to 1 second or more). Use it to yield back to the event loop; for visual updates use `requestAnimationFrame`, and for breaking up long work prefer `scheduler.yield()` / `scheduler.postTask()` where available.

## Promises

### Q: What is a Promise? Explain its states and chaining. [Core] [Easy]

A promise is an object representing a value that will be available later. Its state is **pending**, then settles **once** to either **fulfilled** (with a value) or **rejected** (with a reason), and never changes again.

- `.then(onFulfilled, onRejected)` always returns a **new promise**, resolved with whatever the handler returns. Returning a promise makes the chain wait for it ("flattening").
- Throwing inside a handler rejects the next promise in the chain.
- `.catch(fn)` is `.then(undefined, fn)`; it handles rejections from **any earlier step**.
- `.finally(fn)` runs on either outcome and passes the original value or error through.
- Handlers always run **asynchronously** (as microtasks), even for already-settled promises.

```js run
const wait = (ms, v) => new Promise(res => setTimeout(() => res(v), ms));
wait(50, 2)
  .then(x => x * 10)                         // 20
  .then(x => wait(50, x + 1))                // the chain waits for this promise: 21
  .then(x => { if (x > 20) throw new Error('too big: ' + x); return x; })
  .then(() => console.log('skipped'))        // skipped: the chain is rejected
  .catch(e => { console.log('caught', e.message); return 'recovered'; })
  .finally(() => console.log('cleanup'))
  .then(v => console.log('final value:', v));
```

### Q: Compare `Promise.all`, `allSettled`, `race` and `any`. [Core] [Easy]

| Method | Resolves when | Rejects when | Use it for |
|---|---|---|---|
| `Promise.all` | **All** fulfil → array of values in input order | **Any** rejects (fail fast) | Parallel requests that all must succeed |
| `Promise.allSettled` | All settle → array of `{status, value \| reason}` | Never | Dashboards: show what loaded and what failed |
| `Promise.race` | The **first to settle** fulfils | The first to settle rejects | Timeouts |
| `Promise.any` | The **first to fulfil** | **All** reject → `AggregateError` | Fastest mirror or CDN, fallbacks |

```js run
const ok = (ms, v) => new Promise(r => setTimeout(() => r(v), ms));
const fail = (ms, e) => new Promise((_, j) => setTimeout(() => j(new Error(e)), ms));
(async () => {
  console.log('all:', await Promise.all([ok(30, 'a'), ok(10, 'b')]));
  console.log('allSettled:', (await Promise.allSettled([ok(10, 'a'), fail(5, 'x')])).map(r => r.status));
  console.log('race:', await Promise.race([ok(30, 'slow'), ok(10, 'fast')]));
  console.log('any:', await Promise.any([fail(5, 'x'), ok(20, 'first success')]));
  try { await Promise.all([ok(30, 'a'), fail(10, 'boom')]); } catch (e) { console.log('all rejected:', e.message); }
})();
```

The [polyfills page](#/js-coding) shows how to implement each of these.

### Q: What is the Promise constructor anti-pattern? [Medium]

Wrapping something that already returns a promise in `new Promise(...)`:

```js
// ❌ anti-pattern: redundant, and easy to forget reject (errors get swallowed)
function getUser(id) {
  return new Promise((resolve, reject) => {
    fetch('/api/users/' + id).then(r => r.json()).then(resolve).catch(reject);
  });
}
// ✅ just return the chain
const getUser2 = id => fetch('/api/users/' + id).then(r => r.json());
```

Only use `new Promise` to **promisify callback APIs** (`setTimeout`, `FileReader`, `image.onload`, Node-style callbacks).

## async / await

### Q: How does async/await work, and how do you handle errors with it? [Core] [Easy]

An `async` function always returns a promise. `await x` pauses **only that function**: the rest of the function is scheduled as a microtask once `x` settles, and the caller continues running in the meantime. A rejected promise makes `await` **throw**, so you handle errors with ordinary `try/catch`.

```js run
const fetchUser = id => new Promise((res, rej) => setTimeout(() => id > 0 ? res({ id, name: 'User ' + id }) : rej(new Error('invalid id')), 20));

async function load(id) {
  try {
    const user = await fetchUser(id);
    return user.name;
  } catch (e) {
    return 'fallback (' + e.message + ')';
  } finally {
    console.log('done loading', id);
  }
}
load(1).then(console.log);
load(-1).then(console.log);
console.log('this line runs before either user loads');
```

### Q: Sequential vs parallel awaits: what's the difference, and when does each make sense? [Core] [Medium]

`await`ing inside a loop runs requests **one after another**; total time is the sum. If the requests are independent, start them all first and await them together with `Promise.all`; total time is the slowest one. Use sequential only when each step needs the previous result, or to avoid overloading a server (or use a concurrency limit; see the [promise pool](#/js-coding)).

```js run
const job = (ms) => new Promise(r => setTimeout(() => r(ms), ms));
(async () => {
  let t = Date.now();
  for (const ms of [100, 100, 100]) await job(ms);              // sequential: ~300ms
  const sequential = Date.now() - t;
  t = Date.now();
  await Promise.all([100, 100, 100].map(job));                   // parallel: ~100ms
  const parallel = Date.now() - t;
  console.log(`sequential ${sequential}ms, parallel ${parallel}ms → about ${Math.round(sequential / parallel)}× faster`);
})();
```

> **Pitfall:** `array.forEach(async item => await save(item))` does **not** wait. `forEach` ignores the returned promises. Use `for...of` (sequential) or `await Promise.all(array.map(...))` (parallel).

### Q: What happens when you forget `await`, or when a rejection is never handled? [Medium]

Without `await` you get the **promise** instead of its value (`if (isValid())` is always true, because a promise is truthy), and any error it throws escapes your `try/catch`. A rejected promise with no handler fires the `unhandledrejection` event; browsers log "Uncaught (in promise)" and Node may crash the process. Fixes: lint with `@typescript-eslint/no-floating-promises`, always return or await promises, add a global `unhandledrejection` handler that reports to your error tracker, and intentionally mark fire-and-forget calls (`void track(event)` with its own `.catch`).

### Q: What are async iterators and `for await...of`? [Medium]

An async iterable has a `[Symbol.asyncIterator]` method whose `next()` returns a promise of `{ value, done }`. `for await...of` consumes it one item at a time. This is useful for paginated APIs, streams (`response.body` is async-iterable in modern runtimes) and server-sent events.

```js run
async function* paginate(totalPages) {
  for (let page = 1; page <= totalPages; page++) {
    await new Promise(r => setTimeout(r, 20));        // pretend network
    yield { page, items: [page * 10, page * 10 + 1] };
  }
}
(async () => {
  for await (const { page, items } of paginate(3)) console.log('page', page, items);
})();
```

## Cancellation, races & long work

### Q: How do you cancel a fetch request? [Core] [Medium]

Use an `AbortController`. Pass `controller.signal` to `fetch`, and call `controller.abort()` to cancel. The fetch promise rejects with a `DOMException` named `AbortError`; handle it separately from real errors. In React, abort in the effect's cleanup so that unmounting or changing inputs cancels the stale request. `AbortSignal.timeout(ms)` creates a signal that aborts on its own, and `AbortSignal.any([...])` combines signals.

```js
function search(query, signal) {
  return fetch('/api/search?q=' + encodeURIComponent(query), { signal }).then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);   // fetch only rejects on network errors
    return r.json();
  });
}

let controller;
async function onInput(query) {
  controller?.abort();                 // cancel the previous request
  controller = new AbortController();
  try {
    const results = await search(query, controller.signal);
    render(results);
  } catch (e) {
    if (e.name !== 'AbortError') showError(e);   // aborting isn't an error for the user
  }
}
```

### Q: What race conditions happen in UIs, and how do you prevent them? [Core] [Medium]

The classic one: the user types "re" then "rea". The request for "re" is slower and arrives **last**, overwriting the newer results. Other examples: switching tabs or routes quickly, double-submitting forms, and an effect that sets state after the component has unmounted.

Fixes:
- **Cancel** stale requests with `AbortController` (best: it also saves bandwidth).
- **Ignore** stale responses: compare a request id or the latest query before applying the result (in React, an `ignore` flag set in the effect cleanup).
- **Debounce** input so fewer requests are made at all.
- **Disable** submit buttons while pending, and use idempotency keys on the server for payments.
- Use a data library (React Query, SWR, RTK Query) that keys requests by input and handles this for you.

```js run
// "latest wins" without AbortController: drop responses that are no longer current
function latestOnly(asyncFn) {
  let latest = 0;
  return async (...args) => {
    const id = ++latest;
    const result = await asyncFn(...args);
    if (id !== latest) throw Object.assign(new Error('stale'), { name: 'StaleError' });
    return result;
  };
}
const fakeSearch = q => new Promise(r => setTimeout(() => r('results for ' + q), q === 're' ? 80 : 20));
const search = latestOnly(fakeSearch);
search('re').then(console.log, e => console.log('ignored', e.name));
search('rea').then(console.log, e => console.log('ignored', e.name));
```

### Q: How do you keep the UI responsive during heavy JavaScript work? [Senior] [Medium]

Any task over **50 ms** is a "long task": it blocks input, hurts INP and makes the page feel janky. Options:

1. **Do less**: memoise, virtualise long lists, avoid repeated layout reads.
2. **Chunk and yield**: split the work into small pieces and yield between them (`await scheduler.yield()` where supported, otherwise `await new Promise(r => setTimeout(r, 0))`), so input events can run in between.
3. **Move it off the main thread** with a **Web Worker** (parsing big JSON or CSV, image processing, search indexing, crypto). Communicate with `postMessage`; transfer `ArrayBuffer`s instead of copying them.
4. **Defer it** with `requestIdleCallback` for non-urgent work (analytics, prefetching).
5. In React, mark non-urgent updates with `useTransition` / `useDeferredValue` so typing stays responsive.

```js run
async function processInChunks(items, work, chunkMs = 8) {
  let i = 0, start = performance.now(), chunks = 1;
  while (i < items.length) {
    work(items[i++]);
    if (performance.now() - start > chunkMs) {           // budget used up: yield
      await new Promise(r => setTimeout(r, 0));
      start = performance.now(); chunks++;
    }
  }
  return chunks;
}
let sum = 0;
processInChunks(Array.from({ length: 300000 }, (_, i) => i), x => { sum += Math.sqrt(x); })
  .then(chunks => console.log('done in', chunks > 1 ? 'several' : 'one', 'chunk(s); sum ≈', Math.round(sum)));
```

### Q: What's the difference between `requestAnimationFrame`, `setTimeout` and `requestIdleCallback`? [Medium]

- `requestAnimationFrame(cb)` runs `cb` **right before the next paint**, in sync with the display refresh rate, and is paused in background tabs. Use it for animations and for batching DOM writes.
- `setTimeout(cb, ms)` runs after at least `ms` as a regular task; it isn't aligned with frames, so animations built on it stutter.
- `requestIdleCallback(cb)` runs when the browser is idle (after a frame, with `deadline.timeRemaining()`). Use it for low-priority work. It isn't supported in Safari, so feature-detect and fall back to `setTimeout`.

### Q: How do Web Workers work, and what can't they do? [Medium]

A Web Worker runs a script on a **separate thread** with its own event loop and global scope (`self`). You communicate by `postMessage`; data is copied with the structured clone algorithm, or **transferred** (zero-copy) for `ArrayBuffer`s and `OffscreenCanvas`. Workers **can't touch the DOM** or `window`, but they do have `fetch`, timers, IndexedDB and WebSockets.

```js
// main.js
const worker = new Worker(new URL('./parser.worker.js', import.meta.url), { type: 'module' });
worker.postMessage(hugeCsvText);
worker.onmessage = e => renderTable(e.data);

// parser.worker.js
self.onmessage = e => {
  const rows = e.data.split('\n').map(line => line.split(','));   // heavy work off the main thread
  self.postMessage(rows);
};
```

Types: **dedicated** workers (one page), **shared** workers (shared across tabs of the same origin) and **service workers** (a network proxy for offline and push; see [Browser](#/browser)).
</script>

<script type="text/x-prep" id="p-js-output" data-group="JavaScript" data-title="Predict the output" data-short="Output puzzles" data-lede="The “what does this print?” questions that interviewers love. Write your answer down first, then open the card and press Run to check.">
## Event loop ordering

### Q: Sync code, timeouts and promises [Output] [Core]

```js run
console.log('A');
setTimeout(() => console.log('B'), 0);
Promise.resolve().then(() => console.log('C'));
console.log('D');
```

**Output:**

```text
A
D
C
B
```

Synchronous code runs first (A, D). Then the microtask queue is drained (C), and only then does the next task, the timeout, run (B).

### Q: Promise executor runs synchronously [Output] [Core]

```js run
console.log(1);
const p = new Promise(resolve => {
  console.log(2);
  resolve(3);
  console.log(4);
});
p.then(v => console.log(v));
console.log(5);
```

**Output:**

```text
1
2
4
5
3
```

The function passed to `new Promise` (the executor) runs **immediately and synchronously**. Calling `resolve` doesn't stop it, so 4 still prints. The `.then` callback is a microtask and runs after the synchronous code.

### Q: async/await ordering [Output] [Core]

```js run
async function first() {
  console.log('first start');
  await second();
  console.log('first end');
}
async function second() { console.log('second'); }

console.log('script start');
setTimeout(() => console.log('timeout'), 0);
first();
Promise.resolve().then(() => console.log('promise'));
console.log('script end');
```

**Output:**

```text
script start
first start
second
script end
first end
promise
timeout
```

`first()` runs synchronously up to the first `await`, and `second()` itself runs synchronously too. Everything after `await` becomes a microtask, queued **before** the `promise` microtask because `first()` was called first. The timeout is a task, so it runs last.

### Q: Nested microtasks and timeouts [Output] [Medium]

```js run
setTimeout(() => {
  console.log('t1');
  Promise.resolve().then(() => console.log('p-in-t1'));
}, 0);
setTimeout(() => console.log('t2'), 0);
Promise.resolve().then(() => {
  console.log('p1');
  setTimeout(() => console.log('t-in-p1'), 0);
});
```

**Output:**

```text
p1
t1
p-in-t1
t2
t-in-p1
```

After each task the microtask queue is fully drained, so `p-in-t1` runs before `t2`. The timeout scheduled inside `p1` joins the back of the task queue, behind t1 and t2.

### Q: Chained `.then` callbacks interleave [Output] [Medium]

```js run
Promise.resolve()
  .then(() => console.log('a1'))
  .then(() => console.log('a2'))
  .then(() => console.log('a3'));
Promise.resolve()
  .then(() => console.log('b1'))
  .then(() => console.log('b2'));
```

**Output:**

```text
a1
b1
a2
b2
a3
```

Each `.then` only queues its callback once the previous promise in **its own** chain settles, so the two chains take turns, one microtask at a time.

### Q: What does `finally` pass through? [Output] [Medium]

```js run
Promise.resolve(1)
  .finally(() => 2)
  .then(v => console.log('then:', v));
Promise.reject(new Error('x'))
  .finally(() => console.log('finally runs'))
  .catch(e => console.log('catch:', e.message));
```

**Output:**

```text
finally runs
then: 1
catch: x
```

`finally` ignores its callback's return value and passes the original value or error through. (It only changes the outcome if its callback throws or returns a rejected promise.) Both `finally` callbacks run in the first round of microtasks, and only the second one logs. Passing the value or error through takes a few more microtask hops, so `then: 1` and `catch: x` come after, in the order the chains were created.

## Scope, hoisting & closures

### Q: Hoisting with var and function declarations [Output] [Core]

```js run
console.log(typeof foo);
console.log(bar);
var bar = 'bar';
function foo() { return 'foo'; }
var foo = 'overwritten';
console.log(typeof foo);
```

**Output:**

```text
function
undefined
string
```

Function declarations are hoisted with their bodies, and a `var` with the same name doesn't override them during hoisting. At runtime the assignment `foo = 'overwritten'` replaces the function, so the last line prints `string`.

### Q: Variable shadowing inside a function [Output] [Medium]

```js run
var x = 1;
function test() {
  console.log(x);
  var x = 2;
  console.log(x);
}
test();
console.log(x);
```

**Output:**

```text
undefined
2
1
```

The inner `var x` is hoisted to the top of `test`, shadowing the global `x`. So the first log reads the local, not-yet-assigned `x`.

### Q: let in a block and the TDZ [Output] [Medium]

```js run
let a = 'outer';
{
  try {
    console.log(a);
  } catch (e) {
    console.log(e.name);
  }
  let a = 'inner';
  console.log(a);
}
```

**Output:**

```text
ReferenceError
inner
```

The inner `let a` is hoisted to the top of the block, so it shadows the outer `a` for the whole block. Before its declaration line runs it is in the temporal dead zone, and reading it throws.

### Q: Closures capture variables, not values [Output] [Medium]

```js run
function makeFns() {
  const fns = [];
  for (var i = 0; i < 3; i++) fns.push(() => i);
  return fns;
}
console.log(makeFns().map(f => f()));

let count = 0;
const read = () => count;
count = 10;
console.log(read());
```

**Output:**

```text
[3, 3, 3]
10
```

All three arrows share the single function-scoped `i`, which is 3 when they are called. Closures read the **current** value of a variable when called, which is why `read()` sees 10.

## this & objects

### Q: Method extraction and arrow functions [Output] [Core]

```js run
'use strict';
const obj = {
  name: 'obj',
  regular() { return this ? this.name : 'no this'; },
  arrow: () => 'arrow sees: ' + typeof this,
  nested() {
    const inner = () => this.name;
    function plain() { return this ? this.name : 'no this'; }
    return [inner(), plain()];
  },
};
const fn = obj.regular;
console.log(obj.regular());
console.log(fn());
console.log(obj.nested());
```

**Output:**

```text
obj
no this
["obj", "no this"]
```

`fn()` is a plain call, so in strict mode `this` is `undefined`. Inside `nested`, the arrow takes `nested`'s `this` (obj), while the plain function call gets `undefined`.

### Q: Objects as keys [Output] [Medium]

```js run
const a = {};
const b = { key: 'b' };
const c = { key: 'c' };
a[b] = 123;
a[c] = 456;
console.log(a[b]);
console.log(Object.keys(a));
```

**Output:**

```text
456
["[object Object]"]
```

Plain-object keys are always strings (or symbols). Both `b` and `c` are converted to the string `"[object Object]"`, so the second assignment overwrites the first. Use a `Map` for object keys.

### Q: Reference equality and mutation [Output] [Easy]

```js run
const user = { name: 'A' };
const copy = user;
copy.name = 'B';
const clone = { ...user };
clone.name = 'C';
console.log(user.name, copy === user, clone === user);
console.log([1, 2] === [1, 2], JSON.stringify([1, 2]) === JSON.stringify([1, 2]));
```

**Output:**

```text
B true false
false true
```

## Types & coercion

### Q: Coercion classics [Output] [Core]

```js run
console.log(1 + '2', '3' - 1, '3' * '2');
console.log(true + true, [] + [], [1, 2] + [3]);
console.log(null + 1, undefined + 1);
console.log(typeof NaN, NaN === NaN);
```

**Output:**

```text
12 2 6
2  1,23
1 NaN
number false
```

With `+`, if either side is a string (or an object that converts to one) you get concatenation; the other arithmetic operators convert to numbers. `[] + []` is the empty string, and `[1,2] + [3]` is `"1,2" + "3"`. `null` becomes 0, `undefined` becomes NaN.

### Q: Loose equality traps [Output] [Medium]

```js run
console.log('' == 0, '0' == 0, '' == '0');
console.log(null == 0, null >= 0);
console.log([0] == false, [] == ![]);
```

**Output:**

```text
true true false
false true
true true
```

`null == 0` is false because `null` only loosely equals `undefined`, but the relational `>=` converts `null` to 0, so `null >= 0` is true. `[0]` becomes `"0"` and then 0; `false` becomes 0.

### Q: `typeof` quirks [Output] [Easy]

```js run
console.log(typeof null, typeof [], typeof function () {}, typeof class {});
console.log(typeof undeclaredVariable, typeof Symbol(), typeof 10n);
```

**Output:**

```text
object object function function
undefined symbol bigint
```

`typeof null === 'object'` is a historical bug kept for compatibility. `typeof` on an undeclared variable doesn't throw (except in the TDZ).

## Arrays & built-ins

### Q: Default sort and `map(parseInt)` [Output] [Core]

```js run
console.log([10, 9, 1, 100].sort());
console.log(['1', '2', '3'].map(parseInt));
```

**Output:**

```text
[1, 10, 100, 9]
[1, NaN, NaN]
```

`sort()` without a comparator compares values **as strings**. `map` passes `(value, index)`, so the calls are `parseInt('1', 0)` (radix 0 means auto, giving 1), `parseInt('2', 1)` (radix 1 is invalid, giving NaN) and `parseInt('3', 2)` ('3' isn't a binary digit, giving NaN).

### Q: Array length and holes [Output] [Medium]

```js run
const arr = [1, 2, 3];
arr[6] = 7;
console.log(arr.length);
console.log(arr.filter(() => true).length);
delete arr[0];
console.log(arr.length, arr[0]);
arr.length = 2;
console.log(arr);
```

**Output:**

```text
7
4
7 undefined
[<empty>, 2]
```

Assigning past the end creates **holes** (empty slots). `filter`, `map` and `forEach` skip holes. `delete` leaves a hole and doesn't change the length. Setting `length` truncates the array. (Node prints the hole as `<1 empty item>`.)

### Q: Spread, Set and string tricks [Output] [Easy]

```js run
console.log([...'hello'].length, [...new Set('hello')].join(''));
console.log(Math.max(), Math.min());
console.log([1, 2, 3].includes(NaN), [NaN].includes(NaN), [NaN].indexOf(NaN));
```

**Output:**

```text
5 helo
-Infinity Infinity
false true -1
```

`includes` uses SameValueZero (so it finds NaN), while `indexOf` uses `===` (so it never does).

### Q: Function arity and default parameters [Output] [Medium]

```js run
function f(a, b = 2, c) {}
console.log(f.length);
console.log(((...args) => {}).length);
function g(x = y, y = 1) { return x; }
try { g(); } catch (e) { console.log(e.name); }
console.log(g(5));
```

**Output:**

```text
1
0
ReferenceError
5
```

`length` counts only the parameters **before** the first one with a default (or a rest parameter). Default parameters are evaluated left to right and have their own TDZ, so `x = y` fails because `y` isn't initialised yet.
