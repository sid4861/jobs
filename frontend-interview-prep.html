<script type="text/x-learn" data-for="a11y" data-mins="9">
## Why accessibility, and what WCAG asks for

Around one in six people lives with a disability, and everyone has temporary or situational limits: a broken arm, bright sunlight, a noisy train, an old phone. Accessible products reach more users, rank better, are often legally required (ADA, the European Accessibility Act, India's RPwD Act and GIGW guidelines), and are usually **better engineered**, because semantic, keyboard-friendly UIs are simpler UIs.

**WCAG 2.2** organises its success criteria under four principles, **POUR**:

| Principle | Meaning | Examples |
|---|---|---|
| **Perceivable** | users can sense the content | alt text, captions, colour contrast, text that resizes |
| **Operable** | users can work the controls | everything works by keyboard, visible focus, no keyboard traps, enough time, nothing that flashes |
| **Understandable** | users can understand it | labels, clear errors, consistent navigation, the page language set |
| **Robust** | it works with assistive technology | valid semantics, correct name/role/value for every control |

Most companies target **level AA**.

## How assistive technology sees your page

Screen readers don't read pixels. They read the **accessibility tree**, which the browser builds from your DOM. Every meaningful node gets a **role** (button, link, heading, textbox), an **accessible name** (from its text, a `<label>`, `alt`, `aria-label` or `aria-labelledby`), a **state** (checked, expanded, disabled) and a **description**.

:::viz a11ytree

> **Key idea:** The **first rule of ARIA** is don't use ARIA if a native HTML element can do the job. `<button>` comes with focus, Enter and Space activation, a role and a disabled state for free. `<div role="button">` gets only the role. You still have to add `tabindex` and the key handlers yourself. "No ARIA is better than bad ARIA."

### Naming things

- **Images**: `alt` describes the image's *purpose*. Decorative images get `alt=""` so they're skipped. Icon-only buttons need a name: `<button aria-label="Close">✕</button>`.
- **Form fields**: a visible `<label for>`. Placeholders aren't labels. Link errors to their field with `aria-describedby` and mark the field `aria-invalid="true"`.
- **`aria-labelledby`** points at visible text elsewhere (a dialog's title). **`aria-describedby`** adds extra help text that's read after the name.
- **Live regions**: `aria-live="polite"` (or `role="status"`) announces changes such as "Saved" or a search result count without moving focus. `assertive` (`role="alert"`) interrupts, so use it only for errors.

## Keyboard and focus

Everything you can do with a mouse must work with a keyboard: **Tab / Shift+Tab** move between controls, **Enter / Space** activate them, **arrow keys** move *within* composite widgets (tabs, menus, radio groups, grids), and **Esc** closes overlays.

- Keep the **DOM order matching the visual order**. CSS reordering (`order`, `flex-direction: row-reverse`, grid placement) doesn't change the tab order, which confuses keyboard users.
- `tabindex="0"` adds an element to the tab order, `tabindex="-1"` makes it focusable from code only, and **never use positive values**.
- **Always show focus**: style `:focus-visible` (a ring for keyboard users, but none on mouse click). Never write `outline: none` without a replacement.
- Add a **"Skip to main content"** link as the first focusable element.
- For composite widgets, use a **roving tabindex**: one item is `tabindex=0` and the rest are `-1`, and arrow keys move it along.

### Focus management

When the UI changes in a big way, **you** have to move focus, or keyboard and screen reader users get lost:

:::viz focustrap

- **Modal opens** → move focus into it, trap Tab inside, make the background inert, close on Esc, and **return focus to the button that opened it** when it closes. The native `<dialog>` with `showModal()` does almost all of this.
- **SPA route change** → move focus to the new page's `<h1>` (with `tabindex="-1"`) or a wrapper, and update `document.title`. Otherwise screen readers say nothing, because client-side navigation doesn't load a new page.
- **Item deleted** → move focus to a sensible neighbour, not to `<body>`.

## Colour, motion and content

:::viz contrast

- **Contrast**: 4.5:1 for normal text, 3:1 for large text, icons, borders of controls and focus indicators.
- **Don't use colour alone**: an error needs an icon or text too, and links in body text need an underline.
- **Motion**: respect `prefers-reduced-motion` (turn off parallax and large movement), never flash more than 3 times a second, and give a pause button for anything that moves automatically for more than 5 seconds.
- **Zoom and reflow**: the page must work at 200% zoom and 320 CSS px wide with no horizontal scrolling. Use `rem` units, and never set `maximum-scale=1`.
- **Touch targets**: at least 24×24 CSS px (WCAG 2.2), ideally 44×44.

## Testing accessibility

1. **Automated checks** (axe DevTools, Lighthouse, `eslint-plugin-jsx-a11y`, `jest-axe`/`@axe-core/playwright` in CI) catch about 30–40% of issues: missing alt text and labels, contrast, and invalid ARIA.
2. **Keyboard-only pass**: unplug the mouse. Can you reach and operate everything? Is focus always visible and in a logical order? Can you get out of every overlay?
3. **Screen reader pass**: VoiceOver (macOS/iOS), NVDA (Windows, free), TalkBack (Android). Navigate by headings and landmarks, and fill in a form.
4. **Zoom to 200%**, turn on reduced motion and Windows high contrast (forced colours).
5. **Test with disabled users** for anything critical.

> **Interview:** In machine-coding rounds, use semantic elements, label your inputs, make custom widgets keyboard-operable, and say so out loud. "I'm using a `button` here, so keyboard and screen readers work for free" is a cheap way to signal seniority.
</script>
<script type="text/x-learn" data-for="behavioral" data-mins="5">
## What these rounds decide

Behavioural and hiring-manager rounds often decide your **level** (SDE-2 vs senior vs staff) and sometimes the offer itself. Interviewers are looking for evidence of a few qualities, and they look for **specific stories** rather than general claims:

| They assess | Evidence they want |
|---|---|
| **Ownership** | You drove something end to end, beyond your ticket; you followed up after launch |
| **Impact** | Measurable results: performance numbers, revenue, conversion, incidents reduced, time saved |
| **Technical judgement** | Trade-offs you weighed, decisions you'd make differently now |
| **Collaboration** | Disagreeing well, working across teams (design, product, backend), mentoring |
| **Handling ambiguity and failure** | What you did when requirements were unclear or something broke, and what you learned |
| **Growth** | Feedback you acted on, skills you deliberately built |

## Structuring answers: STAR(L)

:::html
<figure class="fig"><svg viewBox="0 0 680 170" role="img" aria-label="STAR story structure with suggested proportions: Situation and Task short, Action the longest, Result with numbers, and Learning.">
<rect class="s-box" x="10" y="40" width="90" height="56" rx="10"/><text class="s-tb" x="55" y="66" text-anchor="middle">S</text><text class="s-ts" x="55" y="84" text-anchor="middle">Situation</text>
<rect class="s-box" x="104" y="40" width="80" height="56" rx="10"/><text class="s-tb" x="144" y="66" text-anchor="middle">T</text><text class="s-ts" x="144" y="84" text-anchor="middle">Task</text>
<rect class="s-acc" x="188" y="40" width="300" height="56" rx="10"/><text class="s-tb" x="338" y="66" text-anchor="middle">A: Action</text><text class="s-ts" x="338" y="84" text-anchor="middle">what YOU did, the decisions and why (~60%)</text>
<rect class="s-ok" x="492" y="40" width="110" height="56" rx="10"/><text class="s-tb" x="547" y="66" text-anchor="middle">R</text><text class="s-ts" x="547" y="84" text-anchor="middle">Result + numbers</text>
<rect class="s-spec" x="606" y="40" width="64" height="56" rx="10"/><text class="s-tb" x="638" y="66" text-anchor="middle">L</text><text class="s-ts" x="638" y="84" text-anchor="middle">Learning</text>
<text class="s-ts" x="97" y="118" text-anchor="middle">~15%: just enough context</text>
<text class="s-tl" x="10" y="150">Aim for about 2–3 minutes per story. Say "I", not "we", for your own contributions. End with a number and a lesson.</text>
</svg><figcaption>Most weak answers spend too long on the situation and too little on the decisions the candidate personally made.</figcaption></figure>
:::

- **Situation and Task** (about 20 seconds): the product, the team, the problem, what was at stake.
- **Action** (most of the time): the steps **you** took, the options you considered, why you chose one, how you brought others along, and what went wrong along the way.
- **Result**: quantified where possible ("LCP went from 4.1 s to 1.9 s on mobile, and checkout conversion rose 6%"), plus the qualitative effect (the team adopted the pattern).
- **Learning**: what you'd do differently. It shows self-awareness, and it's the line senior interviewers listen for.

> **Tip:** Interviewers follow up with "what would you do differently?", "what was the hardest part?" and "how did others react?" Prepare one layer deeper than the story itself.

## Building your story bank

Write **8–10 stories** and map each one to several themes, so a small set covers almost any question. Good frontend story types:

| Story | Covers |
|---|---|
| A performance win with numbers (LCP, INP, bundle size) | impact, technical depth, measuring before fixing |
| A large refactor or migration (JS → TS, CRA → Vite, class → hooks, a design system) | ownership, planning, incremental delivery, persuading others |
| A production incident you caused or handled | failure, calm under pressure, blameless post-mortem, prevention |
| A disagreement with a PM, designer or senior engineer | collaboration, influence, "disagree and commit" |
| An ambiguous project you shaped | ambiguity, product sense, scoping, trade-offs |
| Mentoring or raising the bar (reviews, docs, onboarding) | leadership without authority |
| A deadline you had to negotiate | prioritisation, communication, cutting scope well |
| An accessibility or quality improvement nobody asked for | ownership, user empathy |

## Common questions and what's behind them

- **"Tell me about yourself"**: a 90-second pitch: current role and scope, 2–3 highlights with numbers, your technical strengths, and why this role is the logical next step. It's not a reading of your CV.
- **"Walk me through your current project's architecture"**: draw it. Rendering strategy, state management, data fetching, the build and deploy pipeline, testing, monitoring. Then one decision you'd revisit. This is where depth gets probed.
- **"A time you disagreed"**: show that you sought to understand first, used data or a prototype, escalated respectfully if needed, and **committed fully** once a decision was made.
- **"A production issue"**: detect → mitigate (roll back first, investigate second) → communicate → root cause → **systemic fix** (tests, alerts, process). Own your part without blaming anyone.
- **"Why are you leaving? Why us?"**: positive and forward-looking: the scope, problems and learning you're looking for, tied to something specific about this company's product or engineering.

## Your questions for them

Always have 3–4 ready. They show judgement, and help you decide:

- "What does success look like in the first 6 months for this role?"
- "How do frontend architecture decisions get made here? Can you tell me about a recent one?"
- "How do you balance product delivery with tech debt and performance work?"
- "What's the on-call and release process for the frontend?"
- "What's the biggest challenge the team is facing right now?"

## Offers and logistics

- **Notice period** (common in India: 30–90 days): be honest; ask whether they buy out notice or offer a joining bonus.
- **Compensation**: research ranges first. Try to let them make the first number; talk about **total compensation** (base, bonus, stock and its vesting schedule, joining bonus). Negotiate politely, with competing offers or market data, and get everything in writing.
- **Your resume**: one or two pages; impact-first bullet points ("Cut bundle size 38% by splitting routes and replacing moment.js, improving mobile LCP by 1.2s"); the stack listed briefly; links to a GitHub or portfolio with real work.

> **In short:** prepare 8–10 STAR stories with numbers, mapped to themes; spend most of each answer on your own actions and decisions; end with a result and a lesson; and arrive with sharp questions of your own.

## From URL to pixels

"What happens when you type a URL and press Enter?" is the classic open-ended browser question. It has two halves: **networking** (getting the bytes) and **rendering** (turning bytes into pixels). A strong answer walks through both, then goes deep wherever the interviewer steers.

:::viz urlload

### The critical rendering path

Once HTML starts arriving, the browser builds two trees and combines them:

:::viz pipeline

> **Pitfall:** **Layout thrashing.** Code like `for (el of items) { el.style.width = box.offsetWidth + 'px' }` alternates a write with a read, which forces a synchronous layout on every iteration. Read everything first, then write everything, or do the writes inside `requestAnimationFrame`.

## The DOM and events

The DOM is a tree of nodes, and querying and changing it is a common source of slowness. Batch your writes: build in a `DocumentFragment` or set one `innerHTML`. Prefer `textContent` to `innerHTML` for text (it's faster and safe from XSS). Note that `getElementsBy*` return **live** collections that update automatically, while `querySelectorAll` returns a **static** snapshot.

### How an event travels

When you click an element, the event doesn't just fire on it. It travels the propagation path in three phases: **capture** (window → down to the target's parent), **target**, then **bubble** (back up to window). `addEventListener(type, fn, { capture: true })` listens during the way down; the default listens during the way up.

:::viz propagation

- `e.target` is the element that was actually clicked. `e.currentTarget` is the element whose listener is running now.
- `stopPropagation()` stops the event moving on to other elements. `preventDefault()` cancels the browser's default action (following a link, submitting a form). They're unrelated.
- **Event delegation**: put one listener on a common ancestor and use `e.target.closest(selector)` to find which item was hit. It needs less memory, and it works for elements added later. Some events don't bubble (`focus`, `blur`, `mouseenter`): use `focusin`/`focusout` instead.
- Use `{ passive: true }` on scroll and touch listeners so the browser doesn't wait for your handler before scrolling. `{ once: true }` removes the listener after it runs, and `{ signal }` lets you remove many listeners at once with an `AbortController`.

### Walking the tree

"Implement `getElementsByClassName`" and "find the matching node in an identical tree" are both **tree traversals**. Visit every node with recursion (depth-first) or a queue (breadth-first). For the matching-node question, record the path of child indices from the node up to the root, then follow that same path down the other tree.

:::viz domtraverse

## Storage and cookies

| | Cookies | localStorage | sessionStorage | IndexedDB |
|---|---|---|---|---|
| Size | ~4 KB each | ~5–10 MB per origin | ~5 MB | large (a share of the disk) |
| Sent to the server | **automatically, with every request** | no | no | no |
| Lifetime | `Expires`/`Max-Age`, or the session | until cleared | until the tab closes | until cleared |
| API | string header | sync, strings only | sync, strings only | async, structured data, indexes, transactions |
| Readable by JS | not if `HttpOnly` | yes | yes | yes |

Cookie attributes worth knowing: `HttpOnly` (JavaScript can't read it, so XSS can't steal it), `Secure` (HTTPS only), `SameSite=Lax|Strict|None` (whether it's sent on cross-site requests; it's the main CSRF defence), `Domain`/`Path` (scope), and `__Host-` prefixed names (locked to one host, which is the safest option).

> **Note:** localStorage is synchronous, so it blocks the main thread. Any script on the page can read it, which makes it a poor place for auth tokens. It's fine for preferences and drafts. Use IndexedDB (through a small wrapper like `idb-keyval`) for large or structured offline data.

## Origins, the same-origin policy and CORS

An **origin** is scheme + host + port: `https://app.com:443`. The **same-origin policy** means a page can freely *send* requests to other origins, but its JavaScript can't **read** their responses (or their DOM, if it's an iframe) unless that origin allows it. That's what stops evil.com from reading your bank account through your logged-in cookies.

**CORS** is how a server relaxes that rule for particular origins, using response headers. For "non-simple" requests, the browser first asks permission with a **preflight** `OPTIONS` request.

:::viz cors

> **Pitfall:** CORS errors are fixed on the **server** (or with a same-origin proxy or rewrite in your dev server or edge), never by changing frontend code. And CORS isn't a security feature *for the server*: the request still reaches it. Servers need their own authentication and CSRF protection.

## Caching and offline

The fastest request is the one you never make. The HTTP cache is controlled with response headers:

- `Cache-Control: max-age=N`: the response is **fresh** for N seconds, so it's reused with no request at all.
- `no-cache`: store it, but **revalidate** before every use (with ETag or Last-Modified → 304).
- `no-store`: never store it. Use for sensitive data.
- `public` / `private`: whether shared caches (CDNs) may store it.
- `stale-while-revalidate=N`: serve a stale copy straight away, and refresh it in the background.
- `immutable`: never revalidate. Use for fingerprinted assets.

:::viz cache

> **Rule of thumb:** **Hashed static assets** (`app.4f9c.js`): `max-age=31536000, immutable`. **HTML**: `no-cache`, so new deploys show up straight away and point at the new hashes. **APIs**: usually `no-store` or a short `max-age` plus `stale-while-revalidate`.

### Service workers

A **service worker** is a script that sits **between your page and the network**, as a programmable proxy. It runs on its own thread, has no DOM access, and only works over HTTPS. Its lifecycle is **install** (pre-cache the app shell) → **activate** (clean up old caches) → **fetch** (intercept requests). Common strategies: *cache-first* for static assets, *network-first* for HTML and APIs that must be fresh, and *stale-while-revalidate* for things that can be slightly out of date. It's what makes PWAs work offline, and it enables push notifications and background sync. Workbox wraps the patterns.

## Networking and APIs

- **HTTP/1.1** sends one request at a time per connection, so browsers open about 6 connections per host. **HTTP/2** multiplexes many streams over one connection and compresses headers, which makes domain sharding and sprite sheets unnecessary. **HTTP/3** runs over QUIC (UDP), so a lost packet stalls only its own stream, and handshakes are faster, especially on mobile.
- **`fetch` doesn't reject on HTTP errors.** A 404 or 500 still *resolves*, so check `res.ok`. It only rejects on network failures, CORS failures or an abort. Wrap fetch once in a helper that throws on `!res.ok`, parses JSON, adds auth and a timeout.
- **REST vs GraphQL**: REST is simple and cache-friendly (URLs as cache keys), but you end up with over- and under-fetching and many round trips. GraphQL gives the client exactly the shape it asks for in one request, but caching is harder (normalised client caches), and it needs cost and depth limits on the server.

### Getting live updates

:::viz realtime

| | Direction | Transport | Choose it for |
|---|---|---|---|
| Short polling | client asks | plain HTTP | low-frequency dashboards, simplicity |
| Long polling | client asks, server holds | HTTP | fallback when nothing else works |
| SSE | server → client | one HTTP stream, auto-reconnect | notifications, feeds, AI token streaming |
| WebSocket | both ways | upgraded TCP | chat, collaboration, games |

## Observers and other platform APIs

Instead of polling the DOM or listening to scroll events, ask the browser to tell you about changes:

- **IntersectionObserver**: an element entered or left the viewport. Use it for lazy loading, infinite scroll and viewability analytics.
- **ResizeObserver**: an element's size changed. Use it for responsive components and charts.
- **MutationObserver**: the DOM changed. Use it to integrate third-party widgets.
- **PerformanceObserver**: performance entries (LCP, long tasks, layout shifts), the basis of real-user monitoring.

Also worth knowing: the **History API** (`pushState`, `popstate`, the basis of client-side routing), **Web Components** (custom elements + shadow DOM for encapsulated, framework-agnostic widgets), **Web Workers** (threads for CPU-heavy work) and `BroadcastChannel` (messaging between tabs).

Frontend loops at larger companies usually include one or two problem-solving rounds. They're typically **easy to medium** in difficulty, often with a **UI or JavaScript flavour**: traversing a DOM-like tree, merging intervals for a calendar, ordering module dependencies, or building a cache. You'll be judged on a clear approach, correct JavaScript, and an honest complexity analysis.

### The approach that scores well

1. **Clarify** the input and output, the constraints (n up to how big?), and edge cases (empty input, duplicates, negatives, unicode).
2. **Brute force first, out loud**, with its complexity. It shows you can always produce *something*.
3. **Optimise** by spotting the pattern: "We keep looking things up, so use a hash map." "Contiguous range, so a sliding window." "Dependencies, so a topological sort."
4. **Code** cleanly with good names, then **dry-run** a small example by hand.
5. **Analyse** time and space complexity, and mention trade-offs.

## JavaScript-specific gotchas

| Trap | Why it bites | Do this instead |
|---|---|---|
| `arr.sort()` | sorts as **strings**: `[10, 9, 1]` → `[1, 10, 9]` | `arr.sort((a, b) => a - b)` |
| `{}` as a hash map | inherited keys (`'constructor'`), keys become strings, order rules | `new Map()` / `new Set()` |
| `Array(n).fill([])` | **one shared** inner array | `Array.from({ length: n }, () => [])` |
| `arr.shift()` in a BFS | O(n) per call, so the BFS becomes O(n²) | an index pointer: `for (let i = 0; i < q.length; i++)` |
| No built-in heap | priority queues need one | write a small binary heap (below) |
| `Number` limits | integers are only exact up to 2^53 − 1 | `BigInt` for big values, or a modulo |
| Deep recursion | stack limit around 10k frames | an explicit stack for deep trees or graphs |
| String building in a loop | usually fine in modern engines | `parts.push()` + `join()` for clarity |
| `[...str]` vs `str.split('')` | split breaks emoji into surrogate halves | spread / `Array.from` for code points |

## Trees and recursion in the frontend

The DOM, nested menus, file explorers, comment threads and JSON are all **trees**, so tree traversal is the most common frontend-flavoured DSA topic. Know both orders:

:::viz domtraverse

Recursion template: **base case**, then **combine the results from the children**. For "find a path to the node with id X", return the path from the recursive call and add the current node when the child found it. For very deep trees, use an explicit stack.

```js run
const menu = { id: 'root', children: [
  { id: 'file', children: [{ id: 'new', children: [] }, { id: 'open', children: [{ id: 'recent', children: [] }] }] },
  { id: 'edit', children: [{ id: 'undo', children: [] }] }] };
function pathTo(node, target) {
  if (node.id === target) return [node.id];
  for (const c of node.children) { const p = pathTo(c, target); if (p) return [node.id, ...p]; }
  return null;
}
const depth = n => 1 + Math.max(0, ...n.children.map(depth));
console.log(pathTo(menu, 'recent'), 'depth', depth(menu));
```

## Graphs: dependency ordering

"Load modules in dependency order", "order the build steps", "detect a circular import": these are **topological sorts**. Kahn's algorithm: count each node's in-degree, start with the nodes at zero, and keep removing them and lowering their neighbours' counts. If some nodes never reach zero, there's a **cycle**.

```js run
function topoSort(deps) {          // deps: { module: [modules it depends on] }
  const indeg = new Map(), out = new Map();
  for (const [m, ds] of Object.entries(deps)) {
    indeg.set(m, indeg.get(m) || 0);
    for (const d of ds) { indeg.set(m, (indeg.get(m) || 0) + 1); indeg.set(d, indeg.get(d) || 0); (out.get(d) || out.set(d, []).get(d)).push(m); }
  }
  const q = [...indeg].filter(([, n]) => n === 0).map(([m]) => m), order = [];
  for (let i = 0; i < q.length; i++) { const m = q[i]; order.push(m); for (const n of out.get(m) || []) if (indeg.set(n, indeg.get(n) - 1).get(n) === 0) q.push(n); }
  return order.length === indeg.size ? order : 'cycle detected';
}
console.log(topoSort({ app: ['router', 'store'], router: ['utils'], store: ['utils'], utils: [] }));
console.log(topoSort({ a: ['b'], b: ['a'] }));
```

## Heaps and priority queues

JavaScript has no built-in priority queue, so "top K", "merge K sorted lists", "schedule the next task" and Dijkstra all need you to write a **binary heap**: a complete tree stored in an array, where each parent ≤ its children. Push sifts up, pop moves the last element to the root and sifts down. Both are O(log n).

:::viz heap

> **Tip:** For "top K largest", keep a **min-heap of size K**: push each item, and pop when the size goes over K. That's O(n log K), better than sorting everything when K is small. In an interview, if time is short, say "I'd use a heap here", then sort and explain the trade-off.

## Patterns cheat sheet

| Signal in the problem | Pattern | Typical complexity |
|---|---|---|
| "have we seen it", counts, pairs that add up to a target | hash map / set | O(n) |
| contiguous subarray/substring with a condition | sliding window | O(n) |
| sorted input, pairs, palindromes | two pointers | O(n) |
| matching brackets, undo, "next greater element" | stack / monotonic stack | O(n) |
| overlapping ranges, calendars, bookings | sort by start + merge | O(n log n) |
| levels, shortest path in an unweighted grid | BFS | O(V + E) |
| all paths, connected regions, islands | DFS / union-find | O(V + E) |
| dependencies, ordering | topological sort | O(V + E) |
| top K, streaming median, scheduling | heap | O(n log k) |
| sorted data, or "smallest X that works" | binary search | O(log n) |

> **In short:** master hash maps, windows, two pointers and tree recursion first. Know JavaScript's traps (sort, shift, fill), write a heap from memory, and always talk through the brute force, the optimisation, the dry run and the complexity.

## What frontend system design is

In a frontend system design round you design a **product surface** (a news feed, a chat app, a video player, a design system) at the level of **architecture**: components, data flow, state, the API contract, performance, and failure modes. You rarely write real code. The interviewer is judging whether you can **lead the technical design of a feature** and explain the trade-offs.

How it differs from backend design: less about databases and sharding, more about **client architecture, rendering strategy, network efficiency, perceived performance, accessibility and the UX of failure**.

## A framework: RADIO

Structure your 45–60 minutes so you cover the breadth before diving deep:

:::html
<figure class="fig"><svg viewBox="0 0 680 190" role="img" aria-label="RADIO framework: Requirements, Architecture, Data model, Interface (API), Optimisations, with suggested time for each.">
<rect class="s-acc" x="10" y="30" width="124" height="96" rx="12"/><text class="s-tb" x="72" y="62" text-anchor="middle">R</text><text class="s-t" x="72" y="84" text-anchor="middle">Requirements</text><text class="s-ts" x="72" y="104" text-anchor="middle">~8 min</text>
<rect class="s-spec" x="144" y="30" width="124" height="96" rx="12"/><text class="s-tb" x="206" y="62" text-anchor="middle">A</text><text class="s-t" x="206" y="84" text-anchor="middle">Architecture</text><text class="s-ts" x="206" y="104" text-anchor="middle">~10 min</text>
<rect class="s-teal" x="278" y="30" width="124" height="96" rx="12"/><text class="s-tb" x="340" y="62" text-anchor="middle">D</text><text class="s-t" x="340" y="84" text-anchor="middle">Data model</text><text class="s-ts" x="340" y="104" text-anchor="middle">~7 min</text>
<rect class="s-cur" x="412" y="30" width="124" height="96" rx="12"/><text class="s-tb" x="474" y="62" text-anchor="middle">I</text><text class="s-t" x="474" y="84" text-anchor="middle">Interface (API)</text><text class="s-ts" x="474" y="104" text-anchor="middle">~7 min</text>
<rect class="s-ok" x="546" y="30" width="124" height="96" rx="12"/><text class="s-tb" x="608" y="62" text-anchor="middle">O</text><text class="s-t" x="608" y="84" text-anchor="middle">Optimisations</text><text class="s-ts" x="608" y="104" text-anchor="middle">~15+ min</text>
<text class="s-tl" x="340" y="160" text-anchor="middle">Spend the most time on O: that's where the seniority signal is. Keep R short but explicit.</text>
</svg><figcaption>Draw boxes as you go: the component tree, the client-side stores, and the server/API boundary.</figcaption></figure>
:::

1. **Requirements.** Functional: the 3–5 core user flows ("view feed, like, comment, infinite scroll, new posts appear"). Non-functional: target devices and networks, scale (items per page, users online), performance targets, offline, accessibility, internationalisation, SEO. Write down what's **out of scope**.
2. **Architecture.** The component tree and responsibilities, the rendering strategy (CSR, SSR or a mix), where state lives (server cache, client store, URL), and how data flows. Draw it.
3. **Data model.** The client-side entities and their normalised shape: `posts: {byId, allIds}`, `users: {byId}`, pagination cursors, and UI state (drafts, optimistic items).
4. **Interface.** The API between client and server: endpoints or GraphQL queries, request and response shapes, pagination style, the real-time transport, error formats.
5. **Optimisations.** Go deep on 3–4 areas that matter most for *this* product: performance, network, rendering, offline, accessibility, security, observability.

> **Interview:** Keep checking in: "I'd like to spend most of the time on the feed rendering and real-time updates. Does that match what you want to explore?" Interviewers often have a particular area they want to probe.

## Network patterns

### Pagination

Feeds and timelines change while the user scrolls. **Cursor pagination** is the right default. **Offset pagination** breaks when items are inserted or deleted.

:::viz pagination

### Live updates

Choose the transport by **direction and frequency**:

:::viz realtime

A typical chat design: a WebSocket for incoming messages and typing indicators; HTTP POST for sending (simpler retries and idempotency) or the socket with acks; reconnection with exponential backoff and jitter; a "resume from the last message id" sync on reconnect; and an outbox for messages composed offline.

### Fast, correct search

:::viz typeahead

## Rendering and performance at scale

- **Long lists**: virtualise them. Measure variable heights. Keep scroll position when items are added above (anchor to an item, not to a pixel offset).
- **Images and media**: responsive `srcset`, lazy loading below the fold, blur-up placeholders, aspect-ratio boxes (to prevent CLS), and adaptive bitrate streaming (HLS/DASH) for video.
- **Perceived performance**: skeletons instead of spinners, **optimistic updates** (show the like immediately, roll back on failure), and prefetching likely next steps (on hover, or when idle).
- **Bundle**: split by route, and lazy-load heavy widgets (editor, charts, emoji picker). Load third-party scripts last.

:::viz virtual

## Cross-cutting checklist

Run through this list in the optimisation phase, and pick what matters for the product in front of you:

| Area | Things to mention |
|---|---|
| Performance | Web Vitals targets, code splitting, virtualisation, image strategy, caching layers (HTTP, SW, in-memory) |
| Network | batching, de-duplication, retries with backoff, request cancellation, compression, HTTP/2 |
| State | server cache vs client store vs URL; normalisation; optimistic updates and reconciliation |
| Offline & resilience | service worker, IndexedDB queue, conflict resolution, "you're offline" UX, error boundaries |
| Accessibility | keyboard navigation, focus management, live regions for new content, reduced motion |
| Security | XSS in user content (sanitise), CSRF, auth token storage, CSP, rate-limit feedback |
| i18n | RTL, pluralisation, date/number formats, text expansion in layouts |
| Observability | RUM (Web Vitals), error tracking with source maps, logs, feature flags, A/B tests |
| Scale (teams) | design system, monorepo, module boundaries, micro-frontends only if teams truly need to deploy independently |

## Worked example: a news feed

- **Requirements**: an infinite feed of posts (text, images, video); like and comment; new posts while you're reading; it works on a mid-range Android on 4G.
- **Architecture**: SSR the first page for a fast LCP, then a client-side feed. `FeedList` (virtualised) → `PostCard` → `Media`, `Actions`, `Comments` (lazy). TanStack Query for the feed pages, and a normalised posts cache.
- **Data**: `GET /feed?cursor=…&limit=10` → `{ items: Post[], nextCursor }`. Post = `{id, author: {id, name, avatar}, text, media[], likeCount, likedByMe, createdAt}`.
- **Live**: SSE or a WebSocket pushes a `newPostsCount`, and a "5 new posts ↑" pill lets users load them **on their own terms**, without jumping the scroll position.
- **Optimisations**: an IntersectionObserver sentinel triggers the next page early (prefetch at about 70% scroll); optimistic likes with rollback; image `srcset` + lazy loading + aspect ratio; video autoplays muted only when 50% visible, and pauses when it leaves the screen; posts can be read offline from IndexedDB; `aria-live` announces new posts; profile and fix the INP of the like button.

> **In short:** clarify, then RADIO. Draw the component tree and data flow, define a normalised data model and a cursor-based API, pick the real-time transport by direction, then go deep on performance, resilience and accessibility for the specific product.

<script type="text/x-learn" data-for="html-css" data-mins="17">
## HTML: structure and meaning

HTML describes **what** content is, not how it looks. That meaning is used by browsers (built-in behaviour), assistive technology (the accessibility tree), search engines and your own CSS. Choosing the right element is the cheapest accessibility and SEO win there is.

:::html
<figure class="fig"><svg viewBox="0 0 680 250" role="img" aria-label="A semantic page layout: header, nav, main containing article and aside, and footer.">
<rect class="s-acc" x="10" y="10" width="660" height="44" rx="8"/><text class="s-t" x="24" y="37">&lt;header&gt;</text><text class="s-ts" x="120" y="37">logo, site title</text>
<rect class="s-spec" x="460" y="18" width="200" height="28" rx="6"/><text class="s-t" x="474" y="37">&lt;nav&gt; links</text>
<rect class="s-ok" x="10" y="64" width="470" height="140" rx="8"/><text class="s-t" x="24" y="88">&lt;main&gt;</text><text class="s-ts" x="90" y="88">one per page: the primary content</text>
<rect class="s-box" x="26" y="100" width="438" height="92" rx="8"/><text class="s-t" x="40" y="122">&lt;article&gt;</text><text class="s-ts" x="40" y="142">&lt;h1&gt; title, &lt;p&gt;, &lt;figure&gt;, &lt;time&gt;</text><text class="s-ts" x="40" y="162">self-contained: makes sense on its own</text>
<rect class="s-teal" x="490" y="64" width="180" height="140" rx="8"/><text class="s-t" x="504" y="88">&lt;aside&gt;</text><text class="s-ts" x="504" y="108">related, secondary</text>
<rect class="s-box2" x="10" y="214" width="660" height="30" rx="8"/><text class="s-t" x="24" y="234">&lt;footer&gt;</text>
</svg><figcaption>Landmark elements become regions that screen reader users can jump between. A page made only of &lt;div&gt;s has none.</figcaption></figure>
:::

What interviewers look for:

- **Landmarks and headings**: `header`, `nav`, `main`, `aside`, `footer`, and **one logical heading outline** (`h1` → `h2` → `h3`, no skipped levels for the sake of styling).
- **Interactive elements**: `<button>` for actions, `<a href>` for navigation. A clickable `div` needs a role, `tabindex`, and key handlers for Enter and Space just to catch up with what a button does for free.
- **Forms**: every input has a `<label for>`; use the right `type` (`email`, `tel`, `number`, `date`) so mobile shows the right keyboard and you get built-in validation; use `autocomplete` hints; group related controls with `fieldset`/`legend`.
- **The document head**: `<!DOCTYPE html>` (turns off quirks mode), `<meta charset="utf-8">`, the viewport meta tag, a `title`, a description, Open Graph tags, `link rel="preload"`/`preconnect`, and the icon.

### How scripts load

`<script>` tags change how the parser behaves, and that's a favourite question. In short: a plain script **blocks parsing**, `async` runs as soon as it downloads (in any order), and `defer` and modules run **after parsing, in order**.

:::viz scripts

## The box model

Every element is a rectangle made of four layers: **content → padding → border → margin**. The question is what `width` measures:

- `box-sizing: content-box` (the default): `width` is the **content** only, and padding and border are **added** on top.
- `box-sizing: border-box`: `width` includes padding and border. Almost every codebase sets `*, *::before, *::after { box-sizing: border-box }` because it makes sizes predictable.

:::viz boxmodel

Things that catch people out:

- **Margin collapsing**: vertical margins between adjacent blocks (and between a parent and its first or last child) **collapse** to the larger of the two instead of adding up. It doesn't happen in flex or grid containers, or when padding, a border or a new BFC separates them.
- **Inline elements** ignore `width`/`height`, and their vertical margins don't push other lines away. Use `inline-block` or flex.
- **Percentages for padding and margin** (even top and bottom) are calculated from the **width** of the containing block.

> **Tip:** A **block formatting context** (BFC) is a region that contains its floats and stops margins from collapsing through it. `display: flow-root` is the modern, side-effect-free way to create one. `overflow: hidden` was the old hack.

## The cascade and specificity

When several rules set the same property on the same element, the browser picks a winner in this order:

1. **Origin and importance**: user-agent < user < author styles. `!important` reverses that order.
2. **Cascade layers** (`@layer`): later layers beat earlier ones, and unlayered styles beat all layers.
3. **Specificity**: compared as (IDs, classes/attributes/pseudo-classes, elements/pseudo-elements).
4. **Order of appearance**: when everything else ties, the later rule wins.

Inline `style=""` beats any selector. Inherited values (`color`, `font-*`, `line-height` and other text properties) have **no specificity at all**: any rule that targets the element directly beats an inherited value.

:::viz specificity

> **Rule of thumb:** Keep specificity low and flat: single classes (BEM, CSS Modules or utility classes). Use `:where()` to write zero-specificity defaults that are easy to override. Reaching for `!important` or an ID to win a fight is a sign of an architecture problem.

## Positioning and stacking

`position` decides which box an element is laid out against, and whether it takes up space in the flow:

| Value | In flow? | Offset relative to | Typical use |
|---|---|---|---|
| `static` | yes | (offsets ignored) | default |
| `relative` | yes (space kept) | its own normal position | nudging; becoming the anchor for absolute children |
| `absolute` | no | the nearest **positioned** ancestor | badges, dropdowns, overlays |
| `fixed` | no | the viewport (or an ancestor with a transform!) | sticky headers, FABs, toasts |
| `sticky` | yes | its scroll container, once past the threshold | table headers, section titles |

:::viz position

### Stacking contexts

`z-index` doesn't create a global ranking. Elements are painted in **stacking contexts**, which are nested groups. Inside one context, children are ordered by z-index, but the **whole group** is placed as a single unit within its parent's context. A child can never rise above an element that its context, as a whole, sits underneath.

:::viz stacking

> **Pitfall:** "My modal's z-index is 9999 but it's still under the header." Some ancestor (with a `transform`, `opacity < 1`, `filter`, or `position` plus `z-index`) created a stacking context. Render overlays in a **portal** at the end of `body`, and keep a small, named z-index scale (`--z-dropdown`, `--z-modal`, `--z-toast`).

## Flexbox and Grid

**Flexbox** lays items out along **one axis**. Content drives the sizing: items start at their `flex-basis` (or content size), then grow into free space or shrink to avoid overflow, according to `flex-grow` and `flex-shrink`.

- `flex: 1` is shorthand for `1 1 0%`: grow, shrink, and start from zero, so items split the space equally.
- `justify-content` works on the **main** axis; `align-items` and `align-self` work on the **cross** axis; `align-content` spaces out the lines when items wrap.
- `min-width: auto` on flex items stops them shrinking below their content's size. That's why long text or a `pre` can overflow. Fix it with `min-width: 0`.
- Use `gap` for spacing between items, not margins.

:::viz flexbox

**Grid** lays items out in **two dimensions**. The container defines the tracks (`grid-template-columns` and `grid-template-rows`) and items are placed into them. The `fr` unit shares out the remaining space; `minmax()`, `auto-fit` and `auto-fill` give you responsive layouts without media queries; `grid-template-areas` lets you draw the layout with names.

:::viz grid

| Use Flexbox for | Use Grid for |
|---|---|
| a row of buttons, a navbar, centring one thing | page layouts and card galleries |
| content that should size itself | aligning things in both rows and columns |
| wrapping chips and tags | overlapping items (place several in the same cell) |

They work well together: a grid for the page, flex inside each component.

## Responsive design and units

- **Mobile first**: write the base styles for small screens, then add `min-width` media queries as space grows.
- **Fluid sizing**: `clamp(1rem, 2.5vw, 1.5rem)` for type, `%`/`fr`/`minmax` for layout, and `max-width: 100%` for images.
- **Container queries** (`@container`) let a component respond to the space **it** has, not the size of the viewport. That's ideal for reusable cards.
- **Units**: `rem` (relative to the root font size, so it respects user settings) for type and spacing; `em` for things that should scale with the component's own font; `px` for borders; `dvh` instead of `100vh` on mobile (it accounts for the browser bars); `ch` for readable line lengths.

## Animation and rendering cost

Each change to a style has a cost, depending on which pipeline stages it triggers:

| Property changed | Work triggered | Smooth at 60 fps? |
|---|---|---|
| `width`, `height`, `top`, `left`, `margin`, `font-size` | layout → paint → composite | usually not |
| `color`, `background`, `box-shadow`, `border-radius` | paint → composite | sometimes |
| `transform`, `opacity` (with their own layer) | composite only | yes, even when the main thread is busy |

Animate `transform` and `opacity`. Use `will-change` sparingly, only just before an animation, because every layer costs GPU memory. Respect `prefers-reduced-motion`. Use transitions for A → B state changes, and `@keyframes` animations for loops or multi-step motion.

> **In short:** semantic HTML first; `border-box` everywhere; low, flat specificity; understand containing blocks and stacking contexts; flex for one dimension and grid for two; and animate only transform and opacity.
</script>

## One thread, many things waiting

JavaScript in the browser runs your code on **one main thread**. That same thread also handles user input, runs layout and paints the page. So how can it fetch data, run timers and respond to clicks "at the same time"?

It doesn't do them at the same time. The slow parts happen **outside** JavaScript, in the browser's own threads (the network stack, timers, the file system). When one of them finishes, the browser **queues a callback**, and your code runs it later, when the thread is free. The piece that decides what runs next is the **event loop**.

:::html

:::

Each callback **runs to completion**: nothing can interrupt it partway through. That's what makes JavaScript easy to reason about (no data races on your variables), and it's also why a slow callback freezes the whole page.

## The event loop

The event loop repeats a simple algorithm:

1. Take the **oldest task** from a task queue and run it until the call stack is empty. The initial script counts as a task.
2. Run **every microtask** in the microtask queue, including any new microtasks queued while doing this, until the queue is empty.
3. If it's time for a frame (about every 16.7 ms at 60 Hz), **render**: run `requestAnimationFrame` callbacks, then style, layout and paint.
4. Go back to step 1.

| | Microtasks | Tasks (macrotasks) |
|---|---|---|
| Sources | `.then/.catch/.finally`, code after `await`, `queueMicrotask`, `MutationObserver` | `setTimeout`, `setInterval`, UI events, `postMessage`, `MessageChannel`, network callbacks |
| When they run | Right after the current task, **all of them** | One per loop iteration |
| Can block rendering? | Yes: an endless microtask chain stops the page from ever painting | Rendering can happen between tasks |

:::viz eventloop

> **Key idea:** Order of output = **synchronous code first**, then **all microtasks**, then **one task**, then all microtasks again, and so on. A `setTimeout(fn, 0)` is a request for "a future task, no sooner than 0 ms", not "run immediately".

`setTimeout` delays are **minimums**. The callback can't run until the stack is clear and every microtask has finished. Browsers also clamp nested timers to at least 4 ms and throttle timers in background tabs heavily. `requestAnimationFrame` isn't a task or a microtask: it runs just before the next paint, which makes it the right place for visual updates.

```js run
console.log('A sync');
setTimeout(() => console.log('F timeout'), 0);
queueMicrotask(() => console.log('C queueMicrotask'));
Promise.resolve().then(() => console.log('D then')).then(() => console.log('E then 2'));
(async () => { console.log('B async body runs sync'); await 0; console.log('D2 after await'); })();
console.log('A2 sync end');
```

## Promises

A **promise** is an object that represents a value you'll have later. It's in exactly one of three states, and once it's **settled** it never changes again:

:::html
<figure class="fig"><svg viewBox="0 0 680 170" role="img" aria-label="Promise states: pending moves to fulfilled with a value, or rejected with a reason. Settled promises never change.">
<defs><marker id="mk-ps" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10z" class="s-fM"/></marker></defs>
<rect class="s-acc" x="40" y="58" width="150" height="54" rx="27"/><text class="s-tb" x="115" y="82" text-anchor="middle">pending</text><text class="s-ts" x="115" y="100" text-anchor="middle">no value yet</text>
<rect class="s-ok" x="420" y="14" width="220" height="54" rx="27"/><text class="s-tb" x="530" y="38" text-anchor="middle">fulfilled</text><text class="s-ts" x="530" y="56" text-anchor="middle">has a value → .then(onFulfilled)</text>
<rect class="s-bad" x="420" y="102" width="220" height="54" rx="27"/><text class="s-tb" x="530" y="126" text-anchor="middle">rejected</text><text class="s-ts" x="530" y="144" text-anchor="middle">has a reason → .catch(onRejected)</text>
<path class="s-lG a-dash" marker-end="url(#mk-ps)" d="M190,78 C290,60 330,42 416,42"/><text class="s-tG" x="300" y="46" text-anchor="middle">resolve(v)</text>
<path class="s-lR a-dash" marker-end="url(#mk-ps)" d="M190,94 C290,112 330,128 416,128"/><text class="s-tR" x="300" y="138" text-anchor="middle">reject(e) / throw</text>
<text class="s-ts" x="300" y="92" text-anchor="middle">settles once</text>
</svg><figcaption>"Resolved" and "fulfilled" aren't the same: resolving with another promise makes this one follow that promise, which might still reject.</figcaption></figure>
:::

The important rules:

- **`.then` returns a new promise.** Whatever the callback returns becomes the new promise's value. If it returns a promise, the chain waits for it. If it throws, the new promise rejects. That's how chains stay flat instead of nesting into callback pyramids.
- **Callbacks always run asynchronously**, as microtasks, even when the promise is already settled. That's guaranteed, so code never runs "sometimes sync, sometimes async".
- **A rejection skips forward** to the next `.catch` (or the second argument of a `.then`), just like an exception skips to the next `catch` block. After a `.catch` handles it, the chain continues as fulfilled.
- **Always return** from inside `.then`. A missing `return` breaks the chain: the next step gets `undefined` and doesn't wait.
- The function you pass to `new Promise(executor)` runs **synchronously**, straight away.

```js run
const wait = (ms, v, fail) => new Promise((res, rej) => setTimeout(() => (fail ? rej(new Error(v)) : res(v)), ms));
wait(50, 1)
  .then(v => { console.log('got', v); return wait(50, v + 1); })   // returning a promise: the chain waits
  .then(v => { console.log('got', v); throw new Error('boom'); })
  .then(() => console.log('skipped'))
  .catch(e => { console.log('caught', e.message); return 'recovered'; })
  .then(v => console.log('continues with', v))
  .finally(() => console.log('finally: no args, passes the value through'));
```

### Combinators

:::viz promises

| Combinator | Settles when | Fulfils with | Rejects when |
|---|---|---|---|
| `Promise.all` | all fulfil, or the first rejection | array of values, in input order | **any** rejects (fail-fast) |
| `Promise.allSettled` | all settle | array of `{status, value \| reason}` | never |
| `Promise.race` | the first one settles | that value | that one rejects |
| `Promise.any` | the first fulfilment, or all reject | the first value | **all** reject (`AggregateError`) |

> **Interview:** Writing `Promise.all` from scratch is a top-five question. Keep a counter, store each result **by index** (not with `push`, which would put them in completion order), resolve when the counter hits the length, reject on the first error, and handle the empty array (resolve with `[]` straight away). Wrap each item in `Promise.resolve` so plain values work too.

## async / await

`async`/`await` is syntax over promises. It lets asynchronous code read top to bottom:

- An `async` function **always returns a promise**. A `return v` fulfils it, and a `throw` rejects it.
- `await p` **pauses the function** (not the thread!) until `p` settles, and returns its value or throws its reason. The rest of the function continues later as a microtask. Meanwhile, the caller carries on straight away.
- Everything before the first `await` runs **synchronously**.
- Use plain `try/catch` around `await` for errors.

### Sequential vs parallel

The most common performance mistake with `await` is accidentally running independent requests one after another:

:::html
<figure class="fig"><svg viewBox="0 0 680 200" role="img" aria-label="Timeline: three awaited calls in sequence take 900 ms; started together with Promise.all they take 300 ms.">
<text class="s-tb" x="14" y="30">await a; await b; await c</text>
<rect class="s-cur" x="14" y="42" width="200" height="26" rx="6"/><text class="s-t" x="114" y="60" text-anchor="middle">a 300ms</text>
<rect class="s-cur" x="214" y="42" width="200" height="26" rx="6"/><text class="s-t" x="314" y="60" text-anchor="middle">b 300ms</text>
<rect class="s-cur" x="414" y="42" width="200" height="26" rx="6"/><text class="s-t" x="514" y="60" text-anchor="middle">c 300ms</text>
<text class="s-tR" x="622" y="60">900ms</text>
<text class="s-tb" x="14" y="106">await Promise.all([a(), b(), c()])</text>
<rect class="s-ok" x="14" y="118" width="200" height="22" rx="6"/><text class="s-t" x="114" y="134" text-anchor="middle">a</text>
<rect class="s-ok" x="14" y="144" width="200" height="22" rx="6"/><text class="s-t" x="114" y="160" text-anchor="middle">b</text>
<rect class="s-ok" x="14" y="170" width="200" height="22" rx="6"/><text class="s-t" x="114" y="186" text-anchor="middle">c</text>
<text class="s-tG" x="226" y="158">300ms: start all, then await together</text>
</svg><figcaption>Only await one after another when a step needs the previous result.</figcaption></figure>
:::

```js run
const job = (name, ms) => new Promise(r => setTimeout(() => r(name), ms));
(async () => {
  let t = performance.now();
  await job('a', 100); await job('b', 100); await job('c', 100);
  console.log('sequential', Math.round(performance.now() - t), 'ms');
  t = performance.now();
  const results = await Promise.all([job('a', 100), job('b', 100), job('c', 100)]);
  console.log('parallel', Math.round(performance.now() - t), 'ms', results);
})();
```

> **Pitfall:** `array.forEach(async x => await save(x))` doesn't wait for anything: `forEach` ignores the promises the callback returns. Use `for…of` with `await` for one at a time, or `await Promise.all(array.map(save))` for all at once.

## Cancellation, races and long work

### AbortController

Promises can't be cancelled by themselves, so the platform provides **`AbortController`**. Create a controller, pass `controller.signal` to `fetch` (or to your own functions), and call `controller.abort()` to cancel. An aborted `fetch` rejects with an `AbortError`. In React, abort in the effect's cleanup so a slow, outdated response can't overwrite newer data. That bug is called a **race condition**.

```js run
const ctrl = new AbortController();
const slow = signal => new Promise((res, rej) => {
  const id = setTimeout(() => res('data'), 500);
  signal.addEventListener('abort', () => { clearTimeout(id); rej(new DOMException('Aborted', 'AbortError')); });
});
slow(ctrl.signal).then(console.log, e => console.log('rejected:', e.name));
setTimeout(() => ctrl.abort(), 100);
// timeouts: AbortSignal.timeout(ms), and combine signals with AbortSignal.any([a, b])
```

### Keeping the page responsive

Any task that takes longer than **50 ms** counts as a **long task**. While it runs, the page can't respond to clicks or paint, and that shows up as a poor INP score. Options, from simplest to strongest:

1. **Do less**: memoise, virtualise long lists, debounce input handlers.
2. **Break it into chunks** and yield back to the event loop between them (`await scheduler.yield()` where it's supported, otherwise `await new Promise(r => setTimeout(r))`) so input and paint can happen in between.
3. **Move it off the main thread** to a **Web Worker**, which has a separate thread and communicates with `postMessage`. Workers can't touch the DOM.

> **Rule of thumb:** "async" doesn't mean "in the background". An `async` function that loops over a million items without awaiting anything blocks the thread just as much as a normal function.
</script>
<script type="text/x-learn" data-for="js-coding" data-mins="14">
## How to approach "implement X"

Polyfill and utility rounds check three things: that you **understand the spec** of the thing you're rebuilding, that you write **clean, correct code under time pressure**, and that you **think about edge cases** without being prompted. A strong answer follows the same arc every time:

1. **Restate the contract.** Write the signature and two or three example calls. "`debounce(fn, wait)` returns a function. Calls made within `wait` ms of each other collapse into one call, with the last arguments." Ask about options (leading edge? `cancel`?).
2. **Write the smallest correct version first.** Get the core working before adding options.
3. **Walk through an example out loud**, tracing the state (timer ids, counters, result arrays).
4. **Harden it.** Preserve `this` and the arguments, handle empty input, errors and rejections, and add cleanup or cancellation.
5. **State the complexity** and any trade-offs.

> **Key idea:** Most utilities are built from four ingredients: a **closure** that holds private state, **`fn.apply(this, args)`** to forward the call faithfully, **timers** for anything time-based, and **promises** for anything async. Once you can see these four, every question looks familiar.

## Timing utilities

**Debounce** waits for a pause: every call resets a timer, and only the last call in a burst runs. **Throttle** limits the rate: at most one call per interval, however often it's triggered.

:::viz debounce

| | Debounce | Throttle |
|---|---|---|
| Fires | once, after events stop for `wait` ms | at most once every `interval` ms, steadily |
| State | one timer id | the last run time (plus a trailing timer) |
| Use for | search-as-you-type, autosave, window-resize "done" | scroll position, pointermove, drag, analytics pings |
| Risk | never fires if events never stop (add `maxWait`) | can drop the final event unless there's a trailing call |

```js run
function debounce(fn, wait, { leading = false } = {}) {
  let id = null;
  function debounced(...args) {
    const callNow = leading && id === null;
    clearTimeout(id);
    id = setTimeout(() => { id = null; if (!leading) fn.apply(this, args); }, wait);
    if (callNow) fn.apply(this, args);
  }
  debounced.cancel = () => { clearTimeout(id); id = null; };
  return debounced;
}
const log = debounce(q => console.log('search for', q), 100);
['r', 're', 'rea', 'reac', 'react'].forEach((q, i) => setTimeout(() => log(q), i * 30));
```

> **Pitfall:** Writing `setTimeout(fn, wait)` and losing `this` and the arguments. Capture `args` with a rest parameter and call `fn.apply(this, args)` from a regular `function`, not an arrow function, so the debounced function still works as a method.

## Promise utilities

All of the promise combinators share one skeleton: **return a new Promise, iterate over the inputs, attach handlers, and decide when to resolve or reject.** What changes is the settle condition:

| Build | Resolve when | Reject when | Key detail |
|---|---|---|---|
| `all` | counter === length | the first rejection | store results by **index** |
| `allSettled` | counter === length | never | wrap each result as `{status, value/reason}` |
| `race` | the first settles | the first settles | just attach `resolve`/`reject` to each |
| `any` | the first fulfils | counter of rejections === length | reject with `AggregateError` |

### Retry, timeout and concurrency limits

Real apps need more control than the built-ins give you, so these come up a lot:

- **Timeout**: race the task against a promise that rejects after `ms`, and clear the timer when the task wins.
- **Retry with exponential backoff**: on failure, wait `base * 2^attempt` (plus random **jitter**, so many clients don't retry in sync) and try again, up to a limit. Only retry errors that might be temporary: network errors, 429 and 5xx responses.
- **Concurrency limit (promise pool)**: start `k` workers, and each one keeps pulling the next task from a shared index until the queue is empty. Results are stored by index, so the output order matches the input order.

:::viz pool

```js run
async function pool(tasks, limit) {
  const results = new Array(tasks.length);
  let next = 0;
  async function worker() {
    while (next < tasks.length) {
      const i = next++;                 // claimed synchronously, so two workers can never take the same task
      results[i] = await tasks[i]();
    }
  }
  await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
  return results;
}
const t0 = Date.now();
const task = (name, ms) => () => new Promise(r => setTimeout(() => { console.log(name, 'done at', Date.now() - t0, 'ms'); r(name); }, ms));
pool([task('A', 300), task('B', 100), task('C', 200), task('D', 100)], 2).then(r => console.log('results in input order:', r));
```

## Array and function polyfills

When you polyfill a built-in, match its **exact** behaviour. That's what the interviewer is checking:

- **`map` / `filter` / `forEach`**: the callback receives `(element, index, array)`, `thisArg` is supported, and holes are skipped (`if (i in this)`).
- **`reduce`**: with no initial value, start from the first element that exists and begin at the next index. On an empty array with no initial value, throw `TypeError`.
- **`bind`**: return a function that calls `fn.apply(ctx, [...preset, ...args])`. When it's called with `new`, ignore `ctx` and construct normally instead. Keep the prototype link.
- **`call` / `apply`** without using them: temporarily attach the function to the context object under a unique `Symbol` key, call it as a method, then delete the key.

```js run
Array.prototype.myReduce = function (cb, ...init) {
  let i = 0, acc;
  if (init.length) acc = init[0];
  else { while (i < this.length && !(i in this)) i++; if (i >= this.length) throw new TypeError('Reduce of empty array with no initial value'); acc = this[i++]; }
  for (; i < this.length; i++) if (i in this) acc = cb(acc, this[i], i, this);
  return acc;
};
console.log([1, 2, 3].myReduce((a, b) => a + b), [1, , 3].myReduce((a, b) => a + b, 10));
try { [].myReduce((a, b) => a + b); } catch (e) { console.log(e.name + ': ' + e.message); }
```

### Memoize and once

Both are closures with a cache. `once` stores a flag and the first result. `memoize` stores results by key. The default key is usually `JSON.stringify(args)`, or let the caller pass a resolver. Two things to mention without being asked: the cache **grows without bound** (use an LRU limit or a `WeakMap` for object keys), and for **async** functions you should cache the *promise* (so concurrent callers share one request) but **delete it if it rejects**, so a failure isn't cached forever.

## Objects and data

**Deep clone** and **deep equal** are the core recursive questions. Both follow the same template:

1. **Base case**: primitives (and functions) are returned or compared directly.
2. **Special types**: Date, RegExp, Map and Set each need their own handling.
3. **Cycles**: keep a `WeakMap` from each source object to its clone (or to the object it was compared with). If you've seen an object before, return the stored clone instead of recursing forever.
4. **Recurse** over own keys: `Reflect.ownKeys` if symbols should count, `Object.keys` otherwise.

```js run
function deepClone(v, seen = new WeakMap()) {
  if (v === null || typeof v !== 'object') return v;
  if (seen.has(v)) return seen.get(v);
  if (v instanceof Date) return new Date(v);
  if (v instanceof RegExp) return new RegExp(v.source, v.flags);
  if (v instanceof Map) { const m = new Map(); seen.set(v, m); v.forEach((x, k) => m.set(deepClone(k, seen), deepClone(x, seen))); return m; }
  if (v instanceof Set) { const s = new Set(); seen.set(v, s); v.forEach(x => s.add(deepClone(x, seen))); return s; }
  const out = Array.isArray(v) ? [] : Object.create(Object.getPrototypeOf(v));
  seen.set(v, out);
  for (const k of Reflect.ownKeys(v)) out[k] = deepClone(v[k], seen);
  return out;
}
const a = { d: new Date(0), list: [1, { x: 2 }], tags: new Set(['js']) }; a.self = a;
const b = deepClone(a);
console.log(b.self === b, b.list[1] !== a.list[1], b.d instanceof Date, [...b.tags]);
```

**Flatten** (arrays with a depth limit, or objects into `'a.b.c'` keys), **`get`/`set` by path**, `groupBy` and `chunk` are all short loops or recursions. Spend your time on the edge cases: empty input, `null` partway along a path, array indices inside a path (`'a[0].b'`), and keys that are falsy but valid (`0`, `''`).

## Patterns and classes

### EventEmitter

Keep a `Map` from event name to a list (or `Set`) of listeners. `on` adds a listener and returns an **unsubscribe function**. `emit` calls a **copy** of the listener list, so a listener that removes itself while running doesn't break the loop. `once` wraps the listener in a function that removes itself before calling the original, and stores the original so `off(original)` still works.

### LRU cache

The textbook structure is a hash map plus a doubly linked list. In JavaScript, a **`Map` already keeps insertion order**, so you get O(1) `get` and `put` almost for free: on access, delete the key and set it again to move it to the end; when over capacity, evict `map.keys().next().value`, the oldest key.

:::viz lru

> **Interview:** If they ask for the "real" version, use a doubly linked list with sentinel head and tail nodes, plus a map from key to node. Moving a node is then two pointer updates, and eviction removes `head.next`.

### Small state containers

A mini **Redux store** is about 15 lines: hold the state in a closure, have `dispatch` run the reducer and notify subscribers, and have `subscribe` return an unsubscribe function. **Signals** (as in Solid, Preact and Angular) add automatic dependency tracking. While an `effect` runs, it sets itself as the "current observer"; each signal read registers that observer, and each signal write re-runs the observers it collected.

## Async control flow

| Pattern | Sketch | Watch for |
|---|---|---|
| Sequence | `for (const t of tasks) results.push(await t())` | Don't use `forEach` with async callbacks |
| Parallel | `await Promise.all(tasks.map(t => t()))` | One failure rejects everything; use `allSettled` for partial success |
| Pool of k | k workers pulling from a shared index | Store results by index |
| Retry | loop with try/catch and an `await sleep(backoff)` | Cap the attempts, add jitter, and only retry errors that can recover |
| Cancel | pass an `AbortSignal` down and check `signal.aborted` | Clean up timers and listeners when aborted |

> **In short:** say the contract out loud, write the simplest correct version, trace an example, then harden it for `this`, arguments, edge cases and cleanup. Interviewers grade the process as much as the code.
</script>

## How JavaScript runs your code

Before you can reason about closures, `this` or hoisting, you need one mental model: **the engine runs code inside execution contexts, and it keeps them on a call stack.**

An execution context is the bookkeeping for one piece of running code. The script itself gets a **global context**. Every function call gets a new **function context**, which is pushed onto the call stack, and it's popped when the function returns. Each context holds three things:

1. **An environment record** holding the variables, functions and parameters declared in that scope.
2. **A link to the outer environment**: the scope the function was *written* in. Following these links gives you the scope chain.
3. **The `this` binding**, decided by how the function was called.

Each context is set up in two phases. During the **creation phase**, the engine scans the code and registers every declaration before running a single line. During the **execution phase**, it runs the code top to bottom and assigns values. "Hoisting" is just a name for the creation phase.

:::html
<figure class="fig"><svg viewBox="0 0 680 230" role="img" aria-label="Three nested scope boxes: global contains outer, which contains inner. Arrows from inner point outward to show lookup order.">
<rect class="s-box2" x="10" y="10" width="660" height="210" rx="14"/><text class="s-tb" x="28" y="36">Global scope</text><text class="s-ts" x="28" y="54">greeting, outer, msg</text>
<rect class="s-acc" x="150" y="66" width="500" height="140" rx="12"/><text class="s-tb" x="168" y="92">outer() scope</text><text class="s-ts" x="168" y="110">name, inner</text>
<rect class="s-ok" x="320" y="122" width="310" height="70" rx="10"/><text class="s-tb" x="338" y="148">inner() scope</text><text class="s-ts" x="338" y="168">reads greeting + name</text>
<path class="s-lO a-dash" d="M320,160 C250,170 210,150 190,120"/><path class="s-lO a-dash" d="M190,110 C150,90 110,70 100,58"/>
<text class="s-tO" x="196" y="176">1. not here? look outward</text><text class="s-tO" x="34" y="84">2. then global</text>
</svg><figcaption>Lexical scope: each scope sits inside the one it was written in. A lookup starts in the innermost scope and walks outward. It never walks inward or sideways.</figcaption></figure>
:::

:::viz callstack

### var, let, const and the temporal dead zone

All three are hoisted. The difference is what they're initialised to during the creation phase:

| | Scope | Hoisted as | Re-declare? | Re-assign? |
|---|---|---|---|---|
| `var` | function | `undefined` | yes | yes |
| `let` | block `{ }` | uninitialised (TDZ) | no | yes |
| `const` | block `{ }` | uninitialised (TDZ) | no | no (but the object it points to can still change) |
| `function` declaration | function / block | the whole function | yes | yes |
| `class` declaration | block | uninitialised (TDZ) | no | yes |

The **temporal dead zone** is the time between entering a scope and reaching the `let`/`const` line. The binding exists, and it shadows any outer variable with the same name, but reading it throws `ReferenceError`. This is deliberate: it turns "used before it's defined" from a silent `undefined` into a loud error.

```js run
let x = 'outer';
{
  // the inner x is hoisted to the top of this block, so it shadows the outer one…
  try { console.log(x); } catch (e) { console.log(e.name + ': ' + e.message); }
  let x = 'inner';   // …and only now leaves the TDZ
  console.log(x);
}
```

> **Key idea:** Scope is decided by **where code is written** (lexical scope). `this` is decided by **how a function is called**. Most "tricky" JavaScript questions are just these two rules applied carefully.

## Closures

A **closure** is a function plus the scope it was created in. Every function in JavaScript is a closure: when a function is created it stores a hidden reference (`[[Environment]]`) to the surrounding scope. When it runs later, even after the outer function has returned, it can still read and write those variables.

Why doesn't the outer variable disappear when the outer function returns? Because variables don't really live "on the stack". They live in **environment objects in the heap**, and garbage collection keeps an object alive as long as something can still reach it. The returned function can reach it, so it stays.

:::viz closure

What closures give you:

- **Private state**: counters, caches and IDs that no outside code can touch. This is the module pattern, and how `useState` setters and memoise helpers work.
- **Function factories**: `makeAdder(5)`, `debounce(fn, 300)` and `once(fn)` all return a function that closes over its configuration.
- **Callbacks that remember context**: an event handler or `setTimeout` callback that reads a variable from the function that registered it.

### The loop-closure classic

```js run
// var: one function-scoped i shared by every callback
for (var i = 0; i < 3; i++) setTimeout(() => console.log('var', i), 0);
// let: the spec creates a fresh i binding for every iteration
for (let j = 0; j < 3; j++) setTimeout(() => console.log('let', j), 0);
```

With `var` there's a single `i`. By the time the callbacks run, the loop has finished and `i` is 3. With `let`, each iteration gets its **own** binding, so each callback closes over a different variable. Before `let` existed, the fix was an IIFE that captured the value: `(function (i) { setTimeout(…) })(i)`.

> **Pitfall:** Closures keep the **whole** environment alive, not just the variables you use. A long-lived event listener that closes over a big array or a detached DOM node is a classic memory leak. Remove listeners, and null out references you don't need.

> **Pitfall:** **Stale closures** in React are the same idea. A `useEffect` or `setInterval` callback captured `count` from the render that created it, so it keeps seeing that old value. Fix it with the functional updater `setCount(c => c + 1)`, the right dependency array, or a ref.

## `this`: decided at the call site

`this` is **not** about where a function is written. It's an implicit parameter that's filled in **when the function is called**. To work it out, look at the call site and apply these rules from strongest to weakest:

1. **`new` binding.** `new Foo()` creates a new object, links its prototype to `Foo.prototype`, and calls `Foo` with `this` set to that object.
2. **Explicit binding.** `fn.call(obj, a, b)`, `fn.apply(obj, [a, b])`, or a function from `fn.bind(obj)`. A bound function's `this` is fixed for good; only `new` can override it.
3. **Implicit binding.** `obj.method()` sets `this` to the object **before the dot**.
4. **Default binding.** A plain `fn()` call sets `this` to `undefined` in strict mode (which includes modules and classes), or `globalThis` in sloppy scripts.

**Arrow functions skip all four rules.** They have no `this` of their own and use the `this` of the scope they were written in, just like any other variable. You also can't change it with `call`, `bind` or `new`.

:::viz thisbind

```js run
'use strict';
const user = {
  name: 'Ada',
  regular() { return this && this.name; },
  arrow: () => typeof this,          // module/script scope, not user
  later() { setTimeout(() => console.log('arrow inside method:', this.name), 0); },
};
console.log('implicit:', user.regular());
const loose = user.regular;
console.log('lost:', loose());                       // default binding → undefined
console.log('explicit:', user.regular.call({ name: 'Bo' }));
console.log('bound:', user.regular.bind({ name: 'Cy' }).call({ name: 'Di' }));
console.log('arrow as method:', user.arrow());
user.later();
```

> **Rule of thumb:** Use **methods** (the `regular() {}` syntax) when you need `this` to be the object, and **arrow functions** for callbacks inside those methods. Never use an arrow function as an object method or a prototype method.

### call, apply and bind

| | Invokes now? | Arguments | Returns |
|---|---|---|---|
| `fn.call(ctx, a, b)` | yes | listed one by one | the result |
| `fn.apply(ctx, [a, b])` | yes | as one array | the result |
| `fn.bind(ctx, a)` | no | partial, the rest later | a new bound function |

Interviewers often ask you to write `bind`. The core idea is a closure that remembers `ctx` and the first arguments, then calls `fn.apply(ctx, [...preset, ...later])`. A complete answer also handles `new` on the bound function, which should ignore `ctx`.

## Prototypes and classes

Objects in JavaScript inherit from **other objects**, not from classes. Every object has a hidden `[[Prototype]]` link, which you can read with `Object.getPrototypeOf(obj)` (or the legacy `__proto__`). When you **read** a property, the engine looks at the object's own properties first, then follows the prototype links up the chain until it finds the key or reaches `null`.
