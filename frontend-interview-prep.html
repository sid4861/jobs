> **Tip:** prefer CSS media and container queries for layout. Use these hooks only when the **behaviour** differs (for example, rendering a drawer instead of a sidebar).

### Q: Write `useEventListener` (with a stable latest handler) [Medium] [React]

```jsx
export function useEventListener(eventName, handler, element = window, options) {
  const saved = useRef(handler);
  useEffect(() => { saved.current = handler; });
  useEffect(() => {
    const target = element && 'current' in element ? element.current : element;
    if (!target?.addEventListener) return;
    const listener = e => saved.current(e);
    target.addEventListener(eventName, listener, options);
    return () => target.removeEventListener(eventName, listener, options);
  }, [eventName, element, options?.capture, options?.passive, options?.once]);
}
// useEventListener('keydown', e => { if (e.key === 'Escape') close(); });
```

### Q: Write `useAsync` for running an async function on demand [Medium] [React]

```jsx
export function useAsync(asyncFn) {
  const [state, setState] = useState({ status: 'idle', data: null, error: null });
  const latest = useRef(0);
  const run = useCallback(async (...args) => {
    const id = ++latest.current;
    setState(s => ({ ...s, status: 'pending', error: null }));
    try {
      const data = await asyncFn(...args);
      if (id === latest.current) setState({ status: 'success', data, error: null });   // ignore stale results
      return data;
    } catch (error) {
      if (id === latest.current) setState({ status: 'error', data: null, error });
      throw error;
    }
  }, [asyncFn]);
  return { ...state, run, isPending: state.status === 'pending' };
}
// const { run: save, isPending } = useAsync(api.saveProfile);

<script type="text/x-prep" id="p-machine-coding" data-group="React" data-title="Machine coding round: problems & solutions" data-short="Machine coding" data-lede="The build-a-working-UI round, usually 60–120 minutes in React. Each problem has requirements, the state design, a complete solution and the follow-ups interviewers ask. Build it yourself first, with a timer, then compare.">
## How to run the round

1. **Clarify for 3–5 minutes.** Core features versus nice-to-haves, the data source (mock or API), whether styling matters, browser support, accessibility expectations, and whether libraries are allowed.
2. **Plan out loud.** Sketch the component tree, then decide **what state exists, where it lives, and what is derived**. Most bugs in this round are state-design bugs.
3. **Build a working MVP end to end** by around 60% of the time. Use hard-coded data first and wire up the API later.
4. **Harden it:** empty, loading and error states, edge cases (rapid clicks, very long text, zero items), keyboard support and ARIA, cleanup of timers and listeners.
5. **Refactor and style last:** extract hooks and components, add minimal CSS.
6. **Walk the interviewer through it:** what you built, the trade-offs, and what you'd add with more time (tests, virtualisation, caching).

| What they score | What it looks like |
|---|---|
| Working functionality | Core requirements done and demoable |
| State design | Minimal state, nothing duplicated, derived values computed, immutable updates |
| Component design | Small, reusable components; clear props; logic in custom hooks |
| Edge cases | Empty, loading and error states; races; cleanup |
| Accessibility | Semantic elements, labels, keyboard support, focus handling |
| Communication | Thinks aloud, explains trade-offs, takes hints |

## Classic problems

### Q: Todo list with filters, editing and persistence [Easy] [React]

**Requirements:** add, toggle, edit (double-click) and delete todos; filter by All / Active / Completed; show the count of remaining items; "Clear completed"; persist to localStorage.

**State design:** `todos` (the source of truth) and `filter`. The visible list and the remaining count are **derived**, not stored.

```jsx
import { useEffect, useMemo, useState } from 'react';

const FILTERS = { all: () => true, active: t => !t.done, completed: t => t.done };
const load = () => { try { return JSON.parse(localStorage.getItem('todos')) ?? []; } catch { return []; } };

export default function TodoApp() {
  const [todos, setTodos] = useState(load);
  const [text, setText] = useState('');
  const [filter, setFilter] = useState('all');
  const [editingId, setEditingId] = useState(null);

  useEffect(() => { localStorage.setItem('todos', JSON.stringify(todos)); }, [todos]);

  const add = e => {
    e.preventDefault();
    const title = text.trim();
    if (!title) return;
    setTodos(ts => [...ts, { id: crypto.randomUUID(), title, done: false }]);
    setText('');
  };
  const toggle = id => setTodos(ts => ts.map(t => (t.id === id ? { ...t, done: !t.done } : t)));
  const remove = id => setTodos(ts => ts.filter(t => t.id !== id));
  const rename = (id, title) => {
    setTodos(ts => ts.map(t => (t.id === id ? { ...t, title } : t)));
    setEditingId(null);
  };

  const visible = useMemo(() => todos.filter(FILTERS[filter]), [todos, filter]);
  const remaining = todos.filter(t => !t.done).length;

  return (
    <section className="todo">
      <form onSubmit={add}>
        <label htmlFor="new-todo">New task</label>
        <input id="new-todo" value={text} onChange={e => setText(e.target.value)} placeholder="What needs doing?" />
        <button type="submit">Add</button>
      </form>

      {todos.length === 0 ? <p>Nothing to do yet. Add your first task.</p> : (
        <ul>
          {visible.map(t => (
            <li key={t.id}>
              <input type="checkbox" checked={t.done} onChange={() => toggle(t.id)} aria-label={`Mark "${t.title}" as done`} />
              {editingId === t.id ? (
                <input
                  autoFocus defaultValue={t.title} aria-label="Edit task"
                  onBlur={e => rename(t.id, e.target.value.trim() || t.title)}
                  onKeyDown={e => { if (e.key === 'Enter') e.currentTarget.blur(); if (e.key === 'Escape') setEditingId(null); }}
                />
              ) : (
                <span onDoubleClick={() => setEditingId(t.id)} className={t.done ? 'done' : ''}>{t.title}</span>
              )}
              <button onClick={() => remove(t.id)} aria-label={`Delete "${t.title}"`}>×</button>
            </li>
          ))}
        </ul>
      )}

      <footer>
        <span aria-live="polite">{remaining} item{remaining === 1 ? '' : 's'} left</span>
        {Object.keys(FILTERS).map(f => (
          <button key={f} aria-pressed={filter === f} onClick={() => setFilter(f)}>{f}</button>
        ))}
        <button onClick={() => setTodos(ts => ts.filter(t => !t.done))} disabled={remaining === todos.length}>Clear completed</button>
      </footer>
    </section>
  );
}
```

**Follow-ups:** sync the filter to the URL (`?filter=active`); drag to reorder; undo delete with a toast; sync across tabs (the `storage` event); optimistic updates against an API.

### Q: Autocomplete / typeahead search [Core] [Medium] [React]

**Requirements:** suggestions appear as you type; debounced requests; cancel stale requests; cache results; keyboard navigation (↑ ↓ Enter Esc); highlight the matching text; loading, empty and error states; accessible combobox.

**State design:** `query` (input), a `debounced` query (derived through a hook), `items`, `status`, `open`, and `active` (the highlighted index).

```jsx
import { useEffect, useId, useState } from 'react';
import { useDebounce } from './hooks';          // see the Custom hooks page

const cache = new Map();                         // module-level cache shared across instances

export default function Autocomplete({ fetchSuggestions, onSelect }) {
  const [query, setQuery] = useState('');
  const [items, setItems] = useState([]);
  const [status, setStatus] = useState('idle');  // idle | loading | done | error
  const [open, setOpen] = useState(false);
  const [active, setActive] = useState(-1);
  const debounced = useDebounce(query.trim(), 300);
  const listId = useId();

  useEffect(() => {
    if (!debounced) { setItems([]); setStatus('idle'); return; }
    if (cache.has(debounced)) { setItems(cache.get(debounced)); setStatus('done'); setActive(-1); return; }
    const controller = new AbortController();
    setStatus('loading');
    fetchSuggestions(debounced, controller.signal)
      .then(results => { cache.set(debounced, results); setItems(results); setStatus('done'); setActive(-1); })
      .catch(err => { if (err.name !== 'AbortError') setStatus('error'); });
    return () => controller.abort();             // typing again cancels the in-flight request
  }, [debounced, fetchSuggestions]);

  const choose = item => { setQuery(item.label); setOpen(false); onSelect?.(item); };

  const onKeyDown = e => {
    if (e.key === 'Escape') return setOpen(false);
    if (!open || !items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); setActive(i => (i + 1) % items.length); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(i => (i <= 0 ? items.length - 1 : i - 1)); }
    else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); choose(items[active]); }
  };

  return (
    <div className="autocomplete">
      <input
        role="combobox" aria-expanded={open} aria-controls={listId} aria-autocomplete="list"
        aria-activedescendant={active >= 0 ? `${listId}-${active}` : undefined}
        value={query} placeholder="Search products"
        onChange={e => { setQuery(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)} onBlur={() => setOpen(false)} onKeyDown={onKeyDown}
      />
      {open && debounced && (
        <ul id={listId} role="listbox">
          {status === 'loading' && <li className="muted">Loading…</li>}
          {status === 'error' && <li role="alert">Couldn't load suggestions. Try again.</li>}
          {status === 'done' && items.length === 0 && <li className="muted">No matches for "{debounced}"</li>}
          {items.map((item, i) => (
            <li
              key={item.id} id={`${listId}-${i}`} role="option" aria-selected={i === active}
              onMouseDown={e => e.preventDefault()}   // keep focus in the input so onBlur doesn't close first
              onMouseEnter={() => setActive(i)} onClick={() => choose(item)}
            >
              <Highlight text={item.label} query={debounced} />
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

function Highlight({ text, query }) {
  const i = text.toLowerCase().indexOf(query.toLowerCase());
  if (i < 0) return text;
  return <>{text.slice(0, i)}<mark>{text.slice(i, i + query.length)}</mark>{text.slice(i + query.length)}</>;
}
```

**Follow-ups:** a minimum query length; cache eviction (LRU, TTL); recent searches; grouped results; virtualising long lists; scrolling the active option into view; mobile (`inputmode`, `enterkeyhint`); filtering on the client for small datasets. Also see the [autocomplete system design](#/fe-sd).

### Q: Infinite scroll feed [Core] [Medium] [React]

**Requirements:** load page 1, then load the next page when the user nears the bottom; show a loading indicator, an end-of-list message and an error with retry; no duplicate requests.

```jsx
export default function Feed({ fetchPage }) {         // fetchPage(page) → Promise<{ items, hasMore }>
  const [items, setItems] = useState([]);
  const [page, setPage] = useState(1);
  const [hasMore, setHasMore] = useState(true);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [attempt, setAttempt] = useState(0);            // bump to retry the same page
  const sentinelRef = useRef(null);

  useEffect(() => {
    let ignore = false;                                 // Strict Mode / fast changes: drop stale results
    setLoading(true); setError(null);
    fetchPage(page)
      .then(res => { if (!ignore) { setItems(prev => [...prev, ...res.items]); setHasMore(res.hasMore); } })
      .catch(err => { if (!ignore) setError(err); })
      .finally(() => { if (!ignore) setLoading(false); });
    return () => { ignore = true; };
  }, [page, attempt, fetchPage]);

  useEffect(() => {
    const el = sentinelRef.current;
    if (!el || !hasMore || loading || error) return;    // don't observe while a request is in flight
    const io = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting) setPage(p => p + 1);
    }, { rootMargin: '400px' });                         // start loading before the user hits the bottom
    io.observe(el);
    return () => io.disconnect();
  }, [hasMore, loading, error]);

  return (
    <div>
      <ul aria-busy={loading}>{items.map(item => <li key={item.id}><PostCard post={item} /></li>)}</ul>
      {loading && <p role="status">Loading more…</p>}
      {error && <p role="alert">Couldn't load posts. <button onClick={() => setAttempt(a => a + 1)}>Retry</button></p>}
      {!hasMore && <p>You're all caught up 🎉</p>}
      <div ref={sentinelRef} aria-hidden="true" />
    </div>
  );
}
```

**Follow-ups:** cursor-based pagination instead of page numbers (stable when new posts arrive); de-duplicating items by id; virtualising the list after a few hundred items; restoring the scroll position on back navigation; a "new posts" pill instead of auto-inserting at the top; a "Load more" button for accessibility.

### Q: Data table with search, sorting and pagination [Core] [Medium] [React]

**Requirements:** a table of users; search across name and email; click a column header to sort (toggle asc/desc); paginate 10 per page with page numbers and ellipses; reset to page 1 when the search changes.

**State design:** `query`, `sort`, `page`. The filtered, sorted and paged rows are all **derived** with `useMemo`.

```jsx
const PAGE_SIZE = 10;
const COLUMNS = [{ key: 'name', label: 'Name' }, { key: 'email', label: 'Email' }, { key: 'age', label: 'Age' }];

export default function UsersTable({ rows }) {
  const [query, setQuery] = useState('');
  const [sort, setSort] = useState({ key: 'name', dir: 'asc' });
  const [page, setPage] = useState(1);

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return q ? rows.filter(r => r.name.toLowerCase().includes(q) || r.email.toLowerCase().includes(q)) : rows;
  }, [rows, query]);

  const sorted = useMemo(() => {
    const dir = sort.dir === 'asc' ? 1 : -1;
    return filtered.toSorted((a, b) => {
      const x = a[sort.key], y = b[sort.key];
      return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y))) * dir;
    });
  }, [filtered, sort]);

  const pageCount = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
  const current = Math.min(page, pageCount);             // clamp if the data shrank
  const visible = sorted.slice((current - 1) * PAGE_SIZE, current * PAGE_SIZE);
  const toggleSort = key => setSort(s => ({ key, dir: s.key === key && s.dir === 'asc' ? 'desc' : 'asc' }));

  return (
    <>
      <input type="search" aria-label="Search users" value={query} onChange={e => { setQuery(e.target.value); setPage(1); }} />
      <table>
        <thead>
          <tr>
            {COLUMNS.map(c => (
              <th key={c.key} aria-sort={sort.key === c.key ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}>
                <button onClick={() => toggleSort(c.key)}>
                  {c.label} {sort.key === c.key ? (sort.dir === 'asc' ? '▲' : '▼') : ''}
                </button>
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {visible.length === 0
            ? <tr><td colSpan={COLUMNS.length}>No users match "{query}"</td></tr>
            : visible.map(r => <tr key={r.id}><td>{r.name}</td><td>{r.email}</td><td>{r.age}</td></tr>)}
        </tbody>
      </table>
      <nav aria-label="Pagination">
        <button disabled={current === 1} onClick={() => setPage(current - 1)}>Previous</button>
        {pageItems(current, pageCount).map((p, i) => p === '…'
          ? <span key={'gap' + i}>…</span>
          : <button key={p} aria-current={p === current ? 'page' : undefined} onClick={() => setPage(p)}>{p}</button>)}
        <button disabled={current === pageCount} onClick={() => setPage(current + 1)}>Next</button>
      </nav>
    </>
  );
}
```

The page-number logic is a common standalone question:

```js run
function pageItems(current, total, siblings = 1) {
  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
  if (total <= 2 * siblings + 5) return range(1, total);           // few pages: show them all
  const left = Math.max(current - siblings, 1);
  const right = Math.min(current + siblings, total);
  const leftGap = left > 3, rightGap = right < total - 2;
  if (!leftGap && rightGap) return [...range(1, 3 + 2 * siblings), '…', total];
  if (leftGap && !rightGap) return [1, '…', ...range(total - (2 + 2 * siblings), total)];
  return [1, '…', ...range(left, right), '…', total];
}
for (const p of [1, 4, 5, 10, 17, 20]) console.log(`page ${p}:`, pageItems(p, 20).join(' '));
console.log('7 pages:', pageItems(3, 7).join(' '));
```

**Follow-ups:** server-side pagination and sorting (send `?page=&sort=&q=` and debounce the search); keeping state in the URL; column resizing and sticky headers; virtualising 10,000 rows; selecting rows with "select all on this page".

### Q: Nested file explorer (folders, files, add and delete) [Core] [Medium] [React]

**Requirements:** render a nested folder tree; expand and collapse folders; add a file or folder inside any folder; delete items. **The key insight:** keep the tree in **one state object at the root**, update it with **pure, immutable helper functions**, and render it with a **recursive component**.

```js run
// pure tree helpers: easy to unit test, return new objects along the changed path
function insertNode(node, parentId, newNode) {
  if (!node.isFolder) return node;
  if (node.id === parentId) return { ...node, children: [newNode, ...node.children] };
  return { ...node, children: node.children.map(c => insertNode(c, parentId, newNode)) };
}
function deleteNode(node, id) {
  if (!node.isFolder) return node;
  return { ...node, children: node.children.filter(c => c.id !== id).map(c => deleteNode(c, id)) };
}
function renameNode(node, id, name) {
  if (node.id === id) return { ...node, name };
  return node.isFolder ? { ...node, children: node.children.map(c => renameNode(c, id, name)) } : node;
}
const print = (node, depth = 0) => [ '  '.repeat(depth) + (node.isFolder ? '📁 ' : '📄 ') + node.name,
  ...(node.isFolder ? node.children.flatMap(c => print(c, depth + 1)) : [])];

let tree = { id: 'root', name: 'project', isFolder: true, children: [
  { id: 'src', name: 'src', isFolder: true, children: [{ id: 'app', name: 'App.jsx', isFolder: false }] },
  { id: 'pkg', name: 'package.json', isFolder: false },
] };
tree = insertNode(tree, 'src', { id: 'hooks', name: 'hooks', isFolder: true, children: [] });
tree = insertNode(tree, 'hooks', { id: 'h1', name: 'useDebounce.js', isFolder: false });
tree = renameNode(tree, 'app', 'App.tsx');
tree = deleteNode(tree, 'pkg');
console.log(print(tree).join('\n'));
```

```jsx
export default function FileExplorer({ initialTree }) {
  const [tree, setTree] = useState(initialTree);
  const onAdd = useCallback((parentId, node) => setTree(t => insertNode(t, parentId, node)), []);
  const onDelete = useCallback(id => setTree(t => deleteNode(t, id)), []);
  return <ul role="tree" aria-label="Files"><TreeNode node={tree} level={1} onAdd={onAdd} onDelete={onDelete} /></ul>;
}

function TreeNode({ node, level, onAdd, onDelete }) {
  const [open, setOpen] = useState(level === 1);
  const [adding, setAdding] = useState(null);            // 'file' | 'folder' | null

  if (!node.isFolder) {
    return (
      <li role="treeitem" aria-level={level}>
        📄 {node.name} <button onClick={() => onDelete(node.id)} aria-label={`Delete ${node.name}`}>🗑</button>
      </li>
    );
  }
  const submit = e => {
    const name = e.currentTarget.value.trim();
    if (e.key === 'Escape') setAdding(null);
    if (e.key !== 'Enter' || !name) return;
    onAdd(node.id, adding === 'folder'
      ? { id: crypto.randomUUID(), name, isFolder: true, children: [] }
      : { id: crypto.randomUUID(), name, isFolder: false });
    setAdding(null);
  };
  return (
    <li role="treeitem" aria-level={level} aria-expanded={open}>
      <button onClick={() => setOpen(o => !o)}>{open ? '📂' : '📁'} {node.name}</button>
      <button onClick={() => { setOpen(true); setAdding('folder'); }} aria-label={`New folder in ${node.name}`}>+📁</button>
      <button onClick={() => { setOpen(true); setAdding('file'); }} aria-label={`New file in ${node.name}`}>+📄</button>
      {level > 1 && <button onClick={() => onDelete(node.id)} aria-label={`Delete ${node.name}`}>🗑</button>}
      {open && (
        <ul role="group">
          {adding && <li><input autoFocus placeholder={`${adding} name`} onKeyDown={submit} onBlur={() => setAdding(null)} /></li>}
          {node.children.map(child => <TreeNode key={child.id} node={child} level={level + 1} onAdd={onAdd} onDelete={onDelete} />)}
        </ul>
      )}
    </li>
  );
}
```

**Follow-ups:** sort folders before files; rename inline; prevent duplicate names; drag and drop to move nodes (watch for moving a folder into its own descendant); keyboard navigation for the tree (arrow keys to expand and collapse); lazy-loading children from an API; normalising the tree into a `byId` map for O(1) updates in huge trees.

### Q: Nested comments with replies [Medium] [React]

**Requirements:** show comments with unlimited nesting; reply to any comment; collapse threads; show reply counts. **State design:** store comments **normalised** (a flat map by id plus child id lists), so adding a reply is an O(1) update instead of a deep tree walk.

```js run
function addComment(state, { id, text, parentId = null }) {
  const comment = { id, text, parentId, childIds: [] };
  const byId = { ...state.byId, [id]: comment };
  if (parentId) byId[parentId] = { ...byId[parentId], childIds: [...byId[parentId].childIds, id] };
  return { byId, rootIds: parentId ? state.rootIds : [...state.rootIds, id] };
}
const countReplies = (state, id) => state.byId[id].childIds.reduce((n, c) => n + 1 + countReplies(state, c), 0);

let s = { byId: {}, rootIds: [] };
s = addComment(s, { id: 'c1', text: 'Great article!' });
s = addComment(s, { id: 'c2', text: 'Thanks!', parentId: 'c1' });
s = addComment(s, { id: 'c3', text: 'Agreed', parentId: 'c2' });
s = addComment(s, { id: 'c4', text: 'Second thread' });
const show = (id, d = 0) => [`${'  '.repeat(d)}- ${s.byId[id].text}`, ...s.byId[id].childIds.flatMap(c => show(c, d + 1))];
console.log(s.rootIds.flatMap(id => show(id)).join('\n'));
console.log('replies under c1:', countReplies(s, 'c1'));
```

```jsx
function Comment({ id, state, onReply }) {
  const c = state.byId[id];
  const [replying, setReplying] = useState(false);
  const [collapsed, setCollapsed] = useState(false);
  return (
    <li>
      <p>{c.text}</p>
      <button onClick={() => setReplying(r => !r)}>Reply</button>

### Q: Modal dialog with portal, focus trap and scroll lock [Core] [Medium] [React]

**Requirements:** render above everything, close on Esc and on backdrop click, trap focus inside, return focus to the opener, lock page scroll. (The [accessibility page](#/a11y) shows the shorter native `<dialog>` version; interviewers often want the manual one too.)

```jsx
import { createPortal } from 'react-dom';
const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

export function Modal({ open, onClose, title, children }) {
  const dialogRef = useRef(null);
  const onCloseRef = useRef(onClose);
  const titleId = useId();
  useEffect(() => { onCloseRef.current = onClose; });       // inline onClose props won't re-run the effect

  useEffect(() => {
    if (!open) return;
    const opener = document.activeElement;
    const dialog = dialogRef.current;
    (dialog.querySelector(FOCUSABLE) ?? dialog).focus();

    const onKeyDown = e => {
      if (e.key === 'Escape') { e.stopPropagation(); onCloseRef.current(); return; }
      if (e.key !== 'Tab') return;
      const nodes = [...dialog.querySelectorAll(FOCUSABLE)];
      if (!nodes.length) { e.preventDefault(); return; }
      const first = nodes[0], last = nodes[nodes.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', onKeyDown);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';                  // scroll lock
    return () => {
      document.removeEventListener('keydown', onKeyDown);
      document.body.style.overflow = prevOverflow;
      opener?.focus?.();                                      // restore focus
    };
  }, [open]);

  if (!open) return null;
  return createPortal(
    <div className="backdrop" onMouseDown={e => { if (e.target === e.currentTarget) onCloseRef.current(); }}>
      <div ref={dialogRef} role="dialog" aria-modal="true" aria-labelledby={titleId} tabIndex={-1} className="modal">
        <h2 id={titleId}>{title}</h2>
        {children}
        <button onClick={() => onCloseRef.current()} aria-label="Close dialog">×</button>
      </div>
    </div>,
    document.body,
  );
}
```

**Follow-ups:** stacked modals (only the top one handles Esc); `inert` on the app root; enter and exit animations (keep it mounted during the exit animation); preventing layout shift from the scrollbar disappearing (`scrollbar-gutter: stable`).

export function OtpInput({ length = 6, onComplete }) {
  const [digits, setDigits] = useState(() => Array(length).fill(''));
  const refs = useRef([]);
  const focus = i => refs.current[Math.max(0, Math.min(length - 1, i))]?.focus();

  const fill = (start, chars) => {
    const next = [...digits];
    let i = start;
    for (const ch of chars) { if (i >= length) break; next[i++] = ch; }
    setDigits(next);
    focus(i);
    if (next.every(Boolean)) onComplete?.(next.join(''));
  };

  return (
    <div role="group" aria-label="Verification code">
      {digits.map((d, i) => (
        <input
          key={i} ref={el => { refs.current[i] = el; }} value={d} aria-label={`Digit ${i + 1} of ${length}`}
          inputMode="numeric" autoComplete={i === 0 ? 'one-time-code' : 'off'}
          onFocus={e => e.target.select()}
          onChange={e => {
            const v = e.target.value.replace(/\D/g, '');
            if (!v) return;
            fill(i, v.length > 1 && d ? v.slice(-1) : v);   // typed over a digit vs SMS autofill of the whole code
          }}
          onKeyDown={e => {
            if (e.key === 'Backspace') {
              e.preventDefault();
              const next = [...digits];
              if (next[i]) next[i] = ''; else if (i > 0) { next[i - 1] = ''; focus(i - 1); }
              setDigits(next);
            } else if (e.key === 'ArrowLeft') focus(i - 1);
            else if (e.key === 'ArrowRight') focus(i + 1);
          }}
          onPaste={e => { e.preventDefault(); fill(i, e.clipboardData.getData('text').replace(/\D/g, '')); }}
        />
      ))}
    </div>
  );
}
```

### Q: Tic-tac-toe (and generalise to n × n) [Medium] [React]

**Requirements:** two players alternate; detect a win or a draw; show whose turn it is; reset; extensions: an n × n board, undo, and time travel through past moves.

**State design:** `history` (an array of boards) and `step`. The current board, the next player and the winner are all **derived**, which makes undo and time travel free.

```js run
function getWinner(board, n) {
  const lines = [];
  for (let r = 0; r < n; r++) lines.push(Array.from({ length: n }, (_, c) => r * n + c));   // rows
  for (let c = 0; c < n; c++) lines.push(Array.from({ length: n }, (_, r) => r * n + c));   // columns
  lines.push(Array.from({ length: n }, (_, i) => i * n + i));                                // diagonal
  lines.push(Array.from({ length: n }, (_, i) => i * n + (n - 1 - i)));                      // anti-diagonal
  for (const line of lines) {
    const first = board[line[0]];
    if (first && line.every(i => board[i] === first)) return first;
  }
  return board.every(Boolean) ? 'draw' : null;
}

// O(1)-per-move follow-up: keep counters per row, column and diagonal (+1 for X, −1 for O)
class FastWinChecker {
  constructor(n) { this.n = n; this.rows = Array(n).fill(0); this.cols = Array(n).fill(0); this.diag = 0; this.anti = 0; }
  move(r, c, player) {
    const v = player === 'X' ? 1 : -1, n = this.n;
    this.rows[r] += v; this.cols[c] += v;
    if (r === c) this.diag += v;
    if (r + c === n - 1) this.anti += v;
    return [this.rows[r], this.cols[c], this.diag, this.anti].some(x => Math.abs(x) === n) ? player : null;
  }
}

console.log(getWinner(['X', 'X', 'X', 'O', 'O', null, null, null, null], 3));
console.log(getWinner(['X', 'O', 'X', 'X', 'O', 'O', 'O', 'X', 'X'], 3));
console.log(getWinner(Array(16).fill(null).map((_, i) => (i % 5 === 0 ? 'O' : null)), 4));
const fast = new FastWinChecker(3);
console.log(fast.move(0, 2, 'O'), fast.move(1, 1, 'O'), fast.move(2, 0, 'O'));
```

```jsx
export function TicTacToe({ n = 3 }) {
  const [history, setHistory] = useState([Array(n * n).fill(null)]);
  const [step, setStep] = useState(0);
  const board = history[step];
  const winner = getWinner(board, n);
  const player = step % 2 === 0 ? 'X' : 'O';

  const play = i => {
    if (board[i] || winner) return;
    const next = board.with(i, player);
    setHistory(h => [...h.slice(0, step + 1), next]);       // drop any "future" after time travel
    setStep(s => s + 1);
  };
  return (
    <div>
      <p aria-live="polite">{winner === 'draw' ? "It's a draw" : winner ? `${winner} wins!` : `${player}'s turn`}</p>
      <div role="grid" style={{ display: 'grid', gridTemplateColumns: `repeat(${n}, 3rem)` }}>
        {board.map((cell, i) => (
          <button key={i} onClick={() => play(i)} aria-label={`Row ${Math.floor(i / n) + 1}, column ${(i % n) + 1}: ${cell ?? 'empty'}`}>
            {cell}
          </button>
        ))}
      </div>
      <button onClick={() => setStep(s => Math.max(0, s - 1))} disabled={step === 0}>Undo</button>
      <button onClick={() => { setHistory([Array(n * n).fill(null)]); setStep(0); }}>Reset</button>
    </div>
  );
}
```

export function Stopwatch() {
  const [elapsed, setElapsed] = useState(0);
  const [running, setRunning] = useState(false);
  const [laps, setLaps] = useState([]);
  const startRef = useRef(0);
  const elapsedRef = useRef(0);
  elapsedRef.current = elapsed;

  useEffect(() => {
    if (!running) return;
    startRef.current = performance.now() - elapsedRef.current;     // resume where we paused
    let frame;
    const tick = () => { setElapsed(performance.now() - startRef.current); frame = requestAnimationFrame(tick); };
    frame = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(frame);
  }, [running]);

      <button onClick={() => { setRunning(false); setElapsed(0); setLaps([]); }}>Reset</button>
      <ol reversed>{laps.map((t, i) => <li key={laps.length - i}>{formatTime(t)}</li>)}</ol>
    </div>
  );
}

### Q: Progress bars that run at most 3 at a time [Medium] [React]

**Requirements:** an "Add" button appends a progress bar that fills from 0 to 100% in 2 seconds. At most 3 bars fill at once; the rest queue and start as soon as a slot frees up. (A UI version of the [promise pool](#/js-coding).)

```jsx
const DURATION = 2000, LIMIT = 3, TICK = 50, STEP = (100 * TICK) / DURATION;

export function ProgressQueue() {
  const [bars, setBars] = useState([]);                       // { id, progress }

  useEffect(() => {
    const id = setInterval(() => {
      setBars(prev => {
        let slots = LIMIT, changed = false;
        const next = prev.map(b => {
          if (b.progress >= 100 || slots === 0) return b;     // finished, or waiting in the queue
          slots--; changed = true;
          return { ...b, progress: Math.min(100, b.progress + STEP) };
        });
        return changed ? next : prev;                         // same reference → no re-render when idle
      });
    }, TICK);
    return () => clearInterval(id);
  }, []);

  return (
    <div>
      <button onClick={() => setBars(b => [...b, { id: crypto.randomUUID(), progress: 0 }])}>Add</button>
      {bars.map(b => (
        <div key={b.id} role="progressbar" aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(b.progress)}
          style={{ height: 8, background: '#eee', margin: '6px 0' }}>
          <div style={{ width: `${b.progress}%`, height: '100%', background: 'seagreen' }} />
        </div>
      ))}
    </div>
  );
}
```

const ToastContext = createContext(null);

export function ToastProvider({ children, max = 5 }) {
  const [toasts, setToasts] = useState([]);
  const timers = useRef(new Map());

  const dismiss = useCallback(id => {
    setToasts(ts => ts.filter(t => t.id !== id));
    clearTimeout(timers.current.get(id));
    timers.current.delete(id);
  }, []);

  const show = useCallback((message, { type = 'info', duration = 4000 } = {}) => {
    const id = crypto.randomUUID();
    setToasts(ts => [...ts, { id, message, type }].slice(-max));
    if (duration) timers.current.set(id, setTimeout(() => dismiss(id), duration));
    return id;
  }, [dismiss, max]);

  useEffect(() => () => timers.current.forEach(clearTimeout), []);
  const api = useMemo(() => ({ show, dismiss }), [show, dismiss]);   // stable: consumers don't re-render

  return (
    <ToastContext.Provider value={api}>
      {children}
      {createPortal(
        <div className="toasts" aria-live="polite" aria-relevant="additions">
          {toasts.map(t => (
            <div key={t.id} className={`toast toast--${t.type}`} role={t.type === 'error' ? 'alert' : undefined}>
              {t.message}
              <button onClick={() => dismiss(t.id)} aria-label="Dismiss notification">×</button>
            </div>
          ))}
        </div>,
        document.body,
      )}
    </ToastContext.Provider>
  );
}

export function useToast() {
  const ctx = useContext(ToastContext);
  if (!ctx) throw new Error('useToast must be used inside <ToastProvider>');
  return ctx;
}

const LIGHTS = { red: { next: 'green', ms: 40 }, green: { next: 'yellow', ms: 30 }, yellow: { next: 'red', ms: 10 } };
function runLights(start, cycles, onChange) {
  let state = start, changes = 0;
  const step = () => {
    onChange(state);
    if (++changes >= cycles) return;
    setTimeout(() => { state = LIGHTS[state].next; step(); }, LIGHTS[state].ms);
  };
  step();
}
