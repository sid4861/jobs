- **`MutationObserver`**: watches DOM changes (third-party widgets, editors).
- **`PerformanceObserver`**: collects performance entries (LCP, layout shifts, long tasks, resource timing).

They all replace expensive polling, or scroll and resize listeners that call `getBoundingClientRect` in a loop.
</script>

<script type="text/x-prep" id="p-perf" data-group="Web platform" data-title="Performance & Core Web Vitals" data-short="Performance" data-lede="How to measure and improve loading, interactivity and visual stability. Bring numbers from your own projects to these questions; they are the strongest signal in a senior loop.">
## Measuring

### Q: What are the Core Web Vitals, and what are good values? [Core] [Easy]

| Metric | Measures | Good | Poor |
|---|---|---|---|
| **LCP**: Largest Contentful Paint | Loading: when the largest image or text block in the viewport is painted | ≤ 2.5 s | > 4 s |
| **INP**: Interaction to Next Paint | Responsiveness: the slowest typical delay from a user interaction to the next frame, over the page's whole life | ≤ 200 ms | > 500 ms |
| **CLS**: Cumulative Layout Shift | Visual stability: how much visible content unexpectedly moves | ≤ 0.1 | > 0.25 |

They're assessed at the **75th percentile** of real-user page loads. INP **replaced FID** as a Core Web Vital in March 2024. Supporting metrics: **TTFB** (server response time), **FCP** (first content painted) and **TBT** (Total Blocking Time, the lab proxy for responsiveness).

### Q: Lab data vs field data: how do you measure performance properly? [Core] [Medium]

- **Lab (synthetic):** Lighthouse, WebPageTest, the DevTools Performance panel. Controlled and repeatable, great for debugging and CI budgets, but not real users.
- **Field (RUM):** data from real users on real devices and networks: the Chrome UX Report (CrUX, shown in PageSpeed Insights and Search Console), or your own collection with the `web-vitals` library sent to analytics. This is what users experience and what Google uses for ranking.

A mature setup: `web-vitals` → analytics (segmented by page, device and country) → dashboards and alerts; Lighthouse CI with **performance budgets** on every pull request; the Performance panel for deep dives. Indian users skew towards mid-range Android phones on variable 4G, so test with CPU throttling (4–6×) and a "Fast 4G" or "Slow 4G" profile.

```js
import { onLCP, onINP, onCLS } from 'web-vitals';
const send = metric => navigator.sendBeacon('/analytics', JSON.stringify({ name: metric.name, value: metric.value, rating: metric.rating, id: metric.id, page: location.pathname }));
onLCP(send); onINP(send); onCLS(send);
```

## Improving the vitals

### Q: How do you improve LCP? [Core] [Medium]

Break LCP into its parts and fix the biggest one:
1. **TTFB:** CDN, caching, edge or streaming SSR, fewer redirects, faster backend queries.
2. **Resource load delay:** make the LCP resource discoverable early. Put it in the HTML (not a JS-rendered or CSS-background image), add `fetchpriority="high"` or `<link rel="preload">`, never lazy-load it, and `preconnect` to its origin.
3. **Resource load time:** compress (AVIF/WebP), size responsively (`srcset`), use an image CDN.
4. **Render delay:** remove render-blocking CSS and JS (critical CSS, `defer`), avoid client-only rendering of the hero (SSR or SSG), and make sure fonts don't hide text (`font-display: swap`, preload key fonts).

### Q: How do you improve INP? [Core] [Medium]

INP = input delay (main thread busy) + processing time (your handlers) + presentation delay (rendering the next frame).
- **Break up long tasks** (over 50 ms): yield with `scheduler.yield()` or `setTimeout`, chunk work, move heavy computation to a **Web Worker**.
- **Do less in handlers:** give immediate visual feedback first, then defer non-urgent work (analytics, saving) with `requestIdleCallback` or after the next paint.
- **React:** avoid huge re-renders (memoise, split context, virtualise lists), use `useTransition` / `useDeferredValue` for expensive updates, and keep component trees shallow.
- **Reduce JavaScript:** less hydration work (islands, server components, partial hydration), fewer third-party scripts (load them lazily, or in a worker with Partytown).
- **Rendering cost:** smaller DOM (under ~1,500 nodes is a good target), `content-visibility: auto` for off-screen sections, and avoid layout thrashing.

### Q: What causes layout shifts (CLS), and how do you prevent them? [Core] [Easy]

Causes: images and videos without dimensions, ads, embeds and banners injected above content, web fonts swapping with different metrics (FOUT), and content inserted after data loads (skeletons of the wrong size). Fixes:
- Always set `width`/`height` or `aspect-ratio` on media and embeds; reserve space for ads with `min-height`.
- Insert dynamic content **below** the viewport, or in response to user input (shifts within 500 ms of an input don't count).
- Skeletons should match the final size.
- Fonts: `size-adjust` / `ascent-override` fallback metrics, `font-display: optional` or `swap` with a matched fallback, and preload key fonts.
- Animate with `transform`, not `top`/`height`, which push other content around.

## Loading strategy

### Q: What is code splitting, and how do you do it in React? [Core] [Medium]

Code splitting breaks one big bundle into chunks loaded **on demand**, so the first load only ships what the first screen needs. Bundlers split at dynamic `import()` calls.

- **Route-level splitting** is the biggest win: each page is its own chunk.
- **Component-level splitting** for heavy, rarely used UI: rich text editors, charts, modals, maps.
- Prefetch likely-next chunks on hover or when idle; group vendor code wisely so a deploy doesn't invalidate all caches.

```jsx
import { lazy, Suspense } from 'react';
const Reports = lazy(() => import('./pages/Reports'));          // separate chunk
const ChartEditor = lazy(() => import('./components/ChartEditor'));

function App() {
  return (
    <Suspense fallback={<PageSkeleton />}>
      <Routes>
        <Route path="/reports" element={<Reports />} />
      </Routes>
    </Suspense>
  );
}
// prefetch on intent: start loading the chunk when the user hovers the link
const prefetchReports = () => import('./pages/Reports');
```

### Q: How do you reduce JavaScript bundle size? [Core] [Medium]

1. **Measure:** `rollup-plugin-visualizer`, `webpack-bundle-analyzer`, `source-map-explorer`, the Coverage tab in DevTools.
2. **Tree shaking:** use ES-module builds, import specific functions (`import debounce from 'lodash-es/debounce'`), and mark packages `"sideEffects": false`.
3. **Replace heavy dependencies:** moment → date-fns or dayjs (or native `Intl`), lodash → native methods, a big icon library → only the icons you use.
4. **Split code** by route and component (above); lazy-load third-party widgets.
5. **Ship modern JavaScript** to modern browsers (no unnecessary polyfills), minify, and compress with Brotli.
6. **Budgets in CI** (e.g. `size-limit`) so the bundle doesn't creep back up.

### Q: How should web fonts be loaded? [Medium]

Self-host (or preconnect to the font CDN), use **WOFF2**, subset to the characters and weights you need (Latin plus Devanagari only if needed), `preload` the 1–2 critical files with `crossorigin`, use `font-display: swap` (or `optional` for minimal CLS), and match fallback metrics with `size-adjust`. Variable fonts can replace several weight files.

### Q: How do you render a list of 10,000 items without freezing the page? [Core] [Medium]

**Virtualisation (windowing):** only render the items currently visible plus a small overscan buffer, and position them inside a container sized to the full list height. The DOM stays at ~30 nodes instead of 10,000. Libraries: `react-window`, `@tanstack/react-virtual`. Alternatives: pagination, "load more", or `content-visibility: auto` for long static content.

```jsx
function VirtualList({ items, rowHeight = 40, height = 400, overscan = 5 }) {
  const [scrollTop, setScrollTop] = useState(0);
  const start = Math.max(0, Math.floor(scrollTop / rowHeight) - overscan);
  const end = Math.min(items.length, Math.ceil((scrollTop + height) / rowHeight) + overscan);
  return (
    <div style={{ height, overflowY: 'auto' }} onScroll={e => setScrollTop(e.currentTarget.scrollTop)}>
      <div style={{ height: items.length * rowHeight, position: 'relative' }}>
        {items.slice(start, end).map((item, i) => (
          <div key={item.id} style={{ position: 'absolute', top: (start + i) * rowHeight, height: rowHeight, left: 0, right: 0 }}>
            {item.label}
          </div>
        ))}
      </div>
    </div>
  );
}
```

Follow-ups: variable row heights (measure and cache them), keeping scroll position, keyboard navigation and accessibility (`aria-rowcount`, `aria-rowindex`).

### Q: What rendering strategies affect performance (CSR, SSR, SSG, streaming)? [Senior] [Medium]

See the comparison table in [React in depth](#/react-advanced). In short: **static generation** plus a CDN gives the best TTFB and LCP for content pages; **SSR with streaming** shows content fast for dynamic, personalised pages; **CSR** costs LCP and INP because nothing meaningful renders until the JavaScript downloads and runs. Hydration cost grows with page size, which is why server components and islands architectures ship less JavaScript.

### Q: How do you find what makes a page slow? (Walk through a debugging session.) [Senior] [Medium]

1. Start from **field data**: which page, which metric, which device class is bad?
2. Reproduce in the lab with throttling. In the DevTools **Performance** panel, record the load or the interaction and look at the main-thread flame chart for **long tasks** (red corners), layout/recalc-style blocks, and the network waterfall for late-discovered resources.
3. **Lighthouse** for a checklist; the **Coverage** tab for unused JS and CSS; the **Network** panel for render-blocking requests, request priority, cache headers and compression.
4. For React, use the **React DevTools Profiler** to see which components render, why, and for how long.
5. Fix the biggest item, measure again, and track the metric in production after the release.

### Q: How can you measure performance in code? [Medium]

Use the Performance API: `performance.now()` for high-resolution timing, `performance.mark()` / `measure()` for custom spans (they show up in the DevTools timeline), and `PerformanceObserver` for LCP, layout shifts, long tasks, long animation frames and resource timing.

```js run
performance.mark('filter-start');
const data = Array.from({ length: 200000 }, (_, i) => ({ id: i, active: i % 3 === 0 }));
const active = data.filter(d => d.active);
performance.mark('filter-end');
const m = performance.measure('filter', 'filter-start', 'filter-end');
console.log(active.length, 'active rows; measure name:', m.name, '| has duration:', m.duration >= 0);
```
</script>

<script type="text/x-prep" id="p-security" data-group="Web platform" data-title="Web security for frontend engineers" data-short="Security" data-lede="XSS, CSRF, CSP, clickjacking, token storage and OAuth: the attacks you're expected to recognise and the defences you're expected to build in by default.">
## Attacks & defences

### Q: What is XSS, and how do you prevent it? [Core] [Medium]

**Cross-site scripting** means getting attacker-controlled script to run in your origin, where it can read the DOM and tokens and act as the user.
- **Stored XSS:** malicious input is saved (a comment, a profile name) and rendered to other users.
- **Reflected XSS:** input from the URL is echoed into the page by the server.
- **DOM-based XSS:** client-side code writes untrusted data to a dangerous sink (`innerHTML`, `document.write`, `eval`, `setTimeout(string)`, `location = 'javascript:…'`, `href` attributes).

Defences, in layers:
1. **Escape by default:** React escapes text in JSX automatically. The escape hatches are `dangerouslySetInnerHTML`, `ref.current.innerHTML`, and URLs in `href`/`src`.
2. **Sanitise** any HTML you must render (DOMPurify), and **validate URLs**: allow only `http:`, `https:` and `mailto:` schemes in user-provided links, to block `javascript:` URLs.
3. **Content Security Policy** to block inline and unknown scripts even if an injection gets through.
4. **HttpOnly cookies** so a successful XSS can't steal the session.
5. **Trusted Types** (Chromium) to lock down DOM sinks at the platform level.

```jsx
// ❌ user-controlled HTML and URL
<div dangerouslySetInnerHTML={{ __html: comment.body }} />
<a href={profile.website}>site</a>        // "javascript:alert(document.cookie)" executes on click

// ✅
import DOMPurify from 'dompurify';
<div dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(comment.body) }} />
const safeUrl = url => { try { return ['http:', 'https:'].includes(new URL(url).protocol) ? url : '#'; } catch { return '#'; } };
<a href={safeUrl(profile.website)} rel="noopener noreferrer" target="_blank">site</a>
```

### Q: What is CSRF, and how do you prevent it? [Core] [Medium]

**Cross-site request forgery:** a malicious site makes the user's browser send a request to your site, and the browser **automatically attaches the user's cookies**, so it runs with their session (transfer money, change email).

Defences:
- **`SameSite=Lax` or `Strict` cookies**: the browser won't send them on cross-site POSTs. This is the default in modern browsers, and the main defence.
- **CSRF tokens:** a random token stored in the session and sent in a header or form field; an attacker's page can't read it. Variant: the double-submit cookie.
- Check the `Origin` / `Referer` headers on state-changing requests.
- Never change state on GET requests.
- Bearer tokens in an `Authorization` header aren't sent automatically, so they aren't vulnerable to CSRF (but storing them in JavaScript-readable storage makes XSS worse).

### Q: What is a Content Security Policy? Give an example. [Senior] [Medium]

CSP is an HTTP response header that tells the browser which sources of scripts, styles, images, frames and connections are allowed. Even if an attacker injects markup, their script won't run. Modern CSPs are **nonce- or hash-based** with `strict-dynamic`, rather than long allow-lists of domains. Roll it out with `Content-Security-Policy-Report-Only` first, collecting violation reports.

```http
Content-Security-Policy:
  default-src 'self';
  script-src 'nonce-r4nd0m' 'strict-dynamic';
  style-src 'self' 'nonce-r4nd0m';
  img-src 'self' https://images.example-cdn.com data:;
  connect-src 'self' https://api.example.com;
  frame-ancestors 'none';
  object-src 'none'; base-uri 'none';
  report-to csp-endpoint
```

### Q: What is clickjacking, and how do you prevent it? [Easy]

An attacker loads your site in an invisible iframe on top of a decoy page and tricks users into clicking your buttons (e.g. "Delete account"). Prevent framing with `Content-Security-Policy: frame-ancestors 'none'` (or a list of allowed parents), with the legacy `X-Frame-Options: DENY` as a fallback.

### Q: Where should a SPA store auth tokens: localStorage or cookies? [Core] [Senior]

- **localStorage / sessionStorage:** any script on the page can read them, so a single XSS (including from a compromised npm dependency or third-party script) leaks the token. Easy to use for cross-domain APIs, but the riskiest option.
- **HttpOnly, Secure, SameSite cookies:** JavaScript can't read them, which mitigates token theft through XSS (XSS can still make requests while the page is open). You need CSRF protection (SameSite plus tokens) and a same-site API or a BFF.
- **In-memory access token + HttpOnly refresh cookie:** a short-lived access token kept in a JavaScript variable (lost on refresh), refreshed silently through an HttpOnly cookie endpoint. A common compromise for SPAs calling APIs on other domains.
- **Backend-for-Frontend (BFF):** the browser only has a session cookie; the BFF holds the OAuth tokens and proxies API calls. This is the current recommendation for high-security apps.

Whatever you choose: short token lifetimes, refresh token rotation, logout that revokes the server session, and never put tokens in URLs.

### Q: Explain the OAuth 2.0 Authorization Code flow with PKCE for SPAs. [Senior] [Medium]

1. The app creates a random `code_verifier` and its SHA-256 hash, the `code_challenge`.
2. It redirects to the authorisation server with `response_type=code`, `client_id`, `redirect_uri`, `scope`, `state` (CSRF protection) and `code_challenge`.
3. The user logs in and consents; the server redirects back with a one-time `code` and the `state` (which the app checks).
4. The app (or its BFF) exchanges the `code` **plus the `code_verifier`** for tokens. The server verifies the hash, so an intercepted code is useless without the verifier.
5. Tokens: an **access token** (short-lived, for APIs), a **refresh token** (to get new access tokens), and an **ID token** (OIDC: who the user is, as a JWT).

The old "implicit flow" (tokens in the URL fragment) is deprecated. OIDC is the identity layer on top of OAuth 2.0.

### Q: What is a JWT, and what are common mistakes with it? [Medium]

A JSON Web Token is `header.payload.signature`, each part base64url-encoded. The payload (claims such as `sub`, `exp`, `roles`) is **only encoded, not encrypted**: anyone can read it. The signature lets the server verify it wasn't tampered with. Mistakes: putting secrets or personal data in the payload; trusting a decoded token on the client for authorisation (the server must check); long expiry times without revocation; accepting the `alg: none` algorithm; and storing it in localStorage without considering XSS.

### Q: What other frontend security issues should you know? [Medium]

- **Supply chain:** malicious or compromised npm packages. Use lockfiles, `npm audit` / Dependabot, minimal dependencies, and **Subresource Integrity** (`integrity="sha384-…"`) for third-party scripts from CDNs.
- **Open redirects:** `?next=https://evil.com` after login. Only allow relative paths or allow-listed hosts.
- **Prototype pollution:** merging untrusted JSON into objects (`__proto__` keys) can change behaviour app-wide. Use `Object.create(null)` or `Map`, and validate keys.
- **`target="_blank"` without `rel="noopener"`** lets the opened page navigate yours (modern browsers now imply noopener).
- **Mixed content and HTTPS:** serve everything over HTTPS with HSTS.
- **Sensitive data in logs, analytics, source maps or client-side error reports.** Scrub personal data before it leaves the browser.
- **`postMessage`:** always check `event.origin`, and never use `'*'` as the target origin for sensitive data.
</script>

<script type="text/x-prep" id="p-a11y" data-group="Web platform" data-title="Accessibility (a11y)" data-short="Accessibility" data-lede="Semantic HTML, keyboard support, focus management, ARIA and testing. Large companies take accessibility seriously, and machine coding rounds often score it explicitly.">
## Principles

### Q: Why does accessibility matter, and what is WCAG? [Core] [Easy]

Accessibility means people with disabilities (visual, motor, hearing, cognitive) and people in difficult situations (bright sunlight, one hand busy, slow networks) can use your product. It's also a legal requirement in many markets (the ADA in the US, the European Accessibility Act, and the RPwD Act and GIGW guidelines in India for government and public services), and it improves SEO and usability for everyone.

**WCAG** (Web Content Accessibility Guidelines) is organised around **POUR**: **Perceivable** (text alternatives, captions, contrast), **Operable** (keyboard access, enough time, no seizure-inducing flashes), **Understandable** (readable, predictable, input help) and **Robust** (works with assistive technologies). Most companies target **WCAG 2.1 or 2.2, level AA**.

### Q: What is the first rule of ARIA? [Core] [Easy]

**Don't use ARIA if a native HTML element or attribute already does the job.** A `<button>` gives you focusability, keyboard activation, the role and disabled state for free; `<div role="button">` needs `tabindex="0"`, key handlers for Enter and Space, and `aria-disabled`, and is still easy to get wrong. ARIA changes only what assistive technologies are **told**, not how the element **behaves**. "No ARIA is better than bad ARIA."

## Keyboard & focus

### Q: How do you make a UI fully keyboard accessible? [Core] [Medium]

- Everything clickable must be **focusable** and **operable by keyboard**: Tab and Shift+Tab to move, Enter/Space to activate, Esc to close, and arrow keys inside composite widgets (tabs, menus, listboxes, grids).
- Keep a logical **focus order** that follows the DOM; don't use positive `tabindex` values.
- **Visible focus**: never remove outlines without a replacement; style `:focus-visible`.
- Add a **skip link** ("Skip to main content") as the first focusable element.
- `tabindex="0"` makes a custom element focusable in normal order; `tabindex="-1"` makes it focusable from script only (for moving focus to headings and containers).
- For composite widgets, use a **roving tabindex** (only the active item has `tabindex="0"`) or `aria-activedescendant`.

### Q: How do you manage focus in a modal dialog and in a SPA? [Core] [Medium]

**Modals:** when one opens, move focus into it (to the first field or the dialog itself), **trap** Tab inside it, close on Esc, mark the background inert (`inert` attribute, or `aria-modal="true"` on the dialog), and on close **return focus** to the element that opened it. The native `<dialog>` element with `showModal()` does most of this for you.

**SPA route changes:** the browser doesn't announce a new page, so move focus to the new page's `<h1>` (with `tabindex="-1"`) or a skip target, update `document.title`, and optionally announce the change through an `aria-live` region.

```jsx
function Modal({ open, onClose, title, children }) {
  const ref = useRef(null);
  useEffect(() => {
    const dialog = ref.current;
    if (!dialog) return;
    if (open && !dialog.open) dialog.showModal();     // native: focus trap, Esc, top layer, inert background
    if (!open && dialog.open) dialog.close();
  }, [open]);
  return (
    <dialog ref={ref} onClose={onClose} aria-labelledby="modal-title">
      <h2 id="modal-title">{title}</h2>
      {children}
      <button onClick={onClose}>Close</button>
    </dialog>
  );
}
```

## ARIA & content

### Q: Explain `aria-label`, `aria-labelledby`, `aria-describedby` and `aria-live`. [Core] [Medium]

- `aria-label="Close"` gives an accessible name directly, e.g. for icon-only buttons.
- `aria-labelledby="id1 id2"` uses visible text elsewhere as the name. It takes precedence over `aria-label`.
- `aria-describedby="hint-id"` adds a description read after the name (hints, error messages).
- `aria-live="polite" | "assertive"` on a container makes screen readers announce changes inside it (toasts, "3 results found", form errors). The region must exist **before** its content changes. `role="status"` is a polite live region and `role="alert"` an assertive one.
- State attributes: `aria-expanded` (accordions, menus), `aria-selected` (tabs), `aria-checked`, `aria-current="page"` (current nav link), `aria-invalid`, `aria-hidden="true"` (hide decorative content; never use it on focusable elements).

### Q: How do you build an accessible accordion or disclosure? [Medium]

Each header is a real `<button>` inside a heading, with `aria-expanded` and `aria-controls` pointing to its panel. The panel gets `role="region"` and `aria-labelledby` when it's an important landmark. Enter and Space toggle it (free with a button); arrow-key navigation between headers is optional.

```jsx
function AccordionItem({ id, title, children, open, onToggle }) {
  return (
    <div>
      <h3>
        <button id={`${id}-btn`} aria-expanded={open} aria-controls={`${id}-panel`} onClick={onToggle}>
          {title}
        </button>
      </h3>
      <div id={`${id}-panel`} role="region" aria-labelledby={`${id}-btn`} hidden={!open}>
        {children}
      </div>
    </div>
  );
}
```

### Q: What are the rules for alt text, colour and motion? [Easy]

- **Images:** describe the purpose (`alt="Download invoice"` for an icon link). Use an empty `alt=""` for decorative images so screen readers skip them. Never leave `alt` out, or the file name gets read.
- **Colour contrast:** 4.5:1 for normal text and 3:1 for large text and UI components (WCAG AA). Never convey meaning by colour alone; add icons, text or patterns (error states, chart series).
- **Motion:** respect `prefers-reduced-motion`; avoid auto-playing carousels and video, or give them pause controls; nothing should flash more than 3 times a second.
- **Text resizing:** the layout must work at 200% zoom and with large user font sizes (use `rem`).
- **Touch targets:** at least 24×24 CSS px (WCAG 2.2 AA), ideally 44×44.

### Q: How do you test accessibility? [Core] [Easy]

1. **Automated:** axe DevTools or Lighthouse in the browser, `eslint-plugin-jsx-a11y` in the editor, `jest-axe` or `@axe-core/playwright` in tests. These catch around 30–40% of issues (contrast, missing labels, invalid ARIA).
2. **Keyboard-only pass:** unplug the mouse and complete the key flows. Can you see focus? Can you escape every overlay?
3. **Screen readers:** NVDA (free) on Windows, VoiceOver on macOS and iOS, TalkBack on Android. Check names, roles, states and announcements.
4. **Zoom to 200%**, Windows high-contrast mode, and reduced motion.
5. Include accessibility in the definition of done and in design reviews, not just QA.
</script>

<script type="text/x-prep" id="p-react-core" data-group="React" data-title="React fundamentals & hooks" data-short="React fundamentals" data-lede="Rendering, reconciliation, keys, state, effects, refs, memoisation and context. You use these every day; interviews test whether you can explain why they behave the way they do.">
## Rendering model

### Q: What is React, and what does "declarative UI" mean? [Core] [Easy]

React is a library for building UIs from **components**: functions that take props and state and return a description of the UI. **Declarative** means you describe _what_ the UI should look like for a given state (`isOpen ? <Menu/> : null`), and React works out _how_ to update the DOM to match. In imperative code you would add and remove nodes by hand. UI becomes a function of state, `UI = f(state)`, which makes it predictable, testable and composable.

### Q: What does JSX compile to? [Core] [Easy]

JSX is syntax sugar. With the modern automatic runtime (React 17+), `<Button kind="primary">Save</Button>` compiles to `jsx(Button, { kind: 'primary', children: 'Save' })` (previously `React.createElement(Button, { kind: 'primary' }, 'Save')`). The result is a plain object, a **React element**, describing what to render. Consequences: JSX expressions must have one root (use a fragment), attributes are camelCase (`className`, `htmlFor`, `onClick`), and `{}` takes any JavaScript **expression** (not statements like `if` or `for`).

### Q: What is the virtual DOM, and how does reconciliation work? [Core] [Medium]

Each render produces a tree of React elements (the "virtual DOM"). React compares (**diffs**) the new tree with the previous one and applies the minimum DOM changes. A general tree diff is O(n³), so React uses two heuristics that make it O(n):

1. **Different element types produce different trees.** If `<div>` becomes `<span>`, or `<ProfileA>` becomes `<ProfileB>`, React unmounts the whole old subtree (destroying its state) and mounts a new one.
2. **Keys identify children across renders.** Within a list, elements with the same key are matched, even if they moved.

If the type and key match, React keeps the DOM node or component instance (and its **state**), and updates only the changed props. The diffing happens in the **render phase**; DOM mutations happen in the **commit phase** (see [Fiber](#/react-advanced)).

> **Note:** the virtual DOM isn't "faster than the DOM". Its value is a declarative programming model with good-enough default performance. Svelte and Solid skip the virtual DOM entirely through compilation and fine-grained reactivity.

### Q: Why do lists need keys, and why is using the index as the key a problem? [Core] [Easy]

Keys tell React which item is which between renders. With the **index as key**, inserting, deleting or reordering items makes React match the wrong items. The **state and DOM of each row stick to the position**, not the item: inputs show the wrong text, checkboxes flip to the wrong rows, animations jump, and unchanged rows re-render. Use a **stable, unique id from the data**. The index is acceptable only if the list is static: never reordered, filtered or added to in the middle.

Keys also **reset** components: `<Profile key={userId} />` gives each user a fresh component instance with fresh state, which is often cleaner than syncing state in an effect.

### Q: When does a React component re-render? [Core] [Medium]

A component re-renders when:
1. **Its state changes** (`setState` with a different value; React bails out if `Object.is(old, new)`).
2. **Its parent re-renders**: by default **all children re-render**, whether or not their props changed.
3. **A context it consumes changes** (`useContext`).
4. A custom hook it uses triggers one of the above (e.g. a store subscription).

Props changing is not itself a trigger; it's a consequence of the parent re-rendering. Re-rendering means calling the function again and diffing the output. That's usually cheap, and the DOM is only touched if something differs. Prevent unnecessary renders by moving state down, passing components as `children`, or memoising with `React.memo` + `useMemo`/`useCallback` (and the React Compiler can automate this).

### Q: Props vs state? [Core] [Easy]

**Props** are inputs passed from the parent: read-only inside the component. **State** is data the component owns and changes over time, which triggers re-renders. Data flows **one way**, down through props; children communicate up by calling callback props. If two components need the same changing data, **lift the state** to their closest common parent. If a value can be computed from props or other state, **don't store it in state**; compute it during render ("derived state").

## State

### Q: Why doesn't state update immediately after `setState`? What is "state as a snapshot"? [Core] [Medium]

Calling `setCount(count + 1)` doesn't change the `count` variable in the current render. It **schedules** a re-render, and in that next render `useState` returns the new value. Each render's event handlers close over the state **of that render** (a snapshot). Updates in the same event are **batched** into one render (in React 18+, also inside promises, timeouts and native handlers).

```jsx
function Counter() {
  const [count, setCount] = useState(0);
  const addThree = () => {
    setCount(count + 1); setCount(count + 1); setCount(count + 1);   // all read the same snapshot: +1
  };
  const addThreeCorrectly = () => {
    setCount(c => c + 1); setCount(c => c + 1); setCount(c => c + 1); // updater functions queue: +3
  };
  return <button onClick={addThreeCorrectly}>{count}</button>;
}
```

> **Rule of thumb:** when the next state depends on the previous state, use the updater form `setX(prev => …)`.

### Q: How should you update objects and arrays in state? [Core] [Easy]

Never mutate. React compares references; a mutated object is the same reference, so React may skip the re-render, and memoised children will show stale data. Create new objects and arrays:

```jsx
setUser(u => ({ ...u, address: { ...u.address, city: 'Pune' } }));      // nested update
setTodos(ts => [...ts, newTodo]);                                         // add
setTodos(ts => ts.filter(t => t.id !== id));                             // remove
setTodos(ts => ts.map(t => (t.id === id ? { ...t, done: !t.done } : t))); // update one
setTodos(ts => ts.toSorted((a, b) => a.title.localeCompare(b.title)));   // sort without mutating
```

For deeply nested state, flatten (normalise) the shape or use Immer (`produce`, or Redux Toolkit, which has it built in).

### Q: When should you use `useReducer` instead of `useState`? [Medium]

Use `useReducer` when state has **several related fields** that change together, when the next state depends on complex logic, or when many event handlers update the same state (it centralises the logic and is easy to test as a pure function). `dispatch` has a stable identity, so it's safe to pass down without `useCallback`. Combined with context it gives a lightweight "Redux" for a feature.

```jsx
function formReducer(state, action) {
  switch (action.type) {
    case 'field': return { ...state, values: { ...state.values, [action.name]: action.value }, errors: { ...state.errors, [action.name]: undefined } };
    case 'submit': return { ...state, submitting: true };
    case 'error': return { ...state, submitting: false, errors: action.errors };
    case 'success': return { ...initialForm, submitted: true };
    default: throw new Error('Unknown action ' + action.type);
  }
}
const [state, dispatch] = useReducer(formReducer, initialForm);
```

### Q: Controlled vs uncontrolled components? [Core] [Easy]

- **Controlled:** React state is the single source of truth (`value` + `onChange`). Easy to validate, format and react to on every keystroke; every keystroke re-renders.
- **Uncontrolled:** the DOM keeps the value; you read it with a ref or `FormData` on submit (`defaultValue`). Less code and fewer re-renders, good for simple forms and file inputs (which are always uncontrolled).

Libraries like **React Hook Form** are mostly uncontrolled for performance; Formik is controlled. Don't switch a component between the two (passing `value={undefined}` and later a string triggers a warning).

### Q: What is derived state, and why is copying props into state an anti-pattern? [Medium]

If a value can be computed from props or other state, compute it **during render** instead of storing it. Copying props into state (`useState(props.items)`) creates two sources of truth: the state won't update when the prop changes, which leads to `useEffect` "sync" code and extra renders. For expensive computations use `useMemo`; to reset state when an identity changes, use a `key`.

```jsx
// ❌ duplicated state + effect to keep it in sync
const [visible, setVisible] = useState([]);
useEffect(() => { setVisible(items.filter(i => i.name.includes(query))); }, [items, query]);

// ✅ derive during render (memoise only if it's actually expensive)
const visible = useMemo(() => items.filter(i => i.name.includes(query)), [items, query]);
```

## Effects

### Q: How does `useEffect` work: dependencies, cleanup and timing? [Core] [Medium]

`useEffect(setup, deps)` runs `setup` **after React commits the render and the browser paints**. The dependency array decides when it re-runs:
- No array: after every render.
- `[]`: once after mount (twice in development Strict Mode, on purpose).
- `[a, b]`: after mount, and after any render where `a` or `b` changed (compared with `Object.is`).

If `setup` returns a function, React calls that **cleanup** before re-running the effect and on unmount. Effects are for **synchronising with external systems**: subscriptions, timers, WebSockets, manual DOM work, analytics, and data fetching when you're not using a library.

```jsx
useEffect(() => {
  const socket = connect(roomId);
  socket.on('message', onMessage);
  return () => socket.disconnect();     // runs before reconnecting to a new room, and on unmount
}, [roomId]);                            // re-sync whenever the room changes
```

> **Pitfall:** you probably **don't need an effect** for: computing values from props or state (derive during render), resetting state when a prop changes (use a `key`), or reacting to a user event (do it in the event handler).

### Q: What are the most common `useEffect` bugs? [Core] [Medium]

1. **Missing dependencies:** the effect uses stale props or state. Follow `eslint-plugin-react-hooks` (`exhaustive-deps`) instead of silencing it.
2. **Infinite loops:** setting state that is also a dependency, or depending on an object or array created during render (a new reference every time).
3. **No cleanup:** leaking intervals, listeners and subscriptions; setting state after unmount.
4. **Race conditions** when fetching: an older response overwrites a newer one. Fix with an `ignore` flag or `AbortController` in the cleanup.
5. **Effect chains:** one effect sets state that triggers another effect. Compute things in the handler or during render instead.

```jsx
useEffect(() => {
  const controller = new AbortController();
  setStatus('loading');
  fetch(`/api/users/${userId}`, { signal: controller.signal })
    .then(r => r.json())
    .then(data => { setUser(data); setStatus('done'); })
    .catch(err => { if (err.name !== 'AbortError') setStatus('error'); });
  return () => controller.abort();      // a new userId or unmount cancels the old request
}, [userId]);
```

### Q: `useEffect` vs `useLayoutEffect` (and `useInsertionEffect`)? [Core] [Medium]

- `useEffect` runs **after paint**, without blocking the browser. That's right for almost everything.
- `useLayoutEffect` runs **after DOM mutations but before the browser paints**, synchronously. Use it when you must **measure layout and then change it** without a visible flicker (tooltip or popover positioning, scroll restoration, measuring text). It blocks painting, so keep it fast. It doesn't run on the server.
- `useInsertionEffect` runs before layout effects; it's meant for CSS-in-JS libraries to inject styles.

### Q: Why does my effect run twice in development? [Core] [Easy]

In **React 18+ Strict Mode** (development only), React mounts every component, immediately unmounts it (running cleanups), and mounts it again. This surfaces effects that lack proper cleanup, the same bug that would appear in production with Fast Refresh, Offscreen/Activity components, or navigation. The fix is to write effects that clean up correctly (abort the fetch, unsubscribe), not to remove Strict Mode. For true "run once" logic (like app initialisation), use a module-level flag outside the component.

## Refs & memoisation

### Q: What is `useRef` used for? How is it different from state? [Core] [Easy]

`useRef(initial)` returns a mutable object `{ current }` that **persists across renders**. **Changing `.current` doesn't trigger a re-render.** Uses:
1. **DOM access:** focus an input, measure an element, integrate a non-React library (`<input ref={inputRef} />`).
2. **Mutable instance values** that shouldn't trigger renders: timer ids, the previous value, the latest callback, "is mounted" flags, an AbortController.

Don't read or write `ref.current` during rendering (except lazy initialisation); do it in effects and event handlers.

### Q: `useMemo` vs `useCallback` vs `React.memo`: when do they actually help? [Core] [Medium]

- `useMemo(() => compute(a, b), [a, b])` caches a **computed value** between renders.
- `useCallback(fn, deps)` caches a **function reference** (it's `useMemo(() => fn, deps)`).
- `React.memo(Component)` skips re-rendering a component when its props are **shallowly equal** to last time.

They help in two situations:
1. **Expensive calculations** (sorting or filtering thousands of rows, heavy formatting): `useMemo`.
2. **Keeping references stable** for a child wrapped in `React.memo`, or for values used as dependencies of other hooks: `useCallback` / `useMemo`.

`useCallback` on a function passed to a **non-memoised** child or a DOM element (`<button onClick>`) achieves nothing except overhead. Profile first. The **React Compiler** (stable since late 2025) adds this memoisation automatically at build time, so manual `useMemo`/`useCallback` matters less in compiler-enabled codebases. Interviewers still expect you to understand it.

```jsx
const Row = React.memo(function Row({ item, onSelect }) {
  return <li onClick={() => onSelect(item.id)}>{item.name}</li>;
});
function List({ items }) {
  const [selected, setSelected] = useState(null);
  const onSelect = useCallback(id => setSelected(id), []);              // stable reference → rows skip re-render
  const sorted = useMemo(() => items.toSorted((a, b) => a.name.localeCompare(b.name)), [items]);
  return <ul>{sorted.map(item => <Row key={item.id} item={item} onSelect={onSelect} />)}</ul>;
}
```

### Q: What is a stale closure in hooks? Show an example and the fixes. [Core] [Medium]

Every render creates new functions that capture **that render's** state. If a long-lived callback (an interval, a subscription, a debounced function) was created in an earlier render, it keeps seeing old values.

```jsx
function Timer() {
  const [count, setCount] = useState(0);
  useEffect(() => {
    const id = setInterval(() => {
      setCount(count + 1);       // ❌ `count` is always 0 here → stuck at 1
    }, 1000);
    return () => clearInterval(id);
  }, []);                        // effect created once, closure captured count = 0
}
```

Fixes:
1. **Updater function:** `setCount(c => c + 1)` doesn't need the current value.
2. **Correct dependencies** (`[count]`) to re-create the interval when count changes. This works, but restarts the timer.
3. **A ref to the latest value or callback** (`savedCallback.current = callback` on every render) for subscriptions. See [useInterval](#/react-hooks).
4. React's `useEffectEvent` (stable from React 19.2) is designed for "always read the latest value inside an effect callback".

## Context & composition

### Q: How does Context work, and what are its performance pitfalls? [Core] [Medium]

`createContext` + a Provider make a value available to any descendant through `useContext`, without passing props through every level (prop drilling). Good for **low-frequency, app-wide** data: theme, locale, the current user, feature flags, and dependency injection.

Pitfalls:
- **Every consumer re-renders whenever the context value changes**, and `React.memo` doesn't stop it.
- Passing a new object each render (`value={{ user, setUser }}`) re-renders all consumers on every provider render. Memoise the value with `useMemo`.
- Fixes: **split contexts** (separate the state and dispatch contexts, separate fast- and slow-changing data), move the provider down the tree, or use a store with selectors (Zustand, Redux, `useSyncExternalStore`) for frequently changing global state.

```jsx
const CartStateContext = createContext(null);
const CartDispatchContext = createContext(null);
function CartProvider({ children }) {
  const [state, dispatch] = useReducer(cartReducer, initialCart);
  return (
    <CartDispatchContext.Provider value={dispatch}>{/* dispatch is stable: these consumers never re-render from it */}
      <CartStateContext.Provider value={state}>{children}</CartStateContext.Provider>
    </CartDispatchContext.Provider>
  );
}
```

### Q: How do you avoid prop drilling? [Core] [Easy]

In order of preference:
1. **Component composition:** pass components as `children` or as props (slots), so intermediate layers don't need to know about the data (`<Layout sidebar={<UserMenu user={user} />}>`).
2. **Context** for data that many components at different depths need.
3. **A state library** (Redux Toolkit, Zustand, Jotai) for complex, frequently updated global state.
4. **Server-state libraries** (React Query, SWR) so components fetch and cache what they need instead of passing API data down.

### Q: Compare custom hooks, higher-order components and render props. [Core] [Medium]

All three share stateful logic between components.
- **Higher-order component** (`withAuth(Component)`) wraps a component and injects props. Downsides: "wrapper hell", prop-name collisions, and you can't see where a prop comes from.
- **Render props** (`<Mouse render={pos => …} />`) pass a function that receives the state. Flexible, but leads to nesting.
- **Custom hooks** (`useMousePosition()`) share logic without changing the component tree. They compose easily and are explicit about what you get. They're the default today; HOCs survive mostly for cross-cutting wrappers (error boundaries, analytics), and render props in some libraries.

Hooks share **logic**, not state: two components calling `useCounter()` each get their own state.

### Q: What are the Rules of Hooks, and why do they exist? [Core] [Easy]

1. Call hooks **only at the top level**: not inside conditions, loops, nested functions or after an early return.
2. Call hooks **only from React function components or custom hooks** (names starting with `use`).

React identifies each hook by its **call order** within the component (a list indexed by position, stored on the component's fiber). If a condition skips a hook on some renders, every hook after it reads the wrong slot of state. The ESLint plugin enforces this. (The new `use()` API is the exception: it may be called conditionally.)

### Q: What are fragments and portals? [Easy]

- **Fragments** (`<>…</>` or `<Fragment key=…>`) group children without adding a DOM node, which keeps tables, flex and grid layouts valid. Use the long form when you need a key in a list.
- **Portals** (`createPortal(child, document.body)`) render children into a different DOM node while keeping them in the same **React** tree: context still works, and **events still bubble through React ancestors**. Used for modals, tooltips, dropdowns and toasts that must escape `overflow: hidden` or stacking contexts.

### Q: What are error boundaries, and what don't they catch? [Core] [Medium]

An error boundary is a component that catches errors thrown **while rendering**, in lifecycle methods or in constructors of its **children**, and shows a fallback UI instead of unmounting the whole app. It must be a class component with `static getDerivedStateFromError` (to render the fallback) and/or `componentDidCatch` (to log). In practice teams use the `react-error-boundary` package.

They do **not** catch errors in **event handlers** (use try/catch), in **async code** (timeouts, promises), in **server-side rendering**, or in the boundary itself. Place boundaries around routes and independent widgets so one broken widget doesn't blank the page, and report errors to Sentry or a similar service.

```jsx
class ErrorBoundary extends React.Component {
  state = { error: null };
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { reportError(error, info.componentStack); }
  render() {
    if (this.state.error) return this.props.fallback ?? <p role="alert">Something went wrong.</p>;
    return this.props.children;
  }
}
```

### Q: How do class lifecycle methods map to hooks? [Easy]

| Class | Hooks equivalent |
|---|---|
| `constructor` (initial state) | `useState(initial)` / lazy `useState(() => compute())` |
| `componentDidMount` | `useEffect(() => {…}, [])` |
| `componentDidUpdate` (on prop change) | `useEffect(() => {…}, [prop])` |
| `componentWillUnmount` | Cleanup function returned from `useEffect` |
| `shouldComponentUpdate` | `React.memo` (props comparison) |
| `getDerivedStateFromProps` | Compute during render, or reset with a `key` |
| `getSnapshotBeforeUpdate` | `useLayoutEffect` (approximately) |
| `componentDidCatch` | No hook: still needs a class error boundary |

### Q: What's wrong with `{items.length && <List />}`? [Easy]

When `items.length` is `0`, the expression evaluates to `0`, and React renders the number **0** on the screen (it only skips `false`, `null`, `undefined` and `true`). Use `items.length > 0 && …`, `!!items.length && …`, or a ternary.

### Q: How does React handle events (synthetic events)? [Medium]

React wraps native events in a cross-browser **SyntheticEvent** with the same interface (`stopPropagation`, `preventDefault`, `target`). Since React 17, React attaches listeners at the **root container** (not `document`) and dispatches them through the React tree, so events from portals bubble to their React parents. Event pooling was removed in React 17, so you can use the event asynchronously. `onChange` on inputs fires on every keystroke (like the native `input` event). Native `addEventListener` handlers on the same elements still run, in a different order, so mixing the two is a common source of bugs.

### Q: How do refs to child components work: `forwardRef` and `useImperativeHandle`? [Medium]

Function components don't have instances, so to give a parent a ref to a child's DOM node, the child forwards it. Before React 19 that needed `forwardRef`; **in React 19, `ref` is a regular prop** for function components. `useImperativeHandle` customises what the parent receives: expose a small API (`focus`, `scrollToTop`) instead of the whole DOM node.

```jsx
function TextField({ label, ref, ...props }) {              // React 19: ref as a prop
  const inputRef = useRef(null);
  useImperativeHandle(ref, () => ({
    focus: () => inputRef.current.focus(),
    clear: () => { inputRef.current.value = ''; },
  }), []);
  return <label>{label}<input ref={inputRef} {...props} /></label>;
}
// parent: const fieldRef = useRef(); … fieldRef.current.focus();
```
</script>

<script type="text/x-prep" id="p-react-advanced" data-group="React" data-title="React in depth: rendering, state & architecture" data-short="React in depth" data-lede="Fiber, concurrent rendering, Suspense, SSR and hydration, server components, state management choices, performance work and patterns for large codebases: what separates SDE-2 and senior answers.">
## Under the hood

### Q: What is React Fiber, and why was it introduced? [Senior] [Medium]

Fiber is React's reconciliation engine (since React 16). The old "stack reconciler" rendered a whole tree in one synchronous recursive pass that couldn't be interrupted, so big updates blocked the main thread and dropped frames. Fiber re-implements the work as a linked tree of **fiber nodes** (one per component instance, holding its type, props, state, hooks list and effects). The work is split into small **units** that React can **pause, resume, prioritise or throw away**.

It works with two trees: the **current** tree (what's on screen) and the **work-in-progress** tree being built. When rendering completes, React swaps them in the commit phase. Fiber is what makes concurrent features possible: transitions, Suspense, time-slicing, and selective hydration.

### Q: What are the render phase and the commit phase? [Senior] [Medium]

- **Render phase:** React calls your components, runs hooks and diffs the result. It must be **pure** (no side effects), because it can be **paused, restarted or discarded** in concurrent rendering, and runs twice in Strict Mode development.
- **Commit phase:** React applies the DOM mutations synchronously (it can't be interrupted), sets refs, runs `useLayoutEffect` and then, after the browser paints, `useEffect`.

That's why side effects belong in effects or event handlers, never in the component body.

### Q: What is concurrent rendering? Explain `useTransition` and `useDeferredValue`. [Senior] [Medium]

Concurrent rendering (React 18+) lets React prepare multiple versions of the UI and **interrupt** low-priority rendering to handle urgent updates. You mark updates as non-urgent:

- `const [isPending, startTransition] = useTransition()`: updates inside `startTransition(() => setTab(next))` are **transitions**. React keeps showing the current UI (with `isPending` for a spinner) while it renders the new one in the background, and abandons that work if a newer update arrives. Typing stays responsive.
- `const deferred = useDeferredValue(value)`: returns a version of the value that "lags behind" during heavy renders. Pass `deferred` to the expensive child (a big filtered list) while the input uses the up-to-date value.

```jsx
function Search({ items }) {
  const [query, setQuery] = useState('');
  const deferredQuery = useDeferredValue(query);              // the list re-renders at lower priority
  const isStale = query !== deferredQuery;
  return (
    <>
      <input value={query} onChange={e => setQuery(e.target.value)} />  {/* always instant */}
      <div style={{ opacity: isStale ? 0.6 : 1 }}>
        <ExpensiveList query={deferredQuery} items={items} />          {/* wrap in memo so it skips urgent renders */}
      </div>
    </>
  );
}
```

> **Note:** these don't make rendering faster; they keep the UI responsive while slow rendering happens. Debouncing reduces work, transitions reprioritise it. They complement each other.

### Q: What is Suspense, and what can it suspend on? [Senior] [Medium]

`<Suspense fallback={…}>` shows a fallback while something inside it **isn't ready yet**, then reveals the content. A component "suspends" when it isn't ready, which React supports for:
1. **Lazy-loaded code:** `React.lazy(() => import('./X'))`.
2. **Data with Suspense-enabled sources:** Next.js and React Server Components, React Query or SWR in suspense mode, Relay, and the `use(promise)` API in React 19.
3. **Streaming SSR:** each Suspense boundary can be streamed in when its data is ready, and hydrated independently (selective hydration).

Boundaries let you design loading states declaratively: a page skeleton at the top, smaller skeletons for widgets, and nested boundaries to avoid "popcorn" UIs. Transitions keep already-revealed content on screen instead of falling back again.

### Q: What is the React Compiler? [Senior] [Easy]

A build-time compiler (a Babel/SWC plugin) that analyses your components and hooks and **automatically memoises** values, callbacks and JSX, which is roughly what you'd do by hand with `useMemo`, `useCallback` and `React.memo`, but more granular. It relies on code following the Rules of React (pure render, no mutation of props or state). It reached a stable 1.0 in late 2025 and is enabled by default in some framework templates. Interview angle: you should still understand referential equality and why memoisation is needed, but say that in compiler-enabled codebases you remove most manual memo calls.

## Server rendering

### Q: Compare CSR, SSR, SSG, ISR and streaming SSR. [Core] [Senior]

| Strategy | HTML produced | Pros | Cons | Fits |
|---|---|---|---|---|
| **CSR** (client-side rendering) | In the browser, after the JS loads | Simple hosting, rich interactivity, cheap servers | Slow first paint and LCP, weak SEO, big JS | Dashboards and apps behind a login |
| **SSR** (server-side rendering) | On each request | Fast first paint, SEO, personalised content | Server cost, TTFB depends on data, hydration cost | E-commerce product pages, feeds |
| **SSG** (static generation) | At build time | Fastest (served from a CDN), cheap, secure | Stale until rebuilt; slow builds for huge sites | Docs, blogs, marketing pages |
| **ISR** (incremental static regeneration) | Static, re-generated in the background after N seconds or on demand | Static speed with freshness | Brief staleness; framework-specific | Catalogues, CMS content |
| **Streaming SSR** | Sent in chunks as Suspense boundaries resolve | Fast TTFB, progressive content, selective hydration | More complex mental model | Data-heavy pages with slow parts |

Most real apps mix these per route. Next.js, Remix/React Router and Astro make that a per-page choice.

### Q: What is hydration, and what causes hydration mismatch errors? [Core] [Medium]

**Hydration** is React attaching event handlers and state to server-rendered HTML: it renders the same tree on the client and "adopts" the existing DOM instead of re-creating it. Until hydration finishes, the page is visible but **not interactive**.

A **mismatch** happens when the client's first render differs from the server HTML. Common causes:
- Values that differ between environments: `Date.now()`, `Math.random()`, `new Date().toLocaleString()` (server time zone and locale differ), random ids.
- Reading `window`, `localStorage` or `navigator` during render, so the server and client take different branches.
- Invalid HTML nesting that the browser silently fixes (`<div>` inside `<p>`, `<a>` inside `<a>`, missing `<tbody>`).
- Browser extensions modifying the DOM.

Fixes: render client-only values after mount (in `useEffect`, or `useSyncExternalStore` with a server snapshot), `useId` for stable ids, pass the time and locale from the server, fix the HTML structure, and use `suppressHydrationWarning` only for unavoidable cases like timestamps.

### Q: What are React Server Components (RSC)? [Senior] [Medium]

Server Components run **only on the server** (at build or request time). They can be `async`, read databases and files directly, and use secrets, and they send a serialised UI description to the client, **not their JavaScript**. Client Components (marked with `'use client'` at the top of the file) are the interactive ones: they can use state, effects, event handlers and browser APIs, and they ship JavaScript and hydrate.

- Benefits: less client JavaScript (big libraries such as markdown parsers stay on the server), no client–server waterfalls for data, secure data access, streaming.
- Rules: Server Components can import and render Client Components, and pass them **serialisable** props (no functions except Server Actions). Client Components can't import Server Components, but can receive them as `children`.
- **Server Actions** (`'use server'`) are functions that run on the server and can be called from forms or client code, like RPC.
- They're available through frameworks, mainly the Next.js App Router.

```jsx
// app/products/[id]/page.jsx — a Server Component (no 'use client')
import { db } from '@/lib/db';
import AddToCart from './AddToCart';                // a Client Component
export default async function ProductPage({ params }) {
  const product = await db.product.findUnique({ where: { id: params.id } });   // runs on the server
  return (
    <article>
      <h1>{product.name}</h1>
      <p>{product.description}</p>
      <AddToCart productId={product.id} price={product.price} />
    </article>
  );
}
```

### Q: What's new in React 19 that interviewers might ask about? [Senior] [Medium]

- **Actions:** async functions passed to transitions or forms. React tracks pending state, errors and optimistic updates for you: `<form action={submitAction}>`, `useActionState`, and `useFormStatus` (read the parent form's pending state from a submit button).
- **`useOptimistic`:** show the expected result immediately and roll back if the action fails (likes, chat messages).
- **`use(resource)`:** read a promise (suspends until it resolves) or a context. It can be called conditionally.
- **`ref` as a prop** for function components (no `forwardRef` needed), and ref callbacks can return a cleanup function.
- **`<Context>` as a provider** directly (`<ThemeContext value="dark">`).
- **Document metadata:** render `<title>`, `<meta>` and `<link>` anywhere; React hoists them to `<head>`. Plus stylesheet precedence and resource preloading APIs (`preload`, `preinit`).
- Better hydration error messages; Server Components and Server Actions are stable for frameworks.
- **React 19.2:** `<Activity>` (hide parts of the UI while keeping their state) and `useEffectEvent`.

## State management

### Q: How do you choose a state management approach? [Core] [Senior]

First classify the state:

| Kind of state | Examples | Best tool |
|---|---|---|
| Local UI state | Open/closed, input text, hover | `useState` / `useReducer` in the component |
| Shared UI state (a subtree) | Wizard step, selected rows | Lift state up, plus context for the subtree |
| **Server state** (a cache of backend data) | Users, products, feeds | **React Query / SWR / RTK Query / Apollo**: caching, dedupe, refetch, invalidation, pagination |
| Global client state | Auth session, theme, cart (if client-only), feature flags | Context (low frequency) or Zustand / Redux Toolkit / Jotai |
| URL state | Filters, sort, page, selected tab | The URL search params, so it's shareable and survives refresh |
| Form state | Values, validation, dirty/touched | React Hook Form (+ zod), or Formik |

A strong answer: most "global state" in older apps was really **server state**. Moving it to React Query removes most Redux boilerplate. Use Redux Toolkit when you have complex client-side domain logic, need middleware, time-travel debugging or strict conventions on a large team. Zustand gives you a simple store with selectors and little boilerplate.

### Q: Explain Redux: the data flow, Redux Toolkit and middleware. [Core] [Medium]

Redux keeps app state in **one store**. The UI **dispatches actions** (plain objects describing what happened). **Reducers** (pure functions `(state, action) => newState`) compute the next state. Subscribers (via `useSelector`) re-render when the slice they select changes. Benefits: predictable, traceable updates and great devtools (time travel).

**Redux Toolkit (RTK)** is the official, recommended way: `configureStore` (with good defaults and devtools), `createSlice` (reducers and action creators together, with Immer so you can write "mutating" code safely), `createAsyncThunk`, and **RTK Query** for data fetching and caching.

**Middleware** wraps `dispatch` to handle side effects: thunks (functions that dispatch later), sagas (generators), listeners, logging, analytics.

```js
const cartSlice = createSlice({
  name: 'cart',
  initialState: { items: [] },
  reducers: {
    added(state, action) { state.items.push(action.payload); },             // Immer makes this immutable
    removed(state, action) { state.items = state.items.filter(i => i.id !== action.payload); },
  },
});
export const { added, removed } = cartSlice.actions;
const store = configureStore({ reducer: { cart: cartSlice.reducer } });
// in a component:
const count = useSelector(state => state.cart.items.length);   // re-renders only when the count changes
```

### Q: How does React Query (TanStack Query) manage server state? [Core] [Medium]

It caches results by a **query key** (`['user', id]`), and handles loading and error states, **deduplication** of identical requests, **stale-while-revalidate** (show cached data immediately, refetch in the background), refetch on window focus or reconnect, retries, pagination and infinite queries, and garbage collection of unused data. Mutations invalidate related queries (`queryClient.invalidateQueries({ queryKey: ['todos'] })`) or update them optimistically.

Key settings: `staleTime` (how long data counts as fresh, i.e. no refetch) and `gcTime` (how long unused data stays cached).

```jsx
function UserCard({ id }) {
  const { data, isPending, error } = useQuery({
    queryKey: ['user', id],
    queryFn: ({ signal }) => fetch(`/api/users/${id}`, { signal }).then(r => r.json()),
    staleTime: 60_000,
  });
  if (isPending) return <Skeleton />;
  if (error) return <ErrorMessage error={error} />;
  return <Card user={data} />;
}
```

### Q: What is `useSyncExternalStore` for? [Senior] [Medium]

It subscribes a component to an **external store** (anything outside React state: Redux, Zustand, browser APIs like `navigator.onLine` or `matchMedia`) in a way that's safe with concurrent rendering. It prevents "tearing", where different components show different versions of the store during one render. Libraries use it internally; you'd use it directly for custom stores and browser subscriptions.

```jsx
function subscribe(callback) {
  window.addEventListener('online', callback);
  window.addEventListener('offline', callback);
  return () => { window.removeEventListener('online', callback); window.removeEventListener('offline', callback); };
}
export function useOnlineStatus() {
  return useSyncExternalStore(subscribe, () => navigator.onLine, () => true /* server snapshot */);
}
```

## Performance & architecture

### Q: A React page is slow. How do you find and fix unnecessary re-renders? [Core] [Senior]

1. **Measure:** React DevTools Profiler (enable "Record why each component rendered"), and "Highlight updates when components render". Confirm with the browser Performance panel that rendering is actually the bottleneck.
2. **Fix the structure first:**
   - **Move state down** to the component that uses it, so typing in a search box doesn't re-render the whole page.
   - **Lift content up / pass `children`**: elements created by a parent don't re-render when the wrapper's state changes.
   - Split big components, and split contexts (or use selectors).
   - Keep keys stable; don't create components inside components (that remounts them every render).
3. **Then memoise:** `React.memo` on heavy children, with stable props (`useCallback`, `useMemo`), and memoise expensive calculations.
4. **Reduce the work:** virtualise long lists, paginate, debounce input, and use transitions or deferred values.
5. **Measure again.** Or adopt the React Compiler.

### Q: Why should you never define a component inside another component? [Medium]

```jsx
function Parent() {
  const [text, setText] = useState('');
  function Child() { return <input />; }   // ❌ a NEW component type on every render
  return <><Child /><input value={text} onChange={e => setText(e.target.value)} /></>;
}
```

Every render of `Parent` creates a new `Child` function, a different **type** as far as reconciliation is concerned. React unmounts the old one and mounts a new one on each render: state is lost, inputs lose focus, effects re-run, and it's slow. Define components at the top level and pass data through props.

### Q: Explain the compound components pattern. [Senior] [Medium]

A parent component shares implicit state with its sub-components through context, giving users a flexible, declarative API, like `<select>` and `<option>` in HTML. Common in design systems (Tabs, Accordion, Menu, Select). Pair it with the **controlled/uncontrolled prop pattern** (accept `value`/`onChange`, or fall back to internal state with `defaultValue`).

```jsx
const TabsContext = createContext(null);
function Tabs({ defaultValue, value, onChange, children }) {
  const [internal, setInternal] = useState(defaultValue);
  const active = value ?? internal;                                  // controlled if `value` is passed
  const setActive = v => { if (value === undefined) setInternal(v); onChange?.(v); };
  return <TabsContext.Provider value={{ active, setActive }}>{children}</TabsContext.Provider>;
}
function Tab({ value, children }) {
  const { active, setActive } = useContext(TabsContext);
  return <button role="tab" aria-selected={active === value} onClick={() => setActive(value)}>{children}</button>;
}
function TabPanel({ value, children }) {
  const { active } = useContext(TabsContext);
  return active === value ? <div role="tabpanel">{children}</div> : null;
}
// usage
<Tabs defaultValue="profile">
  <div role="tablist"><Tab value="profile">Profile</Tab><Tab value="billing">Billing</Tab></div>
  <TabPanel value="profile">…</TabPanel>
  <TabPanel value="billing">…</TabPanel>
</Tabs>
```

### Q: What are headless components and hooks? [Senior] [Easy]

Headless components provide **behaviour, state and accessibility without any styling or markup opinions**. The consumer renders whatever UI they want. Examples: TanStack Table, Downshift (comboboxes), React Aria, Radix Primitives, Headless UI. They're great for design systems: accessibility logic is solved once, and every product keeps its own look. Shadcn/ui popularised copying styled wrappers around Radix into your own codebase.

### Q: How would you structure a large React codebase? [Senior] [Medium]

- **Feature-based folders** (`features/checkout/{components,hooks,api,store,tests}`) rather than type-based (`components/`, `reducers/`), so related code lives together and features can be owned by teams.
- A **shared design system** package (`ui/`) and utilities (`lib/`); avoid circular imports between features; expose each feature's public API through its `index.ts`.
- **Clear boundaries:** API clients and data hooks separate from presentational components; business logic in hooks or pure functions that are easy to test.
- **Conventions enforced by tooling:** TypeScript strict mode, ESLint (including import-boundary rules), Prettier, path aliases.
- **Scaling teams:** a monorepo (Nx or Turborepo) with packages, code owners, and possibly micro-frontends if teams need independent deploys (see [tooling](#/tooling)).
- **Cross-cutting concerns:** error boundaries per route, an i18n setup, analytics, feature flags, and performance budgets in CI.

### Q: How do you test React components? [Core] [Easy]

Test **behaviour from the user's point of view** with React Testing Library: render, find elements by role and label, interact with `user-event`, and assert on what's visible. Mock the network with MSW rather than mocking internal functions. Test hooks with `renderHook`. Keep a few end-to-end tests (Playwright) for critical flows. See the [testing page](#/testing) for examples.
</script>

<script type="text/x-prep" id="p-react-hooks" data-group="React" data-title="Custom hooks to write from memory" data-short="Custom hooks" data-lede="Interviewers often ask you to write a hook on the spot, or build one during machine coding. Each one below has the implementation, a usage example and the follow-ups to expect.">
## Timing hooks

### Q: Write `useDebounce` (a debounced value) and `useDebouncedCallback` [Core] [Easy] [React]

**Problem.** `useDebounce(value, delay)` returns `value` only after it has stopped changing for `delay` ms, which is ideal for search inputs that trigger fetches. `useDebouncedCallback(fn, delay)` returns a stable debounced function that always calls the **latest** `fn`.

```jsx
import { useEffect, useMemo, useRef, useState } from 'react';

export function useDebounce(value, delay = 300) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const id = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(id);              // a new value before `delay` cancels the pending update
  }, [value, delay]);
  return debounced;
}

export function useDebouncedCallback(fn, delay = 300) {
  const fnRef = useRef(fn);
  const timer = useRef();
  useEffect(() => { fnRef.current = fn; });     // always call the latest fn (no stale closure)
  useEffect(() => () => clearTimeout(timer.current), []);   // clear on unmount
  return useMemo(() => (...args) => {
    clearTimeout(timer.current);
    timer.current = setTimeout(() => fnRef.current(...args), delay);
  }, [delay]);
}

// usage
function Search() {
  const [query, setQuery] = useState('');
  const debouncedQuery = useDebounce(query, 400);
  const { data } = useSearch(debouncedQuery);   // fetches only when typing pauses
  return <input value={query} onChange={e => setQuery(e.target.value)} />;
}
```

### Q: Write `useInterval` without the stale closure bug [Core] [Medium] [React]

**Problem.** A declarative `setInterval`: `useInterval(callback, delay)`, where `delay = null` pauses it. The callback must always see the latest props and state, without restarting the interval on every render.

```jsx
export function useInterval(callback, delay) {
  const saved = useRef(callback);
  useEffect(() => { saved.current = callback; }, [callback]);   // keep the latest callback
  useEffect(() => {
    if (delay === null) return;                                 // paused
    const id = setInterval(() => saved.current(), delay);
    return () => clearInterval(id);
  }, [delay]);                                                  // only restart when the delay changes
}

// usage: a pausable counter
function Ticker() {
  const [count, setCount] = useState(0);
  const [running, setRunning] = useState(true);
  useInterval(() => setCount(count + 1), running ? 1000 : null);   // reads fresh `count` every tick
  return <button onClick={() => setRunning(r => !r)}>{count} ({running ? 'pause' : 'resume'})</button>;
}
```

### Q: Write `useThrottle` for a fast-changing value [Medium] [React]

```jsx
export function useThrottle(value, interval = 200) {
  const [throttled, setThrottled] = useState(value);
  const last = useRef(0);
  useEffect(() => {
    const now = Date.now();
    const remaining = interval - (now - last.current);
    if (remaining <= 0) { last.current = now; setThrottled(value); return; }
    const id = setTimeout(() => { last.current = Date.now(); setThrottled(value); }, remaining);  // trailing update
    return () => clearTimeout(id);
  }, [value, interval]);
  return throttled;
}
// usage: const throttledScrollY = useThrottle(scrollY, 100);
```

## State helpers

### Q: Write `usePrevious` [Easy] [React]

**Problem.** Return the value a variable had during the **previous render** (to compare old and new, or to animate a change).

```jsx
export function usePrevious(value) {
  const ref = useRef();
  useEffect(() => { ref.current = value; }, [value]);   // updates AFTER render, so during render we still see the old one
  return ref.current;
}
// usage
const prevCount = usePrevious(count);
const direction = prevCount === undefined ? '' : count > prevCount ? '↑' : '↓';
```

> **Note:** the React docs also suggest storing the previous value in state and updating it during render, which avoids reading a ref during render. Mention both if asked about concurrent-safety.

### Q: Write `useLocalStorage` (synced across tabs) [Core] [Medium] [React]

**Problem.** Like `useState`, but the value persists in localStorage, survives reloads, handles JSON parse errors and private mode, and stays in sync when another tab changes it.

```jsx
export function useLocalStorage(key, initialValue) {
  const read = () => {
    try {
      const raw = window.localStorage.getItem(key);
      return raw !== null ? JSON.parse(raw) : initialValue;
    } catch { return initialValue; }               // private mode / quota / bad JSON
  };
  const [value, setValue] = useState(read);         // lazy initial state: read once

  const setStored = useCallback(next => {
    setValue(prev => {
      const resolved = typeof next === 'function' ? next(prev) : next;
      try { window.localStorage.setItem(key, JSON.stringify(resolved)); } catch {}
      return resolved;
    });
  }, [key]);

  useEffect(() => {                                  // other tabs fire "storage" events
    const onStorage = e => { if (e.key === key) setValue(e.newValue !== null ? JSON.parse(e.newValue) : initialValue); };
    window.addEventListener('storage', onStorage);
    return () => window.removeEventListener('storage', onStorage);
  }, [key]);

  return [value, setStored];
}
// usage: const [theme, setTheme] = useLocalStorage('theme', 'light');
```

Follow-ups: SSR (no `window` on the server, so read in an effect or with `useSyncExternalStore`), storing large data (use IndexedDB instead), and the same-tab sync between two hook instances (dispatch a custom event).

### Q: Write `useToggle` and `useBoolean` [Easy] [React]

```jsx
export function useToggle(initial = false) {
  const [on, setOn] = useState(initial);
  const toggle = useCallback(() => setOn(v => !v), []);
  const set = useMemo(() => ({ on: () => setOn(true), off: () => setOn(false) }), []);
  return [on, toggle, set];
}
// const [isOpen, toggleOpen, { off: close }] = useToggle();
```

## Data & DOM hooks

### Q: Write `useFetch` with loading/error states, cancellation and no race conditions [Core] [Medium] [React]

**Problem.** `useFetch(url)` returns `{ data, error, loading, refetch }`. Changing the URL must cancel the old request and never show stale data.

```jsx
export function useFetch(url, options) {
  const [state, setState] = useState({ data: null, error: null, loading: !!url });
  const [nonce, setNonce] = useState(0);                         // bump to refetch
  const optionsRef = useRef(options);
  optionsRef.current = options;

  useEffect(() => {
    if (!url) return;
    const controller = new AbortController();
    setState(s => ({ ...s, loading: true, error: null }));
    fetch(url, { ...optionsRef.current, signal: controller.signal })
      .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.json(); })
      .then(data => setState({ data, error: null, loading: false }))
      .catch(error => { if (error.name !== 'AbortError') setState({ data: null, error, loading: false }); });
    return () => controller.abort();                            // cancels on url change and on unmount
  }, [url, nonce]);

  const refetch = useCallback(() => setNonce(n => n + 1), []);
  return { ...state, refetch };
}
```

Follow-ups: caching and dedupe across components, retries, and stale-while-revalidate. At that point, recommend React Query instead of growing this hook.

### Q: Write `useOnClickOutside` (close dropdowns and popovers) [Core] [Easy] [React]

```jsx
export function useOnClickOutside(ref, handler) {
  const handlerRef = useRef(handler);
  useEffect(() => { handlerRef.current = handler; });
  useEffect(() => {
    const listener = e => {
      if (!ref.current || ref.current.contains(e.target)) return;   // click was inside
      handlerRef.current(e);
    };
    document.addEventListener('pointerdown', listener);              // covers mouse and touch
    return () => document.removeEventListener('pointerdown', listener);
  }, [ref]);
}
// usage
function Dropdown() {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);
  useOnClickOutside(ref, () => setOpen(false));
  return <div ref={ref}>…</div>;
}
```

Edge cases: portals (the menu isn't inside `ref` in the DOM, so check the portal's ref too), iframes (they swallow clicks), and also closing on Esc for accessibility.

### Q: Write `useIntersectionObserver` / `useInView` [Core] [Medium] [React]

**Problem.** Tell a component whether an element is visible in the viewport, for lazy loading, infinite scroll and impression tracking.

```jsx
export function useInView({ root = null, rootMargin = '0px', threshold = 0, once = false } = {}) {
  const [inView, setInView] = useState(false);
  const [node, setNode] = useState(null);                 // callback ref: works if the element changes
  useEffect(() => {
    if (!node) return;
    const observer = new IntersectionObserver(([entry]) => {
      setInView(entry.isIntersecting);
      if (entry.isIntersecting && once) observer.disconnect();
    }, { root, rootMargin, threshold });
    observer.observe(node);
    return () => observer.disconnect();
  }, [node, root, rootMargin, threshold, once]);
  return [setNode, inView];
}
// usage: infinite scroll sentinel
const [sentinelRef, atBottom] = useInView({ rootMargin: '200px' });
useEffect(() => { if (atBottom && hasMore && !loading) loadMore(); }, [atBottom]);
// <div ref={sentinelRef} />
```

### Q: Write `useMediaQuery` and `useWindowSize` [Easy] [React]

```jsx
export function useMediaQuery(query) {
  const subscribe = useCallback(cb => {
    const mql = window.matchMedia(query);
    mql.addEventListener('change', cb);
    return () => mql.removeEventListener('change', cb);
  }, [query]);
  return useSyncExternalStore(subscribe, () => window.matchMedia(query).matches, () => false);
}

export function useWindowSize() {
  const [size, setSize] = useState(() => ({ width: window.innerWidth, height: window.innerHeight }));
  useEffect(() => {
    let frame;
    const onResize = () => {
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => setSize({ width: window.innerWidth, height: window.innerHeight }));  // at most once per frame
    };
    window.addEventListener('resize', onResize);
    return () => { cancelAnimationFrame(frame); window.removeEventListener('resize', onResize); };
  }, []);
  return size;
}
// const isMobile = useMediaQuery('(max-width: 640px)');
```
