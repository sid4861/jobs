  };

  /* ---------- 7. secondary indexes ---------- */
  reg.secindex = el => seqViz(el, 'Secondary indexes in a partitioned database', 'Find all red cars. With document-partitioned (local) indexes the query is scattered to every partition; with term-partitioned (global) indexes it goes to one index partition, but writes get more complicated.', ['Client', 'Partition 0', 'Partition 1', 'Partition 2'], {
    local: { name: 'local index (by document)', steps: [
      { from: 0, to: 1, label: 'write car 191 {color: red} → index color:red locally', msg: 'Each partition indexes only its own documents. A write touches only the partition holding that document: simple and fast writes.' },
      { from: 0, to: 1, label: 'query color = red (scatter)', msg: 'But a query by color can\'t know which partitions have red cars, so it must ask <b>all</b> of them…' },
      { from: 0, to: 2, label: 'query color = red (scatter)', msg: '…' },
      { from: 0, to: 3, label: 'query color = red (scatter)', msg: '…' },
      { from: 1, to: 0, label: '[191, 306]', dashed: 1, cls: 'ok' },
      { from: 2, to: 0, label: '[768]', dashed: 1, cls: 'ok' },
      { from: 3, to: 0, label: '[]', dashed: 1, cls: 'ok', msg: '…and <b>gather</b> the results. Tail latency amplification applies: the query is as slow as the slowest partition. Used by MongoDB, Riak, Cassandra, Elasticsearch, SolrCloud, VoltDB.' }] },
    global: { name: 'global index (by term)', steps: [
      { from: 0, to: 1, label: 'write car 893 {color: silver} (document lives here)', msg: 'The index itself is partitioned by the indexed term: e.g. colors a–r on partition 0, s–z on partition 1.' },
      { from: 1, to: 2, label: 'update index entry color:silver (other partition!)', dashed: 1, cls: 'spec', msg: 'A single write may now have to update index partitions on other nodes. That needs a distributed transaction, so in practice global index updates are often <b>asynchronous</b>: a read right after a write may not see it in the index.' },
      { from: 0, to: 1, label: 'query color = red → index partition 0 only', msg: 'A read is efficient: go straight to the one partition that holds the term "red"…' },
      { from: 1, to: 0, label: '[191, 306, 768]', dashed: 1, cls: 'ok', msg: '…and get the full posting list (then fetch the documents). Used by DynamoDB global secondary indexes, Riak search, Oracle data warehouse.' }] }
  });

  /* ---------- 8. isolation anomalies ---------- */
  reg.isolation = el => {
    const { ctrl, stage, foot } = shell(el, 'Race conditions and isolation levels', 'Two transactions run concurrently. Pick an anomaly and an isolation level, then step through and see whether the database lets the bug happen.');
    const A = {
      dirtyread: { name: 'dirty read', levels: [['ru', 'read uncommitted'], ['rc', 'read committed']], code: ['T1: UPDATE accounts SET balance = 0 WHERE id = 1', 'T2: SELECT balance FROM accounts WHERE id = 1', 'T1: ROLLBACK'],
        run(l) { const bad = l === 'ru'; return [
          { t1: 'write balance = 0 (uncommitted)', db: 'balance: 100 → 0?', line: 1, msg: 'T1 writes but hasn\'t committed.' },
          { t2: 'read balance → ' + (bad ? '0' : '100'), db: bad ? 'reads uncommitted 0' : 'returns last committed 100', line: 2, bad, msg: bad ? 'T2 sees uncommitted data: a <b>dirty read</b>.' : 'Read committed: readers see only committed data. The database remembers the old committed value and returns it while the write is in progress.' },
          { t1: 'ROLLBACK', db: 'balance: 100', line: 3, bad, msg: bad ? 'T1 aborts, so T2 acted on a value that <b>never existed</b>.' : 'No harm done: T2 never saw the aborted value.' }]; } },
      readskew: { name: 'read skew', levels: [['rc', 'read committed'], ['si', 'snapshot isolation']], code: ['Alice: SELECT balance FROM accounts WHERE id = 1  -- 500', 'Transfer: UPDATE acct 1 +100; UPDATE acct 2 -100; COMMIT', 'Alice: SELECT balance FROM accounts WHERE id = 2'],
        run(l) { const bad = l === 'rc'; return [
          { t1: 'read account 1 → 500', db: 'acct1 500, acct2 500', line: 1, msg: 'Alice has $1,000 split across two accounts and starts checking them.' },
          { t2: 'transfer $100: acct1 600, acct2 400, COMMIT', db: 'acct1 600, acct2 400', line: 2, msg: 'A transfer commits in between.' },
          { t1: 'read account 2 → ' + (bad ? '400' : '500'), db: 'acct1 600, acct2 400', line: 3, bad, msg: bad ? 'Alice sees 500 + 400 = $900: $100 vanished (<b>read skew</b> / non-repeatable read). Fine for a moment in a UI, fatal for backups and analytic queries.' : 'Snapshot isolation: the transaction reads from a consistent <b>snapshot</b> as of its start (MVCC), so it sees 500 + 500 = $1,000.' }]; } },
      lostupdate: { name: 'lost update', levels: [['rc', 'read-modify-write'], ['atomic', 'atomic UPDATE / FOR UPDATE']], code: ['T1: x = SELECT value FROM counters WHERE key = \'foo\'', 'T2: x = SELECT value FROM counters WHERE key = \'foo\'', 'T1: UPDATE counters SET value = x + 1', 'T2: UPDATE counters SET value = x + 1'],
        run(l) { const bad = l === 'rc'; return bad ? [
          { t1: 'read counter → 42', db: '42', line: 1, msg: 'Both transactions read the counter…' },
          { t2: 'read counter → 42', db: '42', line: 2 },
          { t1: 'write 43, commit', db: '43', line: 3 },
          { t2: 'write 43, commit', db: '43', line: 4, bad: true, msg: 'Two increments, but the counter only went up by one: T2\'s write <b>clobbered</b> T1\'s (a <b>lost update</b>). Same bug with editing a JSON document or a wiki page.' }] : [
          { t1: 'UPDATE counters SET value = value + 1', db: '42 → 43 (row locked)', line: 3, msg: 'An <b>atomic</b> update does the read-modify-write inside the database, taking an exclusive lock on the row (or use SELECT … FOR UPDATE, or compare-and-set).' },
          { t2: 'UPDATE … value = value + 1 (waits for the lock)', db: '43', line: 4, msg: 'T2 must wait until T1 commits…' },
          { t2: 'reads 43, writes 44', db: '44', line: 4, msg: '…then sees 43 and writes 44. (PostgreSQL repeatable read, Oracle serializable and SQL Server snapshot isolation also detect lost updates automatically; MySQL InnoDB repeatable read does not.)' }]; } },
      writeskew: { name: 'write skew (doctors on call)', levels: [['si', 'snapshot isolation'], ['ser', 'serializable']], code: ['T1 (Alice): SELECT COUNT(*) FROM doctors WHERE on_call AND shift = 1234  -- 2', 'T2 (Bob):   SELECT COUNT(*) FROM doctors WHERE on_call AND shift = 1234  -- 2', 'T1: if count >= 2: UPDATE doctors SET on_call = false WHERE name = \'Alice\'', 'T2: if count >= 2: UPDATE doctors SET on_call = false WHERE name = \'Bob\'', 'COMMIT both'],
        run(l) { const bad = l === 'si'; return [
          { t1: 'count on-call → 2 (Alice, Bob)', db: 'Alice ✓, Bob ✓', line: 1, msg: 'Rule: at least one doctor must be on call. Both feel unwell and request leave at the same moment.' },
          { t2: 'count on-call → 2', db: 'Alice ✓, Bob ✓', line: 2, msg: 'Both transactions check the condition on the same snapshot: 2 doctors, so it\'s fine to leave.' },
          { t1: 'set Alice off call', db: 'Alice ✗, Bob ✓ (T1\'s view)', line: 3 },
          { t2: 'set Bob off call', db: 'Alice ✓, Bob ✗ (T2\'s view)', line: 4, msg: 'They update <b>different</b> rows, so there is no write-write conflict and no lost update.' },
          { t1: bad ? 'COMMIT ✓' : 'COMMIT ✓', t2: bad ? 'COMMIT ✓' : 'ABORT: serialization failure, retry', db: bad ? 'Alice ✗, Bob ✗: nobody on call!' : 'Alice ✗, Bob ✓', line: 5, bad, msg: bad ? '<b>Write skew</b>: each transaction\'s premise (count ≥ 2) was true when checked, but the combined result breaks the invariant. Snapshot isolation doesn\'t prevent it. Fixes: serializable isolation, or lock the rows the decision depends on with <code>SELECT … FOR UPDATE</code>. When the premise is about rows that <b>don\'t exist yet</b> (room bookings, unique usernames), that\'s a <b>phantom</b>, and only serializability or materialized conflicts help.' : 'Serializable isolation (2PL with predicate/index-range locks, or SSI) detects that T2\'s premise was invalidated by T1\'s write and aborts T2. Retrying, Bob now sees count = 1 and stays on call.' }]; } }
    };
    let an = 'dirtyread', lv = 'ru';
    const levelSeg = h('span');
    ctrl.append(sel(Object.entries(A).map(([k, v]) => [k, v.name]), an, v => { an = v; lv = A[an].levels[0][0]; build(); }, 'Anomaly'), levelSeg);
    const code = h('div'), grid = h('div', { class: 'vz-grid2', style: 'margin-top:8px' }), t1 = h('div', { class: 'vz-panel' }), t2 = h('div', { class: 'vz-panel' }), db = h('div', { class: 'vz-stats', style: 'margin-top:8px' });
    grid.append(t1, t2); stage.append(code, grid, db);
    foot.append(note('Isolation levels from weakest: read uncommitted → read committed (default in PostgreSQL, Oracle, SQL Server) → snapshot isolation (called "repeatable read" in PostgreSQL and MySQL) → serializable. Names are inconsistent between databases, so check what each guarantees.'));
    const player = new Player(stage, render, { base: 1700 });
    let rows = [];
    function build() {
      levelSeg.innerHTML = ''; levelSeg.append(seg(A[an].levels, lv, v => { lv = v; build(); }));
      code.innerHTML = ''; const pre = h('div', { class: 'vz-code' }); rows = A[an].code.map(l => { const d = h('span', { class: 'ln' }, l); pre.append(d); return d; }); code.append(pre);
      const steps = A[an].run(lv), F = []; const h1 = [], h2 = [];
      steps.forEach(s => { if (s.t1) h1.push([s.t1, s.bad]); if (s.t2) h2.push([s.t2, s.bad]); F.push({ h1: h1.slice(), h2: h2.slice(), db: s.db, line: s.line, bad: s.bad, msg: s.msg || '' }); });
      player.load(F);
    }
    function render(f) {
      rows.forEach((r, i) => { r.className = 'ln' + (i + 1 === f.line ? (f.bad ? ' err' : ' hl') : ''); });
      const list = arr => arr.map(([t, b], i) => '<div style="font:600 12.5px var(--mono);margin:3px 0;color:' + (b && i === arr.length - 1 ? 'var(--c-bad)' : 'var(--ink)') + '">' + (i + 1) + '. ' + esc(t) + '</div>').join('');
      t1.innerHTML = '<h5>Transaction 1</h5>' + list(f.h1); t2.innerHTML = '<h5>Transaction 2</h5>' + list(f.h2);
      db.innerHTML = '<span class="vz-stat">database <b style="color:' + (f.bad ? 'var(--c-bad)' : 'var(--ink)') + '">' + esc(f.db) + '</b></span>';
    }
    build();
  };

  /* ---------- 9. MVCC visibility ---------- */
  reg.mvcc = el => {
    const { ctrl, stage, foot } = shell(el, 'MVCC: which row versions can a transaction see?', 'Each row version records the transaction that created it and the one that deleted it. Pick the reading transaction and see its consistent snapshot.', 'Interactive');
    const V = [
      { id: 1, bal: 500, by: 3, del: 13 }, { id: 1, bal: 600, by: 13, del: null },
      { id: 2, bal: 500, by: 5, del: 13 }, { id: 2, bal: 400, by: 13, del: null },
      { id: 3, bal: 250, by: 9, del: 15 }];
    let reader = 12, inProg = new Set();
    ctrl.append(seg([[12, 'txid 12 (started before 13)'], [14, 'txid 14 (after 13 committed)'], [16, 'txid 16']], reader, v => { reader = +v; draw(); }));
    const tb = h('div', { class: 'vz-panel', style: 'overflow-x:auto' }), cap = h('div', { class: 'vz-cap' });
    stage.append(tb, cap);
    foot.append(note('Visible if: the creating transaction had committed before the reader started (and isn\'t in the reader\'s in-progress list), and the row is not deleted by a transaction that had committed before the reader started. Old versions are garbage-collected once no transaction can see them.'));
    const committedBefore = (tx, r) => tx != null && tx < r;
    function draw() {
      tb.innerHTML = '<table style="border-collapse:collapse;font:600 12.5px var(--mono);width:100%"><tr>' + ['account', 'balance', 'created_by', 'deleted_by', 'visible to ' + reader + '?'].map(c => '<th style="text-align:left;padding:4px 8px;color:var(--muted)">' + c + '</th>').join('') + '</tr>' +
        V.map(v => { const vis = committedBefore(v.by, reader) && !committedBefore(v.del, reader); return '<tr style="background:' + (vis ? 'var(--f-ok)' : 'transparent') + ';opacity:' + (vis ? 1 : .5) + '"><td style="padding:4px 8px">' + v.id + '</td><td style="padding:4px 8px">' + v.bal + '</td><td style="padding:4px 8px">' + v.by + '</td><td style="padding:4px 8px">' + (v.del ?? '—') + '</td><td style="padding:4px 8px;color:var(--c-' + (vis ? 'ok' : 'bad') + ')">' + (vis ? '✓' : '✗') + '</td></tr>'; }).join('') + '</table>';
      const sum = V.filter(v => committedBefore(v.by, reader) && !committedBefore(v.del, reader)).reduce((a, v) => a + v.bal, 0);
      cap.innerHTML = { 12: 'Transaction 12 started before transaction 13 (the transfer) committed, so it still sees the <b>old</b> versions of accounts 1 and 2: 500 + 500 + 250 = ' + sum + '. A consistent snapshot, without blocking the writer.', 14: 'After 13 committed: accounts 1 and 2 show 600 and 400. Account 3 was deleted by 15, which hasn\'t happened yet from 14\'s point of view, so it\'s still visible. Total ' + sum + '.', 16: 'Transaction 15 deleted account 3 (deletes just set deleted_by), so transaction 16 no longer sees it. Total ' + sum + '. Readers never block writers, writers never block readers.' }[reader];
    }
    draw();
  };
})();

/* ===== FEVIZ: DDIA animations, part 3 (chapters 8-11) ===== */
(function () {
  'use strict';
  const { reg, h, esc, shell, btn, sel, seg, legend, stats, chip, Player, Scene, seqViz } = FEVIZ;
  const note = t => h('p', { style: 'font-size:13px;color:var(--muted);margin:4px 0 0' }, t);
  const box = (txt, cls, extra) => '<span style="display:inline-block;padding:4px 9px;margin:2px;border-radius:7px;font:600 12.5px var(--mono);border:1.5px solid ' + (cls ? 'var(--c-' + cls + ')' : 'var(--line-2)') + ';background:' + (cls ? 'var(--f-' + cls + ')' : 'var(--surface)') + ';' + (extra || '') + '">' + txt + '</span>';

  /* ---------- 1. unreliable networks ---------- */
  reg.netfault = el => seqViz(el, 'Why a timeout tells you almost nothing', 'The client sends a request and hears nothing back. Four very different failures all look exactly the same from the sender\'s side.', ['Client', 'Network', 'Server'], {
    lost: { name: 'request lost', steps: [
      { from: 0, to: 1, label: 'request', msg: 'The request leaves the client…' },
      { from: 1, to: 1, label: '✗ dropped (cable unplugged, switch misconfigured)', cls: 'bad', msg: '…and is lost in the network. The server never saw it.' },
      { from: 0, to: 0, label: '⏱ timeout', cls: 'spec', msg: 'The client times out. Retrying is safe here, but the client can\'t know that.' }] },
    queued: { name: 'request queued', steps: [
      { from: 0, to: 1, label: 'request', msg: 'The request is stuck in a queue: a congested switch, a busy receiver, or TCP flow control…' },
      { from: 1, to: 1, label: '… waiting in a queue …', cls: 'spec' },
      { from: 0, to: 0, label: '⏱ timeout', cls: 'spec', msg: 'The client gives up…' },
      { from: 1, to: 2, label: 'request finally delivered', dashed: 1, msg: '…but the request is delivered later and processed. A retry would now execute it <b>twice</b>, unless the operation is idempotent.' }] },
    crashed: { name: 'server crashed / paused', steps: [
      { from: 0, to: 2, label: 'request', msg: 'The request arrives…' },
      { from: 2, to: 2, label: '✗ crashed, or paused for GC', cls: 'bad', msg: '…but the server crashed, or is in a long garbage-collection pause and will respond later.' },
      { from: 0, to: 0, label: '⏱ timeout', cls: 'spec', msg: 'Same timeout.' }] },
    resplost: { name: 'response lost', steps: [
      { from: 0, to: 2, label: 'request: charge card $10', msg: 'The server receives the request…' },
      { from: 2, to: 2, label: 'processed ✓ (card charged)', cls: 'ok', msg: '…and <b>does</b> the work.' },
      { from: 2, to: 1, label: 'response', dashed: 1 },
      { from: 1, to: 1, label: '✗ response dropped', cls: 'bad', msg: 'The response is lost on the way back.' },
      { from: 0, to: 0, label: '⏱ timeout → retry → charged twice?', cls: 'bad', msg: 'The client can\'t distinguish this from a lost request. Retrying charges the card twice unless requests carry a unique ID the server uses to deduplicate (idempotence).' }] }
  }, 'In an asynchronous network there is no upper bound on delay, so a timeout is the only failure detector, and it is a guess. Short timeouts detect faults sooner but risk declaring a slow node dead; long ones mean waiting. Many systems measure round-trip variation and adjust timeouts automatically (Phi Accrual failure detector in Akka and Cassandra).');

  /* ---------- 2. clock skew and last-write-wins ---------- */
  reg.clockskew = el => seqViz(el, 'Clock skew silently drops writes', 'Two clients write to x. Replicas resolve the conflict with last-write-wins using the writer\'s time-of-day clock. Node 3\'s clock is just 3 ms behind.', ['Client A', 'Node 1 (clock ok)', 'Node 3 (3 ms slow)', 'Client B'], {
    lww: { name: 'last write wins', steps: [
      { from: 0, to: 1, label: 'set x = 1  @ t = 42.004 s', msg: 'Client A writes x = 1 on node 1, timestamped 42.004 by node 1\'s clock.' },
      { from: 1, to: 2, label: 'replicate x = 1 (42.004)', dashed: 1, msg: 'The write replicates to node 3.' },
      { from: 3, to: 2, label: 'increment x → 2  @ t = 42.003 s', msg: 'Client B, which has already seen x = 1, increments it on node 3. B\'s write happened <b>after</b> A\'s (causally!), but node 3\'s clock reads 42.003.' },
      { from: 2, to: 1, label: 'replicate x = 2 (42.003)', dashed: 1, msg: 'Node 1 receives x = 2 with a timestamp <b>older</b> than its own x = 1…' },
      { from: 1, to: 1, label: 'LWW: 42.003 < 42.004 → drop x = 2', cls: 'bad', msg: '…so last-write-wins <b>silently discards</b> B\'s increment. No error anywhere. NTP accuracy is only tens of milliseconds over the internet, and clocks can jump backwards.' }] }
  }, 'Time-of-day clocks (System.currentTimeMillis) can jump; monotonic clocks (System.nanoTime) are only good for measuring durations on one machine. Safer alternatives for ordering: logical clocks (version vectors, Lamport timestamps). Google Spanner uses TrueTime confidence intervals and waits out the uncertainty before committing.');

  /* ---------- 3. process pauses, leases and fencing tokens ---------- */
  reg.fencing = el => seqViz(el, 'Process pauses and fencing tokens', 'A client holds a lease (a lock with a timeout) to write a file. Then it pauses for a long garbage collection. What happens to the storage?', ['Client 1', 'Lock service', 'Storage', 'Client 2'], {
    bug: { name: 'without fencing', steps: [
      { from: 0, to: 1, label: 'acquire lease', msg: 'Client 1 gets the lease, valid for 10 s.' },
      { from: 1, to: 0, label: 'ok, lease until t+10s', cls: 'ok' },
      { from: 0, to: 0, label: '⏸ stop-the-world GC pause (15 s)', cls: 'bad', msg: 'Client 1 is paused: GC, VM migration, swapping, SIGSTOP… It doesn\'t notice time passing.' },
      { from: 3, to: 1, label: 'acquire lease (expired)', msg: 'The lease expires and Client 2 acquires it.' },
      { from: 3, to: 2, label: 'write data', cls: 'ok', msg: 'Client 2 writes, as it\'s allowed to.' },
      { from: 0, to: 2, label: 'write data (still thinks it holds the lease)', cls: 'bad', msg: 'Client 1 wakes up, believes its lease is still valid, and writes: <b>corrupting</b> the file. (HBase had exactly this bug.) A node can\'t trust its own judgement of time.' }] },
    fixed: { name: 'with fencing tokens', steps: [
      { from: 0, to: 1, label: 'acquire lease', msg: 'Every time the lock service grants a lease, it returns a <b>fencing token</b>: a number that increases on every grant.' },
      { from: 1, to: 0, label: 'ok, token 33', cls: 'ok' },
      { from: 0, to: 0, label: '⏸ long GC pause', cls: 'bad' },
      { from: 3, to: 1, label: 'acquire lease' },
      { from: 1, to: 3, label: 'ok, token 34', cls: 'ok' },
      { from: 3, to: 2, label: 'write data, token 34', cls: 'ok', msg: 'The storage remembers the highest token it has processed: 34.' },
      { from: 0, to: 2, label: 'write data, token 33', msg: 'Client 1 wakes up and writes with its old token…' },
      { from: 2, to: 0, label: '✗ rejected: 33 < 34', cls: 'ok', msg: '…and the storage <b>rejects</b> it. The resource itself checks tokens, so a zombie can\'t do damage. ZooKeeper\'s zxid or cversion can serve as the token.' }] }
  }, 'This is the "truth is defined by the majority" principle: a node can believe it is the leader or holds a lock, but if a quorum has declared it dead, it must step down. Fencing tokens assume nodes are honest (no Byzantine faults).');

  /* ---------- 4. linearizability ---------- */
  reg.linearizable = el => seqViz(el, 'Linearizability: behaving like a single copy', 'Alice and Bob refresh the final score from different replicas. In a linearizable system, once any read has returned the new value, all later reads must return it too.', ['Alice', 'Leader', 'Follower 1', 'Follower 2', 'Bob'], {
    bad: { name: 'not linearizable', steps: [
      { from: 1, to: 1, label: 'write: final score Germany 1–0', msg: 'The final score is written to the leader.' },
      { from: 1, to: 2, label: 'replicate', dashed: 1, msg: 'Follower 1 gets it quickly; Follower 2 lags.' },
      { from: 0, to: 2, label: 'refresh', msg: 'Alice refreshes, served by Follower 1…' },
      { from: 2, to: 0, label: '"Germany won 1–0!"', cls: 'ok', msg: '…and exclaims the final score. Bob hears her and refreshes <b>afterwards</b>.' },
      { from: 4, to: 3, label: 'refresh', msg: 'Bob\'s request goes to the lagging Follower 2…' },
      { from: 3, to: 4, label: '"game still in progress"', cls: 'bad', msg: '…which returns the old state. Bob\'s read started after Alice\'s completed, yet saw older data: this <b>violates linearizability</b>. (It\'s fine under eventual consistency.)' },
      { from: 1, to: 3, label: 'replicate (late)', dashed: 1 }] },
    good: { name: 'linearizable', steps: [
      { from: 1, to: 1, label: 'write x = 1 starts', msg: 'A write to register x begins. Until it completes, concurrent reads may return either 0 or 1…' },
      { from: 0, to: 1, label: 'read x', msg: 'Alice reads x during the write…' },
      { from: 1, to: 0, label: '1', cls: 'ok', msg: '…and gets the new value 1. That defines the moment the write "took effect".' },
      { from: 4, to: 1, label: 'read x (later)', msg: 'From then on, every read must return 1 (or a newer value): the value can never flip back to 0.' },
      { from: 1, to: 4, label: '1', cls: 'ok', msg: 'Linearizability = recency guarantee: the system appears to have a single copy of the data and every operation is atomic. Needed for leader election locks, uniqueness constraints and cross-channel timing dependencies.' }] }
  }, 'Linearizable: single-leader replication reading from the leader (potentially), consensus algorithms. Not linearizable: multi-leader replication, leaderless/Dynamo quorums (usually), async followers. CAP, more precisely: when a network partition happens, you choose between linearizability and availability.');

  /* ---------- 5. Lamport timestamps ---------- */
  reg.lamport = el => {
    const { stage, foot } = shell(el, 'Lamport timestamps: a total order consistent with causality', 'Each node keeps a counter. Every operation gets (counter, nodeID). Every node and client remember the maximum counter they\'ve seen and send it with each request.');
    const host = h('div'); stage.append(host);
    const sd = FEVIZ.seqDiagram(host, ['Client A', 'Node 1', 'Node 2', 'Client B'], { w: 680, rowH: 36 });
    const st = h('div', { class: 'vz-stats' }); stage.append(st);
    const S = [
      { from: 0, to: 1, label: 'write (max seen 0)', s: { A: 0, N1: 1, N2: 0, B: 0 }, msg: 'Node 1 increments its counter: the write gets timestamp <b>(1, 1)</b>.' },
      { from: 1, to: 0, label: 'ok (1, 1)', cls: 'ok', s: { A: 1, N1: 1, N2: 0, B: 0 }, msg: 'Client A now remembers max = 1.' },
      { from: 3, to: 2, label: 'write (max seen 0)', s: { A: 1, N1: 1, N2: 1, B: 0 }, msg: 'Independently, node 2 handles a write: timestamp <b>(1, 2)</b>.' },
      { from: 2, to: 3, label: 'ok (1, 2)', cls: 'ok', s: { A: 1, N1: 1, N2: 1, B: 1 } },
      { from: 3, to: 2, label: 'write (max seen 1)', s: { A: 1, N1: 1, N2: 2, B: 1 }, msg: 'Next write on node 2: <b>(2, 2)</b>.' },
      { from: 2, to: 3, label: 'ok (2, 2)', cls: 'ok', s: { A: 1, N1: 1, N2: 2, B: 2 } },
      { from: 0, to: 1, label: 'write (max seen 1)', s: { A: 1, N1: 2, N2: 2, B: 2 }, msg: 'Node 1: <b>(2, 1)</b>. Concurrent with node 2\'s writes, ordered by node ID on ties.' },
      { from: 3, to: 1, label: 'write (max seen 2)', s: { A: 1, N1: 3, N2: 2, B: 2 }, msg: 'Client B sends max = 2 to node 1. Node 1 sets its counter to max(2, 2) + 1 = 3: <b>(3, 1)</b>. Because the max travels with every request, a causally later operation always gets a bigger timestamp.' },
      { from: 1, to: 3, label: 'ok (3, 1)', cls: 'ok', s: { A: 1, N1: 3, N2: 2, B: 3 }, msg: 'Lamport timestamps give a total order consistent with causality. But you only know the order <b>after the fact</b>: a node can\'t decide right now whether a username claim is the winner without hearing from every other node. That needs <b>total order broadcast</b>.' }];
    const player = new Player(stage, f => { sd.draw(S, f.i); st.innerHTML = stats(Object.entries(S[f.i].s).map(([k, v]) => [k + ' max counter', v])); }, { base: 1800 });
    player.load(S.map((s, i) => ({ i, msg: s.msg })));
    foot.append(note('Compare: version vectors can tell whether two operations are concurrent or causally ordered; Lamport timestamps can\'t (they always produce an order), but they\'re far more compact.'));
  };

  /* ---------- 6. two-phase commit ---------- */
  reg.twopc = el => seqViz(el, 'Two-phase commit (2PC)', 'Atomic commit across several nodes: a coordinator asks every participant to prepare, then tells all of them to commit only if every one voted yes.', ['Application', 'Coordinator', 'Database 1', 'Database 2'], {
    ok: { name: 'commit', steps: [
      { from: 0, to: 1, label: 'begin: get global transaction ID', msg: 'The application gets a globally unique transaction ID from the coordinator…' },
      { from: 0, to: 2, label: 'writes (tagged with txid)', msg: '…and does its reads and writes on each participant as normal single-node transactions.' },
      { from: 0, to: 3, label: 'writes (tagged with txid)' },
      { from: 1, to: 2, label: 'phase 1: PREPARE', msg: 'When the app is ready to commit, the coordinator sends <b>prepare</b> to all participants.' },
      { from: 1, to: 3, label: 'PREPARE' },
      { from: 2, to: 1, label: 'yes', cls: 'ok', msg: 'Saying "yes" is a <b>promise</b>: the participant has written everything durably and will commit if asked, even after a crash. It can no longer abort on its own.' },
      { from: 3, to: 1, label: 'yes', cls: 'ok' },
      { from: 1, to: 1, label: 'write decision COMMIT to its log (commit point)', cls: 'spec', msg: 'The coordinator writes its decision to disk: the <b>commit point</b>. From now on the decision is irrevocable.' },
      { from: 1, to: 2, label: 'phase 2: COMMIT', cls: 'ok', msg: 'It tells every participant to commit, retrying forever until they all succeed.' },
      { from: 1, to: 3, label: 'COMMIT', cls: 'ok' }] },
    no: { name: 'a participant votes no', steps: [
      { from: 1, to: 2, label: 'PREPARE' },
      { from: 1, to: 3, label: 'PREPARE' },
      { from: 2, to: 1, label: 'yes', cls: 'ok' },
      { from: 3, to: 1, label: 'NO (constraint violated / crashed / timeout)', cls: 'bad', msg: 'If any participant says no (or times out), the transaction must abort everywhere.' },
      { from: 1, to: 2, label: 'ABORT', cls: 'bad' },
      { from: 1, to: 3, label: 'ABORT', cls: 'bad', msg: 'Atomicity across nodes: all commit or all abort.' }] },
    stuck: { name: 'coordinator crashes', steps: [
      { from: 1, to: 2, label: 'PREPARE' },
      { from: 1, to: 3, label: 'PREPARE' },
      { from: 2, to: 1, label: 'yes', cls: 'ok' },
      { from: 3, to: 1, label: 'yes', cls: 'ok' },
      { from: 1, to: 1, label: '✗ coordinator crashes after deciding', cls: 'bad', msg: 'The coordinator crashes after receiving the votes but before telling the participants.' },
      { from: 2, to: 2, label: 'in doubt: holding locks… waiting', cls: 'bad', msg: 'Participants that voted yes are now <b>in doubt</b> (uncertain). They can\'t commit (another participant may have voted no) or abort (the coordinator may have decided commit). They must wait, <b>holding row locks</b>, until the coordinator recovers from its log. 2PC is a <b>blocking</b> protocol.' },
      { from: 3, to: 3, label: 'in doubt: waiting', cls: 'bad', msg: 'If the coordinator\'s log is lost, an administrator must decide manually (heuristic decisions). XA transactions inherit all of this.' }] }
  }, 'Three-phase commit avoids blocking only under unrealistic assumptions (bounded delays). Fault-tolerant consensus (Raft, Zab, Paxos) is what systems actually use to agree despite failures.');

  /* ---------- 7. leader election (consensus) ---------- */
  reg.consensus = el => {
    const { stage, foot } = shell(el, 'Consensus: electing a leader with epochs and quorums', 'Five nodes. The leader dies; a new leader can only be elected with votes from a majority, and every election increments the epoch (term) number.');
    const host = h('div'); stage.append(host);
    const scene = new Scene(host, 620, 260);
    foot.append(legend([['ok', 'leader'], ['vis', 'follower'], ['cur', 'candidate'], ['bad', 'down'], ['spec', 'voted']]));
    const pos = [[310, 40], [520, 110], [440, 225], [180, 225], [100, 110]];
    const node = (i, cls, lab) => ({ id: 'n' + i, x: pos[i][0], y: pos[i][1], shape: 'circle', r: 32, label: 'N' + (i + 1), sub: lab, cls });
    const S = [
      { n: [node(0, 'ok', 'leader · epoch 1'), node(1, 'vis', 'epoch 1'), node(2, 'vis', 'epoch 1'), node(3, 'vis', 'epoch 1'), node(4, 'vis', 'epoch 1')], e: [0, 1, 2, 3].map(i => ({ a: 'n0', b: 'n' + (i + 1), cls: 'ok' })), msg: 'N1 is leader in epoch 1, sending heartbeats. All decisions go through it, so there is a total order.' },
      { n: [node(0, 'bad', 'crashed'), node(1, 'vis', 'epoch 1'), node(2, 'vis', 'epoch 1'), node(3, 'vis', 'epoch 1'), node(4, 'vis', 'epoch 1')], e: [], msg: 'N1 crashes. Followers stop receiving heartbeats; after a timeout, a follower suspects the leader is dead.' },
      { n: [node(0, 'bad', 'crashed'), node(1, 'cur', 'candidate · epoch 2'), node(2, 'vis', 'epoch 1'), node(3, 'vis', 'epoch 1'), node(4, 'vis', 'epoch 1')], e: [2, 3, 4].map(i => ({ a: 'n1', b: 'n' + i, cls: 'hl', label: 'vote for me?' })), msg: 'N2 starts an election for <b>epoch 2</b> and asks the others to vote.' },
      { n: [node(0, 'bad', 'crashed'), node(1, 'cur', 'candidate · epoch 2'), node(2, 'spec', 'voted N2'), node(3, 'spec', 'voted N2'), node(4, 'vis', 'slow')], e: [2, 3].map(i => ({ a: 'n' + i, b: 'n1', cls: 'ok', label: 'yes' })), msg: 'A node votes yes only if it hasn\'t seen a higher epoch and the candidate\'s log is at least as up to date as its own. N3 and N4 vote yes. With N2\'s own vote that\'s 3 of 5: a <b>quorum</b>.' },
      { n: [node(0, 'bad', 'crashed'), node(1, 'ok', 'leader · epoch 2'), node(2, 'vis', 'epoch 2'), node(3, 'vis', 'epoch 2'), node(4, 'vis', 'epoch 2')], e: [2, 3, 4].map(i => ({ a: 'n1', b: 'n' + i, cls: 'ok' })), msg: 'N2 is the leader of epoch 2. Since any two majorities overlap, two leaders can never be elected in the <b>same</b> epoch.' },
      { n: [node(0, 'cur', 'back: thinks it\'s leader of epoch 1'), node(1, 'ok', 'leader · epoch 2'), node(2, 'vis', 'epoch 2'), node(3, 'vis', 'epoch 2'), node(4, 'vis', 'epoch 2')], e: [{ a: 'n0', b: 'n2', cls: 'bad', label: 'epoch 1 proposal' }], msg: 'N1 recovers and tries to act as leader. Its proposals carry epoch 1; nodes that have seen epoch 2 reject them, so N1 learns it\'s been replaced. Every proposal must be accepted by a quorum, which reveals any newer epoch.' },
      { n: [node(0, 'vis', 'epoch 2'), node(1, 'ok', 'leader · epoch 2'), node(2, 'vis', 'epoch 2'), node(3, 'vis', 'epoch 2'), node(4, 'vis', 'epoch 2')], e: [0, 2, 3, 4].map(i => ({ a: 'n1', b: 'n' + i, cls: 'ok' })), msg: 'Consensus = uniform agreement, integrity, validity and termination (as long as a majority is up). With 5 nodes it tolerates 2 failures. Used inside ZooKeeper (Zab), etcd (Raft), Consul: systems people use for leader election, locks and configuration rather than implementing consensus themselves.' }];
    const player = new Player(stage, f => scene.update(f.n, f.e), { base: 2000 });
    player.load(S);
  };

  /* ---------- 8. MapReduce ---------- */
  reg.mapreduce = el => {
    const { ctrl, stage, foot } = shell(el, 'MapReduce: map, shuffle, reduce', 'Count page views per URL from web server logs. Mappers emit key-value pairs; the framework partitions and sorts them by key; each reducer sees all values for a key together.');
    let mode = 'count';
    ctrl.append(seg([['count', 'word count / URL count'], ['join', 'reduce-side join']], mode, v => { mode = v; build(); }));
    const view = h('div', { style: 'display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px' }), cap = h('div', { class: 'vz-cap' });
    stage.append(view);
    foot.append(note('Unix equivalent: cat access.log | awk \'{print $7}\' | sort | uniq -c | sort -r -n | head -n 5. MapReduce scales the same idea across thousands of machines with HDFS as the shared filesystem, moving computation to the data, and re-running failed tasks.'));
    const player = new Player(stage, render, { base: 1500 });
    let D;
    function build() {
      if (mode === 'count') D = {
        input: [['/home', '/cart', '/home'], ['/home', '/about', '/cart']],
        map: [['/home,1', '/cart,1', '/home,1'], ['/home,1', '/about,1', '/cart,1']],
        shuffle: [['/about,[1]', '/cart,[1,1]'], ['/home,[1,1,1]']],
        out: [['/about 1', '/cart 2'], ['/home 3']],
        msgs: ['Input files are split into blocks; one <b>map task</b> runs per block, ideally on the machine that stores it.', 'The mapper is called once per record (log line) and emits <code>(url, 1)</code>. It\'s stateless.', 'Each mapper partitions its output by hash(key) into one file per reducer and sorts it. Reducers fetch their partition from every mapper and merge: the <b>shuffle</b>. All values for a key now sit together.', 'The reducer iterates over each key\'s values and outputs <code>(url, sum)</code>. The output is written to the distributed filesystem, ready for the next job.'] };
      else D = {
        input: [['event: user 104 → /a', 'event: user 173 → /b', 'event: user 104 → /c'], ['user 104: born 1989', 'user 173: born 1994']],
        map: [['104 → (event /a)', '173 → (event /b)', '104 → (event /c)'], ['104 → (user 1989)', '173 → (user 1994)']],
        shuffle: [['104 → user 1989, /a, /c'], ['173 → user 1994, /b']],
        out: [['/a: 1989', '/c: 1989'], ['/b: 1994']],
        msgs: ['Two inputs: activity events, and a database dump of user profiles.', 'Both mappers extract the <b>join key</b> (user ID) as the output key.', 'The shuffle brings all records with the same user ID to the same reducer, sorted so that the user record comes first (a <b>secondary sort</b>): a <b>sort-merge join</b>.', 'The reducer keeps the birth year in a local variable and emits it with each event. No network requests per record, only one pass. Hot keys (celebrities) need special handling (skewed join).'] };
      player.load(D.msgs.map((m, i) => ({ i, msg: m })));
    }
    function render(f) {
      const col = (title, groups, show, cls) => '<div class="vz-panel" style="opacity:' + (show ? 1 : .25) + '"><h5>' + title + '</h5>' + groups.map((g, i) => '<div style="margin-bottom:6px"><div style="font:600 10px var(--mono);color:var(--muted)">' + (title.startsWith('input') ? 'block ' + i : title.startsWith('map') ? 'mapper ' + i : 'reducer ' + i) + '</div>' + g.map(x => box(esc(x), cls)).join('') + '</div>').join('') + '</div>';
      view.innerHTML = col('input (HDFS)', D.input, true, '') + col('map output', D.map, f.i >= 1, 'vis') + col('shuffle: by key', D.shuffle, f.i >= 2, 'spec') + col('reduce output', D.out, f.i >= 3, 'ok');
    }
    build();
  };

  /* ---------- 9. log-based message broker ---------- */
  reg.brokerlog = el => {
    const { ctrl, stage, foot } = shell(el, 'Log-based message brokers (Kafka-style)', 'A topic is split into partitions; each is an append-only log. Producers append; consumers read sequentially and just remember an offset per partition. Messages are not deleted when read.', 'Interactive');
    const P = 3;
    let logs = [[], [], []], seqN = 1, offsets = { A: [0, 0, 0], B: [0, 0, 0] }, msg = 'Produce some messages, then consume them with two independent consumer groups.';
    const produce = key => { const p = key % P; logs[p].push('m' + seqN++ + ' (k' + key + ')'); return p; };
    ctrl.append(btn('produce', () => { const k = Math.floor(Math.random() * 9); const p = produce(k); msg = 'Message with key ' + k + ' → partition hash(key) mod ' + P + ' = ' + p + ', appended at offset ' + (logs[p].length - 1) + '. Same key → same partition → ordered.'; draw(); }, 'pri'),
      btn('produce 5', () => { for (let i = 0; i < 5; i++) produce(Math.floor(Math.random() * 9)); msg = 'Five messages appended.'; draw(); }),
      btn('group A consumes', () => consume('A')), btn('group B consumes', () => consume('B')),
      btn('group B rewinds to 0', () => { offsets.B = [0, 0, 0]; msg = 'Consumer group B resets its offsets: it can <b>replay</b> the whole log (e.g. to rebuild a derived index after fixing a bug). Reading is non-destructive.'; draw(); }));
    function consume(g) {
      const got = [];
      for (let p = 0; p < P; p++) while (offsets[g][p] < logs[p].length && got.length < 3) { got.push(logs[p][offsets[g][p]]); offsets[g][p]++; }
      msg = got.length ? 'Group ' + g + ' read ' + got.join(', ') + ' and advanced its offsets. Each partition is read by one consumer in the group, in order.' : 'Group ' + g + ' is caught up: nothing new.';
      draw();
    }
    const view = h('div'), cap = h('div', { class: 'vz-cap' });
    stage.append(view, cap);
    foot.append(note('Compare AMQP/JMS brokers (RabbitMQ, ActiveMQ): messages are deleted once acknowledged, delivered to consumers individually (load balancing without ordering), so you can\'t replay. Log-based brokers (Kafka, Kinesis, DistributedLog) give ordering per partition, replay, and high throughput; a slow consumer just falls behind, until its offset falls off the retained log.'));
    function draw() {
      view.innerHTML = logs.map((l, p) => '<div class="vz-panel" style="margin-bottom:6px"><h5>partition ' + p + '</h5><div style="display:flex;flex-wrap:wrap;gap:2px;align-items:center">' + (l.length ? l.map((m, i) => '<span style="position:relative;display:inline-block;padding:4px 7px;border-radius:6px;font:600 11.5px var(--mono);border:1.5px solid var(--c-vis);background:var(--f-vis)"><span style="color:var(--muted)">' + i + ':</span> ' + m + '</span>').join('') : '<span style="color:var(--muted);font-size:12px">empty</span>') + '</div><div style="font:600 11px var(--mono);margin-top:4px"><span style="color:var(--c-ok)">A@' + offsets.A[p] + '</span> · <span style="color:var(--c-spec)">B@' + offsets.B[p] + '</span></div></div>').join('');
      cap.innerHTML = msg;
    }
    draw();
  };

  /* ---------- 10. stream windows ---------- */
  reg.windows = el => {
    const { ctrl, stage, foot } = shell(el, 'Windows in stream processing', 'Events arrive with event-time timestamps (minutes). Choose a window type and see which window each event falls into. Note the straggler that arrives late.', 'Interactive');
    const EV = [[0.5, 'u1'], [1.4, 'u1'], [2.2, 'u2'], [3.8, 'u1'], [4.1, 'u2'], [6.9, 'u3'], [7.3, 'u3'], [9.6, 'u1'], [2.7, 'u2 (late)']];
    let mode = 'tumbling';
    ctrl.append(seg([['tumbling', 'tumbling 5 min'], ['hopping', 'hopping 5 min / 1 min hop'], ['sliding', 'sliding 3 min'], ['session', 'session (gap 2 min)']], mode, v => { mode = v; draw(); }));
    const cv = h('div', { style: 'position:relative;height:190px;border-radius:10px;background:var(--surface-2);margin-bottom:8px' }), cap = h('div', { class: 'vz-cap' });
    stage.append(cv, cap);
    foot.append(note('Event time vs processing time: a consumer that restarts, or a phone that was offline, delivers old events late. Windowing by processing time gives wrong results then. You must decide when a window is complete: wait a while, then either ignore stragglers or publish a correction.'));
    const X = t => 4 + t * 9.4 + '%';
    function draw() {
      let wins = [];
      if (mode === 'tumbling') wins = [[0, 5], [5, 10]];
      else if (mode === 'hopping') wins = [[0, 5], [1, 6], [2, 7], [3, 8], [4, 9], [5, 10]];
      else if (mode === 'sliding') { const ts = EV.map(e => e[0]).sort((a, b) => a - b); wins = []; ts.forEach(t => { const inn = ts.filter(x => x >= t && x <= t + 3); if (inn.length > 1) wins.push([t, t + 3]); }); wins = wins.slice(0, 5); }
      else { const ts = EV.map(e => e[0]).sort((a, b) => a - b); let s = ts[0], last = ts[0]; ts.slice(1).forEach(t => { if (t - last > 2) { wins.push([s, last]); s = t; } last = t; }); wins.push([s, last]); }
      cv.innerHTML = Array.from({ length: 11 }, (_, i) => '<div style="position:absolute;left:' + X(i) + ';bottom:4px;font:600 10px var(--mono);color:var(--muted)">' + i + 'm</div>').join('') +
        wins.map((w, i) => '<div style="position:absolute;left:' + X(w[0]) + ';width:calc(' + X(w[1]) + ' - ' + X(w[0]) + ' + 6px);top:' + (100 + (i % 4) * 16) + 'px;height:12px;border-radius:6px;background:var(--c-' + ['spec', 'teal', 'cur', 'pink'][i % 4] + ');opacity:.75"></div>').join('') +
        EV.map(([t, u], i) => '<div style="position:absolute;left:' + X(t) + ';top:' + (14 + (i % 3) * 26) + 'px;transform:translateX(-50%);text-align:center"><div style="width:14px;height:14px;border-radius:50%;margin:0 auto;background:var(--c-' + (u.includes('late') ? 'bad' : 'vis') + ')"></div><div style="font:600 10px var(--mono)">' + u + '</div></div>').join('');
      cap.innerHTML = { tumbling: 'Fixed length, <b>no overlap</b>: every event belongs to exactly one window (10:00–10:05, 10:05–10:10). E.g. requests per 5 minutes. The late event at 2.7 m belongs to the first window even if it arrives after that window was emitted.', hopping: 'Fixed length but windows <b>overlap</b> (5-minute windows every minute) to smooth results; an event belongs to several windows. Implemented as 1-minute tumbling windows aggregated over 5 neighbours.', sliding: 'Contains all events within some interval of each other (here 3 minutes), with no fixed boundaries. Implemented by keeping a buffer of events sorted by time and evicting old ones.', session: 'No fixed duration: a session groups a user\'s events that are close together, and ends after a gap of inactivity (2 minutes here). Common for website analytics.' }[mode];
    }
    draw();
  };

  /* ---------- 11. change data capture & derived data ---------- */
  reg.cdc = el => {
    const { ctrl, stage, foot } = shell(el, 'Change data capture: the log as the source of truth', 'Dual writes from the application can leave systems inconsistent. Capturing the database\'s change log and applying it in order keeps every derived system in sync.');
    let mode = 'dual';
    ctrl.append(seg([['dual', 'dual writes (race)'], ['cdc', 'change data capture']], mode, v => { mode = v; build(); }));
    const host = h('div'); stage.append(host);
    const scene = new Scene(host, 640, 250);
    const st = h('div', { class: 'vz-stats' }); stage.append(st);
    foot.append(note('CDC implementations: Debezium (MySQL binlog, PostgreSQL WAL), LinkedIn Databus, Facebook Wormhole, Maxwell, Bottled Water; MongoDB and RethinkDB change streams. Event sourcing goes further: the application records immutable events as the source of truth, and the current state is derived from the log.'));
    const player = new Player(stage, f => { scene.update(f.n, f.e); st.innerHTML = stats(f.s); }, { base: 1800 });
    function build() {
      const N = (db, idx, c1, c2, c3) => [
        { id: 'c1', x: 70, y: 50, w: 100, h: 32, label: 'client 1', cls: c1 || 'vis' },
        { id: 'c2', x: 70, y: 200, w: 100, h: 32, label: 'client 2', cls: c2 || 'vis' },
        { id: 'db', x: 330, y: 60, w: 150, h: 40, label: 'DB x = ' + db, cls: 'teal' },
        { id: 'ix', x: 330, y: 195, w: 150, h: 40, label: 'search index x = ' + idx, cls: c3 || 'spec' }].concat(mode === 'cdc' ? [{ id: 'log', x: 560, y: 125, w: 120, h: 40, label: 'change log', cls: 'cur' }] : []);
      const F = [];
      if (mode === 'dual') {
        F.push({ n: N('A', '?'), e: [{ a: 'c1', b: 'db', label: 'set x = A', cls: 'hl' }], s: [['DB', 'A'], ['index', '—']], msg: 'The application writes to the database and then to the search index itself (dual writes).' });
        F.push({ n: N('B', '?'), e: [{ a: 'c2', b: 'db', label: 'set x = B', cls: 'hl' }], s: [['DB', 'B'], ['index', '—']], msg: 'Client 2 writes B to the database just after.' });
        F.push({ n: N('B', 'B'), e: [{ a: 'c2', b: 'ix', label: 'set x = B', cls: 'hl' }], s: [['DB', 'B'], ['index', 'B']], msg: 'Due to timing, client 2\'s index write arrives first…' });
        F.push({ n: N('B', 'A', '', '', 'bad'), e: [{ a: 'c1', b: 'ix', label: 'set x = A (late)', cls: 'bad' }], s: [['DB', 'B'], ['index', 'A ✗']], msg: '…then client 1\'s. The DB says B, the index says A, <b>forever</b>, with no error. And if one of the two writes fails, they diverge too (an atomic commit problem).' });
      } else {
        F.push({ n: N('A', '?'), e: [{ a: 'c1', b: 'db', label: 'set x = A', cls: 'hl' }, { a: 'db', b: 'log', label: '1: x=A', cls: 'hl' }], s: [['DB', 'A'], ['log', '[x=A]']], msg: 'Applications write only to the database (the leader). Every change is captured from its replication log in commit order.' });
        F.push({ n: N('B', '?'), e: [{ a: 'c2', b: 'db', label: 'set x = B', cls: 'hl' }, { a: 'db', b: 'log', label: '2: x=B', cls: 'hl' }], s: [['DB', 'B'], ['log', '[x=A, x=B]']], msg: 'The order of the log is the order the database decided on.' });
        F.push({ n: N('B', 'B'), e: [{ a: 'log', b: 'ix', label: 'apply 1, 2 in order', cls: 'ok' }], s: [['DB', 'B'], ['index', 'B ✓']], msg: 'Derived systems (search index, cache, data warehouse) consume the log <b>in the same order</b> and end up consistent with the database. A new derived system can be bootstrapped from a snapshot plus the log (or from a compacted log, e.g. Kafka log compaction).' });
      }
      player.load(F);
    }
    build();
  };
})();

</script>
<script>
/* DDIA course: modules live in the text/x-jc script blocks above, written in a small markdown dialect:
   ## Section            -> h2 (listed under "In this module");  ### / #### -> sub-headings
   ```lang Title         -> highlighted code with an optional title
   :::viz name           -> an interactive animation (FEVIZ)
   :::html ... :::       -> raw HTML (figures)
   :::quiz ... :::       -> multiple-choice check: "Q: text", options "- text" / "- [x] text", "> explanation"
   :::tldr [title]       -> "30-second version" summary box
   :::cards [cols] / :::vs / :::tabs / :::steps   -> containers whose items start with "@ Title" lines
   :::deep Title         -> collapsible deep dive
   :::flash              -> recall cards: "Q: ..." then "A: ..."
   > **Tip:** ...        -> callout (Tip / Pitfall / Note / Key idea / Interview / Analogy)
   - **Term**: text      -> a list where every item starts with a bold term renders as term/definition rows
   | a | b |             -> table;  - / 1.  -> lists;  `code`, **bold**, _em_, [link](url) inline */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const slug = s => s.toLowerCase().replace(/<[^>]+>/g, '').replace(/[`*_]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 64);

/* ---------- syntax highlighting ---------- */
const JAVA_KW = new Set(('abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for goto if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while var record yield sealed permits true false null').split(' '));
const JS_KW = new Set('break case catch class const continue debugger default delete do else export extends finally for function if import in instanceof let new of return static super switch this throw try typeof var void while with yield async await null undefined true false'.split(' '));
function hlScript(code, kw) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|(@[A-Za-z]\w*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d[\d_]*(?:\.\d+)?(?:e[+-]?\d+)?[lLfFdD]?\b|\b0[xb][0-9a-fA-F_]+[lL]?\b)|([A-Za-z_$][\w$]*)|([\s\S])/g;
  let out = '', m;
  while ((m = re.exec(code))) {
    if (m[1]) out += '<span class="tc">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="tt">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="ts">' + esc(m[3]) + '</span>';
    else if (m[4]) out += '<span class="tn">' + m[4] + '</span>';
    else if (m[5]) {
      const w = m[5];
      if (kw.has(w)) out += '<span class="tk">' + w + '</span>';
      else if (/^[A-Z]/.test(w)) out += '<span class="tt">' + w + '</span>';
      else if (/^\s*\(/.test(code.slice(re.lastIndex, re.lastIndex + 3))) out += '<span class="tf">' + w + '</span>';
      else out += w;
    } else out += esc(m[6]);
  }

}
const SQL_KW = new Set(('select from where and or not in is null insert into values update set delete create table index view on join left right inner outer group by order having limit as distinct count sum avg min max case when then else end begin commit rollback transaction for primary key references unique default between like exists union all with returning match return create merge prefix filter optional').split(' '));
function hlSql(code) {
  const re = /(--[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)|('(?:''|[^'\n])*'|"(?:\\.|[^"\\\n])*")|(\b\d+(?:\.\d+)?\b)|([A-Za-z_?$:][\w$]*)|([\s\S])/g;
  let out = '', m;
  while ((m = re.exec(code))) {
    if (m[1]) out += '<span class="tc">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="ts">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="tn">' + m[3] + '</span>';
    else if (m[4]) out += SQL_KW.has(m[4].toLowerCase()) ? '<span class="tk">' + m[4] + '</span>' : (/^[A-Z][a-z]/.test(m[4]) ? '<span class="tt">' + m[4] + '</span>' : m[4]);
    else out += esc(m[5]);
  }

}
function highlight(code, lang) {
  if (lang === 'java') return hlScript(code, JAVA_KW);
  if (lang === 'js' || lang === 'json') return hlScript(code, JS_KW);
  if (lang === 'sql' || lang === 'cypher' || lang === 'sparql') return hlSql(code);
  return esc(code);
}
const LANG_NAMES = { java: 'Java', output: 'Output', text: 'Text', bash: 'Terminal', js: 'JavaScript', json: 'JSON', sql: 'SQL', cypher: 'Cypher', sparql: 'SPARQL', prolog: 'Datalog' };

/* ---------- markdown ---------- */
const CODES = [];
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = esc(s)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => '<a href="' + u + '"' + (/^https?:/.test(u) ? ' target="_blank" rel="noopener"' : '') + '>' + t + '</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])_([^_\s][^_]*?)_(?=[\s).,:;!?]|$)/g, '$1<em>$2</em>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + esc(codes[+i]) + '</code>');
}
function codeHtml(code, lang, title) {
  const idx = CODES.push(code) - 1;
  const label = (LANG_NAMES[lang] || lang) + (title ? ' · ' + title : '');
  return '<div class="code' + (lang === 'output' ? ' out' : '') + '"><div class="code-head"><span>' + esc(label) + '</span><span class="ch-r">' +
    (lang === 'output' ? '' : '<button type="button" class="btn-copy" data-copy="' + idx + '">Copy</button>') +
    '</span></div><pre><code>' + highlight(code, lang) + '</code></pre></div>';
}
let QUIZ_SEQ = 0;
function quizHtml(lines) {
  let q = '', why = '', opts = [], ans = -1;
  for (const l of lines) {
    let m;
    if ((m = l.match(/^Q:\s*(.*)/))) q = m[1];
    else if ((m = l.match(/^\s*-\s+(\[x\]\s+)?(.*)/))) { if (m[1]) ans = opts.length; opts.push(m[2]); }
    else if ((m = l.match(/^>\s?(.*)/))) why += (why ? ' ' : '') + m[1];
    else if (l.trim() && !opts.length) q += ' ' + l.trim();
  }
  const id = 'qz' + (++QUIZ_SEQ);
  return '<div class="quiz" data-ans="' + ans + '" id="' + id + '"><div class="quiz-h"><span class="quiz-tag">Check yourself</span></div><p class="quiz-q">' + inline(q) + '</p><div class="quiz-opts" role="group" aria-label="Answers">' +
    opts.map((o, i) => '<button type="button" class="quiz-o" data-i="' + i + '"><span class="quiz-l">' + 'ABCDEFG'[i] + '</span><span>' + inline(o) + '</span></button>').join('') +
    '</div><div class="quiz-why" hidden aria-live="polite">' + inline(why) + '</div></div>';
}
const BLOCK_START = /^(```|:::|#{2,4} |> |\||\s*[-*] |\s*\d+\. |@ )/;
const CALLOUTS = [
  [/^\*\*(Tip|Rule of thumb|Idiom|Do this)/i, 'tip'],
  [/^\*\*(Pitfall|Watch out|Gotcha|Common mistake|Trap|Danger)/i, 'warn'],
  [/^\*\*(Interview)/i, 'iv'],
  [/^\*\*(Analogy|Picture it|Real world|Story)/i, 'fun'],
  [/^\*\*(Note|Why|Naming)/i, 'note'],
  [/^\*\*(Key idea|Mental model|Remember|In short|The big idea)/i, 'key']

function parsePage(page) {
  const h2s = [], used = new Set(), sections = [];

  const note = t => { if (sec) sec.text.push(t); };
  const uid = base => { const b = slug(base) || 'item'; let k = b, n = 2; while (used.has(k)) k = b + '-' + n++; used.add(k); return k; };

  /* lines up to the ':::' that closes the current container (nested containers allowed) */
  const collect = (L, i) => {
    const buf = []; let depth = 0, fence = false;
    for (; i < L.length; i++) {
      const t = L[i].trim();
      if (t.startsWith('```')) fence = !fence;
      else if (!fence && t === ':::') { if (!depth) return { buf, i: i + 1 }; depth--; }
      else if (!fence && /^:::(?!viz )\w/.test(t)) depth++;

    }
    return { buf, i };
  };
  /* split a container body into items at top-level "@ Title" lines */
  const items = buf => {
    const out = []; let depth = 0, fence = false, lead = [];
    for (const l of buf) {
      const t = l.trim();
      if (t.startsWith('```')) fence = !fence;

        break;
      }

      if (im && lind > ind && its.length) { const r = list(L, i); its[its.length - 1].sub += r.html; i = r.i; continue; }
      if (lind > ind && its.length && !BLOCK_START.test(l.trim() + ' ')) { its[its.length - 1].t.push(l.trim()); i++; continue; }
      break;
    }

    if (kv) return { i, html: '<ul class="kv">' + its.map(it => { const m = it.t.join(' ').match(KV); return '<li><span class="kv-k">' + inline(m[1]) + '</span><span class="kv-v">' + inline(m[2]) + it.sub + '</span></li>'; }).join('') + '</ul>' };
    const tag = ord ? 'ol' : 'ul';
    return { i, html: '<' + tag + (ord ? ' class="flow"' : '') + '>' + its.map(it => '<li>' + inline(it.t.join(' ')) + it.sub + '</li>').join('') + '</' + tag + '>' };
  };

    const cards = []; let cur = null;

      else if (cur && (m = l.match(/^A:\s*(.*)/))) cur.a.push(m[1]);

    return '<div class="flash">' + cards.map((c, k) => '<button type="button" class="fc" aria-expanded="false"><span class="fc-n">' + (k + 1) + '</span><span class="fc-q">' + inline(c.q) + '</span><span class="fc-a">' + inline(c.a.join(' ')) + '</span><span class="fc-hint">tap to reveal</span></button>').join('') + '</div>';
  };

  function run(L) {
    const out = [];
    for (let i = 0; i < L.length;) {
      const l = L[i];
      let m;
      if (!l.trim()) { i++; continue; }
      if (l.startsWith(':::viz ')) { out.push('<div class="vz" data-viz="' + esc(l.slice(7).trim()) + '"></div>'); viz++; i++; continue; }
      if ((m = l.trim().match(/^:::(\w+)\s*(.*)$/))) {

        else if (kind === 'flash') out.push('<div class="flash-wrap"><div class="flash-h"><span>Flip cards</span>Answer in your head first, then tap a card to check.</div>' + flash(buf) + '</div>');
        else if (kind === 'tldr') out.push('<div class="tldr"><div class="tldr-h"><span aria-hidden="true">⚡</span>' + esc(arg || 'The 30-second version') + '</div>' + run(buf) + '</div>');
        else if (kind === 'deep') out.push('<details class="deep"><summary><span class="deep-tag">Deep dive</span><span class="deep-t">' + inline(arg || 'More detail') + '</span></summary><div class="deep-b">' + run(buf) + '</div></details>');
        else if (kind === 'cards' || kind === 'vs') {
          const s = items(buf), cols = kind === 'vs' ? 2 : +arg || (s.items.length % 3 === 0 && s.items.length > 2 ? 3 : 2);
          out.push(run(s.lead) + '<div class="cgrid c' + cols + (kind === 'vs' ? ' vs' : '') + '">' + s.items.map((it, k) =>
            (kind === 'vs' && k === 1 ? '<div class="vs-badge" aria-hidden="true">vs</div>' : '') +
            '<div class="ccard t' + (k % 6) + '"><div class="ccard-h">' + inline(it.title) + '</div>' + run(it.lines) + '</div>').join('') + '</div>');

            '<button type="button" role="tab" class="tab-b' + (k ? '' : ' on') + '" aria-selected="' + !k + '" aria-controls="' + id + '-' + k + '" data-tab="' + k + '">' + inline(it.title) + '</button>').join('') + '</div>' +
            s.items.map((it, k) => '<div class="tab-p" role="tabpanel" id="' + id + '-' + k + '"' + (k ? ' hidden' : '') + '>' + run(it.lines) + '</div>').join('') + '</div>');

/* ---------- modules ---------- */
const MODS = [...document.querySelectorAll('script[type="text/x-jc"]')].map((s, n) => ({
  id: s.id.replace(/^m-/, ''), n, title: s.dataset.title, short: s.dataset.short || s.dataset.title,
  part: s.dataset.part, lede: s.dataset.lede || '', src: s.textContent

const MOD = Object.fromEntries(MODS.map(p => [p.id, p]));
const COURSE = MODS.filter(p => p.id !== 'home');

let studied = store.get('studied', {});
const studiedCount = () => COURSE.filter(p => studied[p.id]).length;

function renderSide(cur) {

    '<a class="navl' + (p.id === cur ? ' on' : '') + (studied[p.id] ? ' done' : '') + '" href="#/' + p.id + '"' + (p.id === cur ? ' aria-current="page"' : '') + '><span>' +

  const k = studiedCount(), pct = Math.round(k / COURSE.length * 100);
  $('#overall').innerHTML = '<b>' + k + '</b> of ' + COURSE.length + ' modules studied · ' + pct + '%<div class="bar"><i style="width:' + pct + '%"></i></div>';
}
function pageHead(p) {
  return '<div class="eyebrow">' + esc(p.part) + (p.id === 'home' ? '' : ' · Module ' + p.n) + '</div><h1>' + esc(p.title) + '</h1>' + (p.lede ? '<p class="lede">' + inline(p.lede) + '</p>' : '') +
    (p.id === 'home' ? '' : '<div class="chips"><span class="chip">~<b>' + p.mins + '</b> min</span>' + (p.viz ? '<span class="chip"><b>' + p.viz + '</b> animation' + (p.viz > 1 ? 's' : '') + '</span>' : '') +
      (p.quiz ? '<span class="chip"><b>' + p.quiz + '</b> quick check' + (p.quiz > 1 ? 's' : '') + '</span>' : '') + (studied[p.id] ? '<span class="chip ok">✓ studied</span>' : '') + '</div>') +
    (p.h2s.length > 1 ? '<nav class="onpage" aria-label="In this module"><b>In this module</b>' + p.h2s.map(h => '<a href="#/' + p.id + '/' + h.id + '">' + inline(h.text) + '</a>').join('') + '</nav>' : '');

function pageFoot(p) {

    '<button type="button" class="btn studied' + (done ? ' on' : '') + '" data-studied="' + p.id + '" aria-pressed="' + done + '">' + (done ? '✓ Studied' : 'Mark as studied') + '</button></div></div>';

  const i = MODS.indexOf(p), prev = MODS[i - 1], next = MODS[i + 1];

    (next ? '<a class="next" href="#/' + next.id + '"><small>Next →</small>' + esc(next.short) + '</a>' : '') + '</nav>';

function homeExtras() {
  const k = studiedCount();
  const kpis = '<div class="kpis"><div class="kpi"><b>' + COURSE.length + '</b><span>modules</span></div><div class="kpi"><b>' + TOTAL_VIZ + '</b><span>interactive animations</span></div>' +
    '<div class="kpi"><b>' + TOTAL_QUIZ + '</b><span>quick checks</span></div><div class="kpi"><b>' + k + '</b><span>modules studied</span></div></div>';
  const parts = [];

    parts.map(g => '<div class="groupt">' + esc(g.name) + '</div><div class="cards">' + g.mods.map(p =>
      '<a class="card' + (studied[p.id] ? ' done' : '') + '" href="#/' + p.id + '"><b><i class="mnum">' + p.n + '</i>' + esc(p.short) + (studied[p.id] ? ' ✓' : '') + '</b><p>' + inline(p.lede) + '</p><small>~' + p.mins + ' min' + (p.viz ? ' · ' + p.viz + ' animation' + (p.viz > 1 ? 's' : '') : '') + '</small></a>').join('') + '</div>').join('');

let curPage = null;
function render() {
  const parts = location.hash.replace(/^#\/?/, '').split('/');

  if (curPage !== p.id) {
    if (window.FEVIZ) FEVIZ.pauseAll();

  closeSide();
  if (target) {
    const t = document.getElementById(p.id + '--' + target);
    if (t) requestAnimationFrame(() => t.scrollIntoView({ block: 'start' }));
  }
}

/* ---------- search ---------- */
const INDEX = MODS.flatMap(p => p.sections.map(s => ({ p, s, title: s.title.toLowerCase(), body: (s.title + ' ' + s.text.join(' ')).toLowerCase() })));
function search(term) {
  const words = term.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = INDEX.map(e => words.every(w => e.body.includes(w)) ? { e, score: words.reduce((s, w) => s + (e.title.includes(w) ? 10 : 1), 0) } : null)
    .filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 60);
  const mark = s => { let h = esc(s); words.forEach(w => { h = h.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); }); return h; };
  const snippet = e => { const t = e.s.text.join(' '), i = t.toLowerCase().indexOf(words[0]); return i < 0 ? t.slice(0, 140) : (i > 40 ? '…' : '') + t.slice(Math.max(0, i - 40), i + 120); };
  $('#page').innerHTML = '<div class="eyebrow">Search</div><h1>' + hits.length + ' results</h1><p class="lede">for “' + esc(term) + '”</p>' +
    (hits.length ? hits.map(({ e }) => '<a class="sr" href="#/' + e.p.id + '/' + e.s.id + '"><small>Module ' + e.p.n + ' · ' + esc(e.p.short) + '</small><b>' + mark(e.s.title.replace(/`/g, '')) + '</b><span>' + mark(snippet(e).replace(/`/g, '')) + '</span></a>').join('') : '<p>Nothing matches. Try fewer or shorter words.</p>');
  curPage = null;
  window.scrollTo(0, 0);
}
$('#search').addEventListener('input', e => { const v = e.target.value.trim(); if (v.length >= 2) search(v); else if (curPage === null) render(); });
$('#search').addEventListener('keydown', e => { if (e.key === 'Escape') { e.target.value = ''; render(); } });

function copyText(text, btn) {
  const done = () => { btn.textContent = 'Copied ✓'; setTimeout(() => { btn.textContent = 'Copy'; }, 1400); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0'; document.body.append(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { /* ignore */ } ta.remove(); }
}

/* ---------- events ---------- */
$('#page').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.copy) copyText(CODES[+t.dataset.copy], t);
  else if (t.dataset.studied) {
    const id = t.dataset.studied, on = !studied[id];
    if (on) studied[id] = Date.now(); else delete studied[id];
    store.set('studied', studied);
    t.classList.toggle('on', on); t.setAttribute('aria-pressed', String(on)); t.textContent = on ? '✓ Studied' : 'Mark as studied';
    renderSide(id);
  } else if (t.classList.contains('tab-b')) {
    const tabs = t.closest('.tabs'), k = t.dataset.tab;
    tabs.querySelectorAll(':scope > .tab-bar > .tab-b').forEach(b => { const on = b === t; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); });
    tabs.querySelectorAll(':scope > .tab-p').forEach((p, i) => { p.hidden = String(i) !== k; });
  } else if (t.classList.contains('fc')) {
    const on = t.getAttribute('aria-expanded') !== 'true';
    t.setAttribute('aria-expanded', String(on)); t.classList.toggle('flip', on);
  } else if (t.classList.contains('quiz-o')) {
    const qz = t.closest('.quiz'), ans = +qz.dataset.ans, i = +t.dataset.i;
    qz.querySelectorAll('.quiz-o').forEach(b => { b.classList.remove('right', 'wrong'); if (+b.dataset.i === ans) b.classList.add(i === ans ? 'right' : 'reveal'); });
    if (i !== ans) t.classList.add('wrong');
    const why = qz.querySelector('.quiz-why');
    why.hidden = false;
    why.innerHTML = '<b>' + (i === ans ? 'Correct.' : 'Not quite.') + '</b> ' + why.innerHTML.replace(/^<b>(Correct\.|Not quite\.)<\/b> /, '');
  }
});
const side = $('#side'), scrim = $('#scrim'), menuBtn = $('#menuBtn');
function closeSide() { side.classList.remove('open'); scrim.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); }
menuBtn.addEventListener('click', () => {
  const open = !side.classList.contains('open');
  side.classList.toggle('open', open); scrim.hidden = !open; menuBtn.setAttribute('aria-expanded', String(open));
});
scrim.addEventListener('click', closeSide);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && side.classList.contains('open')) { closeSide(); menuBtn.focus(); }
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) { e.preventDefault(); if (innerWidth <= 960 && !side.classList.contains('open')) menuBtn.click(); $('#search').focus(); }
});
window.addEventListener('hashchange', () => { if ($('#search').value.trim().length >= 2) $('#search').value = ''; render(); });
render();

</script>
</body>
</html>
