:::tldr
- **Linearizability**: the system behaves as if there's **one copy** of the data. Once any read sees a new value, every later read does too.
- **CAP**: during a network partition, choose linearizability _or_ availability. Partitions aren't optional.
- **Causality** is a partial order and the strongest model that stays available during partitions. **Lamport timestamps** give a total order consistent with causality.
- **Total order broadcast** (reliable delivery, same order everywhere) is equivalent to **consensus**, and so are linearizable compare-and-set, locks and uniqueness constraints.
- **Two-phase commit** gives atomic commit across nodes but **blocks** if the coordinator dies.
- **Raft/Paxos/Zab** reach fault-tolerant consensus with epochs and overlapping majority quorums. Most apps use them through **ZooKeeper/etcd**.
:::

## Consistency guarantees

The best way to build fault-tolerant systems: find general-purpose **abstractions** with useful guarantees, implement them once, and let applications rely on them. Transactions are one (apps can pretend there are no crashes or concurrency). The most important abstraction for distributed systems is **consensus**: getting all nodes to agree on something, such as who the leader is.

> **Pitfall:** Most replicated databases offer only **eventual consistency**: stop writing, wait some unspecified time, and reads eventually agree. A better name is **convergence**. It says nothing about _when_, and until then a read could return anything. Bugs caused by weak guarantees are subtle, hard to test for, and show up only during faults or high concurrency.

Stronger models cost performance or fault tolerance, but they're much easier to use correctly.

:::vs
@ Transaction isolation
Avoiding race conditions between **concurrently executing transactions**.
@ Distributed consistency
Coordinating the **state of replicas** in the face of delays and faults.
:::

The two overlap but are mostly independent.

## Linearizability

In an eventually consistent database, two replicas asked the same question at the same moment may answer differently. What if the database gave the illusion of **a single replica**? That's **linearizability** (also called atomic consistency, strong consistency, immediate consistency or external consistency).

> **Key idea:** Linearizability is a **recency guarantee**. As soon as one client's write completes, every client reading afterwards must see that value. Stale reads aren't allowed.

> **Picture it:** Alice and Bob are in the same room checking a football score on their phones. Alice refreshes, sees the final score and tells Bob. Bob refreshes, but his request hits a lagging replica, which says the game is still going. Bob's request happened **after** Alice's (he knows it did, because she told him), so this violates linearizability.

### What makes a system linearizable?

Think of a single **register** `x` (one key) with three operations: `read(x)`, `write(x, v)` and `cas(x, old, new)`. Every operation takes time: it starts when the request is sent and ends when the response arrives, and somewhere in between it **takes effect at a single instant**.

:::steps
@ Before the write
Any read returns the old value.
@ After the write completes
Any read returns the new value.
@ During the write
A concurrent read may return either the old or the new value.
@ The extra rule
Once **any** read has returned the new value, **all subsequent reads** by any client must return it too, even if the write hasn't finished. The value can never flip back.
:::

:::viz linearizable

> **Tip:** Draw a vertical line inside each operation's bar where it "really" took effect. The history is linearizable if those lines can be joined in a single sequence that always moves forward in time and matches a valid sequential run of one register.

:::vs
@ Linearizability
A **recency guarantee** on reads and writes of a **single object**. Doesn't group operations into transactions.
@ Serializability
An **isolation property of transactions** (groups of operations on many objects): the result equals _some_ serial order, which may differ from the real order.
:::

> **Pitfall:** Don't mix them up. A database with both is **strictly serializable** (strong one-copy serializability). 2PL and actual serial execution are typically linearizable; **serializable snapshot isolation is not**, because it reads from a snapshot that excludes recent writes.

### Where you need it

:::cards 3
@ Locks and leader election
Single-leader systems must have one leader (no split brain). Every node tries to acquire a lock and the winner leads, so all nodes must agree who holds the lock. ZooKeeper and etcd provide linearizable operations via consensus (Apache Curator adds recipes on top). Oracle RAC's distributed locks are another example.
@ Constraints and uniqueness
Unique usernames or emails, a balance that never goes negative, not selling more stock than you have, no double-booked seats. All need one up-to-date value everyone agrees on, like a lock or a compare-and-set. (Loose constraints, like overbooking then compensating, don't.)
@ Cross-channel timing
Alice and Bob's race worked because of a second channel (her voice). Another: a web server stores a photo, then queues a "resize it" message. If the queue is faster than storage replication, the resizer fetches an old or missing image.
:::

### Which replication methods are linearizable?

The simplest approach is a single copy of the data, but that isn't fault-tolerant.

| Method | Linearizable? |
|---|---|
| Single-leader replication | **Potentially**, if you read from the leader or synchronously updated followers. But a node may wrongly think it's leader (delusional leader), and async failover may lose committed writes, breaking both durability and linearizability. |
| Consensus algorithms (ZooKeeper, etcd) | **Yes**. Like single-leader replication, plus measures against split brain and stale replicas. |
| Multi-leader replication | **No**. Concurrent writes on several nodes, replicated asynchronously, cause conflicts. |
| Leaderless (Dynamo-style) | **Probably not**. Clock-based LWW is almost certainly nonlinearizable (clock skew); sloppy quorums break it; even strict quorums can fail. |

> **Picture it (strict quorums aren't enough):** n = 3, w = 3, r = 2. A writer updates x from 0 to 1, and the write reaches replicas at different times. Reader A queries two replicas, one already updated, and sees **1**. Reader B then queries two replicas that are both still behind and sees **0**, after A saw 1. The quorum condition held, yet the value went backwards.

You can make Dynamo-style quorums linearizable, at a cost: readers must do synchronous read repair before returning, and writers must read a quorum's latest state before writing. Even then only reads and writes are linearizable, not compare-and-set (that needs consensus).

### The cost of linearizability: CAP

Two datacenters lose the link between them, while each datacenter's own network keeps working:

:::vs
@ Multi-leader
Each datacenter keeps working normally. Writes are queued and exchanged once the link returns.
@ Single-leader
Clients in the follower datacenter can't reach the leader, so they can't write, and can't do linearizable reads (the local follower may be stale). They're **unavailable** until the link is restored.
:::

:::vs
@ App requires linearizability
Disconnected replicas **can't process requests**: they wait or return errors. **Unavailable.**
@ App doesn't require it
Each replica processes requests independently, even when disconnected (multi-leader). **Available, not linearizable.**
:::

> **Interview:** CAP is often stated as "Consistency, Availability, Partition tolerance: pick 2 of 3". That's misleading. Network partitions are a **fault**, not a choice: they will happen. The real choice is: **when a partition occurs, choose consistency (linearizability) or availability**. A better phrasing: _either Consistent or Available when Partitioned_. CAP is also narrow: one consistency model and one kind of fault, nothing about network delays, dead nodes or other trade-offs, so it has largely been superseded by more precise results. It was historically valuable for encouraging a wider range of designs (the NoSQL movement).

> **Key idea:** Surprisingly few systems are linearizable in practice. Even **RAM on a multi-core CPU** isn't: each core has its own cache and writes reach main memory asynchronously unless a memory barrier (fence) is used. The reason isn't fault tolerance, it's **performance**, and many distributed databases skip linearizability for the same reason. It's been proven that linearizable reads and writes take time **proportional to the uncertainty of network delays**. Weaker models can be much faster.

## Ordering guarantees

Ordering keeps showing up: the leader orders writes in the replication log; serializability means transactions behave as if run in some order; timestamps and clocks were an attempt to impose order. There are deep links between **ordering, linearizability and consensus**.

### Ordering and causality

Ordering matters because it preserves **causality**. We've already met it many times:

- **Consistent prefix reads**: the answer must come after the question.
- **Rows**: a row must be created before it can be updated.
- **Happens-before**: two operations are concurrent if neither knows about the other.
- **Consistent snapshots** are consistent **with causality**: if a snapshot has the answer, it must have the question.
- **Write skew** broke causality: Alice going off call depended on seeing Bob still on call.
- **Alice and Bob's score**: a causal dependency across two channels.

A system that respects these orderings is **causally consistent**. Snapshot isolation provides causal consistency.

:::vs
@ Total order: linearizability
Any two elements can be compared (5 < 13). Linearizability gives a total order: one copy, atomic operations, so for any two operations one came first. **No concurrency**: a single timeline.
@ Partial order: causality
Some elements can't be compared ({a, b} vs {b, c}). Causally related events are ordered; concurrent ones aren't. **Branching timelines**, like Git history: branches are concurrent, merges join them.
:::

> **Key idea:** Linearizability **implies** causality, but costs performance and availability. **Causal consistency is the strongest model that doesn't slow down with network delays and stays available during network failures.** Many systems that seem to need linearizability really only need causality.

**Capturing causal dependencies**: to preserve causality you must know which operation came before which. Concurrent operations can go in any order, but if A happened before B, every replica must process A first. Techniques generalise **version vectors** (module 6) from one key to the whole database. SSI tracks which data version each transaction read, and the same idea tracks causal dependencies, but tracking every dependency can be expensive.

### Sequence number ordering

Tracking every dependency is impractical. Instead, use **sequence numbers or timestamps**: not from a time-of-day clock (unreliable), but from a **logical clock**, typically a counter incremented for every operation. They're compact, give a **total order**, and can be made **consistent with causality**: if A happened before B, A gets a lower number (concurrent operations are ordered arbitrarily).

With a single leader this is trivial: it increments a counter for each operation in the replication log. A follower applying the log in order is always causally consistent.

> **Pitfall:** Without a single leader (multi-leader, leaderless, or partitioned), the usual tricks are **not consistent with causality**: odd/even counters on two nodes (one node may be faster), wall-clock timestamps (clock skew), or preallocated blocks (node A gets 1–1,000, node B 1,001–2,000, so a higher number from A can be causally later than one from B).

### Lamport timestamps

A simple way to generate sequence numbers **consistent with causality** (Leslie Lamport, 1978, one of the most cited papers in distributed systems):

:::steps
@ Each node has an ID and a counter
The counter counts the operations the node has processed.
@ A timestamp is (counter, node ID)
That makes every timestamp unique.
@ Compare counters, then IDs
The bigger counter wins; on a tie, the bigger node ID wins.
@ Carry the maximum everywhere
Every node and client tracks the **maximum counter it has seen** and includes it in every request. A node receiving a larger maximum immediately bumps its own counter to that value.
:::

Because the maximum travels with every operation, every causal dependency produces a larger timestamp. Step through an example:

:::viz lamport

:::vs
@ Lamport timestamps
Always produce a **total order**. You **can't** tell whether two operations were concurrent. Compact.
@ Version vectors
Tell whether two operations are **concurrent** or causally dependent. Larger: one entry per replica.
:::

> **Pitfall:** Timestamp ordering isn't enough for **unique usernames**. If two users claim the same name, you could pick the lower timestamp **after the fact**. But a node receiving a request must decide **right now**. To be sure nobody is concurrently claiming the name with a lower timestamp, it would have to ask every other node, and one unreachable node halts everything. The total order emerges only after collecting all operations; you also need to know **when the order is final**. That's total order broadcast.

### Total order broadcast

Single-leader replication orders operations on one leader's CPU core. The hard parts are scaling beyond one leader and surviving failover. The general problem is **total order broadcast** (atomic broadcast): a messaging protocol with two safety properties:

:::vs
@ Reliable delivery
No messages are lost: if one node receives a message, every node does.
@ Totally ordered delivery
Every node receives messages **in the same order**.
:::

These must hold even when nodes or the network fail. Messages can't be delivered during an outage, but retries make them arrive eventually, in the right order.

> **Key idea:** The order is **fixed at delivery time**: a node can't later insert a message earlier in the order. That's what makes it stronger than timestamp ordering. Another way to see it: it's a **log**. Delivering a message is appending to the log, and every node reads the same log in the same order.

:::cards 2
@ Database replication
**State machine replication**: if every message is a write and every replica applies the same writes in the same order, replicas stay consistent. ZooKeeper and etcd implement total order broadcast.
@ Serializable transactions
Each message is a deterministic stored procedure, executed in the same order on every node.
@ Locks with fencing tokens
Each lock request is appended as a message. Messages are numbered sequentially, so the number is a fencing token (ZooKeeper's `zxid`).
@ Linearizable storage
Can be built on total order broadcast, and vice versa (see the tabs below).
:::

:::tabs
@ Linearizable writes from TOB
Total order broadcast is asynchronous (fixed order, but no promise about _when_), while linearizability is a recency guarantee. You can still build one from the other. A unique-username claim as a linearizable compare-and-set:

:::steps
@ Append a claim
Append a message to the log tentatively claiming the username.
@ Wait for it to come back
Read the log until your own message is delivered back to you.
@ Check who came first
Look at every message claiming that name. If the **first** one is yours, commit the claim and acknowledge the client. If it's someone else's, abort.
:::

All nodes see log entries in the same order, so they all agree on which concurrent claim came first.
@ Linearizable reads too
The steps above give **linearizable writes**, but reads from an asynchronously updated store may be stale (that's **sequential consistency**, also called timeline consistency). To make reads linearizable:

- **Sequence reads through the log**: append a message, wait for it to come back, then read (etcd quorum reads).
- **Sync first**: get the latest log position linearizably, wait until you've caught up to it, then read (ZooKeeper's `sync()`).
- **Read from a synchronously updated replica** (chain replication).
@ TOB from linearizable storage
Given a linearizable register holding an integer with atomic **increment-and-get**:

- For every message, increment-and-get the register and attach the value as a sequence number.
- Send the message to every node, resending if it's lost.
- Recipients deliver messages in sequence-number order.

> **Key idea:** Unlike Lamport timestamps, these numbers have **no gaps**. A node that has delivered message 4 and receives 6 knows it must wait for 5. That's the crucial difference between total order broadcast and timestamp ordering.

How hard is a fault-tolerant linearizable increment-and-get? Think hard enough and you end up with a consensus algorithm. **Linearizable compare-and-set (or increment-and-get) registers and total order broadcast are both provably equivalent to consensus.**
:::

## Distributed transactions and consensus

**Consensus** means getting several nodes to agree on something. It sounds easy; many broken systems were built on that belief. Where it's needed:

:::vs
@ Leader election
Every node must agree on who the leader is. If a network fault splits the nodes, you risk **split brain**: two leaders, data loss or inconsistency.
@ Atomic commit
A transaction spanning several nodes may fail on some and succeed on others. To stay atomic, **all** must agree: commit everywhere or abort everywhere.
:::

> **Note:** The **FLP result** (Fischer, Lynch, Paterson) proves no algorithm can always reach consensus if a node may crash, in the **asynchronous** model (no clocks, no timeouts). Yet real systems reach consensus routinely, because they can use **timeouts** or random numbers to suspect crashed nodes, even if the suspicion is sometimes wrong.

### Atomic commit and two-phase commit (2PC)

:::vs
@ On a single node
The storage engine handles it: make the writes durable (WAL), then append a **commit record**. Crash before the commit record: aborted on recovery. Crash after: committed. One disk controller decides.
@ Across several nodes
Sending "commit" to each node independently isn't enough: some may succeed and others fail (constraint violation, crash, lost request, timeout). And a committed transaction **can't be retracted** (others may have read it). A node may commit only when it's **certain every other node will commit too**.
:::

**Two-phase commit** solves this with a new component, the **coordinator** (transaction manager), often a library inside the application process (Narayana, JOTM, BTM, MSDTC). The databases are **participants**.

:::steps
@ Get a global transaction ID
The application asks the coordinator for a globally unique transaction ID.
@ Do the work
The application runs a single-node transaction on each participant, tagged with the global ID. If anything fails here, the coordinator or any participant can abort.
@ Phase 1: prepare
When the application is ready to commit, the coordinator sends **prepare** to every participant.
@ Participants promise
Each participant makes sure it can commit **no matter what**: writes all data to disk (a crash, power cut or full disk is no excuse later) and checks constraints. Voting **yes** means it **gives up the right to abort**, without committing yet.
@ Commit point
With every vote in, the coordinator decides: commit only if **all** voted yes. It writes the decision to its log on disk. That's the **commit point**.
@ Phase 2: commit or abort
The coordinator sends the decision to every participant and **retries forever** until each acknowledges. A participant that crashed must commit on recovery, because it voted yes.
:::

> **Key idea:** 2PC has two **points of no return**: a participant voting yes promises it can commit later, and the coordinator's decision is irrevocable once made.

> **Analogy:** A wedding. The officiant asks each person "do you?". Once both say "I do", they're married, even if one faints right afterwards.

:::viz twopc

:::tabs
@ Coordinator failure
- If a participant or the network fails **before** voting, the coordinator aborts.
- If the coordinator crashes **after a participant voted yes but before sending the decision**, that participant can't abort alone (others may have committed) and can't commit alone (others may have voted no). It's **in doubt** and must wait for the coordinator.
- That's why the coordinator writes its decision to disk first. On recovery, it reads its log; transactions with no commit record are aborted.

> **Pitfall:** 2PC is a **blocking** protocol: it can get stuck waiting for the coordinator to recover.
@ Three-phase commit
**3PC** is non-blocking, but it assumes bounded network delay and bounded response times. With real unbounded delays and pauses it can't guarantee atomicity. Non-blocking atomic commit needs a **perfect failure detector**, which doesn't exist, so 2PC is still what's used.
:::

### Distributed transactions in practice

2PC has a mixed reputation: it gives an important safety guarantee but causes operational problems, kills performance (MySQL distributed transactions reported as **10× slower** than single-node ones) and promises more than it delivers. Many cloud services don't offer it.

:::vs
@ Database-internal
All participants run the **same software** (VoltDB, MySQL Cluster's NDB), so the protocol can be optimised.
@ Heterogeneous
Participants are **different technologies**: two vendors' databases, or a database plus a message broker. Much harder.
:::

> **Key idea:** **Exactly-once message processing.** Heterogeneous transactions can atomically commit a database write **and** the acknowledgement of the queue message that caused it. If either fails, both abort and the message is safely redelivered. This works only if **every** affected system supports the same atomic commit protocol; an email that's already been sent can't be rolled back.

:::tabs
@ XA transactions
**X/Open XA** (eXtended Architecture, 1991) is the standard for 2PC across different technologies.

- Supported by PostgreSQL, MySQL, DB2, SQL Server, Oracle, and by brokers including ActiveMQ, HornetQ, MSMQ and IBM MQ.
- It's a C API for talking to a transaction coordinator. In Java EE it's **JTA**, used through JDBC and JMS drivers.
- The coordinator is usually a **library in the application process**, logging to the application server's local disk. If that process crashes, the coordinator goes with it, and participants with prepared transactions are **stuck in doubt**.
@ Locks held in doubt
Why care so much about in-doubt transactions? Because they **hold locks**.

- A transaction takes row-level **exclusive** locks on rows it modifies (and, under 2PL, **shared** locks on rows it reads), and can't release them until it commits or aborts.
- If the coordinator takes 20 minutes to restart, those locks are held for 20 minutes. If its log is lost, they're held **forever**, until an administrator steps in.
- Other transactions can't modify those rows, and depending on the database may not even read them. Large parts of the application can become unavailable.
@ Orphans and heuristics
**Orphaned** in-doubt transactions happen in practice (the coordinator's log is lost to a bug, say). They hold locks forever, and **rebooting the database doesn't help**: a correct 2PC implementation must keep in-doubt locks across restarts.

- The only way out is for an administrator to decide manually, commit or roll back, under pressure during an outage.
- XA has an emergency escape hatch, **heuristic decisions**: a participant decides alone without the coordinator.

> **Pitfall:** "Heuristic" is a euphemism for **probably breaking atomicity**.
@ Limitations
The coordinator is itself a kind of database (it stores transaction outcomes), so it needs the same care:

- **Single point of failure**: if it isn't replicated, the whole system depends on one machine. Many implementations aren't highly available by default.
- **Stateful app servers**: stateless app servers can be added and removed at will, but a coordinator inside them makes their logs crucial durable state.
- **Lowest common denominator**: XA can't detect **deadlocks across systems** (no standard for sharing lock information) and doesn't work with **SSI** (no protocol for sharing conflicts).
- **Failure amplification**: even internal 2PC needs **every** participant to answer. If any part is broken, the transaction fails, which runs counter to building fault-tolerant systems.
:::

### Fault-tolerant consensus

Formally: one or more nodes **propose** values, and the algorithm **decides** on one. Example: several people try to book the last seat on a plane; each node proposes its customer's ID, and the decision says who gets the seat.

:::cards 2
@ Uniform agreement
No two nodes decide differently.
@ Integrity
No node decides twice.
@ Validity
A decided value was proposed by some node. (Rules out cheats like always deciding `null`.)
@ Termination
Every node that doesn't crash eventually decides.
:::

- **Agreement and integrity** are the core: everyone decides the same thing, and nobody changes their mind.
- **Termination** formalises fault tolerance: the algorithm can't just wait forever like 2PC does for a crashed coordinator. Crashed nodes are assumed never to return (think earthquake), so waiting for recovery doesn't satisfy termination.
- Termination needs a **majority** of nodes working, so it's a liveness property. Agreement, integrity and validity are safety properties, and most algorithms keep them **even if a majority crashes or the network fails**: a big outage can stop progress but can't cause wrong decisions. Most assume no Byzantine faults.

**Consensus = total order broadcast.** The best-known algorithms are **Viewstamped Replication (VSR)**, **Paxos**, **Raft** and **Zab**. Most decide on a **sequence** of values rather than one, which makes them total order broadcast algorithms: repeated rounds of consensus, one per delivered message. Agreement means the same messages in the same order; integrity means no duplicates; validity means no corrupted or fabricated messages; termination means no lost messages. VSR, Raft and Zab implement total order broadcast directly; Paxos does it as **Multi-Paxos**.

:::vs
@ Manually chosen leader
"Consensus" of the dictatorial kind: one node takes writes, and if it dies the system is unavailable until a human configures another. Fails **termination**.
@ Automatic election
Closer to fault-tolerant total order broadcast, but split brain needs everyone to agree who the leader is: consensus. To elect a leader we need consensus, and to get consensus we need a leader. How do we break the loop?
:::

### Epochs and quorums

All these protocols use a leader, but they don't guarantee it's unique. They guarantee something weaker:

:::steps
@ Number every epoch
Each protocol has an **epoch number** (ballot number in Paxos, view number in VSR, term number in Raft). **Within an epoch, the leader is unique.**
@ Elect with a higher epoch
Whenever the leader seems dead, a vote elects a new one with an **incremented** epoch. Epochs are totally ordered, so if two leaders conflict (the old one wasn't really dead), the **higher epoch wins**.
@ Check before deciding
A leader can't trust its own judgement (module 9). For every decision, it sends the proposal to the others and waits for a **quorum** to vote in favour.
@ Voters check epochs
A node votes yes only if it hasn't seen a leader with a higher epoch.
@ Quorums overlap
There are **two votes**: one to elect the leader, one per proposal. The two quorums must **overlap**, so at least one voter on any proposal also took part in the latest election. If no voter reports a higher epoch, the leader knows no newer leader exists and can safely decide.
:::

Kill leaders and watch a new term take over:

:::viz consensus

:::vs
@ Two-phase commit
- The coordinator **isn't elected**.
- Needs **yes from every** participant.
- Blocks if the coordinator dies.
@ Fault-tolerant consensus
- The leader **is elected** each epoch.
- Needs votes from a **majority** only.
- Defines a recovery process to bring nodes to a consistent state after a new leader takes over, so safety always holds.
:::

### Limitations of consensus

Consensus is a huge breakthrough: concrete safety guarantees (agreement, integrity, validity) in a world where everything else is uncertain, and progress as long as a majority works. It gives total order broadcast, and therefore linearizable atomic operations, fault-tolerantly. But it isn't free:

- **Synchronous replication**: voting before deciding is effectively synchronous replication. Databases often prefer async replication for performance and accept losing some data on failover.
- **Strict majority**: 3 nodes to tolerate 1 failure, 5 to tolerate 2. During a partition, only the majority side makes progress.
- **Fixed membership**: most algorithms assume a fixed set of voting nodes. Dynamic membership extensions exist but are far less well understood.
- **Timeouts**: they detect failed nodes. With highly variable delays (geo-distributed systems), transient blips trigger needless elections, and the system can spend more time electing leaders than doing work.
- **Network sensitivity**: Raft has edge cases where one consistently unreliable link makes leadership bounce between two nodes, or forces the leader to keep resigning, so the system never makes progress.

## Membership and coordination services

**ZooKeeper** and **etcd** look like key-value stores: read and write a key's value, iterate over keys. Why bother with consensus? You'll rarely use ZooKeeper directly (it's not a general-purpose database). You'll use it through other projects: HBase, Hadoop YARN, OpenStack Nova and Kafka all rely on it in the background.

ZooKeeper is modelled on Google's **Chubby** lock service. It implements total order broadcast (hence consensus), plus:

:::cards 2
@ Linearizable atomic operations
Atomic compare-and-set lets you build a **lock**: if several nodes try at once, exactly one succeeds, even during failures. Locks are usually **leases** that expire if the client dies.
@ Total ordering of operations
Every operation gets a monotonically increasing transaction ID (`zxid`) and version number (`cversion`), which make natural **fencing tokens**.
@ Failure detection
Clients keep long-lived **sessions** with heartbeats. A brief disconnection keeps the session alive; silence longer than the session timeout kills it. Locks can be **ephemeral nodes**, released automatically when the session dies.
@ Change notifications
Clients can **watch** keys: learn when another client joins the cluster (it writes a value) or fails (its session times out and its ephemeral nodes vanish), without polling.
:::

> **Key idea:** Only the linearizable atomic operations truly need consensus, but the **combination** is what makes ZooKeeper so useful for coordination.

:::tabs
@ Allocating work
- **Leader or primary election** among instances of a service: single-leader databases, job schedulers and similar stateful systems. If the leader fails, another takes over.
- **Partition assignment**: which partition of a database, message stream, file store or actor system lives on which node. Nodes join and take partitions, or fail and others take over theirs.

Both can be built from atomic operations, ephemeral nodes and notifications.

> **Tip:** ZooKeeper is for **slow-changing metadata** such as "10.1.1.23 leads partition 7", which changes over minutes or hours. It's not for application runtime state changing thousands of times a second; tools like Apache BookKeeper handle that.
@ Service discovery
Finding the IP address and port of a service. In clouds where VMs come and go, services **register their endpoints** at startup so others can find them. ZooKeeper, etcd and Consul are used for this.

Discovery doesn't strictly need consensus (DNS, with its layers of caching, is the traditional answer), but leader election does. If your consensus system already knows the leader, it can tell other services too.

Read-only caching replicas (**observers** in ZooKeeper) receive the decision log asynchronously and serve non-linearizable reads without voting.
@ Membership services
Part of a long line of research going back to the 1980s (e.g. air traffic control). A membership service decides **which nodes are currently alive members of the cluster**.

Unbounded delays mean you can't reliably detect failure on your own, but failure detection **plus consensus** lets nodes **agree** on who's alive. A live node can still be wrongly declared dead, but having agreement is very useful: e.g. choose the leader as the lowest-numbered current member.
:::

### Problems equivalent to consensus

Solve any one of these and you can transform the solution into a solution for the others:

:::cards 3
@ Compare-and-set register
Atomically decide whether to set a value, based on whether the current value matches.
@ Atomic commit
Decide whether a distributed transaction commits or aborts.
@ Total order broadcast
Decide the order in which messages are delivered.
@ Locks and leases
Decide which of several racing clients gets the lock.
@ Membership
Given a failure detector (timeouts), decide which nodes are alive and which are dead.
@ Uniqueness constraint
Decide which of several conflicting writes with the same key succeeds and which fails.
:::

All are easy on one node, or with decisions delegated to one node (that's what a single-leader database does). If that leader fails or becomes unreachable, there are three choices:

:::cards 3
@ Wait
Wait for the leader to recover. Many XA/JTA coordinators do this. Fails termination.
@ Fail over manually
A human picks a new leader: an "act of God" approach, limited by human speed.
@ Elect automatically
An algorithm chooses the new leader, which requires **consensus**.
:::

> **Key idea:** Tools like ZooKeeper provide **outsourced** consensus, failure detection and membership for applications. Not every system needs consensus: leaderless and multi-leader systems usually avoid global consensus. Their conflicts are the price, and maybe that's fine: you may just need to live without linearizability and handle branching and merging version histories.

## Recall

:::flash
Q: Linearizability in one sentence?
A: The system behaves as if there's one copy of the data; once any read sees a new value, all later reads do too.
Q: Linearizability vs serializability?
A: Linearizability is a recency guarantee on single objects; serializability is transaction isolation. Both together: strict serializability.
Q: Is serializable snapshot isolation linearizable?
A: No. It reads from a snapshot that excludes recent writes.
Q: Three uses of linearizability?
A: Locks and leader election, uniqueness constraints, and avoiding cross-channel races.
Q: Can strict quorums be nonlinearizable?
A: Yes: one reader sees the new value, a later reader hits stale replicas and sees the old one.
Q: CAP, correctly stated?
A: When a partition occurs, choose linearizability or availability.
Q: Strongest consistency model that stays available during partitions?
A: Causal consistency.
Q: How do Lamport timestamps stay causal?
A: Every message carries the maximum counter seen, and receivers jump their counter forward to it.
Q: Two properties of total order broadcast?
A: Reliable delivery and totally ordered delivery (the same order on every node).
Q: 2PC's two points of no return?
A: A participant voting yes, and the coordinator writing its decision.
Q: Why do in-doubt transactions hurt?
A: They hold row locks until the coordinator recovers, possibly forever.
Q: Four properties of consensus?
A: Uniform agreement, integrity, validity, termination.
Q: How do Raft/Paxos prevent two leaders deciding?
A: Unique leader per epoch; every decision needs a majority quorum overlapping the election quorum.
Q: Four ZooKeeper features?
A: Linearizable atomic ops, total ordering (zxid), failure detection (sessions, ephemeral nodes), change notifications (watches).
:::

:::quiz
Q: Under CAP, what's the real choice a system makes?
- Pick any two of consistency, availability and partition tolerance
- [x] When a network partition happens, either stay linearizable (some nodes become unavailable) or stay available (give up linearizability)
- Between latency and throughput
- Between ACID and BASE
> Partitions aren't optional: they happen. The choice is only meaningful during a partition.
:::

:::quiz
Q: In 2PC, a participant has voted "yes" and the coordinator crashes before sending the decision. What can the participant do?
- Abort after a timeout
- Commit after a timeout
- [x] Nothing safe on its own: it is in doubt, holding locks, until the coordinator recovers (or an administrator intervenes)
- Ask another participant and follow its decision
> Voting yes gives up the right to abort. Other participants may have committed or aborted, so a unilateral (heuristic) decision risks breaking atomicity.
:::

:::quiz
Q: How do Raft/Paxos prevent two leaders from both making decisions?
- They guarantee only one node ever thinks it's leader
- They use synchronised clocks
- [x] Each leader has an epoch (term) number; every decision needs votes from a quorum that overlaps the election quorum, so a stale leader learns of a higher epoch and can't get its proposal accepted
- Only the node with the lowest ID can be leader
> Uniqueness is per epoch, and overlapping majority quorums ensure a newer leader always wins.
:::

:::quiz
Q: What's the main difference between Lamport timestamps and the sequence numbers produced by total order broadcast?
- Lamport timestamps aren't consistent with causality
- [x] Total order broadcast sequences have no gaps and are fixed when delivered, so a node knows when the order is final; with Lamport timestamps you can't know whether a smaller timestamp is still on its way
- Total order broadcast uses physical clocks
- Lamport timestamps detect concurrency
> That gap-free, finalised order is what lets you build things like a unique-username check.
:::
</script>

:::tldr
- Separate the **system of record** (source of truth) from **derived data** (caches, indexes, views) that can always be rebuilt.
- Batch jobs work like **Unix pipes**: immutable inputs, composable steps, rerunnable at will.
- **MapReduce**: mappers emit key–value pairs; the **shuffle** partitions and sorts them by key; reducers process each key's values. Inputs and outputs live in HDFS.
- **Joins**: reduce-side (sort-merge) works on any input; map-side (broadcast hash, partitioned hash, merge) is faster when you know the data's layout.
- Good batch output is **immutable files swapped in atomically**: search indexes, bulk-loaded key-value stores.
- **Spark, Tez and Flink** run a whole workflow as one dataflow graph and skip materialising intermediate data. **Pregel** handles iterative graph algorithms.
:::

## Systems of record and derived data

Part III steps back from single databases to how real applications **combine several data systems**:

:::vs
@ System of record
The **source of truth**. New input is written here first; each fact is represented once, usually normalised. If anything disagrees with it, the system of record wins.
@ Derived data
The result of **transforming** data from another system: caches, denormalised values, indexes, materialised views, recommendation models. Redundant, but often essential for read performance. Lose it, and you can **rebuild it** from the source.
:::

> **Key idea:** Being clear about which data is derived from which is the single most useful thing you can do to make a complex system understandable.

### Three kinds of system

:::cards 3
@ Services (online)
**Input**: a request from a client.
**Metric**: response time and availability.
**Example**: web servers, APIs, databases.
@ Batch processing (offline)
**Input**: a large, **bounded** dataset.
**Metric**: throughput.
**Example**: a nightly job that builds a search index. Runs for minutes to days; nobody waits on it.
@ Stream processing (near-real-time)
**Input**: **unbounded** events as they happen.
**Metric**: latency from event to output.
**Example**: fraud detection on card transactions (module 12).
:::

## Batch processing with Unix tools

Find the five most popular pages in a web server log:

```bash Top 5 URLs from an nginx log
cat /var/log/nginx/access.log |
  awk '{print $7}' |   # 7th field = requested URL
  sort             |   # bring identical URLs together
  uniq -c          |   # count each run of identical lines
  sort -r -n       |   # highest count first
  head -n 5
```

:::vs
@ An in-memory hash map
A custom program keeping a map of URL → count is fine **while the distinct URLs fit in memory**.
@ The sort pipeline
`sort` spills to disk and merges sorted runs (like SSTables in module 3), so it **scales past RAM** and uses every CPU core. This chain chews through gigabytes in seconds.
:::

### The Unix philosophy

:::steps
@ Do one thing well
Build a new program for a new job instead of complicating an old one.
@ Compose
Expect every program's output to become the input of another, as yet unknown, program.
@ Try things early
Build and try quickly; throw away the clumsy parts and rebuild.
@ Use tools
Let tools lighten programming work, even if you have to build the tools first.
:::

Why it works:

:::cards 3
@ A uniform interface
Every program reads and writes files (file descriptors). By convention a file is ASCII text and a line is a record, so any program can connect to any other.
@ Logic separate from wiring
A program reads `stdin` and writes `stdout` without knowing where they lead. The shell user wires them together: loose coupling and late binding.
@ Safe experimentation
Input files are treated as immutable, so rerun as often as you like. Pipe into `less` to inspect any stage, or write a stage to a file and restart from there.
:::

> **Pitfall:** Unix tools run on **one machine**. That's where Hadoop comes in.

## MapReduce and distributed filesystems

MapReduce is like Unix tools spread across thousands of machines: blunt and brute-force, but remarkably effective. Jobs read and write files on a **distributed filesystem**; in Hadoop that's **HDFS**, an open-source version of the Google File System.

- **Shared-nothing**: a daemon on each machine exposes its local disks, and a central **NameNode** tracks which file blocks live where. Conceptually, one big filesystem made from every disk in the cluster.
- **Replicated**: blocks are copied to several machines (or protected with erasure coding such as Reed–Solomon), so data survives machine and disk failures.
- **Huge and cheap**: deployments reach tens of thousands of machines and hundreds of petabytes, on commodity hardware much cheaper than dedicated storage appliances.

### How a MapReduce job runs

:::vs
@ Mapper
Called once per **input record**. Extracts zero or more **key–value pairs**. Keeps no state between records.
@ Reducer
Called once per **key**, with an iterator over all values for that key. Produces output records.
:::

> **Analogy:** In the log example, the mapper is `awk '{print $7}'` (emit the URL as key), the framework's sort replaces `sort`, and the reducer is `uniq -c`. A second job does the final `sort -r -n`.

Step through a job end to end:

:::viz mapreduce

:::steps
@ One map task per block
The input is an HDFS directory; each file block becomes a **map task**. The scheduler runs it on a machine that already holds a replica of that block: **compute moves to the data**.
@ Ship the code
The framework copies the job's code (e.g. a JAR) to those machines and runs the mapper over each record.
@ Partition and sort
Map output is **partitioned by a hash of the key**, so every value for a key goes to the same reducer. Each partition is written as a **sorted** file on the mapper's local disk.
@ The shuffle
When a mapper finishes, each reducer fetches its partition from every mapper. Moving, partitioning and sorting map output is **the shuffle** (despite the name, nothing is random).
@ Merge and reduce
Each reducer **merges** its sorted files so equal keys sit together, calls the reduce function once per key, and writes output to HDFS (replicated).
:::

**Workflows.** One job can only do so much, so real systems chain **dozens to hundreds** of jobs: one job's output directory is the next job's input.

:::deep Workflow tools
- Hadoop itself has no special workflow support. **Schedulers** manage dependencies between jobs: Oozie, Azkaban, Luigi, Airflow, Pinball.
- **Higher-level tools** compile pipelines of operators into the right sequence of MapReduce jobs: Pig, Hive, Cascading, Crunch, FlumeJava.
:::

## Joins in batch processing

In a database, a join on a few records uses an index. Batch jobs usually process **the whole dataset** (an analytic question, not a lookup), so a **full scan** is normal and database-style indexes don't exist.

> **Picture it:** An **activity log** of (`user_id`, URL, timestamp) and a **user database** of (`user_id`, date of birth, …). Question: which pages are popular with which age groups?

> **Pitfall:** Querying the remote user database once per event would be painfully slow (round-trips), could overload it, and would give **nondeterministic** results because it changes during the job. Instead, take a **copy** of the user database (an ETL dump into HDFS) and join locally on the same cluster.

### Reduce-side joins: sort-merge join

:::steps
@ Two sets of mappers
One reads activity events and emits `user_id → event`; the other reads the user database and emits `user_id → user record`.
@ The shuffle brings them together
All records with the same user ID arrive at the **same reducer**. With a **secondary sort**, the user record comes first, then that user's events in timestamp order.
@ The reducer joins
It stores the date of birth in a local variable, iterates over the events, and emits `(url, age)` pairs. It holds **one user's data at a time** and makes no network requests.
:::

> **Key idea:** "Bring all related data to one place" is the heart of MapReduce. Mappers choose each record's key, which decides where it goes; the framework handles the networking. Keeping network communication separate from application logic is also what lets MapReduce **retry failed tasks** transparently.

**Group by** works the same way: use the grouping key as the mapper's key, and the reducer sees every record in the group. Gathering all events of a user session (**sessionization**) is a classic example.

### Handling skew

A key with a huge number of records (a celebrity: a **linchpin object** or **hot key**) sends everything to one reducer, which becomes a straggler. The job can't finish until it does.

:::cards 3
@ Skewed join (Pig)
Sample first to find hot keys. Send a hot key's records to one of **several random reducers**, and replicate the other side of the join to all of them. Crunch's sharded join is similar, with hot keys named explicitly.
@ Hive's skewed join
Hot keys are listed in table metadata and stored in separate files; a map-side join handles them.
@ Two-stage aggregation
For group-by with aggregation: first aggregate on random sub-groups, then combine the partial results per key.
:::

### Map-side joins

Reduce-side joins assume nothing about the input, but sorting, copying and merging is expensive. If you **know** something about the input, a **map-side join** skips reducers and sorting: each mapper reads one input block and writes one output file.

:::tabs
@ Broadcast hash join
**Requirement:** one input is **small enough to fit in memory**.

Every mapper loads the small dataset into an in-memory hash table, then streams its block of the large input and looks up each record.
@ Partitioned hash join
**Requirement:** both inputs are **partitioned the same way**: same key, same hash, same number of partitions.

Mapper _i_ loads only partition _i_ of the small side into a hash table. Hive calls this a **bucketed map join**.
@ Map-side merge join
**Requirement:** both inputs are partitioned the same way **and sorted** by the join key.

The mapper merges the two sorted inputs incrementally, like a reducer would, without holding either side in memory.
:::

| Join type | Output partitioned and sorted by |
|---|---|
| Reduce-side | the **join key** |
| Map-side | the same partitioning and order as the **large input** |

> **Tip:** Knowing the physical layout of datasets matters for optimising joins. It's often recorded in **HCatalog / the Hive metastore**.

## The output of batch workflows

Batch processing isn't transaction processing, and it isn't quite analytics either. Its output is usually a **structure**, not a report.

:::tabs
@ Search indexes
Google originally used MapReduce to build its search index.

- Mappers partition the documents; each reducer builds the index for its partition (a term dictionary with postings lists, as in Lucene) and writes it as immutable files.
- To update: rerun the whole job and swap in the new index, or build incremental segments and merge them later, LSM-style.
@ Key-value stores
Machine learning output (spam filters, anomaly detection) and recommendations ("people you may know", "related products") become a database the web app queries.

> **Pitfall:** **Don't** write to the production database one record at a time from mappers or reducers. It's orders of magnitude slower than normal batch throughput, can overwhelm the database, and breaks all-or-nothing behaviour (a failed job leaves partial results visible).

> **Tip:** Build a brand-new **database file inside the batch job** and bulk-load it into read-only servers: Voldemort, Terrapin, ElephantDB and HBase bulk loading all do this. Servers keep serving the old files while new ones copy in, then switch atomically.
:::

### Philosophy of batch outputs

Same as Unix: treat inputs as immutable, avoid side effects, and produce outputs that **fully replace** the old ones.

:::cards 2
@ Human fault tolerance
Deployed buggy code? Roll back and rerun, or switch back to the old output directory. A read-write database can't do this: bad data stays bad after the code rollback. Recovering easily lets you move faster (**minimising irreversibility**).
@ Easy retries
Failed tasks are simply rerun; output from failed attempts is discarded.
@ Reuse
The same input can feed several jobs, and monitoring jobs can compare output with previous runs.
@ Separation of concerns
Logic is separate from the wiring of input and output directories, so code is reusable and different teams can own different jobs.
:::

> **Tip:** Unlike Unix's untyped text, Hadoop jobs benefit from structured encodings like **Avro** and **Parquet** (module 5), with schema evolution, so not every job needs its own parsing code.

## Hadoop vs distributed databases

MPP databases (module 7) already ran parallel joins in the 1980s and '90s. What's new about Hadoop?

:::tabs
@ Diversity of storage
:::vs
@ MPP databases
Require you to model data to their schema **before** importing it.
@ Hadoop
HDFS files are just bytes: dump raw data first and decide how to process it later (**schema-on-read**). The "**data lake**" or "enterprise data hub".
:::

This shifts the burden of interpretation from producer to consumer, and each consumer can interpret the data differently.

> **Analogy:** The **sushi principle**: raw data is better. Collecting data quickly from many systems matters more than modelling it perfectly up front.
@ Diversity of processing
:::vs
@ MPP databases
Monolithic and tightly tuned for SQL.
@ Hadoop
Run SQL (Hive), but also arbitrary code: machine learning, recommendations, full-text indexing, image analysis.
:::

Over time many processing models came to share one cluster and its storage: HBase (random-access OLTP), Impala (MPP-style SQL), Spark and more, without moving data between systems.
@ Designing for frequent faults
:::vs
@ MPP databases
Abort the whole query if a node crashes (queries take seconds to minutes, so retrying is cheap). Prefer to keep data in memory.
@ MapReduce
Retries individual map or reduce tasks, and eagerly writes intermediate data to disk.
:::

> **Picture it:** Why? Google's environment. MapReduce jobs ran at **low priority** on clusters shared with high-priority online services, and could be **preempted** (killed) at any time. With roughly a 5% chance per hour of a task being killed, a 100-task job running for 10 hours would almost never finish without per-task recovery. Without that kind of preemption, the design is less compelling.
:::

## Beyond MapReduce

MapReduce is clear and useful, but writing raw jobs is laborious (implementing a join from scratch), and its execution model has performance problems.

### Materialisation of intermediate state

Every MapReduce job writes its full output to HDFS, replicated, even when it's just an intermediate result read by one other job. That's **materialisation**. Unix pipes instead **stream** output to the next stage through a small in-memory buffer.

:::cards 3
@ Waiting on stragglers
A job can't start until **every** task of the previous job has finished, so one slow task delays the whole workflow.
@ Redundant mappers
Mappers often just read back what a reducer wrote and repartition it.
@ Over-replication
Replicating temporary data across several nodes is overkill.
:::

### Dataflow engines

**Spark, Tez and Flink** treat a whole workflow as **one job** and model data flowing through several stages. Each stage runs **operators** (user functions), with no forced map/reduce alternation. Operators connect by repartition-and-sort (like the shuffle), repartition without sorting (for hash joins), or broadcast (to every partition).

:::cards 2
@ Sort only when needed
Expensive sorting happens only where an operator actually needs it.
@ No needless map tasks
A mapper's work can be folded into the preceding reduce operator.
@ Smarter scheduling
The scheduler sees every stage and dependency, so it can place tasks to minimise network copying (e.g. the same machine, exchanging data in memory).
@ Lighter intermediate state
Kept in memory or on local disk, not in replicated HDFS.
@ Start early
Operators start as soon as their input is ready.
@ Reuse processes
Existing JVM processes are reused, avoiding startup costs.
:::

They run the same computations as MapReduce workflows, usually much faster. Pig, Hive and Cascading can switch from MapReduce to Tez or Spark with a config change.

**Fault tolerance without materialisation.** If a machine fails and its intermediate state is lost, the engine **recomputes** it from data that's still available (an earlier stage, or the original input).

- **Spark** tracks each dataset's ancestry with **resilient distributed datasets (RDDs)**.
- **Flink** checkpoints operator state.

> **Pitfall:** Recomputation must know whether an operator is **deterministic**. If it's not (iterating a hash table, random numbers, the system clock, external data) and some output already went downstream, downstream operators may have to be killed too, because the recomputed data can differ.

> **Tip:** If intermediate data is much smaller than its source, or the computation is CPU-heavy, materialising it is cheaper than recomputing.

When the job finishes, its final output is still usually written to HDFS for durability. Internally, dataflow engines stream like Unix pipes, except that sorting operators must wait for all of their input before emitting anything.

### Graphs and iterative processing

Graph algorithms like **PageRank** repeatedly propagate information along edges until a condition is met: **iterative** processing, "repeat until done". MapReduce handles this badly: every iteration is a separate job that reads the **entire** input, even if only a small part of the graph changed.

The **bulk synchronous parallel (BSP)** model, popularised by Google's **Pregel** (also Apache Giraph, Spark GraphX, Flink Gelly):

:::steps
@ Supersteps
Each iteration calls a function for every **vertex**, passing it all messages sent to it in the previous iteration.
@ Vertices act
The function can update the vertex's state and send messages along its edges.
@ State persists
A vertex **remembers its state** in memory between iterations, so it only processes new messages. No messages means no work.
@ Reliable messaging
Messages are delivered exactly once, at the next iteration. The framework batches them for the network.
@ Checkpoints
At the end of an iteration, all vertex state is checkpointed. On failure, roll back to the last checkpoint.
:::

> **Pitfall:** The framework decides which vertex runs where, and graphs are hard to partition well, so cross-machine messaging often dominates. If the graph fits on **one machine**, a single-machine algorithm may well beat a distributed one.

### High-level APIs and declarative queries

Hive, Pig, Cascading, Crunch, and the Spark and Flink APIs let you write **relational-style operators** (join, filter, group-by) instead of hand-coding joins.

- **Less code**, and interactive exploration (like piping to `less`).
- **Better execution**: because joins are declarative, an optimiser can choose the algorithm (broadcast, partitioned, sort-merge) and the input order to minimise intermediate state.
- **Fast**: with columnar formats and **vectorised execution** (module 4), batch frameworks approach MPP-database performance while still allowing arbitrary code.
- **Libraries** add specialised algorithms on top: machine learning (Mahout, MLlib), nearest-neighbour search, spatial algorithms, genome analysis.

## Recall

:::flash
Q: System of record vs derived data?
A: The system of record is the source of truth; derived data (caches, indexes, views) can be rebuilt from it.
Q: Why does sort | uniq -c scale past RAM?
A: sort spills to disk and merges sorted runs, like SSTables.
Q: Three reasons the Unix philosophy works?
A: A uniform interface (text files), logic separate from wiring (stdin/stdout), and immutable inputs for safe experimentation.
Q: What does the NameNode do?
A: Tracks which HDFS file blocks are stored on which machines.
Q: What is the shuffle?
A: Partitioning map output by key hash, sorting it, and copying each partition to its reducer.
Q: Why copy the user database into HDFS before a join?
A: Remote lookups per record are slow, overload the database and give nondeterministic results.
Q: What's a secondary sort used for in a join?
A: Making the user record arrive at the reducer before that user's events.
Q: Three map-side joins and their requirements?
A: Broadcast hash (small side fits in memory), partitioned hash (same partitioning), merge join (same partitioning and sorted).
Q: Why bulk-load batch output instead of writing records to a live database?
A: Faster, doesn't overload production, and the swap is all-or-nothing and easy to roll back.
Q: Why did MapReduce write so eagerly to disk?
A: Google's low-priority batch tasks were frequently preempted, so per-task recovery was essential.
Q: How do dataflow engines recover lost intermediate data?
A: They recompute it from lineage (Spark RDDs) or restore from checkpoints (Flink).
Q: What does a Pregel vertex do each superstep?
A: Processes incoming messages, updates its state, and sends messages along its edges.
:::

:::quiz
Q: In a reduce-side sort-merge join of user events with user profiles, what guarantees that a user's profile and events reach the same reducer?
- The reducer queries the user database
- [x] Both mappers emit records keyed by user ID, and the shuffle sends all values for a key to the same partition
- The NameNode routes records
- A broadcast hash table
> With a secondary sort, the profile arrives first, followed by that user's events, so the reducer needs only one user's data in memory.
:::

:::quiz
Q: Why should a batch job build new database files and bulk-load them, rather than write each output record to the production database?
- Databases don't accept writes from Hadoop
- [x] Per-record writes are slow, can overload the live database, and expose partial results if the job fails; immutable output files can be swapped in atomically and rolled back
- Bulk loading is the only way to use indexes
- Reducers can't open network connections
> Immutable, all-or-nothing output is what makes batch jobs easy to retry and safe to roll back after a bug.
:::

:::quiz
Q: What is the main performance advantage of dataflow engines like Spark and Flink over chained MapReduce jobs?
- They use SQL only
- [x] They treat the whole workflow as one job, avoiding full materialisation of every intermediate result to replicated HDFS, unnecessary sorts and redundant map stages
- They never write to disk
- They don't need fault tolerance
> They recompute lost partitions from lineage (RDDs) or checkpoints instead of relying on materialised intermediate files.
:::
</script>
