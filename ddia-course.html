    draw();
  };

  /* ---------- 4. append-only log + in-memory hash index (Bitcask) ---------- */
  reg.logkv = el => {
    const { ctrl, stage, foot } = shell(el, 'The simplest database: an append-only log with a hash index', 'Every set() appends to the end of the data file. An in-memory hash map stores the byte offset of the latest value for each key. Compaction throws away overwritten values.', 'Interactive');
    let log = [], idx = {}, msg = 'Empty data file. Try set and get.', hl = -1, segN = 0;
    const K = h('input', { class: 'vz-inp', value: '42', style: 'width:80px', 'aria-label': 'key' }), V = h('input', { class: 'vz-inp', value: '{"name":"London"}', style: 'width:170px', 'aria-label': 'value' });
    const add = (k, v) => { const off = log.reduce((s, e) => s + e.k.length + e.v.length + 2, 0); log.push({ k, v, off, dead: false }); if (idx[k] != null) log[idx[k]].dead = true; idx[k] = log.length - 1; hl = log.length - 1; return off; };
    ctrl.append(h('label', { class: 'vz-lbl' }, 'key', K), h('label', { class: 'vz-lbl' }, 'value', V),
      btn('set', () => { const off = add(K.value, V.value); msg = '<code>db_set ' + esc(K.value) + '</code>: append "' + esc(K.value) + ',' + esc(V.value) + '" at byte offset ' + off + ' (a sequential write: fast) and point the hash map at it.'; draw(); }, 'pri'),
      btn('get', () => { const i = idx[K.value]; hl = i ?? -1; msg = i == null ? 'Key not in the hash map → not found, without touching disk.' : '<code>db_get ' + esc(K.value) + '</code>: hash map lookup gives offset ' + log[i].off + ', then <b>one disk seek</b> reads the value: ' + esc(log[i].v); draw(); }),
      btn('delete', () => { if (idx[K.value] == null) { msg = 'Nothing to delete.'; draw(); return; } add(K.value, '☠ tombstone'); log[log.length - 1].dead = true; delete idx[K.value]; msg = 'Deleting appends a <b>tombstone</b> record; compaction will drop the key later.'; draw(); }),
      btn('compact', () => { const live = Object.entries(idx).map(([k, i]) => log[i]); const before = log.length; log = []; idx = {}; live.forEach(e => add(e.k, e.v)); hl = -1; segN++; msg = 'Compaction rewrote the segment keeping only the latest value per key: ' + before + ' → ' + log.length + ' records. In Bitcask this runs in a background thread on frozen segments, then the old segments are deleted.'; draw(); }),
      btn('demo', () => { log = []; idx = {}; [['123456', '{"name":"London"}'], ['42', '{"name":"SF"}'], ['42', '{"name":"San Francisco"}'], ['123456', '{"name":"London","attractions":["Big Ben"]}'], ['7', '{"name":"Paris"}']].forEach(([k, v]) => add(k, v)); msg = 'Five writes, two keys overwritten: the file keeps every version, the index points at the newest.'; draw(); }));
    const file = h('div', { class: 'vz-panel' }), map = h('div', { class: 'vz-panel', style: 'margin-top:8px' }), cap = h('div', { class: 'vz-cap' });
    stage.append(file, map, cap);
    foot.append(note('Pros: very fast writes (sequential append), one seek per read. Limits: all keys must fit in memory, and range queries ("all keys between kitty00000 and kitty99999") need a lookup per key. That\'s what SSTables and LSM-trees fix.'));
    function draw() {
      file.innerHTML = '<h5>data file (append-only)</h5>' + (log.length ? log.map((e, i) => box('<span style="color:var(--muted);font-weight:500">@' + e.off + '</span> ' + esc(e.k) + ',' + esc(e.v), i === hl ? 'cur' : e.dead ? '' : 'vis', e.dead ? 'opacity:.4;text-decoration:line-through' : '')).join('') : '<span style="color:var(--muted)">empty</span>');
      map.innerHTML = '<h5>in-memory hash map: key → byte offset</h5>' + (Object.keys(idx).length ? Object.entries(idx).map(([k, i]) => box(esc(k) + ' → ' + log[i].off, i === hl ? 'cur' : 'teal')).join('') : '<span style="color:var(--muted)">empty</span>');
      cap.innerHTML = msg;
    }
    draw();
  };

  /* ---------- 5. LSM-tree ---------- */
  reg.lsm = el => {
    const { ctrl, stage, foot } = shell(el, 'LSM-tree: memtable, SSTables and compaction', 'Writes go to a sorted in-memory tree (memtable) and a write-ahead log. When the memtable is full it is flushed as a sorted, immutable SSTable. Reads check newest to oldest. Compaction merges SSTables like mergesort.', 'Interactive');
    const LIMIT = 4;
    let mem = {}, ssts = [], wal = 0, msg = 'Write some keys. The memtable flushes at ' + LIMIT + ' keys.', hlK = null, hlT = -1;
    const K = h('input', { class: 'vz-inp', value: 'handbag', style: 'width:110px', 'aria-label': 'key' });
    let v = 1;
    const words = ['apple', 'banana', 'cherry', 'handbag', 'handcuffs', 'handful', 'kiwi', 'mango', 'zebra', 'handiwork', 'lemon', 'date'];
    const put = k => { mem[k] = v++; wal++; hlK = k; hlT = -1; let m = 'put(' + esc(k) + ') → appended to the WAL (for crash recovery) and inserted into the memtable (a red-black/AVL tree, kept sorted).'; if (Object.keys(mem).length >= LIMIT) { const sorted = Object.keys(mem).sort().map(x => [x, mem[x]]); ssts.unshift(sorted); mem = {}; wal = 0; m += ' Memtable full → <b>flushed</b> to disk as SSTable #' + ssts.length + ' (already sorted, so it\'s one sequential write), and the WAL is discarded.'; } return m; };
    ctrl.append(h('label', { class: 'vz-lbl' }, 'key', K), btn('put', () => { msg = put(K.value.trim() || 'x'); draw(); }, 'pri'),
      btn('put random', () => { msg = put(words[Math.floor(Math.random() * words.length)]); draw(); }),
      btn('get', () => { const k = K.value.trim(); hlK = k; let m; if (mem[k] != null) { hlT = -1; m = 'Found in the memtable (newest data): ' + mem[k] + '.'; } else { const t = ssts.findIndex(s => s.some(e => e[0] === k)); hlT = t; m = t < 0 ? 'Checked the memtable and all ' + ssts.length + ' SSTables, newest first: not found. (A <b>Bloom filter</b> per SSTable can say "definitely not here" without reading it.)' : 'Not in the memtable; checked SSTables newest → oldest and found it in SSTable #' + (ssts.length - t) + ' = ' + ssts[t].find(e => e[0] === k)[1] + '. Inside an SSTable a sparse index + binary search finds the key quickly.'; } msg = m; draw(); }),
      btn('compact', () => { if (ssts.length < 2) { msg = 'Need at least 2 SSTables.'; draw(); return; } const merged = {}; ssts.slice().reverse().forEach(s => s.forEach(([k, val]) => { merged[k] = val; })); const n = ssts.reduce((a, s) => a + s.length, 0); ssts = [Object.keys(merged).sort().map(k => [k, merged[k]])]; hlT = 0; msg = 'Compaction merged ' + n + ' entries into one SSTable of ' + ssts[0].length + ': a streaming mergesort over sorted files, keeping only the newest value per key.'; draw(); }),
      btn('reset', () => { mem = {}; ssts = []; wal = 0; v = 1; msg = 'Reset.'; hlK = null; draw(); }));
    const memP = h('div', { class: 'vz-panel' }), disk = h('div', { class: 'vz-panel', style: 'margin-top:8px' }), cap = h('div', { class: 'vz-cap' });
    stage.append(memP, disk, cap);
    foot.append(note('Used by LevelDB, RocksDB, Cassandra, HBase, ScyllaDB, Lucene (term dictionary). Size-tiered vs leveled compaction trade write amplification, read cost and space. High write throughput; reads may check several files.'));
    function draw() {
      memP.innerHTML = '<h5>memory: memtable (sorted) · WAL entries: ' + wal + '</h5>' + (Object.keys(mem).length ? Object.keys(mem).sort().map(k => box(esc(k) + '=' + mem[k], k === hlK ? 'cur' : 'vis')).join('') : '<span style="color:var(--muted)">empty</span>');
      disk.innerHTML = '<h5>disk: SSTables, newest first (immutable, sorted by key)</h5>' + (ssts.length ? ssts.map((s, i) => '<div style="margin:3px 0;padding:4px;border-radius:8px;' + (i === hlT ? 'background:var(--f-ok)' : '') + '"><span style="font:600 11px var(--mono);color:var(--muted);margin-right:6px">#' + (ssts.length - i) + '</span>' + s.map(([k, val]) => box(esc(k) + '=' + val, k === hlK && i === hlT ? 'ok' : 'teal')).join('') + '</div>').join('') : '<span style="color:var(--muted)">none yet</span>');
      cap.innerHTML = msg;
    }
    draw();
  };

  /* ---------- 6. B-tree insert with page split ---------- */
  reg.btree = el => {
    const { ctrl, stage, foot } = shell(el, 'B-tree: fixed-size pages, splits on overflow', 'Each page holds up to 3 keys here (real pages are 4 KB with a branching factor of several hundred). Insert keys and watch pages split and the tree stay balanced.', 'Interactive');
    const MAX = 3;
    let root, msg = '', hl = new Set();
    const mk = (keys, kids) => ({ keys, kids: kids || [] });
    function insert(k) {
      hl = new Set();
      const path = []; let n = root;
      while (n.kids.length) { path.push(n); let i = 0; while (i < n.keys.length && k > n.keys[i]) i++; n = n.kids[i]; }
      if (n.keys.includes(k)) return 'Key ' + k + ' already exists: it would be updated <b>in place</b> by overwriting that page.';
      n.keys.push(k); n.keys.sort((a, b) => a - b); hl.add(n);
      let m = 'Descend from the root, choosing the child between the surrounding keys, to the leaf page; insert ' + k + ' there.';
      let splits = 0;
      while (n.keys.length > MAX) {
        const mid = Math.floor(n.keys.length / 2), up = n.keys[mid];
        const L = mk(n.keys.slice(0, mid), n.kids.slice(0, mid + 1)), R = mk(n.keys.slice(mid + 1), n.kids.slice(mid + 1));
        const parent = path.pop();
        if (!parent) { root = mk([up], [L, R]); hl.add(L); hl.add(R); hl.add(root); splits++; m += ' The root overflowed and split: a new root was created, so the tree grew one level <b>taller</b> (it stays balanced: every leaf at the same depth).'; break; }
        const i = parent.kids.indexOf(n);
        parent.kids.splice(i, 1, L, R); parent.keys.splice(i, 0, up); hl.add(L); hl.add(R); hl.add(parent);
        splits++; m += ' Page overflowed (' + (MAX + 1) + ' keys): <b>split</b> into two half-full pages and push ' + up + ' up into the parent.';
        n = parent;
      }
      return m + (splits ? ' (A split overwrites several pages; a crash midway would corrupt the tree, so B-trees write to a <b>write-ahead log</b> first.)' : '');
    }
    const reset = () => { root = mk([]); [10, 20, 30, 40, 50, 60, 70].forEach(k => insert(k)); hl = new Set(); msg = 'A small B-tree. Insert more keys.'; };
    const K = h('input', { class: 'vz-inp', type: 'number', value: 35, style: 'width:80px', 'aria-label': 'key' });
    ctrl.append(h('label', { class: 'vz-lbl' }, 'key', K), btn('insert', () => { msg = insert(+K.value); K.value = Math.floor(Math.random() * 99) + 1; draw(); }, 'pri'), btn('insert random', () => { msg = insert(Math.floor(Math.random() * 99) + 1); draw(); }), btn('reset', () => { reset(); draw(); }));
    const host = h('div'); stage.append(host);
    const scene = new Scene(host, 640, 260);
    const cap = h('div', { class: 'vz-cap' }), st = h('div', { class: 'vz-stats' });
    stage.append(st, cap);
    foot.append(note('A 4-level tree of 4 KB pages with branching factor 500 can store up to 256 TB. Lookups are O(log n) page reads. Unlike LSM-trees, B-trees update pages in place, so each key exists in exactly one place: attractive for transactional locking. Used by virtually all relational databases.'));
    function draw() {
      const all = []; let id = 0;
      (function walk(n, p) { n._id = 'p' + (id++); n._p = p; all.push(n); n.kids.forEach(k => walk(k, n)); })(root, null);
      const L = layoutTree(root, n => n.kids, { w: 640, top: 34, gap: 80, maxSlot: 150 });
      scene.size(640, Math.max(150, L.height));
      scene.update(all.map(n => { const p = L.pos.get(n); return { id: n._id + ':' + n.keys.join(','), x: p.x, y: p.y, w: Math.max(60, n.keys.length * 34 + 16), h: 34, label: n.keys.join(' | ') || '∅', cls: hl.has(n) ? 'cur' : n.kids.length ? 'spec' : 'vis' }; }),
        all.filter(n => n._p).map(n => ({ a: n._p._id + ':' + n._p.keys.join(','), b: n._id + ':' + n.keys.join(','), dir: false })), [], { instant: true });
      let depth = 0; for (let n = root; n.kids.length; n = n.kids[0]) depth++;
      st.innerHTML = stats([['pages', all.length], ['depth', depth + 1], ['keys', all.reduce((a, n) => a + (n.kids.length ? 0 : n.keys.length), 0) + all.filter(n => n.kids.length).reduce((a, n) => a + n.keys.length, 0)]]);
      cap.innerHTML = msg;
    }
    reset(); draw();
  };

  /* ---------- 7. row vs column storage ---------- */
  reg.colstore = el => {
    const { ctrl, stage, foot } = shell(el, 'Row-oriented vs column-oriented storage', 'An analytic query touches 3 of 100 columns but millions of rows. See how many bytes each layout must read, and how sorted columns compress with run-length encoding.', 'Interactive');
    let mode = 'row';
    ctrl.append(seg([['row', 'row-oriented (OLTP)'], ['col', 'column-oriented (OLAP)'], ['rle', 'compression']], mode, v => { mode = v; draw(); }));
    const view = h('div', { style: 'overflow-x:auto' }), cap = h('div', { class: 'vz-cap' }), code = h('div', { style: 'margin-bottom:8px' });
    stage.append(code, view, cap);
    codeView(code, ['SELECT date_key, product_sk, SUM(quantity)', 'FROM fact_sales', 'WHERE date_key BETWEEN 140101 AND 140131', 'GROUP BY date_key, product_sk;']);
    foot.append(note('Fact tables in warehouses at Apple, Walmart or eBay hold tens of petabytes and are often 100+ columns wide. Column stores: Vertica, Redshift, BigQuery, Snowflake, ClickHouse, Parquet files. Writes are harder (compressed sorted columns can\'t be updated in place), so they use an LSM-like approach: write to memory, merge into column files in bulk.'));
    const COLS = ['date_key', 'product_sk', 'store_sk', 'customer_sk', 'quantity', 'net_price', 'discount', '…97 more'];
    const used = new Set([0, 1, 4]);
    const rows = [[140102, 69, 4, 'NULL', 1, 13.99, 13.99], [140102, 69, 5, 191, 3, 14.99, 9.99], [140102, 69, 5, 202, 1, 14.99, 14.99], [140102, 74, 3, 'NULL', 5, 0.99, 0.89], [140103, 31, 2, 'NULL', 1, 2.49, 2.49], [140103, 31, 3, 123, 1, 14.99, 9.99], [140103, 31, 3, 233, 1, 14.99, 14.99], [140103, 31, 8, 'NULL', 3, 0.99, 0.99]];
    function draw() {
      if (mode === 'row') {
        view.innerHTML = rows.map(r => '<div style="display:flex;gap:2px;margin:2px 0">' + r.concat(['…']).map((c, i) => '<span style="min-width:62px;padding:3px 4px;border-radius:4px;font:600 11px var(--mono);text-align:center;background:' + (used.has(i) ? 'var(--f-cur)' : 'var(--f-bad)') + ';border:1px solid ' + (used.has(i) ? 'var(--c-cur)' : 'var(--c-bad)') + '">' + c + '</span>').join('') + '</div>').join('');
        cap.innerHTML = 'Rows are stored contiguously, so reading 3 useful columns means loading <b>every column</b> of each row from disk into memory, then discarding 97%. Bytes read ≈ 100 columns × N rows. Great for OLTP ("fetch this customer\'s row"), wasteful for analytics.';
      } else if (mode === 'col') {
        view.innerHTML = COLS.slice(0, 7).map((c, i) => '<div style="display:flex;gap:2px;margin:2px 0;align-items:center"><b style="width:96px;font:600 11px var(--mono);color:var(--muted)">' + c + '</b>' + rows.map(r => '<span style="min-width:52px;padding:3px 4px;border-radius:4px;font:600 11px var(--mono);text-align:center;background:' + (used.has(i) ? 'var(--f-ok)' : 'var(--surface-2)') + ';border:1px solid ' + (used.has(i) ? 'var(--c-ok)' : 'var(--line)') + ';opacity:' + (used.has(i) ? 1 : .35) + '">' + r[i] + '</span>').join('') + '</div>').join('');
        cap.innerHTML = 'Each column is stored in its own file, in the same row order. The query reads only the <b>3 column files</b> it needs (≈ 3% of the bytes). The k-th entry of every column file belongs to the same row, so rows can be reassembled.';
      } else {
        const col = [69, 69, 69, 69, 74, 31, 31, 31, 31, 31, 29, 30, 30, 31, 31, 31, 68, 69, 69];
        const vals = [...new Set(col)].sort((a, b) => a - b);
        view.innerHTML = '<div class="vz-panel"><h5>product_sk column</h5>' + col.map(v => box(v)).join('') + '</div>' + vals.map(v => { const bits = col.map(x => x === v ? 1 : 0); const runs = []; let cur = 0, len = 0; bits.forEach(b => { if (b === cur) len++; else { runs.push(len); cur = b; len = 1; } }); runs.push(len); return '<div style="display:flex;gap:8px;align-items:center;margin:3px 0;font:600 12px var(--mono)"><span style="width:110px">product_sk = ' + v + '</span><span>' + bits.join('') + '</span><span style="color:var(--c-ok)">runs: ' + runs.join(', ') + '</span></div>'; }).join('');
        cap.innerHTML = 'A column with few distinct values becomes one <b>bitmap</b> per value (1 = that row has the value). Bitmaps are sparse, so <b>run-length encoding</b> (alternating counts of 0s and 1s) shrinks them dramatically, and a sort order (e.g. by date, then product) makes runs longer still. <code>WHERE product_sk IN (30, 68, 69)</code> becomes a bitwise OR of three bitmaps. Compressed columns also fit in CPU cache and enable vectorised processing.';
      }
    }
    draw();
  };

  /* ---------- 8. encoding formats ---------- */
  reg.encoding = el => {
    const { ctrl, stage, foot } = shell(el, 'How big is one record?', 'The book\'s example record encoded six ways. Binary formats with a schema drop field names and use variable-length integers.', 'Interactive');
    const F = [
      ['JSON (text)', 81, 'Field names spelled out in every record, numbers as text: human-readable, verbose, ambiguous about integers vs floats and no binary strings.'],
      ['MessagePack', 66, 'Binary JSON: type tags and lengths instead of quotes and braces, but field names are still included. Modest saving.'],
      ['Thrift BinaryProtocol', 59, 'Fields identified by numeric <b>field tags</b> (1, 2, 3) from the schema instead of names.'],
      ['Thrift CompactProtocol', 34, 'Packs the tag and type into one byte and uses <b>variable-length integers</b> (1337 takes 2 bytes).'],
      ['Protocol Buffers', 33, 'Similar to Thrift Compact: tag + wire type in one byte, varints. Field tags are the record\'s stable identity across schema versions.'],
      ['Avro', 32, 'No tags or names at all: values are concatenated in schema order. Decoding requires the <b>writer\'s schema</b>, resolved against the reader\'s schema.']
    ];
    let k = 0;
    ctrl.append(seg(F.map((f, i) => [i, f[0]]), 0, v => { k = +v; draw(); }));
    const code = h('div'), bars = h('div', { class: 'vz-panel', style: 'margin-top:8px' }), cap = h('div', { class: 'vz-cap' });
    stage.append(code, bars, cap);
    codeView(code, ['{', '  "userName": "Martin",', '  "favoriteNumber": 1337,', '  "interests": ["daydreaming", "hacking"]', '}']);
    foot.append(note('Schemas: Protobuf/Thrift "message Person { required string user_name = 1; optional int64 favorite_number = 2; repeated string interests = 3; }". Avro: record Person { string userName; union { null, long } favoriteNumber = null; array<string> interests; }.'));
    function draw() {
      bars.innerHTML = '<h5>encoded size in bytes</h5>' + F.map((f, i) => '<div style="display:flex;align-items:center;gap:8px;margin:4px 0;font:600 12px var(--mono)"><span style="width:170px">' + f[0] + '</span><span style="height:16px;width:' + (f[1] / 81 * 70) + '%;border-radius:4px;background:var(--c-' + (i === k ? 'cur' : 'vis') + ');opacity:' + (i === k ? 1 : .45) + '"></span><span>' + f[1] + '</span></div>').join('');
      cap.innerHTML = '<b>' + F[k][0] + ' · ' + F[k][1] + ' bytes.</b> ' + F[k][2];
    }
    draw();
  };

  /* ---------- 9. schema evolution compatibility ---------- */
  reg.schemaevo = el => {
    const { ctrl, stage, foot } = shell(el, 'Schema evolution: forward and backward compatibility', 'During a rolling upgrade, old and new code run at the same time and read each other\'s data. Pick a schema change and see who can read what.', 'Interactive');
    const C = [
      ['add optional field (with default)', true, true, 'New readers fill in the default when reading old data (backward compatible); old readers skip the unknown field tag / ignore the field missing from their schema (forward compatible). Safe.'],
      ['add required field', false, true, 'New code reading <b>old</b> data finds the required field missing and fails: not backward compatible. Old code can still ignore it. Only add fields that are optional or have a default.'],
      ['remove optional field', true, true, 'Fine, as long as the field tag number is <b>never reused</b> (Protobuf: mark it reserved) and, in Avro, the field had a default.'],
      ['remove required field', true, false, 'Old code still expects it and fails on new data: not forward compatible. You can never remove a required field.'],
      ['rename a field', true, true, 'Protobuf/Thrift: names aren\'t in the encoded data, only tags, so renaming is free. Avro: allowed via aliases in the reader\'s schema (backward compatible only).'],
      ['change int32 → int64', true, false, 'New code reads old 32-bit values fine. Old code reading a 64-bit value truncates it (Protobuf): data loss.'],
      ['change a field\'s tag number', false, false, 'Breaks everything: the tag <b>is</b> the field\'s identity in the encoded bytes.']
    ];
    let k = 0;
    ctrl.append(sel(C.map((c, i) => [i, c[0]]), 0, v => { k = +v; draw(); }, 'Schema change'));
    const grid = h('div', { style: 'display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px' }), cap = h('div', { class: 'vz-cap' });
    stage.append(grid, cap);
    foot.append(note('Backward compatibility: newer code can read data written by older code. Forward compatibility: older code can read data written by newer code. A database may contain data written years ago ("data outlives code"), so both matter.'));
    function draw() {

      grid.innerHTML = cell('Backward: new code reads old data', c[1], 'v2 reader, v1 record') + cell('Forward: old code reads new data', c[2], 'v1 reader, v2 record');
      cap.innerHTML = c[3];
    }
    draw();
  };
})();

/* ===== FEVIZ: DDIA animations, part 2 (chapters 5-7) ===== */
(function () {

    const sd = seqDiagram(host, actors, { w: 680, rowH: 36 });

  FEVIZ.seqViz = seqViz;

  /* ---------- 1. leader-based replication ---------- */
  reg.replication = el => seqViz(el, 'Leader-based replication', 'Clients write to the leader; the leader streams changes to followers through a replication log. Step through synchronous vs asynchronous followers, and what can go wrong in failover.', ['User', 'Leader', 'Follower 1 (sync)', 'Follower 2 (async)'], {

      { from: 1, to: 3, label: 'replication log: data change', dashed: 1, msg: 'Follower 2 is <b>asynchronous</b>: the leader doesn\'t wait for it.' },
      { from: 2, to: 1, label: 'ok', cls: 'ok', msg: 'Follower 1 is <b>synchronous</b>: the leader waits for its confirmation before reporting success. It is guaranteed to have an up-to-date copy.' },

      { from: 3, to: 3, label: 'applies the change… later', cls: 'spec', msg: 'Follower 2 applies the change some time later: usually within milliseconds, but with no bound. If the leader dies now, writes not yet on any follower are <b>lost</b>, even though the client was told they succeeded.' }] },
    failover: { name: 'failover pitfalls', steps: [
      { from: 1, to: 1, label: '✗ leader crashes', cls: 'bad', msg: 'The leader fails. Failover: <b>detect</b> it (usually a timeout), <b>choose</b> a new leader (the most up-to-date replica, by election or a controller), and <b>reconfigure</b> clients and the old leader.' },
      { from: 2, to: 2, label: 'promoted to leader', cls: 'ok', msg: 'Follower 1 becomes the new leader.' },
      { from: 0, to: 2, label: 'new writes → new leader', msg: 'Writes now go to the new leader.' },
      { from: 1, to: 1, label: 'old leader comes back, still thinks it\'s leader', cls: 'bad', msg: 'Danger: the old leader rejoins believing it is still leader → <b>split brain</b>, two nodes accepting writes. Systems need fencing ("STONITH": shoot the other node in the head).' },
      { from: 1, to: 2, label: 'unreplicated writes? discarded', cls: 'bad', msg: 'Writes the old leader accepted but never replicated conflict with the new leader\'s writes; the usual fix is to discard them, which can be dangerous (GitHub: reused auto-increment IDs leaked private data into Redis).' },

  }, 'Replication log implementations: statement-based (breaks with NOW(), RAND()), write-ahead log shipping (tied to the storage engine version), logical/row-based logs (decoupled, enables change data capture), trigger-based.');

  /* ---------- 2. replication lag anomalies ---------- */
  reg.replag = el => seqViz(el, 'Replication lag anomalies', 'With asynchronous followers, reads from a lagging replica can show the past. Three classic anomalies and the guarantee that prevents each.', ['User', 'Leader', 'Follower A', 'Follower B'], {
    ryw: { name: 'read your own writes', steps: [
      { from: 0, to: 1, label: 'insert comment "Nice post!"', msg: 'The user posts a comment; it is written to the leader.' },
      { from: 1, to: 0, label: 'ok', cls: 'ok' },

      { from: 2, to: 0, label: '(no comment yet)', cls: 'bad', msg: '…which hasn\'t received the write yet. The user thinks their comment was lost.' },
      { from: 1, to: 2, label: 'replication arrives', dashed: 1, msg: '<b>Read-after-write consistency</b> fixes it: read things the user may have modified from the leader, or for one minute after a write, or track the write\'s timestamp/LSN and only read from replicas that have caught up. Harder across devices.' }] },
    mono: { name: 'monotonic reads', steps: [
      { from: 1, to: 2, label: 'replicated: comment 1', dashed: 1, msg: 'Follower A is up to date; Follower B lags.' },
      { from: 0, to: 2, label: 'read', msg: 'First read goes to A…' },
      { from: 2, to: 0, label: 'comment 1 ✓', cls: 'ok' },
      { from: 0, to: 3, label: 'read again', msg: '…the next read goes to the lagging B…' },
      { from: 3, to: 0, label: '(no comments)', cls: 'bad', msg: '…and the comment <b>disappears</b>: time seems to move backwards. <b>Monotonic reads</b>: each user always reads from the same replica (e.g. chosen by a hash of the user ID).' }] },
    prefix: { name: 'consistent prefix', steps: [
      { from: 0, to: 1, label: 'Mr Poons: "How far into the future can you see?"', msg: 'In a partitioned database, two causally related writes land in different partitions…' },
      { from: 0, to: 1, label: 'Mrs Cake: "About ten seconds, Mr Poons."', msg: '…the answer depends on the question.' },
      { from: 1, to: 3, label: 'answer replicated first (fast partition)', dashed: 1, cls: 'bad' },
      { from: 1, to: 3, label: 'question replicated later (slow partition)', dashed: 1 },
      { from: 3, to: 0, label: 'observer sees the answer before the question', cls: 'bad', msg: '<b>Consistent prefix reads</b>: if writes happen in an order, anyone reading sees them in that order. Fix: write causally related data to the same partition, or track causal dependencies.' }] }
  }, 'These are not just theoretical: replication lag is usually under a second but can grow to minutes under load or network problems. Eventual consistency only promises that replicas converge "eventually".');

  /* ---------- 3. quorums ---------- */
  reg.quorum = el => {
    const { ctrl, stage, foot } = shell(el, 'Leaderless replication: quorum reads and writes', 'A write goes to all n replicas and succeeds after w acknowledge; a read asks r replicas and takes the newest version. Choose n, w, r and which nodes are down.', 'Interactive');
    let n = 3, w = 2, r = 2, down = new Set(), ver = [1, 1, 1, 1, 1], hasNew = new Set(), readSet = [], msg = 'All replicas hold version 1. Write version 2.', latest = 1;

    const N = mk('n', () => n, v => { n = v; }, () => 1, () => 5), W = mk('w', () => w, v => { w = v; }, () => 1, () => n), R = mk('r', () => r, v => { r = v; }, () => 1, () => n);
    function syncAll() { w = Math.min(w, n); r = Math.min(r, n); W.fill(); R.fill(); W.value = w; R.value = r; [...down].forEach(i => { if (i >= n) down.delete(i); }); }
    ctrl.append(h('label', { class: 'vz-lbl' }, 'n', N), h('label', { class: 'vz-lbl' }, 'w', W), h('label', { class: 'vz-lbl' }, 'r', R),
      btn('write v' + (latest + 1), function () { const up = [...Array(n).keys()].filter(i => !down.has(i)); latest++; const acks = up.slice(0, n); acks.forEach(i => { ver[i] = latest; }); hasNew = new Set(acks); readSet = []; msg = acks.length >= w ? 'Write v' + latest + ' sent to all ' + n + ' replicas; ' + acks.length + ' acknowledged (≥ w = ' + w + ') → <b>success</b>. ' + (down.size ? 'The down nodes missed it and still have older versions.' : '') : 'Only ' + acks.length + ' replicas up, fewer than w = ' + w + ' → the write <b>fails</b> (although it may still be stored on the replicas that did accept it).'; this.textContent = 'write v' + (latest + 1); draw(); }, 'pri'),
      btn('read', () => { const up = [...Array(n).keys()].filter(i => !down.has(i)); const pick = up.slice().sort(() => Math.random() - .5).slice(0, r); readSet = pick; if (pick.length < r) { msg = 'Only ' + pick.length + ' replicas reachable, fewer than r = ' + r + ' → the read fails.'; draw(); return; } const best = Math.max(...pick.map(i => ver[i])); msg = 'Read asked replicas ' + pick.map(i => '#' + (i + 1)).join(', ') + ' and took the newest version: <b>v' + best + '</b>' + (best === latest ? ' ✓ up to date.' : ' ✗ <b>stale</b>!') + (pick.some(i => ver[i] < best) ? ' The client sees a stale replica in its response and writes the newer value back: <b>read repair</b>.' : ''); pick.forEach(i => { ver[i] = best; }); draw(); }),
      btn('anti-entropy', () => { [...Array(n).keys()].filter(i => !down.has(i)).forEach(i => { ver[i] = latest; }); msg = 'A background <b>anti-entropy</b> process copies missing data between replicas (no ordering guarantee, may be slow).'; readSet = []; draw(); }));
    const nodes = h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;margin:6px 0' }), st = h('div', { class: 'vz-stats' }), cap = h('div', { class: 'vz-cap' });
    stage.append(nodes, st, cap);
    foot.append(note('Common choice: n odd (3 or 5), w = r = (n + 1) / 2. Even with w + r > n there are edge cases (sloppy quorums, concurrent writes, a write that failed on some nodes but isn\'t rolled back), so Dynamo-style quorums are not linearizable. Used by Dynamo, Cassandra, Riak, Voldemort.'));
    function draw() {
      nodes.innerHTML = [...Array(n).keys()].map(i => '<button type="button" data-node="' + i + '" style="width:92px;padding:10px 4px;border-radius:12px;cursor:pointer;font:700 13px var(--mono);border:2px solid ' + (down.has(i) ? 'var(--c-bad)' : readSet.includes(i) ? 'var(--c-cur)' : ver[i] === latest ? 'var(--c-ok)' : 'var(--c-spec)') + ';background:' + (down.has(i) ? 'var(--f-bad)' : readSet.includes(i) ? 'var(--f-cur)' : ver[i] === latest ? 'var(--f-ok)' : 'var(--f-spec)') + ';color:var(--ink)">replica ' + (i + 1) + '<br><span style="font-weight:500">' + (down.has(i) ? '✗ down' : 'v' + ver[i]) + '</span></button>').join('');

  };

  /* ---------- 4. detecting concurrent writes with version numbers ---------- */
  reg.siblings = el => {

  reg.partitioning = el => {
    const { ctrl, stage, foot } = shell(el, 'Partitioning: by key range or by hash of key', 'Assign keys to 4 partitions. Key ranges keep keys sorted (fast range scans) but can create hot spots; hashing spreads load but destroys order.', 'Interactive');
    let mode = 'range', data = 'sensor';

    const view = h('div', { style: 'display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px' }), cap = h('div', { class: 'vz-cap' }), st = h('div', { class: 'vz-stats' });

    const md5ish = s => { let h1 = 2166136261; for (const c of s) { h1 ^= c.charCodeAt(0); h1 = Math.imul(h1, 16777619); } return (h1 >>> 0); };
    function draw() {
      const keys = data === 'sensor' ? Array.from({ length: 24 }, (_, i) => '2026-10-30T' + String(8 + Math.floor(i / 6)).padStart(2, '0') + ':' + String(i * 7 % 60).padStart(2, '0')) : ['aaron', 'bea', 'cara', 'dev', 'emil', 'fang', 'gita', 'hugo', 'ivy', 'jo', 'kai', 'lena', 'mira', 'neil', 'omar', 'pia', 'quinn', 'ravi', 'sara', 'tom', 'uma', 'vik', 'wen', 'zoe'];
      const bounds = data === 'sensor' ? ['2026-01-01', '2026-04-01', '2026-07-01', '2026-10-01'] : ['a', 'g', 'm', 's'];
      const parts = [[], [], [], []];
      keys.forEach(k => { let p; if (mode === 'range') { p = 0; for (let i = 0; i < 4; i++) if (k >= bounds[i]) p = i; } else p = md5ish(k) % 4; parts[p].push(k); });
      const max = Math.max(...parts.map(p => p.length));

  /* ---------- 6. rebalancing: mod N vs fixed partitions ---------- */
  reg.rebalance = el => {
    const { ctrl, stage, foot } = shell(el, 'Rebalancing: why not hash mod N?', 'Add a fourth node to a three-node cluster. Compare how much data has to move with hash mod N versus a fixed number of partitions that are reassigned whole.', 'Interactive');
    let strat = 'mod', nodes = 3, prev = 3;

    const keys = Array.from({ length: 60 }, (_, i) => (i * 2654435761) >>> 0);

      for (let nn = 3; nn < N; nn++) { const quota = Math.floor(12 / (nn + 1)); let taken = 0; for (let i = 0; i < 12 && taken < quota; i++) { const counts = owner.reduce((m, o) => (m[o] = (m[o] || 0) + 1, m), {}); const mx = Math.max(...Object.values(counts)); if (counts[owner[i]] === mx) { owner[i] = nn; taken++; } } }

      st.innerHTML = stats([['nodes', nodes], ['keys moved by the last change', prev !== nodes ? moved + ' of ' + keys.length + ' (' + Math.round(moved / keys.length * 100) + '%)' : '—'], ['minimum possible', prev !== nodes ? Math.round(keys.length / Math.max(nodes, prev)) + ' (1/N)' : '—']]);
