:::tldr
- A **stream** is unbounded data arriving over time, made of small immutable **events** that producers publish to **topics** and consumers read.
- **Traditional brokers** (RabbitMQ) delete messages once acknowledged and load-balance per message. **Log-based brokers** (Kafka) append to partitioned logs, keep messages for days, and let consumers track **offsets** and replay.
- **Change data capture** turns a database's write log into a stream, so caches, indexes and warehouses follow it. Never use **dual writes**.
- **Event sourcing** stores immutable application-level events as the source of truth and derives current state (**CQRS**).
- Distinguish **event time** from **processing time**; choose tumbling, hopping, sliding or session **windows**; join stream–stream, stream–table or table–table.
- Get **effectively-once** results with microbatching/checkpoints, atomic commit, or **idempotent** writes.
:::

## From batch to streams

Batch processing assumes **bounded** input: the job knows when it has read everything. In reality, data arrives **gradually**: users produced data yesterday and will produce more today. A daily batch job means output lags by a day. Process more often, and in the limit, process every event as it happens: that's **stream processing**.

A **stream** is data made available incrementally over time (stdin, TCP connections, audio and video). Here we care about **event streams**:

:::cards 3
@ Event
A small, self-contained, **immutable** record of something that happened at a point in time, usually timestamped: a page view, a purchase, a temperature reading, a CPU-usage sample.
@ Producer → consumers
Generated once by a **producer** (publisher, sender); processed by potentially many **consumers** (subscribers, recipients).
@ Topic
Related events are grouped into a **topic** or stream.
:::

> **Note:** You could store events in a file or database and have consumers **poll** for new ones, but frequent polling is expensive and databases have weak notification support (triggers are limited). Dedicated tools deliver events instead.

## Messaging systems

The simplest channel is a direct pipe or TCP connection between one producer and one consumer. A **messaging system** generalises it: many producers send to a topic, many consumers receive. Two questions tell systems apart:

:::vs
@ Producers faster than consumers?
- **Drop** messages;
- **buffer** them in a queue (what happens when it outgrows memory: crash, or spill to disk?);
- or apply **backpressure** (flow control): block the producer, as Unix pipes and TCP do.
@ Nodes crash or go offline?
Are messages lost? Durability needs disk writes and/or replication, which costs performance. If losing some messages is fine (periodic sensor readings), you get higher throughput and lower latency.
:::

:::tabs
@ Direct messaging
No intermediary:
- **UDP multicast** in financial markets: low latency, with the application recovering lost packets.
- Brokerless libraries like **ZeroMQ** and nanomsg.
- **StatsD** and Brubeck send metrics over unreliable UDP.
- **Webhooks**: a service registers a callback URL that's called on every event.

> **Pitfall:** Application code must handle message loss, and producer and consumer are both assumed to be online all the time. An offline consumer may miss messages.
@ Message brokers
A **message broker** (message queue) is essentially a database optimised for message streams. Producers and consumers connect to it as clients.

- Clients can come and go; durability is the broker's job (in memory only, or written to disk).
- Consumers are **asynchronous**: the producer waits only for the broker to buffer the message, not for consumers to process it.
- Traditional AMQP/JMS brokers: RabbitMQ, ActiveMQ, HornetQ, Qpid, TIBCO, IBM MQ, Azure Service Bus, Google Cloud Pub/Sub.
@ Brokers vs databases
| Database | Traditional message broker |
|---|---|
| keeps data until explicitly deleted | **deletes a message once delivered**: not for long-term storage |
| handles large datasets | assumes a small working set; long queues spill to disk and slow down |
| secondary indexes and search | subscribe to topics matching a pattern |
| a query returns a point-in-time snapshot | no arbitrary queries, but **notifies** clients when data changes |
:::

### Multiple consumers

:::vs
@ Load balancing
Each message goes to **one** consumer; consumers share the work. Good when messages are expensive to process. AMQP: several clients on one queue. JMS: shared subscription.
@ Fan-out
Each message goes to **every** consumer: independent consumers each see the whole stream (like several batch jobs reading the same file). JMS: topic subscriptions. AMQP: exchange bindings.
:::

The two patterns are often combined.

**Acknowledgements and redelivery.** Consumers can crash, so a client must explicitly **acknowledge** a message once it's done, and only then does the broker delete it. If the connection drops or times out without an ack, the broker **redelivers** the message to another consumer.

> **Pitfall:** The message may actually have been fully processed with only the ack lost; avoiding that needs atomic commit. And redelivery plus load balancing **reorders** messages: if consumer 2 crashes while processing m3 while consumer 1 handles m4, m3 is redelivered to consumer 1 **after** m4. To keep order, use a separate queue per consumer (no load balancing).

### Partitioned logs

> **Key idea:** In traditional brokers, receiving a message is **destructive**: it's deleted after acknowledgement. You can't rerun a consumer and get the same result, and a new consumer only sees messages sent after it joined. Databases are the opposite: everything stays until you delete it. **Log-based message brokers** combine durable storage with low-latency notifications.

:::steps
@ Append
A producer sends a message by **appending** it to the end of a log on disk.
@ Read sequentially
A consumer reads the log in order. At the end, it waits for notification of new messages, like `tail -f`.
@ Partition
To scale beyond one disk, a topic is split into **partitions** on different machines. Each partition is an independent log.
@ Offsets
Within a partition, every message gets a monotonically increasing **offset**. A partition is **totally ordered**; there's no ordering across partitions.
:::

**Apache Kafka**, Amazon Kinesis Streams and Twitter's DistributedLog work this way (Google Cloud Pub/Sub is similar inside but exposes a JMS-style API). Despite writing everything to disk, they reach **millions of messages per second** by partitioning across machines, and they replicate messages for fault tolerance.

Produce messages and move consumer offsets:

:::viz brokerlog

:::tabs
@ Logs vs traditional
- **Fan-out is trivial**: consumers read the log independently, and reading deletes nothing.
- **Load balancing is per partition**: the broker assigns whole partitions to the nodes in a consumer group, and each node reads **all** messages in its partitions, single-threaded and in order.
- **Downsides**: a topic's work can be shared by at most as many nodes as it has partitions; and one slow message holds up everything behind it in that partition (**head-of-line blocking**).

:::vs
@ Prefer JMS/AMQP when…
Messages are expensive to process, you want per-message parallelism, and order doesn't matter.
@ Prefer logs when…
Throughput is high, each message is fast to process, and **order matters**. Route related messages to the **same partition** (e.g. by user ID).
:::
@ Consumer offsets
Reading a partition in order makes progress easy to track: every message below the consumer's current offset is processed. The broker doesn't track per-message acks; it just periodically records **consumer offsets**.

> **Analogy:** Like the log sequence number in single-leader replication: the broker is the leader and the consumer is a follower.

If a consumer fails, another node in its group takes over its partitions from the last recorded offset. Messages processed after that offset but before it was recorded will be **processed twice**.
@ Disk space
The log is split into segments; old segments are deleted or archived. It's effectively a large **bounded buffer** (a ring buffer).

> **Picture it:** A 6 TB disk written at 150 MB/s fills in about **11 hours**. In practice deployments keep **days or weeks** of messages.

Throughput stays roughly constant regardless of retention, because every message is written to disk anyway. In-memory brokers, in contrast, slow down once they start spilling to disk.
@ Slow consumers
A consumer far enough behind could point at deleted segments and miss messages. But the buffer is huge, so an operator has time to fix it first.

- **Monitor** how far each consumer is behind the head of the log, and alert if it's large.
- A slow consumer only affects **itself**, not others.
- So you can safely run a dev or debug consumer against production logs; if it crashes or is stopped, only its offset remains.
@ Replay
In AMQP/JMS brokers, processing and acking is destructive. In a log, consuming is **read-only**: the only side effect is the consumer offset moving forward, and the consumer controls it.

Start a copy of a consumer from yesterday's offsets, write its output somewhere else, and you've **reprocessed a day of messages**, maybe with new code.

> **Key idea:** That makes log-based messaging feel like batch processing: derived data is cleanly separated from input through a **repeatable transformation**.
:::

## Databases and streams

The connection runs both ways. A replication log (module 6) **is** a stream of write events. And **state machine replication** (module 10) says that if every replica processes the same events in the same order, they all end up in the same state. Let's use that to keep different systems in sync.

### Keeping systems in sync

Most nontrivial applications combine an OLTP database, a cache, a full-text index and a data warehouse, each with its own copy of the data, shaped for its purpose. Update an item, and the cache, the index and the warehouse must all change too.

:::vs
@ Periodic full dumps
ETL into a warehouse. Works, but slow and coarse-grained.
@ Dual writes
The application writes to each system itself: database, then search index, then invalidate the cache. **Seriously broken** (see below).
:::

:::cards 2
@ Race condition
Clients 1 and 2 concurrently set item X to A and B. Each writes the database, then the index, but the requests interleave: the database ends with **B**, the index with **A**. The two are **permanently inconsistent**, with no error raised.
@ Partial failure
One write succeeds and the other fails. Atomic commit across different systems is expensive (module 10).
:::

> **Key idea:** If the search index were simply a **follower** of the database, with the database as the single leader, these problems would disappear. That's change data capture.

### Change data capture (CDC)

Replication logs were long treated as internal details, not a public API. **Change data capture** observes every data change written to a database and extracts it in a form other systems can replicate, ideally **as a stream**, immediately as it's written.

:::viz cdc

- **Leader and followers**: the captured database is the leader; everything else is a follower. A log-based broker is the natural transport, because it **preserves order**.
- **Implementation**: database triggers (fragile, significant overhead) or parsing the replication log (more robust, but must cope with schema changes).
- **Asynchronous**: the system of record doesn't wait for consumers before committing. Adding a slow consumer barely affects the database, but all the replication-lag issues of module 6 apply.

:::deep CDC tools
- LinkedIn **Databus**, Facebook **Wormhole**, Yahoo! **Sherpa**.
- **Bottled Water** (PostgreSQL, decoding the WAL); **Maxwell** and **Debezium** (MySQL binlog); **Mongoriver** (MongoDB oplog); **GoldenGate** (Oracle).
- **Kafka Connect** integrates CDC tools for many databases with Kafka.
- Databases increasingly offer change streams as a first-class API: **RethinkDB** queries can subscribe to result changes; **Firebase** and **CouchDB** sync via change feeds; **Meteor** uses the MongoDB oplog; **VoltDB** exports transaction output as a stream.
:::

:::vs
@ Initial snapshot
Replaying the full change history would take too long, and keeping every change forever takes too much disk. So start a new derived system from a **consistent snapshot** that corresponds to a **known log offset**, then apply changes from there. Some CDC tools build this in.
@ Log compaction
Periodically keep only the **latest record per key**; a **tombstone** (null value) marks a deletion and removes the key at compaction. Disk use depends on the current data, not on how many writes happened. To build a new derived system, read the compacted topic from **offset 0**: a full copy, no snapshot needed. Kafka supports this, so it can be used as **durable storage**, not just transient messaging.
:::

### Event sourcing

**Event sourcing** (from the domain-driven design community) is a related idea at a different level:

:::vs
@ Change data capture
The application uses the database **mutably**, updating and deleting records at will. The change log is extracted at a **low level** (the replication log), and the application may not even know CDC is happening.
@ Event sourcing
The application logic is **built on immutable events** in an event log. The store is append-only; updates and deletes are discouraged or forbidden. Events capture what happened at the **application level**, not low-level state changes.
:::

> **Picture it:** "Student cancelled their course enrolment" states the intent clearly, with one meaning. The side effects ("one row deleted from enrolments, one reason added to student feedback") bake in assumptions about how the data is used later. When a new feature arrives ("offer the place to the next person on the waiting list"), the event-sourced version chains it on easily; the mutation-based version has to reinterpret low-level writes.

Event sourcing makes applications easier to evolve, helps debugging (you can see **why** something happened) and guards against bugs. Specialised stores such as Event Store exist, but a conventional database or a log-based broker works too.

**Deriving current state.** Users want the current state (what's in my cart), not the history. So the app transforms the event log (data as **written**) into application state (data for **reading**). The transformation can be anything, but it should be **deterministic** so you can rerun it.

:::vs
@ Compaction in CDC
Each record is the full new version of a row, so only the **latest event per key** matters; older ones can be compacted away.
@ Compaction in event sourcing
Events model **user actions**; a later event usually doesn't override an earlier one, so you need the **full history** to rebuild state. Apps keep **snapshots** as an optimisation, but still store every raw event so the full log can be reprocessed.
:::

**Commands and events.** A user's request starts as a **command**, which may still fail (e.g. a constraint is violated). Validate it first; if it succeeds, it becomes an **event**: durable, immutable, a **fact**.

:::steps
@ Command
"Book seat 12A for user 123." It may still be rejected.
@ Validate
Is the seat free?
@ Event
"Seat 12A reserved by user 123." Now a fact.
@ Later changes are new events
If the user cancels, the reservation event stays true; a separate cancellation event is appended.
:::

> **Pitfall:** Consumers **can't reject** an event: by the time they see it, it's an immutable part of the log. So validation must happen **synchronously, before** the event is written (e.g. a serializable transaction that validates and publishes atomically), or split the request into two events: a tentative reservation, then a confirmation once validated (module 10's total order broadcast).

### State, streams and immutability

Immutability makes batch reruns safe, and it's what makes CDC and event sourcing powerful. But databases store **current state**, which supports updates and deletes. How do the two fit together?

Every change of state is the result of events that mutated it over time:

```text
state(now)    = ∫  stream(t) dt     from t = 0 to now
stream(t)     = d state(t) / dt
```

> **Key idea:** Current state is the **integral** of the event stream; the stream is the **derivative** of state. **The truth is the log; the database is a cache** of a subset of it: the latest value of each record.

> **Analogy:** Accountants have worked this way for centuries. A **ledger** is an append-only record of transactions. Mistakes are never erased; they're corrected by adding a compensating transaction. The profit and loss statement and the balance sheet are derived by adding up the ledger.

:::tabs
@ Benefits
- **Auditability and recovery**: an append-only log makes it far easier to see what happened and recover from a bug that wrote bad data, unlike a database where buggy code destructively overwrote it.
- **More information than current state**: a customer adds an item to their cart and then removes it. The final cart looks as if nothing happened, but that event is valuable for analytics: they may buy it later or have found a substitute.
@ Many views, one log
Separating mutable state from the immutable event log lets you derive several **read-optimised views** from the same log, like multiple consumers of a stream.

- **Druid** ingests directly from Kafka; **Pistachio** uses Kafka as a commit log; **Kafka Connect** sinks export from Kafka to various databases and indexes.
- A new feature can get a **new view built from the old log**, alongside the existing systems, and the old system can be retired later. No risky in-place migration.
@ CQRS
**Command query responsibility segregation**: store data in a form optimised for **writing** (the log) and translate it into forms optimised for **reading**.

> **Key idea:** The normalise-vs-denormalise debate largely goes away. It's fine to denormalise read views heavily, because the translation from the log keeps them consistent. Example: Twitter's home timelines are a denormalised cache of tweets from followed users, kept up to date by fan-out.
@ Concurrency control
**Downside**: log consumers are usually asynchronous, so a user may write an event, read a derived view, and not see their write yet (read-your-writes, module 6).

- **Fix**: update the read view synchronously with the append (a transaction spanning both, which needs the same storage system or distributed transactions), or use total order broadcast.

**Upside**: much of the need for multi-object transactions disappears. Design each event as a **self-contained description of a user action**: it needs just one write (an append), which is easy to make atomic. If the log and the state are partitioned the same way (customer events in partition 3 only update state partition 3), a **single-threaded consumer per partition** needs no write concurrency control at all.
@ Limits of immutability
- **High churn**: workloads with many updates and deletes on a smallish dataset make immutable history expensive. Fragmentation, compaction and garbage collection become crucial.
- **Legal deletion**: privacy regulations may require deleting a user's personal data when they close their account; data protection law may require removing incorrect information; sensitive data may leak by accident. Appending "consider this deleted" isn't enough: you need to **rewrite history**. Datomic calls this **excision**; Fossil calls it **shunning**.

> **Pitfall:** True deletion is surprisingly hard: copies live in storage engines, filesystems, SSDs (which write to new locations rather than overwriting) and backups. In practice it's more "making the data harder to retrieve" than "making it impossible".
:::

## Processing streams

Once you have a stream, you can:

:::cards 3
@ Store it
Write events to a database, cache or search index for other clients to query. CDC does this; it's the streaming equivalent of batch output.
@ Push to humans
Email alerts, push notifications, live dashboards. A person is the final consumer.
@ Transform it
Turn one or more input streams into output streams, through a pipeline of stages that ends in one of the other two.
:::

Code that processes streams is an **operator** or **job**. It's closely related to Unix processes and MapReduce jobs: it reads input streams read-only and writes output append-only, and partitioning and parallelisation work much the same. Mapping operations (transform, filter) are identical.

> **Key idea:** The crucial difference: **a stream never ends**. Sorting an unbounded dataset makes no sense, so sort-merge joins are out. And fault tolerance changes: a batch job running a few minutes can just restart, but a stream job running for years can't restart from the beginning after a crash.

### Uses of stream processing

:::tabs
@ Complex event processing
**CEP** (1990s) searches for **patterns of events** in a stream, like a regex finds patterns of characters.

- Queries are written in a declarative language (often SQL-like) or a GUI.
- The engine keeps a state machine and emits a **complex event** when a pattern matches.
- The roles are reversed compared with databases: **queries are stored long-term**, and events flow past them.
- Esper, IBM InfoSphere Streams, Apama, TIBCO StreamBase, SQLstream.
@ Stream analytics
Less about specific sequences, more about **aggregates and statistics** over many events:

- the **rate** of some event type per time interval;
- a **rolling average** of a value over a period;
- comparing current statistics with previous intervals to spot trends or alert on anomalies.

Statistics are computed over fixed intervals called **windows**. **Probabilistic algorithms** save memory: **Bloom filters** (set membership), **HyperLogLog** (cardinality), percentile estimators. They're approximate, but that's an optimisation; stream processing isn't inherently approximate.

Apache Storm, Spark Streaming, Flink, Concord, Samza, Kafka Streams; hosted: Google Cloud Dataflow, Azure Stream Analytics.
@ Materialised views
Deriving an alternative view of a dataset: caches, search indexes, warehouses (as with CDC). In event sourcing, application state is a materialised view.

Unlike analytics, this usually needs **all events over an arbitrary time span** (minus those dropped by log compaction), not just a window. Samza and Kafka Streams support it on top of Kafka's log compaction.
@ Search on streams
Find individual events matching complex criteria, such as full-text queries:

- media monitoring: subscribe to news feeds and broadcasts, flag anything mentioning given companies, products or topics;
- property alerts: notify users when a new listing matches their saved search.

Elasticsearch's **percolator** does this. Normal search indexes documents and runs queries against them; stream search **stores the queries** and runs documents past them. Indexing the queries too makes it faster.
@ vs message passing / RPC
:::vs
@ Actor frameworks
Mainly a way to manage **concurrency** and distributed execution. Communication is often ephemeral and one-to-one, and can be cyclic (request/response).
@ Stream processing
Mainly a **data management** technique. Event logs are durable and multi-subscriber; pipelines are usually acyclic.
:::

There's overlap: Apache Storm's **distributed RPC** interleaves user queries with event streams.
:::

### Reasoning about time

Stream processors often deal with time ("the average over the last five minutes"), and that's surprisingly tricky.

:::vs
@ Batch jobs
Crunch through historical events quickly and use the **timestamp inside each event**. The batch machine's clock is irrelevant: when the job runs has nothing to do with when the events happened.
@ Many stream frameworks
Use the processing machine's **local clock** (**processing time**) for windows. Simple, and fine if the delay between creating and processing an event is tiny. It breaks down when processing **lags**.
:::

**Why processing lags**: queueing, network faults, contention in the broker or processor, a restarted consumer, or reprocessing past events after a fault or bug fix. Delays also **reorder** messages.

> **Picture it:** A processor measuring request rate is restarted after a short outage and works through the backlog. With processing-time windows, the chart shows a **spike** in requests that never happened.

> **Analogy:** The Star Wars films were released in the order IV, V, VI, I, II, III, VII. Release order (processing time) differs from story order (event time).

**Knowing when a window is complete.** You count requests in one-minute windows. Events for minute 37 have been arriving, and now most new events are from minutes 38 and 39. When do you declare minute 37 finished and emit its count? Some events may still be buffered on another machine or delayed by a network blip: **stragglers**.

:::cards 3
@ Ignore stragglers
Usually a small fraction of events. Track how many you drop as a metric, and alert if it grows.
@ Publish a correction
Emit an updated value for the window including the stragglers, possibly retracting the earlier output.
@ Watermarks
A special message: "no more events with timestamp earlier than t". Consumers use it to close windows. With many producers, each with its own threshold, consumers must track every producer, which makes adding and removing producers trickier.
:::

**Whose clock?** A mobile app reports usage events. Used offline, it buffers events and sends them hours or days later, so they arrive as extreme stragglers. The event time should be when the user acted, per the **device** clock, but user devices can't be trusted (module 9). The server's clock is trustworthy but less meaningful. Log **three timestamps**:

:::steps
@ Event occurred (device clock)
When the user interaction happened, by the device.
@ Event sent (device clock)
When the device sent it to the server.
@ Event received (server clock)
When the server got it.
:::

> **Tip:** Timestamp 3 minus timestamp 2 estimates the offset between the device clock and the server clock (assuming network delay is small by comparison). Apply that offset to timestamp 1 to estimate when the event really happened.

Batch processing has the same time issues; they're just more visible in streaming, where you're more aware of time passing.

### Types of windows

:::viz windows

:::cards 2
@ Tumbling
**Fixed length**; every event belongs to exactly one window. With 1-minute windows, 10:03:00–10:03:59 is one window and 10:04:00–10:04:59 the next. Implement by rounding each timestamp down to the minute.
@ Hopping
**Fixed length, overlapping**, for smoothing. A 5-minute window with a 1-minute hop covers 10:03:00–10:07:59, then 10:04:00–10:08:59, and so on. Implement by computing 1-minute tumbling windows and aggregating adjacent ones.
@ Sliding
All events **within some interval of each other**. A 5-minute sliding window includes events at 10:03:39 and 10:08:12 because they're under 5 minutes apart; tumbling and hopping windows with fixed boundaries might not. Implement with a time-sorted buffer, evicting events as they expire.
@ Session
**No fixed duration**. Groups a user's events that occur close together, ending after a period of inactivity (e.g. 30 minutes with no events). Common in website analytics.
:::

### Stream joins

New events can appear at any moment, which makes joins harder than in batch. Three kinds:

:::tabs
@ Stream–stream (window join)
**Example**: search and click events, joined by session ID, to compute click-through rate per URL.

- The click may **never come** (the user gave up), or come seconds or days later (a tab left open).
- Network delays can even make the click arrive **before** the search.
- So choose a **join window**, e.g. join a click with a search if they're at most an hour apart.

**How**: the processor keeps **state**: every event from the last hour, indexed by session ID. Each new search or click is added to its index, and the other index is checked for a matching session. A match emits "result X was clicked"; a search that expires without a click emits "results not clicked".
@ Stream–table (enrichment)
**Example**: user activity events (with a user ID) joined with user profiles: the output events are **enriched** with profile data.

- A remote database query per event is slow and could overload the database.
- Instead, **load a copy of the database into the stream processor** and query it locally, like a map-side hash join (module 11): an in-memory hash table if small enough, or an index on local disk.

**Difference from batch**: a batch job uses a point-in-time snapshot; a stream processor runs for a long time while the database keeps changing, so its local copy must stay current. **Fix with CDC**: subscribe to the profile database's changelog as well as the activity stream.

> **Key idea:** It's really a join between two streams. The table changelog uses a window reaching back to the beginning of time (conceptually infinite), with newer versions of a record replacing older ones.
@ Table–table (view maintenance)
**Example**: the Twitter home timeline (module 1). Rather than merging everyone's tweets on every read, keep a per-user timeline cache, an "inbox" that tweets are written into. The processor consumes **tweet** events (send, delete) and **follow** events (follow, unfollow):

- **u tweets**: add the tweet to the timeline of everyone following u.
- **A tweet is deleted**: remove it from every timeline.
- **u1 follows u2**: add u2's recent tweets to u1's timeline.
- **u1 unfollows u2**: remove u2's tweets from u1's timeline.

It keeps the set of followers for each user. Effectively it maintains a **materialised view** of a query joining two tables (tweets and follows), updated whenever either table changes.

> **Analogy:** The product rule: (u·v)′ = u′v + uv′. A change in tweets is joined with the current followers, and a change in followers is joined with the current tweets.
@ Time-dependence
All three joins keep **state** from one input and query it with messages from the other. The order of the state-changing events matters: follow-then-unfollow is not unfollow-then-follow.

- A partitioned log preserves order **within** a partition, but not across streams or partitions.
- If events on different streams happen around the same time, which goes first? In a stream–table join, which activity events see the **old** profile and which the **new** one?
- If the order is undetermined, the join is **nondeterministic**: rerunning the same job on the same input may give different results.

> **Tip:** Data warehouses call this a **slowly changing dimension (SCD)**. The fix: give each **version** of the joined record its own ID (e.g. each tax-rate change gets a new ID, and the invoice records the ID in force at the time of sale). The join becomes deterministic, but log compaction is no longer possible, since every version must be kept.
:::

### Fault tolerance

Batch frameworks tolerate faults easily: restart a failed task elsewhere and discard its output. That works because inputs are immutable, each task writes to its own file, and output only becomes visible when the task succeeds.

> **Key idea:** The output is the same as if nothing failed. Every record **appears** to be processed **exactly once**, even if a restarted task actually processed some records twice. That's **exactly-once semantics**; **effectively-once** is a more honest name.

Streams are harder: you can't wait for a task to "finish" before making its output visible, because a stream never finishes.

:::tabs
@ Microbatching and checkpoints
:::vs
@ Microbatching (Spark Streaming)
Break the stream into small blocks, about **one second** each, and treat each as a mini batch job.
- Smaller batches mean more scheduling overhead; larger ones mean longer delays.
- It implicitly creates a **tumbling processing-time window** of the batch size; longer windows must carry state between microbatches.
@ Checkpointing (Apache Flink)
Periodically write rolling **checkpoints** of operator state to durable storage. After a crash, restart from the latest checkpoint and discard output produced since.
- Checkpoints are triggered by **barriers** in the message stream, like microbatch boundaries but without forcing a window size.
:::

Within the framework, both give the same exactly-once semantics as batch.

> **Pitfall:** Once output **leaves** the processor (writes to a database, messages to an external broker, emails), the framework can't take it back. A restarted task repeats the external side effect, and microbatching or checkpointing alone can't prevent that.
@ Atomic commit
For effectively-once in the face of faults, every output and side effect of processing an event must happen **if and only if** processing succeeds:

- messages sent downstream or to external systems (including emails and push notifications);
- database writes;
- operator state changes;
- input acknowledgements (including moving the consumer offset in a log-based broker).

All of these must happen atomically or not at all, like distributed transactions and 2PC (module 10). **Google Cloud Dataflow**, **VoltDB** and **Apache Kafka** implement it efficiently. Unlike XA, they don't span different technologies: they keep transactions **internal**, managing both state changes and messaging inside the framework. The protocol's overhead is amortised by processing several messages per transaction.
@ Idempotence
An **idempotent** operation has the same effect whether you do it once or many times.

:::vs
@ Naturally idempotent
Setting a key to a fixed value: writing it again just overwrites it with the same value.
@ Not idempotent
Incrementing a counter: doing it again increments it twice.
:::

**Make it idempotent with metadata**: every Kafka message has a persistent, increasing **offset**. Store the offset of the message that caused the last write alongside the value; if you see that offset again, the update has already been applied, so skip it. Storm's Trident handles state similarly.

> **Pitfall:** This assumes failed tasks **replay the same messages in the same order** (a log-based broker does), processing is **deterministic**, and **no other node** concurrently updates the same value. When failing over between nodes you may need **fencing** (module 9) to block a node presumed dead that's actually alive.

Despite the caveats, idempotence is an effective way to get exactly-once semantics with little overhead.
@ Rebuilding state
Stateful operators (windowed counters, averages and histograms, tables and indexes used for joins) must recover their state after failure.

:::vs
@ Remote state
Keep state in a replicated remote datastore. Querying it for every message can be **slow**.
@ Local state
Keep state on the processor and replicate it periodically; a new task reads the replica and resumes.
:::

- **Flink** snapshots operator state to durable storage such as HDFS.
- **Samza** and **Kafka Streams** send state changes to a dedicated, log-compacted Kafka topic, like CDC.
- **VoltDB** processes every input message redundantly on several nodes.

Sometimes there's no need to replicate state at all, because it can be **rebuilt from the input**: replay a short window's events, or rebuild a CDC-maintained database replica from the compacted changelog.

> **Note:** The right choice depends on your infrastructure. Network delay may be lower than disk latency, and network bandwidth comparable to disk bandwidth. No trade-off is ideal everywhere, and the balance between local and remote state may shift as storage and networking technology evolves.
:::

## Recall

:::flash
Q: Three options when producers outpace consumers?
A: Drop messages, buffer them, or apply backpressure.
Q: Load balancing vs fan-out?
A: Load balancing: each message goes to one consumer. Fan-out: each message goes to all consumers.
Q: How does redelivery reorder messages?
A: A message from a crashed consumer is redelivered after later messages have already been processed.
Q: What's ordered in Kafka?
A: Messages within a partition (by offset). There's no order across partitions.
Q: What limits a consumer group's parallelism in Kafka?
A: The number of partitions in the topic.
Q: Why can a log consumer replay?
A: Reading is non-destructive; the consumer just moves its offset back.
Q: Two problems with dual writes?
A: Interleaved concurrent writes cause permanent inconsistency, and one write can fail while the other succeeds.
Q: What does log compaction keep?
A: The latest record per key; tombstones remove deleted keys.
Q: CDC vs event sourcing?
A: CDC extracts low-level changes from a mutable database; event sourcing stores immutable application-level events as the source of truth.
Q: Command vs event?
A: A command may still be rejected; once validated it becomes an immutable event (a fact).
Q: "The truth is the log": what's the database then?
A: A cache of the latest value of each record in the log.
Q: Event time vs processing time?
A: When the event happened vs when the processor saw it. Processing-time windows create false spikes after backlogs.
Q: Three timestamps for mobile events?
A: Occurred (device clock), sent (device clock), received (server clock). Use 3 − 2 to correct 1.
Q: Four window types?
A: Tumbling, hopping, sliding, session.
Q: Three stream joins?
A: Stream–stream (window join), stream–table (enrichment), table–table (materialised view maintenance).
Q: Three routes to effectively-once?
A: Microbatching/checkpointing, atomic commit of all outputs, idempotent writes.
:::

:::quiz
Q: When should you prefer a log-based broker (Kafka) over an AMQP/JMS-style broker (RabbitMQ)?
- When each message is expensive and order doesn't matter
- [x] When you need high throughput, per-key ordering, replay of old messages and multiple independent consumers
- When messages must be deleted immediately after processing
- When you need to load-balance message by message with more consumers than partitions
> Logs give ordering within a partition, cheap fan-out and replay via offsets; traditional brokers give per-message load balancing with acknowledgements.
:::

:::quiz
Q: Why are dual writes (application writes to the database, then to the search index) dangerous?
- They're too slow
- [x] Concurrent clients can interleave the writes so the two systems end up permanently disagreeing, and one write can fail while the other succeeds
- Search indexes can't accept writes
- They require log compaction
> Making the index a follower of the database via change data capture gives a single order of writes.
:::

:::quiz
Q: A stream job restarts and processes a 10-minute backlog. A dashboard using processing time shows a huge spike in request rate. What went wrong?
- The broker duplicated messages
- [x] Windows were based on processing time; with event-time windows, the backlog would be spread over the minutes when the requests actually happened
- The watermark was too late
- Microbatches were too large
> Processing-time windowing is simple but wrong whenever processing lags behind event creation.
:::

:::quiz
Q: How can a stream processor achieve effectively-once writes to an external database without distributed transactions?
- Disable retries
- [x] Make writes idempotent, e.g. store the input message's offset with the value and skip updates whose offset was already applied
- Use processing-time windows
- Use a sliding window
> Idempotence requires deterministic processing, replay in the same order, and fencing to stop zombie nodes from writing.
:::
</script>

## How to use this module

Interviewers rarely ask "define linearizability". They ask "what happens if the leader dies?" or "how would you keep the search index in sync?", and they listen for **trade-offs**.

:::steps
@ Pick a topic tab
The question bank is grouped by chapter. Start with your weakest area.
@ Answer out loud
Say your answer before tapping the card. Aim for the four-part structure above.
@ Tap to compare
Check your answer against the model answer. If you missed the mechanism or the cost, revisit that module.
@ Finish with design
Walk through the system design scenarios and say which DDIA idea you'd use at each step, and why.

## Decision cheat sheet

| If you need… | Reach for | Watch out for |
|---|---|---|
| fast writes, big datasets | LSM-tree storage (Cassandra, RocksDB) | compaction stalls, read amplification |
| predictable reads, range queries, transactions | B-tree storage (PostgreSQL, InnoDB) | write amplification, page splits |
| analytics over billions of rows | column store, star schema (Redshift, BigQuery, Parquet) | slow single-row updates |
| schema evolution across services | Protobuf/Avro with a schema registry | reusing tags, removing required fields |
| read scaling | leader–follower with async replicas | replication lag anomalies |
| writes in several regions or offline clients | multi-leader or CRDTs | conflict resolution, LWW data loss |
| high write availability, tunable consistency | leaderless quorums (Dynamo, Cassandra) | sloppy quorums, no linearizability |
| more data than one machine | hash partitioning (or range for scans) | hot keys, scatter/gather reads |
| correctness under concurrency | serializable isolation (SSI, 2PL, serial) | aborts/retries, lock contention |
| a single leader, a lock, a unique name | consensus service (ZooKeeper, etcd) + fencing tokens | majority required, timeouts |
| atomic writes across databases | avoid if possible; 2PC/XA only if necessary | in-doubt transactions holding locks |
| keeping cache/index/warehouse in sync | change data capture into a log | asynchronous lag, ordering per key |
| audit trail, rebuildable views | event sourcing + CQRS | validating commands before events |
| large offline recomputation | batch (Spark), immutable outputs | stragglers, skewed keys |
| low-latency continuous results | stream processing (Flink, Kafka Streams) | event vs processing time, effectively-once |

## Question bank

:::tabs
@ Foundations (1–4)
:::flash
Q: What's the difference between reliability, scalability and maintainability?
A: Reliability: the system keeps working correctly when things go wrong (hardware faults, software bugs, human error). A fault is one component deviating from spec; a failure is the whole system stopping service, and you design so faults don't become failures. Scalability: having reasonable ways to cope with growth, described with load parameters (requests/s, read/write ratio, fan-out) and performance metrics (percentile latency). Maintainability: operability, simplicity (managing complexity with good abstractions) and evolvability.
Q: Why use percentiles rather than average response time?
A: Averages hide what real users experience. p50 shows what a typical request sees; tail latencies (p95, p99, p999) show the slow outliers, which often hit your most valuable users (they have the most data). When one request fans out to many backends, the chance of hitting at least one slow call grows: tail latency amplification. SLAs are written in percentiles.
Q: Explain Twitter's home timeline fan-out problem.
A: Two approaches: read-time merge (query the tweets of everyone you follow when loading the timeline: cheap writes, expensive reads) or write-time fan-out (push each new tweet into every follower's cached timeline: cheap reads, expensive writes). Reads vastly outnumber writes, so fan-out on write wins, except for celebrities with millions of followers, whose tweets are merged in at read time. The key load parameter is the distribution of followers per user.
Q: Relational vs document vs graph: when would you use each?
A: Document: self-contained, tree-shaped data loaded as a whole (a profile with positions and education); good locality and schema-on-read flexibility, weak for many-to-many joins. Relational: many-to-one and many-to-many relationships, joins, a query optimiser, schema-on-write. Graph: anything can relate to anything (social networks, fraud rings, road networks) and you need variable-length traversals (Cypher, SPARQL, Datalog). The models are converging (JSON columns in PostgreSQL, joins in MongoDB).
Q: How does an LSM-tree work, and how does it compare to a B-tree?
A: LSM: writes go to an in-memory sorted memtable (plus a WAL for crash safety); when full it's flushed as an immutable sorted SSTable; background compaction merges SSTables and drops overwritten or deleted keys; reads check the memtable then SSTables newest to oldest, using sparse indexes and Bloom filters. B-tree: fixed-size pages updated in place, depth O(log n), a WAL for crash recovery, latches for concurrency. LSM has higher write throughput, better compression and sequential writes, but compaction can interfere with reads and writes and may not keep up. B-trees keep each key in exactly one place (good for transactions with range locks) and give more predictable reads, but have higher write amplification and fragmentation.
Q: Why are column stores faster for analytics?
A: Analytic queries touch a few columns of very wide fact tables across millions of rows. Storing each column separately means reading only the needed columns. Values in a column are similar, so they compress extremely well (bitmaps, run-length encoding), which fits more data in CPU cache and enables vectorised processing. Sorting by a common filter column (e.g. date) improves compression further. Writes go to an in-memory store and are merged in bulk, LSM-style.
Q: OLTP vs OLAP?
A: OLTP: many small key-based reads and writes from end users; latency matters; the bottleneck is disk seeks. OLAP: analysts run fewer queries that scan and aggregate huge numbers of records; the bottleneck is disk bandwidth. Hence separate data warehouses fed by ETL, with star schemas and column-oriented storage.
:::
@ Encoding (5)
:::flash
Q: What are forward and backward compatibility, and why do they matter?
A: Backward: new code reads data written by old code. Forward: old code reads data written by new code. During rolling upgrades (and with clients that don't update), old and new versions coexist, and data in databases outlives code, so you need both.
Q: Compare Protobuf/Thrift and Avro schema evolution.
A: Protobuf/Thrift identify fields by numeric tags in the encoded data: add new fields with new tags (optional or with defaults), never reuse a tag, never remove a required field. Avro stores no tags; the reader resolves the writer's schema against its reader's schema by field name, so you may only add or remove fields that have defaults. Avro suits dynamically generated schemas (e.g. dumping a database) because there are no tag numbers to manage. The writer's schema travels in the file header, via a version number in a registry, or is negotiated on connection.
Q: Why is RPC's location transparency misleading?
A: A network call can time out with an unknown outcome, be retried and executed twice (so you need idempotence), has variable latency, and must encode all parameters as bytes. Local calls have none of these problems. Modern frameworks (gRPC with futures and streams) are explicit about remoteness.
:::
@ Replication (6)
:::flash
Q: Synchronous vs asynchronous replication: trade-offs?
A: Synchronous: the follower is guaranteed up to date, but one slow or dead follower blocks all writes. Asynchronous: the leader never waits, but if it dies, unreplicated writes are lost even though they were acknowledged. In practice, semi-synchronous: one synchronous follower, the rest async.
Q: What can go wrong during failover?
A: Lost writes (an async follower is promoted without the latest writes; discarding them can conflict with external systems, like GitHub reusing auto-increment keys that Redis also stored), split brain (two leaders accept writes), and choosing the timeout (too short: unnecessary failovers under load; too long: slow recovery).
Q: Name the replication-lag anomalies and their fixes.
A: Read-your-writes: read things the user may have edited from the leader, or track the user's last write timestamp/LSN. Monotonic reads: pin each user to one replica (by hash of user ID). Consistent prefix reads: write causally related data to the same partition, or track causal dependencies.
Q: How do leaderless quorums work, and why aren't they linearizable?
A: With n replicas, a write needs w acknowledgements and a read queries r replicas; if w + r > n, the read and write sets overlap. Stale replicas are fixed by read repair and anti-entropy. Still not linearizable: sloppy quorums break the overlap; concurrent writes resolved by LWW lose data; a write that succeeds on fewer than w nodes isn't rolled back; and readers can see a new value, then an old one, while a write is in progress.
Q: How do you detect concurrent writes?
A: Version numbers per key (single replica) or version vectors (one counter per replica per key). A happened before B if B knew about A; otherwise they're concurrent. Concurrent values are kept as siblings and merged by the application (union for adds, tombstones for removals) or by CRDTs. LWW instead silently discards all but one.
:::
@ Partitioning (7)
:::flash
Q: Key-range vs hash partitioning?
A: Key range: efficient range scans, but sequential keys (timestamps) create hot spots. Hash: even distribution, but range queries must hit every partition. Cassandra's compound key hashes the first column and sorts by the rest, giving both: even spread across users and range scans within one user.
Q: How do you handle a hot key?
A: Add a random suffix (say 00–99) to the hot key so its writes spread over 100 partitions; reads must then fetch and combine all 100. Only do this for the few known hot keys, and track which keys are split.
Q: Local vs global secondary indexes?
A: Local (document-partitioned): each partition indexes its own documents, so writes are simple but reads scatter/gather to every partition (tail latency). Global (term-partitioned): the index is partitioned by the indexed term, so reads hit one partition, but one document write touches several index partitions, and updates are usually asynchronous (DynamoDB GSIs).
Q: How should you rebalance partitions?
A: Never hash mod N (changing N moves almost everything). Use many more partitions than nodes and move whole partitions (Riak, Elasticsearch, Kafka); dynamic splitting and merging for key ranges (HBase, MongoDB); or a fixed number of partitions per node (Cassandra). Prefer a human in the loop to avoid cascading failures. Route via a coordination service (ZooKeeper), gossip, or a routing tier.
:::
@ Transactions (8)
:::flash
Q: What does ACID really mean?
A: Atomicity: abortability, so all of a transaction's writes are undone on failure. Consistency: application invariants, which are the application's job. Isolation: concurrent transactions don't interfere, ideally serializable. Durability: committed data isn't lost (WAL, replication). C is the odd one out.
Q: Explain read committed, snapshot isolation and serializable.
A: Read committed: no dirty reads and no dirty writes (row locks for writes; the old committed value is served to readers). Snapshot isolation: each transaction reads a consistent snapshot via MVCC, preventing read skew (good for backups and analytics); called "repeatable read" in PostgreSQL and MySQL. Serializable: the result equals some serial order; prevents write skew and phantoms.
Q: Lost update vs write skew?
A: Lost update: two read-modify-write cycles on the same object, one overwriting the other (fix: atomic UPDATE … SET x = x + 1, SELECT FOR UPDATE, compare-and-set, or automatic detection under snapshot isolation). Write skew: two transactions read the same data, then update different objects based on a premise the other invalidates (two on-call doctors both going off call). Needs serializable isolation, locking the rows read, or materialising the conflict if the rows don't exist yet (phantoms).
Q: Compare the three ways to implement serializability.
A: Actual serial execution (VoltDB, Redis): one thread, in-memory data, stored procedures; limited to one CPU per partition. 2PL: shared/exclusive locks held until commit, predicate or index-range locks for phantoms; readers and writers block each other, deadlocks, unstable tail latency. SSI (PostgreSQL): optimistic; run on a snapshot, track stale reads and conflicting writes, abort at commit if a premise became outdated. Readers never block, but high contention causes many aborts.
:::
@ Distributed trouble (9)
:::flash
Q: Why can't you just use a timeout to know a node is dead?
A: Networks have unbounded delays and nodes have unbounded pauses (GC, VM suspension, swapping). A timeout means "no reply yet", not "dead". Short timeouts cause false failovers and cascading failures; long ones slow recovery. Adaptive detectors (Phi Accrual) measure jitter to pick timeouts.
Q: Why are time-of-day clocks dangerous for ordering events?
A: They drift, jump backward on NTP resets, are only as accurate as network delay allows, and differ between machines. LWW with clock timestamps can silently drop causally later writes from a node with a slower clock. Use logical clocks for ordering, monotonic clocks for durations, and confidence intervals if you must use physical time (Spanner's TrueTime waits out the uncertainty).
Q: What is a fencing token?
A: A monotonically increasing number returned with every lock or lease grant. The protected resource rejects writes with a token lower than one it has already seen, so a client that paused and lost its lease (a zombie) can't corrupt data. ZooKeeper's zxid works as one.
Q: Safety vs liveness?
A: Safety: nothing bad happens (uniqueness, agreement); a violation happens at a specific moment and can't be undone. Liveness: something good eventually happens (a request gets a response, eventual consistency). Distributed algorithms must always keep safety; liveness may depend on a majority being up and the network eventually healing (the partially synchronous, crash-recovery model).
:::
@ Consensus (10)
:::flash
Q: Linearizability vs serializability?
A: Linearizability is a recency guarantee on single objects: the system behaves as if there's one copy and every operation is atomic; once a read sees a new value, all later reads do. Serializability is an isolation property of multi-object transactions: equivalent to some serial order. Both together is strict serializability. SSI isn't linearizable; 2PL and serial execution are.
Q: Explain CAP correctly.
A: When a network partition occurs, a system must choose between linearizability (some nodes refuse requests) and availability (all nodes respond, possibly with stale data). It isn't "pick two of three": partitions aren't optional. CAP is narrow (one consistency model, one fault type), and linearizability is often dropped for performance, not just because of partitions.
Q: What are Lamport timestamps, and why aren't they enough for a unique username?
A: A pair (counter, node ID); every node tracks the maximum counter seen and bumps its own on receipt, giving a total order consistent with causality. But you only know the final order after the fact: a node can't decide right now whether another node is about to claim the same name with a lower timestamp. You need total order broadcast, where the order is fixed at delivery.
Q: Walk through two-phase commit and its weakness.
A: The coordinator sends prepare; each participant durably writes its data and votes yes (giving up the right to abort) or no; the coordinator writes the decision to its log (the commit point) and sends commit or abort, retrying forever. If the coordinator crashes after prepare, participants are in doubt and hold locks until it recovers: 2PC is blocking. XA spreads this across heterogeneous systems, amplifying failures.
Q: How do consensus algorithms avoid split brain?
A: Leaders are unique per epoch (term). Every decision needs a vote from a majority, and any two majorities overlap, so a stale leader proposing with an old epoch meets at least one node that has seen a newer epoch and is refused. Raft, Paxos (Multi-Paxos), Zab and VSR all implement total order broadcast this way.
Q: What is ZooKeeper used for?
A: Outsourced consensus: linearizable compare-and-set (locks, leader election), total ordering (fencing tokens via zxid), failure detection with sessions and ephemeral nodes, and watches for change notifications. Used for partition assignment, service discovery and membership in Kafka, HBase and Hadoop YARN. Meant for slow-changing metadata, not high-volume application data.
:::
@ Batch & streams (11–12)
:::flash
Q: Explain MapReduce and the shuffle.
A: Mappers extract key–value pairs from each input record; the framework partitions map output by key hash and sorts each partition; reducers fetch and merge their partition from every mapper (the shuffle), then call the reducer once per key. Computation moves to the data, failed tasks are retried, and outputs are immutable files.
Q: Reduce-side vs map-side joins?
A: Reduce-side (sort-merge): both inputs keyed by the join key and brought together by the shuffle; no assumptions about the inputs, but expensive. Map-side: broadcast hash join (one side fits in memory), partitioned hash join (both inputs partitioned identically), merge join (also sorted identically). Faster, but requires knowing the physical layout.
Q: Why did Spark and Flink replace MapReduce?
A: They run a whole workflow as one dataflow graph: no full materialisation of every intermediate result to replicated HDFS, sorting only where needed, no redundant map stages, operators start as soon as input is ready, and lost partitions are recomputed from lineage or checkpoints.
Q: Kafka vs RabbitMQ?
A: Kafka is a partitioned, replicated append-only log: total order per partition, consumers track offsets, messages are retained for days (replay, many independent consumers), parallelism is limited to the partition count, and a slow message causes head-of-line blocking. RabbitMQ (AMQP/JMS) deletes messages after acknowledgement, load-balances message by message, and redelivers unacked messages (which can reorder them). Use Kafka for event streams, CDC and ordering; RabbitMQ for task queues of expensive, independent jobs.
Q: What is change data capture, and why prefer it to dual writes?
A: CDC reads the database's replication log (Debezium on the MySQL binlog or PostgreSQL WAL) and publishes every change to a log; caches, search indexes and warehouses consume it in order. Dual writes from application code can interleave (permanent inconsistency) and partially fail. With CDC the database is the single leader and everything else is a follower. Log compaction lets new consumers rebuild from offset 0.
Q: Event sourcing vs CDC?
A: CDC captures low-level mutable state changes from a database. Event sourcing makes immutable application-level events ("seat reserved") the system of record; current state is derived (a fold over events) and read models are built separately (CQRS). Commands are validated before they become events. Benefits: audit trail, debugging, new views from old data. Costs: asynchronous read views, and true deletion (GDPR) is hard.
Q: Event time vs processing time, and windows?
A: Event time is when the event happened; processing time is when the processor sees it. Windowing by processing time creates false spikes after backlogs. With event time you must decide when a window is complete (watermarks, timeouts) and handle stragglers (drop them or publish corrections). Windows: tumbling (fixed, non-overlapping), hopping (fixed, overlapping), sliding (events within an interval of each other), session (until an inactivity gap).
Q: How do stream processors get exactly-once semantics?
A: Effectively-once: microbatching (Spark Streaming) or checkpointing with barriers (Flink) within the framework; atomic commit of outputs, state changes and offsets together (Kafka transactions, Dataflow); or idempotent writes keyed by input offset. External side effects need idempotence or transactions, plus fencing against zombie tasks.
:::
:::

## System design walkthroughs

:::tabs
@ Social news feed
**Design a feed like the Twitter home timeline.**

:::steps
@ Load parameters first
Posts per second, timeline reads per second, and the follower distribution: most users have hundreds of followers, a few have millions.
@ Write path
Store posts in a partitioned store keyed by `post_id`. Publish a "post created" event to a log (Kafka) partitioned by author.
@ Fan-out service
A stream processor consumes posts and pushes post IDs into each follower's **timeline cache** (Redis lists), joining the post stream with the follow-graph changelog (a **table–table join**). **Celebrities are excluded** from fan-out and merged at read time.
@ Read path
Fetch the cached timeline, merge in celebrity posts, and hydrate post bodies from a cache. Mention p99 latency and tail amplification from the hydration fan-out.
@ Consistency
**Read-your-writes** for your own posts: insert your own post into your feed synchronously, or read from the leader for a minute after posting. Eventual consistency is fine for everyone else's posts.
@ Failure
The timeline cache is **derived data**: rebuild it by replaying the log.
:::
@ Payments ledger
**Design a payments ledger or wallet.**

:::steps
@ System of record
An **append-only ledger** of entries (event sourcing). Balances are derived and cached; never update a balance without a ledger entry.
@ Prevent overdrafts
Overdraft is a **write-skew** risk. Use serializable transactions on the account's partition, or single-threaded processing per account partition: every command for an account goes through one log partition and is validated in order.
@ Idempotency
Clients send an **idempotency key** per payment. The server stores it with the result, so a retry after a timeout doesn't double-charge.
@ External effects
For bank transfers and emails, avoid 2PC. Write the intent to the ledger and drive external steps from the log with idempotent consumers: the **outbox pattern** via CDC.
@ Replication
Synchronous or semi-synchronous replication for durability; failover via consensus to avoid split brain; **fencing tokens** for any worker that holds a lock.
@ Audit and analytics
CDC into a warehouse, plus batch reconciliation jobs comparing the ledger with bank statements.
:::
@ Product search
**Design product search with live inventory.**

:::steps
@ System of record
A relational database for products and inventory, using transactions for stock decrements. `UPDATE stock SET n = n - 1 WHERE n > 0` avoids lost updates.
@ Search index
Elasticsearch, fed by **CDC** (Debezium → Kafka → indexer), **never by dual writes**. It's partitioned by document (local index), so queries scatter/gather: mention tail latency and keeping the shard count reasonable.
@ Staleness
The index lags by seconds, so **re-check stock against the database at checkout**.
@ Reindexing
Build a new index from a compacted topic, or from a snapshot plus log offset, then switch an alias atomically: the immutable batch-output philosophy.
:::
@ Real-time analytics
**Design a real-time analytics or metrics pipeline.**

:::steps
@ Ingest
Clients send events with **three timestamps** (device event time, device send time, server receive time) into Kafka, partitioned by a key that keeps related events in order (user or session ID).
@ Stream layer
Flink with **event-time** tumbling or hopping windows, watermarks, and a policy for late events (publish corrections). State in RocksDB, checkpointed to durable storage; **idempotent upserts** into the serving store keyed by `(metric, window)`.
@ Serving
A column-oriented OLAP store (Druid, ClickHouse, Pinot) for dashboards. Probabilistic sketches: **HyperLogLog** for unique users, quantile sketches for latency percentiles.
@ Batch layer
Raw events also land in object storage as **Parquet**. Nightly Spark jobs recompute exact aggregates and correct any stream approximations; reprocessing is easy because inputs are immutable.
@ Hot keys
A viral page dominates one partition: use **two-stage aggregation** (random sub-keys, then combine).
:::
:::

## Final self-check

:::quiz
Q: An interviewer asks how to guarantee unique usernames in a geo-distributed system. What's the best core answer?
- Use last-write-wins on a usernames table
- Use leaderless quorums with w + r > n
- [x] Route claims through a linearizable compare-and-set (a single leader per username partition, or a consensus service), accepting the latency and availability cost during partitions
- Use Lamport timestamps and pick the lower timestamp later
> Uniqueness needs linearizability (equivalent to consensus). Partition by username so each name has one authoritative leader.
:::

:::quiz
Q: Your service writes to PostgreSQL and then publishes to Kafka, and sometimes the Kafka publish is lost. What's the standard fix?
- Retry forever in the request handler
- Use 2PC between PostgreSQL and Kafka via XA
- [x] Write the event to an outbox table in the same database transaction and publish it via CDC (or a relay) so the database is the single source of order
- Publish to Kafka first, then write to PostgreSQL
> The transactional outbox plus CDC avoids dual writes and heterogeneous 2PC; consumers must be idempotent because delivery is at least once.
:::

:::quiz
Q: Which pairing of guarantee and mechanism is correct?
- Monotonic reads ← two-phase commit
- [x] Phantom prevention ← predicate or index-range locks (or SSI)
- Linearizability ← asynchronous multi-leader replication
- Exactly-once side effects ← processing-time windows
> Phantoms are writes that change the result of another transaction's search condition, so the lock must cover the condition, not existing rows.
:::

:::quiz
Q: A 5-node Raft cluster loses 3 nodes. What happens?
- The remaining 2 nodes elect a leader and continue
- [x] No majority can be formed, so the cluster stops accepting writes (safety preserved, liveness lost) until enough nodes return
- The cluster splits into two leaders
- It falls back to eventual consistency
> Consensus needs a strict majority (3 of 5). Without it, the system blocks rather than risk conflicting decisions.
:::

        view.innerHTML = tbl('users', ['user_id', 'first_name', 'region_id'], [['251', 'Bill', 'us:91']], [2]) + tbl('positions', ['id', 'user_id', 'job_title', 'org_id'], [['458', '251', 'Co-chair', '513'], ['457', '251', 'Founder', '514']], [1, 3]) + tbl('education', ['id', 'user_id', 'school_name'], [['807', '251', 'Harvard']], [1]) + tbl('regions', ['region_id', 'name'], [['us:91', 'Greater Seattle Area']]) + tbl('organizations', ['org_id', 'name'], [['513', 'Gates Foundation'], ['514', 'Microsoft']]);
        cap.innerHTML = '<b>Normalised</b>: each fact stored once; rows refer to each other by ID (highlighted). One-to-many (positions of a user) uses a foreign key; many-to-one (region, organization) avoids duplicating "Greater Seattle Area" in every profile. Reading the profile needs <b>joins</b>, but the schema is enforced on write and the query optimiser picks access paths for you.';

        cap.innerHTML = 'The profile is a <b>tree</b>, and the document model stores it in one place: one fetch, no joins, better <b>locality</b>, and schema-on-read flexibility. But "organization" is now duplicated text; to make it an entity with its own page (many-to-one) you\'re back to IDs, and joins move into application code. Many-to-many relationships (who was recommended by whom) are awkward.';
      } else {
        view.innerHTML = ''; const s = new Scene(view, 640, 270);
        s.update([
          { id: 'bill', x: 320, y: 50, w: 110, h: 34, label: 'Person: Bill', cls: 'vis' },
          { id: 'ms', x: 120, y: 150, w: 130, h: 34, label: 'Org: Microsoft', cls: 'teal' },
          { id: 'gf', x: 320, y: 150, w: 150, h: 34, label: 'Org: Gates Fdn', cls: 'teal' },

          { id: 'sea', x: 320, y: 235, w: 150, h: 34, label: 'Location: Seattle', cls: 'cur' },
          { id: 'paul', x: 110, y: 50, w: 110, h: 34, label: 'Person: Paul', cls: 'vis' }],
          [{ a: 'bill', b: 'ms', label: 'FOUNDED' }, { a: 'bill', b: 'gf', label: 'CO_CHAIR' }, { a: 'bill', b: 'hv', label: 'STUDIED_AT' }, { a: 'gf', b: 'sea', label: 'WITHIN' }, { a: 'paul', b: 'ms', label: 'FOUNDED' }, { a: 'paul', b: 'bill', label: 'KNOWS' }]);
        cap.innerHTML = 'A <b>property graph</b>: vertices and labelled edges, any vertex can connect to any other. Ideal when anything may relate to anything (social graphs, road networks, fraud rings). Queries traverse edges of variable length: <code>MATCH (p:Person)-[:FOUNDED]->(o)-[:WITHIN*0..]->(:Location {name:\'Seattle\'}) RETURN p</code>.';
      }
