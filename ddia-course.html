<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDIA course</title>
<meta name="description" content="An interactive course on Designing Data-Intensive Applications: storage engines, encoding, replication, partitioning, transactions, distributed-systems faults, consistency and consensus, batch and stream processing, with animations, figures, quizzes and interview answers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#f0eee8; --surface-3:#e8e5dc;
  --ink:#1b1b1f; --ink-2:#44444c; --muted:#76767f; --line:#e2dfd6; --line-2:#cfcbc0;
  --accent:#3b5bdb; --accent-2:#2f4ac0; --accent-soft:#e5eaff;
  --c-cur:#c26a00; --c-vis:#3b5bdb; --c-ok:#2b8a3e; --c-bad:#d9363e; --c-spec:#7048e8; --c-teal:#0c8599; --c-pink:#c2255c;
  --f-cur:#ffe6b3; --f-vis:#d9e1ff; --f-ok:#cdeed6; --f-bad:#ffd6d6; --f-spec:#e3d8ff; --f-teal:#cceff4; --f-pink:#ffd6e6;
  --code-bg:#17181c; --code-ink:#e6e6ea; --code-line:#2a2c33;
  --tk:#ff8fab; --ts:#a9e34b; --tn:#ffc078; --tc:#7d8590; --tf:#74c0fc; --tt:#e599f7;
  --shadow:0 1px 2px rgba(20,20,30,.04),0 3px 12px rgba(20,20,30,.05);
  --radius:14px; --nav-h:48px;
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Space Grotesk",Inter,ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111215; --surface:#1a1b20; --surface-2:#222329; --surface-3:#2b2d34;
    --ink:#ececf1; --ink-2:#c3c3cc; --muted:#8d8d98; --line:#2d2f37; --line-2:#3a3d46;
    --accent:#7b93ff; --accent-2:#94a7ff; --accent-soft:#232a4a;
    --c-cur:#ffa94d; --c-vis:#7b93ff; --c-ok:#51cf66; --c-bad:#ff6b6b; --c-spec:#b197fc; --c-teal:#3bc9db; --c-pink:#f783ac;
    --f-cur:#3b2a0e; --f-vis:#1f2747; --f-ok:#13301c; --f-bad:#3e1719; --f-spec:#2a2150; --f-teal:#0f3238; --f-pink:#3d1527;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.2);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111215; --surface:#1a1b20; --surface-2:#222329; --surface-3:#2b2d34;
  --ink:#ececf1; --ink-2:#c3c3cc; --muted:#8d8d98; --line:#2d2f37; --line-2:#3a3d46;
  --accent:#7b93ff; --accent-2:#94a7ff; --accent-soft:#232a4a;
  --c-cur:#ffa94d; --c-vis:#7b93ff; --c-ok:#51cf66; --c-bad:#ff6b6b; --c-spec:#b197fc; --c-teal:#3bc9db; --c-pink:#f783ac;
  --f-cur:#3b2a0e; --f-vis:#1f2747; --f-ok:#13301c; --f-bad:#3e1719; --f-spec:#2a2150; --f-teal:#0f3238; --f-pink:#3d1527;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.2);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 16px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.68 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input{font:inherit;color:inherit}
code,kbd{font-family:var(--mono);font-size:.88em;font-variant-ligatures:none}
:not(pre)>code{background:var(--surface-2);border:1px solid var(--line);padding:.05em .36em;border-radius:6px;overflow-wrap:anywhere}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:292px minmax(0,1fr)}
.side{position:sticky;top:var(--nav-h);height:calc(100vh - var(--nav-h));overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 12px 48px}
.brand{display:block;color:var(--ink);margin:0 8px 14px}
.brand:hover{text-decoration:none}
.brand b{display:block;font:700 19px/1.2 var(--display)}
.brand span{font-size:12.5px;color:var(--muted)}
.search{margin:0 4px}
.search input{width:100%;border:1px solid var(--line-2);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px}
.overall{margin:14px 8px 4px;font-size:12.5px;color:var(--muted)}
.overall b{color:var(--ink);font-weight:600}
.bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c-ok);border-radius:99px;transition:width .3s}
.navg{margin-top:16px}
.navg h4{margin:0 8px 4px;font:600 11px/1.6 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.navl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 8px;border-radius:8px;color:var(--ink-2);font-size:14px;line-height:1.45}
.navl:hover{background:var(--surface-2);text-decoration:none}
.navl.on{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.navl small{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.navl.done small{color:var(--c-ok)}
.scrim{position:fixed;inset:var(--nav-h) 0 0;background:rgba(10,10,15,.4);z-index:35}
.main{min-width:0}
.page{max-width:920px;margin:0 auto;padding:36px 36px 96px}

/* ---------- page header ---------- */
.eyebrow{font:600 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.page h1{font:700 clamp(30px,4vw,42px)/1.1 var(--display);margin:10px 0 12px;letter-spacing:-.01em;text-wrap:balance}
.lede{font-size:18px;line-height:1.6;color:var(--ink-2);margin:0 0 18px;max-width:68ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 12px;font-size:13px;color:var(--ink-2)}
.chip b{color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0;border-block:1px solid var(--line);margin:16px 0 22px}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:4px 12px;font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent-2)}
.tog{display:inline-flex;gap:7px;align-items:center;font-size:13.5px;color:var(--ink-2);margin-left:auto;cursor:pointer;user-select:none}
.tog input{width:16px;height:16px;accent-color:var(--accent)}
.onpage{margin:0 0 26px}
.onpage b{display:block;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}
.onpage a{display:inline-block;margin:0 6px 6px 0;padding:2px 10px;border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.onpage a:hover{background:var(--accent-soft);color:var(--accent-2);text-decoration:none}

/* ---------- prose ---------- */
.page h2{font:700 25px/1.25 var(--display);margin:46px 0 14px;letter-spacing:-.005em}
.page h3{font:600 18px/1.35 var(--display);margin:24px 0 8px}
.page h4{font-size:15px;margin:18px 0 6px}
.page p{margin:0 0 14px}
.page ul,.page ol{margin:0 0 14px;padding-left:22px}
.page li{margin:4px 0}
.page li>ul,.page li>ol{margin:4px 0 0}
.callout{border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);border-radius:10px;padding:11px 16px;margin:0 0 16px;font-size:15px}
.callout.tip{border-left-color:var(--c-ok)}
.callout.warn{border-left-color:var(--c-bad)}
.callout.note{border-left-color:var(--c-spec)}
.tbl{overflow-x:auto;margin:0 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.5}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 11.5px/1.5 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:0}

/* ---------- question cards ---------- */
.q{margin:0 0 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);scroll-margin-top:calc(var(--nav-h) + 16px)}
.q summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:13px 18px;border-radius:var(--radius)}
.q summary::-webkit-details-marker{display:none}
.q summary:hover .qt{color:var(--accent-2)}
.qmark{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:700 12px var(--mono);background:var(--accent-soft);color:var(--accent-2);margin-top:1px}
.q.is-known .qmark{background:var(--f-ok);color:var(--c-ok)}
.qt{flex:1;min-width:0;font-weight:600;line-height:1.5}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.tag{font:600 10.5px/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:5px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.t-core{background:var(--f-bad);color:var(--c-bad)}
.tag.t-easy{background:var(--f-ok);color:var(--c-ok)}
.tag.t-medium{background:var(--f-cur);color:var(--c-cur)}
.tag.t-hard{background:var(--f-pink);color:var(--c-pink)}
.tag.t-senior{background:var(--f-spec);color:var(--c-spec)}
.tag.t-output{background:var(--f-vis);color:var(--c-vis)}
.tag.t-react{background:var(--f-teal);color:var(--c-teal)}
.q details[open]>summary{border-bottom:1px dashed var(--line-2);border-radius:var(--radius) var(--radius) 0 0}
.qa{padding:16px 20px 4px 56px;min-width:0}
.qfoot{display:flex;justify-content:flex-end;padding:2px 0 14px}
.kn{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2);cursor:pointer;user-select:none}
.kn input{width:17px;height:17px;accent-color:var(--c-ok);cursor:pointer}
.hide-known .q.is-known{display:none}
.q.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}

/* ---------- code ---------- */
.code{margin:0 0 16px;border-radius:12px;overflow:hidden;background:var(--code-bg);border:1px solid var(--code-line)}
.code-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 8px 5px 14px;border-bottom:1px solid var(--code-line);font:500 12px var(--mono);color:#9a9aa6}
.ch-r{display:flex;gap:6px}
.code-head button{border:1px solid var(--code-line);background:#23252c;color:#d6d6de;border-radius:6px;padding:2px 10px;font:500 12px var(--mono);cursor:pointer}
.code-head button:hover{border-color:#4a4d57}
.code-head .btn-run{background:#1d3626;border-color:#2c5a3d;color:#a6e9b8}
.code pre{margin:0;padding:13px 16px;overflow-x:auto;color:var(--code-ink);font:13.5px/1.62 var(--mono);tab-size:2}
.code pre code{font-size:inherit}
.tk{color:var(--tk)} .ts{color:var(--ts)} .tn{color:var(--tn)} .tc{color:var(--tc);font-style:italic} .tf{color:var(--tf)} .tt{color:var(--tt)}
.console{border-top:1px solid var(--code-line);background:#0e0f12;padding:8px 14px 10px;font:13px/1.55 var(--mono);color:#cfd3dc;max-height:340px;overflow:auto}
.console .ctitle{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6b7280;margin-bottom:4px}
.cl{white-space:pre-wrap;word-break:break-word}
.cl::before{content:"› ";color:#5c6370}
.cl.error{color:#ff8787}
.cl.warn{color:#ffd43b}
.cl.muted{color:#7d8590}
.cl.muted::before{content:""}
.runner{position:absolute;width:1px;height:1px;border:0;left:-9999px;top:0}

/* ---------- home ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0 30px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font:700 26px/1.2 var(--display)}
.kpi span{font-size:13px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:0 0 12px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--ink)}
.card:hover{border-color:var(--accent);text-decoration:none}
.card b{font:600 16px/1.3 var(--display)}
.card p{flex:1;font-size:13.5px;line-height:1.5;color:var(--muted);margin:4px 0 10px}
.card small{font:500 11.5px var(--mono);color:var(--muted);margin-top:6px}
.groupt{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 10px}

/* ---------- search & pager ---------- */
.sr{display:block;padding:12px 16px;margin:0 0 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.sr:hover{border-color:var(--accent);text-decoration:none}
.sr small{display:block;font:500 11.5px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.sr b{display:block;font-weight:600;margin:2px 0}
.sr span{display:block;font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr mark{background:var(--f-cur);color:inherit;border-radius:3px;padding:0 1px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:52px;padding-top:20px;border-top:1px solid var(--line)}
.pager a{display:block;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface);max-width:48%;color:var(--ink);font-weight:600}
.pager a:hover{border-color:var(--accent);text-decoration:none}
.pager a.next{margin-left:auto;text-align:right}
.pager small{display:block;color:var(--muted);font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.05em}

@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-block}
  .side{position:fixed;left:0;top:var(--nav-h);bottom:0;height:auto;width:min(320px,86vw);z-index:40;transform:translateX(-105%);transition:transform .2s ease}
  .side.open{transform:none;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .page{padding:26px 16px 72px}
  .qa{padding:14px 14px 2px}
  .q summary{padding:12px 14px;flex-wrap:wrap}
  .tags{max-width:none;width:100%;justify-content:flex-start;padding-left:38px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:960px){.side:not(.open){visibility:hidden;transition:transform .2s ease,visibility 0s .2s}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.side{transition:none!important}.q.flash{animation:none}}

/* ===== study guides & animations ===== */
/* ===== study guides: mode tabs, figures, animations ===== */
.modetabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 22px}
.mt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;color:var(--ink);transition:border-color .15s,background .15s,box-shadow .15s}
.mt:hover{border-color:var(--accent);text-decoration:none}
.mt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow)}
.mt-ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent-2)}
.mt.on .mt-ic{background:var(--accent);color:#fff}
.mt-ic svg{width:18px;height:18px}
.mt b{display:block;font:600 15.5px/1.25 var(--display)}
.mt small{display:block;font-size:12.5px;color:var(--muted);line-height:1.4}
.callout.key{border-left-color:var(--c-teal);background:color-mix(in srgb,var(--f-teal) 35%,var(--surface))}
.guide-intro{border:1px solid var(--line);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%);border-radius:14px;padding:14px 18px;margin:0 0 22px;font-size:15px}
.guide-foot{margin-top:40px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.guide-foot p{margin:0;color:var(--ink-2);font-size:15px}
.gf-act{display:flex;gap:8px;flex-wrap:wrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);color:#fff}
.btn.studied{background:var(--c-ok);border-color:var(--c-ok);color:#fff}
.navl .gd{font-style:normal;font-size:10px;color:var(--line-2);margin-right:6px}
.navl .gd.ok{color:var(--c-ok)}
.sr.guide small{color:var(--c-teal)}

/* figures */
.fig{margin:4px 0 20px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption,.fig .cap{font-size:13px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}
.s-box{fill:var(--surface);stroke:var(--line-2);stroke-width:1.6}
.s-box2{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.3}
.s-acc{fill:var(--f-vis);stroke:var(--c-vis);stroke-width:1.8}
.s-ok{fill:var(--f-ok);stroke:var(--c-ok);stroke-width:1.8}
.s-cur{fill:var(--f-cur);stroke:var(--c-cur);stroke-width:1.8}
.s-bad{fill:var(--f-bad);stroke:var(--c-bad);stroke-width:1.8}
.s-spec{fill:var(--f-spec);stroke:var(--c-spec);stroke-width:1.8}
.s-teal{fill:var(--f-teal);stroke:var(--c-teal);stroke-width:1.8}
.s-pink{fill:var(--f-pink);stroke:var(--c-pink);stroke-width:1.8}
.s-line{stroke:var(--line-2);stroke-width:1.8;fill:none}
.s-lA{stroke:var(--c-vis);stroke-width:2;fill:none}
.s-lO{stroke:var(--c-cur);stroke-width:2;fill:none}
.s-lG{stroke:var(--c-ok);stroke-width:2;fill:none}
.s-lR{stroke:var(--c-bad);stroke-width:2;fill:none}
.s-lS{stroke:var(--c-spec);stroke-width:2;fill:none}
.s-lT{stroke:var(--c-teal);stroke-width:2;fill:none}
.s-dash{stroke-dasharray:5 5}
.s-t{font:600 13px var(--mono);fill:var(--ink)}
.s-tb{font:700 14px var(--display);fill:var(--ink)}
.s-ts{font:500 11px var(--mono);fill:var(--muted)}
.s-tl{font:500 12.5px var(--sans);fill:var(--ink-2)}
.s-tA{font:700 12px var(--mono);fill:var(--c-vis)}
.s-tO{font:700 12px var(--mono);fill:var(--c-cur)}
.s-tG{font:700 12px var(--mono);fill:var(--c-ok)}
.s-tR{font:700 12px var(--mono);fill:var(--c-bad)}
.s-tS{font:700 12px var(--mono);fill:var(--c-spec)}
.s-tT{font:700 12px var(--mono);fill:var(--c-teal)}
.s-fA{fill:var(--c-vis)}.s-fO{fill:var(--c-cur)}.s-fG{fill:var(--c-ok)}.s-fR{fill:var(--c-bad)}.s-fS{fill:var(--c-spec)}.s-fT{fill:var(--c-teal)}.s-fM{fill:var(--line-2)}
.a-dash{stroke-dasharray:6 6;animation:vz-flow 1.1s linear infinite}
.a-pulse{animation:vz-pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.a-float{animation:vz-float 3s ease-in-out infinite}
@keyframes vz-flow{to{stroke-dashoffset:-24}}
@keyframes vz-pulse{50%{opacity:.55;transform:scale(1.06)}}
@keyframes vz-float{50%{transform:translateY(-4px)}}

/* animation shell */
.vz{margin:6px 0 24px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.vz-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:13px 18px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.vz-head b{display:block;font:600 15px/1.3 var(--display)}
.vz-head small{display:block;font-size:13px;line-height:1.45;color:var(--muted);margin-top:3px}
.vz-badge{flex:none;font:600 10.5px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--c-spec);background:var(--f-spec);padding:5px 8px;border-radius:6px}
.vz-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 18px;border-bottom:1px dashed var(--line)}
.vz-ctrl:empty{display:none}
.vz-stage{padding:14px 18px;min-width:0}
.vz-foot{padding:0 18px 12px}
.vz-foot:empty{display:none}
.vz-btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.vz-btn:hover{border-color:var(--accent);color:var(--accent-2)}
.vz-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.vz-btn.pri:hover{background:var(--accent-2);color:#fff}
.vz-btn.ic{width:34px;height:32px;padding:0;display:inline-grid;place-items:center}
.vz-inp{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 9px;font-size:13px;min-width:0}
select.vz-inp{padding-right:24px}
.vz-lbl{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--ink-2)}
.vz-lbl input[type=range]{accent-color:var(--accent);width:110px}
.vz-seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface)}
.vz-seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:5px 11px;font-size:13px;color:var(--ink-2);cursor:pointer}
.vz-seg button:last-child{border-right:0}
.vz-seg button.on{background:var(--accent);color:#fff}
.vz-cap{min-height:44px;margin-top:12px;padding:9px 13px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:14.5px;line-height:1.5;color:var(--ink-2)}
.vz-cap b{color:var(--ink)}
.vz-cap code{white-space:normal}
.vz-pbar{height:4px;border-radius:4px;background:var(--surface-3);margin:10px 0;overflow:hidden}
.vz-pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--c-spec));transition:width .2s}
.vz-player{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vz-player .cnt{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.vz-player .spd{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-left:6px}
.vz-player input[type=range]{width:90px;accent-color:var(--accent)}
.vz-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.vz-legend span{display:inline-flex;gap:6px;align-items:center}
.vz-legend i{width:12px;height:12px;border-radius:4px;border:1.5px solid;display:inline-block}
.lg-cur{background:var(--f-cur);border-color:var(--c-cur)!important}.lg-vis{background:var(--f-vis);border-color:var(--c-vis)!important}
.lg-ok{background:var(--f-ok);border-color:var(--c-ok)!important}.lg-bad{background:var(--f-bad);border-color:var(--c-bad)!important}
.lg-spec{background:var(--f-spec);border-color:var(--c-spec)!important}.lg-teal{background:var(--f-teal);border-color:var(--c-teal)!important}
.lg-pink{background:var(--f-pink);border-color:var(--c-pink)!important}.lg-dim{background:var(--surface-2);border-color:var(--line-2)!important}
.vz-stats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.vz-stat{font:500 12.5px/1 var(--mono);padding:6px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.vz-stat b{color:var(--ink)}
.vz-row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.vz-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.vz-panel{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 10px;min-width:0}
.vz-panel>h5{margin:0 0 6px;font:600 10.5px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.vz-chip{display:inline-flex;align-items:center;gap:5px;font:600 12px/1.3 var(--mono);padding:5px 9px;border-radius:8px;background:var(--surface-2);border:1.5px solid var(--line-2);margin:2px;animation:vz-pop .3s ease}
.vz-chip.cur{background:var(--f-cur);border-color:var(--c-cur)}.vz-chip.vis{background:var(--f-vis);border-color:var(--c-vis)}
.vz-chip.ok{background:var(--f-ok);border-color:var(--c-ok)}.vz-chip.bad{background:var(--f-bad);border-color:var(--c-bad)}
.vz-chip.spec{background:var(--f-spec);border-color:var(--c-spec)}.vz-chip.teal{background:var(--f-teal);border-color:var(--c-teal)}
.vz-chip.pink{background:var(--f-pink);border-color:var(--c-pink)}.vz-chip.dim{opacity:.4}
@keyframes vz-pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.vz-code{margin:0;padding:10px 0;border-radius:10px;background:var(--code-bg);color:var(--code-ink);font:12.5px/1.65 var(--mono);overflow-x:auto;counter-reset:ln}
.vz-code .ln{display:block;padding:0 12px 0 40px;position:relative;white-space:pre;transition:background .2s}
.vz-code .ln::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:28px;text-align:right;color:#5c6370}
.vz-code .ln.hl{background:rgba(255,169,77,.18);box-shadow:inset 3px 0 0 #ffa94d}
.vz-code .ln.err{background:rgba(255,107,107,.18);box-shadow:inset 3px 0 0 #ff6b6b}
.vz-con{background:#0e0f12;color:#cfd3dc;border-radius:10px;padding:8px 12px;font:12.5px/1.6 var(--mono);min-height:46px}
.vz-con div{animation:vz-pop .3s ease}
.vz-con .err{color:#ff8787}
.vz-con div::before{content:"› ";color:#5c6370}
.vz-frame{border:1.5px solid var(--line-2);border-radius:10px;background:var(--surface);padding:6px 9px;margin:0 0 6px;font:12.5px/1.5 var(--mono);animation:vz-pop .3s ease}
.vz-frame.top{border-color:var(--c-cur);background:var(--f-cur)}
.vz-frame b{display:block;font:700 12px var(--mono);margin-bottom:2px}
.vz-frame .kv{display:flex;justify-content:space-between;gap:12px;padding:1px 0}
.vz-frame .kv.hl{color:var(--c-ok);font-weight:700}
.vz-frame .kv.tdz span:last-child{color:var(--c-bad)}
.vz-scene{width:100%;height:auto;display:block;overflow:hidden}
.vn rect,.vn circle{fill:var(--surface);stroke:var(--line-2);stroke-width:2;transition:fill .25s,stroke .25s}
.vn .vl{font:600 12.5px var(--mono);fill:var(--ink)}
.vn .vs{font:500 10.5px var(--mono);fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.vn.cur rect,.vn.cur circle{fill:var(--f-cur);stroke:var(--c-cur)}
.vn.vis rect,.vn.vis circle{fill:var(--f-vis);stroke:var(--c-vis)}
.vn.ok rect,.vn.ok circle{fill:var(--f-ok);stroke:var(--c-ok)}
.vn.bad rect,.vn.bad circle{fill:var(--f-bad);stroke:var(--c-bad)}
.vn.spec rect,.vn.spec circle{fill:var(--f-spec);stroke:var(--c-spec)}
.vn.teal rect,.vn.teal circle{fill:var(--f-teal);stroke:var(--c-teal)}
.vn.pink rect,.vn.pink circle{fill:var(--f-pink);stroke:var(--c-pink)}
.vn.dim{opacity:.35}
.vn.ghost rect{stroke-dasharray:4 3;fill:transparent}
.vn.enter{animation:vz-fade .35s ease}
.vn.leave{opacity:0;transition:opacity .3s}
@keyframes vz-fade{from{opacity:0}to{opacity:1}}
.ve{fill:none;stroke:var(--line-2);stroke-width:2;transition:stroke .25s,opacity .25s}
.ve.hl{stroke:var(--c-cur);stroke-width:2.6}.ve.ok{stroke:var(--c-ok);stroke-width:2.6}.ve.bad{stroke:var(--c-bad);stroke-width:2.4;stroke-dasharray:6 4}
.ve.vis{stroke:var(--c-vis);stroke-width:2.4}.ve.spec{stroke:var(--c-spec);stroke-width:2.4}.ve.dim{opacity:.2}
.ve.flow{stroke-dasharray:7 6;animation:vz-flow 1s linear infinite}
.vel{font:600 11px var(--mono);fill:var(--ink-2);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
.varw{fill:var(--line-2)}.varw.hl{fill:var(--c-cur)}.varw.ok{fill:var(--c-ok)}.varw.bad{fill:var(--c-bad)}.varw.vis{fill:var(--c-vis)}.varw.spec{fill:var(--c-spec)}.varw.dim{fill:var(--line-2);opacity:.3}
.vtag text{font:700 11px var(--mono);fill:var(--c-spec);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.vtag.cur text{fill:var(--c-cur)}.vtag.ok text{fill:var(--c-ok)}.vtag.bad text{fill:var(--c-bad)}.vtag.vis text{fill:var(--c-vis)}
.vz-seq text{font:600 12px var(--mono);fill:var(--ink)}
.vz-seq .actor rect{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.5}
.vz-seq .life{stroke:var(--line-2);stroke-dasharray:4 4}
.vz-seq .msg line,.vz-seq .msg path{stroke:var(--c-vis);stroke-width:2;fill:none}
.vz-seq .msg.ok line,.vz-seq .msg.ok path{stroke:var(--c-ok)}.vz-seq .msg.bad line,.vz-seq .msg.bad path{stroke:var(--c-bad)}
.vz-seq .msg.cur line,.vz-seq .msg.cur path{stroke:var(--c-cur);stroke-width:2.6}
.vz-seq .msg.spec line,.vz-seq .msg.spec path{stroke:var(--c-spec)}
.vz-seq .msg text{font:500 11.5px var(--sans);fill:var(--ink-2);paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.vz-seq .msg.cur text{fill:var(--ink);font-weight:600}
.vz-seq .msg{animation:vz-fade .35s ease}
.vz-seq .note rect{fill:var(--f-cur);stroke:var(--c-cur)}
.vz-gantt{position:relative;font:12px var(--mono)}
.vz-lane{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;margin:4px 0}
.vz-lane>span{color:var(--ink-2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vz-track{position:relative;height:24px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.vz-barx{position:absolute;top:3px;bottom:3px;border-radius:5px;display:flex;align-items:center;padding:0 6px;font:600 10.5px var(--mono);color:#fff;white-space:nowrap;overflow:hidden;transition:width .25s,left .25s,opacity .25s}
.vz-mark{position:absolute;top:0;bottom:0;width:2px;background:var(--c-bad);z-index:2}
.vz-mark span{position:absolute;top:-2px;left:4px;font:700 10px var(--mono);color:var(--c-bad);white-space:nowrap;background:var(--surface);padding:0 3px;border-radius:3px}
.vz-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vz-grid2>*{min-width:0}
@media (max-width:760px){.vz-grid2{grid-template-columns:1fr}.modetabs{grid-template-columns:1fr}.vz-lane{grid-template-columns:84px 1fr}}
@media (prefers-reduced-motion:reduce){.vz *,.fig *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.card .gtag{display:block;margin:-2px 0 8px;font:600 11.5px var(--mono);color:var(--c-teal)}
.guide>h2:first-child{margin-top:8px}
.guide .vz{margin:6px 0 22px}
.ve.dash{stroke-dasharray:6 5}
/* live React previews: full-screen editor */
.code.has-pv .code-head .btn-run{background:#1d2c4a;border-color:#2e4a80;color:#b9cdfb}
.pv-hint{font:500 11.5px var(--mono);color:#8b8f9a;padding:0 0 0 6px}
html.ide-open{overflow:hidden}
.ide{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:var(--code-bg);color:var(--code-ink)}
.ide-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--code-line);font:500 13px var(--sans)}
.ide-title{font:600 14px var(--display);color:#f2f2f5;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46ch}
.ide-hint{font:500 11.5px var(--mono);color:#8b8f9a}
.ide-auto{display:inline-flex;align-items:center;gap:5px;font:500 12.5px var(--mono);color:#c9cbd3;cursor:pointer}
.ide-bar button{border:1px solid var(--code-line);background:#23252c;color:#d6d6de;border-radius:7px;padding:5px 12px;font:500 12.5px var(--mono);cursor:pointer}
.ide-bar button:hover{border-color:#4a4d57}
.ide-bar .ide-run{background:#1d3626;border-color:#2c5a3d;color:#a6e9b8}
.ide-bar .ide-x{padding:5px 10px}
.ide-main{--left:50%;flex:1;min-height:0;display:grid;grid-template-columns:var(--left) 6px 1fr}
.ide-code{min-width:0;min-height:0;position:relative}
.ide-ed{position:absolute;inset:0}
.ide-ed pre,.ide-ed textarea{position:absolute;inset:0;margin:0;padding:14px 16px;border:0;font:13.5px/1.6 var(--mono);tab-size:2;white-space:pre;font-variant-ligatures:none;letter-spacing:0;word-spacing:0}
.ide-ed pre{overflow:hidden;color:var(--code-ink);pointer-events:none}
.ide-ed textarea{background:transparent;color:transparent;caret-color:#fff;resize:none;outline:0;overflow:auto}
.ide-ed textarea::selection{background:rgba(110,150,255,.35);color:transparent}
.ide-split{background:var(--code-line);cursor:col-resize;touch-action:none}
.ide-split:hover,.ide-split:focus-visible{background:#3b6fe0;outline:0}
.ide.dragging iframe{pointer-events:none}
.ide.dragging{user-select:none}
.ide-out{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);color:var(--ink)}
.ide-out-bar{display:flex;justify-content:space-between;padding:6px 12px;border-bottom:1px solid var(--line);font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.ide-status{text-transform:none;letter-spacing:0;font-weight:500}
.ide-status.ok{color:var(--c-ok)}.ide-status.error{color:var(--c-bad)}
.ide-frame{flex:1;min-height:0}
.ide-frame iframe{display:block;width:100%;height:100%;border:0;background:var(--surface)}
@media (max-width:760px){
  .ide-main{grid-template-columns:1fr;grid-template-rows:42% 6px 1fr}
  .ide-split{cursor:default}
  .ide-hint{display:none}
  .ide-title{max-width:100%;flex-basis:100%}
}

/* ===== DDIA course extras ===== */
.mnum{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-right:8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font:600 10.5px var(--mono);font-style:normal;color:var(--muted);vertical-align:1px}
.navl.on .mnum{background:var(--accent);border-color:var(--accent);color:#fff}
.card .mnum{min-width:24px;height:24px;font-size:12px}
.card.done{border-color:color-mix(in srgb,var(--c-ok) 45%,var(--line))}
.chip.ok{color:var(--c-ok);border-color:color-mix(in srgb,var(--c-ok) 45%,var(--line))}
.code.out .code-head{color:#7fd39a}
.code.out pre{color:#cfe8d5}
.quiz{margin:8px 0 22px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px;box-shadow:var(--shadow)}
.quiz-tag{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c-spec)}
.quiz-q{margin:6px 0 10px;font-weight:600}
.quiz-opts{display:grid;gap:8px}
.quiz-o{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.quiz-o:hover{border-color:var(--accent)}
.quiz-l{flex:none;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;background:var(--surface);border:1px solid var(--line-2);font:600 12px var(--mono)}
.quiz-o.right,.quiz-o.reveal{border-color:var(--c-ok);background:var(--f-ok)}
.quiz-o.wrong{border-color:var(--c-bad);background:var(--f-bad)}
.quiz-why{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:14.5px}
.btn.primary{display:inline-block}
.menu-btn{display:none}
@media (max-width:960px){.menu-btn{display:inline-block}}
code,pre,.vz-code,.vz-con,.ide-ed{font-variant-ligatures:none;font-feature-settings:'liga' 0,'calt' 0}
/* ===== DDIA reading components ===== */
.page{counter-reset:h2n}
.page h2{counter-increment:h2n;display:flex;align-items:baseline;gap:12px;padding-top:18px;border-top:1px solid var(--line)}
.page h2::before{content:counter(h2n,decimal-leading-zero);flex:none;font:600 13px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:3px 7px;transform:translateY(-3px)}
.page > p{max-width:72ch}
.page h3{display:flex;align-items:center;gap:8px}
.page h3::before{content:'';width:8px;height:8px;border-radius:2px;background:var(--c-teal);flex:none}
.callout.iv{border-left-color:var(--c-pink);background:color-mix(in srgb,var(--f-pink) 35%,var(--surface))}
.callout.fun{border-left-color:var(--c-cur);background:color-mix(in srgb,var(--f-cur) 35%,var(--surface))}
.callout.warn{background:color-mix(in srgb,var(--f-bad) 25%,var(--surface))}
.callout.tip{background:color-mix(in srgb,var(--f-ok) 25%,var(--surface))}
/* 30-second version */
.tldr{border:1.5px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:linear-gradient(135deg,color-mix(in srgb,var(--accent-soft) 80%,var(--surface)),var(--surface));border-radius:16px;padding:16px 20px 6px;margin:4px 0 26px;box-shadow:var(--shadow)}
.tldr-h{display:flex;align-items:center;gap:8px;font:600 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.tldr ul{padding-left:20px}
.tldr li{margin:6px 0}
/* term / definition rows */
.page ul.kv{list-style:none;padding:0;margin:0 0 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.page ul.kv > li{display:grid;grid-template-columns:minmax(130px,26%) 1fr;gap:14px;margin:0;padding:11px 14px;border-top:1px solid var(--line)}
.page ul.kv > li:first-child{border-top:0}
.page ul.kv > li:nth-child(even){background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.kv-k{font-weight:600;color:var(--ink);font-family:var(--display);line-height:1.4}
.kv-v{color:var(--ink-2)}
.kv-v ul,.kv-v ol{margin:6px 0 0}
/* numbered flow lists */
.page ol.flow{list-style:none;padding:0;counter-reset:fl;margin:0 0 18px}
.page ol.flow > li{counter-increment:fl;position:relative;padding:2px 0 12px 42px;margin:0}
.page ol.flow > li::before{content:counter(fl);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--accent);color:var(--accent);font:600 13px var(--mono)}
.page ol.flow > li:not(:last-child)::after{content:'';position:absolute;left:13px;top:30px;bottom:0;width:2px;background:color-mix(in srgb,var(--accent) 30%,var(--line))}
/* card grids */
.cgrid{display:grid;gap:12px;margin:0 0 20px;position:relative}
.cgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cgrid.c3{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cgrid.c4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ccard{--cc:var(--accent);border:1px solid var(--line);border-top:3px solid var(--cc);border-radius:12px;background:var(--surface);padding:12px 14px 4px;box-shadow:var(--shadow);font-size:15px;min-width:0}
.ccard.t1{--cc:var(--c-teal)}.ccard.t2{--cc:var(--c-spec)}.ccard.t3{--cc:var(--c-pink)}.ccard.t4{--cc:var(--c-ok)}.ccard.t5{--cc:var(--c-cur)}
.ccard-h{font:600 16px/1.3 var(--display);margin-bottom:6px;color:var(--ink)}
.ccard p{margin:0 0 10px}
.ccard ul,.ccard ol{padding-left:18px;margin:0 0 10px}

## What this course covers

An application is **data-intensive** when data, not CPU, is its main challenge: how much there is, how complex it is, or how fast it changes. The course follows the book's three parts, plus a final interview module:

:::cards 2
@ Part I · Foundations (modules 1–5)
- what reliability, scalability and maintainability mean
- relational vs document vs graph models
- how databases store data on disk: LSM-trees, B-trees, column stores
- how data is encoded and evolved over time
@ Part II · Distributed data (modules 6–10)
- replication and replication lag
- partitioning (sharding)
- transactions and isolation levels
- why distributed systems fail in weird ways
- linearizability, ordering, two-phase commit and consensus
@ Part III · Derived data (modules 11–12)
- batch processing: Unix pipes, MapReduce, dataflow engines
- stream processing: logs, change data capture, event sourcing
- windows and exactly-once semantics
@ Part IV · Interview prep (module 13)
- a decision cheat sheet
- a question bank with model answers
- four system design walkthroughs
:::

<script type="text/x-jc" id="m-foundations" data-part="Part I · Foundations" data-title="Reliable, scalable and maintainable applications" data-short="Reliability, scalability, maintainability" data-lede="Chapter 1. The three concerns behind every data system: keeping it working when things go wrong, keeping it fast as load grows, and keeping it changeable by the people who run it. Describing load and measuring performance with percentiles.">
:::tldr
- Every data system is judged on three things: **reliability** (works when things break), **scalability** (copes with growth) and **maintainability** (people can keep running and changing it).
- A **fault** is one part misbehaving; a **failure** is users losing service. Good systems stop faults from becoming failures.
- Describe load with **load parameters** (e.g. Twitter's followers-per-user drives fan-out), not vague words like "scalable".
- Measure performance with **percentiles** (p50, p99, p999), never averages. Tails dominate when one request fans out to many services.
- Most software cost is **maintenance**, so design for operability, simplicity (abstractions) and evolvability.
:::

## Thinking about data systems

Apps are assembled from a handful of standard building blocks:

:::cards 3
@ Databases
Store data so it can be found again later.
@ Caches
Remember the result of an expensive operation to speed up reads.
@ Search indexes
Let users search by keyword or filter.
@ Stream processing
Send messages to other processes, handled asynchronously.
@ Batch processing
Periodically crunch large amounts of accumulated data.
@ The blurry edges
Redis is a datastore used as a message queue; Kafka is a message queue with database-like durability. Categories overlap.
:::

> **Key idea:** When you glue several tools together behind an API (say, a database plus a cache plus a search index), **you** have built a new special-purpose data system, and **you** own its guarantees, such as "the cache is invalidated correctly on every write".

The book focuses on three **non-functional requirements**:

:::cards 3
@ Reliability
Does it keep working correctly (right answers, acceptable speed) **even when things go wrong**?
@ Scalability
As data, traffic or complexity grow, are there **reasonable ways to cope**?
@ Maintainability
Can many different people **operate and adapt** it productively over the years?
:::

## Reliability

Reliability means "continuing to work correctly, even when things go wrong". The things that go wrong are **faults**; systems that cope with them are **fault-tolerant** (resilient).

:::vs
@ Fault
One **component** deviates from its spec: a disk dies, a process crashes, a network link drops packets.
@ Failure
The **system as a whole** stops providing the required service to the user.
:::

> **Key idea:** You can't drive the probability of faults to zero, so design mechanisms that stop faults from turning into failures. Netflix's **Chaos Monkey** deliberately kills processes at random, so the recovery machinery is exercised all the time instead of rotting until a real outage.

The three families of faults:

:::tabs
@ Hardware faults
Disks crash, RAM goes bad, the power grid blacks out, someone unplugs the wrong cable.

> **Picture it:** A hard disk's mean time to failure is about **10–50 years**. Sounds safe, until you run 10,000 disks: then you should expect roughly **one dead disk every day**.

- **Redundancy per component**: RAID, dual power supplies, hot-swappable CPUs, batteries and diesel generators.
- **Tolerate losing whole machines in software**: as data volumes grow, and cloud VMs can vanish without warning, systems are designed to survive the loss of entire nodes.
- **Bonus: rolling upgrades.** If any node can be lost, you can patch one node at a time with no downtime.
@ Software errors
Hardware faults are mostly **random and independent**. Software bugs are **systematic and correlated**: the same bug hits every node at once, so they cause far more outages.

- A bug that crashes every instance on a particular bad input (the June 2012 leap second hung many Linux applications).
- A runaway process eating a shared resource: CPU, memory, disk, bandwidth.
- A dependency that slows down, stops responding or returns corrupted data.
- **Cascading failures**: a small fault in one component triggers faults in others.

There's no single fix, but many small habits help: question your assumptions about how parts interact, test thoroughly, isolate processes, let processes crash and restart, measure and monitor production, and have the system **check its own guarantees** (a message queue verifying messages in = messages out).
@ Human errors
Humans design, build and operate systems, and humans make mistakes. One study of large internet services found **operator configuration errors** were the leading cause of outages; hardware caused only 10–25%.

- **Design to make the right thing easy**: good abstractions, APIs and admin tools, but not so restrictive that people work around them.
- **Decouple** where people make mistakes from where mistakes hurt: sandboxes with real data and no real users.
- **Test at every level**: unit, integration, manual. Automated tests are great at corner cases.
- **Make recovery fast**: quick config rollback, gradual code rollouts, tools to recompute data.
- **Monitor in detail** (telemetry): performance metrics and error rates.
- Good management practices and training.
:::

## Scalability

"X is scalable" is a meaningless label. The useful question is: **"If the system grows in this particular way, what are our options?"** To answer it we need precise ways to describe load and performance.

### Describing load: Twitter's home timeline

Load is described with **load parameters**. Which ones matter depends on the architecture: requests per second, read/write ratio, active users, cache hit rate.

:::cards 2
@ Post tweet
**4.6k** requests/s on average, **12k/s** at peak (2012 figures). A user publishes a message to their followers.
@ Home timeline
**300k** requests/s. A user reads the tweets of everyone they follow.
:::

The hard part isn't the tweet volume, it's **fan-out**: every user follows many people and is followed by many. Twitter tried both ways of handling it; step through them below.

:::viz fanout

:::vs
@ Approach 1: merge on read
Store each tweet once. To load a timeline, look up everyone the user follows, fetch their recent tweets and merge them.
- Cheap writes, expensive reads.
- Struggled to keep up with 300k timeline reads/s.
@ Approach 2: fan out on write
Keep a cached timeline ("mailbox") per user. When someone tweets, insert it into each follower's timeline.
- Cheap reads, expensive writes.
- Wins because reads outnumber writes by ~65:1.
:::

> **Key idea:** For Twitter, the **distribution of followers per user** (weighted by how often they tweet) is _the_ key load parameter, because it determines fan-out work. Celebrities with 30M+ followers make approach 2 painful, so Twitter runs a **hybrid**: most tweets fan out on write, celebrity tweets are merged in at read time.

### Describing performance

Two ways to ask the question:

:::cards 2
@ Fixed resources
Increase a load parameter and keep the hardware the same: how does performance change?
@ Fixed performance
Increase a load parameter: how much more hardware do you need to keep performance the same?
:::

:::vs
@ Throughput (batch systems)
Records processed per second, or total time to run a job over a dataset. Example: Hadoop.
@ Response time (online systems)
Time between a client sending a request and receiving the response.
:::

> **Naming:** **Response time** is what the client sees: service time + network delays + queueing delays. **Latency** is only the time a request spends _waiting_ to be handled (latent, awaiting service). They're often used interchangeably, but they're different.

Response time varies on every request, even identical ones, because of context switches, lost packets and TCP retransmissions, GC pauses, page faults, even mechanical vibration in the server rack. So treat it as a **distribution** and describe it with **percentiles**. Play with the distribution:

:::viz percentiles

- **Median (p50)**: how long users typically wait. Half of requests are faster.
- **Tail latencies (p95, p99, p999)**: how bad the outliers are. Amazon targets p999 for internal services, because the slowest requests often come from customers with the most data, who tend to be the most valuable ones. Going further to p9999 was judged not worth the cost.
- **SLOs and SLAs**: service level objectives/agreements are written in percentiles, e.g. "up if median < 200 ms and p99 < 1 s".
- **Queueing delays**: these cause much of the tail. A server handles only a few requests in parallel, so a few slow ones hold up everything behind them (**head-of-line blocking**). Measure on the **client**, and make load-test clients send requests independently of responses.
- **Tail latency amplification**: if one page load calls 10 backends in parallel, it's as slow as the slowest call, so a much larger fraction of page loads hit the tail.

> **Pitfall:** Averaging percentiles (e.g. combining per-minute p99s into an hourly figure) is mathematically meaningless. Add up the **histograms** instead. Efficient approximations: forward decay, t-digest, HdrHistogram.

### Approaches for coping with load

:::vs
@ Scale up (vertical)
Buy a more powerful machine. Simple, but cost grows faster than linearly and there's a ceiling.
@ Scale out (horizontal)
Spread load over many smaller machines: a **shared-nothing** architecture. Scales further, but adds distributed-systems complexity.
:::

- **Mix both**: good architectures are pragmatic. A few powerful machines can be simpler and cheaper than many small VMs.
- **Elastic vs manual**: elastic systems add resources automatically when load rises (useful when load is unpredictable). Manually scaled systems are simpler and have fewer operational surprises.
- **Stateless vs stateful**: distributing stateless services is easy. Distributing a stateful database adds a lot of complexity, so the old wisdom was to keep the database on one node as long as possible.
- **No magic scaling sauce**: architecture depends on read volume, write volume, data size, complexity, latency needs and access patterns. 100,000 requests/s of 1 kB each and 3 requests/minute of 2 GB each have the same throughput but need completely different designs.

## Maintainability

Most of the cost of software is not building it but **maintaining** it: fixing bugs, keeping it running, investigating failures, adapting to new platforms and use cases, and repaying technical debt. Three design principles keep that cost down:

:::tabs
@ Operability
**Make life easy for operations.** Good operations can often work around bad software, but good software can't run reliably with bad operations.

Data systems help operators by providing:
- visibility into runtime behaviour and internals (good monitoring);
- support for automation and standard tools;
- no dependency on any individual machine (take one down for maintenance while the rest keep going);
- good documentation and an understandable model ("if I do X, Y will happen");
- sensible defaults that can be overridden;
- self-healing where appropriate, with manual control when needed;
- predictable behaviour with few surprises.
@ Simplicity
**Manage complexity.** A project mired in complexity becomes a **big ball of mud**: an exploding state space, tight coupling, tangled dependencies, inconsistent naming, special cases and performance hacks. It's harder to change and more likely to have bugs.

> **Key idea:** The best weapon against **accidental complexity** (complexity that comes from the implementation, not from the problem itself) is **abstraction**: a clean façade that hides detail. High-level languages hide machine code; SQL hides on-disk data structures, concurrency and crash recovery.
@ Evolvability
**Make change easy.** Requirements never stop changing: you learn new facts, unexpected use cases appear, priorities shift, users ask for features, platforms get replaced, laws change, growth forces architectural change.

Agile practices (TDD, refactoring) help at the scale of one codebase. This book looks at evolvability across **whole data systems**, e.g. how Twitter moved its timelines from approach 1 to approach 2.
:::

## Recall

:::flash
Q: Fault vs failure?
A: A fault is one component deviating from spec; a failure is the whole system no longer serving users. Fault tolerance stops faults from becoming failures.
Q: Why are software bugs more dangerous than hardware faults?
A: Hardware faults are random and independent; bugs are systematic and hit many nodes at once (correlated), causing cascading failures.
Q: Leading cause of outages in large internet services?
A: Configuration errors by human operators. Hardware was only 10–25%.
Q: Twitter's key load parameter?
A: The distribution of followers per user (weighted by tweet rate), because it determines fan-out work.
Q: Why does Twitter fan out on write?
A: Timeline reads outnumber tweets ~65:1, so precomputing timelines is cheaper overall. Celebrity tweets are merged in at read time.
Q: Latency vs response time?
A: Response time is everything the client sees (service + network + queueing). Latency is only the time spent waiting to be serviced.
Q: Why not average p99s?
A: Percentiles don't average meaningfully. Combine histograms (HdrHistogram, t-digest) instead.
Q: What is tail latency amplification?
A: When a request fans out to many backends, it's as slow as the slowest one, so tail latencies hit a large fraction of user requests.
Q: The three maintainability principles?
A: Operability, simplicity (remove accidental complexity with abstractions) and evolvability.
:::

:::quiz
Q: A service's p99 response time is 1.5 s and each page load makes 10 parallel calls to it. Roughly what fraction of page loads include at least one call slower than 1.5 s?
- 1%
- [x] About 10%
- 50%
- 99%
> 1 − 0.99¹⁰ ≈ 9.6%. This is tail latency amplification: fan-out makes tail latencies matter for a large fraction of users.
:::

:::quiz
Q: Which statement about Twitter's two timeline approaches is correct?
- Fan-out on write makes posting a tweet cheaper
- [x] Fan-out on write makes reading the home timeline cheaper, at the cost of more work per tweet
- Querying on read scales best because reads are cheap
- Celebrities make the read-time join approach expensive
> Approach 2 precomputes each user's timeline when tweets are posted, which suits Twitter's 65:1 read/write ratio. Celebrities make the *write* fan-out expensive, so Twitter uses a hybrid.
:::

:::quiz
Q: Why should response times be measured on the client side?
- Servers can't measure time accurately
- [x] Queueing delays before the server starts processing are invisible to the server
- Clients have better clocks
- Percentiles can only be computed on clients
> A request may wait in queues (network, OS, server) before processing even begins. Server-side measurements miss this, which is a large part of tail latency.
:::
