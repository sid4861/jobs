<script type="text/x-jc" id="m-datamodels" data-part="Part I · Foundations" data-title="Data models and query languages" data-short="Data models &amp; query languages" data-lede="Chapter 2. Relational vs document vs graph models, the object-relational mismatch, one-to-many vs many-to-many relationships, schema-on-read vs schema-on-write, and declarative vs imperative queries (SQL, MapReduce, Cypher, SPARQL, Datalog).">
:::tldr
- The data model shapes what's easy and what's hard for everything built on top of it: one of the most important design choices.
- **Document** model: great for self-contained trees of one-to-many data loaded together (locality, flexible schema), weak at joins.
- **Relational** model: great for many-to-one and many-to-many relationships thanks to joins and a query optimiser.
- **Graph** model: best when anything can relate to anything and you need variable-length traversals (Cypher, SPARQL, Datalog).
- "Schemaless" really means **schema-on-read**; relational is **schema-on-write**.
- **Declarative** queries (SQL) say _what_, not _how_, so the database can optimise and parallelise them.
:::

## Why data models matter

Software is built by stacking data models, each layer hiding the mess below it:

:::steps
@ Application objects
Your code's objects, data structures and APIs that model the real world.
@ General-purpose data model
Those objects are stored as JSON/XML documents, relational tables or a graph.
@ Bytes
The database engineers decide how documents, tables or graphs become bytes in memory, on disk and on the network.
@ Physics
Hardware engineers turn bytes into electrical currents, light pulses and magnetic fields.
:::

> **Key idea:** Each layer hides the complexity below it behind a clean model. The model you pick has a profound effect on what's easy and what's hard for the software above it.

## Relational model vs document model

:::vs
@ Relational model (Codd, 1970)
Data lives in **relations** (tables): unordered collections of **tuples** (rows). It has dominated since the mid-1980s for transaction and batch processing, outlasting the network (CODASYL), hierarchical (IMS), object and XML databases.
@ NoSQL (from ~2009)
Driven by:
- scalability needs (huge datasets or write throughput);
- a preference for free and open-source software;
- specialised queries SQL doesn't handle well;
- frustration with rigid relational schemas.
:::

The likely future is **polyglot persistence**: relational databases used alongside a variety of non-relational ones.

### The object-relational mismatch

Most application code is object-oriented, so an awkward translation layer sits between objects and tables: the **impedance mismatch**. ORMs like ActiveRecord and Hibernate reduce the boilerplate but can't fully hide the gap. Compare the same résumé in different models:

:::viz datamodels

A résumé (a LinkedIn profile) is a **one-to-many** tree: one user, many positions, many education entries. Three ways to store it in SQL:

:::cards 3
@ Normalised tables
Separate `positions` and `education` tables with foreign keys to `users`. The traditional approach.
@ Structured column
XML or JSON column types (later SQL versions, PostgreSQL, MySQL) that the database can query and index.
@ Opaque text
Encode the jobs as JSON text. Simple, but the database can't query inside it.
:::

> **Key idea:** A **JSON document** represents the tree naturally and has better **locality**: one query fetches the whole profile, instead of a multi-way join or several queries.

### Many-to-one and many-to-many relationships

Why store `region_id` instead of the text "Greater Seattle Area"? Using an ID gives you:

- **Consistency**: the same style and spelling everywhere.
- **No ambiguity**: several cities can share a name.
- **Easy updates**: the name is stored in exactly one place.
- **Localisation**: translate the name per language.
- **Better search**: the database knows Seattle is in Washington.

:::vs
@ Normalisation
Store an **ID** and keep the human-readable value in one place. Needs joins to read.
@ Denormalisation
Duplicate the human-readable value everywhere it's used. Saves joins, but risks inconsistency and adds write overhead.
:::

Normalisation needs **many-to-one** relationships (many people live in one region). Those fit the relational model well (joins) but fit poorly into document databases with weak joins: the application has to emulate joins with several queries.

> **Pitfall:** Data tends to become **more interconnected** as features are added. Organisations and schools turn into entities with their own pages; recommendations link users to users. A model that starts as a neat tree can grow many-to-many relationships.

### Are document databases repeating history?

This debate is old. IBM's **IMS** (1968) stored data as a tree of nested records, very like JSON, and hit the same many-to-many problem. Two fixes were proposed:

:::vs
@ Network model (CODASYL)
- A record can have **multiple parents**.
- Links are like pointers. To reach a record you follow an **access path** from a root.
- Changing access paths is hard; queries are imperative and complicated.
@ Relational model
- All data is laid out in the open, in tables.
- A **query optimiser** chooses the execution order and the indexes automatically.
- You build the optimiser once, and every application benefits.
:::

Document databases went back to the hierarchical model for one-to-many (nested records). For many-to-one and many-to-many they use **document references** (IDs) resolved at read time with joins or follow-up queries: essentially relational foreign keys.

### Relational vs document databases today

:::tabs
@ Head to head
| | Document model | Relational model |
|---|---|---|
| Strengths | schema flexibility, locality (performance), closer to application data structures | better support for joins, many-to-one and many-to-many relationships |
| Code is simpler when | data is document-like: a tree of one-to-many relationships, loaded all at once | data is highly interconnected |
| Weak spots | can't refer directly to a nested item ("the second position in the list"); poor joins | shredding a document into many tables leads to cumbersome schemas |
@ Schema flexibility
"Schemaless" is misleading: the code that reads the data usually assumes some structure. Better terms:

:::vs
@ Schema-on-read
Structure is implicit and interpreted only when data is read. Like **dynamic** type checking.
@ Schema-on-write
Schema is explicit and the database ensures every write conforms. Like **static** type checking.
:::

```sql Changing the format: a migration
ALTER TABLE users ADD COLUMN first_name text;
UPDATE users SET first_name = split_part(name, ' ', 1);      -- PostgreSQL
UPDATE users SET first_name = substring_index(name, ' ', 1); -- MySQL
```

```js Changing the format: handle both shapes in code
if (user && user.name && !user.first_name) {
  user.first_name = user.name.split(" ")[0];  // documents written before Dec 8, 2013 don't have first_name
}
```

- `ALTER TABLE` takes milliseconds in most relational databases. **MySQL** is the exception: it copies the whole table.
- The `UPDATE` over a large table is slow on **any** database.
- Schema-on-read shines when items don't share one structure: many object types, or structure dictated by external systems.
@ Data locality
A document is usually stored as one continuous string: JSON, XML or a binary form like MongoDB's BSON.

- Locality only helps if you need **large parts of the document at once**.
- Updates usually rewrite the whole document, so **keep documents small**.
- Locality isn't unique to documents: Google Spanner interleaves child rows inside parent tables, Oracle has multi-table index cluster tables, and Bigtable, Cassandra and HBase have column families.
@ Convergence
The models are blending:
- Relational databases support JSON and XML: PostgreSQL since 9.3, MySQL since 5.7, IBM DB2 since 10.5.
- RethinkDB supports relational-style joins; some MongoDB drivers resolve document references automatically.

A hybrid of the two models is a good direction for the future.
:::

## Query languages for data

SQL is **declarative**. IMS and CODASYL were queried with **imperative** code. Same question, two styles:

:::vs
@ Imperative: say HOW
```js
function getSharks() {
  var sharks = [];
  for (var i = 0; i < animals.length; i++) {
    if (animals[i].family === "Sharks") sharks.push(animals[i]);
  }
  return sharks;
}
```
@ Declarative: say WHAT
```sql
SELECT * FROM animals
WHERE family = 'Sharks';
```
The optimiser decides how.
:::

Why declarative wins:

:::cards 3
@ Concise
Easier to write and read.
@ Hides internals
The database can reorganise storage (reclaim space, change indexes) without breaking queries.
@ Parallelisable
It specifies only the pattern of results, not an algorithm, so work can be split across cores and machines.
:::

> **Analogy:** CSS selectors (`li.selected > p`) are declarative: the browser keeps styles correct as the page changes. Walking the DOM in JavaScript to set styles is imperative: it breaks when the class is removed and can't take advantage of new browser APIs.

### MapReduce querying

MapReduce (popularised by Google) processes large amounts of data in bulk across many machines. MongoDB supports a limited read-only form:

```js MongoDB MapReduce: sharks per month
db.observations.mapReduce(
  function map() {                                   // called once per matching document
    var year = this.observationTimestamp.getFullYear();
    var month = this.observationTimestamp.getMonth() + 1;
    emit(year + "-" + month, this.numAnimals);         // emit a key and a value
  },
  function reduce(key, values) { return Array.sum(values); },   // combine values for the same key
  { query: { family: "Sharks" }, out: "monthlySharkReport" }
);
```

> **Key idea:** `map` and `reduce` must be **pure functions**: they use only their inputs, make no extra database queries and have no side effects. That lets the database run them anywhere, in any order, and rerun them after failures.

Writing two carefully coordinated functions is harder than writing one query, so MongoDB 2.2 added the declarative **aggregation pipeline**:

```js Same query as an aggregation pipeline
db.observations.aggregate([
  { $match: { family: "Sharks" } },
  { $group: { _id: { year: { $year: "$observationTimestamp" }, month: { $month: "$observationTimestamp" } },
              totalAnimals: { $sum: "$numAnimals" } } }
]);
```

It's as expressive as a subset of SQL, written in JSON: a NoSQL system rediscovering SQL in disguise.

## Graph-like data models

When many-to-many relationships are everywhere, model the data as a **graph**: **vertices** (nodes, entities) joined by **edges** (relationships, arcs).

:::cards 3
@ Social graphs
Vertices are people; edges say who knows whom.
@ The web graph
Vertices are pages; edges are links. PageRank runs on it.
@ Road and rail networks
Vertices are junctions; edges are roads or tracks. Shortest-path algorithms run on it.
:::

Graphs needn't be homogeneous: Facebook keeps one graph whose vertices include people, locations, events, checkins and comments.

### Property graphs (Neo4j, Titan, InfiniteGraph)

:::vs
@ Each vertex has
- a unique ID
- a set of outgoing edges
- a set of incoming edges
- properties (key–value pairs)
@ Each edge has
- a unique ID
- a tail vertex (where it starts)
- a head vertex (where it ends)
- a label for the relationship
- properties (key–value pairs)
:::

```sql A property graph in two relational tables
CREATE TABLE vertices (vertex_id integer PRIMARY KEY, properties json);
CREATE TABLE edges (
  edge_id integer PRIMARY KEY,
  tail_vertex integer REFERENCES vertices (vertex_id),
  head_vertex integer REFERENCES vertices (vertex_id),
  label text, properties json);
CREATE INDEX edges_tails ON edges (tail_vertex);
CREATE INDEX edges_heads ON edges (head_vertex);
```

- **No restrictions**: any vertex can have an edge to any other; no schema limits which kinds of things connect.
- **Efficient traversal**: from any vertex you can quickly find its incoming and outgoing edges.
- **Labels**: several kinds of relationship can live in one graph.

> **Key idea:** That flexibility makes graphs great for **evolvability**: country-specific region structures (France has départements and régions, the US has counties and states), or a person who has lived in several countries, fit without schema changes.

### Three graph query languages

:::tabs
@ Cypher (Neo4j)
```cypher Insert data, then find people who emigrated from the US to Europe
CREATE
  (NAmerica:Location {name:'North America', type:'continent'}),
  (USA:Location      {name:'United States', type:'country'  }),
  (Idaho:Location    {name:'Idaho',         type:'state'    }),
  (Lucy:Person       {name:'Lucy' }),
  (Idaho) -[:WITHIN]->  (USA)  -[:WITHIN]-> (NAmerica),
  (Lucy)  -[:BORN_IN]-> (Idaho)

MATCH
  (person) -[:BORN_IN]->  () -[:WITHIN*0..]-> (us:Location {name:'United States'}),
  (person) -[:LIVES_IN]-> () -[:WITHIN*0..]-> (eu:Location {name:'Europe'})
RETURN person.name
```

`-[:WITHIN*0..]->` means "follow WITHIN edges zero or more times": a variable-length traversal, like `*` in a regex.

> **Pitfall:** In SQL the number of joins isn't known in advance. Since SQL:1999 you need a **recursive common table expression** (`WITH RECURSIVE`), which turns this 4-line Cypher query into about 29 lines of SQL.
@ Triple-stores and SPARQL
A **triple-store** holds everything as **(subject, predicate, object)** statements, e.g. _(Jim, likes, bananas)_.

- If the object is a primitive value, the predicate is a **property**: _(lucy, age, 33)_.
- If the object is another vertex, the predicate is an **edge**: _(lucy, marriedTo, alain)_.

Data is written in Turtle/N3 and queried with **SPARQL**, which predates Cypher and inspired its pattern matching:

```sparql
SELECT ?personName WHERE {
  ?person :name ?personName.
  ?person :bornIn  / :within* / :name "United States".
  ?person :livesIn / :within* / :name "Europe".
}
```

Triple-stores are associated with the **semantic web** and RDF (Resource Description Framework). The vision hasn't materialised, but the tools make a good internal data model for applications.
@ Datalog
**Datalog** (1980s, a subset of Prolog) is the foundation later languages build on. Datomic and Cascalog (on Hadoop) use it.

- Data is written as `predicate(subject, object)`.
- Queries define **rules** that derive new predicates. Rules can call other rules and themselves (recursion), so complex queries are built a small piece at a time.

```prolog
within_recursive(Location, Name) :- name(Location, Name).          /* Rule 1 */
within_recursive(Location, Name) :- within(Location, Via),          /* Rule 2 */
                                    within_recursive(Via, Name).
migrated(Name, BornIn, LivingIn) :- name(Person, Name),             /* Rule 3 */
                                    born_in(Person, BornLoc), within_recursive(BornLoc, BornIn),
                                    lives_in(Person, LivingLoc), within_recursive(LivingLoc, LivingIn).
?- migrated(Who, 'United States', 'Europe').   /* Who = 'Lucy'. */
```
:::

## Graph vs network model

Graph databases aren't CODASYL in disguise:

| | CODASYL (network) | Graph database |
|---|---|---|
| What can link to what | a schema says which record types nest inside which | any vertex can link to any other |
| Reaching a record | only by following an access path | directly by ID, or via an index |
| Ordering of children | ordered sets, kept in order on insert | edges are unordered |
| Queries | imperative | declarative (Cypher, SPARQL) or imperative |

## Recall

:::flash
Q: When does the document model make code simpler?
A: When data is a self-contained tree of one-to-many relationships that's usually loaded all at once.
Q: What is the impedance mismatch?
A: The awkward translation layer between application objects and relational tables. ORMs reduce it but can't remove it.
Q: Why store region_id instead of "Greater Seattle Area"?
A: Consistency, no ambiguity, one place to update, localisation, better search. That's normalisation.
Q: What does "schemaless" really mean?
A: Schema-on-read: structure is implicit and interpreted by the reading code (like dynamic typing).
Q: Which database copies the whole table on ALTER TABLE?
A: MySQL. Most others add a column in milliseconds.
Q: Why must map and reduce be pure functions?
A: So the database can run them anywhere, in any order, and rerun them on failure.
Q: What does -[:WITHIN*0..]-> mean in Cypher?
A: Follow WITHIN edges zero or more times: a variable-length path. SQL needs WITH RECURSIVE for this.
Q: What is a triple?
A: (subject, predicate, object). The object is either a value (a property) or another vertex (an edge).
:::

:::quiz
Q: A product catalogue where each product is a self-contained tree of attributes, read and written as a whole, with almost no cross-references. Which model fits best?
- [x] Document
- Graph
- Network (CODASYL)
- Triple-store
> Self-contained documents with one-to-many structure loaded all at once are the sweet spot of the document model: locality, schema flexibility, no joins needed.
:::

:::quiz
Q: What does "schemaless" really mean for a document database?
- There is no structure at all
- [x] Schema-on-read: the structure is implicit and interpreted by the code that reads the data
- The database enforces a schema on every write
- Documents can't be queried by field
> The reading code still assumes a structure. The difference from relational databases is when the structure is checked: on read rather than on write.
:::

:::quiz
Q: Why are declarative query languages easier to parallelise than imperative code?
- They are compiled to machine code
- [x] They specify only the pattern of the result, not the algorithm or order of execution
- They don't support joins
- They always run in memory
> Imperative code fixes an order of operations; a declarative query leaves the database free to split the work across cores and machines.
:::
</script>
<script type="text/x-jc" id="m-storage" data-part="Part I · Foundations" data-title="Storage engines: logs, LSM-trees and B-trees" data-short="Storage engines &amp; indexes" data-lede="Chapter 3, first half. How a database stores data on disk and finds it again: append-only logs, hash indexes, SSTables and LSM-trees, B-trees, how the two families compare, secondary and multi-dimensional indexes, and in-memory databases.">
:::tldr
- Appending to a **log** is the fastest possible write. **Indexes** make reads fast but make every write do extra work.
- **Hash index** (Bitcask): an in-memory map from key to file offset. Very fast, but every key must fit in RAM and range queries are poor.
- **LSM-tree**: buffer writes in a sorted in-memory **memtable**, flush to immutable sorted **SSTables**, compact them in the background. Excellent write throughput.
- **B-tree**: fixed-size pages updated in place, with a write-ahead log for crash safety. Predictable reads, and the standard in relational databases.
- Rule of thumb: LSM for writes, B-tree for reads. Always benchmark your own workload.
- In-memory databases are fast mainly because they skip **encoding data for disk**, not because they skip disk reads.
:::

## The world's simplest database

```bash Two Bash functions that make a key-value store
#!/bin/bash
db_set () { echo "$1,$2" >> database; }
db_get () { grep "^$1," database | sed -e "s/^$1,//" | tail -n 1; }
```

:::vs
@ db_set: brilliant
Appends one line to the end of a file. Appending is about as fast as a write can be. Many real databases are built on exactly this: a **log**, an append-only sequence of records.
@ db_get: terrible
Scans the entire file on every lookup: O(n). To read efficiently we need an **index**, an extra structure derived from the primary data.
:::

> **Key idea:** Every index speeds up reads and slows down writes, because the index must be updated on every write. That's why databases don't index everything by default: you choose indexes based on your application's query patterns.

## Hash indexes

Keep an **in-memory hash map** from every key to the **byte offset** of its latest value in the data file. This is essentially **Bitcask** (Riak's default storage engine): very fast reads and writes, as long as all keys fit in RAM. It's ideal when each key is updated often, e.g. a counter of how many times each video has been played.

:::viz logkv

### Not running out of disk

An append-only log grows forever. The fix:

:::steps
@ Split into segments
Close the current segment file at a certain size and start writing a new one.
@ Compact
Throw away duplicate keys in each segment, keeping only the most recent value.
@ Merge in the background
Merge compacted segments into new files on a background thread. Reads and writes continue on the old segments until the swap.
@ Look up newest first
Each segment has its own hash map. Check the newest segment's map, then the next older one, and so on. Merging keeps the number of segments small.
:::

### What a real implementation needs

- **File format**: binary and length-prefixed, not CSV.
- **Deleting records**: append a special deletion record, a **tombstone**. Merging discards all earlier values for that key.
- **Crash recovery**: in-memory hash maps are lost on restart. Bitcask stores a snapshot of each segment's map on disk so it can reload quickly.
- **Partially written records**: checksums detect and skip corrupted parts of the log.
- **Concurrency control**: a single writer thread. Segments are immutable, so many threads can read them at once.

:::vs
@ Why append-only wins
- Sequential writes are much faster than random writes (on spinning disks and on SSDs).
- Immutable segments make concurrency and crash recovery simple: no half-old, half-new values.
- Merging old segments avoids fragmentation.
@ Where hash indexes fall short
- The hash table **must fit in memory**. On-disk hash maps need lots of random I/O, are hard to grow, and handle collisions badly.
- **Range queries** are inefficient: you can't scan `kitty00000`–`kitty99999` without looking up each key.
:::

## SSTables and LSM-trees

Change one rule for segment files: keys must be **sorted**, and each key appears only once per merged segment. That's a **Sorted String Table (SSTable)**, and it unlocks three big wins:

:::cards 3
@ Cheap merges
Like the merge step of mergesort: read the files side by side and copy out the lowest key. If a key is in several segments, keep the newest. Works even when files are bigger than RAM.
@ Sparse index
To find `handiwork`, knowing the offsets of `handbag` and `handsome` is enough: it must be between them. One key every few kilobytes is all you need in memory.
@ Compression
Records between two index entries can be grouped into a block and compressed, saving disk space and I/O bandwidth.
:::

But writes arrive in random order. How do we keep them sorted? Keeping a sorted structure on disk is possible (B-trees), but it's much easier in memory. Write some keys and watch:

:::viz lsm

:::steps
@ Write to the memtable
Every write goes into an in-memory balanced tree (red-black or AVL), the **memtable**, which keeps keys sorted.
@ Flush when full
When the memtable passes a few megabytes, write it to disk as a new SSTable. It's already sorted, so this is a fast sequential write. New writes go to a fresh memtable.
@ Read newest to oldest
Check the memtable, then the newest SSTable, then the next older one, and so on.
@ Compact in the background
Periodically merge SSTables and drop overwritten or deleted values.
@ Protect against crashes
The memtable is lost if the process dies, so every write is also appended to a **write-ahead log** on disk. That log is discarded once its memtable has been flushed.
:::

This algorithm is the **Log-Structured Merge-Tree (LSM-tree)** (O'Neil et al., 1996), building on log-structured filesystems.

:::deep Who uses LSM-trees
- **LevelDB** and **RocksDB**: embeddable key-value libraries, also used inside Riak and as MySQL storage engines.
- **Cassandra** and **HBase**: inspired by Google's **Bigtable** paper, which introduced the terms _SSTable_ and _memtable_.
- **Lucene** (the engine inside Elasticsearch and Solr): its term dictionary, mapping each word to the list of documents containing it, is stored in SSTable-like sorted files.
:::

### Performance optimisations

:::tabs
@ Bloom filters
Looking up a key that doesn't exist is slow: you check the memtable and then every segment back to the oldest. A **Bloom filter** is a memory-efficient structure that can say a key **definitely isn't** in a segment, skipping many pointless disk reads.
@ Compaction strategies
:::vs
@ Size-tiered
Newer, smaller SSTables are merged into older, larger ones. HBase, Cassandra.
@ Leveled
The key range is split into smaller SSTables and older data moves into separate "levels". Compaction is more incremental and uses less disk space. LevelDB, RocksDB, Cassandra.
:::
@ Why it's fast
- Data is sorted, so **range queries** are efficient.
- Disk writes are sequential, so LSM-trees sustain remarkably **high write throughput**.
:::

## B-trees

The most widely used index structure. Introduced in 1970, ubiquitous within ten years, and still the standard index in almost every relational database and many non-relational ones. Like SSTables, B-trees keep keys **sorted**, but the design philosophy is completely different.

:::vs
@ Log-structured (LSM)
Variable-size segments, written **once** sequentially, never modified.
@ Page-oriented (B-tree)
Fixed-size **pages** (traditionally 4 KB), read and written one at a time and **overwritten in place**. This matches the hardware: disks are also arranged in fixed-size blocks.
:::

- **Pages point to pages**: each page has an address, so pages refer to each other like pointers, but on disk.
- **Root page**: holds a few keys and references to child pages. Each child covers a continuous key range; the keys in between mark the boundaries.
- **Leaf pages**: hold individual keys, with values inline or references to where values are stored.
- **Branching factor**: the number of child references per page, typically several hundred.

Insert keys and watch pages fill and split:

:::viz btree

:::cards 2
@ Update a value
Find the leaf page containing the key, change the value, and write the page back to disk. All references stay valid.
@ Add a key
Find the page whose range covers the key and add it there. If the page is full, **split** it into two half-full pages and update the parent to reflect the new key ranges.
:::

> **Key idea:** Splits keep the tree **balanced**: n keys always means depth O(log n). Most databases fit in a B-tree **three or four levels deep**. A four-level tree of 4 KB pages with branching factor 500 can store up to **256 TB**.

### Making B-trees reliable

Overwriting pages in place is risky. A split writes two new halves **and** updates the parent; if the database crashes partway, the index is corrupted, for example with an **orphan** page that has no parent.

:::cards 2
@ Write-ahead log (WAL)
An append-only file, also called a redo log. Every modification is written here **before** it's applied to the tree pages. After a crash, the WAL restores the tree to a consistent state.
@ Latches
Threads modifying pages in place need careful concurrency control: lightweight locks called **latches** protect the tree. Log-structured engines have it easier: merging runs in the background and atomically swaps old segments for new ones.
:::

:::deep B-tree optimisations
- **Copy-on-write** instead of overwrite + WAL (LMDB): write the modified page somewhere new and create new versions of its parents. This also helps concurrency control (snapshot isolation, module 8).
- **Abbreviated keys** in interior pages: they only need enough of the key to act as a boundary, so more keys fit per page (higher branching factor, fewer levels). Sometimes called a **B+ tree**.
- **Sequential leaf layout**: try to place leaf pages in key order on disk. It's hard to maintain as the tree grows, which is easier for LSM-trees because merging rewrites large segments anyway.
- **Sibling pointers** between leaf pages, so you can scan keys in order without going back up to parent pages.
- **Fractal trees** borrow log-structured ideas to reduce disk seeks.
:::

## Comparing B-trees and LSM-trees

> **Rule of thumb:** **LSM-trees are usually faster for writes; B-trees are usually faster for reads** (an LSM read may have to check several structures and SSTables at different stages of compaction). Benchmarks are often inconclusive and workload-sensitive, so test with your own workload.

:::tabs
@ Writes
:::vs
@ LSM-tree
Sequential appends, flushes and merges: high write throughput, especially on spinning disks.
@ B-tree
Random page overwrites **plus** the WAL: every write hits disk at least twice.
:::
@ Write amplification
One database write turning into several disk writes over the data's lifetime.

:::vs
@ LSM-tree
Comes from repeatedly compacting and merging SSTables.
@ B-tree
Comes from the WAL, plus rewriting a whole page even when only a few bytes changed (and torn-page protection).
:::

> **Note:** Write amplification matters especially on **SSDs**, which can only overwrite blocks a limited number of times before wearing out. In write-heavy applications, the disk's write bandwidth can become the bottleneck.
@ Storage
:::vs
@ LSM-tree
Compresses better and has less fragmentation: no partially empty pages.
@ B-tree
Some space sits unused after page splits (fragmentation).
:::
@ Read latency
:::vs
@ LSM-tree
May check the memtable plus several SSTables. Background compaction can interfere with ongoing reads and writes, causing high **tail latencies**.
@ B-tree
More predictable: O(log n) page reads.
:::
@ Transactions
:::vs
@ LSM-tree
The same key may exist in several segments at once.
@ B-tree
Each key exists in exactly **one** place, so range locks can attach directly to the tree. Attractive for strong transactional semantics.
:::
@ Operational risk
:::vs
@ LSM-tree
If compaction can't keep up with incoming writes, unmerged segments pile up until the disk is full. **Monitor it.**
@ B-tree
Mature and well understood.
:::
:::

## Other indexing structures

:::tabs
@ Secondary indexes
Crucial for efficient joins. Created with `CREATE INDEX`. The main difference from a primary key index: keys are **not unique**. Two fixes:

- make each index value a **list of matching row IDs** (like a postings list in full-text search); or
- make each key unique by **appending a row ID**.

Both B-trees and log-structured indexes can serve as secondary indexes.
@ Where the row lives
- **Heap file**: the index stores a reference to the row, which lives in an unordered heap file. No duplication when there are several secondary indexes, and updates are cheap if the new value isn't larger.
- **Clustered index**: the row itself is stored inside the index. MySQL InnoDB's primary key works this way; SQL Server allows one clustered index per table.
- **Covering index** (index with included columns): stores _some_ columns in the index, so certain queries are answered from the index alone.

> **Pitfall:** Duplicating data in indexes costs storage and write overhead, and transactional guarantees must account for the extra copies.
@ Multi-column
- **Concatenated index**: several fields combined into one key by appending columns, like a phone book sorted by (last name, first name). Useless for finding people by first name alone.
- **Multi-dimensional index**: query several columns at once. Essential for geospatial data:

```sql Restaurants inside a map rectangle
SELECT * FROM restaurants
WHERE latitude  > 51.4946 AND latitude  < 51.5079
  AND longitude > -0.1162 AND longitude < -0.1004;
```

A standard B-tree can't answer this efficiently. Options: squash 2D into one number with a **space-filling curve**, or use **R-trees** (PostGIS uses PostgreSQL's GiST facility). Also handy for (red, green, blue) colour search or (date, temperature) weather queries.
@ Fuzzy search
Find similar keys: misspellings, synonyms, grammatical variants. Lucene keeps an in-memory **finite-state automaton** over the characters of its keys (similar to a trie), which can be turned into a **Levenshtein automaton** to find words within a given edit distance.
:::

## Keeping everything in memory

Disks are durable and cheaper per gigabyte than RAM. But RAM keeps getting cheaper, so keeping whole datasets in memory, possibly spread across machines, is now feasible.

:::cards 3
@ Cache only
**Memcached**: losing data on restart is acceptable.
@ Durable in-memory
Write a change log to disk, take periodic snapshots, or replicate. **VoltDB, MemSQL, Oracle TimesTen** (relational), **RAMCloud** (key-value).
@ Weakly durable
**Redis** and **Couchbase**: asynchronous disk writes.
:::

> **Key idea:** Counter-intuitively, in-memory databases aren't fast mainly because they avoid reading disk: the OS caches recently used blocks in memory anyway. They're fast because they skip **encoding in-memory data structures into an on-disk format**. They also enable data models that are hard to build on disk indexes, such as Redis's priority queues and sets.

> **Note:** **Anti-caching** evicts least-recently-used data to disk and loads it back when accessed, allowing datasets larger than memory.

## Recall

:::flash
Q: Why do databases not index every column?
A: Every index speeds up reads but slows down writes, because it must be updated on every write.
Q: What does Bitcask keep in memory?
A: A hash map from every key to the byte offset of its latest value on disk.
Q: Two limits of hash indexes?
A: All keys must fit in RAM, and range queries are inefficient.
Q: What is a tombstone?
A: A special deletion record. Compaction discards all earlier values for that key.
Q: What makes an SSTable an SSTable?
A: Keys sorted within each segment, and each key appearing once per merged segment.
Q: Why does an LSM-tree need a WAL?
A: The memtable lives in memory; the write-ahead log lets it be rebuilt after a crash.
Q: What do Bloom filters do in an LSM-tree?
A: Say a key is definitely not in a segment, avoiding disk reads for missing keys.
Q: How deep is a typical B-tree?
A: Three or four levels. Four levels of 4 KB pages with branching factor 500 hold up to 256 TB.
Q: Why does a B-tree write hit disk at least twice?
A: Once to the write-ahead log and once to the page itself.
Q: Clustered vs covering index?
A: Clustered stores the whole row in the index; covering stores some columns so certain queries need only the index.
Q: Why are in-memory databases fast?
A: They avoid encoding data structures into a disk format, not just disk reads.
:::

:::quiz
Q: Why can an SSTable-based engine use a sparse in-memory index instead of indexing every key?
- Bloom filters store every key
- [x] Keys in each segment are sorted, so knowing a few offsets bounds where any key can be
- Values are always the same size
- The memtable holds all keys
> With sorted keys, if you know the offsets of `handbag` and `handsome`, `handiwork` must lie between them: scan that small range.
:::

:::quiz
Q: Which operation causes a B-tree to grow one level deeper?
- Updating a value in place
- Inserting into a leaf with free space
- [x] A split that propagates all the way up and splits the root
- Compaction
> B-trees grow at the root: when the root overflows, it splits and a new root is created above the two halves, so every leaf stays at the same depth.
:::

:::quiz
Q: A workload is extremely write-heavy (sensor ingestion). Which storage engine family is typically the better starting point, and why?
- B-tree, because it updates pages in place
- [x] LSM-tree, because it turns random writes into sequential appends and compresses well
- Hash index on disk, because hashing is O(1)
- Either: write patterns don't affect storage engines
> LSM-trees sustain higher write throughput and lower write amplification for many workloads, at the cost of less predictable read latency and compaction overhead.
:::
</script>
<script type="text/x-jc" id="m-analytics" data-part="Part I · Foundations" data-title="OLTP vs analytics: warehouses and column stores" data-short="Analytics &amp; column storage" data-lede="Chapter 3, second half. Transaction processing vs analytic processing, data warehouses and ETL, star and snowflake schemas, column-oriented storage, compression, sort orders, and materialised views and data cubes.">
:::tldr
- **OLTP** serves users: small key-based reads and writes, latency-sensitive, bottlenecked on disk **seeks**.
- **OLAP** serves analysts: scans and aggregates over huge numbers of rows, bottlenecked on disk **bandwidth**.
- Analytics runs in a separate **data warehouse**, loaded by **ETL** and usually modelled as a **star schema** (a big fact table plus dimension tables).
- **Column stores** read only the columns a query needs, compress them heavily (bitmaps, run-length encoding) and process them with vectorised loops.
- Sorting helps compression most on the first sort key. Writes go through an LSM-style in-memory buffer.
- **Materialised views and data cubes** precompute common aggregates: fast, but less flexible than raw data.
:::

## Two different access patterns

Early databases recorded commercial **transactions**: a sale, an order, a salary payment. The pattern stuck even as databases spread to blog comments, game actions and contacts. But databases are increasingly used for **analytics** too, and that looks completely different:

:::vs
@ OLTP: online transaction processing
Look up a few records by key; insert or update records from user input. Example: "show this customer's orders".
@ OLAP: online analytic processing
Scan huge numbers of records, read a few columns of each, compute aggregates (count, sum, average). Example: "total revenue per store last month".
:::

| Property | OLTP | OLAP |
|---|---|---|
| Main read pattern | small number of records per query, fetched by key | aggregate over a large number of records |
| Main write pattern | random-access, low-latency writes from user input | bulk import (ETL) or event stream |
| Primarily used by | end users/customers, via a web application | internal analysts, for decision support |
| What data represents | latest state of data (current point in time) | history of events that happened over time |
| Dataset size | gigabytes to terabytes | terabytes to petabytes |
| Bottleneck | disk **seek** time (and index lookups) | disk **bandwidth** (bytes scanned) |

## Data warehousing

A big company may run dozens of OLTP systems: the website, point of sale, warehouse inventory, delivery route planning, HR… Each is business-critical and must be fast and highly available, so DBAs are reluctant to let analysts run heavy ad-hoc queries against them.

> **Key idea:** A **data warehouse** is a separate database that analysts can query to their heart's content without hurting OLTP. It holds a read-only copy of data from all the OLTP systems.

:::steps
@ Extract
Pull data out of each OLTP system, as a periodic dump or a continuous stream of updates.
@ Transform
Reshape it into an analysis-friendly schema and clean it up.
@ Load
Load it into the warehouse. Together: **Extract–Transform–Load (ETL)**.
:::

The warehouse is usually relational, because SQL suits analytic queries, but the internals are tuned for analytics, not OLTP.

:::deep Warehouse products
- **Commercial**: Teradata, Vertica, SAP HANA, ParAccel (the basis of Amazon Redshift).
- **Open-source SQL-on-Hadoop**: Apache Hive, Spark SQL, Cloudera Impala, Facebook Presto, Apache Tajo, Apache Drill. Some are based on ideas from Google's **Dremel**.
:::

## Stars and snowflakes: schemas for analytics

Most data warehouses use a **star schema** (also called dimensional modelling):

:::html
<figure class="fig"><svg viewBox="0 0 680 270" role="img" aria-label="Star schema: a central fact_sales table with foreign keys to dim_date, dim_product, dim_store, dim_customer and dim_promotion.">
<rect class="s-cur" x="250" y="95" width="180" height="90" rx="12"/><text class="s-tb" x="340" y="120" text-anchor="middle">fact_sales</text><text class="s-ts" x="340" y="140" text-anchor="middle">date_key · product_sk · store_sk</text><text class="s-ts" x="340" y="156" text-anchor="middle">customer_sk · promotion_sk</text><text class="s-ts" x="340" y="172" text-anchor="middle">quantity · net_price · discount</text>
<rect class="s-acc" x="20" y="20" width="150" height="50" rx="10"/><text class="s-t" x="95" y="42" text-anchor="middle">dim_date</text><text class="s-ts" x="95" y="60" text-anchor="middle">year, month, weekday, holiday</text>
<rect class="s-acc" x="510" y="20" width="150" height="50" rx="10"/><text class="s-t" x="585" y="42" text-anchor="middle">dim_product</text><text class="s-ts" x="585" y="60" text-anchor="middle">sku, brand, category</text>
<rect class="s-acc" x="20" y="210" width="150" height="50" rx="10"/><text class="s-t" x="95" y="232" text-anchor="middle">dim_store</text><text class="s-ts" x="95" y="250" text-anchor="middle">city, state, sq_ft</text>
<rect class="s-acc" x="510" y="210" width="150" height="50" rx="10"/><text class="s-t" x="585" y="232" text-anchor="middle">dim_customer</text><text class="s-ts" x="585" y="250" text-anchor="middle">name, birth date</text>
<rect class="s-acc" x="265" y="220" width="150" height="40" rx="10"/><text class="s-t" x="340" y="245" text-anchor="middle">dim_promotion</text>
<path class="s-line" d="M250,110 L170,55"/><path class="s-line" d="M430,110 L510,55"/><path class="s-line" d="M250,170 L170,230"/><path class="s-line" d="M430,170 L510,230"/><path class="s-line" d="M340,185 V218"/>
</svg><figcaption>Each row of the fact table is one event (a sale); its foreign keys point to dimension tables describing who, what, where, when, how and why.</figcaption></figure>
:::

- **Fact table**: at the centre. Each row is one event at a particular time (a purchase, a page view, a click). Facts are kept as individual events for maximum flexibility, so fact tables get **huge**: tens of petabytes at Apple, Walmart or eBay. Some columns are attributes (price, cost); the rest are foreign keys to dimensions.
- **Dimension tables**: the who, what, where, when, how and why of each event. Even date and time are dimensions, so you can encode extra facts such as public holidays.
- **Snowflake schema**: dimensions are further normalised into sub-dimensions (brands and categories in their own tables). More normalised, but star schemas are often preferred because they're simpler for analysts.
- **Very wide tables**: fact tables often have 100+ columns, sometimes several hundred.

## Column-oriented storage

A typical analytic query touches just **4 or 5 of those 100+ columns** (`SELECT *` is rare in analytics). Row-oriented storage keeps all of a row's values together, so the engine has to load every column of every row from disk, parse them and throw most away. Compare the two layouts:

:::viz colstore

:::vs
@ Row-oriented (OLTP)
All values of one **row** are stored next to each other. Great for fetching a whole record by key.
@ Column-oriented (OLAP)
All values of one **column** are stored together, each column in its own file. A query reads and parses only the columns it uses.
:::

> **Key idea:** Every column file stores rows **in the same order**. To rebuild row 23, take the 23rd entry from each column file.

The Parquet format also supports a nested document data model, based on Google's Dremel.

### Column compression

Column values are very repetitive: a retailer has billions of sales but only ~100,000 distinct products. That makes columns compress extremely well.

:::steps
@ Bitmap encoding
For a column with n distinct values, keep n bitmaps, one bit per row: 1 if the row has that value. With n small (say ~200 countries), that's one bit per row per value.
@ Run-length encoding
With larger n, most bitmaps are mostly zeros (sparse). Store them as run lengths ("9 zeros, 1 one, 30 zeros…") to shrink them dramatically.
@ Query with bitwise operations
`WHERE product_sk IN (30, 68, 69)`: load three bitmaps and **OR** them. `WHERE product_sk = 31 AND store_sk = 3`: **AND** two bitmaps. This works because every column holds rows in the same order.
:::

> **Pitfall:** Don't confuse column stores with **column families** in Cassandra and HBase (inherited from Bigtable). Column families store all the columns of a row together, alongside a row key, and don't use column compression. They're still mostly row-oriented.

:::deep Memory bandwidth and vectorised processing
For queries scanning millions of rows, the bottlenecks go beyond disk: moving data from memory into the CPU cache, avoiding branch mispredictions and pipeline bubbles, and using SIMD instructions.

- Compressed columns let **more rows fit in the L1 cache**.
- The engine can loop over chunks of compressed column data in a tight loop with no function calls: **vectorised processing**.
- Operators such as bitwise AND/OR can work **directly on compressed data**.
:::

### Sort order in column storage

You can sort the rows, but always **whole rows**, never each column independently (otherwise you couldn't reassemble rows). An administrator picks the sort key from common queries: e.g. `date_key` first (queries usually target date ranges like "last month"), then `product_sk` (so sales of the same product on the same day sit together).

:::cards 2
@ Sorting boosts compression
The first sort column ends up with long runs of repeated values, so run-length encoding can shrink it to a few kilobytes even with billions of rows. Compression is strongest on the **first** sort key and weaker on later ones.
@ Several sort orders
Data is replicated to several machines anyway, so store each copy **sorted differently** and use whichever best fits each query. An idea from C-Store, adopted by Vertica. Like multiple secondary indexes, except each copy holds the full data, not pointers.
:::

### Writing to column-oriented storage

Compressed, sorted columns make reads fast but writes hard. You can't update in place like a B-tree, and inserting a row in the middle of a sorted table would mean rewriting every column file.

> **Key idea:** Use the **LSM-tree** approach. Writes go to a sorted in-memory store; once enough accumulate, they're merged with the on-disk column files and written to new files in bulk (Vertica does this). Queries read both the on-disk columns and the recent in-memory writes; the query optimiser hides that from users.

## Aggregation: data cubes and materialised views

Warehouse queries keep computing the same aggregates (COUNT, SUM, AVG, MIN, MAX). Why not cache them?

:::vs
@ Materialised view
Defined by a query, like a normal view, but the **results are actually written to disk**. Must be updated whenever the underlying data changes, which makes writes more expensive, so it's more common in read-heavy warehouses than in OLTP.
@ Data cube (OLAP cube)
A special materialised view: a **grid of aggregates** grouped by several dimensions. With date × product, each cell holds the sales total for that pair; sum along a row or column to get totals per date or per product without touching raw data.
:::

:::vs
@ Advantage
Some queries become extremely fast, because the answer is effectively precomputed.
@ Disadvantage
No flexibility to query raw data, e.g. "what share of sales were items over $100?" if price isn't a dimension.
:::

> **Tip:** Most warehouses keep as much **raw data** as possible, and use aggregates like cubes only as a performance boost for specific queries.

## Recall

:::flash
Q: OLTP bottleneck vs OLAP bottleneck?
A: OLTP is limited by disk seeks (index lookups); OLAP by disk bandwidth (bytes scanned).
Q: What does ETL stand for?
A: Extract–Transform–Load: copy data from OLTP systems, reshape and clean it, load it into the warehouse.
Q: What is a fact table?
A: The central table in a star schema: one row per event, with attributes and foreign keys to dimension tables.
Q: Star vs snowflake schema?
A: A snowflake further normalises dimensions into sub-dimensions; a star is simpler for analysts.
Q: How do you reassemble a row in a column store?
A: Take the k-th entry from each column file; every column stores rows in the same order.
Q: How does bitmap encoding answer IN (30, 68, 69)?
A: Load the three bitmaps and OR them together.
Q: Are Cassandra column families column-oriented storage?
A: No. They keep all of a row's columns together and don't use column compression.
Q: How do column stores handle writes?
A: An LSM-style sorted in-memory buffer, periodically merged into new column files in bulk.
Q: Downside of a data cube?
A: You lose the flexibility to ask questions about attributes that aren't dimensions.
:::

:::quiz
Q: An analytic query reads 3 columns out of 120 across a billion rows. Roughly how much less data does a column store need to read than a row store (before compression)?
- About the same
- 3×
- [x] About 40×
- 1000×
> It reads 3/120 of the bytes, roughly 40× less, and compression typically improves that further.
:::

:::quiz
Q: Why is the first column of the sort key the one that compresses best?
- It is stored in memory
- [x] Sorting by it creates long runs of identical values, which run-length encoding shrinks dramatically
- It has the most distinct values
- Only the first column is compressed
> Within each run of the first key, the second key is sorted too but with shorter runs; later columns look increasingly random.
:::

:::quiz
Q: How do column stores like Vertica handle frequent inserts despite compressed, sorted column files?
- They update compressed files in place
- They disable compression
- [x] They buffer writes in a sorted in-memory store and periodically merge them into new column files in bulk, like an LSM-tree
- They reject inserts until the next ETL batch
> Updates in place are impractical for compressed sorted columns. Queries read both the on-disk columns and the in-memory recent writes.
:::
</script>
<script type="text/x-jc" id="m-encoding" data-part="Part I · Foundations" data-title="Encoding and evolution" data-short="Encoding &amp; evolution" data-lede="Chapter 4. Turning in-memory data into bytes and back: language-specific formats, JSON/XML, Thrift, Protocol Buffers and Avro; forward and backward compatibility during rolling upgrades; and data flow through databases, services (REST and RPC) and message brokers.">
:::tldr
- Old and new code (and old and new data) **coexist** during rolling upgrades, so you need **backward** _and_ **forward** compatibility.
- Avoid language-specific serialisation (Java `Serializable`, Python `pickle`): it's tied to one language, insecure and poorly versioned.
- JSON/XML/CSV are readable and universal, but vague about numbers, lack binary strings and have optional schemas.
- **Thrift/Protobuf** identify fields by **tag numbers**; **Avro** resolves the **writer's schema** against the **reader's schema** by field name.
- Data flows through **databases** (data outlives code), **services** (REST/RPC: a network call is _not_ a local call) and **message brokers** (async, decoupled).
:::

## Why encoding matters for evolvability

Applications change all the time, but you can't swap every copy of the code at once:

:::vs
@ Server-side apps
**Rolling upgrades**: deploy the new version to a few nodes at a time, check it's healthy, then continue.
@ Client-side apps
You're at the mercy of users, who may not install the update for a long time.
:::

So **old and new code, and old and new data formats, run side by side**. You need compatibility in both directions:

:::vs
@ Backward compatibility
**Newer code reads data written by older code.** Usually easy: you know the old format.
@ Forward compatibility
**Older code reads data written by newer code.** Trickier: old code must ignore additions it doesn't understand.
:::

Programs hold data in two representations, and need to translate between them:

:::cards 2
@ In memory
Objects, structs, lists, hash tables, trees, linked by pointers and optimised for fast CPU access.
@ As bytes
A self-contained byte sequence that can be written to a file or sent over the network. Pointers mean nothing here.
:::

Memory → bytes is **encoding** (also called serialisation or marshalling). Bytes → memory is **decoding** (parsing, deserialisation, unmarshalling).

## The formats

:::tabs
@ Language-specific
Java's `java.io.Serializable`, Ruby's `Marshal`, Python's `pickle`. Convenient, but:

- **One language only**: reading the data from another language is very hard.
- **Security risk**: decoding can instantiate arbitrary classes, which can lead to remote code execution.
- **Versioning** is often an afterthought.
- **Efficiency** is often poor: Java's built-in serialisation is notorious for slow performance and bloated output.

> **Pitfall:** Generally a bad idea for anything but very short-lived data.
@ JSON, XML, CSV
Widely supported and human-readable, but with subtle problems:

- **Numbers are ambiguous.** XML and CSV can't tell a number from a string of digits (without a schema). JSON doesn't distinguish integers from floats and doesn't specify precision. Integers above 2⁵³ don't fit exactly in an IEEE 754 double, so **Twitter's API returns tweet IDs twice**: as a JSON number and as a decimal string, because JavaScript would mangle the number.
- **No binary strings.** People Base64-encode binary data, which adds 33% to the size.
- **Optional schemas.** XML Schema and JSON Schema are powerful but complicated; many JSON tools skip them, so the meaning gets hard-coded in applications.
- **CSV** has no schema at all and vague escaping rules (what if a value contains a comma or a newline?).

Still, they're good enough for many purposes, especially as **data interchange formats between organisations**, where getting everyone to agree on anything is the hardest problem.

> **Note:** Binary JSON variants (MessagePack, BSON, BJSON, UBJSON, BISON, Smile) save a little space but still include every field name in every record.
@ Thrift and Protobuf
Apache Thrift (from Facebook) and Protocol Buffers (from Google) both need a **schema** written in an interface definition language (IDL). Code generators turn the schema into classes for many languages.

```text The same record in both IDLs
// Thrift IDL
struct Person {
  1: required string       userName,
  2: optional i64          favoriteNumber,
  3: optional list<string> interests
}

// Protocol Buffers
message Person {
  required string user_name       = 1;
  optional int64  favorite_number = 2;
  repeated string interests       = 3;
}
```

> **Key idea:** The encoded bytes contain **no field names**, only **field tags**: the numbers 1, 2, 3, which act as compact aliases for the fields.

- Thrift has two binary formats: **BinaryProtocol**, and **CompactProtocol**, which packs the field type and tag into one byte and uses variable-length integers.
- Protobuf's encoding is very similar to CompactProtocol.
@ Avro
Apache Avro began in 2009 as a Hadoop subproject because Thrift didn't fit Hadoop's needs. It also uses a schema, in two syntaxes: Avro IDL (for humans) and JSON (for machines).

```text Avro IDL
record Person {
  string               userName;
  union { null, long } favoriteNumber = null;
  array<string>        interests;
}
```

> **Key idea:** The encoding has **no tags and no field names**: just values concatenated together. Strings are a length prefix plus UTF-8 bytes; integers are variable-length. To parse it you walk the fields in schema order, so the reader must know **exactly** which schema the writer used.
:::

Compare how the same record is encoded:

:::viz encoding

## Schema evolution with field tags (Thrift/Protobuf)

:::cards 3
@ Adding a field
Give it a **new tag number**.
- **Forward**: old code skips tags it doesn't recognise (the type annotation says how many bytes to skip).
- **Backward**: new code reads old data fine, but the new field **can't be `required`**, so every field added after launch must be optional or have a default.
@ Removing a field
Only **optional** fields can be removed; a required field never can.

Never **reuse** the tag number: old data with that tag may still exist.
@ Changing a type
Possible but risky. int32 → int64: new code reads old data fine (missing bits become zero), but old code reading new data **truncates** the value.

Protobuf has `repeated` instead of lists, so an `optional` field can become `repeated`: old code then sees only the last element.
:::

## Avro: writer's schema vs reader's schema

:::vs
@ Writer's schema
The schema version the application used to **encode** the data.
@ Reader's schema
The schema version the decoding application **expects**.
:::

They don't have to match, only be **compatible**. The Avro library lines the two schemas up side by side and resolves the differences:

- **Fields match by name**, so their order doesn't matter.
- **A field only the writer has** is ignored by the reader.
- **A field only the reader has** is filled in with the reader's **default value**.

> **Rule of thumb:** In Avro you may only add or remove a field that **has a default value**. Type changes work if Avro can convert the type. **Renames** work via aliases in the reader's schema (backward compatible, not forward). There's no `optional`/`required`: to allow null, use a union like `union { null, long }` with default null.

Try evolving a schema and see who can still read what:

:::viz schemaevo

### How does the reader get the writer's schema?

:::cards 3
@ Big files of records
Hadoop-style files with millions of records: put the writer's schema **once at the start of the file** (Avro object container files).
@ Database records
Each record was written at a different time. Store a **schema version number** with each record and keep a registry of versions (e.g. Confluent's Schema Registry for Kafka).
@ Network connections
The two sides **negotiate** the schema version when the connection opens (Avro RPC).
:::

:::deep Why Avro suits generated schemas, and when codegen helps
**Dynamically generated schemas.** Dumping a relational database to a file? Generate an Avro schema from the relational one: each table becomes a record, each column a field. If the database schema changes, just generate a new Avro schema; fields are matched by name, so readers can still read old files. With Thrift or Protobuf, someone would have to assign tag numbers carefully by hand every time.

**Code generation** suits statically typed languages (Java, C++, C#): type checking and IDE autocompletion. In dynamically typed languages (JavaScript, Ruby, Python) there's little point. Avro's codegen is optional: object container files carry the writer's schema, so a generic library can open one and browse it like JSON. Handy with dynamic processing languages like Apache Pig.
:::

## The merits of schemas

Schema-based binary encodings (Protobuf, Thrift, Avro, and older ones like ASN.1) beat JSON in several ways:

:::cards 2
@ Compact
They omit field names from the encoded data.
@ Living documentation
The schema is required for decoding, so it's guaranteed to be up to date.
@ Safe evolution
Keep a database of schemas and check forward/backward compatibility **before** deploying.
@ Type safety
Code generation enables compile-time type checking.
:::

> **Key idea:** Schema evolution gives you the same flexibility as schemaless JSON databases (schema-on-read), with better guarantees and better tooling.

## Modes of data flow

Whenever you send data to a process that doesn't share your memory, you encode it as bytes. Who encodes and who decodes?

:::tabs
@ Through databases
The writing process encodes; the reading process decodes. It might be **the same process later**: like sending a message to your future self. So **backward** compatibility is essential. During a rolling upgrade, newer code may write a value that older code then reads, so **forward** compatibility is often needed too.

> **Pitfall:** Old code reads a record that has a new field, updates it and writes it back. The **new field can be lost**: the format may preserve unknown fields, but decoding into model objects and re-encoding often drops them. Watch for this at the application level.

> **Key idea:** **Data outlives code.** A deploy replaces code in minutes, but five-year-old data stays in its original encoding unless you rewrite it. Migrations are expensive, so databases avoid them: LinkedIn's Espresso uses Avro, and relational databases add a column with a null default without rewriting old rows.

**Archival storage** (backup snapshots, warehouse loads) is usually encoded with the latest schema, written once and immutable: a good fit for Avro object container files or columnar formats like Parquet.
@ Through services (REST and RPC)
The most common setup: **servers** expose an API over the network (a **service**); **clients** call it. Browsers (HTTP, URLs, HTML/CSS/JS, JSON), native apps, and servers calling other servers.

Splitting a large application into services by area of functionality is **service-oriented architecture (SOA)**, refined more recently as **microservices**. The goal: teams can **deploy and evolve services independently**. So old and new versions of servers and clients run together, and the encoding must stay compatible across API versions.

- **REST**: a design philosophy built on HTTP: simple formats, URLs for resources, HTTP features for caching, authentication and content-type negotiation. OpenAPI (Swagger) describes RESTful APIs.
- **SOAP**: an XML protocol meant to be independent of HTTP, with a sprawling set of WS-* standards, described with WSDL and heavily reliant on code generation and tooling. It has fallen out of favour in most smaller companies.
- **RPC**: since the 1970s (Enterprise JavaBeans, Java RMI, DCOM, CORBA). It tries to make a remote request look like a local function call: **location transparency**. That idea is fundamentally flawed (next tab).
@ Why RPC ≠ local call
| Local function call | Network request |
|---|---|
| predictable: succeeds or fails based on parameters you control | unpredictable: the request or response may be lost; the remote machine may be slow or down |
| returns a result, throws, or never returns (infinite loop) | may **time out with no result**: you can't tell whether it ran |
| retrying is no concern | retrying may run the action **twice** unless you add deduplication (**idempotence**) |
| takes about the same time each call | latency varies wildly (network congestion, overloaded service) |
| can pass pointers to objects in memory | every parameter must be encoded as bytes; painful for large objects |
| same language on both sides | client and server may use different languages: type translation issues (e.g. JavaScript numbers) |

Newer RPC frameworks are honest about being remote:
- **gRPC** uses Protobuf and supports **streams** of requests and responses.
- **Finagle** and **Rest.li** use **futures/promises** to wrap async calls that may fail, and to call several services in parallel.

:::vs
@ Custom binary RPC
Better performance than JSON over HTTP. Mostly used for requests **between services inside one organisation**.
@ REST
Easy to experiment and debug (curl, a browser) and backed by a huge ecosystem. Dominant for **public APIs**.
:::

**Evolving a service API**: assume servers update first and clients later, so you need backward compatibility on requests and forward compatibility on responses. The rules follow the encoding: Thrift/gRPC/Avro RPC per their schemas; SOAP via XML schemas; JSON REST APIs by adding optional request parameters and new response fields. Because you can't force clients to upgrade, services often keep **several API versions** running for a long time (version in the URL, in the HTTP `Accept` header, or stored per API key).
@ Through message brokers
**Message brokers** (message queues, message-oriented middleware) sit between RPC and databases. A **message** is delivered to another process with low latency, but via an intermediary that stores it temporarily.

- **Buffer**: absorbs load if the recipient is unavailable or overloaded, improving reliability.
- **Redelivery**: automatically redelivers messages to a process that crashed, so they aren't lost.
- **No addresses needed**: the sender doesn't need the recipient's IP and port (handy when cloud VMs come and go).
- **Fan-out**: one message can go to **several recipients**.
- **Decoupling**: the sender just publishes and doesn't care who consumes.

Communication is usually **one-way and asynchronous**: the sender doesn't wait for a reply. Products: RabbitMQ, ActiveMQ, HornetQ, NATS, Apache Kafka. Senders publish to a named **queue** or **topic**; the broker delivers to **consumers** or **subscribers**.

> **Tip:** Brokers don't enforce a data model (a message is just bytes plus metadata), so use a backward- and forward-compatible encoding. If a consumer republishes to another topic, make sure it **preserves unknown fields**.

**Distributed actor frameworks** (Akka, Orleans, Erlang OTP) use the **actor model**: each actor has local state and talks to others only via asynchronous messages. Scaled across nodes, the same message passing works whether the recipient is local or remote. Location transparency works better here than in RPC, because the actor model already assumes messages can be lost.

:::deep Rolling upgrades in actor frameworks
Message encodings must still be compatible during upgrades:
- **Akka** uses Java serialisation by default (no forward/backward compatibility), but you can plug in Protobuf.
- **Orleans** uses a custom format that doesn't support rolling upgrades without extra work.
- **Erlang OTP** makes record schema changes surprisingly hard.
:::
:::

## Recall

:::flash
Q: Backward vs forward compatibility?
A: Backward: new code reads old data. Forward: old code reads new data (it must ignore what it doesn't understand).
Q: Why avoid Java Serializable or Python pickle?
A: One language only, security risk (arbitrary class instantiation), weak versioning, poor efficiency.
Q: Why does Twitter send tweet IDs twice?
A: IDs exceed 2⁵³, which JavaScript's doubles can't represent exactly, so they also send a string.
Q: What identifies a field in Protobuf bytes?
A: A numeric field tag, not the field name.
Q: Rule for adding a Protobuf field?
A: New tag number, and it must be optional or have a default.
Q: How does Avro match fields between schemas?
A: By field name. Writer-only fields are ignored; reader-only fields get the reader's default.
Q: Three ways an Avro reader learns the writer's schema?
A: In the file header, via a schema version number and registry, or negotiated on connection.
Q: What does "data outlives code" mean?
A: Old records keep their old encoding for years unless rewritten, so new code must keep reading them.
Q: Name four ways a network call differs from a local call.
A: It can time out with an unknown outcome, retries may duplicate it, latency is unpredictable, and parameters must be encoded as bytes.
Q: Five benefits of a message broker?
A: Buffering, redelivery, no need to know addresses, fan-out to many consumers, and decoupling.
:::

:::quiz
Q: In Protocol Buffers, why must a newly added field be optional (or have a default)?
- Required fields take more space
- [x] New code reading old data would find the required field missing and fail
- Old code can't skip unknown required fields
- Field tags only work for optional fields
> Backward compatibility (new code reading old records) breaks if the new field is required, because old records don't contain it.
:::

:::quiz
Q: How does Avro decode data without field tags or names in the bytes?
- It guesses field boundaries from types
- [x] It uses the writer's schema to parse the bytes and resolves it against the reader's schema by field name
- It requires both sides to use identical code
- It stores field names in every record
> The bytes follow the writer's schema order. Schema resolution maps fields by name, ignores extra writer fields and fills missing ones from the reader's defaults.
:::

:::quiz
Q: What's the core problem with RPC frameworks that make remote calls look like local function calls?
- They are slower than REST
- [x] Network calls can time out with an unknown outcome, have variable latency and may execute twice on retry, which local calls never do
- They can't use binary encodings
- They don't support multiple languages
> Location transparency hides failure modes that the caller must handle: timeouts, retries, idempotence, encoding of parameters.
:::
