<script type="text/x-jc" id="m-replication" data-part="Part II · Distributed data" data-title="Replication" data-short="Replication" data-lede="Chapter 5. Keeping copies of the same data on multiple machines: single-leader replication (sync vs async, failover, replication logs), replication lag and its anomalies, multi-leader replication and conflict resolution, and leaderless (Dynamo-style) quorums.">
:::tldr
- Replication keeps copies of data on several machines for **availability**, **lower latency** and **read scaling**.
- **Single-leader**: all writes go to one leader, which streams changes to followers. Simple, but failover is tricky (lost writes, split brain).
- **Async replication lag** causes three anomalies, each with a fix: read-your-writes, monotonic reads, consistent prefix reads.
- **Multi-leader**: writes accepted in several places (datacenters, offline devices), so **write conflicts** must be resolved.
- **Leaderless** (Dynamo-style): write to w replicas, read from r; if **w + r > n** the read and write sets overlap. Version vectors detect concurrent writes.
- **Last write wins** converges by silently throwing data away.
:::

## Why distribute data at all?

:::cards 3
@ Scalability
Data volume, read load or write load bigger than one machine can handle.
@ Fault tolerance
Keep working when a machine, several machines or a whole datacenter goes down.
@ Latency
Users around the world: serve each from a nearby datacenter.
:::

:::vs
@ Scale up (shared memory or shared disk)
One big machine with many CPUs, RAM chips and disks, or several machines sharing a disk array over a fast network. Cost grows faster than linearly, and it's limited to one location.
@ Scale out (shared-nothing)
Each node has its own CPUs, RAM and disks; nodes coordinate over an ordinary network, in software. The focus of Part II, and the source of much application complexity.
:::

Two ways to spread data, usually combined:

:::vs
@ Replication
**The same data** copied onto several nodes. Gives redundancy and can improve performance. (This module.)
@ Partitioning
A big database **split into subsets** (partitions or shards) assigned to different nodes. (Next module.)
:::

## Leaders and followers

Every write has to reach every replica, or the replicas drift apart. The most common answer is **leader-based replication** (also called active/passive or master–slave):

:::steps
@ One leader takes writes
One replica is the **leader** (master, primary). Clients send every write to it, and it writes the data to local storage.
@ Leader streams changes
The other replicas are **followers** (read replicas, secondaries, hot standbys). The leader sends each change to them in a **replication log** (change stream), and each follower applies the writes **in the same order**.
@ Reads go anywhere
Clients can read from the leader or any follower. Only the leader accepts writes.
:::

Step through it, including what happens when a follower lags:

:::viz replication

:::deep Who uses leader-based replication
Built into PostgreSQL (since 9.0), MySQL, Oracle Data Guard, SQL Server AlwaysOn, MongoDB, RethinkDB and Espresso; message brokers Kafka and RabbitMQ (highly available queues); and some network filesystems and replicated block devices such as DRBD.
:::

### Synchronous vs asynchronous replication

:::vs
@ Synchronous
The leader **waits** for the follower to confirm before reporting success.
- ✅ Follower is guaranteed up to date.
- ❌ If that follower is down or slow, **all writes block**.
@ Asynchronous
The leader sends the change and **doesn't wait**.
- ✅ Leader keeps accepting writes even if every follower has fallen behind.
- ❌ If the leader dies unrecoverably, unreplicated writes are **lost**, even though clients were told they succeeded.
:::

> **Key idea:** In practice, use **semi-synchronous** replication: one follower is synchronous and the rest asynchronous. If the synchronous one becomes slow, another follower is promoted to synchronous. That guarantees an up-to-date copy on at least two nodes. Fully asynchronous replication is still common, especially with many or geographically distant followers.

> **Note:** **Chain replication** (used by Microsoft Azure Storage) is a variant that avoids losing data while keeping good performance.

### Setting up a new follower

Copying the data files isn't enough (clients keep writing, so the files are changing), and locking the database makes it unavailable. Instead:

:::steps
@ Snapshot
Take a **consistent snapshot** of the leader without locking the whole database. Most databases support this for backups; MySQL needs a tool such as innobackupex.
@ Copy
Copy the snapshot to the new follower.
@ Catch up
The follower asks the leader for every change since the snapshot. The snapshot is tied to an exact log position: PostgreSQL calls it the **log sequence number**, MySQL the **binlog coordinates**.
@ Stay current
Once the backlog is processed the follower has **caught up**, and keeps applying changes as they arrive.
:::

### Handling node outages

:::tabs
@ Follower failure
**Catch-up recovery.** Each follower keeps a log of the changes it has received on disk. After a crash or network break, it knows the last transaction it processed and asks the leader for everything after that.
@ Leader failure
**Failover**: promote a follower, point clients at it, and make the other followers consume from it. It can be done by an administrator or automatically:

:::steps
@ Detect the failure
Most systems use a timeout: no response for, say, 30 seconds means the leader is presumed dead.
@ Choose a new leader
Elected by a majority of the remaining replicas, or appointed by a previously elected controller node. The best candidate has the **most up-to-date data**, minimising loss.
@ Reconfigure
Send writes to the new leader, and make sure the old leader becomes a follower if it comes back.
:::
@ What goes wrong in failover
- **Lost writes**: with async replication, the new leader may be missing the old leader's last writes. The usual fix is to **discard** them, which breaks clients' expectation of durability.
- **External systems disagree**: at GitHub, an out-of-date MySQL follower was promoted. It **reused auto-increment primary keys** the old leader had already assigned, and those keys were also stored in Redis, so some private data was shown to the wrong users.
- **Split brain**: two nodes both think they're leader, both accept writes, and nothing resolves the conflict: data is lost or corrupted. Some systems shut one node down when they detect two leaders, but a careless mechanism can shut down both.
- **Choosing the timeout**: too long means slow recovery; too short means unnecessary failovers. A load spike can push response times over the timeout, and failing over a system that's already struggling makes things worse.

> **Note:** These are fundamental distributed-systems problems (node failures, unreliable networks, consistency vs durability vs availability vs latency). Modules 9 and 10 go deep on them.
:::

### How the replication log is implemented

:::tabs
@ Statement-based
The leader logs every write **statement** (INSERT, UPDATE, DELETE) and followers execute them. It breaks down with:
- nondeterministic functions such as `NOW()` and `RAND()`;
- auto-increment columns, or statements that depend on existing data (they must run in exactly the same order, which limits concurrency);
- side effects in triggers, stored procedures and user-defined functions.

The leader can replace nondeterministic calls with fixed values, but other methods are usually preferred. MySQL used it before 5.1; VoltDB uses it safely by requiring deterministic transactions.
@ WAL shipping
The storage engine already writes an append-only log of every change (LSM segments, or a B-tree's write-ahead log). The leader just **sends that same log** to followers. Used by PostgreSQL and Oracle.

> **Pitfall:** The WAL describes changes at a very low level (which bytes changed in which disk blocks), coupling replication to the storage engine. Leader and followers usually can't run different database versions, so **zero-downtime upgrades** aren't possible.
@ Logical (row-based)
A separate log format for replication, decoupled from storage internals. It describes writes **row by row**:
- **insert**: all the new row's column values;
- **delete**: enough to identify the row (usually the primary key);
- **update**: enough to identify the row, plus the new values.

A multi-row transaction produces several records plus a commit record. MySQL's row-based binlog works this way.

> **Key idea:** It's easier to keep backward compatible (leader and followers can run different versions or even different storage engines) and easier for **external systems** to parse: feeding a warehouse, building custom indexes and caches. That's **change data capture** (module 12).
@ Trigger-based
Application code registered as triggers or stored procedures logs changes into a separate table, read by an external process. Databus for Oracle and Bucardo for PostgreSQL work like this; Oracle GoldenGate reads the database log instead.

More overhead and more bug-prone than built-in replication, but **flexible**: replicate only a subset of data, add custom conflict resolution, or replicate to a different kind of database.
:::

## Problems with replication lag

Leader-based replication is attractive for **read-scaling** (mostly reads, few writes): just add followers. Realistically that only works with **asynchronous** replication, and then a follower can return **stale** data.

> **Key idea:** If you stop writing and wait, followers eventually catch up: **eventual consistency**. "Eventually" is deliberately vague. The **replication lag** can be a fraction of a second, or seconds to minutes when the system is near capacity or the network has problems.

Try the three anomalies below:

:::viz replag

:::tabs
@ Read-your-writes
**Problem:** you post a comment, refresh, and it's gone, because your read hit a lagging follower.

**Guarantee: read-after-write consistency.** After reloading, a user always sees updates **they** submitted. (No promise about other users' updates.) Techniques:

- **Read possibly-modified data from the leader**: e.g. always read your own profile from the leader, other people's from followers.
- **Time-based**: if most things are editable, read from the leader for a minute after each update, or avoid followers more than a minute behind.
- **Remember your last write**: the client stores the timestamp of its latest write (a logical one such as a log sequence number, or wall-clock time if clocks are synced). Only replicas caught up to it may serve the read; otherwise try another replica or wait.
- **Multiple datacenters**: any request that needs the leader must be routed to the datacenter holding it.

> **Pitfall:** **Cross-device** read-your-writes (write on desktop, read on phone) is harder. The "last update" timestamp must be stored centrally, since one device can't see the other's state, and devices may be routed to different datacenters (home broadband vs mobile data), so you may need to route all of a user's devices to the same datacenter.
@ Monotonic reads
**Problem:** you refresh twice; the first read hits a fresh replica and shows a new comment, the second hits a lagging replica and the comment **disappears**: time moves backwards.

**Guarantee: monotonic reads.** Once you've seen newer data, you never see older data afterwards. Weaker than strong consistency, stronger than eventual consistency.

**Fix:** each user always reads from the **same replica**, chosen by a hash of the user ID. If that replica fails, reroute.
@ Consistent prefix reads
**Problem:** Mr. Poons asks a question and Mrs. Cake answers it. Their writes land in different partitions with different lag, so an observer sees the **answer before the question**.

**Guarantee: consistent prefix reads.** If writes happen in a certain order, anyone reading them sees them in that order.

It's mainly a problem in **partitioned** databases, where partitions act independently and there's no global write order. **Fixes:** write causally related data to the same partition, or explicitly track causal dependencies (the happens-before relation, later in this module).
:::

> **Tip:** Ask: "how does my application behave if lag grows to minutes or hours?" If that's a problem, design for a stronger guarantee. Pretending async replication is synchronous is a recipe for trouble. App-level workarounds are complex and easy to get wrong; it's better if the database just "does the right thing", which is why **transactions** exist (module 8). Many distributed databases dropped them, claiming eventual consistency is inevitable. That's partly true and partly an oversimplification.

## Multi-leader replication

With one leader, every write goes through it; if you can't reach it (say, a network break), you can't write. Extension: let **several nodes accept writes** (multi-leader, master–master, active/active). Each leader is also a follower of the others.

### When you'd want it

:::tabs
@ Multiple datacenters
A leader in **each** datacenter. Inside a datacenter: normal leader–follower replication. Between datacenters: each leader replicates to the others.

| | Single-leader | Multi-leader |
|---|---|---|
| Performance | every write crosses the internet to the leader's datacenter: big latency | writes are handled locally and replicated asynchronously: inter-datacenter delay is hidden |
| Datacenter outage | fail over to a follower in another datacenter | each datacenter keeps running; replication catches up when the failed one returns |
| Network problems | sensitive to the inter-datacenter link (synchronous writes block) | tolerates temporary interruptions: writes keep flowing |

> **Pitfall:** The same data can be modified concurrently in two datacenters, so **write conflicts** must be resolved. Multi-leader is often considered dangerous territory to avoid if possible: auto-increment keys, triggers and integrity constraints can all misbehave. (Tungsten Replicator for MySQL, BDR for PostgreSQL, GoldenGate for Oracle.)
@ Offline clients
A calendar app on your phone, laptop and tablet: each device has a local database acting as a **leader** (it accepts writes while offline), with async multi-leader sync between devices. Lag can be hours or days.

> **Analogy:** Each device is a tiny "datacenter", connected by an extremely unreliable network. CouchDB is designed for this mode.
@ Collaborative editing
Etherpad and Google Docs apply each user's edit to their local replica instantly and replicate it asynchronously.

- Avoiding conflicts would mean **locking** the document: effectively single-leader replication with transactions on the leader.
- For faster collaboration, make each change tiny (a keystroke) and avoid locks, which brings all the multi-leader challenges, including conflict resolution.
:::

### Handling write conflicts

Two users edit a wiki page title at the same moment: user 1 changes A → B on leader 1; user 2 changes A → C on leader 2. Both succeed locally. The conflict is detected only later, asynchronously.

> **Note:** You could detect conflicts synchronously by waiting for every replica before confirming, but then you lose multi-leader's main advantage (independent writes). You might as well use single-leader.

:::tabs
@ Avoid conflicts
The simplest and most recommended strategy: make sure **all writes to a given record go through the same leader**, e.g. route each user to their "home" datacenter.

It breaks down when the designated leader must change: a datacenter fails, or the user moves.
@ Converge
With no defined order of writes, every replica must still end with **the same final value**. Ways to get convergent resolution:

- **Last write wins (LWW)**: give each write a unique ID (timestamp, UUID, hash) and keep the highest. Popular, but **dangerously prone to data loss**.
- **Replica priority**: writes from the higher-numbered replica win. Also loses data.
- **Merge the values**: e.g. sort alphabetically and concatenate ("B/C").
- **Record the conflict** in an explicit structure that keeps every version, and resolve it later in application code (perhaps by asking the user).
@ Custom logic
:::vs
@ On write
As soon as the database spots a conflict in the replication log, it calls a handler (Bucardo lets you write a Perl snippet). Runs in the background, so it can't prompt the user.
@ On read
All conflicting versions are stored. The next read returns them all; the application resolves them and writes the result back (CouchDB).
:::

Resolution happens per row or document, **not per transaction**.
@ What counts as a conflict?
Some are obvious: two writes set the same field to different values.

Others are subtle: a meeting-room booking system where two bookings for the same room and time are created on two different leaders. Module 8 covers this kind of problem.
:::

:::deep Automatic conflict resolution research
- **CRDTs** (conflict-free replicated datatypes): sets, maps, ordered lists and counters that many users can edit concurrently and that merge automatically. Implemented in Riak 2.0.
- **Mergeable persistent data structures**: track history explicitly, like Git, and use a three-way merge.
- **Operational transformation**: the algorithm behind Etherpad and Google Docs, designed for concurrent editing of an ordered list such as the characters of a document.
:::

### Replication topologies

The paths along which writes travel between leaders:

:::cards 3
@ All-to-all
Every leader sends its writes to every other leader. The most general and the most fault-tolerant.
@ Circular
Each node receives writes from one node and forwards them (plus its own) to the next. MySQL's default.
@ Star
A root node forwards writes to all the others. Generalises to a tree.
:::

- **Loop prevention**: in circular and star topologies a write passes through several nodes, so each node has an ID and each write is tagged with every node it has passed through.
- **Single point of failure**: in circular and star topologies, one failed node can interrupt replication between the others.
- **Overtaking**: in all-to-all, some links are faster, so messages can arrive out of order, e.g. an update before the insert it depends on (a causality problem like consistent prefix reads). Timestamps can't fix it (clocks aren't reliably in sync); **version vectors** can.

> **Pitfall:** Conflict detection is poorly implemented in many multi-leader systems. Know the issues and test carefully.

## Leaderless replication

Some systems drop the leader entirely and let **any replica accept writes**. Common in early replicated systems, it came back into fashion after Amazon's in-house **Dynamo**. Riak, Cassandra and Voldemort are open-source **Dynamo-style** stores. The client sends each write to several replicas, or a **coordinator node** does it for the client (unlike a leader, it doesn't impose an order on writes).

### Writing when a node is down

There's no failover. With three replicas and one down, the client writes to all three in parallel; two acknowledge and the write counts as successful. When the third comes back it holds **stale** data. So reads also go to **several replicas in parallel**, and **version numbers** decide which response is newest.

How does a returning node catch up?

:::vs
@ Read repair
When a read sees a stale response from a replica, the client writes the newer value back to it. Works well for frequently read values.
@ Anti-entropy
A background process continually compares replicas and copies missing data. No particular order, and possibly a long delay. Without it, rarely read values may stay missing on some replicas.
:::

### Quorums for reading and writing

With **n** replicas, each write must be confirmed by **w** nodes and each read must query at least **r** nodes.

> **Key idea:** If **w + r > n**, the set of nodes you write to and the set you read from must **overlap**, so at least one node you read has the latest value. Reads and writes that obey this are **quorum** reads and writes.

Take replicas down and watch which reads and writes still succeed:

:::viz quorum

- **Typical choice**: n odd (3 or 5), with w = r = (n + 1) / 2 rounded up.
- **Read-heavy workloads**: w = n, r = 1 makes reads fast, but one failed node makes every write fail.
- **Tolerating failures**: n = 3, w = 2, r = 2 tolerates one unavailable node; n = 5, w = 3, r = 3 tolerates two.
- **All in parallel**: requests normally go to all n replicas at once; w and r only say how many responses to **wait for**.

### Limits of quorum consistency

Smaller w and r (w + r ≤ n) give lower latency and higher availability but more stale reads. Even with w + r > n, stale values can slip through:

- **Sloppy quorums** (below) can put the w writes and r reads on different nodes, so there's no guaranteed overlap.
- **Concurrent writes** have no obvious order. The only safe answer is to merge them; picking a winner by timestamp (LWW) can lose writes to clock skew.
- **A write concurrent with a read** may have reached only some replicas, so the read may return either value.
- **Partial failures**: a write that succeeded on fewer than w replicas isn't rolled back on the ones that did store it, so later reads may or may not see it.
- **Restores from stale replicas**: if a node holding the new value fails and is restored from a replica with an old value, fewer than w nodes may hold the new value.
- **Timing edge cases** remain even when everything works (linearizability, module 10).

> **Key idea:** Dynamo-style databases are tuned for workloads that tolerate **eventual consistency**. w and r change the _probability_ of stale reads; they don't give absolute guarantees. In particular you usually **don't** get read-your-writes, monotonic reads or consistent prefix reads.

> **Tip:** **Monitor staleness** even if your application tolerates it. With a leader, lag is easy to measure (subtract the follower's log position from the leader's). Leaderless systems have no fixed write order, so it's harder; with read repair alone, there's no limit to how old a value can get.

### Sloppy quorums and hinted handoff

In a big cluster (many more nodes than n), a network problem might cut a client off from the n "home" nodes for a value while it can still reach others. Two options:

:::vs
@ Strict quorum
Return errors for every request that can't reach w or r of the home nodes.
@ Sloppy quorum
Accept the write anyway on reachable nodes outside the home n. Reads and writes still need w and r responses, but they may come from any nodes.
:::

When the network heals, writes held on behalf of other nodes are sent to their proper home nodes: **hinted handoff**.

> **Analogy:** Locked out of your house, you ask to sleep on the neighbour's couch. When you find your keys, you go home.

> **Pitfall:** Sloppy quorums boost write availability, but you **can't be sure to read the latest value**. They guarantee durability (the data is on w nodes _somewhere_), not consistency. Optional in Riak (on by default), Cassandra and Voldemort (off by default).

:::deep Leaderless replication across datacenters
- **Cassandra and Voldemort**: n counts replicas across all datacenters. Writes go to every replica, but the client only waits for a quorum within its **local** datacenter.
- **Riak**: all client communication stays within one datacenter; n counts replicas there. Cross-datacenter replication happens asynchronously in the background, multi-leader style.
:::

### Detecting concurrent writes

Dynamo-style stores let several clients write the same key concurrently, so conflicts happen even with strict quorums (and during read repair and hinted handoff). Events may arrive in **different orders at different nodes**. If each node just overwrote on every write, replicas would stay **permanently inconsistent**.

:::tabs
@ Last write wins
Keep only the "most recent" value and discard older ones. Concurrent writes have no natural order, so we **force** one: attach a timestamp and keep the biggest.

- The only option in **Cassandra**, optional in **Riak**.
- Converges, but at the cost of **durability**: of several concurrent writes, only one survives, even though all were reported successful.
- Can even drop **non-concurrent** writes because of clock skew (module 9).

> **Tip:** The only safe way to use LWW is to write each key **once** and treat it as immutable. Cassandra recommends a UUID per write as the key.
@ Happens-before
Operation A **happens before** B if B knows about A, depends on A or builds on A.

Two operations are **concurrent** if neither happens before the other: neither knows about the other.

> **Key idea:** Concurrency isn't about wall-clock time. Two operations can be concurrent even if one happened long after the other, as long as the network was slow or interrupted so neither knew about the other.
@ Version numbers
For a single replica:

:::steps
@ Server versions each key
Every write to a key increments its version number, which is stored with the value.
@ Read before writing
A read returns every value not yet overwritten, plus the latest version number.
@ Write with the version you read
The client sends the version from its last read and merges all the values it received into the new value.
@ Server keeps what's concurrent
The server overwrites every value with that version or lower (they've been merged), but keeps values with a **higher** version: those were written concurrently.
:::
@ Siblings and tombstones
When concurrent values coexist, they're called **siblings**, and the client must merge them.

- **Union** works for adding items to a shopping cart.
- But a **removed** item would reappear after a union. So removal leaves a marker with a version number: a **tombstone**.

> **Tip:** Merging siblings in application code is complex and error-prone. Riak's **CRDT** datatypes merge automatically in sensible ways, including preserving deletions.
@ Version vectors
With multiple replicas and no leader, one version number isn't enough.

- Keep a version number **per replica, per key**.
- Each replica increments its own number on each write it processes, and tracks the numbers it has seen from every other replica.
- The full set is a **version vector**. It goes to the client on reads and back to the database on writes.

It lets the database tell an **overwrite** from a **concurrent** write. Riak uses a variant, **dotted version vectors**, encoded as a string called a _causal context_.
:::

## Recall

:::flash
Q: Synchronous vs asynchronous replication: main risk of each?
A: Sync: one slow follower blocks all writes. Async: a leader crash loses acknowledged writes.
Q: What is semi-synchronous replication?
A: One follower is synchronous and the rest async, so at least two nodes always have the latest data.
Q: Four steps to add a new follower?
A: Snapshot the leader, copy it, catch up from the snapshot's log position, then keep applying changes.
Q: What went wrong in GitHub's failover incident?
A: A stale follower reused auto-increment keys also stored in Redis, leaking private data to other users.
Q: Why does WAL shipping block zero-downtime upgrades?
A: The WAL is tied to storage-engine internals, so leader and followers must run the same version.
Q: Fix for read-your-writes?
A: Read data the user may have edited from the leader, or from a replica caught up to the user's last write.
Q: Fix for monotonic reads?
A: Always route each user to the same replica (by hash of user ID).
Q: Fix for consistent prefix reads?
A: Put causally related writes in the same partition, or track causal dependencies.
Q: Three reasons for multi-leader replication?
A: Multiple datacenters, clients that work offline, collaborative editing.
Q: Quorum condition?
A: w + r > n, so the read set overlaps the write set.
Q: What is hinted handoff?
A: Writes accepted by stand-in nodes during a sloppy quorum are later forwarded to their home nodes.
Q: What does a version vector tell you?
A: Whether two writes are concurrent or one overwrote the other: one counter per replica per key.
:::

:::quiz
Q: With n = 5, w = 3, r = 3, how many replicas can be unavailable while reads and writes still succeed?
- 1
- [x] 2
- 3
- 0
> Writes need 3 acknowledgements and reads need 3 responses, so up to 5 − 3 = 2 replicas can be down.
:::

:::quiz
Q: A user posts a comment, refreshes, and the comment is missing. Which guarantee was violated, and which technique fixes it?
- Monotonic reads; route the user to the same replica
- [x] Read-after-write consistency; read data the user may have modified from the leader (or a replica that has caught up to the user's last write)
- Consistent prefix reads; put related writes in one partition
- Linearizability; use two-phase commit
> The user's own write isn't visible to their next read because it was served by a lagging follower.
:::

:::quiz
Q: Why is last-write-wins dangerous as a conflict resolution strategy?
- It needs a consensus algorithm
- [x] It silently discards all but one of several concurrent (or clock-skewed) writes, even though each was reported successful
- It never converges
- It requires version vectors
> LWW gives convergence by throwing data away. It's only safe if each key is written once and then treated as immutable.
:::
</script>
<script type="text/x-jc" id="m-partitioning" data-part="Part II · Distributed data" data-title="Partitioning" data-short="Partitioning" data-lede="Chapter 6. Splitting a dataset too large for one machine into partitions (shards): by key range or by hash, handling skew and hot spots, secondary indexes (local vs global), rebalancing strategies, and routing requests to the right node.">
:::tldr
- **Partitioning** (sharding) splits data so each record lives in exactly one partition, spreading data and load across nodes. Usually combined with replication.
- **Key-range** partitioning keeps keys sorted (fast range scans) but risks **hot spots**. **Hash** partitioning spreads load evenly but loses range queries.
- A single hot key defeats hashing; split it manually with a random suffix.
- Secondary indexes are either **local** (simple writes, scatter/gather reads) or **global** (targeted reads, slower and often async writes).
- **Never use hash mod N.** Rebalance by moving whole partitions: a fixed count, dynamic splitting, or a fixed number per node.
- Routing: any node forwards, a routing tier, or partition-aware clients, usually coordinated by **ZooKeeper** or gossip.
:::

## Why partition?

For huge datasets or very high throughput, replication alone isn't enough: we break the data into **partitions**. Each record belongs to exactly one partition, and each partition is a small database of its own. The main reason is **scalability**: partitions live on different nodes of a shared-nothing cluster, spreading the data over many disks and the query load over many processors.

:::deep Same idea, many names
- **Shard**: MongoDB, Elasticsearch, SolrCloud
- **Region**: HBase
- **Tablet**: Bigtable
- **vnode**: Cassandra, Riak
- **vBucket**: Couchbase
:::

Partitioning is usually combined with **replication**: copies of each partition live on several nodes, and with leader–follower replication each node can be leader for some partitions and follower for others.

:::html
<figure class="fig"><svg viewBox="0 0 680 210" role="img" aria-label="Four nodes; each node is leader for some partitions and follower for others.">
<rect class="s-box" x="20" y="20" width="150" height="170" rx="12"/><text class="s-tb" x="95" y="44" text-anchor="middle">Node 1</text>
