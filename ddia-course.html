<rect class="s-acc" x="535" y="142" width="110" height="34" rx="8"/><text class="s-t" x="590" y="164" text-anchor="middle">P3 follower</text>
</svg><figcaption>Combining partitioning and replication: every partition has one leader and several followers, spread across nodes.</figcaption></figure>
:::

> **Key idea:** The goal is to spread data and queries **evenly**. Uneven partitioning is **skew**; a partition with disproportionately high load is a **hot spot**. Assigning records to random nodes would be even, but then reading one item means querying every node. We can do better.

## Two ways to assign keys

:::vs
@ By key range
Give each partition a **continuous range of keys**, like the volumes of a paper encyclopedia (A–B, C–D…).
- Ranges needn't be equal: volume 1 might cover A–B, volume 12 T–Z, to match the data.
- Boundaries set manually or automatically (Bigtable, HBase, RethinkDB, MongoDB before 2.4).
- Keys stay **sorted** within each partition, so **range scans** are easy.
@ By hash of key
Run each key through a **hash function** and give each partition a **range of hashes**.
- A good hash spreads skewed keys uniformly: similar strings get very different hashes.
- Load is even, but adjacent keys scatter, so **range queries** are lost.
- Boundaries evenly spaced or chosen pseudorandomly (**consistent hashing**).
:::

Try both and watch where keys land:

:::viz partitioning

:::tabs
@ Key-range hot spots
If the key is a **timestamp**, every write for today goes to one partition, overloading it while the others sit idle.

**Fix:** prefix each timestamp with the sensor name, so writes spread across partitions. The trade-off: a range query across many sensors now needs one query per sensor.

> **Tip:** Keys sorted within a partition can act as a concatenated index, e.g. fetch all readings from one sensor in a month with a single range scan.
@ Choosing a hash function
- It doesn't need to be cryptographically strong: Cassandra and MongoDB use **MD5**; Voldemort uses **Fowler–Noll–Vo**.
- A 32-bit hash maps any string to a seemingly random number between 0 and 2³² − 1.

> **Pitfall:** Many languages' built-in hashes are unsuitable, because the same key can hash differently in different processes: Java's `Object.hashCode()`, Ruby's `Object#hash`.
@ "Consistent hashing"
Karger et al. invented **consistent hashing** to spread load across an internet-wide system of caches (such as a CDN), using random partition boundaries so no central control or consensus is needed.

> **Naming:** "Consistent" here has nothing to do with replica consistency or ACID consistency. The term is confusing in databases, so just say **hash partitioning**.
@ Losing range queries
With hash partitioning, keys that were adjacent are scattered across all partitions:
- **MongoDB** (hash-based sharding) must send any range query to every partition.
- **Riak, Couchbase and Voldemort** don't support range queries on the primary key at all.
:::

### Cassandra's compromise: compound keys

A **compound primary key** of several columns. Only the **first** column is hashed to pick the partition; the remaining columns form a sorted, concatenated index inside Cassandra's SSTables.

> **Picture it:** A social site with primary key `(user_id, update_timestamp)`. Different users land on different partitions (even spread), and one user's updates within a time window come back with an efficient, sorted range scan. You can't range over the first column, but if you fix it, you can range over the rest.

## Skewed workloads and hot keys

Hashing reduces hot spots but can't remove them. In the extreme case every request is for **the same key**: a celebrity with millions of followers posts something, and a storm of activity hits one key (their user ID, or the ID of the post everyone's commenting on). Identical keys always hash to the same partition.

Most databases can't fix this automatically, so it's up to the application:

:::steps
@ Split the hot key
Add a random two-digit number to the start or end of the key, spreading its writes across **100 different keys** on different partitions.
@ Pay on read
Reads must now fetch all 100 keys and combine them.
@ Keep bookkeeping
Track which keys are split. It's only worth it for the few known hot keys; doing it for every key would waste effort on reads.
:::

## Partitioning and secondary indexes

So far, records are found only by primary key. **Secondary indexes** don't identify a record; they find every record with a given value: "all actions by user 123", "all articles containing _hogwash_", "all red cars". They're the bread and butter of relational databases, common in document databases, and the whole point of search servers like Solr and Elasticsearch. Many key-value stores (HBase, Voldemort) avoided them because they're complex; Riak has started adding them.

> **Key idea:** Secondary indexes don't map neatly onto partitions. There are two approaches.

:::viz secindex

:::vs
@ Local index (document-partitioned)
Each partition indexes **only its own documents**.
- ✅ **Writes are simple**: touch only the partition holding the document.
- ❌ **Reads scatter/gather**: red cars could be anywhere, so query every partition and combine. Expensive and prone to **tail latency amplification**.
- Used by MongoDB, Riak, Cassandra, Elasticsearch, SolrCloud, VoltDB.
@ Global index (term-partitioned)
One index covering **all** partitions, itself partitioned **by the indexed term** (e.g. colours a–r on partition 0, s–z on partition 1).
- ✅ **Reads are targeted**: go only to the partition holding the term.
- ❌ **Writes are slower**: one document's terms may live on many partitions.
- Updates are often **asynchronous** in practice.
- Used by DynamoDB global secondary indexes, Riak search, Oracle warehouses.
:::

:::tabs
@ Local index in practice
Example: a used-car site partitioned by document ID (IDs 0–499 on partition 0, 500–999 on partition 1…), with a secondary index on `color` and `make`. Each partition keeps its own index for its own cars, hence a **local index**.

> **Tip:** Vendors recommend designing the partitioning scheme so secondary-index queries hit a single partition. That isn't always possible, e.g. filtering by colour **and** make at once.
@ Global index in practice
Partition the index by the **term itself** (good for range scans, like a numeric asking price) or by a **hash of the term** (more even load).

> **Pitfall:** Keeping a global index perfectly up to date needs a **distributed transaction** across every partition a write touches, which not all databases support. So updates are often async: read right after a write and the index may not show it yet. DynamoDB GSIs usually update within a fraction of a second but can lag longer during faults.
:::

## Rebalancing partitions

Things change: throughput grows (add CPUs), data grows (add disks and RAM), machines fail (others must take over). Moving data and requests between nodes is **rebalancing**. It must:

:::cards 3
@ Share load fairly
Afterwards, storage, reads and writes are evenly spread across nodes.
@ Stay online
The database keeps accepting reads and writes during the move.
@ Move little data
Move only what's necessary, to keep it fast and limit network and disk load.
:::

> **Pitfall:** **Never use `hash(key) mod N`.** When N changes, almost every key moves. Example: hash 123456 sits on node 6 with 10 nodes, node 3 with 11 nodes, node 0 with 12 nodes. Rebalancing becomes ruinously expensive.

Add and remove nodes and compare how much data moves:

:::viz rebalance

:::tabs
@ Fixed number of partitions
Create **many more partitions than nodes** (e.g. 1,000 partitions on 10 nodes, ~100 each).

- **Node added**: it steals a few partitions from every existing node until things are even. **Node removed**: the reverse.
- Only **whole partitions** move. The number of partitions and the key → partition mapping never change; only partition → node does.
- During the transfer, the old assignment keeps serving reads and writes.
- More powerful nodes can be given more partitions.
- Used by Riak, Elasticsearch, Couchbase, Voldemort.

> **Pitfall:** The count is usually fixed at setup. Pick it high enough for future growth but not so high that per-partition overhead dominates. If the dataset size varies a lot this is hard: too-large partitions make rebalancing and recovery expensive; too-small ones waste overhead.
@ Dynamic partitioning
Fixed key-range boundaries would be awful if you guessed wrong (all data in one partition), so **HBase** and **RethinkDB** create partitions dynamically:

- **Split** a partition when it exceeds a size (HBase default: 10 GB); half the data goes to each side, and one half can move to another node.
- **Merge** neighbours when a partition shrinks below a threshold, like a B-tree at the top level.
- The partition count adapts to the data volume.

> **Pitfall:** An empty database starts with **one** partition, so all writes hit one node until the first split. HBase and MongoDB allow **pre-splitting** an empty database, if you know the key distribution in advance.

Dynamic partitioning works for hash-partitioned data too: MongoDB since 2.4 supports both.
@ Proportional to nodes
A **fixed number of partitions per node** (Cassandra: 256 by default; also Ketama).

- While the node count stays the same, partitions grow with the data; adding nodes makes them smaller again.
- A new node picks a fixed number of existing partitions **at random**, splits each, and takes half of each.
- Randomness can produce uneven splits, but averaged over many partitions the new node gets a fair share.
- Requires hash partitioning (random boundaries). This is closest to Karger's original consistent hashing.
@ Summary
| Strategy | Number of partitions | Partition size |
|---|---|---|
| Fixed count | constant | grows with dataset |
| Dynamic | grows with dataset | roughly constant |
| Per node | grows with node count | grows with data, shrinks as nodes are added |
:::

### Automatic or manual?

:::vs
@ Fully automatic
Convenient, but unpredictable. Rebalancing is expensive (rerouting requests, moving lots of data) and can overload the network or nodes.
@ Human in the loop
Couchbase, Riak and Voldemort **suggest** an assignment automatically, but an administrator must commit it.
:::

> **Pitfall:** Automatic rebalancing plus automatic failure detection can cause a **cascading failure**: an overloaded node is slow, others think it's dead and move load away from it, which adds load to everyone and the network, making things worse.

## Request routing

A client wants key "foo". Which node, IP and port should it connect to, given that partitions move around? This is an instance of **service discovery**. Three approaches:

:::cards 3
@ Ask any node
Clients connect to any node (e.g. via a round-robin load balancer). If it owns the partition it answers; otherwise it forwards the request and relays the reply.
@ Routing tier
All requests go to a **partition-aware load balancer** first, which forwards each one to the right node. It handles no requests itself.
@ Smart clients
Clients know the partition → node assignment and connect directly to the right node.
:::

> **Key idea:** In every case the hard question is how the router **learns about changes** to the assignment. Everyone must agree, or requests go to the wrong node. That's a **consensus** problem (module 10), and it's hard to implement correctly.

:::html
<figure class="fig"><svg viewBox="0 0 680 230" role="img" aria-label="ZooKeeper tracks partition-to-node assignment; nodes register with it; the routing tier subscribes to changes.">
<rect class="s-acc" x="250" y="14" width="180" height="46" rx="10"/><text class="s-tb" x="340" y="42" text-anchor="middle">ZooKeeper</text>
<rect class="s-box" x="40" y="92" width="150" height="44" rx="10"/><text class="s-t" x="115" y="119" text-anchor="middle">Client</text>
<rect class="s-cur" x="250" y="92" width="180" height="44" rx="10"/><text class="s-t" x="340" y="119" text-anchor="middle">Routing tier</text>
<rect class="s-box" x="200" y="172" width="80" height="44" rx="10"/><text class="s-t" x="240" y="199" text-anchor="middle">Node 0</text>
<rect class="s-box" x="300" y="172" width="80" height="44" rx="10"/><text class="s-t" x="340" y="199" text-anchor="middle">Node 1</text>
<rect class="s-box" x="400" y="172" width="80" height="44" rx="10"/><text class="s-t" x="440" y="199" text-anchor="middle">Node 2</text>
<path class="s-line" d="M190,114 H250"/><path class="s-line" d="M340,60 V92"/><path class="s-line" d="M340,136 V172"/>
<path class="s-line s-dash" d="M480,194 C590,190 560,40 430,37"/><text class="s-ts" x="540" y="120">nodes register;</text><text class="s-ts" x="540" y="136">tier subscribes</text>
</svg><figcaption>A coordination service keeps the authoritative mapping of partitions to nodes; routers get notified of changes.</figcaption></figure>
:::

:::vs
@ Coordination service (ZooKeeper)
Each node registers itself in ZooKeeper, which keeps the **authoritative** partition → node map. Routers and smart clients **subscribe**; when ownership changes, ZooKeeper notifies them.
- LinkedIn Espresso (via Helix), HBase, SolrCloud and Kafka use ZooKeeper.
- MongoDB has its own config servers, with **mongos** daemons as the routing tier.
@ Gossip protocol
Nodes spread cluster-state changes among themselves. Requests can go to **any** node, which forwards them (approach 1).
- Cassandra and Riak work this way.
- More complexity in the database nodes, but no external coordination service.
:::

> **Note:** Couchbase doesn't rebalance automatically, which simplifies things; it typically uses a routing tier called **moxi**. Clients still need node IP addresses, but those change far less often than partition assignments, so **DNS** is usually enough.

### Parallel query execution

Most NoSQL stores support only single-key reads and writes (plus scatter/gather for local secondary indexes). **Massively parallel processing (MPP)** relational databases, used for analytics, go much further: a warehouse query with joins, filters, grouping and aggregation is split by the optimiser into **stages and partitions** that run in parallel on different nodes (module 11 covers related techniques).

## Recall

:::flash
Q: Partition vs shard vs region vs vnode?
A: Same concept, different names: MongoDB/Elasticsearch shard, HBase region, Bigtable tablet, Cassandra/Riak vnode.
Q: Key-range partitioning: one strength, one weakness?
A: Efficient range scans; hot spots for sequential keys like timestamps.
Q: Hash partitioning: one strength, one weakness?
A: Even load; range queries must hit every partition.
Q: Why not use Java's hashCode() for partitioning?
A: It can differ between processes, so the same key could map to different partitions.
Q: How do you relieve a single hot key?
A: Add a random suffix (e.g. 00–99) to spread writes over 100 keys, then read and combine all of them.
Q: Local vs global secondary index?
A: Local: cheap writes, scatter/gather reads. Global: targeted reads, slower writes that are often async.
Q: Why is hash mod N bad?
A: Changing N remaps almost every key, so nearly all data must move.
Q: What moves when a node joins a fixed-partition cluster?
A: Whole partitions; the key → partition mapping never changes.
Q: Downside of dynamic partitioning on an empty database?
A: It starts with one partition, so one node takes all writes until the first split (unless pre-split).
Q: Two ways routers learn about partition moves?
A: A coordination service like ZooKeeper (subscribe to changes) or a gossip protocol among nodes.
:::

:::quiz
Q: Why is `hash(key) mod N` a poor way to assign keys to nodes?
- Hash functions are too slow
- [x] When N changes, most keys map to a different node, so nearly all data must move
- It causes hot spots for sequential keys
- It can't handle string keys
> With a fixed number of many partitions you only move whole partitions; the key-to-partition mapping never changes.
:::

:::quiz
Q: A query "find all red cars" against a database with a document-partitioned (local) secondary index must…
- read only the partition for `color:red`
- [x] be sent to every partition and the results combined (scatter/gather)
- use a distributed transaction
- read from the leader only
> Each partition indexes only its own documents, so red cars may be anywhere. A term-partitioned global index would avoid this at the cost of slower, often asynchronous writes.
:::

:::quiz
Q: Cassandra's compound primary key `(user_id, timestamp)` lets you…
- range-scan across all user IDs efficiently
- [x] hash-partition by user_id and efficiently range-scan one user's records sorted by timestamp
- avoid all hot spots automatically
- use a global secondary index on timestamp
> Only the first part is hashed to choose the partition; the remaining columns form a sorted concatenated index within the partition.
:::
</script>
<script type="text/x-jc" id="m-transactions" data-part="Part II · Distributed data" data-title="Transactions" data-short="Transactions" data-lede="Chapter 7. What ACID really means, and the race conditions that weak isolation levels allow or prevent: dirty reads and writes, read skew, lost updates, write skew and phantoms. Then the three ways to get serializability: actual serial execution, two-phase locking, and serializable snapshot isolation.">
:::tldr
- A **transaction** groups reads and writes into one unit that either **commits** or **aborts**, so the application never has to clean up half-finished work.
- **ACID**: Atomicity = abortability; Consistency = your app's invariants; Isolation = concurrent transactions don't interfere; Durability = committed data survives.
- **Read committed** stops dirty reads and dirty writes. **Snapshot isolation** (MVCC) also stops read skew.
- **Lost updates** need atomic operations, explicit locks, automatic detection or compare-and-set. **Write skew** and **phantoms** need serializability (or careful locking).
- Three ways to get **serializability**: actual serial execution, two-phase locking (pessimistic), and SSI (optimistic).
:::

## The slippery concept of a transaction

So many things can go wrong:

:::cards 3
@ Crashes
The database software or hardware fails in the middle of a write.
@ App failures
The application crashes halfway through a series of operations.
@ Network breaks
The application is cut off from the database, or a node from another node.
@ Overwrites
Several clients write at once and overwrite each other's changes.
@ Partial reads
A client reads data that's only partially updated.
@ Races
Race conditions between clients cause surprising bugs.
:::

> **Key idea:** A **transaction** groups several reads and writes into **one logical operation**. The whole thing either succeeds (**commit**) or fails (**abort**, rollback). If it fails, the application can safely retry. No **partial failure** to worry about.

Transactions aren't a law of nature; they were invented to **simplify the programming model**. In the late 2000s, many NoSQL databases dropped them (or redefined the word to mean much weaker guarantees), and "transactions don't scale" became popular wisdom. That's as much hyperbole as "every serious app needs transactions". Both have trade-offs worth understanding.

## ACID

Härder and Reuter coined **ACID** in 1983. In practice one database's ACID isn't another's, especially around isolation. (Systems that aren't ACID are sometimes called **BASE**: Basically Available, Soft state, Eventual consistency. That's even vaguer.)

:::tabs
@ Atomicity
Generally, "can't be split into smaller parts". In multi-threaded programming it means no other thread sees a half-finished result, but **that's not what ACID means** (that's isolation).

**ACID atomicity**: if a client makes several writes and a **fault** happens partway through, the transaction is **aborted** and every write so far is undone. Without it, you can't tell which changes took effect.

> **Naming:** **Abortability** would have been a better name.
@ Consistency
An overloaded word: replica consistency, consistent hashing, CAP consistency (= linearizability), and this one.

**ACID consistency**: certain statements about your data (**invariants**) must always hold, e.g. in accounting, credits and debits always balance. If each transaction starts valid and preserves the invariants, the database stays valid.

> **Pitfall:** That depends on **your application's** invariants and transactions. The database can enforce only some constraints (foreign keys, uniqueness). Atomicity, isolation and durability are database properties; consistency belongs to the application. The C was arguably added just to make the acronym work.
@ Isolation
Concurrent transactions don't step on each other's toes.

The textbook definition is **serializability**: each transaction can act as if it's the only one running, and the result equals running them **serially** (one after another), even though they ran concurrently.

> **Pitfall:** True serializable isolation is rarely used because of its performance cost. Oracle 11g doesn't even implement it: what it calls "serializable" is actually snapshot isolation.
@ Durability
Once committed, data **won't be forgotten**, even after a hardware fault or crash.

- **Single node**: written to nonvolatile storage (HDD, SSD), usually with a write-ahead log for recovery.
- **Replicated**: copied to some number of nodes.

> **Pitfall:** Perfect durability doesn't exist. A dead machine's disk is unreachable until it's repaired; a datacenter-wide power cut can crash every node; fsync and SSD firmware have bugs; disks slowly corrupt data; some SSDs lose data when unpowered. Combine techniques: disk writes, remote replication, backups.
:::

### Single-object and multi-object operations

:::vs
@ Multi-object transactions
Needed when several pieces of data must stay in sync. Example: an inbox with a denormalised **unread counter**.
- Without **isolation**, another user may see the new email but the old counter (a **dirty read**).
- Without **atomicity**, if the counter update fails, the mailbox and counter disagree.

In relational databases, a transaction is everything on one TCP connection between `BEGIN TRANSACTION` and `COMMIT`.
@ Single-object writes
Atomicity and isolation matter even for one object. Writing a 20 KB JSON document: if the network fails after 10 KB, does the database keep an unparseable fragment?
- Storage engines almost always give single-object atomicity (a crash-recovery log) and isolation (a lock per object).
- Some offer **increment** (no read-modify-write cycle) and **compare-and-set** (write only if the value hasn't changed).
:::

> **Pitfall:** Calling single-object operations "lightweight transactions" or "ACID" is misleading marketing. Real transactions group operations on **multiple** objects.

**Why we still need multi-object transactions**: many distributed stores dropped them because they're hard across partitions and can hurt availability or performance. But you need them for:

- **Foreign keys**: inserting several records that refer to each other.
- **Denormalised documents**: several documents updated together.
- **Secondary indexes**: the index must change whenever the value changes.

You can manage without transactions, but error handling becomes much more complicated.

### Handling errors and aborts

:::vs
@ ACID philosophy
If atomicity, isolation or durability is at risk, **abandon the whole transaction** rather than leave it half-finished.
@ Leaderless "best effort"
The database does as much as it can, and recovering from errors is the **application's** job.
:::

Retrying an aborted transaction is simple and effective, but not perfect:

- **It may have succeeded**: if the commit worked but the acknowledgement was lost on the network, a retry runs it **twice** (unless you deduplicate at the application level).
- **Overload makes it worse**: if the error came from overload, retries add load. Use exponential backoff and cap the retries.
- **Only transient errors**: retry deadlocks, isolation violations, network blips and failovers, not permanent errors such as constraint violations.
- **Side effects escape**: an email sent inside a transaction goes out even if the transaction aborts (two-phase commit can help, module 10).
- **Client crashes**: if the client dies while retrying, whatever it was writing is lost.

## Weak isolation levels

Two transactions that don't touch the same data can run in parallel safely. Problems start when one transaction **reads** data another is modifying, or two transactions **modify** the same data at once. These race conditions are hard to find by testing and hard to reason about.

> **Pitfall:** Weak isolation has caused real money losses, auditor investigations and corrupted customer data. "Use an ACID database for financial data" misses the point: many popular relational databases use **weak isolation by default**.

Run each anomaly at different isolation levels:

:::viz isolation

### Read committed

The most basic level. Two guarantees:

:::vs
@ No dirty reads
You only **see** committed data.

Without it, you might see a half-done update (the new email without the counter change), or data that's later rolled back.
@ No dirty writes
You only **overwrite** committed data.

Without it, two transactions updating several objects can interleave: Bob gets the car listing but Alice gets the invoice.
:::

> **Note:** Read committed does **not** prevent the counter-increment race. That's a lost update, covered below.

Read committed is very popular: the default in Oracle 11g, PostgreSQL, SQL Server 2012, MemSQL and others.

:::vs
@ How dirty writes are prevented
**Row-level locks.** To modify an object, a transaction takes its lock and holds it until commit or abort. Only one transaction can hold a given object's lock.
@ How dirty reads are prevented
Read locks would make one long write stall many readers. So the database remembers **both the old committed value and the new uncommitted value**, and gives every other reader the old one until the writer commits.
:::

### Snapshot isolation and repeatable read

Read committed still allows **read skew** (a **nonrepeatable read**):

> **Picture it:** Alice has $1,000 split across two accounts, $500 each. A transfer moves $100 from one to the other. At an unlucky moment, Alice sees one account **before** the incoming payment ($500) and the other **after** the outgoing one ($400). Total: $900. A hundred dollars seems to have vanished. Refreshing fixes it, but some situations can't tolerate even a temporary glitch:

:::cards 2
@ Backups
A backup takes hours while writes continue, so different parts capture different moments in time. Restore it, and the inconsistency becomes **permanent**.
@ Analytics and integrity checks
A query scanning much of the database returns nonsense if it sees different parts at different points in time.
:::

> **Key idea:** **Snapshot isolation**: each transaction reads from a **consistent snapshot**: all data committed **at the start** of the transaction. Later changes by other transactions are invisible to it. Ideal for long read-only queries like backups and analytics. Supported by PostgreSQL, MySQL/InnoDB, Oracle, SQL Server and others.

**How it's built: MVCC.** Write locks still prevent dirty writes, but reads take **no locks**. The principle: **readers never block writers, and writers never block readers**. The database keeps **several committed versions** of each object, because different in-progress transactions may need to see different points in time: **multi-version concurrency control**. (Read committed needs only two versions; engines with snapshot isolation usually use MVCC for read committed too, taking a new snapshot per query instead of per transaction.)

Watch versions being created and filtered:

:::viz mvcc

:::tabs
@ PostgreSQL's MVCC
- Each transaction gets a unique, ever-increasing **transaction ID (txid)**.
- Every row version records `created_by` (the txid that inserted it) and `deleted_by` (empty at first).
- **Delete** sets `deleted_by`. A garbage collector removes the row once no transaction can still see it.
- **Update** is translated into a delete plus a create.
@ Visibility rules
At the start of a transaction, the database lists every transaction **in progress**. Then:

:::steps
@ Ignore in-progress writers
Writes by transactions still in progress when we started are ignored, even if they commit later.
@ Ignore aborted writers
Writes by aborted transactions are ignored.
@ Ignore later transactions
Writes by transactions with a higher txid (they started after us) are ignored, committed or not.
@ See everything else
All other writes are visible.
:::

Put simply, a row version is visible if its creator had committed before we started, and it's either not deleted or its deleter hadn't committed before we started.
@ Indexes
- **Point to every version** and filter out invisible ones. PostgreSQL skips index updates when the new version fits on the same page.
- **Append-only / copy-on-write B-trees** (CouchDB, Datomic, LMDB): modified pages are copied rather than overwritten, along with their parents up to the root. Every write transaction creates a **new root**, and each root is a consistent snapshot. Needs background compaction and garbage collection.
:::

> **Naming:** Snapshot isolation is called **serializable** in Oracle and **repeatable read** in PostgreSQL and MySQL. "Repeatable read" comes from the SQL standard, based on System R's 1975 definition (before snapshot isolation existed), and is ambiguous: nobody really knows what it means. IBM DB2 uses "repeatable read" to mean serializability.

## Preventing lost updates

Read committed and snapshot isolation are about what **readers** see during concurrent writes. **Concurrent writers** have their own problems. The classic is the **lost update**: two transactions do a **read-modify-write cycle** at the same time, and one overwrites the other's change.

```sql Lost update: two clients increment a counter
-- both run concurrently, both read 42
SELECT value FROM counters WHERE key = 'foo';   -- 42
UPDATE counters SET value = 43 WHERE key = 'foo';
-- final value 43, but it should be 44
```

Where it happens:
- incrementing a counter or updating an account balance;
- adding an element to a list inside a JSON document;
- two people editing a wiki page, each saving the **entire** page.

:::tabs
@ Atomic writes
Skip the read-modify-write cycle entirely:

```sql
UPDATE counters SET value = value + 1 WHERE key = 'foo';
```

Concurrency-safe in most relational databases. MongoDB offers atomic updates to parts of a JSON document; Redis offers atomic operations on data structures like priority queues. Usually implemented with an exclusive lock held during the read (**cursor stability**), or by running all atomic operations on one thread.

> **Pitfall:** ORMs make it easy to accidentally write an unsafe read-modify-write cycle instead.
@ Explicit locks
The application locks the rows it's about to update:

```sql
SELECT * FROM figures WHERE name = 'robot' AND game_id = 222 FOR UPDATE;
```

`FOR UPDATE` locks every returned row. Useful when the logic can't be expressed as one query, like a multiplayer game where several players move the same piece: lock, check the game rules in code, then update.

> **Pitfall:** It's easy to forget a lock somewhere and introduce a race.
@ Automatic detection
Let transactions run in parallel. If the transaction manager detects a lost update, it **aborts** one transaction, which retries its read-modify-write cycle.

- Efficient with snapshot isolation: PostgreSQL's repeatable read, Oracle's serializable and SQL Server's snapshot isolation all detect it.
- **MySQL/InnoDB's repeatable read does not.**
- Big plus: no special application code needed.
@ Compare-and-set
For databases without transactions: update only if the value hasn't changed since you read it.

```sql
UPDATE wiki_pages SET content = 'new content'
WHERE id = 1234 AND content = 'old content';
```

If the content changed, nothing happens, so check whether the update took effect and retry if not.

> **Pitfall:** If the database lets the `WHERE` clause read from an old snapshot, this may not prevent lost updates.
@ Replicated databases
With multi-leader or leaderless replication, locks and compare-and-set don't work, because they assume one up-to-date copy.

- Allow conflicting versions (siblings) and merge them in application code or with special data structures.
- **Commutative** operations (increment a counter, add to a set) work well when replicated: Riak 2.0 datatypes.
- **Last write wins** is prone to lost updates, and it's the default in many replicated databases.
:::

## Write skew and phantoms

A subtler race.

> **Picture it:** A hospital requires **at least one doctor on call** per shift. Alice and Bob are both on call and both feel unwell. They each click "go off call" at almost the same moment. Each transaction checks `SELECT COUNT(*) FROM doctors WHERE on_call = true AND shift_id = 1234`, sees **2**, and sets its own row to off call. Under snapshot isolation both checks see 2, both commit, and **nobody is on call**.

> **Key idea:** That's **write skew**. It isn't a dirty write or a lost update, because the two transactions update **different objects** (Alice's row and Bob's row). It generalises lost updates: two transactions read the same objects, then update some of them. If they happen to update the same object, you get a dirty write or a lost update instead.

Your options are limited:

- **Atomic single-object operations** don't help: several objects are involved.
- **Automatic lost-update detection** doesn't help: PostgreSQL repeatable read, MySQL/InnoDB repeatable read, Oracle serializable and SQL Server snapshot isolation all miss write skew. You need **true serializable isolation**.
- **Constraints**: "at least one doctor on call" spans several objects, and most databases can't express it (triggers or materialised views might).
- **Explicit locks**: second best. Lock the rows the decision depends on:

```sql
SELECT * FROM doctors WHERE on_call = true AND shift_id = 1234 FOR UPDATE;
```

More examples:

:::cards 2
@ Meeting rooms
Check for an overlapping booking, then insert one. Two concurrent bookings both see "free".
@ Multiplayer game
Two players move different pieces onto the same square at the same time.
@ Claiming a username
Two users check the same name is free and both create it. (A unique constraint fixes this one.)
@ Double-spending
Two purchases each check the balance and are inserted together, so the balance goes negative.
:::

### Phantoms causing write skew

Every example follows the same pattern:

:::steps
@ Check
A `SELECT` checks whether a requirement holds by searching for rows matching some condition.
@ Decide
Application code decides what to do based on the result.
@ Write
If it proceeds, it makes a write (INSERT, UPDATE or DELETE) and commits.
@ The write changes the premise
Rerunning the `SELECT` after the commit would give a different answer, so another transaction's check is now outdated.
:::

In the doctor example, the rows modified in step 3 were returned in step 1, so `FOR UPDATE` could lock them. But the other examples check for the **absence** of rows (no overlapping booking), and the write **adds** a matching row. If step 1 returns nothing, there's nothing to lock.

> **Key idea:** A write in one transaction that changes the result of a search query in another transaction is a **phantom**. Snapshot isolation prevents phantoms in read-only queries, but in read-write transactions they cause particularly tricky write skew.

**Materialising conflicts**: if there's nothing to lock, create something. For example, a table of every (room, 15-minute slot) for the next six months; a booking locks the slot rows with `SELECT FOR UPDATE`, turning a phantom into a lock conflict on concrete rows.

> **Pitfall:** Materialising conflicts is hard, error-prone and leaks concurrency control into the data model. Treat it as a last resort; serializable isolation is usually much better.

## Serializability

Isolation levels are confusing and inconsistently implemented. It's hard to tell from code whether a level is safe, and there are no good tools to detect race conditions. Researchers' answer has always been: use **serializable isolation**. The result equals running transactions one at a time, so the database prevents **every** race condition. Why isn't everyone using it? Here are the three techniques used today:

:::tabs
@ Actual serial execution
Remove concurrency entirely: run **one transaction at a time, in order, on a single thread**. Only considered feasible since about 2007, thanks to:

- **cheap RAM**: the whole active dataset fits in memory;
- **short OLTP transactions**: only a few reads and writes each. Long analytic queries are read-only and can run on a snapshot outside the serial loop.

Implemented in VoltDB/H-Store, Redis and Datomic. Avoiding lock overhead can make it faster than a concurrent system, but throughput is capped at **one CPU core**.

**Stored procedures.** Interactive multi-statement transactions spend most of their time waiting on the network, and a single thread would sit idle. So the application submits the **whole transaction** in advance as a stored procedure.

- Stored procedures have a bad reputation: each vendor has its own language (PL/SQL, T-SQL, PL/pgSQL), they're hard to debug, version, test and deploy, and a bad one can hurt the whole database.
- Modern systems use general-purpose languages: VoltDB uses Java or Groovy, Datomic Java or Clojure, Redis Lua.
- VoltDB also replicates by running the same **deterministic** procedure on every replica.

**Partitioning.** To use more cores, partition the data so each transaction touches one partition, with one thread per partition.

> **Pitfall:** Cross-partition transactions need coordination and are far slower: VoltDB reports about 1,000 cross-partition writes per second, orders of magnitude below single-partition throughput, and adding machines doesn't help. Key-value data partitions easily; data with many secondary indexes doesn't.

**Use it when:** every transaction is small and fast (one slow transaction stalls all of them); the active dataset fits in memory (with **anti-caching**, a transaction that needs on-disk data is aborted, the data is loaded, and it restarts); write throughput fits one core per partition; and cross-partition transactions are rare.
@ Two-phase locking (2PL)
For about 30 years, the only widely used serializability algorithm. (Not two-phase **commit**, which is completely different.)

Several transactions can **read** the same object, but anyone **writing** it needs exclusive access:

- **A read, B wants to write**: B waits until A commits or aborts.
- **A wrote, B wants to read**: B waits too; reading an old version isn't allowed.

> **Key idea:** In 2PL, **writers block readers and readers block writers**: the exact opposite of snapshot isolation. Used by MySQL (InnoDB) and SQL Server at serializable, and DB2 at repeatable read.

**Implementation**:

- Each object has a lock in **shared** mode (for reading; many holders allowed unless someone holds exclusive) or **exclusive** mode (for writing; no other holders).
- A transaction that reads then writes **upgrades** shared to exclusive.
- Locks are held **until commit or abort**: phase 1 acquires locks while executing, phase 2 releases them all at the end.
- **Deadlocks** are common: A waits for B while B waits for A. The database detects them and aborts one transaction, which the application retries.

**Performance**: significantly worse throughput and response times than weak isolation, mainly from **reduced concurrency**. There's no limit on how long a transaction may wait, so latency at high percentiles is unstable under contention. One slow transaction, or one that locks lots of data, can grind the system to a halt. Retried deadlocked transactions waste work.

**Predicate locks** prevent phantoms by locking every object that **matches a condition**, including ones that **don't exist yet**:

```sql
SELECT * FROM bookings
WHERE room_id = 123 AND end_time > '2018-01-01 12:00' AND start_time < '2018-01-01 13:00';
```

Readers take a shared predicate lock on the condition; any insert, update or delete matching an existing predicate lock must wait. 2PL with predicate locks is fully serializable.

**Index-range locks** (next-key locking): predicate locks are slow to check, so most databases approximate them by locking a **bigger range**: all bookings for room 123 at any time, or all rooms between noon and 1 pm, attached to an index entry such as `room_id`. Less precise, much cheaper. With no suitable index, the database falls back to a shared lock on the **whole table**: slow, but safe.
@ Serializable snapshot isolation (SSI)
Full serializability with only a small penalty over snapshot isolation (Michael Cahill's PhD thesis, 2008). Used in PostgreSQL since 9.1 and in distributed databases like FoundationDB.

:::vs
@ Pessimistic (2PL, serial)
If anything **might** go wrong, wait until it's safe. Serial execution is pessimism taken to the extreme.
@ Optimistic (SSI)
Carry on regardless, and **check at commit time** whether isolation was violated. If it was, abort and retry.
:::

Optimistic control performs badly under **high contention** (many aborts, and retries add load near maximum throughput), but with spare capacity and modest contention it beats pessimism. Commutative atomic operations (concurrent counter increments) reduce contention.

**Detecting outdated premises.** In write skew, a transaction acts on a **premise** (e.g. "two doctors are on call") that may be false by commit time. SSI catches two cases:

- **Stale MVCC reads** (an uncommitted write happened **before** the read): the database tracks when a transaction ignored another transaction's write due to MVCC visibility. At commit, if any ignored write has since committed, **abort**. Why wait until commit? A read-only transaction can't cause write skew, and the other transaction might still abort.
- **Writes after the read**: similar to index-range locks, but **without blocking**. When a transaction writes, it checks the indexes for transactions that recently read that data and flags them, like a **tripwire**. The first to commit wins; the other is aborted because its premise is outdated.

**Performance**: precise tracking means bookkeeping overhead; coarse tracking means extra aborts.

- Versus **2PL**: nobody waits for anyone else's locks, so latency is much more predictable, and read-only queries run lock-free on a snapshot. Great for read-heavy workloads.
- Versus **serial execution**: not limited to one CPU core (FoundationDB spreads conflict detection across machines), and transactions can span partitions while staying serializable.
- Read-write transactions must be **short**, because long ones are more likely to abort. Long read-only transactions are fine.
:::

| Approach | How | Strength | Weakness |
|---|---|---|---|
| Serial execution | one thread, stored procedures, in-memory | no locking overhead, simple | single core per partition; cross-partition is slow; transactions must be short |
| Two-phase locking | shared/exclusive locks held to commit; predicate/index-range locks | the classic, prevents everything | readers and writers block each other; unstable tail latency; deadlocks |
| SSI | snapshot isolation + detect stale reads/conflicting writes at commit | readers never block; predictable latency; scales | aborts under high contention; needs short read-write transactions |

## Recall

:::flash
Q: What does the A in ACID really mean?
A: Abortability: on a fault, every write of the transaction is undone.
Q: Why is C the odd one out in ACID?
A: Consistency means application invariants, which the application must maintain; A, I and D are database properties.
Q: Read committed guarantees?
A: No dirty reads and no dirty writes.
Q: How does read committed avoid dirty reads without read locks?
A: It keeps the old committed value and serves it to readers until the writer commits.
Q: What is read skew?
A: Seeing different parts of the database at different points in time, like Alice's missing $100.
Q: MVCC's guiding principle?
A: Readers never block writers, and writers never block readers.
Q: What is "repeatable read" in PostgreSQL?
A: Snapshot isolation. The name means different things in different databases.
Q: Four fixes for lost updates?
A: Atomic writes, explicit locks (FOR UPDATE), automatic detection, compare-and-set.
Q: Write skew in one sentence?
A: Two transactions read the same data, then update different objects based on a premise the other invalidates.
Q: What is a phantom?
A: A write in one transaction that changes the result of another transaction's search query.
Q: 2PL vs snapshot isolation blocking?
A: 2PL: readers and writers block each other. SI: neither blocks the other.
Q: How does SSI decide what to abort?
A: At commit it checks whether the transaction's reads are now stale (premise outdated); if so, it aborts.
:::

:::quiz
Q: Two on-call doctors each run "if at least 2 doctors are on call, take myself off call" under snapshot isolation, concurrently. What anomaly occurs?
- Dirty read
- Lost update
- [x] Write skew: both see 2, both update their own (different) row, and zero doctors remain on call
- Read skew
> Each transaction's premise (count ≥ 2) is invalidated by the other's write. Snapshot isolation doesn't detect this; serializable isolation (or explicit FOR UPDATE locks) does.
:::

:::quiz
Q: What does "readers never block writers, and writers never block readers" describe?
- Two-phase locking
- [x] Snapshot isolation implemented with MVCC (and SSI, which builds on it)
- Read uncommitted
- Actual serial execution
> MVCC keeps multiple committed versions, so readers see their snapshot while writers create new versions. 2PL is the opposite: readers and writers block each other.
:::

:::quiz
Q: Why must a phantom-preventing lock be a predicate or index-range lock rather than a row lock?
- Row locks are too slow
- [x] The conflicting row doesn't exist yet when the check runs, so there is no row to lock; the lock must cover the search condition
- Row locks cause deadlocks
- Predicate locks are optimistic
> E.g. "no booking overlaps 12:00–13:00 for room 123": the check returns no rows; a later insert must be blocked by a lock on the condition (or an approximation via an index range).
:::
</script>
<script type="text/x-jc" id="m-distributed-trouble" data-part="Part II · Distributed data" data-title="The trouble with distributed systems" data-short="Distributed trouble" data-lede="Chapter 8. Everything that can go wrong once you leave a single machine: partial failures, unreliable networks and timeouts, unreliable clocks, process pauses, and why truth is defined by the majority. Ends with fencing tokens, Byzantine faults and system models.">
:::tldr
- On one machine, things work or crash. In a distributed system, **partial failures** are normal and **nondeterministic**.
- Networks are **asynchronous**: a missing reply could mean a lost request, a slow node, a crash or a lost response. A **timeout** only tells you "no answer yet".
- Network delays are unbounded mainly because of **queueing**. That's a cost trade-off (packet switching vs circuits), not a law of nature.
- **Clocks** drift and jump. Use monotonic clocks for durations, logical clocks for ordering, and confidence intervals (Spanner TrueTime) if you need real time.
- Any process can **pause** for seconds or minutes (GC, VM suspension, swapping). A node can't trust its own sense of time.
- Decisions need a **quorum**, and locks need **fencing tokens**. Assume nodes are honest but unreliable (no Byzantine faults), and reason with **system models**, **safety** and **liveness**.
:::

## Faults and partial failures

:::vs
@ A single computer
Deterministic: the same operation gives the same result. When hardware breaks, the usual result is **total failure** (a kernel panic, a blue screen). It's designed to be fully working or fully broken, which hides the fuzzy physical reality underneath.
@ A distributed system
Some parts break in unpredictable ways while others work fine: **partial failure**. It's **nondeterministic**: an operation across nodes may work one time and fail the next, and you may not even **know** whether it succeeded, because message delays are unpredictable too.
:::

### Cloud computing vs supercomputing

:::vs
@ HPC (supercomputers)
Thousands of CPUs for compute-heavy jobs like weather forecasting. Jobs **checkpoint** state to durable storage; if one node fails, the whole cluster stops and restarts from the last checkpoint. Partial failure is turned into total failure, like a single machine.
@ Cloud computing
Multi-tenant datacenters, commodity machines on IP/Ethernet, elastic resources, metered billing. Internet services must be **online with low latency at all times**: stopping the cluster for repair isn't acceptable.
:::

Why cloud systems must tolerate partial failure:

- **Commodity hardware**: nodes are cheaper machines with higher failure rates.
- **IP and Ethernet networks** in Clos topologies, not specialised supercomputer interconnects.
- **Something is always broken** when you have thousands of nodes.
- **Rolling upgrades and restarts** need the rest of the system to keep serving.
- **Geographic distribution** means talking over the slow, unreliable internet.

> **Key idea:** Build a reliable system from unreliable parts, the way error-correcting codes work over a noisy channel or TCP over unreliable IP. Consider a wide range of faults, even unlikely ones, and deliberately trigger them in testing.

## Unreliable networks

In this book's **shared-nothing** systems, the network is the only way machines talk. The internet and most datacenter networks are **asynchronous packet networks**: a node can send a packet, but the network promises nothing about **when** it arrives, or **whether** it arrives.

Send a request and expect a reply, and any of these can happen:

:::cards 3
@ 1 · Request lost
Someone unplugged a cable.
@ 2 · Request queued
The network or the recipient is overloaded; delivery happens later.
@ 3 · Node crashed
The remote node failed or was powered down.
@ 4 · Node paused
A long GC pause; it will respond later.
@ 5 · Response lost
The request was processed, but a misconfigured switch dropped the reply.
@ 6 · Response delayed
The request was processed, but the reply will arrive late.
:::

Play each scenario and see what the sender actually observes:

:::viz netfault

> **Key idea:** All six look **identical** to the sender: no response yet. The only tool is a **timeout**, and even after it fires you don't know whether the request got through (it may still be sitting in a queue).

### Network faults in practice

Network problems are surprisingly common, even in one company's own datacenter:

- **About 12 network faults a month** in one medium-sized datacenter study: half disconnected a single machine, half a whole rack.
- **Redundancy helps less than you'd hope**: it doesn't protect against **human error** (misconfigured switches), a major cause of outages.
- **Public clouds** such as EC2 have frequent transient network glitches.
- **Sharks** have bitten undersea cables.
- **Asymmetric faults**: a network interface may drop all inbound packets yet send outbound ones fine.
- **Network partitions** (a **netsplit**): one part of the network cut off from another.

> **Pitfall:** If network faults aren't handled and tested, arbitrarily bad things can happen: a cluster can **deadlock** and stay unable to serve requests even after the network recovers, or it could delete data.

> **Tip:** Handling network faults doesn't always mean tolerating them. If your network is usually reliable, showing users an error during outages can be fine. But you must know how your software reacts and make sure it recovers. Deliberately trigger network problems to test it, as **Chaos Monkey** does.

### Detecting faults

Load balancers must stop sending to dead nodes; single-leader systems must promote a follower. Sometimes you get explicit feedback:

- **Port not listening** (the process crashed but the machine is up): the OS refuses or closes TCP connections with RST or FIN. But if it crashed mid-request, you don't know how much was processed.
- **Process died, OS alive**: a script can notify other nodes so one takes over quickly, without waiting for a timeout (HBase does this).
- **Switch management interfaces**: query them to detect link failures at the hardware level (not possible over the internet or in shared datacenters).
- **ICMP Destination Unreachable**: a router may report that an IP address is unreachable, but routers don't have magic failure detection either.

> **Key idea:** You can't rely on that feedback. Even if TCP confirms delivery, the application may crash before handling the request. If you need to know a request succeeded, you need a **positive response from the application itself**. Otherwise: retry a few times, wait for a timeout, and eventually declare the node dead.

### Timeouts and unbounded delays

:::vs
@ Long timeout
Slow to declare a node dead; users wait or see errors in the meantime.
@ Short timeout
Faster detection, but more **false alarms** when a node is merely slow (say, a load spike).
:::

Declaring a live node dead is costly:

- **Duplicate actions**: if it was mid-action (sending an email), its replacement may do it again.
- **Extra load**: its work shifts to other nodes and the network. If the system is already overloaded, premature failovers can trigger a **cascading failure** where nodes declare each other dead until everything stops.

> **Picture it:** Imagine the network guaranteed every packet arrives within **d** (or is lost, never late), and every live node answers within **r**. Then every successful reply comes within **2d + r**, and that would be the perfect timeout. Real systems guarantee **neither**: asynchronous networks have **unbounded delays** and servers can't promise a maximum handling time.

### Where the delay comes from: queueing

:::steps
@ Switch queue
Several nodes send to the same destination, so the switch queues their packets and feeds them onto the link one by one. If the queue fills, packets are **dropped** and must be resent, even though the network is "working".
@ OS queue
At the destination, if every CPU core is busy, the OS queues the request until the application can take it.
@ Hypervisor queue
In virtualised environments, a VM is often paused for tens of milliseconds while another VM uses the core. Incoming data is buffered by the **virtual machine monitor** meanwhile.
@ Sender queue
**TCP flow control** (congestion avoidance, backpressure) limits how fast a node sends, adding queueing before data even enters the network.
@ Retransmission
TCP treats a packet as lost if it isn't acknowledged within a timeout (based on observed round-trip times) and resends it. The application doesn't see the loss, only the **delay**.
:::

> **Note:** **TCP vs UDP.** VoIP and videoconferencing use UDP: no flow control and no retransmission, so less variable delay (switch queues and scheduling still apply). It suits data that's worthless if late; the retry happens at the human layer: "could you repeat that?"

Queueing delays are worst when a system is near capacity. In multi-tenant clouds a **noisy neighbour** using lots of resources makes your delays highly variable.

> **Tip:** Choose timeouts **experimentally**: measure round-trip time distributions over a long period and many machines. Better still, adjust automatically from observed response times and their variability (**jitter**), e.g. a **Phi Accrual failure detector** (Akka, Cassandra). TCP's retransmission timeout works the same way.

### Synchronous vs asynchronous networks

Why can't the network itself be made reliable? Compare the fixed-line **telephone network**:

:::vs
@ Telephone network (circuit switching)
A call reserves a **circuit**: fixed bandwidth along the whole route for the call's duration. ISDN runs 4,000 frames per second, with 16 bits reserved per call in each frame. No queueing, so **bounded delay**: a **synchronous** network.
@ Internet / datacenters (packet switching)
Packets grab whatever bandwidth is available. Optimised for **bursty traffic**: a web page or file transfer has no fixed rate, it should just finish fast. TCP adapts its rate to the available capacity.
:::

Using circuits for bursty transfers would waste capacity: guess too low and the transfer is needlessly slow; guess too high and the circuit can't be set up.

> **Key idea:** Bounded latency is possible with static resource partitioning (dedicated hardware, reserved bandwidth), but utilisation suffers, so it's expensive. Multi-tenancy with dynamic sharing is cheaper but has variable delays. **Variable delay is a cost/benefit trade-off, not a law of nature.** Today's technology gives no delay or reliability guarantees, so timeouts must be found experimentally.

## Unreliable clocks

Applications ask clocks two kinds of questions:

:::vs
@ Durations
- Has this request timed out yet?
- What's the 99th percentile response time?
- How many queries per second in the last 5 minutes?
- How long did the user spend on the site?
@ Points in time
- When was this article published?
- When should the reminder email go out?
- When does this cache entry expire?
- What's the timestamp on this log line?
:::

Time is tricky in distributed systems: messages take an unknown time to arrive, and every machine has **its own clock**, usually a **quartz crystal oscillator** that runs slightly fast or slow. Clocks can be synchronised to a degree, most commonly with the **Network Time Protocol (NTP)**, which adjusts the clock from a group of servers that in turn get time from a more accurate source such as GPS.

### Two kinds of clock

:::vs
@ Time-of-day clock
Wall-clock time: `clock_gettime(CLOCK_REALTIME)`, Java's `System.currentTimeMillis()`. Seconds since the epoch (1 January 1970 UTC), ignoring leap seconds.
- Synced with NTP, so values are (ideally) comparable across machines.
- Can **jump backwards** when NTP force-resets a clock that's too far ahead.
- Often ignores leap seconds; historically coarse (10 ms steps on older Windows).
- ❌ **Unsuitable for measuring elapsed time.**
@ Monotonic clock
`clock_gettime(CLOCK_MONOTONIC)`, Java's `System.nanoTime()`.
- **Always moves forward**; ideal for timeouts and response times.
- The absolute value is **meaningless** (e.g. nanoseconds since boot) and **can't be compared across machines**.
- NTP may **slew** its rate (speed it up or slow it down by up to 0.05%) but never makes it jump.
- Usually microsecond resolution or better.
- ✅ **Use it for durations.**
:::

### Clock synchronisation is worse than you think

:::tabs
@ Hardware
- **Drift**: quartz runs faster or slower depending on temperature. Google assumes **200 ppm** drift: 6 ms if resynced every 30 seconds, **17 seconds** if resynced once a day.
- **Virtual machines**: the hardware clock is virtualised. When a VM is paused so another can use the core, the application sees the clock suddenly **jump forward**.
- **User devices**: you can't trust them at all. Some users deliberately set wrong times, e.g. to get around time limits in games.
@ NTP
- **Forced resets**: if the clock is too far off, NTP may refuse to sync or reset it, so time appears to jump forwards or backwards.
- **Firewalls**: a node accidentally cut off from NTP can go unnoticed for a while.
- **Network delay limits accuracy**: one experiment saw at least 35 ms of error over the internet, with occasional spikes around a second. With large delays the client may give up altogether.
- **Bad servers**: some NTP servers are misconfigured and off by hours. Clients query several and drop outliers, but you're still trusting strangers on the internet.
@ Leap seconds
A minute can be 59 or 61 seconds long, which breaks timing assumptions and has crashed many large systems.

> **Tip:** **Smearing**: NTP servers spread the leap second gradually over a day instead of inserting it all at once.
@ When precision matters
High-accuracy timekeeping is possible if you invest heavily: **MiFID II** requires high-frequency trading funds to sync clocks within **100 µs** of UTC, using GPS receivers, the Precision Time Protocol (PTP) and careful monitoring.
:::

### Relying on synchronised clocks

> **Pitfall:** A faulty clock **fails silently**. A broken CPU or network card is noticed quickly, but a drifting clock lets everything appear to work while data is quietly lost. If your software depends on synchronised clocks, **monitor clock offsets** across all machines and remove any node that drifts too far.

**Timestamps for ordering events** across nodes are especially dangerous. Step through this example:

:::viz clockskew

:::steps
@ Client A writes x = 1 on node 1
Node 1 stamps it **42.004 s**. It's replicated to node 3.
@ Client B increments x on node 3
Now x = 2, stamped **42.003 s**, because node 3's clock is slightly behind.
@ Node 2 receives both
It compares timestamps, decides x = 1 is newer, and **drops x = 2**, even though the clocks were within 3 ms of each other.
:::

That's **last write wins (LWW)**, used by multi-leader and leaderless databases such as Cassandra and Riak. Generating timestamps on clients instead of servers doesn't fix it:

- **Writes vanish**: a node with a lagging clock can't overwrite values written by a node with a fast clock until the skew has passed. Arbitrary amounts of data can be **silently dropped**.
- **Can't tell sequential from concurrent**: LWW can't distinguish writes in quick succession from truly concurrent ones. You need causality tracking such as version vectors.
- **Ties**: two nodes can produce the same millisecond timestamp. A random tiebreaker fixes the tie but can still violate causality.

> **Key idea:** NTP can't be made accurate enough: its accuracy is limited by network round-trip time plus quartz drift, and you'd need a clock much more precise than the network delay you're ordering. Use **logical clocks** instead: counters that capture only **relative order**, not time of day (module 10). Time-of-day and monotonic clocks are **physical clocks**.

**Clock readings have a confidence interval.** A clock may report nanoseconds, but that doesn't mean it's accurate to nanoseconds. Think of a reading as a **range**: "95% confident it's between 10.3 and 10.5 seconds past the minute". The uncertainty comes from your time source: a local GPS or atomic clock has a manufacturer-stated error; a network time server adds expected drift since the last sync, plus the server's own uncertainty, plus the round-trip time. Most APIs (like `clock_gettime()`) hide this. Google's **TrueTime** in **Spanner** exposes it, returning `[earliest, latest]`.

:::deep How Spanner uses TrueTime for global snapshots
Snapshot isolation needs monotonically increasing transaction IDs. On one node, a counter works. Across many partitions, generating a global increasing ID requires coordination, which is hard. Can synchronised clocks provide transaction IDs instead?

- Given intervals A = [A_earliest, A_latest] and B = [B_earliest, B_latest], if they don't overlap (A_latest < B_earliest), then B definitely happened after A. If they overlap, the order is unknown.
- So Spanner **deliberately waits out the confidence interval** before committing a read-write transaction. Any later transaction then has a non-overlapping interval, so timestamps respect causality.
- To keep that wait short, Google puts a **GPS receiver or atomic clock in every datacenter**, keeping clocks within about **7 ms**.
:::

### Process pauses

Here's another dangerous use of clocks. A single-leader partition: how does the leader know it's **still** the leader and may accept writes? It holds a **lease** (a lock with a timeout) from the other nodes, and must renew it before it expires.

```java Unsafe lease check
while (true) {
  request = getIncomingRequest();
  // Ensure that the lease always has at least 10 seconds remaining
  if (lease.expiryTimeMillis - System.currentTimeMillis() < 10000) {
    lease = lease.renew();
  }
  if (lease.isValid()) {
    process(request);
  }
}
```

:::cards 2
@ Bug 1: synchronised clocks
The expiry time was set by **another machine** but is compared with the **local** clock. If the clocks differ by a few seconds, the code misbehaves.
@ Bug 2: pauses
Even with a local monotonic clock, the code assumes almost no time passes between checking and processing. If the thread stops for **15 seconds** right at `lease.isValid()`, the lease has expired and another node is leader, but this thread doesn't notice until the next loop iteration, after it has already done something unsafe.
:::

Is a 15-second pause realistic? Unfortunately, yes:

:::cards 3
@ Garbage collection
"Stop-the-world" GC pauses in the JVM and other runtimes have lasted **minutes**. Even concurrent collectors such as HotSpot's CMS can't run fully alongside application code.
@ VM suspension
A VM can be suspended (memory saved to disk) and resumed at any moment, for any length of time. Used for **live migration** between hosts.
@ Laptops
Closing the lid suspends execution arbitrarily.
@ Context switches
The OS or hypervisor can preempt a thread at any point. In VMs, CPU time spent in other VMs is **steal time**; under heavy load the thread may wait a while to run again.
@ Disk I/O
Synchronous disk access blocks a thread, even unexpectedly: Java's classloader lazily loads class files on first use. Network block storage such as Amazon **EBS** adds network-delay variability. I/O and GC pauses can stack.
@ Paging and signals
Swapping turns a memory access into a disk read (and can lead to **thrashing**), so paging is often disabled on servers. **SIGSTOP** (Ctrl-Z) pauses a Unix process.
:::

> **Key idea:** A node must assume its execution can be **paused for a long time at any point**, even mid-function. Meanwhile the world moves on, and others may declare it dead. When it resumes, it doesn't realise it was asleep until it checks the clock. On one machine we'd use mutexes, semaphores, atomic counters and blocking queues; those don't translate to distributed systems, which have no shared memory, only messages over an unreliable network.

:::deep Real-time systems and taming GC
**Hard real-time** systems (aircraft, rockets, robots, cars) must respond within a deadline or cause serious damage. That needs support at every layer: a real-time OS (RTOS) that guarantees CPU time in fixed intervals, library functions with documented worst-case execution times, restricted or no dynamic memory allocation, and huge amounts of testing. It's very expensive and limits languages and tools, so it isn't economical for most server-side data systems. ("Real-time" on the web just means pushing data to clients without hard deadlines.)

**Limiting the impact of GC:**
- Treat GC pauses as **brief planned outages**: if the runtime warns that a node needs GC soon, stop sending it new requests, let it finish in-flight ones, then collect while idle. Some latency-sensitive trading systems do this.
- Use the GC only for **short-lived objects** (fast to collect) and **restart processes periodically** before they need a full GC of long-lived objects, one node at a time with traffic shifted away, like a rolling upgrade.
:::

## Knowledge, truth and lies

A node can't know anything for sure. It can only guess from the messages it receives, or doesn't. If a remote node doesn't respond, you can't tell a network problem from a node problem.

### The truth is defined by the majority

Two scenarios show why a node can't judge its own health:

:::cards 2
@ Asymmetric fault
A node receives every message, but its outgoing messages are dropped. It works fine, yet nobody hears its replies, so after a timeout the others declare it dead. It has no way to object.
@ Long GC pause
Every thread freezes for a minute. The others time out and declare the node dead. When the pause ends it carries on as if nothing happened, unaware that a minute has passed and that someone else may have taken over its role.
:::

> **Key idea:** A distributed system can't rely on a single node's judgement. Decisions, including "that node is dead", are made by a **quorum**: usually an **absolute majority** of nodes. If a quorum declares a node dead, it **is** dead and must step down, however alive it feels. A majority quorum survives failures (3 nodes tolerate 1, 5 tolerate 2) and is safe, because there can only be **one majority** at a time, so two conflicting decisions can't both win.

### The leader and the lock

Often there must be **only one** of something:

- only one **leader** per partition, to avoid split brain;
- only one transaction or client holding a **lock** on a resource, to prevent corrupting concurrent writes;
- only one user with a given **username**.

> **Pitfall:** A node believing it's "the chosen one" doesn't mean a quorum agrees. It may have been the leader, been declared dead during a network break or GC pause, and been replaced. If it carries on acting as leader, it causes damage.

> **Picture it (a real HBase bug):** A storage service lets only one client write a file at a time, using leases from a lock service. Client 1's lease expires during a long pause. Client 2 gets the lease and starts writing. Client 1 wakes up, still believes its lease is valid, and writes too. The writes clash and **corrupt the file**.

### Fencing tokens

The fix is **fencing**. Every time the lock service grants a lock or lease, it also returns a **fencing token**: a number that **increases with every grant**. Every write to the storage service must include the client's current token.

:::viz fencing

:::steps
@ Client 1 gets token 33
It acquires the lease, then goes into a long pause and the lease expires.
@ Client 2 gets token 34
It acquires the lease and writes to storage, including token 34.
@ Client 1 wakes up
It sends its write with token 33.
@ Storage rejects it
Storage has already processed a write with token 34, so it **rejects** token 33.
:::

- **ZooKeeper as the lock service**: the transaction ID `zxid` or node version `cversion` work as fencing tokens, because both are guaranteed to increase monotonically.
- **The resource must check**: it's not enough for clients to check their own lock status (a paused client can't). The **storage itself** must reject writes with an older token than one it has seen.
- **Workarounds**: for resources that don't support tokens, you can sometimes embed the token, e.g. in a filename.

> **Tip:** Server-side token checks are a good thing anyway: it's unwise for a service to assume clients always behave, since clients are often run by people with very different priorities.

### Byzantine faults

Fencing stops a node acting **inadvertently** in error. A node that deliberately lies could just send a fake token. This book assumes nodes are **unreliable but honest**: they may be slow, silent or out of date, but if they respond, they're telling the truth as they know it.

> **Key idea:** A **Byzantine fault** is a node that "lies": sending arbitrary, corrupted or malicious responses (e.g. claiming to have received a message it never got). Reaching consensus despite traitors is the **Byzantine Generals Problem** (a generalisation of the Two Generals Problem). A system is **Byzantine fault-tolerant** if it works correctly even when some nodes misbehave or attackers interfere with the network.

:::vs
@ Where BFT matters
- **Aerospace**: radiation can corrupt memory or CPU registers, making a node respond unpredictably. A failure could crash an aircraft or hit the ISS.
- **Mutually untrusting organisations**: participants may cheat. Bitcoin and other blockchains let untrusting parties agree on transactions without a central authority.
@ Where it usually doesn't
- **Your own datacenter**: all nodes belong to your organisation, and radiation is low.
- **BFT protocols are complicated** and expensive, so they're impractical for most server-side systems.
- **Web clients**: browsers can be malicious, but the fix is input validation, sanitisation and output escaping with the **server as the authority**, not a BFT protocol.
- **Compromised software**: BFT won't save you if an attacker breaks into one node, because they can probably break into every node running the same software.
:::

**Guard against weak forms of lying** (hardware glitches, bugs, misconfiguration) with cheap, pragmatic measures:

- **Checksums** in application protocols: corrupted packets sometimes slip past TCP/UDP checksums because of hardware, OS, driver or router bugs.
- **Input sanitisation** in public applications: check values are in range, and limit string sizes to prevent denial of service through huge memory allocations.
- **Multiple NTP servers**: query all of them and check that a majority agree, so a misconfigured server is detected as an outlier and ignored.

## System models and reality

Algorithms must not depend too much on specific hardware and software, so we formalise what faults to expect with a **system model**: the assumptions an algorithm may make.

:::vs
@ Timing models
- **Synchronous**: bounded network delay, pauses and clock error (not zero, just a known upper limit). Unrealistic, because unbounded delays happen.
- **Partially synchronous**: behaves synchronously **most of the time**, but occasionally exceeds the bounds by arbitrary amounts. Realistic for many systems.
- **Asynchronous**: no timing assumptions at all, not even a clock (so no timeouts). Very restrictive.
@ Node failure models
- **Crash-stop**: a node fails only by crashing, and never comes back.
- **Crash-recovery**: nodes crash and may restart later. Stable storage (disk) survives crashes; in-memory state is lost.
- **Byzantine**: nodes may do absolutely anything, including deceiving others.
:::

> **Key idea:** For real systems, the most useful combination is **partially synchronous + crash-recovery**.

### Correctness: safety and liveness

An algorithm is correct if it satisfies its **properties** in every situation the system model allows. Example properties for a fencing-token generator:

- **Uniqueness**: no two requests get the same token.
- **Monotonic sequence**: if request x finished before request y started, then token x < token y.
- **Availability**: a node that requests a token and doesn't crash eventually gets one.

:::vs
@ Safety: "nothing bad happens"
Uniqueness and monotonic sequence are safety properties.
- If violated, you can point at the **exact moment** it broke (the request that got a duplicate token).
- The damage **can't be undone**.
- Must hold **always**, even if every node crashes or the whole network fails.
@ Liveness: "something good eventually happens"
Availability is a liveness property. Liveness often includes the word **"eventually"** (eventual consistency is one).
- May not hold right now, but there's always hope it will later (a reply may still arrive).
- Can come with caveats, e.g. only if a majority of nodes are up and the network eventually recovers.
:::

The partially synchronous model requires that the system **eventually** returns to a synchronous state: any network interruption lasts only a finite time.

> **Pitfall:** **Models aren't reality.** Crash-recovery algorithms assume stable storage survives, but disks can be corrupted or wiped, and servers can fail to recognise their drives after a firmware bug. Quorum algorithms assume nodes remember what they claimed to store; a node with amnesia breaks the quorum condition. Theory and empirical testing are equally important, and real code still needs handling for "impossible" cases, even if that just logs loudly and stops so a human operator can clean up.

## Recall

:::flash
Q: Six reasons a request might get no response?
A: Request lost, request queued, node crashed, node paused, response lost, response delayed. They look identical to the sender.
Q: What does a timeout tell you?
A: Only that no reply has arrived yet. The request may or may not have been processed.
Q: Main source of variable network delay?
A: Queueing: in switches, the OS, the hypervisor, TCP flow control, and retransmissions.
Q: Why aren't datacenter networks synchronous like phone lines?
A: Packet switching suits bursty traffic and uses capacity better; bounded delay would cost more.
Q: Which clock for measuring a timeout?
A: The monotonic clock (System.nanoTime()); it never jumps backwards.
Q: Why is LWW with wall-clock timestamps dangerous?
A: A node with a slow clock can have its later writes silently dropped.
Q: How does Spanner order transactions with clocks?
A: TrueTime gives a confidence interval; Spanner waits out the interval before committing so intervals never overlap.
Q: Name four causes of long process pauses.
A: Stop-the-world GC, VM suspension or live migration, context switches/steal time, synchronous disk I/O, paging, SIGSTOP.
Q: Why use majority quorums for decisions?
A: There can only be one majority at a time, so two conflicting decisions can't both win.
Q: What is a fencing token?
A: An increasing number issued with each lock grant; the resource rejects writes with older tokens.
Q: Byzantine fault?
A: A node that sends arbitrary or malicious responses, i.e. lies.
Q: Safety vs liveness?
A: Safety: nothing bad ever happens (permanent once violated). Liveness: something good eventually happens.
:::

:::quiz
Q: A request to a remote node times out. What can the sender conclude?
- The remote node crashed
- The request was lost
- [x] Nothing definite: the request or response may have been lost or delayed, or the node may be slow, paused or crashed, or it may have processed the request
- The network is partitioned
> Timeouts tell you only that you haven't received a response yet. That's why idempotence and fencing matter.
:::

:::quiz
Q: Why should you measure a timeout with `System.nanoTime()` rather than `System.currentTimeMillis()`?
- nanoTime is more precise
- [x] nanoTime is a monotonic clock that never jumps backward; currentTimeMillis is a time-of-day clock that NTP can reset
- currentTimeMillis is synchronised across machines
- nanoTime counts leap seconds
> Monotonic clocks are for durations on one machine; their absolute value is meaningless and can't be compared across machines.
:::

:::quiz
Q: A client holding a lease pauses for a long GC, the lease expires, and another client gets the lease. How do fencing tokens prevent corruption?
- The paused client checks the clock before writing
- [x] Each lease grant comes with an increasing token; the storage service rejects writes carrying a token lower than one it has already seen
- The lock server kills the paused client
- The storage service uses last write wins
> The resource itself must check tokens; relying on the client to know it's no longer the leader fails because it can't detect its own pause.
:::
</script>
